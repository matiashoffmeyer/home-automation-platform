# =============================================================================
# Cover Entity Definitions - IKEA Matter-over-Thread Curtains (5x planlagt)
# =============================================================================
# Thread network via Sonoff ZBDongle-E + OpenThread Border Router (live siden
# 2026-05-05). Curtain motors pares som Matter-over-Thread devices via
# `./scripts/matter_commission.sh` (mobile-then-NUC pattern).
#
# IKEA produkt-options for Matter curtain motors (per 2026-05):
# - PRAKTLYSING (rolldown blackout, Matter-over-Thread) — primary option
# - Eventuelt zigbee FYRTUR som backup hvis Matter ikke tilgaengeligt
# =============================================================================

# =============================================================================
# Planlagte cover entities (TARGET NAMES — bevares ved Matter parring)
# =============================================================================
# Disse entity_id navne refereres allerede i 14 yaml-filer (godmorgen_godnat,
# wakeup_*, somrig_buttons, scenes.yaml, light_groups.yaml, etc.). Bevar
# eksakt navngivning ved parring så automations virker uden ændringer.
#
# Naming convention: cover.gardin_<rum>[_<retning>]
#
# 4 gardiner I ALT — listen er komplet (user-spec 2026-07-28).
#
# --- Soveværelse (1 curtain) ---
#   cover.gardin_sovevaerelse        - blackout. SYD-vendt → kører med i
#                                      sommerforsvarets syd-side. Zigbee (Tuya
#                                      TS0601 på ZHA) = ægte positions-feedback,
#                                      modsat Somfy-RTS-gardinerne nedenfor.
#
# --- Stue (3 curtains, open-plan) — alle Somfy RTS via Broadlink (envejs) ---
#   cover.gardin_stue_syd            - sydvendt vindue (sofa)
#   cover.gardin_stue_vest_1         - vestvendt (sofa-stue, terrasse-side)
#   cover.gardin_spisestue_vest      - vestvendt (spisestue)
#
# --- Børneværelse: INTET gardin (droppet 2026-07-28, user-spec) ---
#   Mørklægning dér = lyset holdes slukket (Dark Mode / godnat / putning).
#
# =============================================================================
# Cover Groups (defineret i packages/light_groups.yaml som group.alle_gardiner)
# =============================================================================
#
# group.alle_gardiner (alle 4)        — bruges af scene_snapshot, sluk_alt
# Stue-only gruppe                    — somrig_stue button targeter alle 3
#
# Sove-gardinet driver godmorgen_*, godnat_*, wakeup_voksne (gradual open/close).
#
# =============================================================================
# Pairing playbook for hver curtain
# =============================================================================
#
# 1. PRE-FLIGHT
#    ./scripts/matter_preflight.sh
#    (Verificer stack + Thread network + IPv6 + mDNS + Matter Server)
#
# 2. COMMISSION (per device, ~3-4 min)
#    ./scripts/matter_commission.sh "<MT:QR-code>" "gardin_sovevaerelse"
#    ./scripts/matter_commission.sh "<MT:QR-code>" "gardin_stue_syd"
#    ./scripts/matter_commission.sh "<MT:QR-code>" "gardin_stue_vest_1"
#    ./scripts/matter_commission.sh "<MT:QR-code>" "gardin_spisestue_vest"
#
#    Scriptet:
#    a) Pusher Thread credentials til Matter Server (de wipes på restart)
#    b) Venter på user starter mobile commission attempt
#    c) Venter på "Can't reach device" failure (forventet)
#    d) Fyrer NUC commission_with_code network_only=True (catcher CM=31 vinduet)
#    e) Auto-renamer device + entities til target prefix
#
# 3. VERIFY
#    curl -H "Authorization: Bearer $HA_TOKEN" \
#         http://homeassistant.local:8123/api/states/cover.gardin_sovevaerelse
#    Bør vise state="open"/"closed" og position attribute.
#
# 4. TEST AUTOMATIONS
#    - somrig_buttons: tryk RODRET top → cover.open_cover
#    - godmorgen_weekend_sovevaerelse_gardin: 09:00 weekend
#    - winter_defense / summer_defense: lux/temp triggered
#
# =============================================================================
# Failure recovery (se docs/matter_pairing_playbook.md for details)
# =============================================================================
# - Stale SRP entries efter failed attempts → ./scripts/matter_clean_srp.sh
# - Mobile completede til Google fabric → factory reset device + retry
# - Thread creds lost på Matter Server restart → automatisk push i commission script
# =============================================================================
