# =============================================================================
# IKEA VALLHORN Wireless Motion Sensors
# =============================================================================
# Single source of truth for Vallhorn devices in the system.
# Values here are extracted from the running HA instance (ZHA integration
# entry 01KN9E1XNA0E19B99YAQ33EE3X).
#
# Naming convention (per move-prep):
#   <rum>_valhorn_<sub_feature>
#
# Each Vallhorn exposes the following entities (prefix = device name):
#   binary_sensor.<rum>_valhorn_occupancy           occupancy
#   binary_sensor.<rum>_valhorn_opening             opening/tamper cluster
#   sensor.<rum>_valhorn_illuminance                lux
#   sensor.<rum>_valhorn_battery                    battery %
#   number.<rum>_valhorn_on_time                    configurable on time (sec)
#   number.<rum>_valhorn_occupied_to_unoccupied_delay
#   number.<rum>_valhorn_unoccupied_to_occupied_delay
#   switch.<rum>_valhorn_on_only_when_dark          PIR fires only when dark
#   update.<rum>_valhorn_firmware                   firmware update entity
#   button.<rum>_valhorn_identify                   identify / blink
# =============================================================================

