# =============================================================================
# Apollo MSR-2 mmWave Sensors (5x) - Zigbee
# =============================================================================
# 4 deployed + 1 unassigned (see lights.yaml for placement options).
#
# Each provides: occupancy, distance (cm), lux, temperature, (humidity on bath).
# Temperature needs calibration offset (-2 to -4°C).
# Cross-room logic uses these as the SINGLE SOURCE OF TRUTH for occupancy.
# =============================================================================

# 1. Stue (covers stue + køkken, open plan) — dual sensors
# binary_sensor.apollo_stue_1_occupancy  (sensor 1)
# binary_sensor.apollo_stue_2_occupancy  (sensor 2)
# sensor.apollo_stue_1_distance / lux / temperature
# sensor.apollo_stue_2_distance / lux / temperature

# 2. Badeværelse
# binary_sensor.apollo_badevaerelse_occupancy
# sensor.apollo_badevaerelse_distance / lux / temperature / humidity

# 3. Soveværelse (adult bedroom)
# binary_sensor.apollo_sovevaerelse_occupancy
# sensor.apollo_sovevaerelse_distance / lux / temperature

# 4. Børneværelse (shared kids' room)
# binary_sensor.apollo_boernevaerelse_occupancy
# sensor.apollo_boernevaerelse_distance / lux / temperature

# 5. UNASSIGNED - to be deployed after initial install

