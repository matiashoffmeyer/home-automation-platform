# =============================================================================
# IKEA Parasoll Door/Window Sensors (3x) - Matter
# =============================================================================
# Roller byttet 2026-06-12 (user-spec):
# binary_sensor.parasoll_hoveddoer     - Hoveddør (ex "Myggbett 3"/standby_2,
#                                        parringskode 2324…). Dormant + åbn
#                                        = hus Active; lukning gør INTET
#                                        (1 person kan blive, flere kan gå ud).
# binary_sensor.parasoll_terrassedoer  - Terrassedør (ex hoveddør-rollen,
#                                        parringskode 0306…). Åben = 100%
#                                        nogen hjemme → vetoer AL auto-Dormant.
# binary_sensor.parasoll_badevaerelse  - Baddør (ex standby_1, monteret
#                                        2026-06-12). Wasp-in-a-box: dør
#                                        lukket + ny bevægelse inde → auto-
#                                        sluk låst til dør åbnes. Se
#                                        packages/badevaerelse_wasp.yaml.

