# =============================================================================
# Light Entity Definitions
# =============================================================================

# --- Lights ---
# light.stue_sofa_lampe        - Innr RB 282 C farve-paere i sofa-lampe ved stue
# light.stue_hjoernelampe      - Innr RB 282 C hjørnehyggelampe (var bad loft-pære indtil 2026-05-31)
# light.stue_plug              - Template-light → switch.stue_plug; non-dimmable hyggelampe ved sofa (on/off only)
# light.koekken_loft           - Kitchen ceiling light (middle third of open room)
# light.spisestue_pendel       - Innr RF 271 T filament (CCT-only). FLYTTET 2026-06-05: nu loftlampe i VOKSENSOVEVÆRELSET (id-navn beholdt, kode repointet)
# light.spisestue_loft         - Innr RB 282 C loft-pære, re-kategoriseret stue→spisestue 2026-06-04 (var light.stue_loft)
# light.sovevaerelse_loft      - Innr RB 282 C — DVALE 2026-06-05 (afløst af pendlen; parkeret reserve, ude af grupper/scener)
# light.boernevaerelse_loft    - Shared kids' bedroom ceiling light
# light.badevaerelse_spot_1..5 - Bathroom ceiling spots (loft-pære flyttet til stue 2026-05-31)
# light.entre_loft             - Entré ceiling light
# light.depot_loft             - Depot / Harry Potter den ceiling light
# light.depot_strip            - Innr FL 230 C RGB+W LED-strip i depot (Harry Potter accent)
# light.terrasse_hue_lily      - Philips Hue Lily spot on terrace (planned)
# light.koekken_lyskaede      - Innr OFL 142 C RGBW LED-strip i KØKKENET (flyttet fra terrasse 2026-06-15, fast Zigbee-strøm)
# light.terrasse_paerelyskaede - Innr OLS 210 outdoor string lights (med synlige paerer) — eneste kæde på terrasse-pluggen nu
#
# --- Switches / smartplugs ---
# switch.terrasse_plug         - Innr OSP 240 outdoor smartplug (with power monitoring)
#   sensor.terrasse_plug_power                       - W (instantaneous load)
#   sensor.terrasse_plug_current                     - A
#   sensor.terrasse_plug_current_voltage             - V (raw Zigbee name)
#   sensor.terrasse_plug_current_summation_delivered - kWh (raw Zigbee name; smartenergy 0x0702)

# --- Switch architecture: ALL WIRELESS (IKEA Somrig) ---
