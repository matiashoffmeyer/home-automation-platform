# =============================================================================
# Device Inventory — single source of truth for paired devices
# =============================================================================
# This file is documentation, not loaded by HA. It tracks every paired device
# with its IEEE/MAC, room assignment, and the entity IDs HA exposes for it.
#
# Used during move-prep (April-May 2026) to build PROD automations that bind
# correctly to actual paired devices on flyttedag (June 1, 2026).
#
# Naming convention:
#   Pattern:     <domain>.<rum>_<devicetype>[_<extra>]_<sub_feature>
#
#   <domain>       = light / switch / sensor / binary_sensor / number /
#                    select / button / update
#   <rum>          = stue / koekken / spisestue / sovevaerelse / boernevaerelse /
#                    badevaerelse / entre / depot / terrasse / altan
#   <devicetype>   = loft / pendel / strip / lampe / apollo / valhorn /
#                    parasoll / plug / styrbar / somrig / ...
#   <extra>        = optional placering hvis flere af samme i samme rum
#                    (fx _sofa, _bord)
#   <sub_feature>  = sub-entity-funktion (_on_level, _power_on_behavior,
#                    _battery, _illuminance, ...)
#
#   Eksempler (main entity + ALLE sub-entities under samme prefix):
#     light.depot_strip
#     number.depot_strip_on_level
#     number.depot_strip_power_on_level
#     select.depot_strip_power_on_behavior
#     update.depot_strip_firmware
#     button.depot_strip_identify
#
#     switch.terrasse_plug
#     sensor.terrasse_plug_power
#     sensor.terrasse_plug_current
#     sensor.terrasse_plug_current_voltage
#     sensor.terrasse_plug_current_summation_delivered
#
#     binary_sensor.sovevaerelse_apollo_occupancy
#     sensor.sovevaerelse_apollo_lux
#     sensor.sovevaerelse_apollo_temperature
#
#   Devices:     same prefix in HA UI — name device "<Rum> <Devicetype> [<Extra>]"
#                fx "Depot Strip", "Sovevaerelse Apollo", "Stue Sofa Lampe"
#
#   Workflow:    naar du omdoeber selve devicet i HA UI, tilbyder HA ofte at
#                omdoebe alle sub-entities til at matche. Spot prompten:
#                "Update N entity IDs to match the device name". Bekraeft saa.
#                Hvis prompten ikke kommer: omdoeb hver entity manuelt.
#
# Workflow when paring a new device:
#   1. Pair via ZHA (Zigbee) or ESPHome (WiFi) integration
#   2. Rename device + entities in HA UI to convention above
#   3. Tell Claude what was paired + entity names + IEEE
#   4. Claude updates this file + relevant PROD automation files on
#      'move-prep' branch (NOT main — main stays untouched until cutover)
# =============================================================================

