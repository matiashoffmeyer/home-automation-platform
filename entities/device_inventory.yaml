      - update.badevaerelse_badring_firmware
      - button.badevaerelse_badring_identify
    notes: >
      VAND-LAEKAGE sensor (ikke fugt-maaler som tidligere antaget).
      Placeres paa gulvet i badet under bruser, vask eller toilet for
      at detektere oversvømmelse. Trigger til notifikation via SMS/
      Companion-app push. Vi tilfoejer security/leak automation senere.

  # --- IKEA Somrig E2213 dual-button shortcut (paret 2026-04-28) ---
  ikea_entre_somrig:
    type: ikea_somrig_e2213
    ieee: "b3:47:dd:fa:8c:68:31:05"
    room: entre
    role: door_house_state_toggle
    paired: 2026-04-28
    renamed: 2026-04-28
    entity_ids:
      - sensor.entre_somrig_battery
      - update.entre_somrig_firmware
      - button.entre_somrig_identify
    notes: >
      DUAL-button shortcut (2 knapper: top + bund), ikke single-button.
      Differentieres via endpoint_id i zha_event:
        endpoint_id: 1  -> top knap
        endpoint_id: 2  -> bund knap
      ZHA quirk fyrer events paa cluster 0xFC80 (64640 decimal).
      Event sekvens pr. gestus afventer fuld capture — vi har set
      'initial_press' med new_position: 0, men ikke om short_release /
      long_press / long_release ogsaa fyrer.

      Verificeret 2026-04-28 — events fyrer som forventet for begge knapper:
        Quick tap: initial_press -> short_release
        Long press: initial_press -> long_press -> long_release

      Bindings i automations/entre_somrig.yaml:
        Top quick tap   -> toggle input_select.house_state (Active<->Dormant)
        Top long press  -> force Dormant (override)
        Bund (begge)    -> UNBOUND (TBD)

      OBS: eksisterende automations/somrig_buttons.yaml er for gardin-
      styring (cover.open/close) — ikke for denne entré Somrig. De er
      separate setups med forskellige IEEE og bindings.

