# Contract for secrets.yaml, which is gitignored and never leaves the host.
#
# Every key that tracked code reads is listed here with a harmless placeholder:
# Home Assistant reads secrets through `!secret <key>`, scripts read them through
# scripts/ha_secrets.py, and scripts/secrets_contract.py (pre-commit + CI) fails
# when either side drifts from this file. CI and the offline validator copy it to
# secrets.yaml, so HA's own config check runs against these placeholders.
#
# Setup on a new host:  cp secrets.example.yaml secrets.yaml  and fill in real values.

# --- Home location ----------------------------------------------------------
# configuration.yaml (homeassistant:) and the Home zone; sky_notify.py reads the
# coordinates for its astronomy. The DMI forecast reads them from zone.home.
home_name: "Example Home"
home_latitude: 52.3731
home_longitude: 4.8903

# --- Home Assistant REST API ------------------------------------------------
# Long-lived access token (HA UI: Profile -> Security). Used by scripts running
# inside HA Core's shell_command, where SUPERVISOR_TOKEN is refused for /core/api.
ha_api_token: "replace-with-a-long-lived-access-token"

# --- Google Sheets: meal planner (scripts/mad_planner.py) --------------------
# Apps Script web app with write access (scripts/mad_sheet_api.gs) ...
mad_sheet_url: "https://script.google.com/macros/s/REPLACE_ME/exec"
mad_sheet_token: "replace-with-the-TOKEN-string-from-mad_sheet_api.gs"
# ... and the sheet itself, for the read-only CSV fallback. A sheet shared
# "anyone with the link" makes its id a read key, so it is a secret too.
mad_sheet_id: "replace-with-a-google-sheet-id"

# --- Google Sheets: plant care (scripts/plant_notify.py) ---------------------
plant_sheet_id: "replace-with-a-google-sheet-id"

# --- Grocery delivery account (scripts/nemlig_api.py) ------------------------
nemlig_user: "user@example.com"
nemlig_password: "replace-me"

# --- Music Assistant (scripts/ma_api.py) ------------------------------------
music_assistant_user: "replace-me"
music_assistant_password: "replace-me"

# --- Gesture camera stream (scripts/hoejttaler_lyttetest.py) -----------------
gestus_kamera_rtsp: "rtsp://user:password@camera.local:554/stream2"

# --- Speaker Volumio login for Bluetooth control (scripts/hoejttaler_bt.py) --
hoejttaler_ssh_password: "replace-me"

# --- Router web API + guest Wi-Fi (scripts/gaeste_wifi.py) -------------------
router_admin_user: "admin"
router_admin_password: "replace-me"
gaeste_wifi_ssid: "Example Guests"
