# =============================================================================
# Cybersikkerhed — bevis-spor for husets adgangsveje (2026-11-14)
# =============================================================================
# User-spec 14/11: en side med logs og tal der kan vise at ingen udefra har
# prøvet eller er kommet ind. Data: packages/cyber_vagt.yaml +
# scripts/cyber_vagt.py (hvert 10. min; hændelser gemt varigt af scriptet).
# En negativ kan ikke bevises absolut — siden viser hvad HVER dør har målt,
# siden hvornår, og hvad der stadig står åbent indefra (Svagheder).
# Kun admin (require_admin i configuration.yaml): siden viser IP-adresser.
# Lovelace mode: yaml — registreret i configuration.yaml (cyber-dash).
# =============================================================================
title: Cybersikkerhed
icon: mdi:shield-lock
views:
  - title: Oversigt
    path: oversigt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Dom
            heading_style: title
          - type: markdown
            content: |
              {% set s = states('sensor.cyber_status') %}
              {% set d = 'sensor.cyber_vagt_dom' %}
              ## {{ {'Ingen tegn': '🟢 Ingen tegn på indbrud eller forsøg', 'Forsøg set': '🟠 Nogen har banket på', 'Alarm': '🔴 Alarm', 'Blind': '⚫ Vagten ser ikke lige nu'}.get(s, '⚫ Henter …') }}
              {% for g in state_attr(d, 'grunde') or [] %}
              - {{ g }}
              {% endfor %}
              {% set k = state_attr(d, 'koert') %}{% set f = state_attr(d, 'maalt_fra') %}
              Sidst tjekket {{ as_timestamp(k) | timestamp_custom('%-d/%-m kl. %H:%M') if k else '–' }} · målt siden {{ as_timestamp(f) | timestamp_custom('%-d/%-m') if f else '–' }}
          - type: tile
            entity: sensor.cyber_forsoeg
            name: Forsøg 7 døgn
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.cyber_svagheder
            name: Åbne svagheder
            grid_options:
              columns: 6
          - type: tile
            entity: input_button.cyber_kvitter
            name: Kvittér hændelser
            grid_options:
              columns: 12
          - type: heading
            heading: Svagheder der står åbne
            heading_style: subtitle
          - type: markdown
            content: |
              {% for x in state_attr('sensor.cyber_log', 'svagheder') or [] %}
              - {{ x }}
              {% else %}
              Ingen målte svagheder.
              {% endfor %}

      - type: grid
        cards:
          - type: heading
            heading: Døre udefra
            heading_style: title
          - type: tile
            entity: sensor.cyber_router
            name: Router udad
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.trail_buddy_offentlig
            name: Trail Buddy åben
            grid_options:
              columns: 6
          - type: markdown
            content: |
              {% set l = 'sensor.cyber_log' %}
              {% set a = state_attr(l, 'router_aabent') or [] %}
              **Router:** {{ 'ÅBENT: ' ~ a | join(', ') if a else 'ingen port-forward, DMZ, UPnP eller fjernadgang' }}{{ '' if state_attr(l, 'router_ok') else ' (routeren svarede ikke sidst)' }}
              **Trail Buddy** er eneste dør mod internettet (kræver turkode).
          - type: tile
            entity: sensor.cyber_trail_buddy_kald
            name: Kald i dag
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.cyber_trail_buddy_afvist
            name: Afvist 7 døgn
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.cyber_trail_buddy_bank
            name: Afbrudte håndtryk 7 døgn
            grid_options:
              columns: 12
          - type: markdown
            content: |
              | Dag | Kald | Afvist | Håndtryk | SSH | SSH nej | HA nej |
              |:--|--:|--:|--:|--:|--:|--:|
              {% for u in state_attr('sensor.cyber_log', 'uge') or [] -%}
              | {{ u.dag[3:] | int }}/{{ u.dag[:2] | int }} | {{ u.tb_ok }} | {{ u.tb_afvist }} | {{ u.tb_bank }} | {{ u.ssh_ok }} | {{ u.ssh_fejl }} | {{ u.ha_fejl }} |
              {% endfor %}
          - type: statistics-graph
            title: Afvist og håndtryk pr. dag
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types: [max]
            entities:
              - entity: sensor.cyber_trail_buddy_afvist
                name: Afvist (7 døgn)
              - entity: sensor.cyber_forsoeg
                name: Forsøg (7 døgn)

      - type: grid
        cards:
          - type: heading
            heading: Logins
            heading_style: title
          - type: tile
            entity: sensor.cyber_ha_afvist
            name: HA afvist 7 døgn
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.cyber_fremmede_logins
            name: Fremmede logins
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.cyber_ssh_afvist
            name: SSH afvist 7 døgn
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.cyber_ssh_logins
            name: SSH logins 7 døgn
            grid_options:
              columns: 6
          - type: markdown
            content: |
              **Aktive logins på Home Assistant**
              | Hvem | Klient | Sidst | Fra |
              |:--|:--|:--|:--|
              {% for t in state_attr('sensor.cyber_log', 'tokens') or [] -%}
              | {{ t.hvem.split(' ')[0] }} | {{ t.klient }} | {{ t.sidst }} | {{ t.fra }} |
              {% endfor %}
              **SSH kommer fra:** {{ (state_attr('sensor.cyber_log', 'ssh_kilder') or ['ingen']) | join(', ') }}

      - type: grid
        cards:
          - type: heading
            heading: NUC og lokalnet
            heading_style: title
          - type: tile
            entity: sensor.cyber_ukendte_porte
            name: Ukendte porte
            grid_options:
              columns: 6
          - type: tile
            entity: input_text.wifi_vagt_status
            name: Wifi-enheder
            grid_options:
              columns: 6
          - type: markdown
            content: |
              {% set l = 'sensor.cyber_log' %}
              {% set b = state_attr(l, 'backup') or {} %}{% set c = state_attr(l, 'core') or {} %}
              **Lytter på:** {{ (state_attr(l, 'porte') or []) | join(', ') }} (+{{ state_attr(l, 'porte_efemere') }} skiftende)
              {% if state_attr(l, 'porte_ukendte') %}**Ukendte:** {{ state_attr(l, 'porte_ukendte') | join(', ') }}{% endif %}
              **Add-ons med port udad:** {% for k, v in (state_attr(l, 'addon_porte') or {}).items() %}{{ k.split('_')[-1] }} {{ v | join('/') }}{{ ', ' if not loop.last }}{% endfor %}
              **Backup:** nyeste {{ (b.nyeste or '–') | replace('T', ' kl. ') }}{{ ', krypteret' if b.nyeste_krypteret else ', IKKE krypteret' }} · {{ b.ukrypteret }} af {{ b.antal }} ukrypteret
              **Home Assistant:** {{ c.version }}{{ ' — opdatering venter' if c.opdatering else ' — nyeste' }}
          - type: tile
            entity: input_button.cyber_godkend_porte
            name: Godkend nuværende porte
            grid_options:
              columns: 12

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Hændelseslog
            heading_style: title
          - type: markdown
            content: |
              {% set ik = {'alarm': '🔴', 'forsoeg': '🟠', 'info': '⚪'} %}
              {% for h in state_attr('sensor.cyber_log', 'log') or [] -%}
              {{ ik.get(h.niveau, '⚪') }} **{{ as_timestamp(h.t) | timestamp_custom('%-d/%-m %H:%M') }}** {{ h.tekst }}
              {% else %}
              Ingen hændelser endnu.
              {% endfor %}
