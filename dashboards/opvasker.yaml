# =============================================================================
# Opvasker — kontrolpanel for Miele-opvaskeren (2026-11-21)
# =============================================================================
# User-spec 21/11: "lav en opvaskemaskine side i ha med alle kontroller og
# muligheder". Kontrolpanel i Støvsug/Lys-sidens stil: overskrifter uden emoji
# med `icon:`, max_columns 2, ingen forklarings-markdown (forklaringer =
# kommentarer). Entities: core-integrationen `miele` (koekken_opvasker_*,
# registry-omdøbt fra dishwasher_*). Program-knapperne kalder
# script.opvasker_start_program (packages/opvasker.yaml), som slår maskinens
# egne program-ID'er op live — ID'erne er model-afhængige.
#
# Hvad API'et IKKE kan: se sæbeskuffen, stille uret, Mieles egen udskudt start,
# vælge tilvalg (ekstra tørring o.l.) — kun programvalg, start/pause/stop og
# tænd. Uret: maskinen henter selv tiden via Miele@home; HA pusher hvis den er
# offline på skiftedagen (packages/opvasker.yaml, opvasker_ur_tidsskifte).
# Fjernstart kræver Mobile Start trykket på maskinen (Miele-sikkerhedskrav,
# ingen API-action) — og lågen slår den fra igen (målt 21/11).
# Planlagt start: automation opvasker_planlagt_start.
#
# Lovelace mode: yaml — registreret i configuration.yaml (opvasker-dash).
# =============================================================================
title: Opvasker
icon: mdi:dishwasher
views:
  - title: Opvasker
    path: opvasker
    icon: mdi:dishwasher
    type: sections
    max_columns: 2
    sections:
      # =====================================================================
      # STATUS
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Opvasker
            icon: mdi:dishwasher
            heading_style: title
          - type: tile
            entity: sensor.koekken_opvasker
            name: Status
          - type: tile
            entity: sensor.koekken_opvasker_program
            name: Program
          - type: tile
            entity: sensor.koekken_opvasker_program_phase
            name: Fase
          - type: tile
            entity: sensor.koekken_opvasker_finish
            name: Færdig
          - type: tile
            entity: sensor.koekken_opvasker_remaining_time
            name: Tid tilbage
          - type: tile
            entity: binary_sensor.koekken_opvasker_door
            name: Låge

      # =====================================================================
      # START ET PROGRAM — script.opvasker_start_program(program: <nøgle>)
      # Nøglerne er HA's DishWasherProgramId-navne; et program maskinen ikke
      # har, giver en besked i HA i stedet for en fejl.
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Start et program
            icon: mdi:play-circle-outline
            heading_style: title
          - type: markdown
            content: Luk lågen, og tryk Mobile Start på maskinen til sidst.
          - type: tile
            entity: script.opvasker_start_program
            name: Auto
            icon: mdi:auto-mode
            vertical: true
            hide_state: true
            tap_action: &start
              action: perform-action
              perform_action: script.opvasker_start_program
              data:
                program: automatic
            icon_tap_action: *start
            grid_options:
              columns: 4
          - type: tile
            entity: script.opvasker_start_program
            name: ECO
            icon: mdi:leaf
            vertical: true
            hide_state: true
            tap_action: &eco
              action: perform-action
              perform_action: script.opvasker_start_program
              data:
                program: eco
            icon_tap_action: *eco
            grid_options:
              columns: 4
          - type: tile
            entity: script.opvasker_start_program
            name: Hurtig
            icon: mdi:clock-fast
            vertical: true
            hide_state: true
            tap_action: &quick
              action: perform-action
              perform_action: script.opvasker_start_program
              data:
                program: quick_power_wash
            icon_tap_action: *quick
            grid_options:
              columns: 4
          - type: tile
            entity: script.opvasker_start_program
            name: Intensiv
            icon: mdi:pot-steam-outline
            vertical: true
            hide_state: true
            tap_action: &intensiv
              action: perform-action
              perform_action: script.opvasker_start_program
              data:
                program: intensive
            icon_tap_action: *intensiv
            grid_options:
              columns: 4
          - type: tile
            entity: script.opvasker_start_program
            name: Skånsom
            icon: mdi:glass-wine
            vertical: true
            hide_state: true
            tap_action: &skaan
              action: perform-action
              perform_action: script.opvasker_start_program
              data:
                program: gentle
            icon_tap_action: *skaan
            grid_options:
              columns: 4
          - type: tile
            entity: script.opvasker_start_program
            name: Ekstra stille
            icon: mdi:volume-off
            vertical: true
            hide_state: true
            tap_action: &stille
              action: perform-action
              perform_action: script.opvasker_start_program
              data:
                program: extra_quiet
            icon_tap_action: *stille
            grid_options:
              columns: 4
          - type: tile
            entity: script.opvasker_start_program
            name: Hygiejne
            icon: mdi:shield-check-outline
            vertical: true
            hide_state: true
            tap_action: &hygiejne
              action: perform-action
              perform_action: script.opvasker_start_program
              data:
                program: hygiene
            icon_tap_action: *hygiejne
            grid_options:
              columns: 4
          - type: tile
            entity: script.opvasker_start_program
            name: Forskyl
            icon: mdi:water-outline
            vertical: true
            hide_state: true
            tap_action: &forskyl
              action: perform-action
              perform_action: script.opvasker_start_program
              data:
                program: pre_wash
            icon_tap_action: *forskyl
            grid_options:
              columns: 4

      # =====================================================================
      # PLANLAGT START — automation opvasker_planlagt_start (packages/
      # opvasker.yaml). Ét skud; Mobile Start skal være trykket på en tændt
      # maskine. Push med resultatet, og hvis Mobile Start slår fra imens.
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Planlagt start
            icon: mdi:calendar-clock
            heading_style: title
          - type: markdown
            content: >-
              {% set kl = states('input_datetime.opvasker_plan_tid')[:5] %}
              {% if is_state('input_boolean.opvasker_plan_aktiv', 'on') %}
              {% if is_state('binary_sensor.koekken_opvasker_mobile_start', 'on') %}Starter kl. {{ kl }} med {{ states('input_select.opvasker_plan_program') }}.
              {% else %}⚠️ Luk lågen og tryk Mobile Start — ellers starter den ikke kl. {{ kl }}.{% endif %}
              {% else %}Vælg program og tid, og slå Planlagt til. Luk lågen og tryk Mobile Start til sidst.{% endif %}
          - type: tile
            entity: input_select.opvasker_plan_program
            name: Program
            features:
              - type: select-options
            grid_options:
              columns: 12
          - type: tile
            entity: input_datetime.opvasker_plan_tid
            name: Start kl.
          - type: tile
            entity: input_boolean.opvasker_plan_aktiv
            name: Planlagt

      # =====================================================================
      # BETJENING — Mieles egne knapper; API'et slår dem til/fra efter
      # maskinens tilstand (unavailable = ikke mulig lige nu).
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Betjening
            icon: mdi:gesture-tap-button
            heading_style: title
          - type: tile
            entity: button.koekken_opvasker_start
            name: Start
            icon: mdi:play
            vertical: true
            hide_state: true
            tap_action: &tryk_start
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.koekken_opvasker_start
            icon_tap_action: *tryk_start
            grid_options:
              columns: 4
          - type: tile
            entity: button.koekken_opvasker_pause
            name: Pause
            icon: mdi:pause
            vertical: true
            hide_state: true
            tap_action: &tryk_pause
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.koekken_opvasker_pause
            icon_tap_action: *tryk_pause
            grid_options:
              columns: 4
          - type: tile
            entity: button.koekken_opvasker_stop
            name: Stop
            icon: mdi:stop
            vertical: true
            hide_state: true
            tap_action: &tryk_stop
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.koekken_opvasker_stop
            icon_tap_action: *tryk_stop
            grid_options:
              columns: 4
          - type: tile
            entity: switch.koekken_opvasker_power
            name: Tænd/sluk

      # =====================================================================
      # NIVEAUER
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Niveauer
            icon: mdi:gauge
            heading_style: title
          - type: tile
            entity: sensor.koekken_opvasker_salt_level
            name: Salt
          - type: tile
            entity: sensor.koekken_opvasker_rinse_aid_level
            name: Afspændingsmiddel

      # =====================================================================
      # DETALJER — resten af hvad Miele-API'et melder
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Detaljer
            icon: mdi:format-list-bulleted
            heading_style: title
          - type: entities
            entities:
              - entity: sensor.koekken_opvasker_program_type
                name: Programtype
              - entity: sensor.koekken_opvasker_elapsed_time
                name: Kørt
              - entity: sensor.koekken_opvasker_start_in
                name: Starter om
              - entity: sensor.koekken_opvasker_start
                name: Starttid
              - entity: sensor.koekken_opvasker_energy_consumption
                name: Strøm denne vask
              - entity: sensor.koekken_opvasker_energy_forecast
                name: Strøm-prognose
              - entity: sensor.koekken_opvasker_water_consumption
                name: Vand denne vask
              - entity: sensor.koekken_opvasker_water_forecast
                name: Vand-prognose
              - entity: binary_sensor.koekken_opvasker_problem
                name: Fejl
              - entity: binary_sensor.koekken_opvasker_notification_active
                name: Besked på maskinen
              - entity: binary_sensor.koekken_opvasker_mobile_start
                name: Mobile Start
              - entity: binary_sensor.koekken_opvasker_remote_control
                name: Fjernstyring
              - entity: binary_sensor.koekken_opvasker_smart_grid
                name: Smart grid
