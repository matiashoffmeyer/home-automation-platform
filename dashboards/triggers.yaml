                Luksus-lys) sætter **alle ni rum** Manual — også når du starter
                dem via *Sluk alt* / en scene med fingeren. Automatik og
                knap-varsler tæller ikke med (de har ingen bruger-ID).
                **Terrassen er bevidst udenfor** (plug-styringen ejer det flow).
                *NB: denne beskyttelse var i praksis slået fra 11. juni – 1. aug.
