              **{{ 'ja, ' ~ states('input_datetime.badevaerelse_sluk_alt_udskudt')[11:16] if states('input_datetime.badevaerelse_sluk_alt_udskudt')[11:] not in ['00:00:00',''] else 'nej' }}**.

              🚪 **Døren lukkes = wasp armeret, ét besøg om dagen (2026-09-01).**
              Wasp krævede hidtil en **ny** bevægelse bag den lukkede dør. Går man
              direkte i bruseren bag glasset, kommer den bevægelse aldrig, wasp
              armerer ikke, og lyset dør midt i badet (målt 1/9: PIR'erne tavse
