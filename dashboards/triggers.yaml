              slideren styrer kun Zigbee-kaskaden. I Scene: Hus Party står den
              på grøn (hue 120).

              ⚠️ Den gamle **spøgelses-suppressor** er fjernet sammen med
              TRADFRI-pæren: på Matter er `unavailable → on` et gen-join-ekko, ikke
              en hændelse, og filteret ville have slukket fanfaren. Væg-cyklus-
              detektoren kræver nu ≥20 s `unavailable` før den tæller som manuel.

