            content: |
              **Loft** — styret KUN af **spisebords-Apolloen** (ikke sofa/køkken):

              🟢 **TÆNDER:** *Spisestue tænd* (spisebords-Apollo ser bevægelse) ·
              lys-fald (*tænd ved LUX-fald*; 🆕 09-27: om aftenen fremskrives
              dagslys-samplet ad solhøjden, så køkkenets lys ikke fryser gaten —
              kilde nu **{{ state_attr('sensor.spisestue_dagslys_lx','kilde') }}**) · **☁️ mørk indedag** (*Spisestue tænd
              på mørk indedag*, 2026-08-30 — den ENESTE dagtime-tændevej i
              open-plannet: alle de øvrige kræver at solen er under aften-grænsen.
              Måler køkkenets INDRE dagslys, ikke spisestue-Apolloen, som sidder
              ved vinduet og er open-plannets lyseste punkt; spisestuen bruges kun
              som veto over 400 lx. Kræver besat spisebords-zone + 10 min uafbrudt
              mørke) · **🍽️ måltids-spiselys** (spise-fasen
              i måltids-detektionen — varm hvid, lux-skaleret) · hjemkomst
              (*Velkomstlys stue+køkken* — hoveddør åbner/telefon hjem + open-plan
              tomt, lux-gated; **ikke** ved cinema/cirkus, Sleep Over eller stue i
              Manual). **2026-09-26: tænder også køkken-lyskæden** direkte ved døren
              (hvidt via tænd-kurven), undtagen under godnat.
              Velkomstens egen lux-grænse er **klampet** til dagslys-sluk-tærsklen
              nedenfor (2026-08-19), så den aldrig tænder et lys som
              dagslys-reglen slukker igen 5 min senere.
              **03-09 re-arm:** *Stue/spisestue re-arm efter dagslys-sluk* tænder
              loftet igen hvis dagslys-sluk slukkede det mens zonen stadig er
              besat, og lux derefter falder under tænd-gaten. Den kvitterer til
              *Spisestue tænd* i stedet for at kopiere dens logik, så alle dens
              egne spærrer (Manual, godnat, biograf, sol-gate, sleepover) gælder
              uændret. Uden den findes der ingen ny presence-flanke, fordi
              `spisestue_apollo_occupancy_filtered` LATCHER.
              **🏃 Hurtig-vækning fra børneværelset (2026-09-17):** har
              børneværelsets radar set bevægelse inden for
              {{ states('input_number.openplan_putning_vindue_sekunder')|int(180) }} s,
              og kommer der så bevægelse på spisebords-Apolloen, springes
              gust-debouncen over: loftet tænder straks i stedet for efter 6-20 s.
              Den gen-trigger *Spisestue tænd* (+ sofa og køkken-lyskæden), så
              alle dens spærrer gælder uændret — genvejen flytter kun
              TIDSPUNKTET, aldrig beslutningen. Kun Normal + Home Vacation.
              **🌅 Morgen-velkomst fra entréen (2026-10-07):** se Køkken —
              loftet rampes da i lyskædens langsomme tempo.
              **👧 Børne-morgen (2026-10-11):** kl. 04-12 efter en nat med børn
              tænder loftet KUN på spisebords-Apolloen — nattur, entré-velkomst
              og hjemkomst springer loftet over (kæden tænder stadig) — nu
              {{ '**aktiv**' if (now().hour >= 4 and now().hour < 12 and is_state('input_boolean.boern_sov_her_i_nat','on')) else 'ikke aktiv' }}.

              🔴 **SLUKKER:** spisebords-zone tom ~20 min (*Spisestue gradvis sluk*
              — **udsat mens måltids-spiselyset er aktivt**, og **spærret
              {{ states('input_number.manuel_lys_hold_timer')|float(3)|round(1) }} t efter en manuel tænding**
              fra Styrbar eller app, 2026-08-19; **holdt mens køkkenet er i
              brug**) · **🍽️ måltid: sluk når
              hele open-plan-området er tomt** · dagslys-stigning (*Stue sluk ved
              LUX-stigning* — presence-uafhængig og **ikke** omfattet af
              manuel-holdet ovenfor: dagslys er en anden begrundelse end
              "rummet er tomt". Tærskel = min(slider, tænd-gate × hysterese),
              nu **{{ states('sensor.stue_dagslys_sluk_effektiv')|float(0)|round(0) }} lx**;
              sliders på 💡 Lys → Stue).

              🎨 **FARVE/VARME:** adaptiv døgn-CCT · scener · vejr-varsler · Styrbar
              L/R · **🍽️ måltids-spiselys** (kelvin-slider, 🍽️ Måltid-fanen).

              🌤️ **Terrasse-dæmp (2026-07-15-mekanik):** åben altandør + ALLE
              inde-zoner (inkl. køkken) tomme **2 min** → loftet dæmpes til
              5–25 % (lux-afhængigt). Gendannes ved presence inde ELLER når
              døren lukkes — kun hvis dæmpningen faktisk skete (episode-flag
              `terrasse_dim_indoor_active`; før pulsede radar-flaps lyset
              5 %↔60-90 %).

              ⚡ **Hvor hurtigt tænder den? (2026-08-26)** Spisestuen var husets
              eneste rum uden hurtig-vej — målt 7 døgn ventede **99 %** af
              ankomsterne over 10 sek (median 20,0 s) mod stue 2,0 s og køkken
              1,0 s. Debouncen er nu kontekst-afhængig: har **stue, køkken eller
              entré** set nogen inden for
              {{ states('input_number.spisestue_nabo_varm_minutter')|float(5)|round(0) }} min
              ({{ 'VARM ✓ nu' if is_state('binary_sensor.spisestue_nabo_varm','on') else 'kold ✗ nu' }}),
              tænder den efter
              **{{ states('input_number.spisestue_debounce_varm_sekunder')|float(6)|round(0) }} s**
              i stedet for
              **{{ states('input_number.spisestue_occupancy_debounce_seconds')|float(20)|round(0) }} s**.
              6 s er ét radar-timeout (5,0 s) + 1: 496 af 897 nabo-varme
              radar-udslag varede præcis 5 sek = maskin-blip, og de dør stadig.
              Er huset koldt, ændres intet — dér lever det blæsende gardin.
              Sliders på ⚙️ Indstillinger → 👻 Spøgelses-filtre.

              🔎 **Tal (live):** presence `spisestue_apollo_occupancy_filtered` ·
              lux nu **{{ states('sensor.spisestue_lux_reel')|float(0)|round(0) }}**
              (spisebords-Apollo, fallback open-plan) vs direkte tærskel
              **{{ states('input_number.spisestue_lux_threshold')|float(150)|round(0) }} lx**
              (rå — IKKE dag/global-skaleret; 🍽️ Måltid- & 📟 Sensorer&lux-fanen) ·
              ingen sol-gate
              · tænder kun hvis loftet er OFF · **sluk:** spisebords-zone tom **20 min**.

      # ===================================================================
      # SOVEVÆRELSE
      # ===================================================================
      - type: grid
        cards:
          - type: heading
            heading: Soveværelse
            heading_style: title
            icon: mdi:bed
          - type: markdown
            content: |
              **Loft** (`light.spisestue_pendel` = soveloft, CCT-hvid):

              🟢 **TÆNDER:** sove-Apollo presence (*Soveværelse tænd*, 06→aften-
              grænsen på START-styrke; i AirBnB kun 12–22) · **sengelys**
              (aften-grænsen→24 på sengelys-styrke — ejer aftenen; grænsen nu
              **{{ states('input_datetime.sove_aften_graense')[:5] }}**, slider)
              · lys-fald · **gang-early-detect** (entré-valhorn ser dig nærme =
              svagt varmt pre-lys; løftes til START før grænsen / sengelys-niveau
              efter, når Apollo bekræfter) · Sove-knap kort-op (dag=godmorgen,
              fader op over {{ states('input_number.sove_godmorgen_fade_sekunder')|int(10) }} s;
              aften 18–04=hygge-toggle på egen slider) · Sove-RODRET kort-op
              (lux-tilpasset) / lang-op (100 %) · vækning voksne (alarm-driven; melder
              INGEN telefon en alarm på en hverdag, bruges **reserve-alarmen**
              05:55 — ny 2026-08-18, slider på Indstillinger).

              🔴 **SLUKKER:** *gradvis sluk* · *hurtig sluk når tomt + dagslys* ·
              early-detect hurtig-sluk (gik ikke ind) · **hygge-fade** (ligger
              stille → dæmper til cozy) · godnat · sluk/dim 10 min efter vækning ·
              **🎬 Dark Mode** (mørklægning slukker + blokerer AUTO-tænd
              sålænge den er on; **manuel tænd — app-tile/Styrbar — vinder**).

              🎨 **FARVE/VARME:** varm default (~2200 K) · **Styrbar Sove L/R** =
              varme-loop (klik/hold) · sengelys-ved-sengetid · settle-hygge-fade
              (~2000 K).

              **Pærelyskæde** (`light.sove_lyskaede`, Thread-plug, kun tænd/sluk):

              🟢 **TÆNDER:** loftet lyser på mindst
              **{{ states('input_number.sove_lyskaede_min_loft_pct')|int(60) }} %**
              og op-fadet er færdigt (2026-10-04 — kæden er en plug og springer
              til fuld) + **{{ states('input_number.sove_lyskaede_presence_minutter')|float(3) }} min**
              presence siden loftet tændte · **aften-genvej (2026-09-23):** efter
              solnedgang ved bevægelse i rummet (eller når pre-lyset løftes)
              · Styrbar sove OP (**mørkt rum: første klik = KUN kæden**, næste
              klik/langt OP tager loftet med) · **godmorgen-knap (kort op): når
              loft-fadet er færdigt** · vækning fase 2.

              🔴 **SLUKKER:** med loftet — **men kun når loftet slukkes
              automatisk**; slukker du loftet i appen, bliver kæden · Dark Mode /
              Pre-Dark / projektor · godnat · Styrbar sove NED **eller app-sluk**
              (bliver slukket til loftet har været slukket).

              ✋ **App-valg (2026-09-23):** tænder/slukker du kæden i appen, går
              soveværelset i Manual → presence tænder ikke loftet oven i dit valg.

              🔒 **Nat-guard:** refleks-lås mod auto-fuldt-lys om natten (blokerer,
              tænder ikke). **Undtaget i AirBnB** (2026-08-16): dér sættes godnat
              på klokken alene, og gæstens vægkontakt-tænd ligner "auto" for
              vagten — den ville snappe gæstens eget lys slukket efter 0,5 s.

              🔐 **Aften-lås (2026-08-26; udvidet 2026-10-04, user-spec):** slukkes
              lyset efter **{{ states('input_datetime.sove_manual_off_lock_start')[:5] }}**
              (slider) — **af dig ELLER en automatik** (Dark Mode, presence-sluk) —
              eller starter filmmørke i soveværelset, blokeres **alle auto-tænd-veje**
              — presence, lux, early-detect, hygge-fade, **sengelys** og
              strøm-wake — resten af natten. Undtaget: early-detect's hurtig-sluk
              (pre-lys for én der aldrig gik ind). **Mørket bliver selv til godnat**
              (auto-godnat's mørke-vej). **Ud:** tænd manuelt igen (rydder låsen +
              sætter rummet på Auto efter 2 s; Somrig-aftenhygge holdes), eller —
              hvis det var watchdog/gradvis sluk i et tomt rum — når dvale-vidnet
              bekræfter at ingen sover derinde (2026-10-23); ellers 05:00-backstop. Ryddes ved AirBnB ind-/udtjekning. Ikke Manual-mode:
              den ville drifte tilbage til Auto efter 20 min "tomt", og en sovende
              ligner tomt for radaren.

              🔌 **Vægkontakten virker igen** (2026-08-16): pærens
              `power_on_behavior` stod som husets eneste rum-lys på **Off**, så
              kontakten på væggen ikke kunne tænde lyset (14 dages historik: 0
              `unavailable→on`). Nu **On** ved sidste niveau. Bor i pærens NVRAM
              → sæt den igen efter re-pair. NB i Normal-mode under godnat
              snapper nat-guarden stadig et strøm-wake slukket (bevidst, user-spec
              2026-06-22 mod mesh-flicker) — brug knapperne dér.

              🛏️ **Putning i voksen-værelset:** når `putning_sove_active` er ON
              (barn puttes/sover inde hos jer) slukkes sove-lys + gardin lukkes,
              og ALT auto-tænd i sove blokeres (presence, lux, early-detect,
              sengelys) mens resten af huset kører normalt. Tændes KUN via
              tilen — godnat-knappen i voksenværelset er altid fuld godnat.
              Cleares ved voksen-godnat / 06:00.
              Aktiv nu: **{{ 'JA' if is_state('input_boolean.putning_sove_active','on') else 'nej' }}**.
              **Manuel virker altid** (Styrbar/RODRET).

              😴 **Sove-snooze ("sov videre", 2026-07-29):** et **kort NED-tryk
              på sove-Somrig'en mellem 04 og 12** er ikke hus-godnat men en
              snooze på **{{ states('input_number.sove_snooze_timer')|float(4)|round(1) }} timer**
              (slider): soveværelset mørklægges HELT (loft + Apollo RGB +
              spisestue-pendel slukkes, gardinet lukkes) og ALLE auto-tænd-kilder
              blokeres (presence, lux, early-detect, vækning/alarm-ramp,
              godmorgen-auto, auto-gardin) + en reaktiv suppressor slukker igen
              hvis en pære alligevel auto-tænder. **Ryddes af et OP-tryk**
              (godmorgen, kort eller langt) — ellers af timeren. **LANGT NED er
              altid fuld hus-godnat**, også om morgenen (04–12). **Manuel virker altid**
              (app/Styrbar). Afløste det gamle faste morgen-vindue, der gættede
              på hvem der lå i sengen og spærrede alarm-vækningen. Aktiv nu:
              **{{ 'JA' if is_state('binary_sensor.sovevaerelse_morgen_beskyttelse_aktiv','on') else 'nej' }}**
              (kill-switch: {{ 'ON' if is_state('input_boolean.sovevaerelse_morgen_beskyttelse_enabled','on') else 'OFF' }}{% if is_state('binary_sensor.sovevaerelse_morgen_beskyttelse_aktiv','on') %} ·
              {{ state_attr('binary_sensor.sovevaerelse_morgen_beskyttelse_aktiv','minutter_tilbage') }} min tilbage{% endif %}).

              😴 **KORT snooze uden blink (2026-08-19):** NED på **tre knapper** —
              Styrbar sove-lys · sove-gardin RODRET · Dark Mode-RODRET, kort tryk
              eller hold — giver
              **{{ states('input_number.sove_snooze_knap_minutter')|float(30)|round(0) }} min**
              (egen slider) i vinduet 03–11, når godnat kører eller en alarm er
              nært forestående. **Slukker sove-lyset og standser vække-rampen —
              men rører IKKE gardinet** (motorlarmen er selv en vækning) og
              flytter ikke rummet ud af Auto. Et nyt tryk kan kun forlænge.
              *Hvorfor:* et NED-tryk midt i rampen slukkede før kun lyset i det
              sekund, hvorefter rampens næste trin tændte igen = blink (målt
              05:57–06:00 den 19.). Samtidig fik `sovelys_power_recovery` en gate,
              så den ikke længere kan læse rampens egen tænding som et
              strøm-wake.

              ⏰ **Alarm-morgen-lys (2026-07-30):** når en **alarm-vækning** har
              kørt færdig, holdes gardinet bevidst på **privacy** indtil badet har
              været tomt (nøgen-gaten) — rummet er mørkt mens I finder tøj, men
              lux-logikken så det som "lyst nok". I vinduet
              **{{ states('input_number.sove_alarm_morgen_vindue_minutter')|float(240)|round(0) }} min**
              efter rampen (slider), og kun så længe gardinet stadig er på/under
              privacy, gælder tre undtagelser: (1) **bevægelse alene må tænde**
              (normalt kræver kold-start et *still_target*), (2) lux-grænsen hæves
              til **{{ states('input_number.sovevaerelse_alarm_morgen_lux')|float(60)|round(0) }} lx**,
              (3) **dagslys-slukket + open-plan-vetoet er suspenderet** (det slog
              ellers lyset ud igen efter 5 min). Alarmen ER samtykket: har den kørt,
              ville I begge op — men **to-oppe-kravet nedenfor gælder også her**.
              **Snoozen slår stadig alt fra** (sov videre).
              Aktivt nu: **{{ 'JA' if is_state('binary_sensor.sove_alarm_morgen_lys','on') else 'nej' }}**{% if is_state('binary_sensor.sove_alarm_morgen_lys','on') %} ·
              {{ state_attr('binary_sensor.sove_alarm_morgen_lys','minutter_siden_vaekning') }} min siden vækning ·
              gardin {{ state_attr('binary_sensor.sove_alarm_morgen_lys','gardin_position') }}{% endif %}.

              🔒 **Mørklagt morgen kræver TO PERSONER OPPE (2026-07-31).** Er
              klokken **05–11** og gardinet stadig på/under privacy (= der er helt
              mørkt derinde), så **tænder hverken presence, lux-fald eller
              gang-early-detect soveværelset af sig selv** (alle tre veje er
              lukket — early-detect kom med 07-31 runde 3). Der skal først være bekræftet **to
              personer oppe** — og det måles på **afgangs-sekvensen**, ikke på et
              gæt: (1) soveværelset bliver tomt mens **entréen** lige har været
              aktiv = én gik ud; (2) rummet bliver optaget **igen** mindst
              **{{ states('input_number.sove_morgen_anden_krop_minutter')|float(8)|round(0) }} min**
              senere; (3) radaren skal se et **moving target** tættere end
              **{{ states('input_number.sove_morgen_2p_doerzone_cm')|float(120)|round(0) }} cm**
              fra Apolloen — den sidder lige ved døren, så afstanden falder på
              vej ud (målt 151 → 47 cm) og stiger på vej ind (100 → 240 cm),
              mens sengen ligger på 229-240. Først dér
              er to-oppe bekræftet. Trin 3 kom 25/08 efter at et 8 min 18 s radar-hul over
              en **sovende** blev læst som "anden person oppe" og rullede
              gardinet op kl. 06:35. Bekræftelsen **holder resten af dagen**
              (nulstilles 04:00), så I gerne må samles i soveværelset bagefter.
              Mørklagt nu: **{{ 'JA' if is_state('binary_sensor.sove_morgen_moerklagt','on') else 'nej' }}** ·
              to oppe: **{{ 'JA (kl. ' ~ state_attr('binary_sensor.sove_alarm_morgen_to_oppe','bekraeftet_kl') ~ ')' if is_state('binary_sensor.sove_alarm_morgen_to_oppe','on') else 'nej' }}**.

              🚪 **DØREN afgør det nu — begge veje (2026-08-30).** Soveværelset
              fik sin egen dørsensor (`binary_sensor.parasoll_sovedoer`), og den
              er det eneste signal i hele afsnittet ovenfor der ikke er *udledt*
              af radaren. **Åben dør i
              {{ states('input_number.sove_morgen_doer_aaben_minutter')|float(5)|round(0) }} min**
              (04–12) sætter "to personer oppe" med det samme — sidestillet med
              afgangs-sekvensen, så den vej der først kan bevise det, gør det.
              **Lukket dør** i samme vindue er derimod et **veto**: presence,
              lux-fald og gang-early-detect tænder ikke soveværelset, og
              **sove-gardinets motor udskyder sig selv** (åbningen glemmes ikke —
              den køres når døren åbnes, eller efter kl. 12). Vetoet ligger
              **oven i** de gamle krav, ikke i stedet for. Falder sensorens
              batteri ud, tæller døren *hverken* som åben eller lukket, og huset
              opfører sig som før. Manuel Styrbar/Somrig virker altid.
              Døren nu:
              **{{ 'ÅBEN' if is_state('binary_sensor.parasoll_sovedoer','on') else ('LUKKET' if is_state('binary_sensor.parasoll_sovedoer','off') else 'ukendt') }}** ·
              mørk-hold: **{{ 'JA' if is_state('binary_sensor.sove_doer_moerkhold','on') else 'nej' }}**.

              🔎 **To stramninger af dør-vejen (2026-09-01).** (1) **Åbningen
              skal selv være sket efter 04:00 i dag.** Døren stod åben uafbrudt
              fra 30/8 kl. 21:40 til 1/9 kl. 06:14, så "åben i 5 min" var sandt i
              samme sekund vinduet åbnede — huset erklærede "to oppe" kl. 06:05
              og tændte pendlen 06:11 over en sovende. Sover I altid med døren
              åben, siger dør-vejen nu ingenting; det er **lukket-og-så-åbnet**
              der er signalet. (2) Er **voksenvækningen slået fra**, tier
              dør-vejen helt — så har nogen udtrykkeligt bedt om at sove videre,
              og en åben dør kan ikke skelne "vi er begge oppe" fra "den ene gik
              ud og lod døren stå". Da kan **kun dør-zone-radaren** bekræfte to
              oppe, og den kræver at rummet HAR været forladt. Soveværelset er
              alligevel frit igen efter kl. 11, når gardinet ruller op, eller på
              et manuelt tryk.
              Voksenvækning: **{{ 'TIL' if is_state('input_boolean.wakeup_adults_enabled','on') else 'FRA (dør-vejen tier)' }}** ·
              dør åbnet i dag:
              {%- set da = state_attr('input_datetime.sove_morgen_doer_aabnet_at','timestamp')|float(0) %}
              **{{ (da|timestamp_custom('%H:%M', true)) if da > 0 and da >= today_at('04:00').timestamp() else 'nej' }}**.

              🌙 **Om natten (før kl. 05) er det godnat-flaget der spærrer** alle
              tre veje — soveværelset tændes ikke automatisk mens nogen sover.
              Vinduet ovenfor starter **05:00** (2026-08-01, var 06:00), fordi
              godnat-auto-off kunne rydde godnat fra 05:00 og dermed lade
              early-detect tænde pendlen på en nat-tur. Auto-off er samtidig
              flyttet til **06:00** (⚙️ Indstillinger → 🔓 Godnat auto-off), så
              der ikke længere er en time uden spærre.

              ☀️ **Dagslys-sluk følger nu tænd-gaten (2026-08-19).** Formiddagens
              sanity-tjek (07-12) slukkede først ved **50 lx**, mens presence måtte
              tænde under **{{ states('sensor.sovevaerelse_lux_gate')|float(40)|round(1) }} lx**
              — et bånd på 4,5× hvor lyset er ubegrundet men udødeligt. Målt 08-19:
              en 6-minutters sol-fantom på sove-Apolloen tændte pendlen 09:21 mens
              den eneste hjemme sad i køkken/spisestue, og den brændte **20 min**.
              Tærsklen er nu `sensor.sovevaerelse_dagslys_sluk_effektiv`, som
              bruger husets fælles formel (⚙️ Indstillinger → 🔆 Lys-reglerne pr.
              rum): loftet er rummets EGEN dagslys-slider, ikke længere et
              hardkodet 50 — de to tal var uenige om samme rum (08-19d).
              Samme regel som stuen fik samme dag — en TÆND- og en SLUK-tærskel
              for samme lys er ÉN regel.

              🔎 **Tal (live):** presence `sovevaerelse_apollo_occupancy` · lux nu
              **{{ states('sensor.sovevaerelse_lux_reel')|float(0)|round(0) }}**
              (rå {{ states('sensor.sovevaerelse_apollo_lux')|float(0)|round(0) }} − Apollo-LED
              {{ state_attr('sensor.sovevaerelse_lux_reel','led_fradrag')|float(0)|round(0) }}) vs
              tænd-tærskel **{{ states('sensor.sovevaerelse_lux_gate')|float(40)|round(1) }}**
              ({{ 'dag' if is_state('sensor.sun_bracket','day') else 'nat' }}),
              formiddags-sluk **{{ states('sensor.sovevaerelse_dagslys_sluk_effektiv')|float(50)|round(1) }}** ·
              **sluk:** tom **{{ state_attr('sensor.rum_tom_sluk_sekunder','minutter')|float(5)|round(1) }} min**
              (husets fælles basis) — eller tom **60 s** + sol oppe (morgen-hurtig). Early-detect
              pre-lys: entré-valhorn + `open_plan_lux < {{ states('input_number.sovevaerelse_early_lux_threshold')|float(0)|round(0) }}`,
              hurtig-sluk efter **{{ states('input_number.early_detect_clear_seconds')|float(0)|round(0) }} s**
              hvis du ikke gik ind. Hygge-fade: ligger stille
              **{{ (states('input_number.sovevaerelse_settle_delay_seconds')|float(0) / 60)|round(1) }} min**.

      # ===================================================================
      # BØRNEVÆRELSE
      # ===================================================================
      - type: grid
        cards:
          - type: heading
            heading: Børneværelse
            heading_style: title
            icon: mdi:teddy-bear
          - type: markdown
            content: |
              **Loft:**
              🟢 **TÆNDER:** børne-Apollo presence (*Børneværelse tænd*; kræver
              "børn hjemme" + ikke manuel-lås — **uden børn hjemme** frisk
              bevægelse; **efter sengetid** puttelys-udseendet) · lys-fald ·
              puttelys-triggers (fase 1 genarmeres efter HA-genstart) ·
              **vækning pigerne** · loft-manuel-cycle
              → kraftigt (100 %/3000 K).

              🎉 **Styrbar børn ← / →:** festlys i børneværelset til/fra
              (kun børn danser; kører festen allerede, kommer børn med).
              Slukker selv når rummet har været tomt i
              {{ states('input_number.festlys_boern_tomt_minutter') | int(3) }} min.
              **Langt OP/NED** mens børn danser = festlys fra.
              AirBnB: farveskift som før.

              🆕 **08-23: "Gæst sover her"** (tile på Lys-siden) slukker rummet
              og holder manuel-sluk-låsen, så INGEN af tænd-vejene ovenfor kan
              fyre — heller ikke strøm-recovery, som før var den eneste der ikke
              læste låsen. Låsens egne udgange (tomt rum, godnat, 05:45,
              morgen-sanity) er sat ud af kraft mens holdet er on; tilbage er
              **Styrbar børn OP** og en **10:00-backstop**. Vækningen er
              bevidst IKKE spærret (den skal fejle åbent).

              🔐 **08-26: låsen armerer nu også uden nogen i rummet** — efter
              **{{ states('input_datetime.boern_manual_off_lock_start')[:5] }}**
              (slider) er et **app-tryk fra sofaen** nok. Før krævede den at
              Apolloen så nogen i rummet, hvilket et digitalt tryk ikke opfylder;
              nu accepteres `context.user_id` eller et friskt Styrbar-stempel som
              finger-bevis. I samme vindue er **"tomt rum"-udgangen slået fra** —
              et barn der ligger stille ER tomt for radaren, så 20 min tomhed
              måtte ikke frigive låsen midt om aftenen. Udgange i vinduet:
              **Styrbar OP**, sengetid, **05:45** + /15-backstop.

              ⏰ **Vækningen (hverdage) kører nu
              {{ states('input_number.global_kids_wakeup_after_alarm_minutes')|int(15) }}
              min efter de VOKSNES alarm** — ikke længere fast 06:05. Uden alarm
              i dag: fast 06:05. Weekend/ferie: 07:30. Indhenter hvis godnat
              clearer sent. Mål i dag:
              **{{ state_attr('sensor.wakeup_kids_maal','maal_lokal') }}**
              ({{ state_attr('sensor.wakeup_kids_maal','kilde') }}).
              🆕 Vækningen ramper **alle tre dæmpbare** børne-lys (loft +
              hygge-strip + lampe) og tænder **hyggelys-pluggen** i Phase 3 —
              fordi loftet tit står slukket på vægkontakten.
              🆕 **09-29: morgen-nedtoning.** Er barnet stået op efter vækningen
              (≥ {{ states('input_number.boern_morgen_bevaegelse_sekunder')|int(45) }} s
              ægte bevægelse) og rummet derefter stille i
              {{ states('input_number.boern_morgen_nedtoning_stilhed_sek')|int(60) }} s,
              **rampes alt lyset roligt ned til sluk over
              {{ states('input_number.boern_morgen_nedtoning_minutter')|int(5) }} min**
              (plug-lampen går ud ved ~10 %). Bevægelse under rampen → blød fade
              til auto-lysets niveau. Holdet slipper først efter rampen.
