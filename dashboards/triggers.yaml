              🔁 **Udskudt sluk-alt bliver INDHENTET (2026-09-02d).** Godnat,
              entré-NED og AirBnB-NED subtraherer alle
              `sensor.badevaerelse_sluk_alt_undtagelse` — men undtagelsen er en
