            content: |
              **Pærelyskæde** (på terrasse-pluggen):

              🟢 **TÆNDER:** skumring/dusk auto-on (sol < {{ states('input_number.terrasse_skumring_elevation')|int(-4) }}°; **flagermus-mode
              ON = dæmp-% (default 20 %)**, ellers sol-tilpasset styrke; aldrig
              kl. 04-12) · **morgenlys (2026-10-02):** mørkt om morgenen (sol
              < {{ states('input_number.terrasse_morgenlys_sol_elevation') }}°) +
              godnat slukket + nogen i open plan → **{{ states('input_number.terrasse_morgenlys_pct')|int(20) }} %**
              (tidligst ~05:30, ikke AirBnB) · Styrbar terrasse top/bund ·
              AirBnB outdoor-zen ved mørkt.

              🔴 **SLUKKER:** godnat · **morgenlys** (kun når den selv tændte:
              solen over grænsen, open plan i ro, eller kl. 12 — slukker du den
              selv, bliver den slukket resten af morgenen) · **flagermus-curfew** (hård sluk kl.
              curfew-tid når flagermus-mode ON, Normal — totalt mørke) ·
              **nat-auto-sluk** (fra sluk-tid-slider, default 23:30, når
              open-plan har været i ro — dækker AirBnB hvor godnat aldrig fyrer
              + glemt godnat; manuel nat-tænd vinder resten af natten) ·
              **regn nu** (slukker pluggen) · Dormant · vinter-kill-switch ·
              Styrbar lang-ned (kun kæden, pluggen forbliver) ·
              🆕 **Gæste-RODRET O** (09-27, kun kæden).
              **🎉 Gæste-aften-undtagelse (2026-07-25):** people-tæller over
              familie-baseline → flagermus-curfew/dæmp OG nat-auto-sluk holdes
              tilbage i gæste-vinduet (default 6 t) — terrassen går ikke i sort
              midt i besøget.

              🔅 **DÆMPER (uden at slukke):** **flagermus ekstra-dæmp** (fra
              ekstra-dæmp-tid, default 22:30 → ekstra-dæmp-%, default 5 %, når
              flagermus-mode ON + kæden er tændt — ikke ved gæste-aften).

              🎊 **Fest-mode (2026-08-21):** kører festen, holdes kæden på
              **100 %** af en /10-backstop så længe
              `input_boolean.fest_terrasse_fuld` er oppe (en præference der står
              ON som default — ikke et flag festen selv armer) —
              terrassen er bevidst UDE af dance-rosteret, så den lyser stabilt i
              stedet for at farve-drive. **Kun efter dusk (sol < {{ states('input_number.terrasse_skumring_elevation')|int(-4) }}°, 2026-09-13):**
              holdet er modvægt til dusk-tændingens 13 %, ikke en selvstændig
              tænd-vej — en dagsfest tænder ikke længere kæden i fuldt dagslys.
              Ved hver hoveddørs-åbning **blinker den
              3×** som gæste-fanfare og vender tilbage til 100 %. Festen stempler
              desuden gæste-vinduet ovenfor, så flagermus-curfew og nat-auto-sluk
              ikke lukker terrassen midt i festen.

              🎨 **FARVE:** Styrbar L/R · **el-pris-blok** (luksus-lys) undertrykker
              auto-tænd når strømmen er dyr.

              🔌 **Pluggen** (`switch.terrasse_plug`) er udeområdets eneste strøm →
              ALTID ON undtagen Dormant / regn / vinter-kill.

              🔎 **Tal:** INGEN presence-sensor (tid/sol-styret). Dusk auto-on når
              sol `< −4°`; styrke sol-tilpasset (mørkere ude → kraftigere) ×
              aggressivitet. Slukkes af godnat/nat-sluk-tid/regn/Dormant, ikke
              af tomhed.

