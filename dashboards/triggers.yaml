              Lyset venter også på fugt-målingen: fra besøget begynder til
              Timmerflotten har rapporteret, og siger den "bad", venter det
              videre til sessionen er armeret.
              Mens sessionen kører er **alle** badets sluk-veje sat på pause
              (gradvis sluk, Medium, leave-off, quick-off, approach-clear,
              godnat-nattoilet, wasp-probe) — kun max-on watchdogen kan stadig
              slukke. Slukker noget alligevel, tændes lyset **én** gang igen;
