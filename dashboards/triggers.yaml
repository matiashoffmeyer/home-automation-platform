              Kommer ingen ind på **{{ states('input_number.openplan_entre_velkomst_tom_minutter')|int(25) }} min**, slukker ilden.

              🧘 **Sofa Zen (auto, aften — 2026-10-03):** når der har siddet nogen
              stabilt i sofaen i **{{ states('input_number.sofa_zen_taend_efter_s')|int(120) }} s**
              (kun mørkt udenfor, mellem **{{ states('input_datetime.sofa_zen_fra')[:5] }}** og
              **{{ states('input_datetime.sofa_zen_til')[:5] }}**), fader sofa-lysene (læselampe +
              begge spots + hyggelampen), spisestue-loftet og køkkenkæden over **{{ states('input_number.sofa_zen_fade_ind_s')|int(40) }} s** til
              din Overskriv-Zen; terrassen dæmpes til højst 20 % (tændes aldrig).
              Kæden følger køkkenets egen auto mens køkkenet er i brug og kommer
              tilbage i Zen når det er ledigt. Sofa-tænd, sofa-sluk og spot-spejlet
              står stille så længe scenen ejer zonen. Slipper **{{ states('input_number.sofa_zen_slip_efter_s')|int(300) }} s** efter
              sofa-hyggen er væk; så tager sofa-sluk over (normal tom-tid) og de
              andre rum er under almindelig auto. Depot og gardiner røres aldrig.
              Et tryk i stuen/på spisestue-loftet spærrer i **{{ states('input_number.sofa_zen_manuel_hold_min')|int(45) }} min**;
              tænder aldrig en stue hvor alt er slukket. Stopper straks ved tryk,
              godnat, film, anden scene, fest og AirBnB. Status nu: **{{ states('sensor.sofa_zen_status') }}**.

              🔴 **SLUKKER:** sofa-zone tom ~20 min (*Sofa-stue gradvis sluk*
              — **blokeret {{ states('input_number.manuel_lys_hold_timer')|float(3)|round(1) }} t efter en manuel
              tænding**, se manuel-holdet ved spisestue-loftet nedenfor;
              bevægelse i køkkenet holder zonen tændt hele dagen, entréen kun
              04-12; godnat slipper) ·
              **🎬 Dark Mode** (mørklægning slukker sofa-lamperne og sætter
              biograf-flaget → alt open-plan AUTO-tænd er suppresset. **02-09:
              kun når projektoren kører, eller ved dobbelttryk** — et knap-tryk
              uden film mørklægger kun soveværelset og sætter ikke biograf-flaget;
              **manuel
              tænd — app-tile/Styrbar — får lov at blive**; er Dark Mode stadig
              tændt kl **{{ states('input_datetime.dark_mode_godnat_cutover')[:5] }}**
              = glemt godnat → huset går automatisk til godnat, intet tænder) ·
              dagslys-stigning (*Stue sluk ved LUX-stigning* — 2026-07-14/B49:
              dækker nu HELE open-plan inkl. sofa-zonen, fyrer **uanset
              presence** når lux > tærskel i N min, re-armer selv;
              sliders på Indstillinger → 💡 Lys → Stue; Manual/biograf/
              cirkus/godnat blokerer. **2026-08-19:** tærsklen er ikke længere
              sliderens rå tal, men **den laveste af slideren og tænd-gaten ×
              hysterese** — ellers hang lyset i dødbåndet mellem "for lyst til
              at tænde" (9 lx) og "lyst nok til at slukke" (50 lx) på en grå
              formiddag).

              🎨 **FARVE/VARME:** adaptiv døgn-CCT (varmere om aftenen) · scener ·
              festlys · vejr-varsler · Styrbar L/R.

              🔎 **Tal (live):** presence `stue_apollo_occupancy` · lux nu **{{ states('sensor.open_plan_lux')|float(0)|round(0) }}** vs tænd-gate **{{ states('sensor.stue_lux_gate')|float(40)|round(1) }}** ({{ 'dag' if is_state('sensor.sun_bracket','day') else 'nat' }}) / dagslys-sluk **{{ states('sensor.stue_dagslys_sluk_effektiv')|float(0)|round(0) }}** · **tænd-gate:** {{ 'ÅBEN ✓' if (states('sensor.open_plan_lux')|float(50)) < (states('sensor.stue_lux_gate')|float(40)) else 'LUKKET ✗ (for lyst)' }} (kun lux, ingen sol-gate) · tænder kun hvis stue-loftet er OFF · **sluk:** sofa-zone tom **20 min**.

              ⚠️ **Hyggelampe (plug)** = tænd/sluk kun (ingen dæmp/farve).
              🚫 **Tænder/slukker du kun hyggelampen i appen**, bliver stuen i Auto. Slukker du den, forbliver den slukket, og de andre sofa-lys tænder uden den, til stuen har været tom i 10 min eller du tænder den igen{{ ' — **fravalgt nu**' if is_state('input_boolean.stue_hyggelampe_fravalgt', 'on') }}.
              **Læsehygge** = Innr farvepære → deltager i dance + vejr-morgenvarsel.

              🔒 **Hyggelampen er LUKSUS-LYS** (2026-07-31): den er en
              **glødepære på {{ states('sensor.stue_plug_power')|float(0)|round(0) }} W målt nu**
              (~39 W tændt) = husets dyreste lyspunkt. Er el-prisen høj
              (🔒-blokken → {{ 'AKTIV — hyggelampen auto-tænder ikke lige nu' if is_state('binary_sensor.luksus_lys_elpris_block','on') else 'inaktiv' }})
              springer de to AUTO-stier (presence + LUX-fald) den over —
              **de fire øvrige sofa-lys tænder som normalt**, så zonen bliver
              aldrig mørk. **Styrbar højre-klik og app-tile tænder den ALTID**,
              også under blok. Blokken gælder **ikke i AirBnB** — gæster får den
              fulde sofa-zone. Tærskel: Indstillinger → 🔒 Luksus-lys.

              🌄 **MORGENRAMPEN (2026-08-30)** — en femte tænd-vej, kun mellem
              **05:00 og 08:00 mens godnat stadig kører**: bliver en nattur til
              "vi er stået op", fader **Læsehygge** langsomt op i takt med hvor
              sikker huset er (Indstillinger → 🌄 Morgenrampe). Starter først
              efter **{{ states('input_number.morgenrampe_stue_minutter')|float(2)|round(1) }} min**
              uafbrudt ophold i stuen; sikkerheden kryber fra
              **{{ states('input_number.morgenrampe_start_pct')|float(8)|round(0) }} %**
              mod 100 % over **{{ states('input_number.morgenrampe_fuld_minutter')|float(12)|round(0) }} min**,
              og lysstyrken er altid **slut-styrke × sikkerhed** (mål
              {{ states('input_number.morgenrampe_stue_pct')|float(60)|round(0) }} % @
              {{ states('input_number.morgenrampe_stue_kelvin')|float(2192)|round(0) }} K).
              **{{ states('input_number.morgenrampe_spisestue_sekunder')|float(60)|round(0) }} s
              i spisestuen = sikker** → 100 %. Hyggelampen er ikke med om
              morgenen (heller ikke når sofa-zonen tænder på en mørk morgen),
              og spotsene står på læselampen ÷
              {{ states('input_number.stue_spots_morgen_forhold')|float(1.4)|round(1) }}
              (dine huskede Auto-styrker vinder).
              🔴 **Sluk:** når dagslyset passerer de normale lux-grænser fader
              læselampen og kæden ud over
              **{{ (states('input_number.morgenrampe_lux_off_sekunder')|float(900)/60)|round(0) }} min**.
              Bliver open-plan tomt i
              **{{ states('input_number.morgenrampe_tom_minutter')|float(5)|round(0) }} min**
              (= du gik i seng igen) slipper rampen bare lysene uden at slukke.
              Live: {{ 'KØRER — sikkerhed ' ~ states('sensor.morgenrampe_sikkerhed') ~ ' %' if is_state('binary_sensor.morgenrampe_aktiv','on') else 'inaktiv' }}.
              Soveværelse og børneværelse holdes mørke hele vejen.

      # ===================================================================
      # KØKKEN (lyskæde + spots; loft nedlagt)
      # ===================================================================
      - type: grid
        cards:
          - type: heading
            heading: Køkken
            heading_style: title
            icon: mdi:countertop
          - type: markdown
            content: |
              **Lyskæde** (RGB-accent) — egne indstillinger, undtaget køkkenets
              sol-gate:

              🟢 **TÆNDER:** køkken-zone presence (*Køkken tænd*, egen lux-gate) ·
              **bevægelse i køkkenet** (re-arm 2026-08-20: occupancy står ofte
              allerede `on` fra sofa-latchen, så flanken alene tændte aldrig midt
              i et ophold — og rummets lux-fald-tænd forsvandt med køkkenloftet
              07-28) · madlavning (**kæden ramper FØRST**, se ⏱ under Spots) ·
              aften-vindue 17–22 ·
              **køkken-session under Dark Mode** (se 🎬 nedenfor — 02-09: kun når
              Dark Mode ejer **sofastuen**; køkkenet er open plan med stuen, ikke
              med soveværelset, så en knap-session i sengen rører ikke lyskæden).

              🌅 **MORGENLYS (2026-09-25):** 05–09, efter godnat (og uden
              morgenrampe/film/Dark Mode), tænder kæden direkte i det **bløde
              hvide arbejdslys** (cooking-styrke + morgen-kelvin) i stedet for
              hyggefarven; en allerede tændt kæde fader om når vinduet åbner
              (godnat ryddet) og tilbage til hygge kl. 09. Spots venter om
              morgenen til kæden er **helt** i mål.

              ⛔ Tænd kræver **bevægelse ≤ 250 cm inden for
              {{ states('input_number.koekken_taend_bevaegelse_sekunder')|float(0)|round(0) }} s**
              (08-19g: Apolloens still-felt er 6 m og ser sofaen). Stilstand
              holder lyset tændt — kravet gælder KUN tænd. Mørkner det mens du
              er i køkkenet, tænder kæden når lux-gaten åbner.

              🏠 **HJEMKOMST (2026-09-26)** — *Hjemkomst: Velkomstlys stue+køkken*
              tænder kæden ved hoveddøren i mørke (hvidt arbejdslys, 50 % hurtigt →
              fuldt langsomt), ikke under godnat eller Sleep Over.
              🍽️ **MÅLTIDSLYS (2026-09-28)** — `binary_sensor.koekken_maaltidslys`:
              45 s ophold ved spisebordet (spisestue-Apolloen) → lyskæden fader
              LANGSOMT til varm hvid
              **{{ states('input_number.koekken_lyskaede_maaltid_kelvin')|int(0) }} K**
              på **{{ states('input_number.koekken_lyskaede_maaltid_pct')|int(0) }} %**;
              tilbage 3 min efter bordet er tomt. Farve-skift, ingen tænding —
              madlavning og Dark Mode/film vinder. Kun Normal/Home Vacation.

              ⚡ **FØRSTE LYS (2026-09-13e)** — *Køkken-lyskæde: første lys*.
              Er open plan **kulsort** (under
              **{{ states('input_number.koekken_lyskaede_foerste_lys_lux')|float(0)|round(0) }} lx**),
              **vinduet under kædens tænd-tærskel
              {{ states('input_number.koekken_lyskaede_lux_threshold')|float(0)|round(0) }} lx**
              (lige nu {{ 'ja ✓' if is_state('binary_sensor.koekken_lyskaede_lux_ok','on') else 'nej ✗ — for lyst' }})
              **og alt open-plan-lys slukket** (`light.stue_all`), tænder
              lyskæden ØJEBLIKKELIGT (transition 1 s) på hyggefarven ved
              **{{ states('input_number.koekken_lyskaede_foerste_lys_pct')|float(0)|round(0) }} %**.
              Udløses af bevægelse i **køkken, spisestue ELLER sofa-stue** — de
              to sidste kan ikke tænde kæden ad nogen anden vej, og det er
              pointen: kommer man ind i open plan fra putning, ser stue-/
              spisestue-Apolloen én først, mens køkken-radaren slet ikke kan
              bevise noget. Derefter overtager enforcerens normale on_edge-gren
              og løfter videre til fuld styrke. Samme spærringer som *Køkken
              tænd*; ghost-filtrene (akkumuleret bevægelse i køkkenet, 20 s i
              stuen) gælder uændret.
              **🏃 Hurtig-vækning fra børneværelset (2026-09-17):** genvejen
              efter putning kvitterer til netop denne vej — og kalder den
              **først** af de tre open-plan-rum, fordi "alt slukket"-kravet
              ovenfor ellers ville fejle i det øjeblik spisestuen tændte.
              **🌅 Morgen-velkomst fra entréen (2026-10-07):** en mørk morgen
              (godnat ryddet, open plan under
              **{{ (states('input_number.morgen_dagslys_lux')|float(80) * states('sensor.global_lux_threshold_factor')|float(1))|round(0) }} lx**)
              er bevægelse i **entréen** nok: open plan tændes før du går ind.
              Kvitterer til de samme tre veje (køkkenet først), så hvert rums
              egne spærrer gælder. Hele rampen køres
              **×{{ states('input_number.openplan_moerk_morgen_fade_faktor')|float(1) }}**
              langsommere (*Fade-ind langsommere på mørke morgener*): kæden over
              **{{ ((states('input_number.koekken_lyskaede_fade_ind_hurtig')|float(2) + states('input_number.koekken_lyskaede_fade_ind_langsom')|float(15)) * states('input_number.openplan_moerk_morgen_fade_faktor')|float(1))|round(0) }} s**,
              sofa, spisestue og spots over
              **{{ (states('input_number.koekken_lyskaede_fade_ind_langsom')|float(15) * states('input_number.openplan_moerk_morgen_fade_faktor')|float(1))|round(0) }} s**.
              Kun **første** lys i morges, kun Normal/Home Vacation
              {{ '— slået fra' if is_state('input_boolean.openplan_entre_velkomst_enabled','off') else '' }}.

              🎨 **FARVE-PREVIEW (2026-10-17):** skruer du på kædens lysstyrke/farvetone/mætning
              i Indstillinger, tænder/farver kæden i værdien i
              **{{ states('input_number.koekken_lyskaede_preview_sekunder')|int(15) }} s** efter sidste træk
              — derefter tilbage (slukket igen, husets mål eller dit eget udseende). Viger for alarmer, varsler og fest.

              🔴 **SLUKKER:** køkken-zone tom (*Køkken-lyskæde sluk*) · session slut
              (tomt **{{ states('input_number.koekken_session_timeout_minutes')|float(0)|round(0) }} min** / godnat / væk) ·
              **dagslys** over lux-grænsen +5 lx i
              **{{ states('input_number.koekken_lyskaede_lux_off_minutter')|float(0)|round(0) }} min**
              (2026-08-05: tjekkes nu løbende, ikke kun på selve krydsningen —
              før kunne en madlavnings-session æde krydsningen, og så hang kæden
              til hele open-plan blev tom) · **morgen-velkomst udløbet**: tændt
              fra entréen, men ingen kom ind i open plan på
              **{{ states('input_number.openplan_entre_velkomst_tom_minutter')|int(25) }} min**
              → hele open plan slukkes igen.

              ⏲️ **GESTUS-TIMER (2026-09-12):** løber køkken-timeren ud
              (*Køkken gestus: timer slut*), blinker lyskæden i bursts af
              **hvidt og ravgult** (ét blink pr. minut der blev talt ned) i
              ~15 s, eller til en knyttet hånd stopper den. Den TÆNDER kæden hvis
              den var slukket, og afleverer den bagefter i den tilstand den blev
              lånt i. Den blinker også i ANDRE rum med bevægelse inden for 30 s
              (stue = kun stuens egne lamper, spisestue-loft, soveværelse,
              børneværelse); bagefter får hver lampe sin egen før-tilstand
              tilbage — tændte med farve + styrke fra et snapshot, slukkede
              slukkes igen. Mens alarmen kører er
              enforceren gatet fra, så farven ikke rettes tilbage midt i
              blinket. Timeren sættes fra tal-knapperne på Lys-siden (1-10 min),
              med stemmen (*"timer thirty minutes"*, 1-60), fra telefon-widgets
              (*⏲️ Køkken-timer N min*), eller fra
              håndgestus foran kameraet (*Gestus: fingre i køkkenet*), se
              docs/gesture_recognition.md.
              Alle tre indgange fyrer det samme event, så de deler hele kæden.
              **Kamera-vejen er live siden 2026-09-14:** ser køkkenets radar
              bevægelse, beder huset kameraet kigge efter fingre hvert 5. sekund
              (*Gestus: bevægelse i køkkenet*) — der kigges altså ikke konstant,
              kun mens nogen faktisk er i køkkenet, og aldrig i AirBnB.
              Gestus-vejen kræver **hold-to-confirm**: det samme fingertal skal
              stå i 3 frames i træk ≈ **1,2 s** (målt kadence ~0,62 s/frame),
              ellers ville en hånd på vej op gennem 1→2→3 fingre starte en
              1-minuts-timer. Første gang kameraet ser hånden, blinker
              **Apollo-ringen svagt ravgult** (*Køkken gestus: hånd set*);
              grøn = timeren er startet. Knapper og widgets er
              allerede ét bevidst tryk og har derfor intet hold-krav.
              Røgalarmens nødbelysning vinder over den; alt andet taber.

              🚶 **NATTUR (2026-08-26g):** går en voksen nattur under godnat
              (*Godnat: Voksen nattur*), tænder lyskæden som **orange natlys** —
              **{{ states('input_number.global_nightwalk_lyskaede_brightness')|float(0)|round(0) }} %**
              @ **{{ states('input_number.global_nightwalk_lyskaede_kelvin')|float(0)|round(0) }} K**,
              sendt som RGB. Spisestue-loftet følger med på
              **{{ states('input_number.global_nightwalk_brightness')|float(0)|round(0) }} %** @ 2000 K
              (ikke kl. 04-12 efter en nat med børn);
              køkken-spots og entré tænder bevidst IKKE. Mens natturen kører er kæden
              undtaget både enforceren og de hurtige køkken-tomt-sluk — den dør sammen
              med spisestue-loftet (*Nattur-lys sluk*, **{{ states('input_number.global_nightwalk_off_minutes')|float(5)|round(0) }} min** tomt) eller ved dagslys.
