              **{{ states('input_number.sove_gardin_bad_tomt_minutter')|float(0)|round(0) }} min**
              (slider). Er badet i brug, stopper gardinet på privacy-dækningen,
              og et pending-flag ruller resten af vejen op så snart badet er
              tomt længe nok (/15-backstop). Early-detect (entré-valhorn) tæller
              IKKE som bad-aktivitet. Manuelle tryk (godmorgen 2. tryk, langt OP,
              app, Styrbar) er U-GATET.
              **Kun DAGENS FØRSTE bad-besøg gater (2026-07-30, user-spec):** så
              snart det første ægte besøg efter oppe-tid er slut (bad-stadie
              Medium/Fuld → Ingen, godnat af), er gaten afvæbnet resten af dagen
              — senere bad-aktivitet og spøgelses-blip fra PIR'erne kan ikke
              længere holde gardinet på privacy. Billetten nulstilles ved
              godnat-start og ved midnat. Nat-toiletbesøg under godnat bruger
              den ikke.
              ⏱️ **Besøget skal også være LANGT nok (2026-08-01, user-spec):**
              mindst
              **{{ states('input_number.sove_gardin_bad_min_aktivitet_minutter')|float(5)|round(0) }} min**
              akkumuleret aktivitet på badets inde-PIR'er (slider) før billetten
              bruges. Stadiet siger hvad slags besøg det var, ikke hvor længe det
              varede — 08-01 brugte et 52-sekunders nat-toiletbesøg billetten.
              For korte besøg logges i logbogen og gemmer billetten til næste gang.
              Klar nu:
              **{{ 'JA' if is_state('binary_sensor.sove_gardin_bad_klar','on') else 'nej' }}**
              ({{ state_attr('binary_sensor.sove_gardin_bad_klar','minutter_tomt') }} min tomt,
              dagens billet brugt:
              **{{ 'ja' if is_state('input_boolean.sove_gardin_bad_foerste_besoeg_ovre','on') else 'nej' }}**).
              ⏰ **Motoren kører ALDRIG før alarmen (2026-08-06, user-spec):**
              motorlarmen ER vækningen, så `script.sove_gardin_op` gør INTET med
              motoren mens en alarm er på vej
              (`wakeup_alarm_imminent`, {{ states('input_number.wakeup_alarm_preguard_minutes')|float(45)|round(0) }}
              min før) eller mens godnat stadig er aktivt — den husker i stedet
              gælden og fuldfører oprulningen bagefter. Reglen sad før KUN i den
              alarm-drevne vækning, så de øvrige auto-åbnere kunne snige sig uden
              om: 08-06 rullede gardinet helt op **05:53** med alarm 06:15.
              Vækningens egen sti er uberørt (den sætter privacy direkte og kalder
              først scriptet ~1 t efter alarmen). Manuelle tryk er U-GATET.
              🛏️ **"To personer oppe" kræver en ÆGTE afgang (2026-08-06):**
              et radar-dropout omkring en stilliggende krop talte før som en ny
              afgang, hvis entré-stemplet fra turen UD stadig lå inden for
              **{{ states('input_number.sove_morgen_afgang_entre_sekunder')|float(180)|round(0) }} s**
              — et nat-toiletbesøg blev dermed til "begge er stået op". Nu skal
              entré-aktiviteten ligge i SAMME ophold som afgangen, og en
              off-flanke uden entré-trafik RYDDER et brugt stempel i stedet for
              at lade det ligge.
              👶 **Putning-hold:** mens `putning_sove_active` er on (barn puttet i
              forældresengen) står sove-gardinet i manuel-hold-listen → auto-OP
              (Active, godnat-morgen, weekend 09:00, sæson-genåbning) springer
              det over, uanset grace-slideren. **Dark Mode/Pre-Dark** genåbner
              det heller ikke når de slukkes — det bliver nede til du selv
              ruller det op, eller til en senere auto-rutine gør det efter
              putningen. **Vækningen er den eneste undtagelse** (en stillet
              alarm er dit eget valg).
              ⏱️ **Lys før gardin (2026-08-05):** motoren larmer nok til selv at
              vække, og den kørte før alarmen (Phase 3 ligger på T-1 min). Nu
              venter gardinet til BEGGE er opfyldt:
              **{{ states('input_number.global_wakeup_curtain_after_alarm_minutes')|float(0)|round(0) }} min
              efter alarmen** og
              **{{ states('input_number.global_wakeup_light_before_curtain_minutes')|float(0)|round(0) }} min
              efter lyset gik på fuld styrke** (slidere). Snoozes der i ventetiden,
              kører motoren slet ikke. 05:55-hverdag + 08:00-recovery bruger kun
              lys-før-kravet (intet alarm-tidspunkt at regne fra).
              🪟 **Privacy-position:** vækning åbner IKKE helt med det samme —
              gardinet står
              **{{ states('input_number.global_wakeup_curtain_privacy_pct')|float(0)|round(0) }} % dækket**
              (slider) i
              **{{ states('input_number.global_wakeup_curtain_window_minutes')|float(0)|round(0) }} min**
              (slider), så åbner det helt. Motor-grænser kalibreret 2026-07-28:
              0 = helt nede, 100 = helt oppe, retning `Back`.
              🔼 **Godmorgen-knappens gardin-stige (2026-07-29):** Somrig sove-knap
              **kort OP** i dag-vinduet (04–18) kører gardinet i to trin —
              **1. tryk** til samme privacy-niveau som vækningen, **2. tryk**
              (gardinet står allerede dér eller højere) **helt op**. Trinnet
              aflæses af gardinets faktiske position, så et 3. tryk gør ingenting.
              Aften-grenen (18–04, hygge-toggle) rører ikke gardinet. **Mørkt ude**
              (sol under **{{ states('input_number.sove_gardin_privacy_min_sol_elevation')|float(-3) }}°**,
              samme slider som vækningen) rører kort OP heller ikke gardinet —
              kun lyset tænder. Langt OP ruller altid helt op.
          - type: markdown
            content: |
              **🪟 Børneværelse — INTET GARDIN**
              Børneværelset har **ingen gardin-motor** (droppet 2026-07-28 —
              den gamle cover-entity er slettet fra hele kodebasen).
              Mørklægning dér = **lyset holdes slukket** (🎬 Dark Mode, godnat,
              putning). RODRET'en i rummet styrer derfor ikke gardin — den
              hedder nu **Dark Mode-RODRET** og toggler
              **Dark Mode** (op=ON, ned=OFF). **To op-tryk indenfor
              {{ states('input_number.dark_mode_dobbelttryk_sekunder')|int(120) }} s
              mørklægger alle tre Dark Mode-rum** i stedet for kun det ene
              stigen ville vælge.

