              `timer.koekken_gestus`, og kæden **holdes tændt hele nedtællingen**
              mens den hvert
              **{{ states('input_number.koekken_gestus_burst_interval_s')|int(20) }} s**
              blinker en burst hvis ANTAL svarer til de minutter der er tilbage
              (5 min → 5 blink). Hvert blink svinger
              **{{ states('input_number.koekken_gestus_puls_pct')|float(20)|round(0) }} %-point**
              op fra kædens eget niveau (dykker i stedet hvis kæden står højt) —
              aldrig helt slukket, for et ægte sluk ville ligne en slukket kæde
              for husets øvrige logik. Var kæden slukket, tændes den til formålet
              og **slukkes igen** når alarmen er kvitteret; var den tændt,
              leveres den tilbage på det niveau den havde. Selve burst-kaldet er
              også det der holder kæden tændt, så de øvrige 28 med-ejere af kæden
              bliver ikke gatet; de bliver bare overskrevet inden for 3 s.
              **Rører ALDRIG spots.** Godnat/AirBnB-nat afbryder nedtællingen og
              slukker som normalt. En **knyttet hånd** aflyser; et nyt fingertal
              starter forfra.

              🍳 **En køkken-session vejer tungere end nedtællingen** (ny
              2026-09-19, user-spec). Nedtællingen aflæser kædens tilstand da den
              låner den, og afleverede hidtil blindt til den aflæsning bagefter.
              Startede madlavningen imens, var snapshottet forældet — og fordi
              afleveringen er det SIDSTE kald, vandt den: målt 15/9 slukkede
              afleveringen kæden 4½ min inde i en session med spots tændt (3 af 35
              nedtællinger på 14 døgn). Nu spørger begge afleveringsveje
              (annullering OG alarm-slut) om der laves mad — `koekken_session_active`
              **eller** `binary_sensor.koekken_madlavningslys`, to led fordi
              Apolloen flapper og spots derfor har huller midt i en session — og
              afleverer i så fald til **husets mål** (cooking-lyset) i stedet for
              til snapshottet. Kæden slukkes aldrig under en session, og den
              grønne kvittering dæmper den ikke længere til det niveau der var
              før maden.

              🟢 **Stoppet nedtælling kvitteres med to grønne blink** (ny
              2026-09-17, user-spec) — grøn, fordi rødt er "tiden er gået" og de
              hvide niveau-blink er selve nedtællingen. Bagefter afleveres kæden:
              var den tændt før, males den tilbage til sin egen farve og styrke;
              var den slukket, slukkes den igen — og **hvis lux kræver det,
              tænder køkkenlyset automatisk** i stedet for at efterlade dig i
              mørke. Auto-lyset går gennem husets normale tænd-vej (*Lysnet:
              Køkken tænd*), så den arver lux-gaten, bevægelses-kravet og
              godnat-gatesne. Lux-gaten læses **før** blinket: vores eget blink
              forurener Apolloens lux-måling (målt 17/9: 86 lx → 8,8 lx mens
              kæden lyste). Kun en rigtig annullering kvitterer — backstoppens
              oprydning blinker ikke. Aflysning kan nu også siges: **"stop the
              timer"**.

              🚨 **Alarmen er husdækkende** (ny 2026-09-14, user-spec). Når
              tiden går, blinker ALLE rum med bevægelse inden for 30 s i
              skiftevis **hvidt og ravgult** i
              **{{ states('input_number.koekken_gestus_alarm_sek')|int(15) }} s**,
              i bursts der tæller timerens fulde længde, 2 s pause imellem.
              Ravgul — ikke rød — fordi rødt hus-bredt er røgalarmens sprog.
              Rum i **Manual/Off** lånes aldrig, og sove-/børneværelse springes
              over under putning. Hvert lånt lys leveres tilbage som det stod, og
              rummet slippes til **Auto** igen — **undtagen** køkkenet under en
              madlavnings-session, som får husets cooking-lys tilbage i stedet for
              snapshottet (se ⏲️ ovenfor). Alarmen vinder over køkken-sessionen
              mens den kører (kæden er lånt), og først når den er slut kommer
              sessionens lys tilbage. Røgalarm-blink vinder altid.

              📱 **Lyden kommer fra telefonen — men først til allersidst** (ny
              2026-09-17, user-spec). Køkkenet har ingen højttaler (kameraets kan
              ikke nås), så alarmen ledsages af en timer i telefonens ur. Den
              sættes **når tiden er gået**, på **ét sekund**, og ikke da
              nedtællingen startede. Grunden er målt: en telefon-timer kan kun
              fjernes med et `DISMISS_TIMER`-intent uden kvittering, og tre
              annullerede køkken-timere overlevede fire forskellige
              dismiss-varianter (16-17/9). Sætter man den først til sidst, findes
              der aldrig en telefon-timer under nedtællingen — så en annullering
              kan heller ikke efterlade en. Stopper du alarmen (knyttet hånd
              eller *stop the timer*), sendes dismiss'en til den ringende timer.
              **Der er ingen undtagelse længere** (user-spec 2026-09-17): en
              timer på en time kører nøjagtig samme kæde som en på to minutter
              og kan annulleres hele vejen. Nedtællingens blink topper ved 10 =
              "ti eller flere", fordi ingen tæller 23 blink.
              {{ '🔴 **Timer-alarm ringer lige nu.**' if states('input_text.koekken_gestus_alarm').startswith('aktiv') else '' }}
              {{ '🟠 **Nedtælling kører lige nu.**' if states('input_text.koekken_gestus_nedtael').startswith('aktiv') else '' }}

              💤 **Loftet findes ikke længere** — pæren blev flyttet til
              læsehygge 2026-07-02, og hele `light.koekken_loft` blev droppet
              af kodebasen 2026-07-28 (user: "gammel legacy"). Køkkenet styres
              nu KUN af lyskæden + spots ovenfor; der er ingen loft-lux-grænse
