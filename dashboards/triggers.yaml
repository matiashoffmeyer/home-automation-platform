          - type: markdown
            content: |
              **Loft** — IKEA KAJPLATS E27 CWS globe på **Matter/Thread** siden
              2026-08-21 (samme `light.entre_loft`, men nu **farve**):

              🟢 **TÆNDER:** bevægelse (*Entré: Lys tænd ved bevægelse*, lux-gated) ·
              *Svagt lys om natten* · hjemkomst ved hoveddør · Styrbar TOP-quick
              (dim op) · AirBnB comfort-welcome · AirBnB strøm-recovery 90 %
              (`unavailable→on` altid; `off→on` kun med valhorn-presence) ·
              **festlys/dance-events** · **gæste-fanfaren** ved hoveddør under fest ·
              **Legetøjsdag-diskoen** · **Scene: Hus Party**.

              🆘 **VALLHORN væk:** så tænder bevægelse i stue, køkken, bad og depot entréen
              i stedet{{ ' — ⚠️ aktiv nu' if states('binary_sensor.entre_valhorn_occupancy') in ['unavailable','unknown'] }}.

              🔴 **SLUKKER:** *Lys sluk efter bevægelse* (**langsom fade**) ·
              **terrasse-dæmp** (åben altandør + inde tomt 2 min — **også langsom
              fade**, 09-12b) · nedluknings-grace (efter "sluk alt") ·
              **nattur-retur** · **godnat** · **Scene: Biograf**. De tre sidste
              slukker **momentant** — en lang ramp dér ville lade gangen lyse
              efter resten af huset er mørkt.

              🌙 **Langsom fade (2026-09-12, user-spec):** når
              valhornet har været tomt i sluk-tiden, faldes lyset ned over
              **{{ states('input_number.entre_fade_ud_sekunder')|float(45)|round(0) }} s**
              (slider `entre_fade_ud_sekunder`, ⚙️ Indstillinger) i stedet for at
              knipse ud. **Kommer der bevægelse undervejs, blusser lyset op til
              det niveau det stod på da faden begyndte** — med det samme. Faden afbrydes også hvis lyset slukkes under den, eller hvis
              du tænder manuelt.
              ⚠️ **Hvorfor en ny slider og ikke `fade_passage_seconds`:** entréen
              er **Matter**, og HA videregiver ALDRIG `transition` til et
              Matter-`turn_off` — de fade-tal der stod i koden før har aldrig
              haft nogen effekt her, lyset knipsede ud hver gang. HA driver nu
              selv rampen i geometriske trin (derfor kan den afbrydes).
              `fade_passage_seconds` har 7 andre (ZHA-)forbrugere hvor den
              virker, og er bevidst urørt.
              🛡️ **Terrasse-dæmpen gater først på valhornet:** hænger den
              Matter-sensor `on` (sleepy end device, op mod 40 min uden sit
              `off`), ville faden blusse op på første trin og efterlade entréen
              tændt hele aftenen — så falder den tilbage til øjeblikkeligt sluk.

              🎨 **Farve:** entréen er med i festlyset via
              `input_boolean.dance_room_entre` (default **ON**). Ved dør-åbning
              under fest får den **én farve på sin plads i husets Thread-gitter**
