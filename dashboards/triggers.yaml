            content: |
              **5 spots** — besøgs-STADIER styrer styrke/hold (Quick→Medium→Fuld):

              🟢 **TÆNDER:** *Badeværelse tænd* (inde-sensor/early-detect; vetoer
              robotstøvsuger-gaten) · **aldrig mørkt med nogen derinde
              (2026-10-04):** er alt badlys slukket, tænder inde-sensoren også i
              Manual og sætter Auto; Manual + mørkt bad slippes selv efter 3 s
              (en manuel dæmpning og festlys respekteres) · stadie-eskalering: Quick=probe, Medium=memory,
              Fuld=ramp 60→100 % (vedvarende ophold / brusebad bag lukket dør) ·
              natlys-slut opgradering · **restart-recovery** (29/8: står du i
              badet når HA genstarter, kommer sensoren tilbage som `unknown → on`
              — og alle fire tænd-triggers kræver `from: "off"`, så INGEN af dem
              kan fyre. 30 s efter opstart tændes derfor dæmpet
              ({{ states('input_number.badevaerelse_approach_brightness')|float(30)|round(0) }} %,
              natlys {{ states('input_number.badevaerelse_godnat_brightness')|float(8)|round(0) }} %)
              hvis inde-PIR'en er on, lyset off og rummet i Auto) ·
              🔴 **vandlæk-alarm = rødt fuldt lys** ·
              🆘 **Thread-nødlys:** er ≥ 2 af de 3 Thread-spots nede i 2 min,
              tænder spot 4/5 (Zigbee) fuldt 3000 K — kun når nogen er i badet
              (er badets sensorer selv blinde: bevægelse i entréen).
              **Dør-PIR væk:** bevægelse i entréen tænder badet på normalt niveau
              (ikke approach){{ ' — ⚠️ aktiv nu' if states('binary_sensor.badevaerelse_inde_1_occupancy') in ['unavailable','unknown'] }}.
              Nødlyset slukker igen når badet er tomt i 3 min, eller når
              Thread er tilbage.

              🔴 **SLUKKER:** gradvis sluk · Medium-besøg sluk · probe quick-off
              (mistænkt "sok"-besøg) · leave-off (Fuld + dør åbnet) · **godnat
              nat-toilet hurtig-sluk** (mens `badevaerelse_natlys_aktiv` er ON —
              altså kun så længe badet FAKTISK er i natlys, ikke til godnat-flaget
              ryddes: ~{{ states('input_number.badevaerelse_godnat_off_seconds')|float(90)|round(0) }} s
              efter du er ude ved åben dør — 2026-07-27, gate rettet 2026-08-22)
              · **wasp-probe**
              (stilhed bag LUKKET dør: dæmp til
              {{ states('input_number.badevaerelse_wasp_probe_brightness')|float(40)|round(0) }} %
              (natlys dæmpes ikke, 25/10)
              efter {{ states('input_number.badevaerelse_wasp_probe_minutes')|float(10)|round(0) }} min,
              sluk {{ states('input_number.badevaerelse_wasp_probe_off_minutes')|float(4)|round(0) }} min
              senere hvis ingen protesterer) · max-on
              watchdog · approach hurtig-sluk · spots confirm-off/resync (Matter).
              **Godnat-knappen springer badet OVER** hvis nogen sidder derinde
              bag lukket dør (wasp/committet besøg =
              `badevaerelse_optaget_lukket_doer`, 2026-07-16) — badets egne
