                **{{ states('input_number.solo_tom_rum_sluk_minutter')|int(0) }} min**. Ikke i AirBnB.

      # ===================================================================
      # STUE (sofa-zone, open-plan)
      # ===================================================================
      - type: grid
        cards:
          - type: heading
            heading: Stue (sofa-zone)
            heading_style: title
            icon: mdi:sofa
          - type: markdown
            content: |
              **Sofa-lamper ×2 · Hjørnelampe · Læsehygge · Hyggelampe (plug)**
              — én zone, styret af **stue-Apolloen** (sofa/køkken-området).

              🟢 **TÆNDER:** sofa-zone presence (*Sofa-stue tænd* — stue-Apollo
              ser bevægelse) · lys-fald (*tænd ved LUX-fald*) · Styrbar stue
              højre-klik. (2026-07-17c: "hjemkomst" fjernet herfra —
              velkomstlyset rammer kun spisestue-loftet, aldrig sofa-lamperne.)
              **09-12 mørk indedag:** begge tænd-veje krævede før at solen stod
              under sol-gaten. På en regnvejrsdag betød det at zonen var vetoet
              selv om der beviseligt var mørkt (målt 12/9: 8 lx mod en gate på
              27,8 fra ~17:30, mens sol-gaten først åbnede 18:55). Nu åbner
              `open_plan_mork_indedag` også — og *tænd ved LUX-fald* re-armer på
              den sensors egen flanke, så en dag der er mørk fra morgenstunden
              ikke taber sin ene lux-flanke mens 10-min-forsinkelsen løber.
              **03-09 re-arm:** har dagslys-sluk slukket her mens du stadig
              sidder i rummet, tænder *Stue/spisestue re-arm efter dagslys-sluk*
              lyset igen når lux falder under tænd-gaten — den kvitterer til
              *Sofa-stue tænd*, så Manual/godnat/biograf blokerer stadig.
              Nødvendig fordi presence LATCHER: uden re-arm er der ingen ny
              flanke, og rummet bliver liggende mørkt til du går ud og ind.
              **🏃 Hurtig-vækning fra børneværelset (2026-09-17):** sofa-zonen
              er ét af de tre open-plan-rum genvejen vækker når man går ud fra
              putning. Den kvitterer til *Sofa-stue tænd*, så zonens egen
              lux-gate stadig afgør om DER skal tændes her — er kun køkkenet
              mørkt, er det kun køkkenet der tænder.
              **🌅 Morgen-velkomst fra entréen (2026-10-07):** se Køkken —
              sofa-zonen og spottene rampes da i lyskædens langsomme tempo.
              **🌑 Mørk morgen (2026-10-08):** bevægelse i **køkkenet**
              (køkken-Apolloen) eller **entréen** tænder også sofa-zonen
              (*Sofa-stue tænd*, egne spærrer gælder), og fade-ind køres
              **×{{ states('input_number.openplan_moerk_morgen_fade_faktor')|float(1) }}**
              langsommere — nu
              {{ '**mørk morgen ✓**' if is_state('binary_sensor.open_plan_mork_morgen','on') else 'ikke mørk morgen' }}.
              Kun Normal/Home Vacation. **Køkkenet tænder den også resten
              af dagen**, når det er mørkt (2026-10-09).

              🎚️ **Stue-Styrbar OP (2026-08-19):** **første korte OP fra slukket
              = 70 %** på hele open-plan (andre rum beholder den gamle
              sol-afhængige 50/10 %). Videre korte tryk trapper op som før.
              Er kun køkkenkæden tændt, er trinnet køkkenets: køkkenet går i
              Manuel, stuen bliver i Auto.
              **TOP-hold = 100 % + køkkenspots ON**; BUND-hold = alt af inkl.
              spots. **🔆 Fuldt lys-hold (2026-09-23):** TOP-hold holder HELE
              open-plan (stue + spisestue + køkken inkl. spots) på fuldt i mindst
              **{{ states('input_number.open_plan_fuldt_lys_min_minutter')|int(30) }} min**;
              derefter tilbage til Auto når hele open-plan har været tom i
              **{{ states('input_number.open_plan_fuldt_lys_tomt_minutter')|int(10) }} min**
              (slukker da spottene). Godnat/Dark Mode/biograf/fest/Dormant afbryder.

              💡 **Sofa-spots (2 IKEA Thread):** følger læselampen (tænd/sluk),
              i **Auto** den styrke DU sidst satte på hver spot i appen — spot 1
              **{{ states('input_number.stue_spot_1_brugerstyrke')|int(0) }} %**,
              spot 2 **{{ states('input_number.stue_spot_2_brugerstyrke')|int(0) }} %**
              (0 = standard **{{ states('input_number.stue_spots_auto_brightness_pct')|int(0) }} %**)
              × el-pris (filtplade; Dark Mode/filmmørke følger læselampen ned).
              Læselampen i Auto: max **{{ states('input_number.stue_laeselampe_auto_max_pct')|int(80) }} %**
              × el-pris. **Farve:** tænder (fra slukket) i den farve DU sidst satte
              i appen — spot 1 `{{ states('input_text.stue_spot_1_brugerfarve') }}`,
              spot 2 `{{ states('input_text.stue_spot_2_brugerfarve') }}`; fest/dance/Zen
              huskes ikke. Party/dance: hver sin farve mens de kører.
              🆘 **Spots væk:** skulle de tænde mens de er nede, tænder
              **hyggelampen** i stedet{{ ' — ✅ gør det nu' if states('input_text.stue_hyggelampe_stedfortraeder_context') not in ['', 'unknown'] and is_state('light.stue_plug', 'on') }}; slukkes spots, slukker den igen.
              🔥 **Ild i Auto** ({{ 'til' if is_state('input_boolean.stue_spots_ild', 'on') else 'fra' }},
              skift hver **{{ states('input_number.stue_spots_ild_sekunder')|int(60) }} s** pr. spot,
              lysstyrke **{{ states('input_number.stue_spots_ild_lysstyrke')|int(100) }} %**,
              flakken **{{ states('input_number.stue_spots_ild_styrke')|int(100) }} %**,
              pause ved **{{ states('input_number.stue_spots_ild_rcp_loft')|int(10) }}** Thread-resets/t eller **{{ states('input_number.stue_spots_ild_rcp_byge')|int(3) }}** på 10 min{{ ' — ⏸️ pauser nu' if is_state('binary_sensor.stue_spots_ild_thread_pause', 'on') }}):
              tændte spots får ild-orange én gang og gløder så blødt op og ned (kun lysstyrke) — pauser når en spot eller entré-loftet er væk; ikke i Dark Mode, filmmørke, fest/dance/Zen eller AirBnB.
              🎵 **Spotify-farver** ({{ 'til' if is_state('input_boolean.stue_spots_spotify', 'on') else 'fra' }}{{ ' — ' ~ state_attr('sensor.stue_spotify_stemning', 'stemning') ~ ' nu' if is_state('binary_sensor.stue_spots_spotify_aktiv', 'on') }}):
              spiller Spotify via højttaleren, får stue-spotsene sangens stemning (også med ild fra) — trist = lilla, rolig = blå, glad = guld, energisk = rød — spot 1 og 2 i hver sin nuance, lysstyrken ånder op og ned, forskudt (**{{ states('input_number.stue_spots_ild_sekunder')|int(30) * 2 }} s** pr. bølge, dybde ±{{ states('input_number.stue_spots_spotify_boelge_dybde')|int(35) }} %); tilbage til ild-orange 2 min efter pause.
              **Mørk morgen** ({{ 'til' if is_state('input_boolean.stue_ild_morgen_enabled', 'on') else 'fra' }}):
              også efter 06, selv om godnat stadig holder (børnene oppe).
              Første bevægelse i entréen tænder ilden med læselampen slukket; når nogen er i open plan,
              fader læselampen ind over **{{ states('input_number.stue_ild_morgen_fade_minutter')|int(15) }} min**
              til **{{ states('input_number.morgenrampe_stue_pct')|int(60) }} %**
              (op til **{{ states('input_number.stue_ild_morgen_hurtigere')|float(3) }}×** hurtigere ved bevægelse
