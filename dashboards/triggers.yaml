              Medium/Fuld, så **armeres wasp med det samme** og stadiet løftes til
              **Fuld** — uden krav om en ny PIR-flanke. Selve dør-lukningen ER
              beviset: man lukker ikke badedøren udefra på vej væk fra et bad der
              er i gang. Kun **ét** besøg om dagen (resten er toiletbesøg, hvor den
              gamle strengere regel gælder), og aldrig under godnat. Udgangene er
              uændrede: **døren åbnes → wasp frigives**, safety-clear efter
              {{ states('input_number.badevaerelse_max_on_minutes')|float(40)|round(0) }} min,
              max-on watchdog.
              Dagens billet: **{{ 'brugt' if is_state('input_boolean.sove_gardin_bad_foerste_besoeg_ovre','on') else 'ubrugt (armen er skarp)' }}** ·
              wasp nu: **{{ 'ARMERET' if is_state('input_boolean.badevaerelse_wasp_active','on') else 'off' }}**.

              🚿 **Dampen tænder og HOLDER lyset (2026-09-01).** Badets nye
              TIMMERFLOTTE (Matter node 463) er husets tredje bad-bevis — og det
