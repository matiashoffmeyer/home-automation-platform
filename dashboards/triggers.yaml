            content: |
              **4 gardiner i alt** (2026-07-28): stue syd (S) · stue vest (V) ·
              spisestue vest (V) · **soveværelse (S)**. Børneværelset har INGEN
              gardin-motor (droppet). De 3 første er Somfy RTS via Broadlink =
              **envejs** (ingen positions-feedback → optimistisk state);
              sove-gardinet er Zigbee med ægte positions-feedback.
              Manuel-grace beskytter manuel styring et stykke tid.

              **🎚️ Sove-gardinets RODRET er LATCHENDE (2026-09-10):** ét tryk
              kører gardinet til ende · **tryk igen i SAMME retning stopper det
              hvor det står** · tryk igen kører videre. Modsat retning vender.
              Kort klik og langt tryk gør nu det samme — og et SLIP stopper ikke
              længere motoren, så et tryk faktisk kan betyde "kør helt op/ned".
              Virker i alle house_modes, også AirBnB: knappen går bevidst uden om
              `script.sove_gardin_op` og rammes derfor hverken af AirBnB-gaten
              eller af manuel-hold. De tre Somfy-gardiner kan IKKE få denne
              adfærd (ingen ægte opening/closing-state).

              **🌍 Husdækkende for gardiner:** Hus→Active åbner · Hus→Dormant lukker ·
              **Sommer-forsvar** lukker den sol-ramte side når for varmt — i **tomt hus
              alle tre open-plan** + sove (egen lux) (+ genåbner
              i kølige perioder — **syd-siden = stue syd + soveværelse**) ·
              **Vinter-forsvar** lukker ved Dormant/kuldebølge,
              lukker ALLE når hjemme+**mørkt+koldt** (gulv-kuldestrøm), og åbner
              syd-gardin ved sol-opvarmning · **Morgen-gardiner** åbner
              open-plan (06–12) ved akkumuleret bevægelse (samme signal åbner
              **sove-gardinet** når soveværelset har været tomt længe nok) ·
              **🎬 Dark Mode / 🌗 Pre-Dark** lukker **alle** gardiner i de
              mørklagte rum (stue syd + stue vest + **spisestue vest** + sove)
              og stempler manuel-grace; vest køres op-og-ned så 85 %-stoppet
              altid rammes. OFF genåbner kun dem der stod åbne inden filmen —
              og kun i dagslys.

              🌇 **Aftenluk — KUN sove-gardinet (2026-09-03):**
              **{{ states('input_number.sove_gardin_aftenluk_offset_min')|int(30) }} min efter
              solnedgang** ruller sove-gardinet selv ned, hvis det ikke allerede er nede
              (privacy-niveau tæller som åbent). Kører også i AirBnB (én gang pr.
              aften — gæsten kan åbne igen), ikke under dvale-pausen, og ikke hvis
              gardinet er manuelt holdt nede.
              Vinduet er nu **{{ 'åbent' if is_state('binary_sensor.sove_gardin_aftenluk_vindue','on') else 'lukket' }}**
              (kill-switch {{ 'ON' if is_state('input_boolean.sove_gardin_aftenluk_enabled','on') else 'OFF' }}).
              De tre open-plan-gardiner er urørt — de har deres egne nat-cyklus-kontakter.
              Mens vinduet er åbent, afviser tragten `script.sove_gardin_op` **al auto-op**
              (hjemkomst, bad-gaten, morgen-backstop) — ellers ville en hjemkomst før 19:00
              annullere aftenluk hver hverdag fra oktober til marts. Knapperne (Somrig,
