# =============================================================================
# Triggers — "hvad tænder/slukker/farve-skifter hver pære automatisk" (2026-07-03)
# =============================================================================
# User-spec: "en side hvor jeg for hvert rum, for hver pære, kan se hvad der
# trigger den automatisk on, off, farveskift — så jeg nemmere kan troubleshoote.
# også for gardinerne."
#
# Dette er en KURATERET, statisk oversigt (ikke live) — de VIGTIGE hverdags-
# triggers pr. pære, i klar prosa, grupperet TÆNDER / SLUKKER / FARVE. De
# HUSDÆKKENDE ting (Dormant, AirBnB, godnat, vejr-varsler, festlys, watchdog,
# entré-Styrbar "tænd/sluk alt") gælder næsten alle pærer og står ÉN gang
# øverst i st.f. på hver pære.
#
# → Vil du se hvad der FAKTISK skete i dag (live "hvorfor tændte X"): brug
#   "Forløb"-siden (logbog med context = udløsende automation).
#
# VEDLIGEHOLD: denne side er hånd-kurateret og drifter hvis automations ændres.
# Verificér mod koden med:  python3 scripts/triggers_scan.py
# (lister pr. entity hvilke automations der tænder/slukker/farver den).
# Se standing rule i CLAUDE.md "🔀 Hold Triggers-siden opdateret".
# =============================================================================
title: Triggers
views:
  - title: Triggers
    path: triggers
    icon: mdi:call-split
    type: sections
    max_columns: 2
    sections:

      # ===================================================================
      # INTRO + HUSDÆKKENDE (gælder alle pærer)
      # ===================================================================
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Sådan læses siden
            heading_style: title
            icon: mdi:call-split
          - type: markdown
            content: |
              **Pr. pære: 🟢 TÆNDER · 🔴 SLUKKER · 🎨 FARVE/VARME** — de vigtige
              automatiske triggers. Manuel styring (app, Styrbar-klik, fysisk
              kontakt) virker altid oveni — inkl. **knapper på push-varsler**
              (2026-07-16: 🕵️-anomali-pushene kan slukke/tænde de udpegede lys
              og terrasse-pluggen når DU trykker; 💡 lys-KPI-pushen kan slukke
              det rums lys-sæt; 🚨 vandlæk-pushen kan slukke det røde bad-lys
              — alle regnes som manuel handling). Rører du selv et lys, **fryses
              rummet** et stykke tid — se ✋-punktet under 🌍 Husdækkende.

              Hver pære har en **🔎 Tal**-linje med de FAKTISKE grænser (hvilken
              sensor, hvilket lux-tal, hvor længe tomt før sluk) — så du kan se
              *hvorfor* en lampe ikke tændte.

              Vil du se hvad der *faktisk skete* live (og hvorfor lys evt.
              forbliver slukket lige nu) → brug **Forløb**-siden.

          - type: markdown
            content: |
              ## 🔎 Sådan læses tallene
              **🟢 Tallene i 🔎 Tal-linjerne er LIVE** — de er de faktiske aktuelle
              værdier (inkl. dine slider-indstillinger + tid på dagen), ikke
              defaults. De opdaterer sig selv når du ændrer en slider, eller når
              lux/sol skifter. "lux nu (aktuel) vs tærskel" = tænder kun hvis
              den aktuelle lux er UNDER tærsklen.

              - **Lux-tal er DAG-bevidste:** når solen er over horisont ("dag")
                bruges det LAVE tal, ellers nat/tusmørke-tallet — fx
                `< 20 (dag) / < 40 (nat)`. Er der mere lys end tallet, tænder
                lampen ikke. Alle lux-tærskler ganges med **LUX-følsomhed**-
                slideren (default ×1.0; skru op → tænder ved mere lys).
              - **Sluk-tider** (fx "tom 20 min") ganges med **Sluk-aggressivitet**-
                slideren (default ×1.0). "Tom" = Apollo-radaren ser INGEN — hverken
                bevægelse eller en stille krop — i hele perioden.
              - **Ingen sol-gate:** sofa-zonen tænder alene på stuens lux-gate,
                hele døgnet — som spisestue- og køkken-loftet. **Manuel tænd
                virker altid.**
                (Natlys = det dæmpede godnat-lys, kun bad — slutter nu ved det
                TIDLIGSTE af kl. {{ states('input_datetime.badevaerelse_dagmode_senest')[:5] }}
                (`badevaerelse_dagmode_senest`) eller når open-plan-lux ≥
                {{ states('input_number.badevaerelse_dagmode_lux')|float(20)|round(0) }} lx om morgenen,
                IKKE længere afhængigt af godnat-clear.)
              - Lux-kilde open-plan = `sensor.open_plan_lux` (Apollo-målt);
                soveværelse + børneværelse bruger deres EGNE Apollo-lux-sensorer.
              - ☀️ **2026-09-03: `open_plan_lux` måler DAGSLYS, ikke "alt lys".**
                Den var snittet af spisestue- og køkken-Apolloen — to rå kanaler
                der begge ser husets egne lamper. Målt 06:28 med lyskæden tændt
                og mørke ude: køkken 76,8 lx og spisestue 56,0 → snit **66,4**,
                mens den immune entré-VALLHORN stod på **3,0**. Det blokerede
                stuens tænd-gate og fyrede samtidig dagslys-sluk, så
                spisestue-loftet tændte og blev dræbt to gange på ti minutter.
                Nu tæller en kilde kun som dagslys-vidne hvis vores eget lys
                ikke kan lyse ind i den: **køkkenet via den lyskæde-fradragne
                `koekken_dagslys_lx`**, og **spisestuen kun når hverken dens
                egne lamper eller køkkenlyset er tændt** (dens lampe-fradrag er
                aldrig målt → B110). Er ingen kilde et gyldigt vidne, bæres
                tallet af fallback-kæden **entré-VALLHORN → sove → stue**,
                rangeret efter immunitet.
              - 💡 **Apollo-LED-kompensation (2026-07-30):** Apolloens indbyggede
                varsels-RGB (blå regn / rød batteri) lyser ind i sin EGEN lux-chip
                — målt **+404 lx i sove** og **+489 lx i køkken** ved den blå
                regn-farve, brightness 204. På varsels-morgener så systemet derfor
                et badet-i-lys rum og nægtede at tænde. **ALLE lux-beslutninger
                læser nu `sensor.<rum>_lux_reel`** — aldrig `_apollo_lux` — og alle
                FEM Apolloer har en kompenseret sensor, også dem uden varselsrolle
                i dag. Fradraget er farve-, styrke- og rum-opløst (grønt måles ~3×
                blåt, rødt ~1/5; ESPHome-gamma 2,9 på både kanal og brightness) og
                er 0 når LED'en er slukket; kalibreres på Indstillinger →
                🔧 Kalibrering. Lige nu blænder
                **{{ states('sensor.apollo_led_lux_fradrag') }}** Apollo(er) sig
                selv{% if states('sensor.apollo_led_lux_fradrag')|int(0) > 0 %}
                — fradrag: {{ state_attr('sensor.apollo_led_lux_fradrag','fradrag') }}{% endif %}.

          - type: markdown
            content: |
              ## 🌍 Husdækkende — gælder (næsten) ALLE pærer
              Disse står ikke gentaget under hver pære nedenfor:

              - 🔴 **Dormant (huset "sover"/tomt)** slukker ALT lys. Udløses af:
                ingen aktivitet de sidste
                {{ states('input_number.dormant_skema_hverdag_vindue_minutter')|int(45) }} min
                før kl. {{ states('input_datetime.dormant_skema_hverdag_tid')[:5] }} hverdage
                {{ '' if is_state('input_boolean.dormant_skema_hverdag_enabled','on') else '(SLÅET FRA)' }}
                · weekend-stearinlys
                ({{ states('input_number.dormant_skema_weekend_minutter')|int(60) }} min ro,
                {{ states('input_datetime.dormant_skema_weekend_start')[:5] }}–{{ states('input_datetime.dormant_skema_weekend_slut')[:5] }}
                {{- '' if is_state('input_boolean.dormant_skema_weekend_enabled','on') else ', SLÅET FRA' }}) · 3 t ingen fysisk aktivitet · GPS >1 km i 30 min · home-flags
                off 30 min · **"Activity" idle i
                {{ states('input_number.dormant_idle_minutes')|int(60) }} min med
                lukkede yderdøre i dag-vinduet
                {{ states('input_datetime.dormant_idle_dagstart')[:5] }}–{{ states('input_datetime.dormant_idle_dagslut')[:5] }}**
                (fyrer ALDRIG om natten — beskytter os når vi ligger stille;
                slider `dormant_idle_minutes`, 0=fra) · **entré-Styrbar kort-NED
                → ét tjek {{ states('input_number.entre_ned_dormant_minutter')|int(15) }}
                min senere**: tomt hus + terrassedør lukket + wasp OK → Dormant
                (slider `entre_ned_dormant_minutter`, 0=fra; annulleres ved nyt
                entré-tryk). NB: **åben terrassedør = "på terrassen"** — Activity
                kan aldrig være idle mens den står åben (2026-07-09).
              - 🐝 **Wasp-guard:** de rene inaktivitets-veje ovenfor (09:30 /
                weekend / 3 t / idle-dagsregel / entré-NED-tjekket) kræver nu at **hoveddøren har
                været åbnet** siden nogen sidst slog sig ned indenfor — ellers
                BLIVER huset Active (ligger du stille i sofaen er du ikke "gået
                ud"). **Kun hoveddøren tæller** (terrasse = stadig hjemme).
                GPS-væk tæller også som udgang. Kill-switch +
                status (`binary_sensor.wasp_dormant_allowed`) på Indstillinger.
              - 💡 **AirBnB-Dormant slukker PR. RUM, ikke `alt` (2026-09-09):**
                `script.airbnb_dormant_lys_sweep` freder de lys hvis eget rum
                har en **blind** occupancy-kanal (gæsterne slukker
                væg-kontakter, og Apolloen sidder på samme kontakt som lyset).
                Levende kanal → slukkes som før. Et fredet rum slukkes så snart
                kanalen er tilbage og melder tomt i 2 min. Kaldes af både
                sensor-vejen og check-in-knappen. **Siden 2026-09-11 gælder det
                BEGGE sluk-veje** — `airbnb_no_presence_60min_off` slukkede før
                `light.alle_indvendige` råt, altså uden fredning og uden
                bad-veto.
              - ⏱️ **AirBnB→Dormant måler ro på et anker der ikke kan slettes
                af et blip (2026-09-11):** kravet var "hver levende kanal `off`
                i 90 min" = 90 min med NUL radar-flanker, og stue-Apolloens
                spøgelser (hvert ~5. min i et tomt hus) gjorde det
                uopfyldeligt — huset stod Active i 21,6 t. Nu kræves
                `sensor.last_sustained_presence` ≥ 90 min gammel; den flyttes
                kun af en presence-flanke der holder i
                {{ states('input_number.sustained_presence_seconds')|int(120) }} s
                (slider, 0=fra). Samme anker bruges af Normal-modes
                idle-dagsregel.
              - 🔴🎨 **AirBnB-mode:** slukker alt efter 60 min uden gæster; ved
                strøm-tilbage tændes lys lux-tilpasset (bad = fuld). Depot +
                børneværelse tænder ALDRIG i AirBnB. **Nat-mode (2026-07-12):**
                godnat/godmorgen-knapperne + nattur-dim virker for gæster; bruger
                de dem ikke sætter huset selv godnat ved ro om natten (slukker
                glemte fælles-lys, transition 10 s — rører aldrig sove-loft +
                bad-spots) og clearer ved aktivitet/hoveddør/12:00.
                Dormant→welcome dæmpes til slider-% under natmode.
              - 👋 **AirBnB velkomst-ceremoni (2026-09-04):** gæsternes FØRSTE
                hoveddør-åbning (armeret 1 t efter mode-skift, kræver 24 t
                Normal først) tænder **entré → open plan → bad → soveværelse**
                forskudt i varmt 2500 K på slider-styrke. Rummene står i Manual
                i ceremoni-vinduet — presence-lys og køkken-lyskædens enforcer
                er begge gatet. **Til sidst slukkes de zoner der aldrig havde
                bevægelse** i vinduet (radar/PIR latches undervejs; badet er
                vetoet af sluk-alt-undtagelsen), og alle rum slippes til Auto,
                hvor normal presence overtager. Kun i AirBnB, én gang pr. ophold.
              - 🌙 **Godnat** (sove-knap kort-ned / Somrig lang-ned): slukker +
                nat-gater bevægelses-lys → kun natlys/nattur lyser. **Springer
                badet over** hvis nogen sidder derinde bag lukket dør (wasp,
                2026-07-16) — badet slukker selv når døren åbnes. Gælder også
                auto-godnat.
              - 🌅 **Fælles-rummene må vågne fra 05:00 (nyt 08-21).** Godnat
                slipper normalt open-plan kl. 06:00. Står en VOKSEN op før det
                — entré-bevægelse mellem 05:00 og 06:00, og han er STADIG i
                stuen 3 min senere (så en nattur til badet ikke tæller) — så
                slippes stue, spisestue, køkken og entré fri med det samme, og
                nattur-dæmpningen holder op med at behandle ham som en der er
                på vej i seng igen. **Soveværelse + børneværelse bliver i
                godnat** til den normale 06:00-oprydning; et barn der løber ud
                i spisestuen tæller ikke som en voksen. Intet godnat-flag
                ryddes tidligt. Sover der en gæst i open-plan (Sleep Over),
                springes det hele over. Status nu:
                {{ 'fælles-rum FRI ✓' if is_state('binary_sensor.godnat_faelles_morgen_fri','on') else 'nat-gated' }}{% if states('input_datetime.voksen_oppe_at')[11:] != '00:00:00' and states('input_datetime.voksen_oppe_at')[:10] == now().strftime('%Y-%m-%d') %} — voksen stemplet oppe {{ states('input_datetime.voksen_oppe_at')[11:16] }}{% endif %}.
              - 🛋️ **Sleep Over — gæst sover i open-plan** (Indstillinger →
                🌙 Søvn eller Lys-siden, kontakten "Gæst sover i open plan"): fra
                godnat og indtil **nogen trykker stue-Styrbar OP** tænder INTET
                automatisk i open-plan: spisestue-loft, alle sofa-lamper,
                køkken-lyskæde + spots. Det spærrer presence-tænd, lux-fald-tænd,
                **nattur-lyset**, **velkomstlyset** ved hoveddøren og børnenes
                weekend-morgenlys i stuen. En vagt slukker igen hvis noget
                automatisk alligevel tænder.
                🆕 **08-23 — gardinerne er med:** når mørket træder i kraft
                **lukkes stue syd + stue vest + spisestue vest**, og de holdes
                nede hele natten (`gardiner_manual_hold`) — også selvom
                nat-cyklus-knapperne står OFF. 🆕 **10-18:** slås kontakten
                til mens mørket allerede gælder (fx om morgenen), **slukkes
                open-plan, entré, køkken-spots og terrasse straks** som ved
                gæste-O (rummene i Manual til OP). **Styrbar stue OP** slipper det
                hele: room_mode stue → Auto, gardinerne ruller op igen (kun hvis
                solen er oppe — et tryk kl. 03 starter ingen motorer).
                Backstop hvis ingen trykker:
                **{{ states('input_datetime.sleepover_morgen_slut')[:5] }}**
                (`sleepover_morgen_slut`).
                **Manuel tænd (app/Styrbar/kontakt) vinder altid**, og
                bad/entré/soveværelse/børneværelse er urørt; kill-switch =
                `sleepover_enabled`.
                🆕 **09-19 — knappen står nu også på LYS-SIDEN i stue-kortet**
                ("Gæst sover her"), og **et Styrbar-tryk om AFTENEN rydder ikke
                længere holdet**: OP slipper kun mens mørket faktisk er i kraft
                (fra godnat til backstoppen). Armerer man kl. 20 og dæmper
                stuen bagefter, står gæste-holdet stadig — målt 16 af 49
                stue-Styrbar-tryk ligger i 20-21.
                🆕 **09-04 — huset ARMERER SELV, og bevægelse slipper det.**
                Ligger nogen i stuen sammenlagt mere end
                **{{ states('input_number.sleepover_auto_minutter')|int(10) }}
                min** inden for en rullende time mellem **00:30 og 05:00**
                og open-plan-lyset har været slukket ≥ 6 min (09-28), tændes
                gæste-mørket automatisk (`sleepover_auto_arm`) — målt
                over 12 nætter: normale nætter 0,0-0,3 min, gæste-natten 21,7.
                Frossen-ghost-guarden holder møbler ude. **Gardinerne rører sig
                IKKE ved en auto-armering om natten** (ingen Somfy-motorlarm ved
                en sovende gæst) — de følger først mørket når solen er oppe.
                **Ny udgang:** ægte gang (moving-target ≥ 3 s) i **spisestuen
                eller køkkenet efter kl. 06** slipper hele holdet — lys OG
                gardiner (`sleepover_morgen_bevaegelse_slip`). Alt dette virker
                ens i **Normal, Home Vacation og AirBnB**.
                🆕 **09-27 — GÆSTE-RODRET** (den tidligere stue-syd-gardin-RODRET):
                **I** = tænd open-plan + entré (80 %, 2700 K, rummene i Manual — rører IKKE soveværelset) og
                slip gæste-holdet · **O** = sluk det hele inkl. køkken-spots og terrassens pærelyskæde, og
                **kl. 18-06 armerer O Sleep Over med det samme** (ikke først ved
                godnat) — og så holdes **også entréen mørk** natten over ·
                🆕 **stue-Styrbar langt NED kl. 20-06** gør det samme som O
                (ikke i AirBnB); næste OP tænder lyset, slipper holdet og giver
                open-plan **Auto** · 🆕 **10-19:** ser stue-radaren ikke over
                {{ states('input_number.sleepover_ned_bevis_sekunder') | int(0) }} s inden for
                {{ states('input_number.sleepover_ned_bevis_minutter') | int(0) }} min
                efter et NED der selv slog holdet til, slippes det igen (det
                var bare "alt fra" — gardinerne røres ikke)
                — 🆕 og så længe en gæst sover i open-plan (uanset hvordan Sleep
                Over blev slået til) tænder INGEN automatik i **open-plan, entré
                eller terrasse**: hjemkomst ved hoveddøren, entré-bevægelse,
                terrassens skumrings-tænd og AirBnB outdoor-zen er spærret, og
                vagten slukker resten. Manuelt tryk (Styrbar/app/kontakt) og
                røgalarm vinder altid.
                Status nu: {{ 'MØRKLAGT ✓' if is_state('binary_sensor.sleepover_openplan_moerkt','on') else 'ikke aktiv (' ~ state_attr('binary_sensor.sleepover_openplan_moerkt','aarsag') ~ ')' }} · auto-spor: {{ state_attr('binary_sensor.sleepover_gaest_sporet','aarsag') }}.
              - 🎨 **Vejr-varsel** (regn/sne/vind/UV): farve-glimt i open-plan
                **farve**pærer — **ÉN gang pr. morgen og én pr. aften** (09-19),
                i det første minut inde i vinduet (morgen START→SLUT, live
                06:30→08:30; aften fyring 1→3, live 16:30→17:30) hvor
                `binary_sensor.open_plan_varsel_publikum` er `on` = akkumuleret
                open-plan-tilstedeværelse over tærsklen OG nogen er der NU. Er
                der ingen hele vinduet: intet blink — **pushen kommer alligevel**.
                Morgen: venter til begge voksne er oppe (B209), højst
                `varsel_morgen_max_vent_minutter` efter første afgang fra
                soveværelset — så kommer blink, oplæsning og regnsang alligevel.
                Starter/slutter med 5 s varm-hvid "bookend".
                **Klokkeslæt** (morgen 6 felter + 3 aften-tider), **antal blink +
                farve pr. type** tunes alle på Indstillinger (regn/UV = hue,
                sne/vind = kelvin; regn-hue driver også Apollo-RGB, hvis tid = eget
                felt; 0 blink = mut den type). Selve blinkene sendes 08-30 til
                husets to eneste ZHA-**grupper** (`Vejrvarsel morgen`/`aften`) =
                ét radio-frame til alle pærer i stedet for ét pr. pære. Aften har
                sin egen gruppe fordi læsehygge bevidst ikke er med om aftenen.
                De tre strømløse stue-pærer (B91) er ikke i grupperne og blinker
                derfor ikke med, før de har fået strøm og er tilføjet.
                Efter blinket **spørger afleveringen huset igen** (20-09): har
                dagslys-proben slukket open-plannet MENS blinket kørte, bliver
                det slukket — det ~40 s gamle snapshot ruller ikke længere
                probens beslutning tilbage.
              - 💧 **Dug-varsel på Apollo-RGB** (nyt 06-08): venter der våde
                hynder i nat, **blinker stue- + køkken-Apolloens** LED blåt i
                eget aften-vindue (default 19→22, egne felter på Indstillinger).
                Samme blå som regn — adskilles på TIDSPUNKT, ikke farve.
              - 🔔 **Alle tre RGB-varsler blinker nu** (16-08, user-spec:
                *"forbudt at være full on"* + *"longer breaks between the
                blinks"*). Dug, regn og kritisk batteri deler ÉN styrke og ÉN
                blink-kadence (Indstillinger → 🚨 Varsler → *Vejr — blink
                og farver*): 2 glimt à 2 sek pr. minut, **slukket 93 % af
                tiden**. Prioritet **batteri-rød > regn > dug**, afgjort ét sted
                (`sensor.apollo_rgb_varsel`) i stedet for af seks automationer
                der skelnede på farve+styrke. Konstant "full on" er afskaffet:
                ved 80 % lyste LED'en **+489 lx ind i Apolloens egen lux-sensor**
                og clampede `koekken_lux_reel` til 0, hvilket trak open-plan-lux
                — og dermed entré-lyset — med ned. **Godnat slukker alle tre**,
                og batteri-rød er nu AirBnB-gatet som sine to søskende.
              - 🎨 **Festlys / Legetøjsdag-disko:** effekt-loops i de valgte
                dance-rum (default kun Stue) hhv. første åbne-fredag i måneden.
                Disko fyrer efter morgen-vejrvarslerne (følger blink-vindue START)
                og har egne sliders (antal steps + basis-hue) på Indstillinger.
                **Scope (rettet 02-08):** festen sætter kun de VALGTE rum på
                Manual — rum uden dance-flueben kører presence-lys helt normalt
                imens. Før frøs den alle seks rum uanset valg. **Rettet 07-08:**
                et tryk på Festlys-tilen sætter ikke længere alle seks rum
                Manual (dance ejer selv sit scope), og et **låst** event
                stopper nu selv efter `dance_manual_event_max_minutter`
                (45 min) i stedet for at køre til nogen slukker det manuelt.
                **Rettet 16-08:** START er stadig smalt (kun de valgte rum),
                men SLUK af festlys sætter nu **alle 9 rum på Auto** — også
                dem der stod Manual før festen. Slukker du huset fra en
                alle-lys-knap inden for 3 min efter, tælles det som oprydning
                og låser ikke rummene Manual igen (slukker du ét enkelt rums
                lys, er det stadig en ægte overstyring).
                **Rettet 23-09:** sluk/stop/skift af event virker med det samme
                (før kørte det igangværende event færdigt — målt 25 s efter
                "off"). Ved fest slut **slukker** festens pærer, og rum hvor
                presence ser nogen, tænder igen i deres normale Auto-look (før
                blev disko-farverne stående i tomme rum). Rum-skift midt i festen
                rører kun det rum.
                🌊 **Smooth Mode (2026-08-19, ingen kontakt):** står **BEGGE**
