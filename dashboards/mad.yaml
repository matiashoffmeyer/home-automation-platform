# =============================================================================
# Mad — kontrolpanel: opskrifter, indkøb, afstemning, Nemlig (2026-07-29;
# genskabt 2026-09-30)
# =============================================================================
# 2026-09-30 (user): "indstillingerne skal være på indstillinger siden men
# kontrolpanelet skal igen ha sin egen side ... simple kontrol paneler, i stil
# med lys siden." → HER bor kun det man bruger i hverdagen (opskrifter,
# stemmeknapper, indkøbslisten, Nemlig-knapperne, statistik). ALLE sliders og
# til/fra (daglige spørgsmål, påmindelser, indkøbsliste-planen, Nemligs
# valg-regler) er fanen 🥘 Mad i dashboards/settings.yaml — badget i første
# overskrift linker derhen. View-stierne er de samme som før 2026-09-30, så
# pushene fra scripts/mad_planner.py (/mad-dash/0, /mad-dash/afstemning) og
# bogmærker lander rigtigt.
#
# Katalog + stemmer bor i Google Sheets; scripts/mad_planner.py sender dagens
# ret-spørgsmål til begge telefoner (JA!/SUPERJA!/NIX!) og hver N. ugedag en
# samlet indkøbsliste. Helpers + shell_commands i packages/mad_planlaegning.yaml,
# scheduler i automations/mad_planlaegning.yaml.
# Opskrift-kortene er DUMME: hele formatet bygges i mad_planner.opskrift_md()
# og leveres som `md` pr. ret (fejlklasse #2). Hver opskrift står i sin egen
# SUBVIEW (`opskrift-1..16`) — Lovelace kan IKKE rulle til et kort på samme
# side, så link-til-underside er den eneste "tag mig til retten". 16 slots
# fordi kurven vælges på VÆGT (tilbehør = ½).
# ⚠️ Slottenes `visibility` SKAL være `numeric_state` mod antallet i
# sensor.mad_opskrifter — Lovelace har INGEN template-betingelse (en
# `condition: template` afvises tavst og skjuler kortet for altid).
#
# Lovelace mode: yaml — registreret i configuration.yaml (mad-dash).
# =============================================================================
title: Mad
icon: mdi:silverware-fork-knife
views:
  - title: Opskrifter
    path: opskrifter
    icon: mdi:chef-hat
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Ugens opskrifter
            icon: mdi:chef-hat
            heading_style: title
            badges:
              - type: button
                text: Indstillinger
                icon: mdi:cog
                tap_action:
                  action: navigate
                  navigation_path: /indstillinger-dash/mad
              - type: entity
                entity: sensor.mad_opskrifter
              - type: entity
                entity: sensor.mad_naeste_indkoeb
          # 2026-10-01 (user): "det skal være tydeligt på mad siden når retter
          # blev lagt på indkøbslisten uden at vi begge havde sagt ja til den.
          # fx jordskokkesuppe". ⚠️ på linjen + én samlet advarsel under listen.
          # Teksten bygges i mad_planner.godkendelse() (eneste ejer) og følger
          # stemmerne: et svar republicerer sensoren via mode_refresh.
          - type: markdown
            content: |-
              {% set r = state_attr('sensor.mad_opskrifter','opskrifter') or [] %}
              {%- if not r %}
              _Ingen retter har været på en indkøbsliste endnu. Tryk **Lav indkøbsliste nu** under Indkøb, så står opskrifterne her._
              {%- else %}
              {%- for d in r %}
              {%- set mk = ' ⚠️' if d.markering | default('') else '' %}
              {%- if loop.index <= 16 %}
              {{ loop.index }}. [{{ d.linje }}](/mad-dash/opskrift-{{ loop.index }}){{ mk }}
              {%- else %}
              {{ loop.index }}. {{ d.linje }}{{ mk }} — _(ingen underside: listen er længere end 16 retter)_
              {%- endif %}
              {%- endfor %}
              {%- set uden = r | selectattr('markering', 'defined') | selectattr('markering') | list %}
              {%- if uden %}

              <ha-alert alert-type="warning" title="{{ uden | count }} {{ 'ret' if uden | count == 1 else 'retter' }} uden ja fra jer begge">
              {%- for d in uden %}
              <b>{{ d.ret }}</b> — {{ d.markering }}<br>
              {%- endfor %}
              </ha-alert>
              {%- endif %}
              {%- endif %}
