            icon: mdi:help-circle-outline
            heading_style: subtitle
          - type: markdown
            content: |-
              {% set q = 'sensor.mad_seneste_spoergsmaal' %}
              {%- set r = state_attr(q,'retter') or [] %}
              {%- if not r %}
              _Ingen spørgsmål sendt endnu._
              {%- else %}
              _sendt {{ state_attr(q,'sendt') }}_
              {%- for d in r %}

              **{{ d.ret }}** ({{ 'børnevenlig' if d.boernevenlig == 'Ja' else 'voksen' }}, {{ d.svaerhedsgrad | lower }})

              {{ d.ingredienser }}
              {%- endfor %}
              {%- endif %}
          - type: button
            name: Spørg nu
            icon: mdi:comment-question-outline
            tap_action:
              action: perform-action
              perform_action: shell_command.mad_spoergsmaal
          - type: markdown
            content: |-
              Svar i notifikationen — eller her. **NIX** = retten kommer aldrig igen.

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Afstemning
            icon: mdi:poll
            heading_style: title
            badges:
              - type: entity
                entity: sensor.mad_status
          - type: markdown
            content: |-
              {% set s = 'sensor.mad_status' %}
              {%- if states(s) in ['unknown','unavailable','None'] %}
              _Afventer første kørsel. Tryk "Opdatér nu" under Stats._
              {%- else %}
              ✅ **{{ state_attr(s,'godkendt') }}** godkendt · ⏳ **{{ state_attr(s,'afventer_svar') }}** afventer svar · 🚫 **{{ state_attr(s,'afvist') }}** afvist · 📚 {{ state_attr(s,'i_alt') }} retter i kataloget

              _opdateret {{ state_attr(s,'opdateret') }} · kilde: {{ 'Google Sheet (skriveadgang)' if state_attr(s,'skriveadgang') else 'CSV — LÆS-ONLY, stemmer gemmes kun lokalt' }}_
              {%- set b = state_attr(s,'balance') or {} %}
              {%- if b %}

              **Balance i den godkendte pulje**
              {%- for k in b | sort %}
              - {{ k }}: **{{ b[k] }}**
              {%- endfor %}
              {%- endif %}
              {%- set v = state_attr(s,'afventer') or [] %}
              {%- if v %}

              **Afventer svar** (M = Parent A, C = Parent B)
              {%- for r in v %}
              - {{ r }}
              {%- endfor %}
              {%- endif %}
              {%- endif %}
          - type: markdown
            content: |-
              {% set sv = state_attr('sensor.mad_status','seneste_svar') or [] %}
              **🗳️ Seneste 10 svar**
              {%- if sv %}
              {%- for r in sv %}
              - {{ r.dato }} · **{{ r.ret }}** — M: {{ r.parent_a }} · C: {{ r.parent_b }} → _{{ r.status }}_
              {%- endfor %}
              {%- else %}
              _Ingen svar registreret endnu._
              {%- endif %}

