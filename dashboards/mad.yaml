  - title: Afstemning
    path: afstemning
    icon: mdi:vote
    type: sections
    max_columns: 2
    sections:

      # -----------------------------------------------------------------------
      # 2026-08-20: stem direkte fra siden — én blok pr. ret, én liste pr.
      # person. Notifikations-knappen er et kald TILBAGE til HA og kan tabes
      # tavst (Parent B manglede 12 svar, Parent A 1); er man inde på DENNE side,
      # kan man pr. definition nå HA.
      #
      # Hvorfor to lister frem for én med skjulte knap-rækker: Lovelace-
      # `visibility` kan hverken template eller `attribute:` — kun `state` og
      # `numeric_state` på selve state'en — og en ukendt nøgle skjuler kortet
      # TAVST. Første forsøg gatede knapperne på `attribute: m_1` og gav en side
      # helt uden knapper ("kn ikke stemme i app"). Nu står antallet der mangler
      # i hver sin sensors STATE, så `numeric_state above N-0.5` er nok.
      #
      # Slot 1-8 er faste kort: kortet viser `linje_N`, knappen sender kun sit
      # slot-NUMMER, og mad_planner slår retten op i samme sensor-attribut som
      # kortet blev tegnet efter — kort og knap kan derfor ikke divergere.
      # 2026-10-14 (user: "svært at trykke rigtigt på nr 2 fordi det hopper
      # rundt"): en besvaret ret BLIVER i sit slot med svaret påskrevet så længe
      # man stemmer (STEM_HOLD_MIN i mad_planner.py) — state = viste poster,
      # attributten `mangler` = det overskriften tæller.
      # -----------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Parent A skal svare
            icon: mdi:vote
            heading_style: subtitle
          - type: markdown
            content: |-
              {% set n = state_attr('sensor.mad_stem_parent_a','mangler') | int(states('sensor.mad_stem_parent_a') | int(0)) %}
              {%- if n == 0 %}
              _Parent A har svaret på alt._
              {%- else %}
              **Parent A** mangler at svare på {{ n }} ret(ter).
              **NIX** afviser retten for jer begge · **SUPERJA!** sikrer den en plads på næste liste.
              {%- endif %}
          - type: markdown
            content: "{{ state_attr('sensor.mad_stem_parent_a','linje_1') }}"
            visibility:
              - condition: numeric_state
                entity: sensor.mad_stem_parent_a
                above: 0.5
          - square: false
            type: grid
            columns: 3
            visibility:
              - condition: numeric_state
                entity: sensor.mad_stem_parent_a
                above: 0.5
            cards:
              - type: button
                name: JA!
                icon: mdi:thumb-up
                tap_action:
                  action: perform-action
                  perform_action: shell_command.mad_stem_slot
                  data:
                    slot: 1
                    person: parent_a
                    svar: JA
              - type: button
                name: SUPERJA!
                icon: mdi:star
                tap_action:
                  action: perform-action
                  perform_action: shell_command.mad_stem_slot
                  data:
                    slot: 1
                    person: parent_a
                    svar: SUPERJA
              - type: button
                name: NIX!
                icon: mdi:thumb-down
                tap_action:
