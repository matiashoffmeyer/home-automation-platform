            heading: Tabte svar-tryk
            icon: mdi:reload-alert
            heading_style: subtitle
          - type: markdown
            content: |-
              {% set a = state_attr('sensor.mad_status','mangler_parent_a') %}
              {%- set b = state_attr('sensor.mad_status','mangler_parent_b') %}
              **Mangler svar fra Parent A:** {{ a if a is not none else '—' }}
              · **fra Parent B:** {{ b if b is not none else '—' }}
          # (Var synlig tekst til 2026-09-30:) ⚠️ Svar-knapperne i
          # notifikationen kræver hjemme-wifi eller Tailscale — ellers når
          # svaret ikke frem, og huset spørger igen.
  - title: Nemlig
    path: nemlig
    icon: mdi:basket
    type: sections
    max_columns: 2
    sections:

      - type: grid
        cards:
          - type: heading
            heading: Nemlig-kurven
            icon: mdi:basket
          - type: markdown
            content: |-
              Der bestilles aldrig herfra — levering og betaling vælges i Nemlig-appen. Minimum **500 kr**.
          - type: entities
            entities:
              - entity: sensor.nemlig_kurv
                name: Sidste kørsel
              - type: attribute
                entity: sensor.nemlig_kurv
                attribute: total
                name: Kurv-total (kr)
              - type: attribute
                entity: sensor.nemlig_kurv
                attribute: aabne_spoergsmaal
                name: Ubesvarede spørgsmål
          - type: markdown
            content: |-
              {% set a = state_attr('sensor.nemlig_kurv','regnskab') %} {% if a %} 🌱 **Øko:** {{ a.oeko_antal }}/{{ a.varer }}{% if a.merpris_oeko %} (+{{ a.merpris_oeko | round(0) }} kr){% endif %} &nbsp;·&nbsp; 🏷️ **Tilbud:** {{ a.tilbud_antal }}/{{ a.varer }}{% if a.besparelse_est %} (−{{ a.besparelse_est | round(0) }} kr){% endif %} {% else %} Ingen kørsel endnu. {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: "Nemlig: kør"
            icon: mdi:play
          - type: markdown
            content: Tager ca. 1½ minut. **Tryk kun én gang.**
          - type: button
            name: Vis parring (skriver intet)
            icon: mdi:magnify-scan
            tap_action:
              action: perform-action
              perform_action: shell_command.nemlig_kurv_vis
          - type: button
            name: Læg listen i kurven
            icon: mdi:cart-arrow-down
            tap_action:
              action: perform-action
              perform_action: shell_command.nemlig_kurv_nu
          - type: button
            name: TILFØJ BASISVARER
            icon: mdi:basket-plus-outline
            tap_action:
              action: perform-action
              perform_action: shell_command.nemlig_basis
          - type: markdown
            content: |-
              **Basisvarer:** 1 l sødmælk · 2 l minimælk · smør · ost i blok · 6 bananer · cherrytomater. Lægges oven i listen, ikke i stedet for.
          - type: button
            name: Fjern vores varer igen
            icon: mdi:cart-remove
            tap_action:
              action: perform-action
              perform_action: shell_command.nemlig_kurv_ryd
          - type: button
            name: TØM HELE kurven
            icon: mdi:cart-off
            tap_action:
              action: perform-action
              perform_action: shell_command.nemlig_toem_alt
            confirmation:
              text: >-
                Tømmer HELE Nemlig-kurven — også varer du selv har lagt i.
                Sikker?
          - type: button
            name: Test forbindelsen
            icon: mdi:lan-connect
            tap_action:
              action: perform-action
              perform_action: shell_command.nemlig_ping
          - type: markdown
            content: |-
              *Fjern vores varer* rører kun det huset selv lagde i — *Tøm hele kurven* også dine egne.

      - type: grid
        cards:
          - type: heading
            heading: "Nemlig: basisvarer"
            icon: mdi:basket-fill
          - type: markdown
            content: >-
              {% set v = state_attr('sensor.nemlig_kurv','varer') or [] %} {% set
              b_alle = v | selectattr('kilde','defined') |
              selectattr('kilde','eq','basis') | list %} {% set ok = b_alle |
              selectattr('status','eq','ok') | list %} {% if b_alle %} {% for b
              in ok %} 🧺 {{ b.antal }}× **{{ b.produkt }}** — {{ b.navn }}{% if
              b.oeko %} 🌱{% endif %}{% if b.tilbud %} 🏷️{% endif %}

              {% endfor %} {% set rest = b_alle |
              rejectattr('status','eq','ok') | list %} {% if rest %}

              **Ikke lagt i ({{ rest | count }}):** {% for b in rest %}{{ b.navn
              }}{% if not loop.last %}, {% endif %}{% endfor %}
              {% endif %} {% else %} Basis-knappen er ikke trykket endnu — den
              faste liste ligger ikke i kurven. {% endif %}

          - type: heading
            heading: Fra opskrifterne
            icon: mdi:silverware-fork-knife
          - type: markdown
            content: >-
              {% set v = state_attr('sensor.nemlig_kurv','varer') or [] %} {% set
              l_alle = v | rejectattr('kilde','eq','basis') | list %} {% if
              l_alle %} {% for b in l_alle if b.status == 'ok' %} 🍽️ {{ b.antal
              }}× **{{ b.produkt }}** — {{ b.navn }}{% if b.oeko %} 🌱{% endif
              %}{% if b.tilbud %} 🏷️{% endif %}

              {% endfor %} {% set rest = l_alle |
              rejectattr('status','eq','ok') | list %} {% if rest %}

              ---

              **Ikke lagt i kurven ({{ rest | count }}):**

              {% for b in rest %} • {{ b.navn }} — {% if b.status == 'udsolgt'
              %}udsolgt{% elif b.status == 'ingen_traef' %}ingen produkter
              fundet{% else %}usikker{% endif %}

              {% endfor %} {% endif %} {% else %} Ingen kørsel endnu — tryk *Vis
              parring* for at se hvad listen ville blive til. {% endif %}

          - type: markdown
            content: |-
              I kurven nu: **{{ state_attr('sensor.nemlig_kurv','basis_antal') | default(0) }}** 🧺 basisvarer · **{{ state_attr('sensor.nemlig_kurv','liste_antal') | default(0) }}** 🍽️ fra opskrifter.
  - title: Stats
    path: stats
    icon: mdi:chart-pie
    type: sections
    max_columns: 2
    sections:

      - type: grid
        cards:
          - type: heading
            heading: Mad-statistik
            icon: mdi:chart-pie
          - type: markdown
            content: >-
              {{ state_attr('sensor.mad_status', 'type_fordeling_md') }}
          - type: markdown
            content: >-
              {{ state_attr('sensor.mad_status', 'saeson_fordeling_md') }}
          - type: markdown
            content: >-
              {{ state_attr('sensor.mad_status', 'sundhed_fordeling_md') }}

      - type: grid
        cards:
          - type: heading
            heading: Katalog
            icon: mdi:book-open-variant
          - type: entities
            entities:
              - entity: sensor.mad_status
                name: Status
              - type: attribute
                entity: sensor.mad_status
                attribute: i_alt
                name: Retter i alt
              - type: attribute
                entity: sensor.mad_status
                attribute: godkendt
                name: Godkendte
              - type: attribute
                entity: sensor.mad_status
                attribute: afventer_svar
                name: Afventer svar
              - type: attribute
                entity: sensor.mad_status
                attribute: ikke_spurgt
                name: Ikke spurgt endnu
          # (Var synlig tekst til 2026-09-30:) Tæller alle retter der ikke er
          # afvist. Hele året = må foreslås når som helst.

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Opdatér kataloget
            icon: mdi:wrench
            heading_style: title
          # "Spørg nu" og "Lav indkøbsliste nu" stod også her indtil 2026-09-30 —
          # de findes i Afstemning og Indkøb, hvor man bruger dem. Tilbage er
          # kun katalog-opdateringen (Google Sheets → sensor.mad_status).
          - type: button
            name: Opdatér nu
            icon: mdi:refresh
            tap_action:
              action: perform-action
              perform_action: shell_command.mad_refresh

