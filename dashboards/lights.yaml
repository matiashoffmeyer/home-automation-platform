# =============================================================================
# Lys Dashboard — hurtig betjening af lys og gardiner
# =============================================================================
# DESIGNREGLER (user-spec 2026-09-20 + 2026-09-29: "elegant og hurtig side",
# "kun hvad jeg har brug for at vide, ikke synlige noter til dig selv"):
#   - Kun ting man TRYKKER på. Ingen forklarings-markdown, ingen forbehold i
#     tile-navne. Forklaringer hører i Indstillinger (eller som YAML-kommentar
#     her, hvis det er et faktum en fremtidig redigering skal kende).
#   - Links til undersider = knap-badges i rummets overskrift, ikke tekst.
#   - Status-tekst (gæste-hold) vises KUN når den er aktiv (visibility).
#   - ÉN SEKTION = ÉT FYSISK RUM. Stue/køkken/spisestue er ÉT åbent rum →
#     én "Open plan"-sektion. `light.stue_all` rammer alle tre rum og må
#     aldrig hedde et mindre rum end det den styrer.
#   - ÉN TILE PR. BESLUTNING: har en gruppe kun ét medlem, vises kun gruppen
#     (sove, entré). Enkelte pærer bor på subviewen /lys-dash/paerer.
#   - SKJUL-NÅR-UNAVAILABLE (2026-06-15, user): tiles er gated på
#     `state_not: unavailable`. UNDTAGELSER: børne-strip + plug-lampe (flapper
#     på Zigbee — skal kunne ses greyet ud) og hele /lys-dash/paerer.
# Lovelace mode: yaml — registreret i configuration.yaml (lys-dash).
# =============================================================================
title: Lys
icon: mdi:lightbulb-group
views:
  - title: Lys
    path: lys
    icon: mdi:lightbulb-group
    type: sections
    max_columns: 2
    sections:
      # =====================================================================
      # ALT LYS
      # =====================================================================
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Alt lys
            heading_style: title
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.alle_indvendige
            name: Alle indendørs
            icon: mdi:home-floor-1
            visibility:
              - condition: state
                entity: light.alle_indvendige
                state_not: unavailable
          - type: tile
            entity: light.alle_lys
            name: Alle, inkl. terrasse
            icon: mdi:home-group
            visibility:
              - condition: state
                entity: light.alle_lys
                state_not: unavailable
          # Scope-undtagelse (user-spec 2026-07-02): grupperne indeholder kun
          # `light.*` — køkken-spots og terrasse-strøm er `switch.*`.
          # Børneværelsets plug-lampe ER dækket indirekte (spejler strippen).
          - type: markdown
            content: Køkken-spots og terrasse-strøm har egne knapper i deres rum.

      # =====================================================================
      # OPEN PLAN — stue · køkken · spisestue er ÉT fysisk rum
      # =====================================================================
      # `light.stue_all` = stue + køkken-lyskæde + spisestue-loft
      # (packages/light_groups.yaml).
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Open plan
            heading_style: title
            icon: mdi:sofa
          - type: tile
            entity: light.stue_all
            name: Hele open plan
            icon: mdi:lightbulb-multiple
            visibility:
              - condition: state
                entity: light.stue_all
                state_not: unavailable

          # --- STUE ---------------------------------------------------------
          # To fysiske lyspunkter + to Thread-spots (følger læselampen; hver sin
          # farve under party/dance). De tre sofa-/hjørnepærer står i et skab
          # og bor på /lys-dash/paerer.
          - type: heading
            heading: Stue
            heading_style: subtitle
            icon: mdi:sofa
          - type: tile
            entity: light.stue_laesehygge
            name: Læsehygge
            visibility:
              - condition: state
                entity: light.stue_laesehygge
                state_not: unavailable
          # Glødepære, 39 W målt — husets dyreste lyspunkt og derfor luksus-lys
          # (auto-tænd blokeres ved høj el-pris). Forbruget står på Statistik.
          - type: tile
            entity: light.stue_plug
            name: Hyggelampe
            visibility:
              - condition: state
                entity: light.stue_plug
                state_not: unavailable
          - type: tile
            entity: light.stue_spot_1
            name: Spot 1
            visibility:
              - condition: state
                entity: light.stue_spot_1
                state_not: unavailable
          - type: tile
            entity: light.stue_spot_2
            name: Spot 2
            visibility:
              - condition: state
                entity: light.stue_spot_2
                state_not: unavailable
          # Somfy-gardiner via Broadlink (RTS = envejs, ingen positions-feedback
          # — slideren styres på TID, packages/broadlink_gardiner.yaml). Vest kan
          # ikke under 15 % (gulv i script.gardin_vest_position).
          - type: tile
            entity: cover.gardin_stue_syd
            name: Gardin Syd
            features:
              - type: cover-open-close
              - type: cover-position
            features_position: bottom
            visibility:
              - condition: state
                entity: cover.gardin_stue_syd
                state_not: unavailable
          - type: tile
            entity: cover.gardin_stue_vest_1
            name: Gardin Vest
            features:
              - type: cover-open-close
              - type: cover-position
            features_position: bottom
            visibility:
              - condition: state
                entity: cover.gardin_stue_vest_1
                state_not: unavailable
          # AxiomAir N3 i sofastuen (live 2026-10-08). Skjult når den er
          # slukket (override'en gør den unavailable). Knapperne følger
          # supported_features, som override'en (custom_components/volumio)
          # skærer til det der spiller: radio = kun play/stop + volumen.
          - type: tile
            entity: media_player.hoejttaler
            name: Højttaler
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
            features_position: bottom
            visibility:
              - condition: state
                entity: media_player.hoejttaler
                state_not: unavailable
          # Scope-linjen (user 09/10: "skal fremgå tydeligt at man kun styrer
          # radioen"): tilen er Volumio. Volumen = al musik (fælles mixer);
          # play/stop = radioen — myair-pause er ubekræftet (B202). 09/10 (user:
          # "lys sidens play skal genoptage hvad end der spillede"): play
          # genoptager også MA-køen ("Spotify via HA") når Volumio sidst stod på
          # MA's flow-URL (custom_components/volumio). Live-varianten følger
          # binary_sensor.hoejttaler_spotify_aktiv. 14/10: "Højttaler via HA" i
          # Spotify slået fra i MA (user) — overriden sender stadig play/pause
          # til MA hvis den genaktiveres. 10/10: spillede myair sidst,
          # gør play intet (Volumio har glemt Spotify og ville starte radioen) →
          # mellem-linjen (attributten sidst_spillet).
          # B237 (17/10, myair fra): Spotify-broen er husets Spotify-vej, og
          # overriden sender play/pause/stop/næste/forrige til broen, som sender
          # dem videre til appen → tilen styrer Spotify fuldt. Broen genkendes
          # på Volumios uri (:8098/spotify.), også når den er pauset.
          - type: markdown
            content: >-
              {% set bro = ':8098/spotify.' in (state_attr('media_player.hoejttaler', 'media_content_id') or '') %}
              {% if bro and is_state('media_player.hoejttaler', 'playing') %}Spotify
              spiller — pause, skip og volumen virker herfra og fra appen.{% elif bro
              and is_state('sensor.spotify_bro', 'paused') %}Spotify er på pause — play
              genoptager. Radio: vælg en kanal herunder.{% elif bro %}Spotify er
              stoppet — start den fra telefonen. Radio: vælg en kanal herunder.{% elif is_state('binary_sensor.hoejttaler_spotify_aktiv', 'on') %}Spotify
              spiller — styr den fra telefonen. Her kun volumen.{% elif
              state_attr('media_player.hoejttaler', 'sidst_spillet') == 'volspotconnect2'
              %}Spotify er stoppet — start den fra telefonen. Radio: vælg en kanal
              herunder.{% else %}Play genoptager radioen. Volumen
              gælder al musik.{% endif %}
            visibility:
              - condition: state
                entity: media_player.hoejttaler
                state_not: unavailable
          # 17/10: link til Musikfarver-subviewen (stemning → farve på stue-spots).
          - type: tile
            entity: sensor.stue_spotify_stemning
            name: Musikfarver
            icon: mdi:palette
            state_content: stemning
            tap_action:
              action: navigate
              navigation_path: /lys-dash/musikfarver
            visibility:
              - condition: state
                entity: media_player.hoejttaler
                state_not: unavailable
          # B193: vælg en favorit = spil den (hoejttaler_radio_favorit_valgt;
          # kun et menneskes valg starter afspilning).
          - type: tile
            entity: input_select.hoejttaler_radio_favorit
            name: Radio
            icon: mdi:radio
            features:
              - type: select-options
            features_position: bottom
            visibility:
              - condition: state
                entity: media_player.hoejttaler
                state_not: unavailable
          # SCOPE = hele open plan (de tre rum deler ét lysrum). Knappen står også
          # i Indstillinger → Søvn. Huset armerer også selv (stue optaget ≥ N min
          # mellem 00:30 og 05:00 med open-plan-lyset slukket).
          - type: tile
            entity: input_boolean.sleepover_i_nat
            name: Gæst sover i open plan
            icon: mdi:bed-clock
          - type: markdown
            content: >-
              🌙 **Gæste-hold armeret** — mørkt fra godnat. Slippes af
              **Styrbar stue OP** eller kl. **{{
              states('input_datetime.sleepover_morgen_slut')[:5] }}**.
            visibility:
              - condition: state
                entity: input_boolean.sleepover_i_nat
                state: "on"

          # --- KØKKEN -------------------------------------------------------
          # Køkken-timeren bor på Tapo → Gestus (2026-09-19, user: "off topic").
          - type: heading
            heading: Køkken
            heading_style: subtitle
            icon: mdi:countertop
          - type: tile
            entity: light.koekken_lyskaede
            name: Lyskæde
            visibility:
              - condition: state
                entity: light.koekken_lyskaede
                state_not: unavailable
          - type: tile
            entity: switch.koekken_spots
            name: Spots
            icon: mdi:track-light
            visibility:
              - condition: state
                entity: switch.koekken_spots
                state_not: unavailable

          # --- SPISESTUE ----------------------------------------------------
          - type: heading
            heading: Spisestue
            heading_style: subtitle
            icon: mdi:table-chair
          - type: tile
            entity: light.spisestue_loft
            name: Loft
            visibility:
              - condition: state
                entity: light.spisestue_loft
                state_not: unavailable
          # Somfy RTS. Positions-slideren er UKALIBRERET (køretid = syds 25 s).
          - type: tile
            entity: cover.gardin_spisestue_vest
            name: Gardin Vest
            features:
              - type: cover-open-close
              - type: cover-position
            features_position: bottom
            visibility:
              - condition: state
                entity: cover.gardin_spisestue_vest
                state_not: unavailable

      # =====================================================================
      # SOVEVÆRELSE
      # =====================================================================
      - type: grid
        cards:
          # Or-gate så overskriften også vises hvis kun gardinet er oppe.
          - type: heading
            heading: Soveværelse
            heading_style: title
            icon: mdi:bed
            badges:
              - type: button
                icon: mdi:tape-measure
                text: Kalibrér gardin
                tap_action:
                  action: navigate
                  navigation_path: /lys-dash/gardin-kalibrering
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: light.sovevaerelse_all
                    state_not: unavailable
                  - condition: state
                    entity: cover.gardin_sovevaerelse
                    state_not: unavailable
                  - condition: state
                    entity: light.sove_lyskaede
                    state_not: unavailable
          # Gruppen har præcis ét medlem (light.spisestue_pendel = soveloftet,
          # flyttet fysisk 2026-06-05, CCT-only). Pæren selv: /lys-dash/paerer.
          - type: tile
            entity: light.sovevaerelse_all
            name: Loft
            icon: mdi:ceiling-light
            visibility:
              - condition: state
                entity: light.sovevaerelse_all
                state_not: unavailable
          - type: tile
            entity: light.sove_lyskaede
            name: Pærelyskæde
            visibility:
              - condition: state
                entity: light.sove_lyskaede
                state_not: unavailable
          # Zigbee (Tuya TS0601) med ægte positions-feedback. Syd-vendt.
          - type: tile
            entity: cover.gardin_sovevaerelse
            name: Gardin
            features:
              - type: cover-open-close
              - type: cover-position
            features_position: bottom
            visibility:
              - condition: state
                entity: cover.gardin_sovevaerelse
                state_not: unavailable

      # =====================================================================
      # BØRNEVÆRELSE
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Børneværelse
            heading_style: title
            icon: mdi:teddy-bear
            visibility:
              - condition: state
                entity: light.boernevaerelse_all
                state_not: unavailable
          # Gruppen er loft + strip. Plug-lampen er bevidst UDE (2026-06-10 —
          # gruppe-brightness flippede den non-dimmable plug og omgik natlys-
          # guarden); den følger strippen via mirror-automationen.
          - type: tile
            entity: light.boernevaerelse_all
            name: Loft + strip
            icon: mdi:lightbulb-multiple
            visibility:
              - condition: state
                entity: light.boernevaerelse_all
                state_not: unavailable
          - type: tile
            entity: light.boernevaerelse_loft
            name: Loft
            visibility:
              - condition: state
                entity: light.boernevaerelse_loft
                state_not: unavailable
          - type: tile
            entity: light.boernevaerelse_lampe
            name: Lampe
            visibility:
              - condition: state
                entity: light.boernevaerelse_lampe
                state_not: unavailable
          # ALTID synlige (ingen unavailable-gate, 2026-06-20): de flapper off
          # Zigbee, og en skjult tile lignede at de var fjernet.
          - type: tile
            entity: light.boernevaerelse_hygge_strip
            name: Hygge-strip
          - type: tile
            entity: light.boernevaerelse_hyggelys
            name: Plug-lampe
          # Måne/sol (2026-10-11): ét putte-trin ned mod natlys / ét op.
          # script.putning_trappe_ned|op — kun synlige i putte-kontekst, samme
          # gate som scriptene selv (uden for den gør et tryk intet).
          - type: tile
            entity: script.putning_trappe_ned
            name: Mørkere
            icon: mdi:weather-night
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.putning_trappe_ned
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.putning_vindue_aktivt
                    state: "on"
                  - condition: state
                    entity: input_boolean.godnat_boern_active
                    state: "on"
                  - condition: state
                    entity: input_boolean.puttelys_descent_active
                    state: "on"
          - type: tile
            entity: script.putning_trappe_op
            name: Lysere
            icon: mdi:white-balance-sunny
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.putning_trappe_op
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.putning_vindue_aktivt
                    state: "on"
                  - condition: state
                    entity: input_boolean.godnat_boern_active
                    state: "on"
                  - condition: state
                    entity: input_boolean.puttelys_descent_active
                    state: "on"
          # Slukker rummet og holder låsen mod morgen-/tomt-clears. Udgange:
          # Styrbar børn OP eller 10:00-backstoppen. Vækning er IKKE spærret.
          - type: tile
            entity: input_boolean.boernevaerelse_gaest_sover
            name: Gæst sover her
            icon: mdi:sleep
          - type: markdown
            content: >-
              🌙 **Gæste-hold aktivt** — alt auto-lys er spærret. Slippes af
              **Styrbar børn OP** eller kl. **10:00**. Børnevækningen kører
              stadig.
            visibility:
              - condition: state
                entity: input_boolean.boernevaerelse_gaest_sover
                state: "on"

      # =====================================================================
      # BADEVÆRELSE
      # =====================================================================
      # De 5 spots sidder i ÉT loft og tændes altid sammen → kun gruppen her;
      # hver spot på /lys-dash/paerer (spot 1-3 er Thread-routere).
      - type: grid
        cards:
          - type: heading
            heading: Badeværelse
            heading_style: title
            icon: mdi:shower
            badges:
              - type: button
                icon: mdi:lightbulb-outline
                text: Enkelte spots
                tap_action:
                  action: navigate
                  navigation_path: /lys-dash/paerer
            visibility:
              - condition: state
                entity: light.badevaerelse_all
                state_not: unavailable
          - type: tile
            entity: light.badevaerelse_all
            name: Spots
            icon: mdi:lightbulb-multiple
            visibility:
              - condition: state
                entity: light.badevaerelse_all
                state_not: unavailable

      # =====================================================================
      # ENTRÉ
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Entré
            heading_style: title
            icon: mdi:door
            visibility:
              - condition: state
                entity: light.entre_all
                state_not: unavailable
          # Gruppen har præcis ét medlem (light.entre_loft).
          - type: tile
            entity: light.entre_all
            name: Loft
            icon: mdi:ceiling-light
            visibility:
              - condition: state
                entity: light.entre_all
                state_not: unavailable

      # =====================================================================
      # TERRASSE
      # =====================================================================
      # Altid synlig: pluggen er udeområdets eneste strøm og altid available
      # (pærelyskæden bliver unavailable når pluggen er off). Regn-badgen vises
      # kun når regnen holder pluggen slukket.
      - type: grid
        cards:
          - type: heading
            heading: Terrasse
            heading_style: title
            icon: mdi:flower
            badges:
              - type: entity
                entity: binary_sensor.terrasse_regn_aktiv
                icon: mdi:weather-pouring
                state_content: name
                name: Regn — holdt slukket
                visibility:
                  - condition: state
                    entity: binary_sensor.terrasse_regn_aktiv
                    state: "on"
          - type: tile
            entity: switch.terrasse_plug
            name: Strøm
            icon: mdi:power-socket-de
          - type: tile
            entity: light.terrasse_paerelyskaede
            name: Pærelyskæde
            visibility:
              - condition: state
                entity: light.terrasse_paerelyskaede
                state_not: unavailable

      # =====================================================================
      # DEPOT
      # =====================================================================
      # Loftet er 3 pærer (IKEA WS-globe + 2× Hue White) = light.depot_loft;
      # enkeltvis på /lys-dash/paerer.
      - type: grid
        cards:
          - type: heading
            heading: Depot
            heading_style: title
            icon: mdi:archive
            badges:
              - type: button
                icon: mdi:lightbulb-outline
                text: Enkelte pærer
                tap_action:
                  action: navigate
                  navigation_path: /lys-dash/paerer
            visibility:
              - condition: state
                entity: light.depot_all
                state_not: unavailable
          - type: tile
            entity: light.depot_all
            name: Alt i depot
            icon: mdi:lightbulb-multiple
            visibility:
              - condition: state
                entity: light.depot_all
                state_not: unavailable
          - type: tile
            entity: light.depot_loft
            name: Loft
            icon: mdi:ceiling-light-multiple
            visibility:
              - condition: state
                entity: light.depot_loft
                state_not: unavailable
          - type: tile
            entity: light.depot_strip
            name: Strip
            visibility:
              - condition: state
                entity: light.depot_strip
                state_not: unavailable

      # =====================================================================
      # FESTLYS — fuld kontrol på /festlys-dash (2026-07-26)
      # =====================================================================
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Festlys
            heading_style: title
            icon: mdi:party-popper
            badges:
              - type: button
                icon: mdi:tune-variant
                text: Festlys-siden
                tap_action:
                  action: navigate
                  navigation_path: /festlys-dash/festlys
          # Tap = auto-shuffle.
          - type: tile
            entity: light.festlys
            name: Festlys
            icon: mdi:party-popper

  # ===========================================================================
  # MUSIKFARVER (subview) — hvad Spotify-stemningen giver af farve på stue-spots
  # ===========================================================================
  # User 17/10: "en side hvor jeg kan se hvad de forskellige typer musik svarer
  # til i farver". Farvetonerne er midten af hver stemning i
  # sensor.stue_spotify_stemning (packages/stue_spots_spotify.yaml, listerne
  # a/h) — ret BEGGE steder (#2). Spot 1/2 = tone ∓ spredning/2 som
  # binary_sensor.stue_spots_spotify_aktiv. Genre-eksemplerne er typiske
  # (ReccoBeats valence × energy pr. sang), ikke en genre-regel.
  # <font color> er tilladt af markdown-kortets sanitizer (js-xss default).
  - title: Musikfarver
    path: musikfarver
    icon: mdi:palette
    subview: true
    back_path: /lys-dash/lys
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Spiller nu
            heading_style: title
            icon: mdi:spotify
          - type: markdown
            content: |
              {%- macro hex(h, s=100) -%}
              {%- set h = h | float(0) % 360 -%}{%- set c = s | float(100) / 100 -%}
              {%- set x = c * (1 - ((h / 60) % 2 - 1) | abs) -%}{%- set m = 1 - c -%}
              {%- set rgb = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][(h // 60) | int] -%}
              #{% for v in rgb %}{{ '%02X' | format(((v + m) * 255) | round(0) | int) }}{% endfor %}
              {%- endmacro -%}
              {% set a = 'binary_sensor.stue_spots_spotify_aktiv' %}
              {% set st = 'sensor.stue_spotify_stemning' %}
              {% if is_state(a, 'on') %}
              ## <font color="{{ hex(state_attr(a, 'hs_1')[0], state_attr(a, 'hs_1')[1]) }}">⬤</font><font color="{{ hex(state_attr(a, 'hs_2')[0], state_attr(a, 'hs_2')[1]) }}">⬤</font> {{ state_attr(st, 'stemning') | capitalize }}

              {{ state_attr(st, 'sang') }}

              Glæde {{ (state_attr(st, 'valence') | float(0) * 100) | round(0) | int }} % ·
              energi {{ (state_attr(st, 'energy') | float(0) * 100) | round(0) | int }} %
              {% elif states(st) == 'ukendt' and is_state('sensor.spotify_bro', 'playing') %}
              Sangen er ukendt — spotsene beholder forrige farve i 2 min, så ild.
              {% else %}
              Ingen Spotify-sang lige nu.
              {% endif %}
          - type: heading
            heading: Glæde × energi
            heading_style: title
            icon: mdi:emoticon-outline
          - type: markdown
            content: |
              {%- macro hex(h, s=100) -%}
              {%- set h = h | float(0) % 360 -%}{%- set c = s | float(100) / 100 -%}
              {%- set x = c * (1 - ((h / 60) % 2 - 1) | abs) -%}{%- set m = 1 - c -%}
              {%- set rgb = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][(h // 60) | int] -%}
              #{% for v in rgb %}{{ '%02X' | format(((v + m) * 255) | round(0) | int) }}{% endfor %}
              {%- endmacro -%}
              {% set c = {'anspaendt': 335, 'energisk': 5, 'glad_energisk': 30,
                          'trist': 290, 'glad': 45,
                          'melankolsk': 270, 'rolig': 225, 'afslappet': 160} %}
              {% macro f(k, navn) %}<font size="6" color="{{ hex(c[k]) }}">⬤</font><br>{{ navn }}{% endmacro %}

              | | 😢 Trist | | 😊 Glad |
              |:-:|:-:|:-:|:-:|
              | ⚡ **Energisk** | {{ f('anspaendt', 'Anspændt') }} | {{ f('energisk', 'Energisk') }} | {{ f('glad_energisk', 'Glad og energisk') }} |
              | | {{ f('trist', 'Trist') }} | <font size="6" color="#C8C8C8">⬤</font><br>Blandet = bleg | {{ f('glad', 'Glad') }} |
              | 😌 **Rolig** | {{ f('melankolsk', 'Melankolsk') }} | {{ f('rolig', 'Rolig') }} | {{ f('afslappet', 'Afslappet') }} |

              Jo tydeligere stemning, jo mere mættet farve.
      - type: grid
        cards:
          - type: heading
            heading: Typisk musik
            heading_style: title
            icon: mdi:music-box-multiple
          - type: markdown
            content: |
              {%- macro hex(h, s=100) -%}
              {%- set h = h | float(0) % 360 -%}{%- set c = s | float(100) / 100 -%}
              {%- set x = c * (1 - ((h / 60) % 2 - 1) | abs) -%}{%- set m = 1 - c -%}
              {%- set rgb = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][(h // 60) | int] -%}
              #{% for v in rgb %}{{ '%02X' | format(((v + m) * 255) | round(0) | int) }}{% endfor %}
              {%- endmacro -%}
              {% set d = states('input_number.stue_spots_spotify_spredning') | float(24) / 2 %}
              {% set l = [
                ['Glad', 'guld', 45, 'pop, soul, Motown, glad indie'],
                ['Glad og energisk', 'orange', 30, 'disco, funk, dance-pop, latin'],
                ['Energisk', 'rød', 5, 'rock, EDM, hiphop med tryk'],
                ['Anspændt', 'magenta', 335, 'metal, punk, drum & bass, dramatisk filmmusik'],
                ['Trist', 'lilla', 290, 'sørgmodige ballader, blues, emo'],
                ['Melankolsk', 'violet', 270, 'stille folk, triste klaverstykker, Bon Iver'],
                ['Rolig', 'blå', 225, 'klassisk, ambient, lo-fi, jazzballader'],
                ['Afslappet', 'turkis', 160, 'bossa nova, reggae, chill, akustisk'],
              ] %}
              {% for n in l %}
              <font size="5" color="{{ hex(n[2] - d) }}">⬤</font><font size="5" color="{{ hex(n[2] + d) }}">⬤</font>
              **{{ n[0] }}** — {{ n[1] }}<br>{{ n[3] }}

              {% endfor %}
              Farven følger sangens stemning, ikke genren. Spot 1 og 2 i hver
              sin nuance. Kun Spotify via højttaleren.

  # ===========================================================================
  # ENKELTE PÆRER (subview) — én tile pr. FYSISK pære
  # ===========================================================================
  # BEVIDST INGEN unavailable-gates: siden findes for at se OM en pære er
  # faldet af radionettet — en pære der falder af MENS den lyser bliver
  # stående fysisk tændt (usynlig for hver sluk-vej). Grå her = offline.
  - title: Enkelte pærer
    path: paerer
    icon: mdi:lightbulb-outline
    subview: true
    back_path: /lys-dash/lys
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Badeværelse
            heading_style: title
            icon: mdi:shower
          # Spot 1-3 = IKEA KAJPLATS (Matter) = husets Thread-routere. Spot 4-5
          # er Innr (Zigbee).
          - type: markdown
            content: >-
              Spot 1-3 er husets Thread-routere — er de nede, falder halvdelen
              af Matter-nettet med.
          - type: tile
            entity: light.badevaerelse_spot_1
            name: Spot 1
          - type: tile
            entity: light.badevaerelse_spot_2
            name: Spot 2
          - type: tile
            entity: light.badevaerelse_spot_3
            name: Spot 3
          - type: tile
            entity: light.badevaerelse_spot_4
            name: Spot 4
          - type: tile
            entity: light.badevaerelse_spot_5
            name: Spot 5
      - type: grid
        cards:
          - type: heading
            heading: Depot-loftet
            heading_style: title
            icon: mdi:archive
          # IKEA-globen er husets eneste pære der lander på 2 % hvis ét kald
          # sætter brightness + farvetemperatur + transition samtidig. De to
          # Hue White er faste 2700 K.
          - type: tile
            entity: light.depot_loft_ikea
            name: IKEA
          - type: tile
            entity: light.depot_loft_hue_1
            name: Hue 1
          - type: tile
            entity: light.depot_loft_hue_2
            name: Hue 2
      - type: grid
        cards:
          - type: heading
            heading: Rum hvor kun gruppen vises
            heading_style: title
            icon: mdi:lightbulb-group-outline
          - type: tile
            entity: light.spisestue_pendel
            name: Soveværelse loft
          - type: tile
            entity: light.entre_loft
            name: Entré loft
      # Permanent offline (står i et skab), bevidst bevaret i grupperne (B132).
      - type: grid
        cards:
          - type: heading
            heading: Stue — pærer i skabet
            heading_style: title
            icon: mdi:sofa
          - type: tile
            entity: light.stue_sofa_lampe
            name: Sofa-lampe
          - type: tile
            entity: light.stue_sofa_lampe_2
            name: Sofa-lampe 2
          - type: tile
            entity: light.stue_hjoernelampe
            name: Hjørnelampe

  # ===========================================================================
  # GARDIN-KALIBRERING (subview) — sove-gardinets Tuya TS0601-motor
  # ===========================================================================
  # Motorens ende-grænser bor i dens EGEN NVRAM. Efter et fald/en re-montering
  # passer de ikke længere: motoren tror den står ved stop og ignorerer "op",
  # mens positionen rapporteres i spring (2026-08-24: 30 → 88 → 59 på 3 s).
  # Radioen var ikke problemet (LQI 232, RSSI −42). STOP skal sidde under
  # tommelfingeren: mellem trin 1 og 5 stopper motoren IKKE af sig selv.
  - title: Gardin-kalibrering
    path: gardin-kalibrering
    icon: mdi:tape-measure
    subview: true
    back_path: /lys-dash/lys
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              ## Sove-gardin — sæt "helt oppe" og "helt nede"

              1. **Slet alle grænser**
              2. Kør **OP** til gardinet er helt oppe → **STOP**
              3. **Sæt ØVERSTE grænse**
              4. Kør **NED** til det er helt nede → **STOP**
              5. **Sæt NEDERSTE grænse**
              6. Test: slideren på **100 %** (oppe) og **0 %** (nede).

              ⚠️ Mellem trin 1 og 5 stopper motoren ikke selv — bliv ved gardinet.

              **Rører den sig ikke?** Prøv **NED** før OP. Hjælper det ikke,
              så lad batteriet op en halv time og prøv igen.
          - type: tile
            entity: cover.gardin_sovevaerelse
            name: Kør og stop
            icon: mdi:window-shutter
            features:
              - type: cover-open-close
              - type: cover-position
            features_position: bottom
      - type: grid
        cards:
          - type: heading
            heading: Kalibrerings-knapper
            heading_style: title
            icon: mdi:tape-measure
          - type: button
            name: 1 · Slet alle grænser
            icon: mdi:delete-alert
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.gardin_sovevaerelse_delete_all_limits
              confirmation:
                text: >-
                  Sletter motorens ende-grænser. Den kører derefter FRIT uden
                  at stoppe selv — stå ved gardinet.
          - type: button
            name: 3 · Sæt ØVERSTE grænse
            icon: mdi:arrow-collapse-up
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.gardin_sovevaerelse_set_upper_limit
          - type: button
            name: 5 · Sæt NEDERSTE grænse
            icon: mdi:arrow-collapse-down
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.gardin_sovevaerelse_set_lower_limit
      # Vend retningen FØR grænserne sættes — ellers byttes oppe og nede om.
      - type: grid
        cards:
          - type: heading
            heading: Kører "op" nedad?
            heading_style: title
            icon: mdi:swap-vertical
          - type: markdown
            content: Vend retningen **før** du sætter grænserne.
          - type: tile
            entity: select.gardin_sovevaerelse_motor_direction
            name: Motor-retning
            icon: mdi:swap-vertical
            features:
              - type: select-options
            features_position: bottom
          - type: tile
            entity: sensor.gardin_sovevaerelse_battery
            name: Batteri
