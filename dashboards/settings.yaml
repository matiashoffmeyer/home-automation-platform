              columns: 12
          # B209: morgen-varslet (blink + oplæsning + regnsang) venter på at
          # begge voksne er oppe, højst så mange min efter første afgang fra
          # soveværelset — så fyrer det hele, også lyden.
          - type: tile
            entity: input_number.varsel_morgen_max_vent_minutter
            name: Morgen — vent på begge oppe, højst (0=vent ikke)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_datetime.varsel_morgen_push
            name: Morgen — push til Parent A
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.varsel_publikum_accum_minutter
            name: Publikum-krav før blink (0=blink straks)
            features:
