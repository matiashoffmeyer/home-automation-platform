  # ===========================================================================
  # 🥘 MAD — indstillinger for ret-spørgsmål, indkøbsliste og Nemlig
  # ===========================================================================
  # 2026-09-30 (user): kun INDSTILLINGERNE bor her. Kontrolpanelet (opskrifter,
  # stemmeknapper, indkøbslisten, Nemlig-knapperne, statistik) er igen sit eget
  # dashboard, dashboards/mad.yaml (mad-dash) — "indstillingerne skal være på
  # indstillinger siden men kontrolpanelet skal igen ha sin egen side".
  # Badget i første overskrift linker til kontrolpanelet, og mad-dash linker
  # tilbage hertil. Motoren: scripts/mad_planner.py + packages/mad_planlaegning.yaml.
  - title: 🥘 Mad
    path: mad
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: ❓ Daglige spørgsmål
            heading_style: title
            badges:
              - type: button
                text: Åbn Mad
                icon: mdi:arrow-right
                tap_action:
                  action: navigate
                  navigation_path: /mad-dash/opskrifter
          - type: tile
            entity: input_boolean.mad_spoergsmaal_enabled
            name: Daglige spørgsmål aktiv
          - type: tile
            entity: input_datetime.mad_spoergsmaal_tid
            name: Tidspunkt
          - type: tile
            entity: input_number.mad_spoergsmaal_antal
            name: Retter pr. dag
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.mad_genspoerg_dage
            name: Genspørg efter (dage)
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.mad_svar_timeout_dage
            name: Ubesvaret = Måske efter (dage)
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.mad_superja_dage
            name: SUPERJA hver (dage)
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.mad_boernevenlig_pct
            name: Andel børnevenlige
            features:
              - type: numeric-input
                style: slider
          - type: markdown
            content: |-
              **Genspørg efter** — ubesvarede retter spørges igen (0 = aldrig).
              **Ubesvaret = Måske** — manglende svar tæller som Måske efter så mange dage (0 = aldrig).
              **SUPERJA hver** — én garanteret plads pr. person pr. så mange dage (0 = ubegrænset).
              Modtagere vælges under Indstillinger → 🔔 Notifikationer.



      - type: grid
        cards:
          - type: heading
            heading: 🔁 Påmindelser om ubesvarede
            heading_style: title
          - type: tile
            entity: input_boolean.mad_paamind_enabled
            name: Påmind om ubesvarede
          - type: tile
            entity: input_number.mad_paamind_efter_timer
            name: Påmind tidligst efter (timer)
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.mad_paamind_maks
            name: Max påmindelser pr. ret
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.mad_paamind_ude_timer
            name: Påmind alligevel når man er ude efter (timer)
            features:
              - type: numeric-input
                style: buttons
          - type: markdown
            content: |-
              Sendes helst når telefonen kommer hjem — aldrig 22:00–07:30.
              Gælder ikke Parent B: hun får én samlet påmindelse om Mad-siden.
          # 2026-10-20: Parent B får ingen påmindelse pr. ret, men en samlet
          # "stem på Mad-siden" (side_paamind i scripts/mad_planner.py). Tiden
          # er målt på hendes stem-sessioner (oftest 17:41-21:10).
          - type: tile
            entity: input_datetime.mad_side_paamind_tid
            name: "Parent B: Mad-siden fra kl."
          - type: tile
            entity: input_number.mad_side_paamind_dage
            name: "Parent B: højst hver (dage)"
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.mad_side_paamind_min
            name: "Parent B: når mindst (retter) venter"
            features:
              - type: numeric-input
                style: buttons



      - type: grid
        cards:
          - type: heading
            heading: ⚙️ Indkøbslisten
            heading_style: title
          - type: tile
            entity: input_boolean.mad_indkoeb_enabled
            name: Indkøbsliste aktiv
          - type: tile
            entity: input_datetime.mad_indkoeb_tid
            name: Tidspunkt
          - type: tile
            entity: input_select.mad_indkoeb_ugedag
            name: Ugedag
          - type: tile
            entity: input_number.mad_indkoeb_interval_uger
            name: Hver N. uge
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_datetime.mad_indkoeb_anker
            name: Anker-dato
          - type: markdown
            content: |-
              **Anker-dato** bestemmer hvilke uger der handles — flyt den én uge for at skifte uge.
          - type: tile
            entity: input_datetime.mad_indkoeb_morgen_tid
            name: Morgenspørgsmål
          - type: tile
            entity: input_datetime.mad_indkoeb_sprunget_dato
            name: Sprunget over (dato)
          - type: markdown
            content: |-
              🧊 **Morgenspørgsmål** på indkøbsdage (kun Parent A): *Ja* = listen kommer kl. **{{ states('input_datetime.mad_indkoeb_tid')[:5] }}** · *Nej* = spring i dag over · *Udskyd* = hele rytmen en uge frem.
          - type: tile
            entity: input_number.mad_retter_min
            name: Min. retter
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.mad_retter_max
            name: Max. retter
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.mad_salat_hver
            name: Salat på hver N'te
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.mad_sundhed_maal
            name: Sundheds-mål
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_boolean.mad_basisvarer_filter_enabled
            name: Spring basisvarer over
          - type: markdown
            content: |-
              Antallet trækkes mellem min og max (tilbehør tæller ½). **Sundheds-mål** er listens gennemsnit (10 = meget sundt); sæson er en præference, ikke et filter.



      - type: grid
        cards:
          - type: heading
            heading: "⚙️ Nemlig: sådan vælges varerne"
          - type: entities
            entities:
              - entity: input_boolean.nemlig_auto_tilfoej_enabled
                name: Tilføj rigtigt (ikke kun tørkørsel)
              - entity: input_boolean.nemlig_foretraek_oeko
                name: Foretræk økologisk
              - entity: input_number.nemlig_oeko_loft_pct
                name: Øko må koste op til (% mere)
              # 2026-10-01: favorit-loftet. Vin er undtaget i koden
              # (nemlig_api.FAVORIT_IKKE_I) — derfor scope-linjen nedenfor.
              - entity: input_number.nemlig_favorit_loft_pct
                name: Købt før må koste op til (% mere)
              - entity: input_boolean.nemlig_foretraek_tilbud
                name: Foretræk tilbud
              - entity: input_number.nemlig_match_min_score
                name: Min. match-score
          - type: markdown
            content: |-
              Varer vælges efter: dit eget svar → rigtig vare og form → købt før → mest almindelige variant → øko → tilbud. *Købt før* gælder ikke vin. *Tilføj rigtigt* fra = prøvekørsel uden at røre kurven.



      - type: grid
        cards:
          - type: heading
            heading: "❓ Nemlig: spørgsmål"
          - type: entities
            entities:
              - entity: input_number.nemlig_spoerg_max
                name: Max spørgsmål pr. kørsel
              - entity: input_boolean.notif_nemlig_enabled
                name: Send spørgsmål
              - entity: input_boolean.notif_nemlig_parent_a
                name: → Parent A's telefon
              - entity: input_boolean.notif_nemlig_hjemme
                name: Vent til jeg er hjemme
          - type: markdown
            content: |-
              Usikre eller udsolgte varer kommer som spørgsmål på telefonen. *Ingen af dem* holder varen ude i 30 dage.

