  # =============================================================================
  # AirBnB — Gæste-mode oversigt (KURATERET, hold opdateret)
  # =============================================================================
  # Beskriver adfærd, styrer intet. Denne fane er tiltænkt at flytte ind i
  # dashboards/settings.yaml (Indstillinger → 🏡 AirBnB) som ÉN fane, sammen med
  # nat-mode-/velkomst-/køkken-vække-sliderne der i dag bor der — indtil den
  # merge sker, er filen stadig sit eget selvstændige dashboard.
  #
  # VEDLIGEHOLD: opdatér denne side i SAMME commit som du ændrer AirBnB-logik
  # (automations/airbnb_mode.yaml, packages/airbnb_natmode.yaml, AirBnB-gates i
  # andre filer, power-recovery, par-koblinger, disable/enable-lister). Kilder:
  # automations/airbnb_mode.yaml (lockdown/resume), automations/
  # light_power_recovery.yaml (airbnb_power_recovery_all + mirrors), + gates
  # spredt i presence_*, entre_somrig, morning_curtains, summer/winter_defense,
  # wakeup_*. Grep "AirBnB" for at finde alle. Sidst gennemgået 2026-09-30.
  # =============================================================================
  - title: 🏡 AirBnB
    path: airbnb-tuning
    type: sections
    max_columns: 4
    sections:
      # Purge default OFF siden 2026-08-16 (kan testes uden datatab). Trusselsbillede
      # (F1, 2026-05-06): en gæst med dashboard-adgang kan læse familiens
      # bevægelses-mønster i HA's history. Slå purgen til hvis en gæst nogensinde
      # får adgang til dette dashboard.
      - type: grid
        cards:
          - type: heading
            heading: 🏠 Mode
            heading_style: title
          - type: markdown
            content: >
              {% if is_state('input_select.house_mode','AirBnB') %}
              🟢 AirBnB aktiv — huset er **{{ states('input_select.house_state') }}**.
              {% else %}
              ⚪ {{ states('input_select.house_mode') }}
              ({{ states('input_select.house_state') }}) — undtagelserne på
              denne fane er inaktive.
              {% endif %}
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: tile
                entity: input_select.house_mode
                name: House mode
                icon: mdi:home-account
              - type: tile
                entity: input_select.house_state
                name: House state
              - type: tile
                entity: binary_sensor.parasoll_terrassedoer
                name: Terrassedør
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.airbnb_privacy_purge_enabled
            name: Slet familie-historik ved entry
            icon: mdi:database-remove
            grid_options:
              columns: 12
          - type: markdown
            content: "⚠️ Sletter 14 dages presence-/person-historik permanent ved entry — kan ikke fortrydes."
            grid_options:
              columns: 12

      # Juridisk krav: intet indendørs kamera må være til stede (Airbnbs policy
      # rammer TILSTEDEVÆRELSE, ikke drift — et slukket kamera er stadig et
      # brud). Ingen sensor kan bevise "pakket væk" → kræver et bevidst
      # menneskeligt "ja" her. Kvitteringen nulstilles automatisk til "står
      # fremme" ved EXIT fra AirBnB (asymmetrisk med vilje: et lovkrav skal
      # fejle mod at varsle, ikke omvendt).
      # Kamera: Tapo i køkkenet (til gestus-timeren, siden 2026-09-14).
      # `./scripts/ha_health.sh kamera` tjekker 5 lag (kvittering, evt.
      # kamera-plug, frame-shim, gestus-add-on, camera.* + net-probe) — svarer
      # kameraet på nettet er det strømførende; tavshed beviser intet, proben
      # kan kun tilføje en fejl, aldrig frikende.
      - type: grid
        cards:
          - type: heading
            heading: 📷 Kameravagt
            heading_style: title
          - type: markdown
            content: >
              {% set s = states('input_text.kamera_airbnb_status') %}
              {% if s.startswith('pakket_vaek') %}
              {% set ts = (s.split(':') | last) | int(0) %}
              ✅ Kvitteret{{ (' ' ~ ts | timestamp_custom('%-d/%-m kl. %H:%M')) if ts > 0 else '' }} — vagten er tavs.
              {% else %}
              🚨 Ikke kvitteret. Telefonen varsler hvert 15. minut mens AirBnB er aktiv.
              {% endif %}
            grid_options:
              columns: 12
          - type: entities
            entities:
              - entity: input_text.kamera_airbnb_status
                name: 'Skriv "pakket_vaek" hvis pushen ikke kan nås'
            grid_options:
              columns: 12

      # Gæste-wifi (packages/gaeste_wifi.yaml, B267, 2026-10-26): routerens
      # gæste-SSID er kun tændt i AirBnB-mode eller under en test, og er
      # isoleret fra husets LAN ("kun internet"). Navn + kode står kun i
      # secrets.yaml (gaeste_wifi_ssid/_kode) — dashboardet ligger i git. Testen
      # slukker selv efter 1 time og ved HA-start; hvert skift giver hoved-
      # wifi'en et kort blip (Apollo < 1 s, højttaleren 5 s, målt 25/10).
      - type: grid
        cards:
          - type: heading
            heading: 📶 Gæste-wifi
            heading_style: title
          - type: markdown
            content: "Tændt i AirBnB-mode. Testen tænder det i 1 time."
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.gaeste_wifi_test
            name: Test gæste-wifi
            tap_action:
              action: toggle
            grid_options:
              columns: 12
          - type: tile
            entity: input_text.gaeste_wifi_status
            name: Status
            grid_options:
              columns: 12

      # En død kanal læses som "her er tomt" i presence-logikken — konfidensen
      # falder og huset kan erklære sig tomt med gæster i rummet. Sluk-sweep'en
      # (se "Vækning uden Thread") freder derfor kun DET blinde rum, og nye
      # features må ALDRIG gate husdækkende på konfidens — tvivl om ét rum ≠
      # tvivl om hele huset (fejlklasse #26, user-spec 2026-09-09d).
      - type: grid
        cards:
          - type: heading
            heading: 🕶️ Blinde kanaler
            heading_style: title
          - type: markdown
            content: |
              Gæst der slukker på væggen er normal brug — ingen alarm. Men
              rummet mister syn: en vægkontakt tager Apollo OG rummets pærer
              med sig.
            grid_options:
              columns: 12
          - type: markdown
            content: >
              {% set n = state_attr('binary_sensor.presence_kanaler_blinde','antal') | int(0) %}
              {% if n > 0 %}
              🕶️ {{ n }} kanal(er) døde: {{ state_attr('binary_sensor.presence_kanaler_blinde','blinde') }}


              Heraf forklaret af en slukket vægkontakt: {{ state_attr('binary_sensor.presence_kanaler_blinde','forklaret') }}
              {% else %}
              🕶️ Alle presence-kanaler er levende.
              {% endif %}
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: tile
                entity: binary_sensor.presence_kanaler_blinde
                name: Huset er blindt
              - type: tile
                entity: sensor.presence_signal_confidence
                name: Presence-konfidens
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: 🤖 AirBnB-automatikker
            heading_style: title
          - type: markdown
            content: "Grøn = aktiv. Er én fra eller mangler, er der et hul i gæsteoplevelsen."
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: tile
                entity: automation.airbnb_lockdown_ved_skift_til_airbnb_mode
                name: Lockdown ved entry
              - type: tile
                entity: automation.airbnb_genstart_familie_automations_ved_skift_fra_airbnb
                name: Resume ved exit
              - type: tile
                entity: automation.airbnb_bloker_depot_bornevaerelse_lys_slukkes_straks
                name: Bloker børneværelse-lys
              - type: tile
                entity: automation.airbnb_alle_lys_post_strom_lux_aware_bad_fuld
                name: Væg-strøm genopretter lys
              - type: tile
                entity: automation.airbnb_sofa_hyggelampe_plug_folger_sofa_laeselampe_on_off
                name: Sofa plug følger læselampe
              - type: tile
                entity: automation.airbnb_sluk_alt_dormant_efter_60_min_uden_presence
                name: Sluk alt + Dormant (60 min tomt)
              - type: tile
                entity: automation.airbnb_dormant_active_ved_entre_presence_comfort_welcome
                name: Dormant → velkomst-lys ved entré
              - type: tile
                entity: automation.airbnb_kokken_vedvarende_bevaegelse_active_thread_uafhaengig
                name: Dormant → Active ved køkken-bevægelse
              - type: tile
                entity: automation.airbnb_outdoor_zen_on_ved_morkt_udenfor
                name: Terrasse zen ON (mørkt)
              - type: tile
                entity: automation.airbnb_outdoor_zen_off_efter_2t_kun_bedroom_presence
                name: Terrasse zen OFF (2t sovero)
              - type: tile
                entity: automation.airbnb_bloker_automatisk_stovsuger_clean_kun_manuel_tilladt
                name: Bloker automatisk støvsugning
              - type: tile
                entity: automation.gaeste_wifi_kun_taendt_i_airbnb_eller_under_test
                name: Gæste-wifi følger AirBnB
              - type: tile
                entity: vacuum.s8_maxv_ultra
                name: Robot-status
            grid_options:
              columns: 12

      # Ved skift TIL AirBnB pushes et spørgsmål (1/2/3 gæster) — andre antal
      # rettes her. Grænse default 45 min akkum. i et rullende 3t-vindue,
      # cooldown 6t. Pusher OGSÅ i AirBnB (bevidst undtagelse fra
      # silent-reglen, user-bekræftet 2026-07-17) — nid airbnb_gaester.
      # Toggles/vindue: Indstillinger → 🔔.
      - type: grid
        cards:
          - type: heading
            heading: 👥 Gæsteantal
            heading_style: title
          - type: markdown
            content: |
              0 = ikke sat = vagten er slukket. Vagten pusher når huset har
              vist flere aktive zoner end booket, akkumuleret over grænsen.
              Gælder ikke: åben terrassedør tæller kun som zone hvis open-plan
              samtidig er tomt.
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: tile
                entity: input_number.airbnb_gaeste_antal
                name: Bookede gæster
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: binary_sensor.airbnb_over_belaegning_nu
                name: Flere zoner end booket nu
              - type: tile
                entity: sensor.airbnb_over_belaegning_3t
                name: Over-belægning akkum. (3t)
              - type: tile
                entity: sensor.people_zones_now
                name: Aktive zoner nu
              - type: tile
                entity: sensor.people_estimate
                name: Folke-estimat
              - type: tile
                entity: automation.airbnb_gaester_check_in_sporgsmal
                name: Check-in-spørgsmål
              - type: tile
                entity: automation.airbnb_gaester_over_belaegnings_vagt
                name: Over-belægnings-vagt
            grid_options:
              columns: 12

      # Rækkefølgen sug/mop er ikke valgfri: robotten har ÉN tilstand for
      # sug+mop, sugestyrken skrives sidst. Rengøring overlever mode-skiftet
      # (fix 2026-09-05: en kørsel blev klippet over efter 18,5 min). Fasen
      # står skrevet i en helper (overlever HA-restart), ikke i et ventende
      # script. Pushen sendes FØR mode-skiftet — bagefter er huset AirBnB og
      # alle notifikationer tavse.
      - type: grid
        cards:
          - type: heading
            heading: 🏡 Check-in
            heading_style: title
          - type: markdown
            content: |
              Ét tryk: starter grundig rengøring (deep mop + intense + max
              sug) og skifter huset til AirBnB med det samme. Nedtællingen
              til Dormant løber fra knaptrykket, ikke fra robottens
              færdig-melding.
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: button
                name: Aktivér AirBnB (rengør + gør klar)
                icon: mdi:home-import-outline
                show_state: false
                tap_action:
                  action: call-service
                  service: script.airbnb_checkin_prep
                  confirmation:
                    text: >-
                      Starter grundig rengøring (deep mop + intense + max
                      sug) og skifter huset til AirBnB NU. Fortsæt?
              - type: tile
                entity: input_text.airbnb_checkin_prep_fase
                name: Fase (tom = inaktiv)
              - type: tile
                entity: input_number.airbnb_checkin_dormant_min
                name: Minutter til Dormant
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: automation.airbnb_check_in_nedtaelling_udlobet_dormant_sluk
                name: Nedtælling udløbet → Dormant
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: 🧹 Check-ud
            heading_style: title
          - type: markdown
            content: |
              Starter grundig rengøring med forsigtig kollisions-undgåelse
              (robotten undviger ting gæsterne kan have glemt på gulvet) og
              skifter huset til Normal med det samme. Robot-indstillinger
              rulles automatisk tilbage til standard efter rengøringen.

              Tjek at dokken har rent vand før start.
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: button
                name: Check-ud — rengøring + Normal
                icon: mdi:exit-run
                tap_action:
                  action: call-service
                  service: script.airbnb_checkout
                  confirmation:
                    text: >-
                      Starter grundig rengøring (forsigtig kørsel) og
                      skifter huset til Normal. Er gæsterne checket ud?
              - type: tile
                entity: input_boolean.airbnb_checkout_clean_active
                name: Check-ud-rengøring i gang
              - type: tile
                entity: sensor.s8_maxv_ultra_dock_dock_error
                name: Dok-fejl
              - type: tile
                entity: automation.airbnb_check_ud_restore_robot_settings_efter_rengoring
                name: Restore robot-settings
            grid_options:
              columns: 12

      # Historik (fuld gennemgang: docs/sprint_log.md, grep "Thread-uafhængig"):
      # - 2026-09-02b: Active kom, men lyset udeblev — presence_light_*_on
      #   evaluerede house_state FØR skiftet landede, og occupancy blev
      #   stående 'on' uden ny flanke. Fix: house_airbnb_to_active re-armer de
      #   berørte presence-automations 2s efter Active (skip_condition:
      #   false); ingen lys-regel er kopieret ned i vækningen.
      # - Dormant kan ikke slukke et bad i brug: house_airbnb_to_dormant er
      #   husets eneste Dormant-vej og kalder light.turn_off på ALT — vetoet
      #   af badevaerelse_brusebad_hold + badevaerelse_afventer_klimabevis
      #   (badets PIR/dørsensor ser aldrig en person bag brusedør/lukket dør).
      # - 2026-09-03: depot + entré (husets to Apollo-løse rum) manglede i
      #   triggers/betingelse/vækning — samme fejl som køkkenet 07-15. Nu med
      #   i samme 8-sensor-roster som airbnb_auto_off_60min.
      # - 2026-09-07: varighedskravet stod kun i triggerens `for: 30 minutes`,
      #   ikke i betingelsen (spurgte kun "on lige nu?") — ét radar-udslag
      #   kunne nulstille resten. Målt: 25 Dormant-skift på 2,4 døgn, 6 om
      #   natten. Betingelsen måler nu selv 30 min pr. levende kanal, med
      #   time_pattern /10-backstop (restart-sikker). `unavailable` udelades
      #   (hverken bevis eller blokade) — kræver mindst 4 levende kanaler.
      # - 2026-09-08: 30 min var stadig for svagt (6 skift/10,6t). Et
      #   dør-luk-krav blev forkastet: en dørsensor melder passage, ikke
      #   retning (hjemkomst og afgang ser ens ud). Kun VARIGHED separerer —
      #   R=90 min fjerner præcis blippene og rammer de 10 ægte perioder.
      # - 2026-09-09: sweep'en fredede hele huset ved én blind kanal — forkert
      #   (19/31 blokeret, 7 med lys i rum der reelt var tomme). Nu pr. rum:
      #   kun det rum hvis EGEN kanal er blind fredes; et fredet rum
      #   sluk-tjekkes igen når kanalen kommer tilbage og selv melder tomt i
      #   2 min. light.spisestue_pendel er SOVEVÆRELSETS loft (alias fra
      #   2026-06-05) — netop den kanal der er blind oftest.
      # - 2026-09-11: 90 min var reelt UOPFYLDELIGT — stue-Apollo spøgelser
      #   hvert ~5. min (længste rolige hul 16,4 min), huset stod Active
      #   21,6t. Stilhed måles nu på et anker der kun flyttes af en HOLDENDE
      #   flanke (sensor.last_sustained_presence, 120s tier — målt: p90 95s
      #   tomt hus vs. 12 episoder >120s en beboet formiddag). Søster-
      #   automationen airbnb_no_presence_60min_off havde samme regel usikkert
      #   kopieret (intet bad-veto) — kalder nu samme delte sweep.
      - type: grid
        cards:
          - type: heading
            heading: 🛜 Vækning uden Thread
            heading_style: title
          - type: markdown
            content: |
              Huset kan vågne Dormant → Active tre veje — de to nederste er
              uafhængige af Thread (dørsensoren):
              - Hoveddør (primær vej)
              - Entré-PIR (Zigbee)
              - Køkken-Apollo bevægelse (WiFi, akkumuleret over slider)

              Robottens egen radar vækker ikke huset under manuel clean.
            grid_options:
              columns: 12
          - type: markdown
            content: |
              Ro-kravet er 90 minutters MÅLT stilhed pr. levende kanal — ikke
              bare "ingen sensor on lige nu". Sluk-sweep'en freder kun det
              rum hvis egen kanal er blind (ægte tvivl); alle andre rum
              slukkes normalt. Badet vetoes separat (brusebad/klima-bevis).
            grid_options:
              columns: 12
          - type: entities
            title: Dormant-vejene + sluk-sweep'en
            entities:
              - entity: automation.hus_airbnb_dormant_sensorer
                name: Dormant (90 min ro)
              - entity: automation.hus_airbnb_active_sensorer
                name: Vækning → Active
              - entity: automation.airbnb_dormant_blind_kanal_kom_tilbage_sluk_det_fredede_rum
                name: Udgang for et fredet rum
              - entity: script.airbnb_dormant_lys_sweep
                name: Sluk-sweep (delt, pr. rum)
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: 🍳 Køkkenet vækker huset
            heading_style: title
            badges:
              - type: entity
                entity: sensor.koekken_bevaegelse_5min_sekunder
                name: Bevægelse (5 min)
                state_content:
                  - name
                  - state
          - type: markdown
            content: Så længe skal der være bevægelse i køkkenet, før huset vågner. 0 = fra.
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.airbnb_koekken_wake_sustain_sekunder
            name: Bevægelse krævet
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: binary_sensor.koekken_apollo_radar_moving_target
            name: Køkken-Apollo bevægelse nu
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: ✅ Check-in-varsel
            heading_style: title
          - type: markdown
            content: |
              Push "Check-in succesfuld" ved første hoveddør-åbning efter et
              nyt ophold. Armeres 1 time efter AirBnB slås til. Re-arm
              kræver at Normal-mode har kørt ≥ 24 t forinden (et reelt nyt
              ophold).
            grid_options:
              columns: 12
          - type: tile
            entity: automation.airbnb_check_in_push_ved_hoveddor_abning
            name: Check-in-push
            grid_options:
              columns: 12
          - type: entities
            entities:
              - entity: input_boolean.airbnb_checkin_pending
                name: Check-in afventer nu
              - entity: input_datetime.airbnb_checkin_arm_at
                name: Armeres kl.
              - entity: input_datetime.airbnb_normal_since
                name: Normal-mode siden
              - entity: binary_sensor.parasoll_hoveddoer
                name: Hoveddør nu
            grid_options:
              columns: 12

      # Beviset (hvilke zoner så bevægelse) er LATCHET undervejs, ikke slået
      # op til sidst — et øjebliksopslag ville slukke på en gæst der pakker
      # ud (sove-Apolloen taber en stilliggende krop i 5-15 min). Badet er
      # desuden vetoet af sensor.badevaerelse_sluk_alt_undtagelse.
      # Slut-tidspunktet er et skrevet stempel (overlever HA-restart),
      # backstop rydder hvert minut.
      - type: grid
        cards:
          - type: heading
            heading: 👋 Velkomst
            heading_style: title
          - type: markdown
            content: Første gang gæsterne åbner hoveddøren, tændes varmt velkomstlys — én gang pr. ophold.
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.airbnb_velkomst_enabled
            name: Velkomst
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.airbnb_velkomst_brightness
            name: Lysstyrke
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.airbnb_velkomst_fade_sekunder
            name: Fade ind
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.airbnb_velkomst_minutter
            name: Varighed
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          - type: markdown
            content: |
              Tænder entré → open plan → bad → soveværelse forskudt (2 s) i
              2500 K. Rummene sættes i Manual imens og slippes til Auto
              efter ceremonien (zoner uden bevægelse slukkes).
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: tile
                entity: automation.airbnb_velkomst_ceremoni_ved_forste_hoveddor_abning
                name: Ceremoni ved hoveddør
              - type: tile
                entity: automation.airbnb_velkomst_slip_rum_til_auto_nar_ceremonien_er_udlobet
                name: Slip til Auto (backstop)
              - type: tile
                entity: automation.airbnb_velkomst_afbryd_ved_skift_vaek_fra_airbnb
                name: Afbryd ved mode-skift
            grid_options:
              columns: 12
          - type: entities
            entities:
              - entity: input_boolean.airbnb_velkomst_pending
                name: Velkomst afventer (dette ophold)
              - entity: input_boolean.airbnb_velkomst_active
                name: Ceremoni kører nu
              - entity: input_datetime.airbnb_velkomst_slut_at
                name: Ceremonien slutter kl.
              - entity: input_boolean.airbnb_velkomst_move_entre
                name: 'Bevægelse set: entré'
              - entity: input_boolean.airbnb_velkomst_move_openplan
                name: 'Bevægelse set: open plan'
              - entity: input_boolean.airbnb_velkomst_move_bad
                name: 'Bevægelse set: bad'
              - entity: input_boolean.airbnb_velkomst_move_sove
                name: 'Bevægelse set: soveværelse'
              - entity: script.airbnb_velkomst_ceremoni
                name: Kør ceremonien manuelt
              - entity: script.airbnb_velkomst_slip
                name: Slip rummene nu
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: 🧭 Filosofi
            heading_style: title
          - type: markdown
            content: |
              AirBnB er Normal + et lille sæt bevidste undtagelser — gæster
              får samme bevægelses- og dagslys-styrede lys som familien, bare
              uden familie-rutiner og med et par gæste-tilpasninger. Kører
              som normalt: presence-lys, lux-drivere, arrival-velkomst,
              entre-motion, room-mode, terrasse-komfort, House_state
              Active/Dormant, depot-lys, godnat/godmorgen via sove-knappen,
              backup, device-health, alle safety-alarmer.

              Undtagelserne herunder er det eneste der er anderledes.
            grid_options:
              columns: 12

      # Resume-flowet (exit) re-evaluerer live tracker + GPS-freshness i
      # stedet for at gense de disablede automations' gamle flag (fejlklasse
      # #15: en disabled automation modtager ingen triggers i vinduet).
      # "Barn sov her"-latchen ryddes 2026-09-28 — ellers ville familien arve
      # BØRN HJEMME efter exit uden at nogen spurgte.
      - type: grid
        cards:
          - type: heading
            heading: 🔐 Privatliv
            heading_style: title
          - type: markdown
            content: |
              - 14 dages historik (presence, radar, person, telefon, scener,
                terrasse, room-mode, styrbar) slettes ved entry.
              - Person-tracking fryses ved entry, genskabes live ved exit
                (kun hvis telefonen faktisk er hjemme).
              - Guest-mode/winddown-flags, festlys/cirkus og "barn sov her i
                nat"-latchen ryddes ved entry OG exit.
              - Dark Mode-fjernbetjeningens OP er spærret i AirBnB — NED
                virker altid.
            grid_options:
              columns: 12

      # 2026-09-02: forbuddet fik et CAUSE-AGNOSTISK net (den gamle
      # kant-drevne suppressor havde 3 tavse huller — boot-flanke uden
      # settle-delay, en pære der er unavailable præcis ved kanten, ingen
      # backstop). Nu 30s settle + en time_pattern /5-backstop der MÅLER
      # tilstanden (no-op når alt er slukket). Voksen-vækningen i
      # børneværelset er lukket ude (se "Deaktiverede rutiner").
      - type: grid
        cards:
          - type: heading
            heading: 🧸 Børneværelse
            heading_style: title
          - type: markdown
            content: |
              Børneværelse-lys må ALDRIG tænde — heller ikke via app. Rummet
              er aflåst hele opholdet; en suppressor slukker straks loft +
              strip + hyggelys + lampe hvis noget tænder dem. Depot
              fungerer som normalt (presence tænder lyset for gæster) — kun
              børneværelset holdes mørkt.
            grid_options:
              columns: 12

      # Entré-loftet (TRADFRI) kan spøgelses-tænde uden strøm-cyklus — den
      # form tæller kun som wake hvis valhorn ser nogen i entréen
      # (2026-07-12).
      # ⚠️ Soveværelset var undtaget UDEN at nogen vidste det (rettet
      # 2026-08-16): sove-loftets pære (light.spisestue_pendel) havde
      # power_on_behavior=Off (14 dage: 62 off→on, 0 unavailable→on) —
      # vægkontakten var altså død. Nu sat til On (level 255). Bor i pærens
      # NVRAM, ikke i git → skal sættes igen ved re-pair/factory-reset.
      # Sove-recovery kræver house_state=Active, så en nat-genstart giver
      # sidste niveau, ikke et 90%-slam kl. 03.
      - type: grid
        cards:
          - type: heading
            heading: 🔌 Strøm-genstart
            heading_style: title
          - type: markdown
            content: |
              Slår en gæst en vægkontakt fra→til tænder lyset på 90 % varm
              hvid (2700 K) — bad hopper til 100 % (natlys-niveau under
              godnat/natmode). Gælder open-plan + entré + bad. Rammer kun
              ægte strøm-wake (tom Zigbee/Matter-context), ikke
              app/Styrbar/presence.
              Gælder ikke: depot (tændes af presence) og børneværelse (må
              ikke lyse).
            grid_options:
              columns: 12

      # Auto-OP-forbuddet sidder i sensor.gardiner_manual_hold's
      # `held`-liste (alle fire gardiner permanent i AirBnB) — hver
      # auto-åbner subtraherer held, så en NY auto-åbner arver forbuddet
      # gratis (2026-09-02b, fejlklasse #2/#21). Manuelle tryk læser IKKE
      # held. Sove-gardinets tragt (script.sove_gardin_op) afviser AirBnB
      # som første betingelse (2026-08-16) — dækker også en 7. fremtidig
      # kalder.
      # Mosbillede (2026-09-23, user-spec): gæsten hører aldrig motoren mens
      # han er hjemme. mosbillede_manuel_op_hold slippes kun ved næste
      # Dormant eller manuel luk. Luk-vejen læser bevidst IKKE held (ellers
      # kunne den aldrig lukke i AirBnB).
      # Solo hurtig-sluk er FRA i AirBnB (kræver Normal/Home Vacation) —
      # people_estimate kender ikke gæsteantal. Pre-dark rører ikke
      # gardiner i AirBnB (begge veje eller ingen — ellers sad gæsten med
      # permanent lukkede gardiner uden kendt escape-vej).
      # Sove-presence er begrænset til 12–22 i AirBnB — husets ENESTE
      # beskyttelse af gæstens nattesøvn i soveværelset. Nat-lås-vagten
      # (bedroom_night_no_auto_bright_guard) er undtaget 2026-08-16:
      # gæstens vægkontakt tænder uden user_id/zha_event, så vagtens
      # manuel-undtagelser misser den — uden gaten fik gæsten 0,5s lys og
      # så mørke.
      # Morgen-sanity-slukningerne (05-12, sove+børn) ryddede rester fra
      # husets EGEN vækkekæde — men den kæde er lockdown-disabled i AirBnB,
      # så der intet at rydde op efter; en gæst mistede lys uden forklaring
      # (2026-09-02).
      # Sleep Over armerer sig selv (2026-09-04, user-spec: "gælder både i
      # Airbnb og normal mode") — ingen house_mode-condition nogen steder.
      - type: grid
        cards:
          - type: heading
            heading: 🌅 Morgen og gardiner
            heading_style: title
          - type: markdown
            content: |
              - Ingen auto-lys om morgenen for gæster.
              - Gardiner åbner aldrig af sig selv. Sove-gardinet lukker selv
                efter solnedgang; de andre lukker kun når gæsten trykker.
                Manuelle tryk (Somrig/Styrbar/RODRET) virker uændret.
              - Mosbillede-solbeskyttelsen kører kun ned i Dormant —
                trækker gæsten den op manuelt, bliver den oppe til næste
                Dormant.
              - Sleep Over (sofa efter midnat) er mode-agnostisk — gælder
                også Normal. Escape: ægte gang i køkken/spisestue efter
                kl. 06.
              - Bad slukker mere tilbageholdende for gæster (slider under
                🚿 Bad).
              - Morgen-sanity-slukningerne, nat-lås-vagten og
                nat-toilet-hurtig-sluk er alle AirBnB-gatede, så en gæst
                ikke mister lys uden forklaring.
            grid_options:
              columns: 12

      # 2026-09-02c: AirBnB-grenen slukkede light.alle_lys råt (inkl. alle
      # fem bad-spots) — gæst nr. 2's godnat-tryk slukkede gæst nr. 1 i
      # bruseren. Begge NED-veje subtraherer nu
      # sensor.badevaerelse_sluk_alt_undtagelse (wasp ∪
      # badevaerelse_brusebad_hold). Sengetælleren frigiver ALDRIG badet for
      # en gæst (kun familie-modes, 2026-09-23). Alle tre NED-/godnat-veje
      # kvitterer via script.badevaerelse_sluk_alt_udskyd, som færdiggør et
      # udskudt sluk-alt når badet har været tomt i 60s (2026-09-02d,
      # fejlklasse #4/#19).
      - type: grid
        cards:
          - type: heading
            heading: 🎛️ Entré-Styrbar
            heading_style: title
          - type: markdown
            content: |
              Forenklet for gæster: kort OP = tænd open-plan, kort NED =
              sluk alt lys + nedluknings-grace. Langt OP eller 3 hurtige
              OP/pile = nødlys (også for gæster). Langt NED og pilene er
              ellers deaktiveret. Kort NED mørklægger IKKE et optaget bad.
            grid_options:
              columns: 12
          # 2026-10-17: stue-Styrbar langt NED 20-06 = gæsteknap O (Sleep Over)
          # kun i Normal/Home Vacation — styrbar_rooms.yaml, NED hold-grenen.
          - type: markdown
            content: 'Stue-Styrbar: langt NED slukker blot — slår ikke "gæst sover i open plan" til.'
            grid_options:
              columns: 12

      # 2026-09-03, user-spec: "core features som openplan lys skal være de
      # samme i airbnb mode og normal mode." Nedlagt: spejlet spots↔lyskæde,
      # den varme 2700K presence-tænd, AirBnB-gaten på farve-enforceren.
      - type: grid
        cards:
          - type: heading
            heading: 🔗 Par-koblinger
            heading_style: title
          - type: markdown
            content: |
              Sofa-hyggelampe (plug) følger sofa-læselampen on/off — inkl.
              gæstens adgang til luksus-blokken (høj el-pris springes
              normalt over for familien, men ikke for gæster). Køkkenet er
              ikke længere anderledes — presence og madlavnings-session
              opfører sig som i Normal. Sofa-spots: ingen ild for gæster.
            grid_options:
              columns: 12

      # Børneværelsets voksen-vækning (2026-09-02, fejlklasse #16): en
      # femte gren (presence_light_boernevaerelse_adult_wakeup) blev
      # tilføjet EFTER lockdown-listen var skrevet og kom aldrig med —
      # tændte loftet 60%/2700K på moving_target 06-11 fordi
      # AirBnB-natmoden selv sætter godnat_any_active. Nu gatet direkte i
      # automationen. Apollo-kalibrering: sensor.apollo_kalib_rum returnerer
      # tom liste i AirBnB (gælder også nat-vinduet i de tre dagrum).
      - type: grid
        cards:
          - type: heading
            heading: 🚫 Deaktiverede rutiner
            heading_style: title
          - type: markdown
            content: |
              Irrelevante for gæster: vækninger, familie-godnat-clears
              (knapper + nattur-dim virker stadig), børne-putning/
              kids-home, guest-mode, bedroom/terrasse-winddown,
              børneværelsets voksen-vækning, person arrive/leave,
              klima-børn-notifikation, hoveddør-alarm-spam,
              styrbar-batteri-notifikationer, Apollo-kalibrering (begge
              veje).
            grid_options:
              columns: 12

      # Køkken-Apollo tæller med i Dormant siden 2026-07-15 (huset gik
      # ellers Dormant og slukkede alt mens gæsten stod i køkkenet).
      # Terrasse nat-auto-sluk kræver kun ro (også med åben dør,
      # sommernat) — fikser nat-burn til 03:30 hvis sove-Apolloen er
      # strømløs (zen-off dør så aldrig). Manuel nat-tænd (Styrbar/app)
      # vinder resten af natten.
      - type: grid
        cards:
          - type: heading
            heading: 🌿 Terrasse og dvale
            heading_style: title
          - type: markdown
            content: |
              30 min uden presence nogen steder (+ terrassedør lukket) →
              sluk alt + Dormant. Entré-presence fra Dormant →
              comfort-velkomst (dæmpet under natmode) + Active. Terrasse
              zen tænder svagt når mørkt ude, slukker efter 2t kun-sovero,
              og har et mode-agnostisk nat-auto-sluk (default 23:30) som
              backstop.
            grid_options:
              columns: 12

      # Anomali-vagten (mørke-detektor) skipper børneværelset (bevidst
      # mørke) og soveværelset uden for 12-22 i AirBnB. Dør-sikkerhedspush
      # "åbnet i tomt hus (Dormant)" sendes IKKE i AirBnB (gæster ankommer
      # til et Dormant hus konstant); "glemt åben/kulde/regn" pushes
      # uændret. Hjemkomst-køen holdes under AirBnB og leveres først ved
      # exit/hjemkomst (intet droppes). Omlagt 2026-08-16, user-spec "ingen
      # varsler af nogen art" — var før ON for 21 af 32 typer.
      - type: grid
        cards:
          - type: heading
            heading: 🔔 Varsler i AirBnB
            heading_style: title
          - type: markdown
            content: |
              Kun 7 push-typer er ON i AirBnB som default: livsfare
              (vandlæk, vandventil), check-in (airbnb, airbnb_gæster) og
              hus-nedbrud (thread, remote_offline, batteri). Alt andet er
              OFF. Toggles pr. type: Indstillinger → 🔔.
              Gælder ikke: røgalarm + nødbelysning kan ikke slås fra
              (livsfare har ingen opt-out) — nødbelysningen kan kun
              stoppes af et vilkårligt tryk på entré-Styrbaren eller
              minut-grænsen.
            grid_options:
              columns: 12

      # En bælte+seler-guard (airbnb_block_auto_clean) stopper + docker en
      # clean der alligevel starter fra en automation. Off-peak opladning
      # er urørt. Armeret måltids-støvsugning + morgen-udskydelsen
      # ryddes/gates ved entry (2026-08-05/06) — ellers kunne robotten
      # starte i gæstens stue fra en armering sat minutter før entry, eller
      # pause uforklaret midt i en gæsts manuelle kørsel.
      - type: grid
        cards:
          - type: heading
            heading: 🤖 Ingen auto-støvsugning
            heading_style: title
          - type: markdown
            content: |
              Måltids-støvsugning, daglig Dormant-rengøring og
              entré-full-clean er deaktiveret for gæster. Manuel virker
              uændret — Styrbar (OP = quick/full, NED = stop+dock) og
              app/dashboard-start.
            grid_options:
              columns: 12

      # Blokeres af terrasse-presence, spillende Chromecast, og åben
      # terrassedør indtil kl. 01 (efter 01 antages nat-køling, ikke
      # ophold — ellers fyrede natmode aldrig med altandøren åben).
      # ⚠️ Exit-symmetri (fixet 2026-09-02): natmoden tænder selv
      # godnat_active m.fl., men de blev kun ryddet ved entry. Exit rydder
      # nu alle syv flag (godnat_active, -voksne, -boern, -pending,
      # guest_mode, kalde_active, bedroom_only_winddown) OG
      # input_select.active_scene (ellers arvede familien en kørende
      # fødselsdags-/dansescene ved mode-skift).
      - type: grid
        cards:
          - type: heading
            heading: 🌙 Nat-mode
            heading_style: title
            badges:
              - type: entity
                entity: sensor.sove_presence_60min
                name: Sove-presence (60 min)
                state_content:
                  - name
                  - state
          - type: markdown
            content: Når gæsterne er faldet til ro, siger huset selv godnat — natlys i bad og entré, glemte lys slukkes.
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.airbnb_natmode_start_hour
            name: Nat-mode tidligst kl.
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.airbnb_natmode_sove_accum_min
            name: Ophold i soveværelset (min pr. time)
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.airbnb_natmode_quiet_min
            name: Fællesrum stille i
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.airbnb_natmode_quiet_alene_min
            name: Hele huset stille i (0 = fra)
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.airbnb_natmode_welcome_pct
            name: Velkomst-lys under nat-mode
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          - type: markdown
            content: |
              Knapperne virker: sove-Somrig OP/NED (godnat/godmorgen) +
              nattur-dim. Bruger gæsten dem ikke, sætter huset selv
              natmode ved ro i huset — se sliderne ovenfor. Rører aldrig
              sove-loftet eller bad-spots.
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: tile
                entity: binary_sensor.godnat_any_active
                name: Godnat aktiv lige nu
              - type: tile
                entity: automation.airbnb_nat_mode_auto_godnat_ved_ro_i_huset
                name: Auto-natmode
            grid_options:
              columns: 12
          # packages/hoejttaler.yaml: godnat-stoppet er familie-only, fordi
          # nat-regimet sætter godnat-flagene direkte (2026-10-05).
          - type: markdown
            content: Højttaleren — nat-mode stopper ikke gæsternes musik, kun et tomt hus gør.
            grid_options:
              columns: 12

      # Rum-scope (2026-08-02/08-12): rammer kun ét af de tre rum ad gangen
      # via prioritets-stige (sove hvis aktivitet <90s, ellers børn, ellers
      # sofa). To op-tryk inden for 120s tager alle tre. Gæsten har tre
      # udveje uden at kende systemet: op-tryk i rummet, ned-tryk (alle rum
      # → Auto), eller nat-cutoveren. media_player.projector er kun et
      # SUPPLEMENT (Cast-mDNS er skrøbeligt) — ro-detektionen i
      # fælles-arealet er det reelle værn.
      # Tv-lås i børneværelset og børnestrippens aften-niveau-hold armeres
      # IKKE i AirBnB (ingen kendt udgang for en gæst). Pre-Dark Mode kører
      # også for gæster — blid og selv-reverserende.
      # Privacy: dark_mode/predark_active/dark_mode_* rum-tekster purges
      # ved entry sammen med øvrige mood-flag.
      - type: grid
        cards:
          - type: heading
            heading: 🎬 Dark Mode
            heading_style: title
          - type: markdown
            content: |
              Film-blackout (børn + sove + sofastue) holdes af en enforcer
              der IKKE er mode-gatet — kører altså også i AirBnB. Ryddes
              derfor ved mode-skift begge veje. Nat-cutover slipper kun
              mørklægningen for gæster (tvinger aldrig godnat på dem) —
              med mindre gæsten er oppe.
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: tile
                entity: input_boolean.dark_mode
                name: Dark Mode lige nu
              - type: tile
                entity: input_datetime.dark_mode_godnat_cutover
                name: Nat-cutover kl.
              - type: tile
                entity: automation.dark_mode_nat_cutover_til_godnat_glemt_taendt
                name: Nat-cutover
            grid_options:
              columns: 12

      # Ryddes ved BÅDE entry og exit: cykel_lader_faerdig, -probe_aktiv,
      # -probe_stop, energi_cursor_probe — ellers spærrer/udskyder et arvet
      # flag familiens ladning, eller bogfører hele opholdets forbrug som
      # "slid". cykel_lader_alarm_lock ryddes BEVIDST IKKE (hård
      # sikkerhedsspærring efter røgalarm — et mode-skift må aldrig
      # genoptage ladning af et litium-batteri). Privacy-purge ved entry:
      # on/off-historik + effekt + probe-fund (afslører hjemkomst-
      # tidspunkt); de aggregerede kWh-/slid-totaler beholdes.
      - type: grid
        cards:
          - type: heading
            heading: 🔋 Cykel-lader
            heading_style: title
          - type: markdown
            content: |
              Al automatisk ladning er gatet til Normal/Home Vacation.
              Gæsten kan stadig tænde pluggen manuelt.
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: tile
                entity: switch.entre_cykel_lader_plug
                name: Lader-plug
              - type: tile
                entity: input_boolean.cykel_lader_alarm_lock
                name: Røgalarm-lås (overlever mode-skift)
              - type: tile
                entity: input_boolean.notif_cykel_lader_airbnb
                name: Lader-pushes i AirBnB
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: 🔎 Live-tjek
            heading_style: title
          - type: markdown
            content: |
              Når AirBnB er aktiv skal disse holde. Børneværelse-lys = OFF
              altid. Depot må gerne lyse (normal adfærd). Sofa plug ↔
              læselampe = samme state. Køkken-parret er nedlagt — spots må
              gerne være off mens lyskæden lyser.
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: tile
                entity: light.boernevaerelse_all
                name: Børneværelse
              - type: tile
                entity: light.boernevaerelse_hyggelys
                name: Børne-hyggelys
              - type: tile
                entity: light.depot_all
                name: Depot
            grid_options:
              columns: 12
          - type: vertical-stack
            cards:
              - type: tile
                entity: light.stue_laesehygge
                name: Sofa læselampe
              - type: tile
                entity: light.stue_plug
                name: Sofa hyggelampe (plug)
              - type: tile
                entity: light.koekken_lyskaede
                name: Køkken-lyskæde
              - type: tile
                entity: switch.koekken_spots
                name: Køkken-spots
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: 🧳 Gæsteoplevelse
            heading_style: title
          - type: markdown
            content: |
              Ankomst: entré → velkomst-lys tænder, huset går Active.
              Ophold: lys følger bevægelse/dagslys normalt (undtagen
              børneværelset). Vægkontakt: lys tilbage på 90 % varm hvid
              (bad 100 %, natlys 8 % under godnat). Aften: terrasse-zen
              tænder svagt når mørkt. Nat: sove-lys virker (12–22),
              terrasse slukker efter 2t ro. Godnat sættes selv ved ro hvis
              gæsten ikke selv trykker knappen. Gardiner ruller ALDRIG op
              automatisk. Væk hele dagen: 30 min tomt → alt slukker +
              Dormant.
            grid_options:
              columns: 12
