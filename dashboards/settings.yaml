            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.mosbillede_tvivl_elev_maks
            name: Spørg kun under solhøjde
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.mosbillede_spoerg_minutter
            name: Spørg højst hvert / svar gælder (min)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Geometri fra user 26/9: vinduet i vestvæggen (270°), to parallelle N-S-vægge
          # ~250 cm fra hinanden, billedets sydkant flugter med vinduets nordkant.
          # Strejflys tæller ikke (cos(indfald) ≥ 0,25, attributten indfald_faktor). Gæt
          # aldrig et mål — spørg.
          - type: markdown
            content: Rører du selv gardinet, holder beskyttelsen sig væk til huset går i dvale.
