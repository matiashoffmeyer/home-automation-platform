            name: Aften — kun push
            grid_options:
              columns: 12
          - type: tile
            entity: input_datetime.varsel_aften_3
            name: Aften — vindue slutter
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: 💧 Dug
            heading_style: title
            badges:
              - type: entity
                entity: sensor.dug_varsel_i_nat
                name: Dug i nat
                state_content:
                  - name
                  - state
          - type: markdown
            content: Blinker kun når nogen er i open plan; beskeden kommer uanset.
          - type: tile
            entity: input_number.dug_varsel_sensitivitet
            name: Følsomhed (0=fra)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.dug_overflade_ekstra_afkoeling
            name: Hynde-afkøling vs. græs (0=som græs)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.dug_metno_fugt_bias_pct
            name: met.no fugt-korrektion (+point, 0=ingen)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.dug_metno_sky_bias_pct
            name: met.no sky-korrektion (−point, 0=ingen)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.dug_afkoeling_faldvaegt_pct
            name: Vægt på nattens temperaturfald (0=gammel model)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 45 % kalibreret på 19 nætters facit (18/19 rigtige mod 15/19 ved 0 %) —
          # fanger advektion (fugtig luft der blæser ind), som det gamle skydække-only
          # estimat er blindt for.
          # met.no melder natteluften ca. 6 RH-point for tør og skydækket om natten +25
          # point for højt (klare nætter helt op til +43) — begge korrektioner retter
          # det ved kilden. 0 = stol blindt på met.no.
          - type: markdown
            content: Beskytter terrassens hynder mod at blive våde i nat.
          - type: tile
            entity: input_datetime.dug_laas_tid
            name: Vurderingen låses kl.
            grid_options:
              columns: 12
          - type: tile
            entity: input_datetime.dug_varsel_tid
            name: Varslet sendes kl.
            grid_options:
              columns: 12
          - type: markdown
            content: Fra "låses" fryser nattens vurdering til kl. 09 næste dag. Sæt altid låsen ≤ "sendes" — ellers låses der alligevel på sende-tidspunktet.
          # Tærskel = 100 − følsomhed. Standard 75 ≈ 1,5 t kondens (let, ægte dug) eller
          # 0,25 mm regn.
          - type: tile
            entity: input_datetime.dug_apollo_rgb_on
            name: LED tænder
            grid_options:
              columns: 12
          - type: tile
            entity: input_datetime.dug_apollo_rgb_off
            name: LED slukker
            grid_options:
              columns: 12
          # Styrke + blink-form er flyttet til den fælles slider under 🌦 Vejr — blink og
          # farver → Apollo RGB-varsel. Den gamle egne lysstyrke-slider her er fjernet.
          - type: markdown
            content: Pulserer blåt i stue og køkken i tidsrummet ovenfor.
      - type: grid
        cards:
          - type: heading
            heading: 🌧️ Regn i nat
            heading_style: title
            badges:
              - type: entity
                entity: sensor.regn_faldet
                name: Regn faldet
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_datetime.regn_rapport_tid
            name: Rapport sendes kl.
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.regn_rapport_vindue_timer
            name: Måler bagud
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.regn_rapport_min_mm
            name: Minimum for besked
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: En måling, ikke en prognose. Under minimum sendes intet.
      - type: grid
        cards:
          - type: heading
            heading: 🌱 Planter, fugt og disko
            heading_style: title
            badges:
              - type: entity
                entity: sensor.plant_overview
                name: Planter forfaldne
                state_content:
                  - name
                  - state
              - type: entity
                entity: sensor.indoor_humidity_resilient
                name: Luftfugtighed nu
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_number.fugt_varsel_pct
            name: Fugt-varsel tærskel
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Latchen ryddes først 3 point under tærsklen, så en sensor der vipper om
          # grænsen ikke pusher hver halve time.
          - type: markdown
            content: Kræver 10 min over tærsklen.
          # Klima-varsler (automations/climate_control.yaml) — var hårdt 18/27 °C
          # til 2026-10-10. Kold kræver 30 min, varm 10 min (TIMMERFLOTTE).
          - type: tile
            entity: input_number.klima_kold_graense
            name: 'Varsel: for koldt under'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.klima_varm_graense
            name: 'Varsel: for varmt over'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: Vises som notifikation i Home Assistant, ikke som push.
          - type: tile
            entity: input_number.alert_disko_steps
            name: Disko — antal farve-steps
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.alert_disko_step_ms
            name: Disko — step-længde
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Apollo-RGB'erne blænder deres egne lyssensorer i de ~10 sek diskoen kører —
          # lys-logik der læser *_lux_reel er upålidelig i det vindue.
          - type: markdown
            content: Varighed = antal × længde. Længde under ~450 ms kan få lamperne til at hakke.
          - type: tile
            entity: input_number.alert_disko_hue
            name: Disko — basis-farvetone (0=uændret)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: 🐕 Vagthunde
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.otbr_selfheal_daemon_ok
                name: Selv-heling i live
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_number.global_max_light_hours
            name: Sluk lys der har stået tændt i
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: Tvangs-slukker et lys der har stået tændt uafbrudt så længe — sikkerhedsnet mod glemt lys. Lavere = griber ind hurtigere.
          - type: tile
            entity: input_number.nat_lysvagt_minutter
            name: 'Nat-vagt: sluk tomt open-plan efter'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Måler lysets EGEN alder, ikke en presence-timer — et radar-spøgelse kan
          # nulstille en presence-timer, men ikke en tændt pære.
          - type: markdown
            content: Kun 23–06 i open plan.
          - type: tile
            entity: input_number.lys_spoegelse_varsel_minutter
            name: 'Spøgelses-lys: varsel efter'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Et HA-restart giver ~0,3 min udfald på alt lys — under ~5 min er ren støj,
          # ikke en hængt pære.
          - type: markdown
            content: Et lys der mister radioen mens det lyser, bliver fysisk tændt — her får du besked.
          - type: tile
            entity: input_number.thread_watchdog_down_minutes
            name: Thread nede før første kur
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.thread_watchdog_settle_minutes
            name: Bad-spots væk før besked
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.thread_watchdog_cooldown_minutes
            name: Thread-kure, største pause
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Hvor tit Thread-kortet spørger routerne over luften (meshdiag) —
          # status imellem kommer fra OTBR'ens lokale tabel hvert 2. min.
          - type: tile
            entity: input_number.thread_kort_maaling_minutter
            name: Thread-kort, mål hvert
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 2026-10-09: stigen giver aldrig op — TX-boost → chip-reset → USB-genplug
          # på skift, så længe binary_sensor.thread_border_router_nede er on.
          # Pære-detektoren rører aldrig OTBR'en. "Thread watchdog aktiv" stopper alt.
          - type: tile
            entity: binary_sensor.thread_border_router_nede
            name: Thread border-router
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.otbr_routere
            name: Routere i mesh'et
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.thread_watchdog_forsoeg
            name: Kure i denne nedetid
            grid_options:
              columns: 6
          - type: tile
            entity: script.thread_otbr_eskaler
            name: Kør næste kur nu
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: 🎓 Systemet spørger dig
            heading_style: title
          - type: markdown
            content: 6 trænere spørger med svar-knapper (ikke i AirBnB) — svaret bruges til senere at kalibrere systemet mod dine facit.
          # Minimum-gap mellem spørgsmål falder med intensiteten: 100→6,0/6,5 t
          # (aktivitet/dormant), 125→4,0/5,2 t, 200→2,0/3,25 t.
          - type: markdown
            content: Styrer alle trænere på én gang. 50 = ca. 2-4 spørgsmål om dagen.
          - type: tile
            entity: input_number.trainer_intensitet
            name: Spørge-intensitet (alle trænere)
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          # Tvivls-gaten (2026-10-20, user-spec: spørg kun ved edge cases):
          # aktivitets- og Dormant-træneren springer gæt over hvis seneste N
          # svar inden for D dage har ≥ P % rigtige. 8/90/120 → hjemmearbejde,
          # sofa_relax, terrasse_with_indoor + Dormant sikre (målt 20/10). Logik:
          # scripts/trainer_tvivl.py + packages/ai_trainer.yaml.
          - type: markdown
            content: Gæt du har bekræftet nok gange, spørges der ikke om igen — kun tvivlstilfælde.
          - type: tile
            entity: input_number.trainer_sikker_svar
            name: Sikker efter antal svar
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.trainer_sikker_pct
            name: Sikker ved træfsikkerhed
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.trainer_sikker_dage
            name: Svar tæller i
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.trainer_aktivitet_stabil_min
            name: 'Aktivitet: gæt skal have holdt i'
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.traener_aktivitet_sikre_gaet
            name: 'Aktivitet: sikre gæt'
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.traener_dormant_sikre_gaet
            name: 'Dormant: sikker'
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.trainer_aktivitet_enabled
            name: Aktivitets-træner til/fra
            grid_options:
              columns: 12
          - type: tile
            entity: input_datetime.trainer_aktivitet_tid
            name: 'Aktivitet: spørge-tid'
            grid_options:
              columns: 12
          # Spørger når terrasse-logikken slår til (2 min sammenhængende bevægelse),
          # begrænset af pause-slideren nedenfor.
          - type: tile
            entity: input_boolean.trainer_sherlock_enabled
            name: Sherlock-træner til/fra
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.trainer_sherlock_cooldown_timer
            name: 'Sherlock: pause mellem spørgsmål'
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.trainer_dug_enabled
            name: Dug-træner til/fra
            grid_options:
              columns: 12
          - type: tile
            entity: input_datetime.trainer_dug_tid
            name: 'Dug: spørge-tid (morgen)'
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.trainer_dug_min_score
            name: 'Dug: min. score for spørgsmål'
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          # B215: mini = score × (100 − intensitet)/50 — ved intensitet ≥ 100 er
          # mini 0, og dug spørger uanset scoren (bevidst: "100 = spørg altid").
          - type: markdown
            content: 'Gælder ikke: når spørge-intensiteten står på 100 eller derover.'
          - type: tile
            entity: input_boolean.trainer_maaltid_enabled
            name: Måltid-træner til/fra
            grid_options:
              columns: 12
          # Spørger 5 min efter en dvale-overgang, kun i dagtimerne.
          - type: tile
            entity: input_boolean.trainer_dormant_enabled
            name: Dormant-træner til/fra
            grid_options:
              columns: 12
          # Svaret "Utilsigtet" peger på gestus-hold-frames (for følsom aktivering);
          # "Forkert tal" betyder gestussen var bevidst, men tallet blev fejllæst — helt
          # andet fix.
          - type: tile
            entity: input_boolean.trainer_timer_enabled
            name: Køkken-timer-træner til/fra
            grid_options:
              columns: 12
  - title: ⚡ Energi
    path: el-pris
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 💸 Dæmp lyset når strømmen er dyr
            heading_style: title
            badges:
              - type: entity
                entity: sensor.elpris_spot_aktuel
                name: Spot nu
                state_content:
                  - name
                  - state
              - type: entity
                entity: sensor.lys_besparelse_i_dag
                name: Sparet i dag
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_number.elpris_paavirkning
            name: Dæmpning (0 = fra)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Spot holdes op mod 30-dages-gennemsnittet; mangler spot-feedet er faktoren
          # 1,0. Besparelserne samles på Statistik-siden.
          - type: markdown
            content: 'Gælder ikke: køkken-lyskædens madlavningslys og badets natlys.'
      - type: grid
        cards:
          - type: heading
            heading: 🔒 Luksus-lys
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.luksus_lys_elpris_block
                name: Blokerer nu
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_number.luksus_lys_elpris_aggressivitet
            name: Blokér ved høj pris (0 = fra)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 50 ≈ blokér når spot > 1,5× måneds-normen. Mangler spot → ingen blok.
          # Børne-strippen er ude siden 2026-09-28 (natlyset kører altid). Gruppen:
          # light.luksus_lys (packages/luksus_lys.yaml).
          - type: markdown
            content: Gælder terrassens pærelyskæde og stuens hyggelampe. Tænder du selv, virker de altid — og gæster er undtaget.
      - type: grid
        cards:
          - type: heading
            heading: 🔔 Varsel om høj pris
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.elpris_hoj_nu
                name: Høj pris nu
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_number.elpris_notif_over_gns_pct
            name: Varsl ved (% over 30-dages gns.)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 2026-10-20: korte spidser (målt 15-20/10: 2 af 12 pushes var én
          # enkelt høj time) pushes ikke. 0 = som før.
          - type: tile
            entity: input_number.elpris_notif_min_minutter
            name: Kun hvis høj i mindst
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: Push til begge telefoner, én gang pr. høj periode, kun 06:30–23:00.
      - type: grid
        cards:
          - type: heading
            heading: ⚠️ Lys-forbrug
            heading_style: title
          - type: tile
            entity: input_number.lys_kpi_alarm_timer
            name: Varsl når et rum har lyst over
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Hygge-strippen under 10 % er udeladt af Børn-timeren (natlyset gav ellers
          # falsk "hænger et lys?"-alarm kl. 05).
          - type: markdown
            content: Børnenes natlys tæller ikke med.
      - type: grid
        cards:
          - type: heading
            heading: 🔋 Cykel-lader
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.cykel_lader_nu
                name: Lader nu
                state_content:
                  - name
                  - state
          - type: tile
            entity: switch.entre_cykel_lader_plug
            name: Stikkontakt
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.cykel_lader_plan
            name: Planlagte timer
            color: green
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cykel_lader_effekt_cursor
            name: Målt effekt i nat (0 = ikke målt)
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cykel_lader_batteri_wh
            name: Batteriets kapacitet
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cykel_lader_langsom_watt
            name: Langsomste lader
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cykel_lader_taper_faktor
            name: Tillæg for langsom slutladning
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cykel_lader_session_timer
            name: Fast ladetid (0 = beregn selv)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_datetime.cykel_lader_deadline
            name: Klar senest
            grid_options:
              columns: 12
          - type: tile
            entity: input_datetime.cykel_lader_vindue_start
            name: Tidligst fra
            grid_options:
              columns: 12
          # Hans lader 175 W, hendes 72 W (begge batterier 504 Wh). Behov = kapacitet ×
          # taper ÷ målt effekt; før første måling antages den langsomme. Kun
          # Normal/Home Vacation; røgalarm spærrer hårdt.
          - type: markdown
            content: Lader i nattens billigste timer mellem *tidligst fra* og *klar senest*. Antallet af timer regnes ud fra laderens målte effekt.
      - type: grid
        cards:
          - type: heading
