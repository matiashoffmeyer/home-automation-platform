  # ===========================================================================
  # 📷 TAPO — alt hvad køkken-kameraet gør: kamera, stemme, gestus, diagnose
  # ===========================================================================
  # 2026-09-30 (user): flyttet ind som fane fra sit eget dashboard (tapo-dash)
  # — "alle indstillinger ind under den side som faner … så kan jeg søge i
  # alt på en gang". De fire gamle views er sektioner her, i samme rækkefølge.
  # Oprindelig user-spec 2026-09-16: "læg alle sliders og knapper der har med
  # tapo at gøre på en ha side for sig" + kill-switch pr. kommando-ord.
  # Begrundelser og måledata står i koden:
  #   · packages/tapo_tuning.yaml          — sliderne + kill-switchene (+ målingerne)
  #   · packages/voice_commands.yaml       — hovedafbryder + Party Time-vinduet
  #   · packages/koekken_gestus_timer.yaml — timerens egne tal
  #   · packages/koekken_kamera_krop.yaml  — krops-detektionen
  #   · docs/gesture_recognition.md        — gestus/blik-kalibreringen
  # FANEN ER KURATERET: rører du noget kamera-nært, skal det med her i SAMME
  # commit (📊).
  - title: 📷 Tapo
    path: tapo
    type: sections
    max_columns: 4
    sections:
      # ---------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: 📷 Kameraet lige nu
            heading_style: title
          # I AirBnB er kameraet fysisk pakket væk (juridisk krav, også
          # mikrofonen); shimmen lukker streamen og hver automation har sin egen
          # spærre. Advarslen vises kun i AirBnB.
          - type: markdown
            content: >-
              ⛔ **AirBnB** — kameraet skal være pakket væk. Intet på denne fane
              virker, før mode skiftes tilbage.
            visibility:
              - condition: state
                entity: input_select.house_mode
                state: AirBnB
          # IKKE sensor.koekken_stemme_kommando: den er REST-pushet og findes
          # slet ikke efter en restart. "ikke hørt siden genstart" er normalt.
          - type: entities
            entities:
              - entity: binary_sensor.koekken_kamera_vaagen
                name: Kameraet streamer
              - entity: binary_sensor.koekken_kamera_krop
                name: Ser en person
              - entity: binary_sensor.koekken_kamera_krop_gyldig
                name: Person-signalet er troværdigt
              - entity: sensor.koekken_stemme_sidst
                name: Sidst hørte kommando
              - entity: timer.koekken_gestus
                name: Køkken-timer


      # ---------------------------------------------------------------------
      # Kilden stemples af AFSENDEREN (fingre/stemme/knap), ikke gættet her.
      - type: grid
        cards:
          - type: heading
            heading: 📋 Hvem startede det?
            heading_style: title
          - type: markdown
            content: >-
              {% set log = state_attr('sensor.koekken_trigger_log','log') %}
              {% if log %}

              {% for r in log %}{{ loop.index }}. `{{ r }}`

              {% endfor %}

              {% else %}

              *Intet registreret endnu.*

              {% endif %}


      # ---------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: 🎛️ Til og fra
            heading_style: title
          - type: tile
            entity: input_boolean.voice_kommandoer_enabled
            name: Stemme-kommandoer
          - type: tile
            entity: input_boolean.gestus_kommandoer_enabled
            name: Gestus-kommandoer
          # Krops-detektion er også kravet bag stemme-kommandoerne og ét af to
          # vidner bag "børn hjemme". Gestus fra stopper også fotograferingen.
          - type: tile
            entity: input_boolean.koekken_kamera_krop_enabled
            name: Person-detektion
          - type: heading
            heading: Enkelte ord
            heading_style: subtitle
          # Afbryderne rammer ORDET, ikke handlingen: Party-knappen på Scener
          # virker stadig. Gælder både Assist i app'en og køkken-mikrofonen.
          - type: tile
            entity: input_boolean.voice_cmd_party_time
            name: '"Party Time"'
          - type: tile
            entity: input_boolean.voice_cmd_auto_mode
            name: '"Auto Mode"'
          - type: tile
            entity: input_boolean.voice_cmd_timer
            name: '"Timer N minutes"'


      # ---------------------------------------------------------------------
      # Mindste lys står på 0 (= fra) — MÅLT: 628 ægte fund, median 75,7 lx,
      # min 0,0 (C210 har IR). En gate på 8 lx smed 5,9 % af de ægte fund væk.
      - type: grid
        cards:
          - type: heading
            heading: 🧍 Person i billedet
            heading_style: title
          - type: tile
            entity: input_number.koekken_kamera_session_sekunder
            name: Person set før køkken-session
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.koekken_kamera_min_lux
            name: Mindste lys (0 = altid)
            features:
              - type: numeric-input
            features_position: bottom

      # ---------------------------------------------------------------------
      # Kun tre sætninger: speech-to-phrase snapper ALT til nærmeste trænede
      # sætning, så allowlisten er det der gør en åben mikrofon forsvarlig.
      # "minutes" er påkrævet: det beviser at hele sætningen er hørt (16/9).
      - type: grid
        cards:
          - type: heading
            heading: "🗣️ Stemme: hvad kan man sige?"
            heading_style: title
          - type: markdown
            content: |
              🎉 **"party time"** — festlys i rum med aktivitet
              🤖 **"auto mode"** — alle rum tilbage til Auto
              ⏲️ **"timer *N* minutes"** — fx *timer thirteen minutes*

              Kun engelsk, og *minutes* skal med.
          - type: tile
            entity: input_number.party_time_vindue_sek
            name: '"Party Time": aktivitet inden for'
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: sensor.party_rum_aktive
            name: Rum der ville danse nu


      # ---------------------------------------------------------------------
      # Billigt filter foran genkenderen: 21 lyd-stykker på 45 s kostede 51 s
      # genkendelse. Zero-crossings MÅLT: kommandoer ≤ 95, støj ≥ 118 → 110.
      # Genkenderen returnerer tom streng for alt meget længere end en sætning.
      - type: grid
        cards:
          - type: heading
            heading: 🔊 Hvornår er lyd tale?
            heading_style: title
          - type: tile
            entity: input_number.stemme_taerskel_dbfs
            name: Lydtærskel (lavere = mere følsom)
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.stemme_zcr_max
            name: Støjfilter (lavere = strengere)
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.stemme_min_laengde_sek
            name: Korteste sætning
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.stemme_max_laengde_sek
            name: Længste sætning
            features:
              - type: numeric-input
            features_position: bottom


      # ---------------------------------------------------------------------
      # Genkenderen har INGEN sikkerheds-score → afvisningen skal komme fra et
      # andet instrument (16/9: tomt køkken transskriberede "timer eight
      # minute"). Gaten er kamera ELLER radar; under ~30 s rammer man den der
      # står stille og taler. Halen gælder fingre+stemme+krop (én ffmpeg).
      # Sliderne virker inden for 20 s — shimmen spørger huset løbende.
      - type: grid
        cards:
          - type: heading
            heading: 👂 Hvornår lytter mikrofonen?
            heading_style: title
          - type: tile
            entity: input_number.stemme_krop_vindue_sek
            name: Person set inden for
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.stemme_cooldown_sek
            name: Pause efter en kommando
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.kamera_kigge_haleslaeb_sek
            name: Kameraet kigger videre i
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.kamera_openplan_hale_min
            name: Hold varm efter tomt open plan
            features:
              - type: numeric-input
            features_position: bottom


      # ---------------------------------------------------------------------
      # MÅLT 17/9: 56 min almindelig køkken-samtale → 14 falske kommandoer
      # (én hvert 4. min). Vinduet koster 0,4 % falsk pr. s → 12 s ≈ 5 %.
      # Én hånd = én kommando. Hold-kravet: 1 frame armerede af sig selv
      # (18/9); holdt hånd = 6+ frames, kadence 1,05 s/frame.
      # open_palm betyder også 5 i gestus-tællingen → call_me.
      - type: grid
        cards:
          - type: heading
            heading: ✋ Hånd op før du taler
            heading_style: title
          - type: markdown
            content: >-
              Løft hånden mod kameraet, vent til lyskæden pulserer blødt, og sig
              så kommandoen.
          - type: tile
            entity: input_boolean.koekken_stemme_arm_enabled
            name: Kræv hånd op
          - type: tile
            entity: input_number.stemme_arm_vindue_sek
            name: Mikrofonen lytter i
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.stemme_arm_score_min
            name: Hånd-genkendelse, mindste score
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.stemme_arm_hold_frames
            name: Hold hånden i (billeder)
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_text.koekken_stemme_arm_gestus
            name: Håndtegn
          - type: markdown
            content: >-
              Håndtegn: `call_me` 🤙, `rock_on` 🤘 eller `pinky` — ikke
              `open_palm` (det starter en 5-min timer).


      # ---------------------------------------------------------------------
      # Blik-model MÅLT 18/9: bevidste kig 3,5-15,4°, ambient 20,7-40,2° → 15-16.
      # 24° (midtpunktet af to mærkede sæt) armerede 10× på 95 min. Medianen
      # fjerner blink-frames (lukkede øjne = 31,1°); lige frames er strengere.
      # Kører kun når radaren ser nogen (~0,25 s CPU pr. frame).
      # Justér efter `ha addons logs local_gesture_frame_shim | grep "gaze cal"`.
      - type: grid
        cards:
          - type: heading
            heading: 👀 Eller kig ind i kameraet
            heading_style: title
          - type: markdown
            content: >-
              Kig op i kameraet og sig kommandoen — mens du kigger, eller efter
              pulsen.
          - type: tile
            entity: input_boolean.koekken_blik_arm_enabled
            name: Blik armerer også
          - type: tile
            entity: input_number.koekken_blik_taerskel_grader
            name: Hvor lige på (grader)
            features:
              - type: numeric-input
            features_position: bottom
          # 2026-10-03 (shim v0.15.0): løsere vinkel når blikket falder SAMMEN
          # med ytringen — et bevidst kig op i linsen (30 cm over hovedet) målte
          # 18-29° med 16° som krav. Ambient-ansigter ≥ 32°. 0 = slået fra.
          - type: tile
            entity: input_number.koekken_blik_tale_taerskel_grader
            name: Mens du taler (grader)
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.koekken_blik_frames
            name: Billeder i medianen
            features:
              - type: numeric-input
            features_position: bottom
          # B158: uafhængige krav — vinklen alene skiller ikke.
          - type: tile
            entity: input_number.koekken_blik_ansigt_score
            name: Mindste ansigts-sikkerhed
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.koekken_blik_frontal_max
            name: Ansigtet må højst dreje
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.koekken_klar_puls_pct
            name: Puls-styrke i lyskæden
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: sensor.koekken_blik_sidst
            name: Sidst målte blik

      # ---------------------------------------------------------------------
      # Kun de fem entydige tælle-håndtegn tæller (1-4 + flad hånd). Knytnæve
      # tæller kun uden fingre samtidig. Kameraet kigger kun når radaren ser
      # nogen, ~1 billede/s i serier på ~4 s. >10 min tilbage = 10 blink.
      - type: grid
        cards:
          - type: heading
            heading: "🖐️ Gestus: hvad kan man vise?"
            heading_style: title
          - type: markdown
            content: |
              🖐️ **1-10 fingre** = timer på så mange minutter
              ✊ **Knytnæve** = stop timeren eller alarmen
              👍 **Tommel op** = kvittér alarmen
          - type: tile
            entity: input_number.koekken_gestus_alarm_sek
            name: Alarmens længde
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.koekken_gestus_puls_pct
            name: Nedtællingens blink (%-point)
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.koekken_gestus_burst_interval_s
            name: Tid mellem blink-serier
            features:
              - type: numeric-input
            features_position: bottom


      # ---------------------------------------------------------------------
      # STAND-IN FOR HÅNDEN: knapperne fyrer PRÆCIS samme event som kameraet
      # (samme validering og gates, packages/koekken_gestus_timer.yaml).
      # Flyttet hertil fra Lys-siden 2026-09-19 (user: "off topic").
      - type: grid
        cards:
          - type: heading
            heading: ⏲️ Sæt en timer
            heading_style: title
          - type: markdown
            content: |
              {% set a = states('input_text.koekken_gestus_alarm') %}
              {% if a.startswith('aktiv') %}
              ### 🔴 Tiden er gået
              Tryk **Kvittér** eller vis tommel op.
              {% elif is_state('timer.koekken_gestus', 'active') %}
              {% set fa = state_attr('timer.koekken_gestus', 'finishes_at') %}
              {% set rest = ((as_timestamp(fa, 0) - now().timestamp()) / 60) | round(0, 'ceil') | int %}
              ### ⏲️ {{ rest }} min tilbage
              Et nyt tal overskriver den kørende timer.
              {% else %}
              Tryk et tal = så mange minutter.
              {% endif %}
          - type: grid
            columns: 5
            square: false
            cards:
              - type: button
                name: "1 min"
                icon: mdi:numeric-1-circle-outline
                show_state: false
                tap_action: &koekken_gestus_tap
                  action: perform-action
                  perform_action: script.koekken_gestus_saet
                  data:
                    minutter: 1
              - type: button
                name: "2 min"
                icon: mdi:numeric-2-circle-outline
                show_state: false
                tap_action:
                  <<: *koekken_gestus_tap
                  data:
                    minutter: 2
              - type: button
                name: "3 min"
                icon: mdi:numeric-3-circle-outline
                show_state: false
                tap_action:
                  <<: *koekken_gestus_tap
                  data:
                    minutter: 3
              - type: button
                name: "4 min"
                icon: mdi:numeric-4-circle-outline
                show_state: false
                tap_action:
                  <<: *koekken_gestus_tap
                  data:
                    minutter: 4
              - type: button
                name: "5 min"
                icon: mdi:numeric-5-circle-outline
                show_state: false
                tap_action:
                  <<: *koekken_gestus_tap
                  data:
                    minutter: 5
              - type: button
                name: "6 min"
                icon: mdi:numeric-6-circle-outline
                show_state: false
                tap_action:
                  <<: *koekken_gestus_tap
                  data:
                    minutter: 6
              - type: button
                name: "7 min"
                icon: mdi:numeric-7-circle-outline
                show_state: false
                tap_action:
                  <<: *koekken_gestus_tap
                  data:
                    minutter: 7
              - type: button
                name: "8 min"
                icon: mdi:numeric-8-circle-outline
                show_state: false
                tap_action:
                  <<: *koekken_gestus_tap
                  data:
                    minutter: 8
              - type: button
                name: "9 min"
                icon: mdi:numeric-9-circle-outline
                show_state: false
                tap_action:
                  <<: *koekken_gestus_tap
                  data:
                    minutter: 9
              - type: button
                name: "10 min"
                icon: mdi:numeric-10-circle-outline
                show_state: false
                tap_action:
                  <<: *koekken_gestus_tap
                  data:
                    minutter: 10
          # ALTID synlig: alarm-flaget er en dynamisk streng der ikke kan
          # matches med `state:`. Et tryk uden alarm er en no-op.
          - type: button
            name: Kvittér
            icon: mdi:thumb-up
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.koekken_gestus_kvittering


      # ---------------------------------------------------------------------
      # Kadence ~1,05 s/billede. 4 er MÅLT (15/9: to falske timere ramte præcis
      # 3 billeder; 93 bevidste hold lå alle på ≥ 4). Kommer falske timere
      # igen → 5; 3 er målt farligt. Knytnæven holdes kortere med vilje (skal
      # kunne stoppe en 15-s alarm). Virker i samme sekund du slipper.
      # 2026-10-05: holdet kan IKKE skille en fjern hånd fra en nær — en hånd
      # på 1,5 m holdt `four_fingers` i 6 frames i træk. Afstanden ejes af
      # gestus_min_haand_px (shimmens PalmGate maler for små palmer sorte);
      # skalaen skal blive på 100 % (en knytnæve på 50 cm kræver fuldt
      # billede). Fuld begrundelse: packages/tapo_tuning.yaml.
      - type: grid
        cards:
          - type: heading
            heading: ⏳ Hvor længe skal hånden holdes?
            heading_style: title
          - type: tile
            entity: input_number.gestus_min_haand_px
            name: Rækkevidde (større = kun tættere hænder)
            features:
              - type: numeric-input
            features_position: bottom
          # Knivmagneten blev læst som 4 fingre ved −115° (15/10). Ægte hænder
          # målt −58…+48°. 0 = fra. Gælder ikke knytnæven.
          - type: tile
            entity: input_number.gestus_max_rotation_grader
            name: Max hældning for fingre (0 = fra)
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.gestus_haand_skala_pct
            name: Billed-skala (normalt 100 %)
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.gestus_hold_frames
            name: Fingre holdes i (billeder)
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.gestus_hold_knytnaeve
            name: Knytnæve holdes i (billeder)
            features:
              - type: numeric-input
            features_position: bottom


      # ---------------------------------------------------------------------
      # Serier på 4,25 s med ~1,75 s mellemrum → under ~3 s bliver holdet
      # uopfyldeligt. Pausen gælder kun SAMME tal ("3 … nej, 8" virker straks).
      - type: grid
        cards:
          - type: heading
            heading: "🔁 Gestus: huller og gentagelser"
            heading_style: title
          - type: tile
            entity: input_number.gestus_frisk_sek
            name: Hold overlever et hul på
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: input_number.gestus_gentag_cooldown_sek
            name: Pause før samme tal igen
            features:
              - type: numeric-input
            features_position: bottom

      # ---------------------------------------------------------------------
      # Kæden: stream → krop → filter → allowlist. Et led der melder "OK"
      # beviser ikke det næste; mistænk leddet tættest på handlingen først.
      # Shimmens egne tællere: `/motion` på add-on'ets port (ikke i HA).
      # `unavailable` = valideringsfejlet og stum (fejlklasse #22).
      - type: grid
        cards:
          - type: heading
            heading: "🩺 Diagnose: automationerne"
            heading_style: title
          - type: entities
            entities:
              - entity: automation.stemme_talt_kommando_fra_kokken_kameraet
                name: Mikrofon → handling
              - entity: automation.stemme_party_time
                name: Assist "Party Time"
              - entity: automation.stemme_auto_mode
                name: Assist "Auto Mode"
              - entity: automation.stemme_timer_n_minutes
                name: Assist "Timer N minutes"
              - entity: automation.gestus_fingre_i_kokkenet_kokken_timer
                name: Fingre → timer
              - entity: automation.gestus_bevaegelse_i_kokkenet_bed_kameraet_kigge_efter_fingre
                name: Radar → kameraet kigger
              - entity: automation.kokken_radar_sa_en_krop_som_kameraet_ikke_kunne_se_tael_den
                name: Radar så en lav krop
          - type: markdown
            content: >-
              Står en af dem som *unavailable*, er den fejlet og gør ingenting.


      # ---------------------------------------------------------------------
      # Shimmen HOLDER RTSP-forbindelsen (og skal derfor stoppe i AirBnB);
      # Hand Recognition henter kun færdige billeder fra shimmen. Stemme-
      # sliderne på denne side vinder over add-on'ets egne (poll hvert 20. s).
      - type: grid
        cards:
          - type: heading
            heading: "📦 Diagnose: add-ons"
            heading_style: title
          - type: entities
            entities:
              - entity: update.gesture_frame_shim_update
                name: Gesture Frame Shim
              - entity: update.hand_recognition_update
                name: Hand Recognition
              - entity: input_text.koekken_gestus_pending
                name: Afventende gestus (kode:tid:billeder)


      # ---------------------------------------------------------------------
      # Ingen sensor kan bevise at kameraet er pakket væk → huset kræver en
      # menneske-kvittering og gentager varslet. Den ene push der OGSÅ sendes
      # i AirBnB (packages/kamera_airbnb_vagt.yaml).
      - type: grid
        cards:
          - type: heading
            heading: 🏡 Kamera-vagt i AirBnB
            heading_style: title
          - type: entities
            entities:
              - entity: input_select.house_mode
                name: Husets mode
              - entity: sensor.koekken_kamera_vagt
                name: Kamera-vagt (stempel)
  - title: 🚿 Bad
    path: bad
    type: sections
    max_columns: 4
    sections:
