            color: cyan
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.robot_lade_vindue_timer
            name: Ladevinduets længde
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.robot_lade_effekt_w
            name: Antaget ladeeffekt
            grid_options:
              columns: 12
          # Målt aug 2026: nat 1,70 kr/kWh mod middag 1,05 (solceller). Robottens
          # ladning er kun ~10 kWh/år; moppetørringen i dokken kan ikke flyttes.
          - type: markdown
            content: Vælger hver dag kl. 14 det billigste vindue i det næste døgn. Slået fra lader robotten 00–06.
      - type: grid
        cards:
          - type: heading
            heading: 🧮 Antagelser bag prisen
            heading_style: title
            badges:
              - type: entity
                entity: sensor.cost_net_tariff_aktuel
                name: Nettarif nu
                state_content:
                  - name
                  - state
              - type: entity
                entity: sensor.energi_data_service
                name: Pris nu ex moms
                state_content:
                  - name
                  - state
          - type: markdown
            content: Pris = (spot + nettarif + elafgift + tillæg) × moms. Ret tallene efter din elregning.
          - type: tile
            entity: input_number.cost_tariff_lavlast
            name: Nettarif lav (reserve)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_tariff_hojlast
            name: Nettarif høj (reserve)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_tariff_spidslast
            name: Nettarif spids (reserve)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_elafgift_kr_kwh
            name: Elafgift
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_markup_kr_kwh
            name: Leverandør-tillæg
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_spot_fallback_kr_kwh
            name: Spotpris hvis feedet mangler
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_nuc_watt
            name: NUC
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_dongles_watt
            name: Dongles
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_batteri_kr_aar
            name: Batterier pr. år
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_apollo_watt
            name: Apollo-sensorer
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_kamera_watt
            name: Tapo-kamera
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.cost_hoejttaler_watt
            name: Højttaler
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Kameraets 3,5 W er et konservativt døgn-snit (C210 + ~0,2 W billedbehandling
          # på NUC'en), ikke en måling. Mål: flyt adapteren til entré-pluggen og aflæs
          # sensor.entre_cykel_lader_effekt.
          # EDS rapporterer elafgift 0,008 kr/kWh (lempelse), ikke 0,76. Stemmer
