              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.vejr_vind_middel_threshold
            name: Vind — middel-tærskel
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.vejr_uv_threshold
            name: UV — tærskel
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: 🌦 Vejr — blink og farver
            heading_style: title
          - type: tile
            entity: input_number.alert_regn_blinks
            name: Regn — antal blink
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.alert_regn_hue
            name: Regn — farvetone
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.alert_sne_blinks
            name: Sne — antal glimt
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.alert_sne_kelvin
            name: Sne — hvid-temperatur
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.alert_vind_blinks
            name: Vind — antal blink
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.alert_vind_kelvin
            name: Vind — hvid-temperatur
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.alert_uv_blinks
            name: UV — antal blink
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.alert_uv_hue
            name: UV — farvetone
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.apollo_rgb_varsel_lysstyrke
            name: Lysstyrke (alle RGB-varsler)
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.apollo_rgb_varsel_blink
            name: Blink pr. minut
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 12
          # Max er sat til 60 % (ikke 100): ved 80 % målte fradraget +489 lx på
          # køkken-sensoren, nok til at clampe koekken_lux_reel til 0 og halvere
          # open_plan_lux. ESPHomes indbyggede "Slow Pulse" blev forkastet — den ramper
          # mod fuld lysstyrke uden mørkt vindue.
          - type: markdown
            content: Kort glimt én gang i minuttet — resten af tiden er LED'en slukket.
      - type: grid
        cards:
          - type: heading
            heading: 🌦 Vejr — tidspunkter
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.open_plan_varsel_publikum
