  # =============================================================================
  # Støvsug — indstillinger for robotstøvsugeren
  # =============================================================================
  # 2026-09-30 (user): kun INDSTILLINGERNE bor her (køen, robottens egne,
  # auto-rengøringen, morgen-udskyd, fjernbetjeningen). Kontrolpanelet (rum-
  # knapper, køen, hele huset, robot & dok) er igen sit eget dashboard,
  # dashboards/stoevsug.yaml (stoevsug-dash) — "indstillingerne skal være på
  # indstillinger siden men kontrolpanelet skal igen ha sin egen side".
  # Badget i første overskrift linker til kontrolpanelet og omvendt.
  # Hvad "hurtig"/"grundig" gør og hvor rum-navnene kommer fra: se headeren i
  # dashboards/stoevsug.yaml.
  # =============================================================================
  - title: 🧹 Støvsug
    path: stoevsug
    type: sections
    max_columns: 4
    sections:

      # =====================================================================
      # KØENS INDSTILLINGER
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: ⚙️ Køens indstillinger
            heading_style: title
            badges:
              - type: button
                text: Åbn Støvsug
                icon: mdi:arrow-right
                tap_action:
                  action: navigate
                  navigation_path: /stoevsug-dash/rengor
              - type: entity
                entity: sensor.roborock_rum_koe
                name: Kø nu
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_number.roborock_rum_koe_samlevindue_sekunder
            name: Saml tryk i
            icon: mdi:timer-sync
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.roborock_rum_koe_max_ventetid_minutter
            name: Giv op og ryd køen efter
            icon: mdi:timer-off
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Uden ventetiden ville det første tryk køre med det samme, og tryk
          # nummer to kunne aldrig nå at komme med i samme tur.
          - type: markdown
            content: >-
              **Saml tryk i** = ventetid på flere tryk (0 = start straks).
              **Giv op** = hvor længe en opgave venter på en robot der aldrig
              bliver ledig, før køen ryddes og du får besked.
          - type: markdown
            content: >-
              Gælder ikke: hel-hus-knapperne, den automatiske rengøring eller
              ture startet fra Roborock-app'en.

      # =====================================================================
      # ROBOTTENS EGNE INDSTILLINGER
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🔇 Robottens egne indstillinger
            heading_style: title
          - type: entities
            state_color: true
            entities:
              - entity: number.s8_maxv_ultra_volume
                name: Lydstyrke på robottens stemme
              - entity: switch.s8_maxv_ultra_do_not_disturb
                name: Forstyr ikke
              - entity: time.s8_maxv_ultra_do_not_disturb_begin
                name: Forstyr ikke — fra
              - entity: time.s8_maxv_ultra_do_not_disturb_end
                name: Forstyr ikke — til
              - entity: input_boolean.roborock_forsigtig_enabled
                name: Undvig ting på gulvet
              # 2026-10-22: spejdertur (kun mop) før hel-hus-kørsler i tomt
              # hus — script.roborock_start_med_spejder (packages/roborock.yaml).
              - entity: input_boolean.roborock_spejder_enabled
                name: Spejdertur før kørsel
              - entity: select.s8_maxv_ultra_dock_empty_mode
                name: Tømning af støvbeholder
              # Robottens EGEN off-peak-opladning (fast vindue i robotten).
              # Flyttet hertil fra Indstillinger → El & pris 2026-09-29.
              - entity: switch.s8_maxv_ultra_off_peak_charging
                name: Lad kun i billige timer
              - entity: time.s8_maxv_ultra_off_peak_start
                name: Billige timer — fra
              - entity: time.s8_maxv_ultra_off_peak_end
                name: Billige timer — til
          # 2026-10-22: "undvig ting" (collision avoid 2) gælder ALLE kørsler HA
          # starter, også hjemme. Spejderturen kun i tomt hus (user-spec: "når
          # vi er hjemme … der må vi hjælpe den"), foran hel-hus- OG rum-
          # kørsler (rum-kø, let stue-tur, måltid — 22/10), mildeste mop.
          # Sidder den fast, aflyses kørslen; et bestilt rum kører dog alligevel
          # hvis nogen er kommet hjem og kan hjælpe den.
          - type: markdown
            content: >-
              **Forstyr ikke**: intet selvstart, ingen lyd — men en knap her
              virker stadig. **Undvig ting**: alle kørsler HA starter.
              **Spejdertur**: mild mop før hele huset og rum, kun når ingen er
              hjemme — sidder den fast, kører den ikke bagefter.
          - type: markdown
            content: Ladetidspunktet styres på fanen ⚡ Energi.

      # =====================================================================
      # AF SIG SELV — kadencen for auto-rengøring på Dormant
      # =====================================================================
      # 2026-09-01 (user-spec): kadencen måles i VÆGTEDE AKTIV-TIMER, ikke i
      # døgn. Kilde: packages/roborock_aktiv_timer.yaml. Gaten som robotten
      # faktisk bruger er attributten `maa_starte` på
      # sensor.roborock_aktive_timer_siden_rengoring — de tal der vises her
      # læses fra samme anker, så kortet ikke kan love noget andet end huset gør.
      - type: grid
        cards:
          - type: heading
            heading: 🤖 Når robotten kører af sig selv
            heading_style: title
          - type: markdown
            content: >-
              Robotten starter selv når huset har været tomt og beskidt nok —
              målt i **aktive timer** (børnetimer tæller dobbelt), nulstilles
              kun ved en **hel-hus**-rengøring.

      # =====================================================================
      # STATUS — HVOR LANGT ER OPSPARINGEN
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 📊 Opsparing — hvor langt er den?
            heading_style: title
          - type: markdown
            content: |
              {% set s = 'sensor.roborock_aktive_timer_siden_rengoring' %}
              {% set t = states(s) | float(0) %}
              {% set maal = state_attr(s, 'interval_timer') | float(105) %}
              {% set pct = state_attr(s, 'procent') | int(0) %}
              {% set fyldt = (pct / 5) | int %}
              ## {{ t | round(0) | int }} af {{ maal | round(0) | int }} timer

              `{{ '█' * fyldt }}{{ '░' * (20 - fyldt) }}` **{{ pct }} %**

              {% if state_attr(s, 'maa_starte') %}
              ✅ **Klar** — robotten kører næste gang huset bliver tomt.
              {% else %}
              ⏳ Mangler **{{ state_attr(s, 'timer_tilbage') }} timer**.
              {% endif %}

              {% if is_state('binary_sensor.kids_home', 'on') %}
              👶 Børnene er hjemme — timerne tæller **dobbelt** lige nu.
              {% elif is_state('input_select.house_state', 'Active') %}
              🏠 Huset er aktivt — der tælles **normalt**.
              {% else %}
              💤 Huset er i dvale — der tælles **ikke** lige nu.
              {% endif %}

              Sidst nulstillet: {{ state_attr(s, 'nulstillet') }}
          - type: tile
            entity: input_select.house_state
            name: Huset lige nu
            icon: mdi:home-clock
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.kids_home
            name: Børn hjemme
            icon: mdi:account-child
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.roborock_aktive_timer_siden_rengoring
            name: Opsparede timer
            icon: mdi:timer-play-outline
            grid_options:
              columns: 6

      # =====================================================================
      # AF SIG SELV: HVOR OFTE
      # =====================================================================
      # Til orientering: huset er aktivt cirka 22 timer i døgnet, og børnene er
      # her omkring to tredjedele af tiden — så I sparer i praksis op med
      # cirka 36 timer i døgnet. 105 timer ≈ hver 3. dag (det den plejede at
      # gøre) · 70 ≈ hver 2. dag · 250 ≈ cirka en gang om ugen.
      - type: grid
        cards:
          - type: heading
            heading: "⏱️ Af sig selv: hvor ofte"
            heading_style: title
            badges:
              - type: entity
                entity: sensor.roborock_aktive_timer_siden_rengoring
                name: Opsparet nu
                state_content:
                  - name
                  - state
          - type: markdown
            content: >-
              Aktive timer der skal spares op før robotten selv kører hele
              huset (bortrejst = tælleren står stille). Kun fuld rengøring
              nulstiller — ren støvsugning trækker kun procenten fra.
          - type: entities
            entities:
              - entity: input_number.roborock_auto_interval_aktiv_timer
                name: Aktive timer mellem rengøringer
              - entity: input_number.roborock_stoevsug_reduktion_pct
                name: Støvsugning trækker fra (%)
              - entity: input_number.roborock_aktiv_minutter_akkumuleret
                name: Opsparet lige nu (minutter)
                secondary_info: last-changed

      # =====================================================================
      # HVAD AUTO-RENGØRINGEN LAVER
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🧽 Hvad auto-rengøringen laver
            heading_style: title
          - type: markdown
            content: >-
              Gælder ikke: knapperne på Støvsug-siden eller fjernbetjeningen — kun
              robotten når den starter af sig selv.
          - type: markdown
            content: |
              🔄 **Auto** — gulvvask hvis børn hjemme eller >3 dage siden, ellers kun støvsug
              💧 **Fuld rengøring** — altid støvsug og gulvvask
              💪 **Grundig rengøring** — kraftigste kombination, tager længst
              🧹 **Kun støvsugning** — moppen fra hver gang
          - type: entities
            entities:
              - entity: input_select.roborock_auto_dormant_handling
                name: Auto-rengøringen gør

      # =====================================================================
      # ANDRE STOP-BETINGELSER
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🚦 Andre stop-betingelser for auto-rengøring
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.roborock_elpris_block
                name: Strøm dyr nu
                state_content:
                  - name
                  - state
          - type: markdown
            content: >-
              Selv med fuld opsparing venter robotten: ingen må være hjemme,
              hoveddøren skal have været åbnet siden sidste tur, kun **08–21**,
              og mindst **30 % batteri**.
          - type: entities
            entities:
              - entity: input_boolean.roborock_auto_paused
                name: På pause (rod på gulvet)
              - entity: input_boolean.roborock_let_stue_enabled
                name: Let stue-tur på mellemdage
              - entity: input_datetime.roborock_let_clean_at
                name: Sidste lette stue-tur
              - entity: input_number.roborock_elpris_aggressivitet
                name: Vent på billig strøm
              - entity: input_number.roborock_dormant_delay_minutter
                name: Karantæne efter huset bliver tomt

      # =====================================================================
      # SPØRG MIG FØRST
      # =====================================================================
      # Flyttet hertil fra Indstillinger → El & pris 2026-09-29: robottens
      # adfærd bor på robottens side.
      - type: grid
        cards:
          - type: heading
            heading: 📱 Spørg mig først
            heading_style: title
          - type: markdown
            content: Huset spørger på telefonen, før robotten kører af sig selv.
          - type: entities
            entities:
              - entity: input_boolean.roborock_godkendelse_enabled
                name: Kræv mit ja
              - entity: sensor.roborock_godkendelse_status
                name: Status

      # =====================================================================
      # MORGEN — VENT TIL I ER GÅET
      # =====================================================================
      # Morgen-pausen rammer kun HEL-HUS-starter (Styrbar OP, app, robotknap);
      # zone-cleans og måltids-støvsugning kører frit. Dormant skal holde i N
      # min, fordi huset selv vender tilbage til Active efter 5 min hvis nogen
      # alligevel er hjemme. Gælder alle ugedage. "Fortsæt" i Roborock-app'en
      # opgiver ventetiden lydløst; efter giv-op-tiden kører den på dock.
      - type: grid
        cards:
          - type: heading
            heading: ⏸️ Morgen — vent til I er gået
            heading_style: title
          - type: markdown
            content: >-
              Starter du robotten om morgenen mens I er hjemme, kører den kort
              og holder så pause, til huset er tomt.
          - type: entities
            entities:
              - entity: input_datetime.roborock_morgen_udskyd_start
                name: Morgen fra
              - entity: input_datetime.roborock_morgen_udskyd_slut
                name: Morgen til
              - entity: input_number.roborock_morgen_vis_sekunder
                name: Kører kort i
              - entity: input_number.roborock_morgen_dormant_settle_minutter
                name: Huset skal være tomt i
              - entity: input_number.roborock_morgen_vent_max_minutter
                name: Giv op efter
              - entity: input_boolean.roborock_morgen_venter
                name: Venter lige nu
              - entity: input_datetime.roborock_morgen_vent_start
                name: Pause startet

      # =====================================================================
      # FJERNBETJENING — hvad den fysiske Styrbar gør
      # =====================================================================
      # Rum-navnene herunder templates ud af sensor.roborock_rum_kort — der
      # står BEVIDST ikke et eneste segment-nummer eller hardkodet rum-navn i
      # disse kort. Rækkefølgen kommer fra `slugs`-attributten og er den samme
      # som kø-ordenen.
      - type: grid
        cards:
          - type: heading
            heading: 🔘 Fjernbetjeningen
            heading_style: title
          # Kort tryk = ét klik på øverste knap. Langt tryk = hold den nede.
          - type: markdown
            content: >-
              Den løse Styrbar. Hver af de to OP-tryk sættes til **valgte rum**
              (i kø som rum-knapperne) eller **hele huset** (med det samme).

      # =====================================================================
      # KORT TRYK OP
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: ⬆️ Kort tryk OP
            heading_style: title
          - type: entities
            entities:
              - entity: input_select.roborock_styrbar_kort_op
                name: Gør dette
          - type: markdown
            content: >-
              {% set m = state_attr('sensor.roborock_rum_kort', 'rum') |
              default({}, true) %}{% set s =
              state_attr('sensor.roborock_rum_kort', 'slugs') | default({}, true)
              %}{% set h = states('input_select.roborock_styrbar_kort_op') %}{%
              set ns = namespace(o=[]) %}{% for slug, seg in s.items() %}{% if
              is_state('input_boolean.roborock_styrbar_kort_op_' ~ slug, 'on')
              %}{% set k = (seg[0] if seg is list else seg) | string %}{% set ns.o
              = ns.o + [m.get(k, 'Segment ' ~ k)] %}{%
              endif %}{% endfor %}{% if h.startswith('Valgte rum') %}{% if ns.o |
              count == 0 %}🚨 **Ingen rum valgt** — knappen gør ingenting. Sæt
              flueben nedenfor.{% else %}➡️ **{{ ns.o | join(' · ') }}** — {{
              'SmartPlan (robotten vælger selv sug og gulvvask pr. rum)' if
              'SmartPlan' in h else 'grundig (støvsug + gulvvask)' if 'grundig'
              in h else 'hurtig (kun støvsug)' }}{% endif %}{% else %}➡️ **{{ h
              }}**{% endif %}
          - type: entities
            title: Rum for kort tryk
            state_color: true
            entities:
              - entity: input_boolean.roborock_styrbar_kort_op_stue
                name: Stue
              - entity: input_boolean.roborock_styrbar_kort_op_spisestue
                name: Spisestue
              - entity: input_boolean.roborock_styrbar_kort_op_koekken
                name: Køkken
              - entity: input_boolean.roborock_styrbar_kort_op_entre
                name: Entré
              - entity: input_boolean.roborock_styrbar_kort_op_sovevaerelse
                name: Soveværelse
              - entity: input_boolean.roborock_styrbar_kort_op_boernevaerelse
                name: Børneværelse
              - entity: input_boolean.roborock_styrbar_kort_op_badevaerelse
                name: Badeværelse
              - entity: input_boolean.roborock_styrbar_kort_op_depot
                name: Depot
          - type: markdown
            content: >-
              Rummene bruges kun når handlingen ovenfor er **valgte rum**. Står
              den på hele huset, er fluebenene gemt til næste gang.

      # =====================================================================
      # LANGT TRYK OP
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: ⏫ Langt tryk OP
            heading_style: title
          - type: entities
            entities:
              - entity: input_select.roborock_styrbar_lang_op
                name: Gør dette
          - type: markdown
            content: >-
              {% set m = state_attr('sensor.roborock_rum_kort', 'rum') |
              default({}, true) %}{% set s =
              state_attr('sensor.roborock_rum_kort', 'slugs') | default({}, true)
              %}{% set h = states('input_select.roborock_styrbar_lang_op') %}{%
              set ns = namespace(o=[]) %}{% for slug, seg in s.items() %}{% if
              is_state('input_boolean.roborock_styrbar_lang_op_' ~ slug, 'on')
              %}{% set k = (seg[0] if seg is list else seg) | string %}{% set ns.o
              = ns.o + [m.get(k, 'Segment ' ~ k)] %}{%
              endif %}{% endfor %}{% if h.startswith('Valgte rum') %}{% if ns.o |
              count == 0 %}🚨 **Ingen rum valgt** — knappen gør ingenting. Sæt
              flueben nedenfor.{% else %}➡️ **{{ ns.o | join(' · ') }}** — {{
              'SmartPlan (robotten vælger selv sug og gulvvask pr. rum)' if
              'SmartPlan' in h else 'grundig (støvsug + gulvvask)' if 'grundig'
              in h else 'hurtig (kun støvsug)' }}{% endif %}{% else %}➡️ **{{ h
              }}**{% endif %}
          - type: entities
            title: Rum for langt tryk
            state_color: true
            entities:
              - entity: input_boolean.roborock_styrbar_lang_op_stue
                name: Stue
              - entity: input_boolean.roborock_styrbar_lang_op_spisestue
                name: Spisestue
              - entity: input_boolean.roborock_styrbar_lang_op_koekken
                name: Køkken
              - entity: input_boolean.roborock_styrbar_lang_op_entre
                name: Entré
              - entity: input_boolean.roborock_styrbar_lang_op_sovevaerelse
                name: Soveværelse
              - entity: input_boolean.roborock_styrbar_lang_op_boernevaerelse
                name: Børneværelse
              - entity: input_boolean.roborock_styrbar_lang_op_badevaerelse
                name: Badeværelse
              - entity: input_boolean.roborock_styrbar_lang_op_depot
                name: Depot

      # =====================================================================
      # NED-KNAPPEN (fast)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: ⬇️ NED-knappen
            heading_style: title
          # NED er robottens fysiske stop-knap og skal virke uden at nogen
          # først har været inde på denne side — den kan ikke laves om.
          - type: markdown
            content: >-
              🛑 **Kører robotten** → stopper og kører hjem (tæller ikke som
              gennemført). ⏸️ **Står den stille** → slår automatisk rengøring
              til/fra.
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.roborock_auto_paused
                state: "on"
            card:
              type: markdown
              content: >
                ⏸️ **Automatisk rengøring er på pause lige nu.** Tryk NED på
                fjernbetjeningen igen — eller start en tur herfra — for at
                fortsætte som normalt.
  # ===========================================================================
  # 💧 VANDVENTIL — LÅST fane (vandskade-risiko, user-spec 2026-08-10)
  # ===========================================================================
  # 2026-09-30 (user): flyttet ind som fane fra sit eget dashboard
  # (vandventil-dash). "Tænd"-knappen kalder KUN script.vandventil_taend — den
  # eneste sanktionerede vej til at tænde ventilen (håndhævet i
  # packages/vandventil.yaml, ikke her). Status-tilen har bevidst INGEN
  # toggle-kontrol, så et tilfældigt tryk ikke sender et direkte
  # switch.turn_on (ville blive slukket + alarmeret alligevel, men undgå den
  # falske alarm) — derfor også icon_tap_action: more-info, ellers toggler et
  # tryk på tilens ikon switchen direkte. "Sluk nu" må gerne kalde switchen
  # direkte — at slukke er altid sikkert.
  - title: 💧 Vandventil
    path: vandventil
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 💧 Vandventil
            heading_style: title
          - type: tile
            entity: switch.sonoff_swv
            name: Ventilen
            icon: mdi:valve
            features: []
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: button
            name: Tænd (slukker selv)
            icon: mdi:play-circle
            tap_action:
              action: perform-action
              perform_action: script.vandventil_taend
          - type: button
            name: Sluk nu
            icon: mdi:stop-circle
            tap_action:
              action: perform-action
              perform_action: switch.turn_off
              target:
                entity_id: switch.sonoff_swv
          - type: tile
            entity: input_number.vandventil_max_sekunder
            name: Slukker selv efter
            icon: mdi:timer-alert
            features:
              - type: numeric-input
            features_position: bottom
          - type: tile
            entity: sensor.vandventil_liter_denne_session
            name: Liter denne gang
            icon: mdi:water
  - title: 🔔 Notifikationer
    path: notifikationer
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🔔 Alle notifikationer
            heading_style: title
          # Én central dispatch (notif_queue). Parent A = phone_a, Parent B =
          # phone_b; ingen telefon valgt = sendes ikke. Kritisk bør stå på
          # altid.
          - type: markdown
            content: 'Pr. besked: om den sendes, til hvem og hvornår. **Fra = Til** (fx 00:00–00:00) betyder hele døgnet — beskeder uden for vinduet droppes, de udskydes ikke.'
          - type: tile
            entity: input_boolean.notifikationer_master_enabled
            name: Alle notifikationer
            grid_options:
              columns: 12
          # B215: direkte pushes uden om master = kun røgalarm + kamera-vagt
          # (bevidst). Resten er gatet 2026-10-11 (user: "master toggle skal
          # også slå dem fra"); kvitteringer på dine knaptryk og
          # clear_notification/command_stop_tts er ikke gatet (svar, ikke varsler).
          # Ny direkte push? grep "notify.mobile_app_phone_a" + gate den.
          - type: markdown
            content: 'Gælder ikke: røgalarm, kamera-vagt.'
      - type: grid
        cards:
          - type: heading
            heading: 🚨 Kritisk — altid
            heading_style: title
          - type: heading
            heading: 🚨 Vandlæk
            heading_style: subtitle
          - type: tile
            entity: input_boolean.notif_vandlaek_enabled
            name: Send
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.notif_vandlaek_parent_a
            name: Parent A
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.notif_vandlaek_parent_b
            name: Parent B
            grid_options:
              columns: 6
          - type: tile
            entity: input_datetime.notif_vandlaek_start
            name: Fra kl.
            grid_options:
              columns: 6
          - type: tile
            entity: input_datetime.notif_vandlaek_slut
            name: Til kl.
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.notif_vandlaek_airbnb
            name: Også i AirBnB
            grid_options:
              columns: 6
          - type: heading
            heading: 🧵 Thread / badet strømløst
            heading_style: subtitle
          - type: tile
            entity: input_boolean.notif_thread_enabled
            name: Send
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.notif_thread_parent_a
            name: Parent A
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.notif_thread_parent_b
            name: Parent B
            grid_options:
              columns: 6
          - type: tile
            entity: input_datetime.notif_thread_start
            name: Fra kl.
            grid_options:
              columns: 6
          - type: tile
            entity: input_datetime.notif_thread_slut
            name: Til kl.
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.notif_thread_airbnb
            name: Også i AirBnB
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: 🔧 Drift og hardware
            heading_style: title
          - type: heading
            heading: 🔋 Lavt batteri
            heading_style: subtitle
          - type: tile
            entity: input_boolean.notif_batteri_enabled
            name: Send
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.notif_batteri_parent_a
            name: Parent A
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.notif_batteri_parent_b
            name: Parent B
            grid_options:
              columns: 6
          - type: tile
            entity: input_datetime.notif_batteri_start
            name: Fra kl.
            grid_options:
              columns: 6
          - type: tile
            entity: input_datetime.notif_batteri_slut
            name: Til kl.
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.notif_batteri_airbnb
            name: Også i AirBnB
            grid_options:
              columns: 6
          - type: heading
            heading: 📟 Fjernbetjening svarer ikke
