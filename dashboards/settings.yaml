        cards:
          - type: heading
            heading: 🚿 Lige nu
            heading_style: title
          - type: markdown
            content: 'Badet har tre faser: **Quick** (kort kig ind), **Medium** (kort besøg) og **Fuld** (bad bag lukket dør).'
          - type: tile
            entity: sensor.badevaerelse_aktiv_fase
