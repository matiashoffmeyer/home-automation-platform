      - type: grid
        cards:
          - type: heading
            heading: 🔦 Hvilke spots tænder
            heading_style: title
          - type: markdown
            content: Slå en spot fra, så tænder den ikke i den fase. Spot 1-3 er husets Thread-routere.
          - type: entities
