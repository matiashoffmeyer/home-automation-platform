            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: Hæv den, hvis badet virker gulligt om aftenen.
          - type: heading
            heading: Natlys slutter om morgenen
            heading_style: subtitle
          - type: tile
            entity: input_datetime.badevaerelse_dagmode_senest
