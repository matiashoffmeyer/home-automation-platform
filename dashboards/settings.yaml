            content: 'Hver radar har en tærskel pr. afstand (gate ≈ 75 cm). **Lavere tal = mere følsom.** Tænder lyset i et tomt rum: hæv gatet hvor afstanden peger. Slukker det mens nogen sidder stille: sænk *still*-tallet.'
          # Et menneske flytter afstanden hele tiden (målt 20/8: 193→230→275→266 cm på 5
          # s); et møbel holder værdien identisk til decimalen.
