            grid_options:
              columns: 12
          - type: tile
            entity: sensor.maaltid_oprydning_min_i_vindue
            name: Køkken — oprydning
            icon: mdi:broom
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: ⏱️ Hvornår er det et måltid?
            heading_style: title
          - type: markdown
            content: Krav = minutter med aktivitet inden for vinduet. Vinduet skal være større end kravet.
          - type: tile
            entity: input_number.maaltid_madlavning_minutter
            name: Madlavning — krav
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.maaltid_madlavning_vindue_minutter
            name: Madlavning — vindue
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.maaltid_spisning_minutter
            name: Spisning — krav
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.maaltid_spisning_vindue_minutter
            name: Spisning — vindue
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.maaltid_oprydning_minutter
            name: Oprydning — krav
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.maaltid_oprydning_vindue_minutter
            name: Oprydning — vindue
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.maaltid_registrer_min_spisestue_min
            name: Ved bordet før det registreres
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Kalibreret mod 25 træner-svar: 14 ægte måltider lå på 3,0-30,0 min (median
          # 27), 11 falske på 0,0-30,0. Default 2,5 dræber 3 falske uden at ramme et
          # ægte; 20 dræber 7/11 falske men mister et hurtigt morgenmåltid (3,0 min,
          # 24/07).
          - type: tile
            entity: input_number.maaltid_reset_minutter
            name: Nulstil efter
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: 💡 Spiselys
            heading_style: title
          # Lux-tærsklen deles med spisestue-loftets normale presence-tænd (👁️-fanen, nu
          # separat fra stue) — ret ét sted, ramt begge steder.
          # Farve/styrke/sluk-sliderne herunder rammer KUN måltids-spiselyset.
          - type: markdown
            content: Tænder spisestue-loftet under måltidet, når det er mørkt nok — grænsen står under 💡 Lys → Spisestue.
          - type: tile
            entity: input_number.maaltid_spiselys_kelvin
            name: Farve
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.maaltid_spiselys_brightness
            name: Lysstyrke
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.maaltid_spiselys_tomt_minutter
            name: Sluk når tomt i
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: 🤖 Støvsug efter måltid
            heading_style: title
          # "Dagens første" læses fra robottens EGEN last_clean_begin (fanger
          # app/knap/tidsplan-starter, ikke kun HA) — vores stempler er kun fallback.
          # Vent-på-tomt-køkken stopper altid senest ved robottens "forstyr ikke"-tid
          # (22:00), og alle gates gentjekkes ved faktisk start.
          - type: markdown
            content: Støvsuger stuen efter et måltid, når børnene er hjemme og robotten ikke har kørt i dag.
          - type: button
            entity: script.maaltid_stovsug_living_room
            name: 'Test: støvsug stuen nu'
            icon: mdi:robot-vacuum
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.maaltid_stovsug_living_room
          # Målt over 14 dage: aftener har halvdelen af stille-pauser under 1 min. Ved 5
          # min blev alle 17 måltider støvsuget inden for 83 min; 8-10 min giver ofte 4
          # timers ventetid, så maks-loftet rammes i stedet og intet støvsuges.
          - type: tile
            entity: input_number.maaltid_stovsug_koekken_tomt_minutter
            name: Køkkenet skal være tomt i
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.maaltid_stovsug_vent_max_minutter
            name: Opgiv efter
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.maaltid_stovsug_venter
            name: Venter på tomt køkken
            grid_options:
              columns: 12
          - type: tile
            entity: binary_sensor.roborock_startet_i_dag
            name: Robotten har kørt i dag
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: 💻 Hjemmearbejde
            heading_style: title
            badges:
              - type: entity
                entity: sensor.hjemmearbejde_ophold_min_i_vindue
                name: Ophold nu
                state_content:
                  - name
                  - state
          # Bekræftelses-vinduet nedenfor er nu KUN en støvsuge-forsinkelse (ikke
          # længere med til at afgøre om dagen er hjemmearbejde). Kalibreret mod 8 dage:
