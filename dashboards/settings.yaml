  - title: 🚨 Varsler
    path: varsler
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🌦 Vejr — hvornår der varsles
            heading_style: title
          - type: markdown
            content: Lavere = varsler oftere. Sæt en tærskel på max for at slå typen fra.
          - type: tile
            entity: input_number.vejr_regn_mm_threshold
            name: Regn — mm-tærskel
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.vejr_regn_prob_threshold
            name: Regn — byge-sandsynlighed
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.vejr_vind_gust_threshold
