            content: Rydder øjeblikkeligt ved registreret afgang. Er telefonen bare stille i hjemme-zonen, rydder flaget først efter timer-tallet nedenfor.
          # Det rigtige fix er at sætte iOS-tilladelsen tilbage til "Altid". Parent A's
