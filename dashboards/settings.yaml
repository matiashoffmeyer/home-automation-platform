            entities:
              - entity: input_boolean.badevaerelse_quick_spot_1
                name: Spot 1
              - entity: input_boolean.badevaerelse_quick_spot_2
                name: Spot 2
              - entity: input_boolean.badevaerelse_quick_spot_3
                name: Spot 3
              - entity: input_boolean.badevaerelse_quick_spot_4
                name: Spot 4
              - entity: input_boolean.badevaerelse_quick_spot_5
