            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 2026-10-01: lux-tærsklen ved ≥ 15° sol; under 15° × e^(−0,19·(15−elev))
          # (sensor.mosbillede_lux_taerskel, × 0,8 mens gardinet holdes). Gælder
          # hele episoden — falder dagslyset under, slipper beskyttelsen efter
          # 15 min. 400 = målt skel: klare dage 482-932 lx ved 15°, overskyet
