            features_position: bottom
            grid_options:
              columns: 12
          # Spørg-træneren (2026-10-18): i tvivl-zonen (sol ≥ az_fra, under
          # elev_maks, lux ok) spørger den Parent A; svaret styrer gardinet i N min
          # og logges til ai_feedback/mosbillede_feedback.jsonl.
          - type: tile
            entity: input_boolean.mosbillede_spoerg_enabled
            name: Spørg mig når modellen er i tvivl
            grid_options:
