# =============================================================================
# Indstillinger — alle husets indstillinger, sorteret efter emne
# =============================================================================
# DESIGNREGLER (user-spec 2026-09-29: "Gør ting nemme og intuitive at forstå.
# Sørg for mindre tekst — kun hvad jeg har brug for at vide, ikke synlige noter
# til dig selv."):
#   - Første fane er 🔍 Søg (www/indstillinger-soeg.js). Den læser dashboardenes
#     config live, så en ny slider er søgbar i samme sekund den står på en side.
#   - ÉN SEKTION PR. EMNE (rum eller funktion) — aldrig én kæmpe-sektion med
#     mellem-overskrifter: sektionerne er det der flyder i kolonner på desktop.
#   - Tile-navne: kort dansk, ingen emoji (tilen har ikon), skrevet så værdien
#     fuldender sætningen ("Sluk efter" → "90 s"). Gentag ikke sektionens rum.
#   - SYNLIG TEKST er kun: (1) scope-undtagelse "Gælder ikke: …" som ÉN linje
#     (🎛️-reglen, user-spec 2026-07-02), (2) én linje brugs-instruks, (3) live-
#     status. Begrundelser, måledata, datoer, incident-historik og entity-navne
#     er noter til udviklere → YAML-kommentar over tilen (som herunder) eller i
#     koden. De blev fjernet fra siden 2026-09-29 og står i git-historikken.
#   - Live-værdier man skal bruge mens man justerer (fx dagslys nu) står som
#     badge i sektionens overskrift, ikke som ekstra tiles.
#   - ÉT dashboard med faner (user-spec 2026-09-30: "alle indstillinger ind
#     under den side som faner … så kan jeg søge i alt på en gang"): Støvsug,
#     Mad, AirBnB, Tapo og Vandventil var egne dashboards indtil da og er nu
#     faner her. Egne sider er KUN Lys, Scener, Festlys og info-siderne. Et
#     emnes indstillinger står på emnets fane; andre faner linker dertil.
#     Undgå dubletter: én indstilling, ét sted.
# Lovelace mode: yaml — registreret i configuration.yaml (indstillinger-dash).
# =============================================================================
title: Indstillinger
icon: mdi:cog
views:
  - title: 🔍 Søg
    path: soeg
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:indstillinger-soeg-card
            dashboards:
              - url_path: indstillinger-dash
                title: Indstillinger
              - url_path: lys-dash
                title: Lys
              - url_path: festlys-dash
                title: Festlys
              - url_path: scener-dash
                title: Scener
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Fanerne
            heading_style: subtitle
          - type: markdown
            content: |-
              | | |
              |---|---|
              | [💡 **Lys**](/indstillinger-dash/lys-styrke) | Styrke, farve, tænd og sluk — hele huset og rum for rum |
              | [🍳 **Køkken**](/indstillinger-dash/koekken) | Spots, lyskæde, madlavning og film |
              | [📷 **Tapo**](/indstillinger-dash/tapo) | Køkken-kameraet: stemme, gestus og timer |
              | [🚿 **Bad**](/indstillinger-dash/bad) | Faser, spots og hvornår lyset slukker |
              | [🌙 **Søvn**](/indstillinger-dash/nat-boern) | Aftenlys, putning, godnat, nattur og vækning |
              | [🪟 **Gardiner**](/indstillinger-dash/gardiner) | Morgen, aften, privacy, sommer og vinter |
              | [🍽️ **Måltid**](/indstillinger-dash/maaltid) | Hvornår huset ser et måltid — og hvad der så sker |
              | [🥘 **Mad**](/indstillinger-dash/mad) | Ret-spørgsmål, indkøbsliste-plan og Nemlig |
              | [🏠 **Hus**](/indstillinger-dash/hus) | Dvale, hvem er hjemme, børn hjemme og røgalarm |
              | [🧹 **Støvsug**](/indstillinger-dash/stoevsug) | Køen, auto-rengøring, morgen og fjernbetjeningen |
              | [💧 **Vandventil**](/indstillinger-dash/vandventil) | Tænd og sluk vandet |
              | [🔔 **Notifikationer**](/indstillinger-dash/notifikationer) | Hvilke beskeder, til hvem og hvornår |
              | [🚨 **Varsler**](/indstillinger-dash/varsler) | Vejr-blink, dug, planter og vagthunde |
              | [⚡ **Energi**](/indstillinger-dash/el-pris) | Elpris, luksus-lys og opladning |
              | [🎛️ **Til/fra**](/indstillinger-dash/kill-switches) | Alle funktioner samlet |
              | [🏡 **AirBnB**](/indstillinger-dash/airbnb-tuning) | Gæste-mode, check-in/ud og hvad gæster oplever anderledes |
              | [🔧 **Kalibrering**](/indstillinger-dash/sensorer-lux) | Radarer, spøgelses-filtre og målte tærskler — sjældent |
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Andre sider med indstillinger
            heading_style: subtitle
            badges:
              - type: button
                text: Lys
                icon: mdi:lightbulb-group
                tap_action:
                  action: navigate
                  navigation_path: /lys-dash/lys
              - type: button
                text: Festlys
                icon: mdi:party-popper
                tap_action:
                  action: navigate
                  navigation_path: /festlys-dash/festlys
  - title: 💡 Lys
    path: lys-styrke
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 💡 Hele huset
            heading_style: title
            badges:
              - type: entity
                entity: sensor.auto_color_temp_evening
                name: Farve nu
                state_content:
                  - name
                  - state
              - type: entity
                entity: sensor.rum_tom_sluk_sekunder
                name: Ventetid nu
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_number.global_light_aggressiveness
            name: Lysstyrke på auto-lys
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 0 = 2 % af normalt, 100 = 6×. Virker straks på auto-tændte lys; rum i
          # Manual/godnat/fest/film røres ikke.
          - type: markdown
            content: 'Gælder ikke: køkken-lyskæde, bad, soveværelsets smart-lys, depot-forlys, børne-strip og entréens natlys.'
          - type: tile
            entity: input_number.global_evening_warmth
            name: Varmere lys om aftenen
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: 'Gælder ikke: soveværelset (egen slider), badet (eget minimum), køkken-lyskæden (egen farve).'
          - type: tile
            entity: input_number.global_lux_sensitivity
            name: Hvor let lyset tænder (flytter også sluk)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 2026-10-10: de to lysstyrke-trin (bælgmørkt 5 / dunkelt 20) var hårdkodet
          # 26 steder i 12 filer — nu ét anker hver (packages/room_lux_tuning.yaml).
          # Under bælgmørkt = højeste lysstyrke, under dunkelt = mellemtrin, ellers lavest.
          - type: tile
            entity: input_number.lux_trin_moerkt
            name: Kraftigst lys når mørkere end
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.lux_trin_dunkelt
            name: Mellem-lys når mørkere end
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          - type: markdown
            content: 'Gælder ikke mellem-trinnet i badet, børneværelset og soveloftet efter vækning — de har eget.'
          # 26/08: skala ændret fra ujævn (kun 40-60 meningsfuld) til geometrisk/jævn.
          # Tallet uændret (0,88→0,87 ved samme punkt).
          - type: markdown
            content: 'Gælder ikke: entré, køkken, spisestue, børneværelset om aftenen og soveværelsets forlys — de har egne grænser.'
          - type: tile
            entity: input_number.global_turn_off_aggressiveness
            name: Hvor hurtigt tomme rum slukker
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Var hardkodet 11 steder i 5 filer til 2026-08-19d og kunne ikke aflæses — nu
          # centraliseret her.
          - type: markdown
            content: 'Gælder ikke: køkken-spots og badets faser.'
          - type: tile
            entity: input_number.global_fade_speed
            name: Hvor langsomt lys toner ud
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: ☀️ Sol-grænser
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.natlys_sol_under_graense
                name: Mørkt nok til natlys
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_number.sun_day_elevation_finetune
            name: Dagslys-grænse (denne måned)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: Huset husker værdien for denne måned. Gælder ikke entré og køkken.
          # 2026-10-16 (S1a): "Aftenlys kun når solen er under" (aftenlys_sol_elevation,
          # sidst 5°) er fjernet — sofa-vejene var dens sidste forbrugere; stuens
          # egen lux-gate bestemmer nu hele døgnet. Tilbage: git revert.
          - type: tile
            entity: input_number.natlys_sol_elevation
            name: Badets natlys når solen er under
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: ⏱️ Fades
            heading_style: title
            badges:
              - type: entity
                entity: sensor.fade_ind_effektiv
                name: Fade-ind nu
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_number.fade_ind_sekunder
            name: Tænd-fade om dagen
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.fade_ind_nat_faktor
            name: Langsommere tænd-fade når mørkt
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: 'Gælder ikke: køkken-lyskæde, soveværelse, børneværelse og AirBnB.'
          - type: tile
            entity: input_number.fade_passage_seconds
            name: 'Sluk-fade: entré'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.fade_ophold_seconds
            name: 'Sluk-fade: depot og bad'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.fade_living_seconds
            name: 'Sluk-fade: sove- og børneværelse'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.fade_extended_seconds
            name: 'Sluk-fade: open plan'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: ✋ Når du selv tænder og slukker
            heading_style: title
          - type: tile
            entity: input_number.room_manual_on_hold_hours
            name: Manual varer
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: Styrbar og app sætter rummet i Manual — huset overtager igen efter denne tid.
          - type: tile
            entity: input_number.sovevaerelse_manual_on_hold_hours
            name: Manual varer — soveværelset
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.manuel_lys_hold_timer
            name: 'Open plan: dit lys holdes i'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: Slipper med det samme, hvis huset bliver tomt.
          - type: tile
            entity: input_number.solo_tom_rum_sluk_minutter
            name: 'Alene i andet rum: sluk efter'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: Gælder sofalamperne og spisestue-loftet. Ikke i AirBnB.
          - type: tile
            entity: input_number.global_drift_back_empty_minutes
            name: Tilbage til Auto når tomt i
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 2026-10-01 (B173 "a)"): open plans egen tom-tid; race-vinduet følger
          # den (packages/room_modes.yaml har måledata).
          - type: tile
            entity: input_number.open_plan_drift_back_empty_minutes
            name: Stue, spisestue og køkken tilbage til Auto når tomme i
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Tidligere stod "kræver genstart" her — forkert: room_drift_back.yaml læser
          # slideren i en templated for:, der evalueres ved hver flanke.
          - type: markdown
            content: Badet og open plan har deres egne tider.
          - type: tile
            entity: input_number.global_entre_manual_grace_minutes
            name: 'Entré: hold efter manuel tænd'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.lr_grace_milliseconds
            name: 'Styrbar L/R: blokering efter slip'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: Hæv den, hvis lyset tænder uventet lige efter et farveskift på Styrbaren.
          - type: tile
            entity: input_number.entre_shutdown_grace_minutes
            name: 'Efter sluk-tryk i entréen: mørkt i'
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: 🛋️ Stue
            heading_style: title
            badges:
              - type: entity
                entity: sensor.open_plan_lux
                name: Lux nu
                state_content:
                  - name
                  - state
              - type: entity
                entity: sensor.stue_lux_gate
                name: Tænder under
                state_content:
                  - name
                  - state
              - type: entity
                entity: sensor.stue_dagslys_sluk_effektiv
                name: Slukker over
                state_content:
                  - name
                  - state
              - type: entity
                entity: binary_sensor.stue_apollo_occupancy_filtered
                name: Nogen i stuen
                state_content:
                  - name
                  - state
              - type: entity
                entity: input_boolean.open_plan_fuldt_lys
                name: Fuldt lys aktivt
                state_content:
                  - name
                  - state
          - type: tile
            entity: input_number.stue_lux_threshold
            name: Tænder under
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.stue_dagslys_sluk_lux
            name: Slukker over
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.stue_dagslys_sluk_minutter
            name: … når det har været lyst i
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.stue_sofa_off_minutter
            name: Sluk når tomt i
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.stue_still_ghost_sekunder
            name: Stille person skal ses i
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 13 s valgt: spøgelser målt op til 10,5 s, ægte tilstedeværelse mindst 15,7 s
          # (21/8).
          - type: markdown
            content: Gælder sofa-lamperne, hyggelampen, læsehygge og spisestue-loftet — ikke køkkenet.
          - type: tile
            entity: input_number.stue_spots_auto_kelvin_offset
            name: Sofa Zen køligere end lampe
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: Gælder kun Sofa Zen-scenen, ikke almindelig Auto/Manual.
          # 2026-10-07 (user-spec "control over spots stues lysstyrke på auto
          # også, ligesom farverne"): hver spot husker den styrke du selv sætter
          # på den i appen (stue_spot_N_brugerstyrke); 0 = intet husket → den
          # fælles slider herunder er fallback. Alle tre × el-pris; Dark Mode /
          # filmmørke følger læselampen (packages/stue_spots.yaml, STYRKE I AUTO).
          - type: tile
            entity: input_number.stue_spot_1_brugerstyrke
            name: Sofa-spot 1 styrke i Auto (0 = standard)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.stue_spot_2_brugerstyrke
            name: Sofa-spot 2 styrke i Auto (0 = standard)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.stue_spots_auto_brightness_pct
            name: Sofa-spots standard-styrke (0 = følg lampe)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 2026-10-11 (user-spec): på en mørk morgen = læselampen ÷ forholdet,
          # kun når spotsene ellers spejler læselampen — huskede Auto-styrker
          # vinder ("ja auto styrker skal vinde"). packages/stue_spots.yaml.
          - type: tile
            entity: input_number.stue_spots_morgen_forhold
            name: Sofa-spots om morgenen (læselampe ÷)
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: 'Gælder ikke: spots med husket Auto-styrke.'
          # B227 (2026-10-12, user-spec): ild på sofa-spotsene i Auto. B234
          # (15/10, "super lav-belastende og simpelt"): farven én gang, så ét
          # lysstyrke-skift pr. spot pr. interval (gulv 30 s). Fra = din farve.
          # Gate: binary_sensor.stue_spots_ild_aktiv (packages/stue_spots_ild.yaml).
          - type: tile
            entity: input_boolean.stue_spots_ild
            name: Ild på sofa-spots i Auto
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.stue_spots_ild_sekunder
            name: Ild sekunder pr. skift
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          # 2026-10-12 (user-spec): lysstyrke = % af spottens Auto-styrke;
          # flakken = hvor dybt lysstyrken svinger; 100 % = B227's
          # oprindelige ild, 0 = rolig glød, 200 = dybere dyk/stærkere flammer.
          - type: tile
            entity: input_number.stue_spots_ild_lysstyrke
            name: Ild-lysstyrke
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.stue_spots_ild_styrke
            name: Ild-flakken
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          # 2026-10-17 (user-spec): Spotify-sangens stemning (ReccoBeats
          # valence × energy via broens track-ID) farver ilden — spot 1 og 2 i
          # samme farvefamilie, spredningen fra hinanden. Kun via broen, kun
          # mens ilden kører. packages/stue_spots_spotify.yaml.
          - type: tile
            entity: input_boolean.stue_spots_spotify
            name: Spotify-farver på stue-spots
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.stue_spotify_stemning
            name: Sangens stemning
            tap_action:
              action: navigate
              navigation_path: /lys-dash/musikfarver
            state_content:
              - stemning
              - sang
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.stue_spots_spotify_spredning
            name: Spotify farve-spredning
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.stue_spots_spotify_overgang
            name: Spotify farve-overgang
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.stue_spots_spotify_boelge_dybde
            name: Spotify bølge-dybde
            features:
              - type: slider
            features_position: bottom
            grid_options:
              columns: 6
          # B234 (14/10): flimmer/opblus fjernet (72-120 OTBR RCP-resets/t);
          # ilden pauser når sensor.otbr_rcp_resets_1t ≥ loftet, genoptages
          # under det halve. Uden ild 0-4/t. B234: pauser også når en
          # stue-spot eller entré-loftet er unavailable.
          - type: tile
            entity: input_number.stue_spots_ild_rcp_loft
            name: Ild pauser ved Thread-resets/t
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          # Byge-bremse (17/10): ≥ N resets på 10 min → pause i M min.
          - type: tile
            entity: input_number.stue_spots_ild_rcp_byge
            name: Ild pauser ved Thread-resets på 10 min
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.stue_spots_ild_rcp_byge_minutter
            name: Pause efter Thread-byge
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.otbr_rcp_resets_1t
            name: Thread-resets seneste time
            grid_options:
              columns: 6
          - type: markdown
            content: 'Gælder ikke: Dark Mode, filmmørke, fest, dance, Zen og AirBnB.'
          # 2026-10-13 (user-spec): mørk morgen → ilden tænder ved entré-flanken
          # (målt 0,3-18 min før første ophold i open plan), læselampen slukket,
          # fader ind når nogen er inde; nær bevægelse foran stue-Apolloen tæller
          # × hurtigere. naer_cm er et gæt — logbogen "Ild-morgen" har andelene.
          # packages/stue_ild_morgen.yaml.
          - type: tile
            entity: input_boolean.stue_ild_morgen_enabled
