          - type: markdown
            content: |
              Snapshots opdateres hvert 15. minut + rounded til int — bruges
              til historisk trending (graf med længere tidsvindue). Raw live
              values ovenfor er recorder-excluded for DB-effektivitet.
          - type: tile
            entity: sensor.open_plan_lux_snapshot
