      # =====================================================================
      # SECTION 7: Sensor health (Apollo + Matter + backup)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "Sensor health"
            heading_style: title
          - type: entities
            title: "Apollo MSR-2 online"
            state_color: true
            entities:
              - binary_sensor.stue_apollo_online
              - binary_sensor.spisestue_apollo_online
              - binary_sensor.koekken_apollo_online   # ex-bad, flyttet til køkken 2026-06-15
              - binary_sensor.sovevaerelse_apollo_online
              - binary_sensor.boernevaerelse_apollo_online
          - type: entities
            title: "Matter (door + motion)"
            state_color: true
            entities:
              - entity: binary_sensor.parasoll_hoveddoer
                name: "Hoveddør"
              - entity: binary_sensor.parasoll_terrassedoer
                name: "Terrassedør"
              - entity: binary_sensor.parasoll_badevaerelse
                name: "Baddør Myggbett"
              - entity: binary_sensor.parasoll_sovedoer
                name: "Sovedør Parasoll"
              - entity: binary_sensor.entre_valhorn_occupancy
                name: "Entré Myggspray"
              - entity: binary_sensor.badevaerelse_inde_occupancy
                name: "Bad Inde (samlet)"
              - entity: binary_sensor.badevaerelse_inde_1_occupancy
                name: "Bad Inde 1 Myggspray"
              - entity: binary_sensor.badevaerelse_inde_2_occupancy
                name: "Bad Inde 2 Myggspray"
              # Depot-VALLHORN er ZHA, ikke Matter — den står her fordi den er
              # husets sidste batteridrevne bevægelsesøje. Fik endelig sin egen
              # hængt-watchdog 2026-08-18 (packages/valhorn_watchdog.yaml); se
              # "Hængte / frosne sensorer" nedenfor.
              # `binary_sensor.depot_valhorn_opening` lå her indtil samme dag:
              # den var en duplikat af occupancy (ZHA On/Off-cluster) uden en
              # eneste forbruger, og den hang `on` efter HVER HA-restart uden at
              # kunne poll'es fri → registry-disabled, ikke bare skjult.
              - entity: binary_sensor.depot_valhorn_occupancy
                name: "Depot Vallhorn (ZHA)"

          # De batteridrevne Matter/Thread-enheder er blinde 10-18 % af tiden,
          # og `unavailable` læses som `off` i al presence-logik → et udfald
          # bliver til et selvsikkert forkert svar.
          # Opdateret 15/10 (user: "thread status på status siden trænger også
          # til en opdatering"): kortet viste stadig "3 af husets 4 routere" —
          # nettet har 8-9 routere siden 09/10 (bad-spots, entré-loft, stue-
          # spots, GRILLPLATS-plugs), og vagt-stigen (TX-boost → chip-reset →
          # USB-genplug, packages/thread_otbr_watchdog.yaml), split-detektoren
          # og RCP-reset-tallet (B232/B234) manglede helt.
          # Routere-tallet er OTBR'ens egen tabel; = 1 med enheder væk er
          # split-signaturen (.claude/rules/thread_matter.md).
          - type: entities
            title: "🧵 Thread / Matter-net"
            state_color: true
            entities:
              - entity: binary_sensor.thread_border_router_nede
                name: "Border-router nede"
              - entity: sensor.otbr_routere
                name: "Routere i nettet"
              - entity: binary_sensor.thread_enheder_vaek
                name: "Enheder væk (split)"
              - type: conditional
                conditions:
                  - entity: binary_sensor.thread_enheder_vaek
                    state: "on"
                row:
                  type: attribute
                  entity: binary_sensor.thread_enheder_vaek
                  attribute: noder
                  name: "↳ Hvilke"
              - entity: binary_sensor.thread_net_i_live
                name: "Thread-enheder svarer"
              - entity: sensor.otbr_rcp_resets_1t
                name: "Radio-resets sidste time"
              - entity: binary_sensor.otbr_selfheal_daemon_ok
                name: "Self-heal-daemon i live"
              - entity: input_boolean.thread_watchdog_enabled
                name: "Vagt aktiv"
              - type: conditional
                conditions:
                  - entity: binary_sensor.thread_border_router_nede
                    state: "on"
                row:
                  entity: input_number.thread_watchdog_forsoeg
                  name: "↳ Kur-forsøg i denne nedetid"
              - entity: input_datetime.thread_watchdog_last_restart
                name: "Seneste kur"

          # Live-tegning af partitionen som border-routeren ser den (15/10,
          # user: "tegne live nettet ... så jeg kan se ø'er og forbindelser").
          # www/thread-net-card.js ← sensor.thread_topologi (daemonen hvert
          # 2. min, `ot-ctl meshdiag topology`). Stregfarve = det dårligste af
          # link-kvalitet 3/2/1 og målt tab (`meshdiag routerneighbortable`;
          # 15/10 stod stue 2 → entré grønt med 26 % tabte beskeder), stiplet = kun hørt fra én side, ★ = leder, grå prik = barn.
          # Rød række = Matter-enheder UDEN for partitionen (en ø eller
          # strømløs) — ind i en ø kan OTBR'en ikke se. Efter ændring af
          # kortet: python3 scripts/lovelace_resources.py.
          - type: custom:thread-net-card
            entity: sensor.thread_topologi

          # Samme tegning for Zigbee (15/10, user: "det samme kort vi har for
          # thread på zigbee netværket? med signalstyrke"). www/zigbee-net-card.js
          # henter selv `zha/devices` over websocket hvert 5. min (ingen sensor —
          # nabo-tabellerne ville fylde recorderen). Stregfarve = LQI, svageste
          # retning; tal ved noder/børn = RSSI i dBm for seneste pakke. Kun hver
          # routers 3 stærkeste links som standard (nettet er tæt). Nabo-
          # tabellerne er fra ZHA's topologi-skan (hver 4. t) — "Skan nu" i
          # kortets bund. Efter ændring: python3 scripts/lovelace_resources.py.
          - type: custom:zigbee-net-card

          # Routerne efter rolle. Stue-spotsene er BROEN mellem OTBR'en og
          # badet (trækkes de ud, falder badet af — 08/10). GRILLPLATS-plugs:
          # Thread router køkken (altid tændt, før sove-lyskæden — flyttet 15/10)
          # og plug 2 (Stue Plug = hyggelampen, i stuen siden 15/10 — før Thread
          # router depot). Entré-loftet sidder på en vægkontakt.
          # 15/10 (user: "siger spot 2 er nede. not true... den skal være
          # live"): rækkerne viste lampernes tænd/sluk og HA's Matter-syn, og
          # stue-spotsene er ude af recorderen (B227) — en nedetid kunne ikke
          # ses bagefter. Nu net-status fra daemonen hvert 2. min
          # (sensor.thread_routere_vaek, scripts/otbr_rcp_stats.py): Matter-
          # serveren først, OTBR'ens mesh-tabel som vidne. "i nettet, Matter
          # svarer ikke" = zombie (thread_zombie_kick.py kurerer efter 6 min).
          # Sovende batteri-enheder der er "væk" er koblet helt af (ikke barn
          # under nogen router) og kan ikke pinges op — de skal vækkes fysisk.
          - type: markdown
            title: "🧵 Thread-enheder"
            content: >-
              {% set s = states.sensor.thread_routere_vaek %}
              {% set ikon = {'forbundet': '✅', 'væk': '❌', 'ikke i brug': '⚪'} %}
              {% if s is none or not s.attributes.routere %}Venter på første måling.{% else %}
              {% set r = s.attributes.routere %}
              {% set b = s.attributes.sovende | default([]) %}
              {% set b_vaek = b | selectattr('status', 'eq', 'væk') | list %}
              **Routere** {{ r | selectattr('status', 'eq', 'forbundet') | list | count }} af {{ r | count }}

              {% for x in r %}{{ ikon.get(x.status, '⚠️') }} {{ x.navn | replace('Badevaerelse', 'Bad') | replace('doer', 'dør') }}{% if x.status != 'forbundet' %} — {{ x.status }}{% endif %}

              {% endfor %}
              **Batteri-enheder** {{ b | count - b_vaek | count }} af {{ b | count }}{% if b_vaek %} — vækkes med et tryk på knappen / åbn døren{% endif %}

              {% for x in b_vaek %}❌ {{ x.navn | replace('Badevaerelse', 'Bad') | replace('doer', 'dør') }}

              {% endfor %}
              <sub>Målt for {{ ((now() - s.last_reported).total_seconds() / 60) | round(0) | int }} min siden</sub>{% endif %}

          - type: entities
            state_color: true
            entities:
              - entity: binary_sensor.badevaerelse_bad_strom_ok
                name: "Bad-strøm (ellers er spots mørke)"
              - type: conditional
                conditions:
                  - entity: input_boolean.bad_zigbee_nodlys_aktiv
                    state: "on"
                row:
                  entity: input_boolean.bad_zigbee_nodlys_aktiv
                  name: "Bad-nødlys (Zigbee) aktivt"

          - type: history-graph
            title: "Thread — 24 t"
            hours_to_show: 24
            entities:
              - entity: sensor.otbr_routere
                name: "Routere"
              - entity: sensor.otbr_rcp_resets_1t
                name: "Radio-resets/t"
              - entity: binary_sensor.thread_enheder_vaek
                name: "Enheder væk"
              - entity: sensor.thread_routere_vaek
                name: "Routere væk"

          - type: entities
            title: "🕵️ Hængte / frosne sensorer"
            state_color: true
            entities:
              - entity: binary_sensor.sove_radar_frossen
                name: "Sove-radar mistænkt hang (target låst)"
              - entity: binary_sensor.apollo_occupancy_laast
                name: "Apollo occupancy låst (veto'er Dvale)"
              - entity: binary_sensor.entre_vallhorn_haengt
                name: "Entré VALLHORN hængt"
              - entity: binary_sensor.depot_vallhorn_haengt
                name: "Depot VALLHORN hængt (kan ikke poll'es fri)"

          # `presence_sensors_available` er KUN en pre-flyt-gate (ON hvis bare
          # ÉN sensor er online) — den siger intet om hvor meget vi kan stole
          # på svaret. Det gør de to nedenfor, og de manglede helt.
          - type: entities
            title: "📶 Presence-tillid"
            state_color: true
            entities:
              - entity: binary_sensor.activity_state_confident
                name: "Activity-state troværdig"
              - entity: sensor.presence_signal_confidence
                name: "Signal-konfidens (%)"
              - entity: binary_sensor.physical_presence_recent
                name: "Fysisk hus-vidne sidste 3t"
              - entity: binary_sensor.presence_sensors_available
                name: "↳ Rå sensor-gate (ON hvis bare ÉN er online)"

          # Chip-wear canary: stiger en ESP over ~50 °C steady-state, er der
          # noget der hammer på chippen (2 af 5 Apolloer har mistet en sensor-
          # chip). Manglede på siden trods at CLAUDE.md udpeger den som canary.
          - type: entities
            title: "🔥 Apollo ESP-temp (chip-wear canary)"
            entities:
              - entity: sensor.stue_apollo_esp_temperature
                name: "Stue"
              - entity: sensor.spisestue_apollo_esp_temperature
                name: "Spisestue"
              - entity: sensor.koekken_apollo_esp_temperature
                name: "Køkken"
              - entity: sensor.sovevaerelse_apollo_esp_temperature
                name: "Soveværelse"
              - entity: sensor.boernevaerelse_apollo_esp_temperature
                name: "Børneværelse"

          - type: entities
            title: "Backup status"
            entities:
              - sensor.backup_backup_manager_state
              - sensor.backup_last_successful_automatic_backup
              - sensor.backup_next_scheduled_automatic_backup

      # =====================================================================
      # SECTION 8: Automation last-triggered (NEW) — catch stale automations
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "Automation activity"
            heading_style: title
          - type: entities
            title: "Critical automations (last triggered)"
            entities:
              - entity: automation.lysnet_sovevaerelse_taend
                secondary_info: last-triggered
              - entity: automation.lysnet_stue_taend
                secondary_info: last-triggered
              - entity: automation.lysnet_kokken_taend
                secondary_info: last-triggered
              - entity: automation.lysnet_bornevaerelse_taend
                secondary_info: last-triggered
              - entity: automation.lysnet_badevaerelse_taend
                secondary_info: last-triggered
              - entity: automation.entre_lys_taend_ved_bevaegelse
                secondary_info: last-triggered
              - entity: automation.godnat_voksen_godnat_start_somrig_klik_op
                secondary_info: last-triggered
              - entity: automation.godmorgen_fast_instant_wake_somrig_long_op
                secondary_info: last-triggered
              - entity: automation.godnat_auto_declare_efter_2t_kun_sovevaerelse_presence
                secondary_info: last-triggered

      # =====================================================================
      # SECTION 9: Recent activity (logbook)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "Recent activity (24h)"
            heading_style: title
          - type: logbook
            entities:
              - input_boolean.godnat_active
              - input_boolean.godnat_voksne_active
              - input_boolean.godnat_boern_active
              - binary_sensor.godnat_any_active
              - input_select.active_scene
              - input_select.house_state
              - light.spisestue_pendel
              - light.spisestue_loft
              - light.koekken_lyskaede
              - light.boernevaerelse_loft
              - light.entre_loft
              - light.badevaerelse_all
              - binary_sensor.parasoll_hoveddoer
              - binary_sensor.parasoll_sovedoer
              - input_boolean.parent_a_home
              - input_boolean.parent_b_home
            hours_to_show: 24
            title: "Lights + flags + door + presence"

      # =====================================================================
      # SECTION 10: System Diagnostics ⭐ NEW audit-5 2026-05-12
      # =====================================================================
      # Quick-glance system health. Hvis noget her ser galt ud → tjek logs.
      - type: grid
        cards:
          - type: heading
            heading: "🔧 System Diagnostics"
            heading_style: title
          - type: markdown
            content: |
              **Watch list:**
              - **Parent B GPS permission** skal være "Always" (ellers
                stale-data; user-action på iPhone)
              - **Parent A next alarm** skal vise timestamp efter alarm sat
                (kræver Companion sensor enabled)
              - **HA uptime** — hvis < 1 dag = nylig restart, verificér
                automations virker
              - **Backup last successful** — hvis > 25 timer = backup-system
                problem
          - type: entities
            title: "Companion app status"
            entities:
              - entity: sensor.phone_b_location_permission
                name: "Parent B GPS perm"
              - entity: sensor.phone_a_battery_level
                name: "Parent A batteri"
              - entity: sensor.phone_a_next_alarm
                name: "Parent A next alarm"
              # 2026-07-28 (item 4): iOS har ingen native next-alarm-sensor —
              # Parent B's kommer fra en Genvej på hendes iPhone (opskrift:
              # docs/parent_b_iphone_alarm.md). Åbn sensoren for attributterne:
              # kilde (genvej/manuel/ingen), genvej_ok og minutter_siden_genvej.
              # genvej_ok = false betyder at der ikke er skrevet i 36 t = den
              # personlige automatisering på iPhonen er død eller slået fra.
              - entity: sensor.parent_b_next_alarm
                name: "Parent B next alarm (genvej)"
              # Rå payload fra genvejen: "<ISO-stempel>|HH:MM,HH:MM…". Tom =
              # genvejen har aldrig kørt (så bruges den manuelle helper).
              - entity: input_text.parent_b_alarm_genvej
                name: "↳ rå payload fra iPhone"
              - entity: input_datetime.parent_b_next_alarm
                name: "↳ manuel alarm (fallback)"
              # 2026-08-06: vis den LÆSBARE lokale tid. Rækken viste før
              # sensorens rå ISO-state, og da Androids alarm-sensor melder UTC
              # stod en 06:15-alarm som "…T04:15:00+00:00" = to timer for
              # tidligt for øjet. Ankeret er nu normaliseret til lokal tid, men
              # attributten er stadig den rigtige række her: den er formateret
              # til mennesker og siger "—" når ingen alarm er i spil.
              - type: attribute
                entity: sensor.wakeup_alarm_next
                attribute: lokal
                name: "Vækning kører på"
              - entity: sensor.phone_b_battery_level
                name: "Parent B batteri"
              - entity: sensor.phone_b_app_version
                name: "Parent B app version"
          - type: entities
            title: "System metrics"
            entities:
              - entity: sensor.backup_backup_manager_state
                name: "Backup state"
              - entity: sensor.backup_last_successful_automatic_backup
                name: "Last backup"
              - entity: sensor.backup_next_scheduled_automatic_backup
                name: "Next backup"
              - entity: sun.sun
                name: "Sun"
              - entity: weather.forecast_home
                name: "Weather"
