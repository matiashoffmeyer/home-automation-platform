# =============================================================================
# Status Dashboard — live status quo fra alle enheder + rum (temp/lux/presence)
# =============================================================================
# Split ud af tidligere "Diagnostik" 2026-06-16: read-only observability.
# Sliders + toggles ligger nu på "Indstillinger"-dashboardet
# (dashboards/settings.yaml).
# =============================================================================
title: Status
icon: mdi:home-analytics
views:
  - title: Status
    path: status
    type: sections
    max_columns: 3
    sections:
      # =====================================================================
      # SECTION 0b: Hjem-status combo (sprint 2026-05-17 #19)
      # =====================================================================
      # Quick-overblik over hvem der er hjemme + GPS staleness + people estimate.
      - type: grid
        cards:
          - type: heading
            heading: "🏠 Hjem-status"
            heading_style: title
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.parent_a_home
            name: Parent A hjemme
            color: blue
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.parent_b_home
            name: Parent B hjemme
            color: blue
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.parent_a_gps_fresh
            state_content: state
            name: Parent A GPS fresh
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.parent_b_gps_fresh
            state_content: state
            name: Parent B GPS fresh
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.kids_home
            state_content: state
            name: Børn hjemme NU (sensor)
            color: amber
            grid_options:
              columns: 6
          # 4. auto-signal (2026-07-30): sammenhængende børneværelses-ophold.
          # De tre øvrige signaler kræver at børnene har været her i timevis.
          - type: tile
            entity: input_boolean.boern_aktivitet_detekteret
            state_content: state
            name: ↳ Ankomst detekteret
            color: amber
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.kids_home_manual
            name: Tving 'børn hjemme' ON
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.kids_home_manual_off
            name: Tving 'børn IKKE hjemme'
            color: red
            grid_options:
              columns: 6
          # People v4 (2026-09-30): antallet varierer fra besøg til besøg (facit
          # 28-30/9 = ét barn, 13/9 + 17/9 = to). Står ved børne-knapperne fordi
          # det er dér user sætter børne-perioden; samme slider ligger også
          # under Indstillinger → Folke-estimat.
          - type: tile
            entity: input_number.people_boern_antal
            name: Antal børn når de er her
            icon: mdi:human-child
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.people_estimate
            name: People estimate
            color: indigo
            grid_options:
              columns: 6
          # 2026-10-12 (user-spec): +/- retter tallet manuelt; det gælder til
          # næste gen-måling (hoveddør/afgang/Dormant/mode-skift) og hvert tryk
          # logges med fuld kontekst i ai_feedback/people_estimate_feedback.jsonl
          # (type manuel / manuel_slut) til kalibrering. script.people_manuel_juster.
          - type: button
            name: Én færre
            icon: mdi:minus
            tap_action:
              action: perform-action
              perform_action: script.people_manuel_juster
              data:
                delta: -1
            grid_options:
              columns: 3
              rows: 1
          - type: button
            name: Én mere
            icon: mdi:plus
            tap_action:
              action: perform-action
              perform_action: script.people_manuel_juster
              data:
                delta: 1
            grid_options:
              columns: 3
              rows: 1
          - type: button
            name: Tilbage til modellen
            icon: mdi:backup-restore
            tap_action:
              action: perform-action
              perform_action: script.people_manuel_juster
              data:
                delta: 0
            visibility:
              - condition: numeric_state
                entity: input_number.people_manuel
                above: -0.5
            grid_options:
              columns: 6
              rows: 1

      # =====================================================================
      # SECTION 1: Hus state + activity (KOMPAKT TILE GRID)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "Hus state + activity"
            heading_style: title
          - type: tile
            entity: input_select.house_state
            color: blue
            name: House
          - type: tile
            entity: input_select.house_mode
            name: Mode
          - type: tile
            entity: sensor.activity_state
            name: Activity
          - type: tile
            entity: sensor.people_estimate
            name: People
          - type: tile
            entity: sensor.sun_bracket
            name: Sun
          - type: tile
            entity: sensor.auto_color_temp_evening
            name: Auto CT
          - type: tile
            entity: sensor.open_plan_lux
            name: Open-plan LUX
          - type: tile
            entity: binary_sensor.workday_sensor
            state_content: state
            name: Arbejdsdag
          # Hed før "Master gate", hvilket læses som "presence kan man stole
          # på". Det kan man ikke: den er ON hvis bare ÉN sensor er online.
          # Tilliden står under Sensor health → 📶 Presence-tillid.
          - type: tile
            entity: binary_sensor.presence_sensors_available
            state_content: state
            color: green
            name: "Sensor-gate (≥1 online)"
          - type: tile
            entity: binary_sensor.activity_state_confident
            state_content: state
            color: green
            name: "Activity troværdig"


      # =====================================================================
      # SECTION: Mode-status (read-only) — toggles ligger på Indstillinger
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "Mode-status"
            heading_style: title
          - type: tile
            entity: binary_sensor.godnat_any_active
            state_content: state
            name: "ANY godnat aktiv (master union)"
          - type: tile
            entity: binary_sensor.kids_home
            state_content: state
            name: "Børn hjemme NU (auto-detekteret)"
          - type: tile
            entity: sensor.dance_active_bulbs
            name: "Dance: aktive bulbs total"
            icon: mdi:counter
      # =====================================================================
      # SECTION 3: Per-room status (TILE GRIDS — fix overflow)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "Per-room status"
            heading_style: title

          # === Sove ===
          - type: heading
            heading: "Sove"
            heading_style: subtitle
          - type: tile
            entity: light.spisestue_pendel
            name: "Sove lys"
          - type: tile
            entity: input_select.room_mode_sovevaerelse
            name: "Mode"
          - type: tile
            entity: sensor.sove_sidste_tryk
            name: "Sidste tryk"
          - type: tile
            entity: sensor.sovevaerelse_apollo_lux
            name: "Sove LUX"
          - type: tile
            entity: binary_sensor.sovevaerelse_apollo_radar_still_target
            state_content: state
            color: blue
            name: "Still target"
          - type: tile
            entity: binary_sensor.sovevaerelse_apollo_occupancy
            state_content: state
            color: blue
            name: "Occupancy"
          # 2026-09-01b: sovedøren (Matter node 462, paret 30/8) manglede på
          # status-siden. Den er ikke pynt: dør-vejen i morgen-opstigningen
          # måler på den, og 1/9 stod den ÅBEN uafbrudt i 32 timer uden at
          # nogen kunne se det — netop derfor skal dens tilstand være synlig.
          - type: tile
            entity: binary_sensor.parasoll_sovedoer
            state_content: state
            color: blue
            name: "Sovedør"

          # === Stue + køkken (open plan) ===
          - type: heading
            heading: "Stue + køkken (open plan)"
            heading_style: subtitle
          - type: tile
            entity: light.spisestue_loft
            name: "Stue lys"
          - type: tile
            entity: light.koekken_lyskaede
            name: "Køkken lyskæde"
          - type: tile
            entity: switch.koekken_spots
            name: "Køkken spots"
          # AxiomAir N3 (sofastuen) — unavailable når den er slukket med
          # knappen (override'en); se packages/hoejttaler.yaml.
          - type: tile
            entity: media_player.hoejttaler
            name: "Højttaler"
            visibility:
              - condition: state
                entity: media_player.hoejttaler
                state_not: unavailable
          # B237: Spotify-broen (add-on local_spotify_bro, "Højttaler" i appen).
          # nede = add-on'en svarer ikke (packages/spotify_bro.yaml).
          - type: tile
            entity: sensor.spotify_bro
            name: "Spotify-bro"
          - type: tile
            entity: input_select.room_mode_stue
            name: "Stue mode"
          - type: tile
            entity: input_select.room_mode_spisestue
            name: "Spisestue mode"
          - type: tile
            entity: input_select.room_mode_koekken
            name: "Køkken mode"
          - type: tile
            entity: binary_sensor.open_plan_manual
            name: "Open plan Manual"
          - type: tile
            entity: sensor.stue_sidste_tryk
            name: "Stue tryk"
          - type: tile
            entity: binary_sensor.stue_apollo_occupancy
            state_content: state
            color: blue
            name: "Stue occ"
          - type: tile
            entity: binary_sensor.spisestue_apollo_occupancy
            state_content: state
            color: blue
            name: "Spisestue occ"
          - type: tile
            entity: binary_sensor.koekken_apollo_occupancy
            state_content: state
            color: blue
            name: "Køkken occ"
          - type: tile
            entity: sensor.koekken_apollo_lux
            name: "Køkken lux"
          - type: tile
            entity: binary_sensor.open_plan_empty_for_20m
            state_content: state
            name: "Empty 20m"

          # === Boern ===
          - type: heading
            heading: "Boern"
            heading_style: subtitle
          - type: tile
            entity: light.boernevaerelse_loft
            name: "Boern lys"
          - type: tile
            entity: input_select.room_mode_boernevaerelse
            name: "Mode"
          - type: tile
            entity: sensor.boern_sidste_tryk
            name: "Sidste tryk"
          - type: tile
            entity: sensor.boernevaerelse_apollo_lux
            name: "Boern LUX (rå — kun device-health)"
          - type: tile
            entity: binary_sensor.boernevaerelse_apollo_occupancy
            state_content: state
            color: blue
            name: "Occupancy"
          - type: tile
            entity: sensor.boern_bedtime_hour
            name: "Bedtime cutoff"

          # === Bad ===
          - type: heading
            heading: "Bad"
            heading_style: subtitle
          - type: tile
            entity: light.badevaerelse_all
            name: "Bad lys (5 spots)"
          - type: tile
            entity: input_select.room_mode_badevaerelse
            name: "Mode"
          - type: tile
            entity: sensor.bad_sidste_tryk
            name: "Sidste tryk"
          - type: tile
            entity: binary_sensor.badevaerelse_inde_occupancy
            state_content: state
            color: blue
            name: "Occupancy (Inde samlet)"
          - type: tile
            entity: binary_sensor.parasoll_badevaerelse
            state_content: state
            color: blue
            name: "Baddør"
          - type: tile
            entity: input_boolean.badevaerelse_wasp_active
            color: amber
            name: "Wasp-lås (sluk blokeret)"

          # === Entré ===
          - type: heading
            heading: "Entré"
            heading_style: subtitle
          - type: tile
            entity: light.entre_loft
            name: "Entré lys"
          - type: tile
            entity: binary_sensor.entre_valhorn_occupancy
            state_content: state
            color: blue
            name: "Vallhorn"
          - type: tile
            entity: binary_sensor.parasoll_hoveddoer
            state_content: state
            color: blue
            name: "Hoveddør"

          # === Terrasse ===
          - type: heading
            heading: "Terrasse"
            heading_style: subtitle
          - type: tile
            entity: binary_sensor.parasoll_terrassedoer
            state_content: state
            color: blue
            name: "Terrassedør"
          # NB: light.koekken_lyskaede hører IKKE til her — den blev omdøbt
          # 2026-06-15 fra terrasse_lyskaede og sidder nu på fast Zigbee-strøm
          # som køkken-accent (væk fra terrasse-plug + Styrbar). Den står under
          # "Stue + køkken (open plan)".
          - type: tile
            entity: light.terrasse_paerelyskaede
            name: "Pærelyskæde"
          - type: tile
            entity: sensor.terrasse_sidste_tryk
            name: "Sidste tryk"
          - type: tile
            entity: binary_sensor.terrasse_active
            state_content: state
            color: amber
            name: "Terrasse active"
          - type: tile
            entity: binary_sensor.likely_on_terrasse
            state_content: state
            color: amber
            name: "Sherlock terrasse"

          # === Depot ===
          - type: heading
            heading: "Depot"
            heading_style: subtitle
          - type: tile
            entity: light.depot_loft
            name: "Depot loft"
          - type: tile
            entity: light.depot_strip
            name: "Depot strip"
          - type: tile
            entity: input_select.room_mode_depot
            name: "Mode"
          - type: tile
            entity: sensor.depot_sidste_tryk
            name: "Sidste tryk"
          - type: tile
            entity: binary_sensor.depot_valhorn_occupancy
            state_content: state
            color: blue
            name: "Occupancy"

      # =====================================================================
      # SECTION 3.5: Morgen-gardiner — fremgang mod auto-åbning (item 2)
      # =====================================================================
      # Viser hvor tæt open-plan-bevægelsen er på at trigge auto-åbning af
      # stue/spisestue-gardinerne om morgenen (06-12). Akkumuleringen bygger
      # KUN fra de open-plan-Apolloer der er online → zone-status vises, så et
      # stall pga. offline-sensor er synligt (føles ellers som "ingenting sker").
      - type: grid
        cards:
          - type: heading
            heading: "🪟 Morgen-gardiner (auto-åbning)"
            heading_style: title
            grid_options:
              columns: 12
          - type: gauge
            entity: sensor.morgen_gardin_fremgang
            name: "Fremgang mod auto-åbning"
            needle: true
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 50
              green: 90
            grid_options:
              columns: 4
          - type: markdown
            grid_options:
              columns: 8
            content: >
              **{{ state_attr('sensor.morgen_gardin_fremgang','akkumuleret_min') }} /
              {{ state_attr('sensor.morgen_gardin_fremgang','taerskel_min') }} min**
              akkumuleret open-plan-bevægelse (sidste 30 min). Gardinerne
              (stue syd/vest + spisestue vest) ruller selv op kl. 06–12 når
              den når 100 %.


              {% set live = state_attr('sensor.morgen_gardin_fremgang','zoner_live') | int(3) %}
              {% set vindue = today_at('06:00') <= now() < today_at('12:00') %}
              **Aktive open-plan-sensorer:** {{ live }}/3 ·
              **Åbningsvindue (06–12):** {{ 'JA' if vindue else 'nej' }} ·
              **Bevægelse nu:** {{ 'ja' if is_state('binary_sensor.open_plan_occupied','on') else 'nej' }}

              {% if live < 3 %}

              ⚠️ **{{ 3 - live }} open-plan-Apollo(er) offline** → bevægelse i de
              zoner tæller ikke med, så akkumuleringen bygger langsommere (eller
              slet ikke, hvis du mest opholder dig i den zone). Se "Apollo MSR-2
              online" nederst — en offline Apollo skal som regel have en fysisk
              power-cycle for at komme på igen.
              {% endif %}
          - type: tile
            entity: binary_sensor.stue_apollo_online
            state_content: state
            color: green
            name: "Stue Apollo online"
            grid_options:
              columns: 4
          - type: tile
            entity: binary_sensor.spisestue_apollo_online
            state_content: state
            color: green
            name: "Spisestue Apollo online"
            grid_options:
              columns: 4
          - type: tile
            entity: binary_sensor.koekken_apollo_online
            state_content: state
            color: green
            name: "Køkken Apollo online"
            grid_options:
              columns: 4

      # =====================================================================
      # SECTION 4: Light overview (NEW) — alle stuelys i ét grid
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "Alle lights"
            heading_style: title
          # 👻 Et lys der taber radioen MENS det lyser bliver stående fysisk
          # tændt og er usynligt for hver sluk-vej. Disse to er facit på
          # "hvor meget lys brænder der" — de rå tiles nedenfor er det ikke.
          - type: tile
            entity: sensor.lys_spoegelser
            name: "👻 Spøgelses-lys (tændt, uden radio)"
            color: red
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.lys_estimat_effekt
            name: "⚡ Estimeret lys-effekt (inkl. spøgelser)"
            grid_options:
              columns: 6
          - type: tile
            entity: light.spisestue_pendel
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.spisestue_loft
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.stue_laesehygge
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.boernevaerelse_loft
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.badevaerelse_all
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.entre_loft
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.koekken_lyskaede
          - type: tile
            entity: light.terrasse_paerelyskaede

      # =====================================================================
      # SECTION 5: Battery overview (NEW) — alle device batteries
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "Batteries"
            heading_style: title
          # NB: IKEA Styrbar = sleepy end-device. Batteri-attributten pushes kun
          # periodisk (langt interval) + cache tabes ved HA-restart → sove/stue/
          # terrasse kan stå "unknown" indtil enheden næste gang rapporterer.
          # Det er IKKE en defekt sensor; alle 7 eksponerer power-config clusteret.
          - type: entities
            title: "Styrbars (7)"
            entities:
              - entity: sensor.sovevaerelse_styrbar_battery
                name: "Sove Styrbar"
              - entity: sensor.stue_styrbar_battery
                name: "Stue Styrbar"
              - entity: sensor.boernevaerelse_styrbar_battery
                name: "Boern Styrbar"
              - entity: sensor.badevaerelse_styrbar_battery
                name: "Bad Styrbar"
              - entity: sensor.terrasse_styrbar_battery
                name: "Terrasse Styrbar"
              - entity: sensor.depot_styrbar_battery
                name: "Depot Styrbar"
              - entity: sensor.entre_styrbar_battery
                name: "Entré Styrbar (orphan — ej mapped)"
          - type: entities
            title: "Other Zigbee batteries"
            entities:
              - entity: sensor.entre_somrig_battery
                name: "Sove Somrig"
              - entity: sensor.depot_valhorn_battery
                name: "Entré Vallhorn"
              - entity: sensor.badevaerelse_badring_battery
                name: "Bad Badring water-leak"
              - entity: sensor.gardin_sovevaerelse_battery
                name: "Sove-gardin motor (2× AA)"
          - type: entities
            title: "RODRETs (5)"
            entities:
              - entity: sensor.sove_knap_battery
                name: "Sove Knap (gl. kalde)"
              - entity: sensor.ikea_of_sweden_rodret_wireless_dimmer_battery_2
                name: "RODRET 2"
              - entity: sensor.ikea_of_sweden_rodret_wireless_dimmer_battery_3
                name: "RODRET 3"
              - entity: sensor.ikea_of_sweden_rodret_wireless_dimmer_battery_4
                name: "RODRET 4"
              - entity: sensor.ikea_of_sweden_rodret_wireless_dimmer_battery_5
                name: "RODRET 5"
          - type: entities
            title: "Matter batteries"
            entities:
              - entity: sensor.parasoll_hoveddoer_battery
                name: "Hoveddør Myggbett"
              - entity: sensor.parasoll_terrassedoer_battery
                name: "Terrassedør Myggbett"
              - entity: sensor.parasoll_badevaerelse_battery
                name: "Baddør Myggbett"
              - entity: sensor.parasoll_sovedoer_battery
                name: "Sovedør Myggbett"
              - entity: sensor.entre_valhorn_battery
                name: "Entré Myggspray"
              - entity: sensor.badevaerelse_inde_battery
                name: "Bad Inde 1 Myggspray"
              - entity: sensor.badevaerelse_inde_2_battery
                name: "Bad Inde 2 Myggspray"
              - entity: sensor.timmerflotte_battery
                name: "Køkken TIMMERFLOTTE"
              - entity: sensor.badevaerelse_timmerflotte_battery
                name: "Bad TIMMERFLOTTE"
          - type: entities
            title: "Andre batterier"
            entities:
              - entity: sensor.s8_maxv_ultra_battery
                name: "Roborock S8"

      # =====================================================================
      # SECTION 5.5: Vejr-varsel i dag (NEW 2026-06-07)
      # =====================================================================
      # sensor.vejr_varsel_i_dag (packages/weather_warning.yaml) evaluerer
      # samme tærskler som morgenvarslet i rain_warning.yaml. Samme data
      # sendes som 06:30 push til Parent A's tlf.
      - type: grid
        cards:
          - type: heading
            heading: "🌦️ Vejr-varsel i dag"
            heading_style: title
          - type: tile
            entity: sensor.vejr_varsel_i_dag
            name: "Dagens varsel"
            color: amber
          - type: markdown
            content: >
              ### Hvorfor


              {{ state_attr('sensor.vejr_varsel_i_dag', 'forklaring') }}


              ---

              **Tærskler:** Regn ≥2 mm (met.no ELLER DMI) eller vådt symbol+≥25% ·
              Sne ('snow' i condition) · Vind gust ≥50 / middel ≥36 km/h ·
              UV effektiv ≥4


              **I dag:** {{ states('weather.forecast_home') }} ·
              met.no {{ state_attr('sensor.vejr_varsel_i_dag','precip_mm') }} mm ·
              DMI {{ state_attr('sensor.vejr_varsel_i_dag','dmi_mm_today') }} mm ·
              kilde: {{ state_attr('sensor.vejr_varsel_i_dag','rain_source') }} ·
              vind gust {{ state_attr('sensor.vejr_varsel_i_dag','wind_gust_kmh') }} km/h ·
              UV {{ state_attr('sensor.vejr_varsel_i_dag','uv_effective') }}
          - type: tile
            entity: weather.forecast_home
            name: "Vejr (met.no)"
          - type: tile
            entity: sensor.dmi_regn_forecast
            name: "DMI regn (næste 18t)"
            color: blue
          - type: entities
            title: "Kilde-sammenligning (regn)"
            entities:
              - type: attribute
                entity: sensor.vejr_varsel_i_dag
                attribute: precip_mm
                name: "met.no mm i dag"
              - type: attribute
                entity: sensor.dmi_regn_forecast
                attribute: mm_today
                name: "DMI mm i dag"
              - type: attribute
                entity: sensor.dmi_regn_forecast
                attribute: mm_tonight
                name: "DMI mm i nat (16-09)"
              - type: attribute
                entity: sensor.dmi_regn_forecast
                attribute: max_hourly_mm
                name: "DMI max time-mm (18t)"
              - type: attribute
                entity: sensor.dmi_regn_forecast
                attribute: fetched_at
                name: "DMI sidst hentet"
              - type: attribute
                entity: sensor.dmi_regn_forecast
                attribute: last_attempt_ok
                name: "Seneste DMI-kald OK"

      # =====================================================================
      # SECTION 5b: Dug-varsel i nat (speedometer + sendes-i-aften)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "🛋️ Bliver hynderne våde i nat?"
            heading_style: title
            grid_options:
              columns: 12
          - type: gauge
            entity: sensor.dug_score_i_nat
            name: "Våd-score i nat"
            needle: true
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 55
              red: 75
            grid_options:
              columns: 4
          - type: markdown
            grid_options:
              columns: 8
            content: >
              {% set s = 'sensor.dug_score_i_nat' %}
              {% set k = state_attr(s,'kilde') %}

              **Dug-score {{ states(s) }} / tærskel
              {{ state_attr(s,'threshold') }}**
              (følsomhed {{ state_attr(s,'sensitivity') }}).
              Gælder natten til **{{ state_attr(s,'gaelder_nat') }}**.

              {% if k == 'laast' %}🔒 **Låst** — nattens dom blev frosset ca.
              kl 21:00 og ændrer sig ikke før kl 09:00.
              {% elif k == 'glat' %}📉 **Dæmpet** — tallet glider kun 25 % mod
              den friske prognose pr. opdatering, så det ikke hopper i løbet af
              dagen (rå prognose lige nu: {{ state_attr(s,'raa_score') }}).
              {% elif k == 'stale' %}⚠️ **Forældet** — met.no svarede ikke;
              viser sidste gode vurdering.
              {% else %}🆕 **Frisk** — første beregning for den nye nat
              (nulstillet kl 09:00).
              {% endif %}


              **Sendes i aften?**
              {{ state_attr('binary_sensor.dug_varsel_sender_i_aften','forklaring') }}


              ---

              {{ state_attr('sensor.dug_varsel_i_nat','forklaring') }}
          - type: markdown
            grid_options:
              columns: 12
            content: >
              {% set s = 'sensor.dug_score_i_nat' %}
              {% set score = states(s) | int(0) %}
              {% set t = state_attr(s,'peak_time') %}
              {% set cool = state_attr(s,'afkoeling_c') | float(0) %}
              {% set spread = state_attr(s,'peak_spread_c') | float(0) %}
              {% set defi = state_attr(s,'underskud_c') | float(0) %}
              {% set soak = state_attr(s,'soak_timer') | float(0) %}
              {% set ekstra = state_attr(s,'overflade_ekstra_c') | float(0) %}

              ### 🧮 Sådan beregnes våd-scoren

              Varslet beskytter **terrassens hynder og madrasser** — ikke ruder eller
              græs. Et betræk bliver vådt ad to veje, og scoren er den **værste af
              dem**: regn i nattevinduet, eller dug der samler sig time efter time.

              Dug lægger sig når overfladen bliver koldere end luftens dugpunkt.
              Alt udendørs stråler varme mod himlen om natten og bliver **koldere end
              luften** — skyer og vind bremser netop den afkøling. En hynde køler
              **{{ ekstra }}° ekstra** i forhold til græs, fordi der er luft under den,
              den har lav varmekapacitet og betrækket stråler næsten som et sort
              legeme. Energiregnskabet pr. time:

              **Værste time:** {{ t if t else '—' }}

              | Trin | Måling kl {{ t if t else '—' }} | Resultat |
              |---|---|---|
              | ☁️🍃 **Udstrålings-afkøling** | {{ state_attr(s,'peak_cloud_pct') }}% skyer, {{ state_attr(s,'peak_wind_kmh') }} km/h vind | hynden bliver **{{ cool }}°** koldere end luften (max {{ 8.0 + ekstra }}° ved helt klart + vindstille; skyer skærer 80 % væk, vind halverer ved ~9 km/h) |
              | 💧 **Spænd** (luft − dugpunkt) | {{ state_attr(s,'peak_temp_c') }}° − {{ state_attr(s,'peak_dewpoint_c') }}° | **{{ spread }}°** skal overvindes |
              | ⚖️ **Underskud** | {{ cool }}° − {{ spread }}° | **{{ defi }}°** {{ '→ dugpunktet nås ✅' if defi >= 0 else '→ mangler stadig' }} |

              Underskuddet oversættes til en intensitet 0–100 % pr. time (−3° = 0 %,
              +2° = 100 %), og timerne **lægges sammen** i stedet for at vi kigger på
              den værste time alene: skum og betræk **suger** — én klar time tørrer
              ud igen, en hel nat gør ikke. Nattens dug-tal =
              **{{ soak | round(1) }} time-ækvivalenter** ud af 6, som er dét der
              svarer til et gennemvådt betræk.
              {{ state_attr(s,'vaade_timer') }} af {{ state_attr(s,'toerre_timer') }}
              tørre prognose-timer (af {{ state_attr(s,'timer_i_vindue') }} i vinduet
              21:00–09:00) var kraftige nok til at tælle for fuldt.
              Skyer og vind glattes over ±1 time, fordi met.no's timeværdier hopper
              voldsomt mellem nabotimer.

              Der trækkes **ikke** fra for fordampning undervejs — en rude tørrer,
              et skumfyldt betræk holder på vandet til det bliver taget ind.
              **Regn** vejer selvstændigt: 1 mm i vinduet = gennemvådt (score 100),
              og nattens facit er `max(dug, regn)`.

              **Facit:** score **{{ score }}**
              (denne nat: {{ 'regn' if state_attr(s,'aarsag') == 'regn' else 'dug' }}
              er den bindende årsag)
              {% if score >= (state_attr(s,'threshold') | int(100)) %}≥ tærskel
              {{ state_attr(s,'threshold') }} → **varsel** 🛋️{% else %}< tærskel
              {{ state_attr(s,'threshold') }} → intet varsel{% endif %}
              · niveauer: Fugtige < 55 ≤ Våde < 75 ≤ Gennemvåde

              _(⚠️ Skalaen er endnu **ikke kalibreret mod hynder** — de gamle
              træner-svar handlede om ruder/bil/græs og kan ikke genbruges.
              Morgen-spørgsmålet "hvor våde er hynderne?" bygger det nye facit op;
              justér imens med de to slidere på Indstillinger.)_
          - type: tile
            entity: sensor.dug_varsel_i_nat
            name: "Hynderne i nat"
            color: blue
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.dug_varsel_sender_i_aften
            name: "Push til Parent A i aften?"
            state_content: state
            grid_options:
              columns: 6

