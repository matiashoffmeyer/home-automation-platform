# =============================================================================
# Genvex — trin vs. fugt (B226, 2026-10-12)
# =============================================================================
# User: "lav en side i ha som tracker det og viser effekten tydeligt, hvis der
# er nogen … vurder også om det har en mærkbar positiv effekt hvis vi kobler
# genvex på HA og forklar hvilken effekt med tal på genvex siden."
# → User bad EKSPLICIT om forklaring med tal på siden, derfor mere tekst end
#   tekst-reglen ellers tillader. Metode, fit og baseline: packages/genvex_fugt.yaml.
# Lovelace mode: yaml — registreret i configuration.yaml (genvex-dash).
#
# Statistik-konstanter i markdown'en (fra baseline, se pakken):
#   0,35 g/m³ = døgn-spredning på afvigelsen fra trin 2-modellen
#   1,57 /t   = spredning på badets henfalds-rate k (21 bade, trin 2)
# =============================================================================
title: Genvex
icon: mdi:fan
views:
  - title: Genvex
    path: genvex
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Genvex
            heading_style: title
          - type: tile
            entity: input_number.genvex_trin
            name: Trin
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.genvex_fugtstyring
            name: Fugtstyring
          - type: tile
            entity: input_datetime.genvex_trin_skiftet
            name: Trin skiftet
          # A/B/C: skift hver lørdag. Kørt: 2, 1, 2, 1 (17/10-13/11); fra 14/11
          # roterer 3 → 2 → 1 (sensor.genvex_trin_denne_uge). Push med Gjort-knap når
          # du er hjemme og trinnet står forkert (packages/genvex_fugt.yaml).
          - type: tile
            entity: input_boolean.genvex_ab_eksperiment
            name: Skift trin hver uge
          - type: tile
            entity: sensor.genvex_trin_denne_uge
            name: Trin denne uge
          - type: markdown
            content: Ret trinnet her, når du skifter det på panelet.
          # Tøjtørring inde: trykkets døgn 00:00 → næste dag 12:00 tæller ikke
          # med i målingerne, og dagens allerede talte data trækkes ud
          # (binary_sensor.genvex_toj_inde, header TØJ TØRRET INDE).
          - type: tile
            entity: input_button.genvex_toej_inde
            name: Vi tørrede tøj indendørs i dag
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.genvex_toej_inde
              confirmation:
                text: Springe dagens målinger over (til i morgen kl. 12)?
            icon_tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.genvex_toej_inde
              confirmation:
                text: Springe dagens målinger over (til i morgen kl. 12)?
          - type: tile
            entity: binary_sensor.genvex_toj_inde
            name: Tøj-døgn springes over

      # Evaluering 19/11 (user: "opdater genvex siden og drag konklusioner +
      # anbefalinger … hvor mangler du data?"). Rå LTS-timemidler 12/10 → 19/11 12:00,
      # tøj-døgn og de første 3 t efter et skift ude; personer fra 20/10 (recorderen
      # har ikke ældre). Blokke: t1 12-17/10, t2 17-26/10, t1 26-31/10, t2 31/10-7/11,
      # t1 7-14/11 (huset næsten tomt: 0,6 pers, 19 t med ≥ 2), t3 14/11 17:10 →.
      #   SEPTEMBER-MODELLEN HOLDER IKKE I FYRINGSSÆSONEN: forventet = 5,93 − 0,473 ×
      #   ude er fit på ude 7-12 g/m³; på døgnmidler (≥ 2 hjemme, 24 døgn) er
      #   hældningen −0,16…−0,23. Trin 3 har KUN kørt koldt (ude p50 6,4 mod t2 7,7 /
      #   t1 8,5 g/m³; udetemp 6,3 mod 8,7 / 8,1 °C) → live-tabellens trin 3 (acc
      #   −1,26 mod t2 −0,15) er mest årstid.
      #   Fugt, døgnmidler ov ~ ude + personer + trin (ref t2): t1 −0,06 ± 0,44,
      #     t3 −0,50 ± 0,54 g/m³ (uden person-led −0,71 ± 0,54); rest-sd 0,44.
      #     Bånd ude 5-7 g/m³: t2 2,70 (57 t, 2,6 pers) · t3 1,78 (58 t, 2,1 pers) ·
      #     t1 1,73 (18 t, 2,0 pers).
      #   Bad (sensor.bad_torretid): median 19,5 / 24,4 / 24,4 min, k 4,63 / 3,69 /
      #     3,97 (21 / 23 / 10 bade) → t3 mod t2 Δk +0,28 ± 1,19 = ingen.
      #   Håndklæde (bad_efter_bad): 0,91 / 0,82 / 1,04 g/m³, t3 mod t2 ± 0,32 = ingen.
      #   Temperatur samme radiator-opsætning (2-2-3-2-3,5 fra 24/10), døgnmidler ~
      #     udetemp + personer + trin: køkken t3 −0,54 ± 0,34, t1 −0,02 ± 0,31 °C;
      #     bad t3 +0,34 ± 0,27; sove/stue ± 1,2-1,3 (for støjende pr. døgn).
      #     pr_trin-tabellens trin 3 "+3,2 °C i sove" er modellen uden fyring
      #     ekstrapoleret til den koldeste uge, ikke trinnet.
      #   Inde-RH pr. blok 57 / 47 / 52 / 44 / 38 / 40 % → fra november ligger
      #     lejligheden under fugtstyringens 44 %, så den booster ikke: trinnet måles rent nu.
      # (Evaluering 30/10, kort: fugt t1 +0,16 mod t2 +0,09 = ingen; bad 20 mod 25
      # min = ingen; bad-RH ½-4 t efter bad 52,5 mod 48,5 % = ikke afgjort; sove/bad
      # ~0,6 °C koldere på t2 — den sidste holdt ikke ved samme radiator-opsætning.)
      - type: grid
        cards:
          - type: heading
            heading: Evaluering 19/11
            heading_style: title
          - type: markdown
            content: |-
              | Mod trin 2 | Trin 1 | Trin 3 |
              |---|---|---|
              | Fugt (renset for udeluft og personer) | ingen forskel (± 0,4) | −0,5 ± 0,5 g/m³ ≈ −2-3 %RH |
              | Badet tørt efter | 20 mod 24 min — ingen sikker forskel | 24 mod 24 min — ingen forskel |
              | Badet ½-4 t efter bad | ingen forskel | ingen forskel |
              | Køkken | ingen forskel | ~0,5 °C koldere |
              | Timer i koldt vejr (ude < 7 g/m³, ≥ 2 hjemme) | 18 t | 58 t (trin 2: 57 t) |

              **Konklusion:** trin 3 trækker lidt mere fugt og varme ud af lejligheden, men badet tørrer ikke hurtigere. Mellem trin 1 og 2 er der stadig ingen målbar forskel. Siden november ligger luften under 44 %RH (~40 %), så fugtstyringen skruer ikke selv op længere — trinnet måles rent nu.

              **Anbefaling:** kør ikke trin 3 fast i vinter — luften er allerede tør, og trin 3 gør den tørrere og køkkenet koldere uden at hjælpe badet. Trin 1 eller 2 afgøres, når begge har kørt i koldt vejr med folk hjemme: trin 2 fra 21/11, trin 1 fra 28/11 → svar omkring 5/12.

              **Mangler data:** trin 1 i koldt vejr (ugen 7-14/11 var huset næsten tomt), og soveværelse/stue — deres temperatur svinger for meget fra dag til dag til at vise et trin.

      - type: grid
        cards:
          - type: heading
            heading: Effekt
            heading_style: title
          # A/B/C (12/10, trin 3 med fra 14/11): trin 1 og trin 3 holdes hver for sig
          # op mod trin 2, uanset hvilket der kører nu. Trin 2 tæller kun fra fyringen
          # 12/10 (radiatorerne tændt samme dag som trin 1 — se pakkens header).
          # Døgn = 15-min-samples / 96. ± = 2 × 0,35 × √(1/d_x + 1/d_2) pr. par;
          # bad: 2 × 1,57 × √(1/n_x + 1/n_2) på henfalds-raten k, fra 5 bade.
          # Pakken tæller allerede trin 3 (acc/maalinger har nøglerne '1'-'4').
          # Håndklæde-rækken: sensor.bad_efter_bad (badets overskud mod stuen 0,5-4 t
          # efter toppen, pr. kvarter). Backfillet 13/11 fra historikken 14/10 →
          # (trin 1: 0,91 over 16 bade, trin 2: 0,82 over 18; sd pr. bad 0,43, ~11
          # kvarterer pr. bad) → ± = 2 × 0,43 × √(11/n_x + 11/n_2), fra 5 bade.
          - type: markdown
            content: |-
              {% set acc = state_attr('sensor.genvex_effekt', 'acc') or {} %}
              {% set ml = state_attr('sensor.bad_torretid', 'maalinger') or {} %}
              {% set T = states('sensor.indoor_temperature_resilient') | float(22) %}
              {% set sat = 216.7 * 6.112 * (e ** (17.62 * T / (243.12 + T))) / (273.15 + T) %}
              {% set a2 = acc.get('2', [0, 0]) %}{% set d2 = a2[1] / 96 %}{% set m2 = a2[0] / a2[1] if a2[1] > 0 else 0 %}
              {% set b2 = ml.get('2', []) %}
              {% set hk = state_attr('sensor.bad_efter_bad', 'acc') or {} %}{% set h2 = hk.get('2', [0, 0]) %}
              | | Trin 1 | Trin 2 | Trin 3 |
              |---|---|---|---|
              | Fugt over forventet |{% for t in ['1', '2', '3'] %}{% set a = acc.get(t, [0, 0]) %} {% if a[1] > 0 %}{{ '%+.2f' | format(a[0] / a[1]) | replace('.', ',') }} g/m³{% else %}—{% endif %} |{% endfor %}
              | Målt i |{% for t in ['1', '2', '3'] %} {{ '%.1f' | format(acc.get(t, [0, 0])[1] / 96) | replace('.', ',') }} døgn |{% endfor %}
              | Badet tørt efter |{% for t in ['1', '2', '3'] %}{% set b = ml.get(t, []) %} {% if b | count > 0 %}{{ b | map('first') | list | median | round(0) | int }} min ({{ b | count }} bade){% else %}ingen bade{% endif %} |{% endfor %}
              | Bad over stue, ½-4 t efter bad |{% for t in ['1', '2', '3'] %}{% set h = hk.get(t, [0, 0]) %} {% if h[1] > 0 %}{{ '%.2f' | format(h[0] / h[1]) | replace('.', ',') }} g/m³ (~{{ (h[1] / 11) | round(0) | int }} bade){% else %}—{% endif %} |{% endfor %}


              {% for t in ['1', '3'] %}{% set a = acc.get(t, [0, 0]) %}{% set d = a[1] / 96 %}
              {% if d < 3 or d2 < 3 %}**Trin {{ t }}: for tidligt** — {{ '%.1f' | format(d) | replace('.', ',') }} af 3 døgn.
              {% else %}{% set dif = a[0] / a[1] - m2 %}{% set fejl = 2 * 0.35 * ((1 / d + 1 / d2) ** 0.5) %}
              {% if dif | abs > fejl %}**Trin {{ t }} giver {{ '%+.2f' | format(dif) | replace('.', ',') }} ± {{ '%.2f' | format(fejl) | replace('.', ',') }} g/m³ fugt** mod trin 2 ≈ {{ '%+.0f' | format(dif / sat * 100) }} %RH i stuen.
              {% else %}**Trin {{ t }}: ingen målbar forskel** mod trin 2 (± {{ '%.2f' | format(fejl) | replace('.', ',') }} g/m³).{% endif %}{% endif %}

              {% endfor %}
              Fugten tæller kun, når mindst 2 er hjemme. Trin 3 har kun kørt i koldere vejr, hvor modellen overdriver forskellen — se Evaluering.

              {% for t in ['1', '3'] %}{% set b = ml.get(t, []) %}
              {% if b | count >= 5 and b2 | count > 0 %}
              {% set k2 = b2 | map('last') | list %}{% set k = b | map('last') | list %}
              {% set dk = (k | median) - (k2 | median) %}
              {% set fk = 2 * 1.57 * ((1 / (k2 | count) + 1 / (k | count)) ** 0.5) %}
              {% if dk | abs > fk %}**Badet tørrer {{ 'langsommere' if dk < 0 else 'hurtigere' }} på trin {{ t }}:** {{ (k | median / (k2 | median) * 100) | round(0) | int }} % af trin 2's udsugningstakt.
              {% else %}Badets tørretid på trin {{ t }}: ingen målbar forskel mod trin 2.{% endif %}
              {% elif t == '3' %}Badets tørretid på trin 3: {{ b | count }} af 5 bade.{% endif %}

              {% endfor %}
              {% for t in ['1', '3'] %}{% set h = hk.get(t, [0, 0]) %}
              {% if h[1] >= 55 and h2[1] >= 55 %}
              {% set dh = h[0] / h[1] - h2[0] / h2[1] %}{% set fh = 2 * 0.43 * ((11 / h[1] + 11 / h2[1]) ** 0.5) %}
              {% if dh | abs > fh %}**Håndklædet: badet er {{ '%.2f' | format(dh | abs) | replace('.', ',') }} g/m³ {{ 'fugtigere' if dh > 0 else 'tørrere' }} på trin {{ t }}** i timerne efter et bad (± {{ '%.2f' | format(fh) | replace('.', ',') }}).
              {% else %}Håndklædet på trin {{ t }}: ingen målbar forskel mod trin 2 (± {{ '%.2f' | format(fh) | replace('.', ',') }} g/m³).{% endif %}
              {% elif t == '3' %}Håndklædet på trin 3: ~{{ (h[1] / 11) | round(0) | int }} af 5 bade.{% endif %}

              {% endfor %}

      # Radiatorerne tændt 12/10, samme dag som trin 1 (user 13/10). Pr. rum:
      # temperatur minus model uden fyring (a + b × udetemp 24 t, fit 14/9–12/10,
      # packages/genvex_fugt.yaml header RADIATORER), akkumuleret fra 12/10 12:00
      # i sensor.radiator_effekt. ± = 2 × døgn-sd / √døgn; døgn-sd fra fittet.
      # Stue: fit forfra 3/10–12/10 uden dør-timer (22/10, B247) → døgn-sd 0,28.
      # RH-linjen: samme vandmængde ved T − Δ → hvad køkkenets %RH ville være.
      - type: grid
        cards:
          - type: heading
            heading: Radiatorer
            heading_style: title
          # Termostat-trin 0-5 pr. radiator (user 17/10). Logges i hånden;
          # sensor.radiator_effekt.pr_trin tæller pr. Genvex-trin OG opsætning.
          - type: tile
            entity: input_number.radiator_trin_sove
            name: Soveværelse
          - type: tile
            entity: input_number.radiator_trin_stue
            name: Stue
          - type: tile
            entity: input_number.radiator_trin_spisestue
            name: Spisestue
          - type: tile
            entity: input_number.radiator_trin_boernevaerelse
            name: Børneværelse
          - type: tile
            entity: input_number.radiator_trin_bad
            name: Gulvvarme bad
          - type: markdown
            content: Ret trinnet her, når du drejer på en radiator.
          - type: markdown
            content: |-
              {% set acc = state_attr('sensor.radiator_effekt', 'acc') or {} %}
              {% set sd = {'sove': 0.56, 'stue': 0.28, 'kokken': 0.19, 'bad': 0.15} %}
              {% set navn = {'sove': 'Soveværelse', 'stue': 'Stue', 'kokken': 'Køkken', 'bad': 'Bad'} %}
              Varmere end udeluften tilsiger, siden radiatorerne kom på 12/10:

              | Rum | Over forventet | |
              |---|---|---|{% for r in ['sove', 'stue', 'kokken', 'bad'] %}{% set a = acc.get(r, [0, 0]) %}{% set d = a[1] / 96 %}{% set m = a[0] / a[1] if a[1] > 0 else 0 %}{% set f = 2 * sd[r] / (d ** 0.5) if d > 0 else 0 %}
              | {{ navn[r] }} | {{ '%+.1f' | format(m) | replace('.', ',') }} ± {{ '%.1f' | format(f) | replace('.', ',') }} °C | {% if d < 3 and m | abs <= f %}for tidligt ({{ '%.1f' | format(d) | replace('.', ',') }} døgn){% elif m | abs > f %}**{{ 'varmere' if m > 0 else 'koldere' }}**{% else %}ingen forskel{% endif %} |{% endfor %}

              {% set k = acc.get('kokken', [0, 0]) %}{% set dk = k[0] / k[1] if k[1] > 0 else 0 %}
              {% set T = states('sensor.indoor_temperature_resilient') | float(22.5) %}
              {% set rh = states('sensor.indoor_humidity_resilient') | float(50) %}
              {% set s1 = 6.112 * (e ** (17.62 * T / (243.12 + T))) / (273.15 + T) %}
              {% set s0 = 6.112 * (e ** (17.62 * (T - dk) / (243.12 + T - dk))) / (273.15 + T - dk) %}
              **Sådan tager forsøget højde for det**
              - Fugt måles i g/m³ (vandmængden) — varme ændrer kun %RH. I køkkenet, hvor fugten måles, svarer {{ '%+.1f' | format(dk) | replace('.', ',') }} °C til {{ '%+.1f' | format(rh - rh * s1 / s0) | replace('.', ',') }} %RH.
              - Trin 2 tæller kun fra 12/10, så alle tre trin måles med radiatorerne tændt.
              - Genvex' fugtstyring (44 %) booster mindre, når varmen sænker %RH — det rammer alle trin ens. Under 44 % (vinter) booster den slet ikke.
          # Trin 1 og trin 3 mod trin 2 ved SAMME radiator-opsætning (nøgle = nuværende
          # input_number.radiator_trin_*). ± som ovenfor, kun når begge har data.
          - type: markdown
            content: |-
              {% set p = state_attr('sensor.radiator_effekt', 'pr_trin') or {} %}
              {% set ns = namespace(o=[]) %}{% for r in ['sove', 'stue', 'spisestue', 'boernevaerelse', 'bad'] %}{% set ns.o = ns.o + ['%g' | format(states('input_number.radiator_trin_' ~ r) | float(0))] %}{% endfor %}
              {% set opst = ns.o | join('-') %}
              {% set g1 = p.get('1|' ~ opst, {}) %}{% set g2 = p.get('2|' ~ opst, {}) %}{% set g3 = p.get('3|' ~ opst, {}) %}
              {% set sd = {'sove': 0.56, 'stue': 0.28, 'kokken': 0.19, 'bad': 0.15} %}
              {% set navn = {'sove': 'Soveværelse', 'stue': 'Stue', 'kokken': 'Køkken', 'bad': 'Bad'} %}
              {% if opst == '0-0-0-0-0' %}Log radiatorernes trin ovenfor for at sammenligne Genvex-trinnene.{% else %}
              Genvex-trin ved denne radiator-opsætning, °C over forventet:

              | Rum | Trin 1 | Trin 2 | Trin 3 |
              |---|---|---|---|{% for r in ['sove', 'stue', 'kokken', 'bad'] %}{% set a = g2.get(r, [0, 0]) %}{% set d2 = a[1] / 96 %}{% set m2 = a[0] / a[1] if a[1] > 0 else 0 %}
              | {{ navn[r] }} |{% for g in [g1, g2, g3] %}{% set b = g.get(r, [0, 0]) %}{% set d = b[1] / 96 %} {% if b[1] > 0 %}{% set m = b[0] / b[1] %}{% set f = 2 * sd[r] * ((1 / d + 1 / d2) ** 0.5) if d2 > 0 else 0 %}{% set sig = not loop.index == 2 and f > 0 and (m - m2) | abs > f %}{{ '**' if sig }}{{ '%+.1f' | format(m) | replace('.', ',') }}{{ '**' if sig }} ({{ '%.1f' | format(d) | replace('.', ',') }} d){% else %}—{% endif %} |{% endfor %}{% endfor %}

              Fed = målbar forskel mod trin 2. Trin 3 har kun kørt i den koldeste uge, hvor modellen uden fyring gør rummene for varme — se Evaluering.
              {% endif %}

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Grafer
            heading_style: title
          # Afvigelsen er backfillet 30/8 → 12/10 (trin 2); 0 = som trin 2 uden
          # fyring. Radiatorerne kom på 12/10 → niveau-skift samme dag som trin 1.
          - type: statistics-graph
            title: Fugt over forventet — g/m³ pr. dag
            entities:
              - entity: sensor.fugt_overskud_afvigelse
                name: Over forventet
            period: day
            days_to_show: 45
            stat_types:
              - mean
            chart_type: bar
          - type: history-graph
            title: Trin
            hours_to_show: 1080
            entities:
              - entity: input_number.genvex_trin
                name: Trin
          - type: statistics-graph
            title: Fugt-overskud inde − ude — g/m³ pr. time
            entities:
              - entity: sensor.fugt_overskud
                name: Målt
              - entity: sensor.fugt_overskud_forventet
                name: Forventet på trin 2
            period: hour
            days_to_show: 7
            stat_types:
              - mean
            chart_type: line
          # Backfillet 1/9 → 13/10 fra rummenes LTS (samme fit-formel); 0 = som
          # før fyringen. Køkken = fugt-målets rum.
          - type: statistics-graph
            title: Radiatorer — °C over forventet pr. dag
            entities:
              - entity: sensor.radiator_effekt_sove
                name: Soveværelse
              - entity: sensor.radiator_effekt_stue
                name: Stue
              - entity: sensor.radiator_effekt_kokken
                name: Køkken
              - entity: sensor.radiator_effekt_bad
                name: Bad
            period: day
            days_to_show: 45
            stat_types:
              - mean
            chart_type: line
          - type: history-graph
            title: Badet over stuen — g/m³
            hours_to_show: 48
            entities:
              - entity: sensor.bad_fugt_overskud
                name: Bad − stue

      # Tallene er skøn (header i pakken + svaret 12/10; bad-boost rettet 19/11 efter
      # trin 3-ugen: tørretid 24,4 min median på trin 3 og trin 2): ventilator ~10-20 W
      # pr. trin, varmetab 0,34 Wh/m³K × ~50 m³/h × 15 K × (1 − 0,85) ≈ 40 W i
      # fyringssæsonen, elpris ~2,95 kr/kWh all-in. Tørretid trin 2 = målt.
      - type: grid
        cards:
          - type: heading
            heading: Koble Genvex på HA?
            heading_style: title
          - type: markdown
            content: |-
              | Gevinst | Tal |
              |---|---|
              | Bad-boost | Næppe noget: badet tørrer ikke hurtigere på trin 3 end på trin 2 (24 min begge, målt 14-19/11) |
              | Fugt-styring | Ned når luften er tør (vinter ~40 %RH), op når den er fugtig. 44 %-styringen kan kun skrue op |
              | Energi | Trin 1 frem for 2: ~300-500 kr/år (skøn). Koblingen lægger kun ~50-150 kr/år oveni |
              | Data | Filter-alarm, indblæsnings-temperatur og reel virkningsgrad |

              **Vurdering:** lille — mest for vinterens tørre luft, ikke for badet eller elregningen. Kræver Genvex Connect eller Modbus på din model.
