# =============================================================================
# Folketinget — kontrolpanel (2026-11-04)
# =============================================================================
# Forslag: dagens forslag + For/Imod/Neutral og listen over alle forslag. Enighed:
# partier og medlemmer rangeret efter dine svar (det du stemmer efter). Alt indhold kommer fra sensor.folketing (scripts/folketing.py
# `status`); knapperne kalder script.folketing_svar, som svarer på den AKTUELLE
# sag (= den senest pushede ubesvarede, ellers den næste i køen) — så et tryk
# på pushen lander på det forslag, pushen handlede om.
# Partiernes stemmer vises først EFTER du har svaret (1a: dit svar skal ikke
# farves af hvem der stemte hvad).
# Indstillinger (send, vindue, pushes pr. dag, hjemkomst-kø): 🔔-fanen.
# Lovelace mode: yaml — registreret i configuration.yaml (folketing-dash).
# =============================================================================
title: Folketinget
icon: mdi:bank
views:
  - title: Forslag
    path: forslag
    icon: mdi:vote
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Dagens forslag
            badges:
              - type: entity
                entity: sensor.folketing
                name: Ubesvarede
                show_name: true
          - type: markdown
            content: >-
              {% set a = state_attr('sensor.folketing', 'aktuel') %}
              {% if a %}### {{ a.nummer }} · {{ a.type }}

              **{{ a.kort }}**

              {{ a.detalje }}

              <font color="gray">Fremsat {{ a.fremsat }}{% if a.url %} · [ft.dk]({{ a.url }}){% endif %}</font>
              {% else %}Ingen ubesvarede forslag lige nu.{% endif %}
          - type: button
            name: For
            icon: mdi:thumb-up
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.folketing_svar
              data:
                svar: FOR
                kilde: side
          - type: button
            name: Imod
            icon: mdi:thumb-down
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.folketing_svar
              data:
                svar: IMOD
                kilde: side
          - type: button
            name: Neutral
            icon: mdi:minus-circle-outline
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.folketing_svar
              data:
                svar: NEUTRAL
                kilde: side
      # 2026-11-04 (user: "scrolle gennem alle pending forslag … også kunne
      # ændre mine svar"): hele listen med små knapper; dit svar er fremhævet,
      # et tryk på en anden ændrer det. Ny/Stemt = om Folketinget har stemt.
      # Erstatter "Næste i køen" + "Seneste svar" (resultat og partier står nu
      # i rækken, stadig først efter dit svar). www/folketing-liste-card.js.
      - type: grid
        cards:
          - type: heading
            heading: Alle forslag
          - type: custom:folketing-liste-card
          - type: markdown
            content: >-
              <font color="gray">{{ state_attr('sensor.folketing', 'besvaret') or 0 }} svar · AI-tekst denne måned {{ '%.2f' | format(state_attr('sensor.ai_udgift_folketing', 'kr_maaned') or 0) }} kr</font>

  # Vægtning (user-spec 2026-11-05): mange forslag er ukontroversielle og stemmes
  # For af næsten alle → Vigtig/Uvigtig pr. besvaret forslag (kun For/Imod —
  # Neutral tæller ikke i Enighed, så den vises ikke her). Vægten (VAEGTE i
  # scripts/folketing.py: 3 / 1 / 0,25) tæller KUN i Enighed-procenten; sager-
  # tallet er stadig ét pr. svar. Kortet: custom:folketing-liste-card, visning: vaegt.
  - title: Vægtning
    path: vaegtning
    icon: mdi:scale-balance
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Hvor meget betyder svaret?
          - type: markdown
            content: |-
              Vigtig tæller 3 gange, uvigtig en fjerdedel. Ændrer kun procenterne under Enighed.
          - type: custom:folketing-liste-card
            visning: vaegt

  # Enighed: det du skal bruge ved næste valg (user-spec 2026-11-04). Kun
  # forslag der er STEMT OM tæller (Neutral tæller ikke, 2a). Et parti/medlem
  # under MIN_FAELLES fælles sager står nederst med "få sager" — en procent på
  # 1 af 1 siger intet. Medlemmer kræver mindst en tredjedel af dine sager
  # (fravær/pardannelse), se status_doc() i scripts/folketing.py.
  - title: Enighed
    path: enighed
    icon: mdi:handshake
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Hvem er du mest enig med?
          - type: markdown
            content: |-
              {% set b = state_attr('sensor.folketing', 'besvaret') or 0 %}
              {% set n = state_attr('sensor.folketing', 'sammenlignet') or 0 %}
              {% set v = state_attr('sensor.folketing', 'venter') or 0 %}
              **{{ n }}** af dine {{ b }} svar er stemt om{% if v %} · {{ v }} venter på afstemningen{% endif %}. Jo flere, jo sikrere.
              <font color="gray">Kun forslag der er stemt om tæller · Neutral tæller ikke{% set vi = state_attr('sensor.folketing', 'vigtige') or 0 %}{% set uv = state_attr('sensor.folketing', 'uvigtige') or 0 %}{% if vi or uv %} · {{ vi }} vigtige, {{ uv }} uvigtige vægtet{% endif %}</font>
      - type: grid
        cards:
          - type: heading
            heading: Partier
          - type: markdown
            content: |-
              {% set p = state_attr('sensor.folketing', 'partier') or [] %}
              {% if p %}| Parti | Enig | | Sager |
              |:--|--:|:--|--:|
              {% for x in p %}{% set f = x.enig + x.uenig < 5 %}| {{ x.navn }} | {{ x.pct }} % | {{ '█' * ((x.pct or 0) // 10) }}{{ '░' * (10 - (x.pct or 0) // 10) }} | {{ x.enig }}/{{ x.enig + x.uenig }}{{ ' · få' if f else '' }} |
              {% endfor %}{% else %}Svar For eller Imod på forslag. Når Folketinget har stemt om dem, kommer partierne her.{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Medlemmer
          - type: markdown
            content: |-
              {% set m = state_attr('sensor.folketing', 'politikere') or [] %}
              {% set l = state_attr('sensor.folketing', 'politikere_mindst') or [] %}
              {% if m %}**Mest enige**

              | Navn | Parti | Enig | Sager |
              |:--|:--|--:|--:|
              {% for x in m %}| {{ x.navn }} | {{ x.parti }} | {{ x.pct }} % | {{ x.enig }}/{{ x.enig + x.uenig }} |
              {% endfor %}
              {% if l %}**Mindst enige**

              | Navn | Parti | Enig | Sager |
              |:--|:--|--:|--:|
              {% for x in l %}| {{ x.navn }} | {{ x.parti }} | {{ x.pct }} % | {{ x.enig }}/{{ x.enig + x.uenig }} |
              {% endfor %}{% endif %}{% else %}Medlemmerne kommer, når du har svaret på mindst 5 forslag, der er stemt om.{% endif %}
