# =============================================================================
# Himmel — dedikeret dashboard (2026-06-16)
# =============================================================================
# Viser himmelfænomener i nat (nordlys / planeter / lysende natteskyer) fra
# sensor.sky_tonight, som scripts/sky_notify.py publicerer kl 21:30 + ved
# HA-start. Selve notifikationen sendes af samme script til
# notify.mobile_app_phone_a (mutes via Indstillinger → 🎛️ Kontakter & flags).
# Lovelace mode: yaml — registreret i configuration.yaml (himmel-dash).
# =============================================================================
title: Himmel
icon: mdi:weather-night
views:
  - title: Himmel
    path: himmel
    type: sections
    max_columns: 3
    sections:
      # =====================================================================
      # Status + kontrol
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🌌 Himmelfænomener i nat
            heading_style: title
          - type: markdown
            content: >
              {% set o = 'sensor.sky_tonight' %}
              {% if states(o) in ['unknown','unavailable','None'] %}
              _Afventer første kørsel af himmel-scriptet (kører kl 21:30 + ved
              HA-start). Tryk "Scan nu" for at hente med det samme._
              {% else %}
              **{{ states(o) }}**<br>
              _opdateret {{ state_attr(o,'updated') }} · nat {{ state_attr(o,'nat') }}_
              {% endif %}
          - type: tile
            entity: sensor.sky_tonight
            name: I nat
            icon: mdi:weather-night
          - type: button
            name: Scan nu
            icon: mdi:refresh
            tap_action:
              action: perform-action
              perform_action: shell_command.sky_notify_scan

      # =====================================================================
      # De tre fænomener
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🔭 Detaljer
            heading_style: title
          - type: markdown
            content: >
              {% set o = 'sensor.sky_tonight' %}
              {% set aurora = state_attr(o,'nordlys') %}
              {% set planets = state_attr(o,'planeter') %}
              {% set nlc = state_attr(o,'natteskyer') %}

              {% if aurora %}{{ aurora }}{% else %}🌌 **Nordlys:** ingen reel chance i nat (Kp for lav, for lyst eller for skyet).{% endif %}

              {% if planets %}{{ planets }}{% else %}🪐 **Planeter:** ingen 2+ frie-øje-planeter samlet højt nok i et mørkt, klart vindue.{% endif %}

              {% if nlc %}{{ nlc }}{% else %}🌙 **Lysende natteskyer:** ingen gode betingelser (uden for sæson maj–aug, ikke dybt nok tusmørke eller for skyet).{% endif %}

      # =====================================================================
      # Nattens lys-vindue (sol)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🌇 Lys-vindue i nat
            heading_style: title
          - type: markdown
            content: >
              {% set s = 'sun.sun' %}
              ☀️ **Solhøjde nu:** {{ state_attr(s,'elevation') | round(1) }}°<br>
              🌆 **Solnedgang:** {{ as_timestamp(state_attr(s,'next_setting')) | timestamp_custom('%H:%M', true) if state_attr(s,'next_setting') else '–' }}<br>
              🌃 **Tusmørke (dusk):** {{ as_timestamp(state_attr(s,'next_dusk')) | timestamp_custom('%H:%M', true) if state_attr(s,'next_dusk') else '–' }}<br>
              🌅 **Solopgang:** {{ as_timestamp(state_attr(s,'next_rising')) | timestamp_custom('%H:%M', true) if state_attr(s,'next_rising') else '–' }}
          - type: tile
            entity: sun.sun
            name: Sol
            icon: mdi:white-balance-sunny
