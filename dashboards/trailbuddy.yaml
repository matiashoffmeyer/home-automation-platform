# =============================================================================
# Trail Buddy — vandreturen set hjemmefra (2026-11-06)
# =============================================================================
# User-spec 2026-11-06: Parent B skal kunne se om vi bevæger os, hvornår vi
# sidst gjorde det, om vi holder tidsplanen, og have en vej ind i appen.
# Data: sensor.trail_buddy_status (packages/trailbuddy_status.yaml +
# scripts/trailbuddy_watch.py, hvert 5. min). "Bevæget" = en fix > 250 m fra
# sidste anker; "Går" = bevæget inden for 20 min. Tidsplan = den forreste
# vandrers km på ruten mod dagens etape i plan.csv.
# Appen kan ikke vises i en iframe (X-Frame-Options: DENY) → link. Adressen er
# attributten public_url (fra add-on'et, B299 — tailnet-navnet står aldrig i git).
# Lovelace mode: yaml — registreret i configuration.yaml (trailbuddy-dash).
# =============================================================================
title: Trail Buddy
icon: mdi:hiking
views:
  - title: Oversigt
    path: oversigt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🥾 Vandreturen
            heading_style: title
          - type: markdown
            content: |
              {% set s = 'sensor.trail_buddy_status' %}
              {% macro tid(t) -%}
              {%- if t -%}
              {%- set m = ((as_timestamp(now()) - as_timestamp(t)) / 60) | int -%}
              {{ as_timestamp(t) | timestamp_custom('%-d/%-m kl. %H:%M') }} ({% if m < 60 %}{{ m }} min{% elif m < 2880 %}{{ (m / 60) | round(0) | int }} t{% else %}{{ (m / 1440) | round(0) | int }} dage{% endif %} siden)
              {%- else -%}aldrig{%- endif -%}
              {%- endmacro %}
              {% if states(s) in ['unknown', 'unavailable'] %}
              _Henter status …_
              {% else %}
              ## {{ '📅' if not state_attr(s, 'aktiv') else '🚶' if state_attr(s, 'bevaeger_sig') else ('⚠️' if state_attr(s, 'stille') else '⏸️') }} {{ states(s) }}

              **Sidst bevæget:** {{ tid(state_attr(s, 'sidst_bevaeget')) }}
              **Sidste signal:** {{ tid(state_attr(s, 'sidst_signal')) }}
              **Tidsplan:** {{ state_attr(s, 'tidsplan') }}
              {%- if state_attr(s, 'dag') %}
              **Dag {{ state_attr(s, 'dag') }}:** km {{ state_attr(s, 'km') if state_attr(s, 'km') is not none else '?' }} · etapen går fra km {{ state_attr(s, 'plan_km_start') }} til {{ state_attr(s, 'plan_km_slut') }}
              {%- endif %}

              {% if state_attr(s, 'stille') %}
              ⚠️ **Ingen bevægelse i over {{ state_attr(s, 'timer') | int }} timer** ({{ state_attr(s, 'stille_grund') }}). Det kan være dårlig dækning.
              {% elif state_attr(s, 'aktiv') %}
              _Alarm efter {{ state_attr(s, 'timer') | int }} timer uden bevægelse._
              {% endif %}
              {% if not state_attr(s, 'hentet_ok') %}
              _Trail Buddy svarer ikke lige nu — viser sidst kendte._
              {% endif %}
              {% endif %}
          - type: tile
            entity: input_boolean.notif_trailbuddy_stille_parent_b
            name: Alarm til Parent B
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.notif_trailbuddy_stille_enabled
            name: Alarm slået til
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: 👣 Vandrere
            heading_style: title
          - type: markdown
            content: |
              {% set v = state_attr('sensor.trail_buddy_status', 'vandrere') or [] %}
              {% if v | count == 0 %}
              _Ingen positioner endnu._
              {% else %}
              | | km | Bevæget | Signal |
              |---|---|---|---|
              {% for m in v -%}
              | **{{ m.navn }}** | {{ m.km if m.km is not none else '–' }} | {{ as_timestamp(m.sidst_bevaeget) | timestamp_custom('%-d/%-m %H:%M') if m.sidst_bevaeget else '–' }} | {{ as_timestamp(m.sidst_signal) | timestamp_custom('%-d/%-m %H:%M') if m.sidst_signal else '–' }} |
              {% endfor %}
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: 🗺️ Kort
            heading_style: title
          # Parent B skal ikke selv dele position: tomt navn = appen sender intet
          # (groupReady kræver navn), men gruppen vises med koden alene.
          - type: markdown
            content: |
              {% set u = state_attr('sensor.trail_buddy_status', 'public_url') %}
              {% if u %}
              ### [Åbn Trail Buddy]({{ u }})

              Første gang: Setup → Group, skriv turkoden og lad navnet stå tomt.
              {% else %}
              _Adressen kan ikke hentes lige nu._
              {% endif %}
