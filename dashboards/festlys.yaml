# =============================================================================
# Festlys — dedikeret kontrolpanel for diskolys/dance mode (2026-07-26)
# =============================================================================
# User-spec: "lav mig en dedikeret fest lys side og flyt alt der er relateret
# til fest lys derover så jeg har et kontrol panel til det. tilføj … hastigheden
# på fest lys (hvor hurtigt det kører og skifter farver når der ikke er events)."
#
# Samler ALT dance/festlys-kontrol ét sted (flyttet fra Lys- + Indstillinger-
# dashboardet): master-tænd, hastighed + event-hyppighed (nye sliders i
# packages/dance_mode.yaml), rum-vælger, manuelt event-lås og live-status.
# Motoren er packages/dance_mode.yaml. Lovelace mode: yaml — registreret i
# configuration.yaml (festlys-dash).
#
# NB: "Legetøjsdag-diskoen" (1. åbne-fredag morgen-varsel) er en SELVSTÆNDIG
# effekt koblet til vejr-varsel-vinduet, ikke dance mode — dens sliders bliver
# på Indstillinger sammen med de øvrige morgen-varsel-settings.
# =============================================================================
title: Festlys
icon: mdi:party-popper
views:
  - title: Festlys
    path: festlys
    type: sections
    max_columns: 3
    sections:
      # =====================================================================
      # Master-kontrol
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🎉 Festlys
            heading_style: title
            icon: mdi:party-popper
          - type: markdown
            content: >
              **Tryk Festlys** → auto-shuffle (tilfældige events + løbende
              farveskift). **Tryk et event** længere nede → det låses. **Stop**
              → alt stopper med det samme; tomme rum slukker, og rum hvor der
              er nogen, får deres normale Auto-lys tilbage.
          - type: tile
            entity: light.festlys
            name: Festlys (tap = auto-shuffle · hold = vælg event)
            icon: mdi:party-popper
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.dance_mode
            name: Dance mode (auto-shuffle on/off)
            icon: mdi:disco
            grid_options:
              columns: 12
          # 2026-09-23 (user: "jeg forventer instant reaktion … og stopper"):
          # ét tryk stopper ALT — det kørende event, auto-shuffle og loops — og
          # giver rummene tilbage til Auto-looket (samme vej som Festlys-tilens sluk).
          - type: button
            name: Stop festen
            icon: mdi:stop-circle
            show_state: false
            tap_action:
              action: perform-action
              perform_action: light.turn_off
              target:
                entity_id: light.festlys
            grid_options:
              columns: 12
              rows: 1

      # =====================================================================
      # Hastighed & rytme  (de nye kontroller)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: ⏱️ Hastighed & rytme
            heading_style: subtitle
          - type: tile
            entity: input_number.dance_speed
            name: Hastighed — farveskift uden event
            icon: mdi:speedometer
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.dance_event_frequency
            name: Event-hyppighed (auto-shuffle)
            icon: mdi:flash-auto
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.dance_manual_event_max_minutter
            name: Maks varighed — låst event
            icon: mdi:timer-sand
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # B260 (25/10): halloween sendte ~2 Matter-kommandoer/s og fældede
          # OTBR'en. Thread-pærerne skriver nu kun på deres plads i husets
          # fælles gitter (custom_templates/festlys.jinja); 8/min ≈ 0,27
          # kommandoer/s, trappe-testen var ren ved 0,5/s.
          - type: tile
            entity: input_number.festlys_thread_skrivninger
            name: Thread-pærer — skift pr. minut i alt
            icon: mdi:access-point-network
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Kun fest startet fra børne-Styrbarens pile (packages/festlys_boern_styrbar.yaml).
          - type: tile
            entity: input_number.festlys_boern_tomt_minutter
            name: Børne-Styrbar fest — sluk efter tomt rum
            icon: mdi:teddy-bear
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.fest_ankomst_tempo
            name: Tempo — dør-fanfaren ved ankomst
            icon: mdi:rainbow
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: >
              **Hastighed** = hvor hurtigt hver pære skifter farve når der IKKE
              kører et event (det rolige baggrundsloop): **1** ≈ 8 s/skift (mood),
              **50** = baseline (~4-5 s), **100** ≈ 1 s/skift (hurtig disko).<br>
              **Event-hyppighed** = hvor tit auto-shuffle fyrer et special-event
              (strobe/police/chase…) ind imellem: **1** = næsten aldrig, **50** =
              baseline (30-150 s), **100** = hyppigt (15-75 s). Gælder kun
              auto-shuffle.<br>
              **Tempo** = hvor hurtigt regnbue-kaskaden kører når hoveddøren
              åbner under festen: **25** ≈ 205 ms mellem farveskift, **75** =
              default (~115 ms), **100** ≈ 70 ms. Gælder KUN dør-fanfaren, ikke
              baggrundsloopet (det er "Hastighed" ovenfor). Entré-pæren kører
              altid kortere skridt end resten af huset — den sidder på
              Matter/Thread og deler ikke sendetid med Zigbee-pærerne, så den
              kan nå flere toner på samme tid. Skruer du helt op, bliver husets
              gren ikke nødvendigvis hurtigere: HA leverer ~5-10 lys-kald/sek,
              og derover fejler det tavst.<br>
              **Maks varighed** = loft på et **låst** event (dem du vælger
              herunder eller med depot-kontaktens pile). Loopet havde før ingen
              anden udgang end et bevidst *off* — 2026-08-07 kørte cascade i
              depotet **31 min** efter ét tryk på væg-kontakten, uden at nogen
              var i rummet. Ved loftet slukkes eventet pænt (og depotet giver
              et lånt rum-valg tilbage). **240** = i praksis ingen grænse.
              Auto-shuffle er ikke berørt — den skifter selv event løbende.<br>
              **Thread-pærer** = entré-loftet, stue-spotsene og badets KAJPLATS
              må tilsammen skifte så mange gange pr. minut; i hurtige blink er de
              mørke. 0 = de er ikke med.

      # =====================================================================
      # Rum der danser + live-status
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🛋️ Rum der danser
            heading_style: subtitle
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_boolean.dance_room_entre
                name: Entré (1 – ankomst-pæren)
              - entity: input_boolean.dance_room_stue
                name: Stue (læselampe + 2 spots)
              - entity: input_boolean.dance_room_spisestue
                name: Spisestue (1 — spiseloftet)
              - entity: input_boolean.dance_room_koekken
                name: Køkken (1 — lyskæden)
              - entity: input_boolean.dance_room_terrasse
                name: Terrasse (1)
              - entity: input_boolean.dance_room_boern
                name: Børneværelse (2)
              - entity: input_boolean.dance_room_bad
                name: Badeværelse (5 spots)
              - entity: input_boolean.dance_room_depot
                name: Depot (1)
          - type: tile
            entity: sensor.dance_active_bulbs
            name: Aktive pærer i alt
            icon: mdi:lightbulb-group
            grid_options:
              columns: 12
          - type: markdown
            content: >
              Ændrer du rum mens festen kører, sker det med det samme: et nyt
              rum begynder at danse, et fravalgt rum går tilbage til Auto. Døde
              pærer springes over (tallet ovenfor tæller kun dem der svarer).
              Vælges INTET rum sætter Festlys automatisk Stue til. Valget
              huskes, også hen over en genstart.<br>
              **Open-plan er tre selvstændige valg** (Stue · Spisestue · Køkken)
              siden 2026-08-28 — spiseloftet lå før i Stue-valget, så man ikke
              kunne holde festen i sofa-hjørnet alene. De deler stadig ÉT
              room_mode, så festen tager hele open-plan ud af Auto uanset hvilke
              af de tre der danser.

      # =====================================================================
      # Manuelt event-lås
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🎬 Lås ét event
            heading_style: subtitle
          - type: entities
            state_color: true
            entities:
              - entity: input_select.dance_manual_event
                name: Aktivt event (kører i loop til "off")
          # Ét tryk = låst (2026-09-23): dropdown'en krævede to tryk og en
          # rulning, og brugeren ville have "instant reaktion".
          - type: button
            name: strobe
            icon: mdi:flash
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: strobe
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: blackout
            icon: mdi:lightbulb-off
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: blackout
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: warm
            icon: mdi:fire-circle
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: warm
            grid_options:
              columns: 4
