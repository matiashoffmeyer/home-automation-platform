            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: jump
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: chase_comet
            icon: mdi:comet
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: chase_comet
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: split
            icon: mdi:circle-half-full
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: split
            grid_options:
              columns: 4
