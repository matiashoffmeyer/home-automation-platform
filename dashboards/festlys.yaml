# =============================================================================
# Festlys — dedikeret kontrolpanel for diskolys/dance mode (2026-07-26)
# =============================================================================
# User-spec: "lav mig en dedikeret fest lys side og flyt alt der er relateret
# til fest lys derover så jeg har et kontrol panel til det. tilføj … hastigheden
# på fest lys (hvor hurtigt det kører og skifter farver når der ikke er events)."
#
# Samler ALT dance/festlys-kontrol ét sted (flyttet fra Lys- + Indstillinger-
# dashboardet): master-tænd, hastighed + event-hyppighed (nye sliders i
# packages/dance_mode.yaml), rum-vælger, manuelt event-lås og live-status.
# Motoren er packages/dance_mode.yaml. Lovelace mode: yaml — registreret i
# configuration.yaml (festlys-dash).
#
# NB: "Legetøjsdag-diskoen" (1. åbne-fredag morgen-varsel) er en SELVSTÆNDIG
# effekt koblet til vejr-varsel-vinduet, ikke dance mode — dens sliders bliver
# på Indstillinger sammen med de øvrige morgen-varsel-settings.
# =============================================================================
title: Festlys
icon: mdi:party-popper
views:
  - title: Festlys
    path: festlys
    type: sections
    max_columns: 3
    sections:
      # =====================================================================
      # Master-kontrol
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🎉 Festlys
            heading_style: title
            icon: mdi:party-popper
          - type: markdown
            content: >
              **Tryk Festlys** → auto-shuffle (tilfældige events + løbende
              farveskift). **Tryk et event** længere nede → det låses. **Stop**
              → alt stopper med det samme; tomme rum slukker, og rum hvor der
              er nogen, får deres normale Auto-lys tilbage.
          - type: tile
            entity: light.festlys
            name: Festlys (tap = auto-shuffle · hold = vælg event)
            icon: mdi:party-popper
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.dance_mode
            name: Dance mode (auto-shuffle on/off)
            icon: mdi:disco
            grid_options:
              columns: 12
          # 2026-10-28 (user: "giv mig en start festen knap der er lige så stor
          # som stop festen"): samme vej som et tap på Festlys-tilen fra slukket —
          # auto-shuffle, og Stue vælges hvis intet rum er valgt.
          - type: button
            name: Start festen
            icon: mdi:play-circle
            show_state: false
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id: light.festlys
            grid_options:
              columns: 12
              rows: 1
          # 2026-09-23 (user: "jeg forventer instant reaktion … og stopper"):
          # ét tryk stopper ALT — det kørende event, auto-shuffle og loops — og
          # giver rummene tilbage til Auto-looket (samme vej som Festlys-tilens sluk).
          - type: button
            name: Stop festen
            icon: mdi:stop-circle
            show_state: false
            tap_action:
              action: perform-action
              perform_action: light.turn_off
              target:
                entity_id: light.festlys
            grid_options:
              columns: 12
              rows: 1
          # Rum-vælgeren (flyttet op under Stop 2026-10-28, user-spec). Tidligere
          # synlig note, nu kommentar: ændres rum under festen, sker det straks
          # (nyt rum danser, fravalgt rum → Auto). Døde pærer springes over —
          # 'Aktive pærer' tæller kun dem der svarer. Intet rum valgt → Festlys
          # sætter Stue til. Valget huskes over genstart. Open-plan er tre
          # selvstændige valg (Stue · Spisestue · Køkken, 2026-08-28) men deler
          # ÉT room_mode, så festen tager hele open-plan ud af Auto.
          - type: heading
            heading: 🛋️ Rum der danser
            heading_style: subtitle
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_boolean.dance_room_entre
                name: Entré (1 – ankomst-pæren)
              - entity: input_boolean.dance_room_stue
                name: Stue (læselampe + 2 spots)
              - entity: input_boolean.dance_room_spisestue
                name: Spisestue (1 — spiseloftet)
              - entity: input_boolean.dance_room_koekken
                name: Køkken (1 — lyskæden)
              - entity: input_boolean.dance_room_terrasse
                name: Terrasse (1)
              - entity: input_boolean.dance_room_boern
                name: Børneværelse (2)
              - entity: input_boolean.dance_room_bad
                name: Badeværelse (5 spots)
              - entity: input_boolean.dance_room_depot
                name: Depot (1)
          - type: tile
            entity: sensor.dance_active_bulbs
            name: Aktive pærer i alt
            icon: mdi:lightbulb-group
            grid_options:
              columns: 12

      # =====================================================================
      # Hastighed & rytme  (de nye kontroller)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: ⏱️ Hastighed & rytme
            heading_style: subtitle
          - type: tile
            entity: input_number.dance_speed
            name: Hastighed — farveskift uden event
            icon: mdi:speedometer
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.dance_event_frequency
            name: Event-hyppighed (auto-shuffle)
            icon: mdi:flash-auto
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.dance_manual_event_max_minutter
            name: Maks varighed — låst event
            icon: mdi:timer-sand
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # B260 (25/10): halloween sendte ~2 Matter-kommandoer/s og fældede
          # OTBR'en. Thread-pærerne skriver nu kun på deres plads i husets
          # fælles gitter (custom_templates/festlys.jinja); 8/min ≈ 0,27
          # kommandoer/s, trappe-testen var ren ved 0,5/s.
          - type: tile
            entity: input_number.festlys_thread_skrivninger
            name: Thread-pærer — skift pr. minut i alt
            icon: mdi:access-point-network
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # Kun fest startet fra børne-Styrbarens pile (packages/festlys_boern_styrbar.yaml).
          - type: tile
            entity: input_number.festlys_boern_tomt_minutter
            name: Børne-Styrbar fest — sluk efter tomt rum
            icon: mdi:teddy-bear
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.fest_ankomst_tempo
            name: Tempo — dør-fanfaren ved ankomst
            icon: mdi:rainbow
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # B261 (25/10): Thread-pærerne skriver kun på husets Thread-gitter.
          - type: markdown
            content: >
              Gælder ikke: entré, stue-spots, badets KAJPLATS.
          - type: markdown
            content: >
              **Hastighed** = hvor hurtigt hver pære skifter farve når der IKKE
              kører et event (det rolige baggrundsloop): **1** ≈ 8 s/skift (mood),
              **50** = baseline (~4-5 s), **100** ≈ 1 s/skift (hurtig disko).<br>
              **Event-hyppighed** = hvor tit auto-shuffle fyrer et special-event
              (strobe/police/chase…) ind imellem: **1** = næsten aldrig, **50** =
              baseline (30-150 s), **100** = hyppigt (15-75 s). Gælder kun
              auto-shuffle.<br>
              **Tempo** = hvor hurtigt regnbue-kaskaden kører når hoveddøren
              åbner under festen: **25** ≈ 205 ms mellem farveskift, **75** =
              default (~115 ms), **100** ≈ 70 ms. Gælder KUN dør-fanfaren, ikke
              baggrundsloopet (det er "Hastighed" ovenfor). Entré-pæren kører
              altid kortere skridt end resten af huset — den sidder på
              Matter/Thread og deler ikke sendetid med Zigbee-pærerne, så den
              kan nå flere toner på samme tid. Skruer du helt op, bliver husets
              gren ikke nødvendigvis hurtigere: HA leverer ~5-10 lys-kald/sek,
              og derover fejler det tavst.<br>
              **Maks varighed** = loft på et **låst** event (dem du vælger
              herunder eller med depot-kontaktens pile). Loopet havde før ingen
              anden udgang end et bevidst *off* — 2026-08-07 kørte cascade i
              depotet **31 min** efter ét tryk på væg-kontakten, uden at nogen
              var i rummet. Ved loftet slukkes eventet pænt (og depotet giver
              et lånt rum-valg tilbage). **240** = i praksis ingen grænse.
              Auto-shuffle er ikke berørt — den skifter selv event løbende.<br>
              **Thread-pærer** = entré-loftet, stue-spotsene og badets KAJPLATS
              må tilsammen skifte så mange gange pr. minut; i hurtige blink er de
              mørke. 0 = de er ikke med.

      # =====================================================================
      # Manuelt event-lås
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🎬 Lås ét event
            heading_style: subtitle
          - type: entities
            state_color: true
            entities:
              - entity: input_select.dance_manual_event
                name: Aktivt event (kører i loop til "off")
          # Ét tryk = låst (2026-09-23): dropdown'en krævede to tryk og en
          # rulning, og brugeren ville have "instant reaktion".
          - type: button
            name: strobe
            icon: mdi:flash
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: strobe
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: blackout
            icon: mdi:lightbulb-off
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: blackout
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: warm
            icon: mdi:fire-circle
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: warm
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: pulse
            icon: mdi:pulse
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: pulse
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: chase
            icon: mdi:looks
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: chase
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: jump
            icon: mdi:debug-step-over
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: jump
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: chase_comet
            icon: mdi:comet
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: chase_comet
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: split
            icon: mdi:circle-half-full
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: split
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: heartbeat
            icon: mdi:heart-pulse
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: heartbeat
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: police
            icon: mdi:police-badge
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: police
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: lightning
            icon: mdi:weather-lightning
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: lightning
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: breathe
            icon: mdi:weather-windy
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: breathe
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: sparkle
            icon: mdi:camera-iris
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: sparkle
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: cascade
            icon: mdi:stairs-down
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: cascade
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: fire
            icon: mdi:campfire
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: fire
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: halloween
            icon: mdi:halloween
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: halloween
            grid_options:
              columns: 4
              rows: 2
          # Frost (2026-10-26): ikke i auto-shufflen; startes også af
          # Frost-sangene (packages/festlys_frost.yaml).
          - type: button
            name: frost
            icon: mdi:snowflake
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: frost
            grid_options:
              columns: 4
              rows: 2
          - type: button
            name: slip event
            icon: mdi:close-circle-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.dance_manual_event
              data:
                option: "off"
            grid_options:
              columns: 12
              rows: 1
          - type: markdown
            content: >
              Tryk et event for at låse det — det kører uafbrudt til du trykker
              **slip event** (eller stopper festen). Tryk et andet for at skifte
              med det samme. Kørte auto-shuffle før, fortsætter den når eventet
              slippes; ellers slutter festen.<br><br>
              **strobe** hurtig white-flash · **blackout** mørkt · **warm** varm
              flood · **pulse** synk. farvepuls · **chase** rainbow-sweep ·
              **jump** enkelt-pære-hop · **chase_comet** komet · **split**
              komplementære halvdele · **heartbeat** rød puls · **police** rød/blå
              · **lightning** lynstorm · **breathe** rolig vejrtrækning ·
              **sparkle** kamera-flash · **cascade** fade-in én ad gangen ·
              **fire** bål (rød/orange glød med hvide gnister, hver pære
              flakker for sig) · **halloween** spøgelseslys med strømsvigt, et
              spøgelse i det sorte hus, så et blodrødt chok · **frost** hvid
              iskrystal-eksplosion, blå/hvide glimt og en frostbølge.

      # =====================================================================
      # Frost-sangene (packages/festlys_frost.yaml): Let It Go (Frozen) / Lad
      # det ske (Frost) på højttaleren → frost i open-plan; festlys tilbage som
      # før når sangen slutter. Kun familie-modes, ikke under godnat/sleepover.
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: ❄️ Frost-sangene
            heading_style: subtitle
            icon: mdi:snowflake
          - type: tile
            entity: input_boolean.festlys_frost
            name: Frost-sangene
            icon: mdi:snowflake
            features:
              - type: toggle
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.festlys_frost_sang
            name: Spiller nu
            icon: mdi:snowflake-variant
            grid_options:
              columns: 6
          - type: markdown
            content: >-
              Gælder: stue, spisestue, køkken — når Let It Go / Lad det ske
              spiller på højttaleren.

      # =====================================================================
      # Halloween-stemning (packages/halloween_stemning.yaml): Auto-lys der
      # glipper som en løs forbindelse + korte, svage lyde. Kun tændte ZHA-
      # pærer i Auto-rum, kun når solen er under grænsen (om dagen kun et grønt
      # flimmer mens nogen spiser/laver mad), kun familie-modes.
      # Festlys-lydstyrken hører til halloween-EVENTET (dance_mode.yaml).
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🎃 Halloween-stemning
            heading_style: subtitle
            icon: mdi:ghost
          - type: tile
            entity: input_boolean.halloween_stemning
            name: Halloween-stemning
            icon: mdi:ghost
            features:
              - type: toggle
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.halloween_stemning_aktiv
            name: Kører nu
            icon: mdi:weather-night
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.halloween_stemning_normal_pct
            name: Normalt lys
            icon: mdi:lightbulb-on-outline
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.halloween_stemning_udfald_minutter
            name: Minutter mellem udfald (0 = ingen)
            icon: mdi:flash-off
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 100 % = 24/10's tempo; kun blinkene, mørke-pauserne står fast.
          - type: tile
            entity: input_number.halloween_stemning_blink_tempo
            name: Blink-tempo
            icon: mdi:flash
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.halloween_stemning_sol_graense
            name: Kun når solen er under
            icon: mdi:weather-night
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 25/10: om dagen kun G-flimmeret (custom_templates/halloween.jinja),
          # gate binary_sensor.halloween_stemning_dag_gron (activity_state
          # cooking/dining/social_dining). Middel-pause; 30 min ≈ 8/dag (målt).
          - type: tile
            entity: input_number.halloween_stemning_dag_groen_minutter
            name: Grønt glimt om dagen — minutter imellem (0 = ingen)
            icon: mdi:flash-outline
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: >
              Kun stue og spisestue, mens I spiser eller laver mad. Nu:
              **{{ 'JA' if is_state('binary_sensor.halloween_stemning_dag_gron','on') else 'nej' }}**
          - type: tile
            entity: input_number.halloween_stemning_lyd_minutter
            name: Minutter mellem lyde (0 = ingen)
            icon: mdi:door-closed-lock
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.halloween_stemning_lyd_volumen
            name: Lydstyrke — stemning
            icon: mdi:volume-low
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.halloween_stemning_vind_volumen
            name: Lydstyrke — vind (0 = ingen)
            icon: mdi:weather-windy
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          # 26/10: vindstødet varer 50-100 % af dette (før 40 s-4 min = for længe).
          - type: tile
            entity: input_number.halloween_stemning_vind_sekunder
            name: Længste vindstød — sekunder
            icon: mdi:timer-sand
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.festlys_halloween_lyd_volumen
            name: Lydstyrke — halloween-event (0 = ingen)
            icon: mdi:volume-high
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: >
              Gælder ikke: entré, køkken, stue-spots, sofa-lamperne, badets spot 1-3, terrasse.

      # =====================================================================
      # Andre fest-relaterede mood-flags (info)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: 🎭 Andre stemnings-flags
            heading_style: subtitle
          - type: entities
            state_color: true
            entities:
              - entity: input_boolean.cinema_active
                name: Dark Mode / mørklægning (pauser presence)
              - entity: input_boolean.cirkus_active
                name: Cirkus mood (pauser presence)
          - type: markdown
            content: >
              **Dark Mode/Cirkus** pauser presence-lys (Auto rører ikke lysene) —
              nyttigt til projektor/leg uden diskoloop. (`cinema_active`-flaget
              er nu Dark Mode's interne suppression-flag; se Scener-siden.)
              **Legetøjsdag-diskoen** (1.
              åbne-fredag morgen) styres på **Indstillinger → Vejr-varsel**, da
              den hænger sammen med morgen-varsel-vinduet, ikke dance mode.

      # Dyrespil flyttet til bunden af siden 2026-10-28 (user-spec).
      # =====================================================================
      # Dyrespil (2026-10-25, B264 — packages/festlys_dyrespil.yaml)
      # =====================================================================
      # Hest/Flodhest = point: dyrelyd + "One point"/"N points" på højttaleren
      # (overruler al anden lyd) + 3 røde/blå blink i alle farvepærer uden for
      # Thread. −/+ retter lydløst. Nulstil spørger først, så et fejltryk ikke
      # sletter en stilling. Vinder = førerens dyr → fanfare → dyr (uafgjort:
      # begge dyr).
      - type: grid
        cards:
          - type: heading
            heading: 🐴 Dyrespil
            heading_style: title
            icon: mdi:horse-variant
          - type: tile
            entity: script.dyrespil_point
            name: Hest
            icon: mdi:horse-variant
            color: red
            vertical: true
            hide_state: true
            tap_action: &dyrespil_hest
              action: perform-action
              perform_action: script.dyrespil_point
              data:
                dyr: hest
            icon_tap_action: *dyrespil_hest
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: script.dyrespil_point
            name: Flodhest
            icon: mdi:paw
            color: blue
            vertical: true
            hide_state: true
            tap_action: &dyrespil_flodhest
              action: perform-action
              perform_action: script.dyrespil_point
              data:
                dyr: flodhest
            icon_tap_action: *dyrespil_flodhest
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: counter.dyrespil_hest
            name: Hest
            color: red
            features:
              - type: counter-actions
                actions: [decrement, increment]
            features_position: bottom
            grid_options:
              columns: 6
          - type: tile
            entity: counter.dyrespil_flodhest
            name: Flodhest
            color: blue
            features:
              - type: counter-actions
                actions: [decrement, increment]
            features_position: bottom
            grid_options:
              columns: 6
          - type: button
            name: Nulstil hest
            icon: mdi:restore
            show_state: false
            tap_action:
              action: perform-action
              perform_action: counter.reset
              target:
                entity_id: counter.dyrespil_hest
              confirmation:
                text: Nulstil hestens point?
            grid_options:
              columns: 6
              rows: 1
          - type: button
            name: Nulstil flodhest
            icon: mdi:restore
            show_state: false
            tap_action:
              action: perform-action
              perform_action: counter.reset
              target:
                entity_id: counter.dyrespil_flodhest
              confirmation:
                text: Nulstil flodhestens point?
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: script.dyrespil_vinder
            name: Vinder
            icon: mdi:trophy-variant
            color: amber
            hide_state: true
            tap_action: &dyrespil_vinder
              action: perform-action
              perform_action: script.dyrespil_vinder
            icon_tap_action: *dyrespil_vinder
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.dyrespil_volumen
            name: Lydstyrke
            icon: mdi:volume-high
            features:
              - type: numeric-input
            features_position: bottom
            grid_options:
              columns: 12
