# =============================================================================
# Forløb — "dagens forløb", let læseligt + live-opdaterende (2026-06-27)
# =============================================================================
# User-spec: "lav en side der opsummerer dagens forløb: hvorfor tændte ting,
# hvorfor gik gardiner op/ned, hvorfor forblev ting off trods bevægelse, osv,
# så jeg kan læse dagens forløb og hitte mening i det. let læseligt. live."
#
# Opbygning:
#   1. LIVE status + aktive blokeringer (markdown) — forklarer HVORFOR lys
#      forbliver OFF trods bevægelse lige NU (de gates der er aktive).
#   2. Logbøger pr. kategori (lys / gardiner / mode+flags) — HA's logbook-kort
#      er live og viser context ("tændt af automation X") = HVORFOR det skete.
# Logbook-kortene opdaterer selv; markdown-templates re-evalueres løbende.
# =============================================================================
title: Forløb
views:
  - title: Dagens forløb
    path: forloeb
    icon: mdi:timeline-text-outline
    cards:
      # ---------------------------------------------------------------------
      # 1) LIVE — status nu + hvorfor er ting evt. blokeret
      # ---------------------------------------------------------------------
      - type: markdown
        title: 📋 Status lige nu
        content: >-
          {% set house = states('input_select.house_state') %}
          {% set h = now().hour %}
          {% set mode = 'morgen' if 6 <= h < 9 else 'dag' if 9 <= h < 17 else 'aften' if 17 <= h < 22 else 'nat' %}
          {% set lux = states('sensor.open_plan_lux') %}

          ### 🏠 {{ house }} · 🌗 {{ mode }} · ☀️ open-plan lux: {{ lux }}

          {% set ns = namespace(b=[]) %}

          {% if is_state('binary_sensor.godnat_any_active','on') %}
            {% set ns.b = ns.b + ['🌙 **Godnat aktiv** — bevægelses-tænd er nat-gated (kun natlys/nattur lyser).'] %}
          {% endif %}

          {% if is_state('input_boolean.boernevaerelse_manual_off_lock','on') %}
            {% set ns.b = ns.b + ['🔒 **Børneværelse manuel-lås** — ALT auto-tænd i børneværelset blokeret (du slukkede selv mens nogen var i rummet). Ophæves af Styrbar OP / tomt rum / godnat / 05:45.'] %}
          {% endif %}

          {% if is_state('binary_sensor.luksus_lys_elpris_block','on') %}
            {% set ns.b = ns.b + ['💸 **El-pris-blok** — luksus-lys (terrasse-kæde, børne-strip) auto-tænder ikke nu (for dyrt). Manuel tænd virker altid.'] %}
          {% endif %}

          {% if not is_state('vacuum.s8_maxv_ultra','docked') %}
            {% set ns.b = ns.b + ['🤖 **Støvsuger kører** ('~states('vacuum.s8_maxv_ultra')~') — bevægelses-lys i visse rum gated (ægte bad-besøg vetoer dog gaten).'] %}
          {% endif %}

          {% if is_state('input_boolean.kids_home_manual_off','on') %}
            {% set ns.b = ns.b + ['🚫 **"Børn IKKE hjemme" override** — børne-auto-detection slået fra (rydder fredag 10:00).'] %}
          {% endif %}

          {% if is_state('binary_sensor.putning_vindue_aktivt','on') %}
            {% set ns.b = ns.b + ['😴 **Putte-vindue aktivt** — putte-fase ejer børnelys; vest-gardin kan lukkes mod aften-glare.'] %}
          {% endif %}

          {% for rm in ['stue','badevaerelse','boernevaerelse','sovevaerelse','spisestue','koekken'] %}
            {% if is_state('input_select.room_mode_'~rm,'Manual') %}
              {% set ns.b = ns.b + ['✋ **'~rm|capitalize~' i Manual** — presence rører ikke lyset (du har sat det selv).'] %}
            {% endif %}
          {% endfor %}

          {% if ns.b | length == 0 %}

          ✅ **Ingen aktive blokeringer** — lys følger normal presence-logik.

          {% else %}

          #### ⛔ Aktive blokeringer (hvorfor ting evt. forbliver slukket)

          {% for line in ns.b %}
          - {{ line }}
          {% endfor %}

          {% endif %}

      # ---------------------------------------------------------------------
      # 2) LYS — hvorfor tændte/slukkede (context = trigger)
      # ---------------------------------------------------------------------
      - type: logbook
        title: 💡 Lys — hvad tændte/slukkede og hvorfor
        hours_to_show: 24
        entities:
          - light.stue_sofa_lampe
          - light.stue_sofa_lampe_2
          - light.stue_hjoernelampe
          - light.stue_plug
          - light.stue_laesehygge
          - light.koekken_lyskaede
          - light.spisestue_loft
          - light.spisestue_pendel
          - light.boernevaerelse_loft
          - light.boernevaerelse_hygge_strip
          - light.boernevaerelse_hyggelys
          - light.badevaerelse_spot_1
          - light.badevaerelse_spot_2
          - light.badevaerelse_spot_3
          - light.depot_loft
          - light.depot_strip
          - light.entre_loft
          - light.terrasse_paerelyskaede

      # ---------------------------------------------------------------------
      # 3) GARDINER — hvorfor op/ned
      # ---------------------------------------------------------------------
      - type: logbook
        title: 🪟 Gardiner — hvorfor op/ned
        hours_to_show: 24
        entities:
          - cover.gardin_stue_syd
          - cover.gardin_stue_vest_1
          - cover.gardin_spisestue_vest

      # ---------------------------------------------------------------------
      # 4) TILSTAND & FLAGS — husets store skift gennem dagen
      # ---------------------------------------------------------------------
      - type: logbook
        title: 🚦 Tilstand & flags — dagens store skift
        hours_to_show: 24
        entities:
          - input_select.house_state
          - input_boolean.godnat_active
          - input_boolean.godnat_boern_active
          - binary_sensor.godnat_any_active
          - input_boolean.boernevaerelse_manual_off_lock
          - binary_sensor.putning_vindue_aktivt
          - input_select.badevaerelse_visit_stage
          - input_select.room_mode_badevaerelse
          - input_select.room_mode_boernevaerelse
          - input_select.room_mode_stue
          - input_select.room_mode_spisestue
          - input_select.room_mode_koekken
          - binary_sensor.luksus_lys_elpris_block

      # ---------------------------------------------------------------------
      # 5) BEVÆGELSE — hvor blev der set bevægelse (kontekst til "off trods bevægelse")
      # ---------------------------------------------------------------------
      - type: logbook
        title: 🚶 Bevægelse — Apollo/PIR aktivitet
        hours_to_show: 12
        entities:
          - binary_sensor.boernevaerelse_apollo_occupancy
          - binary_sensor.stue_apollo_occupancy
          - binary_sensor.spisestue_apollo_occupancy
          - binary_sensor.sovevaerelse_apollo_occupancy
          - binary_sensor.badevaerelse_inde_occupancy
          - binary_sensor.entre_valhorn_occupancy
