# =============================================================================
# Scener Dashboard v3 — mobile-first, ren og konsistent
# =============================================================================
# Redesign sprint 2026-05-22 PM efter user-feedback "inkonsistent + ikke
# lækkert". Tidligere version havde +/- knapper indlejret under 5 scener
# (visuelt rod) + markdown-beskrivelser kun på nogle scener.
#
# Ny arkitektur:
#   Section 1: AKTIV — aktuel scene + spread-controls (én plads, conditional)
#   Section 2: HVERDAG — 7 daily-life scener (kompakt grid, uniform tiles)
#   Section 3: SPECIELLE — 8 mood/fest scener (samme uniform layout)
#   Section 4: ACTIONS — godnat + godmorgen
#   Section 5: STATUS — info-tiles
#
# Spread-controls flyttet fra "under hver scene" → "én plads øverst, vises
# kun når active scene understøtter spread". Cleaner mental model: tap scene,
# juster spread oppe, se resultatet.
#
# Alle scene-tiles er nu UNIFORM — ingen markdown-beskrivelser, ingen
# inline +/- knapper. Color + icon kommunikerer mood.
# =============================================================================

title: Scener
icon: mdi:palette
views:
  - title: Scener
    path: scener
    icon: mdi:palette
    type: sections
    max_columns: 2
    sections:

      # ===================================================================
      # SECTION 1: Aktiv scene + spread-controls
      # ===================================================================
      # Stor "hvad er på lige nu"-tile + spread-stepper der kun vises hvis
      # active scene understøtter spread (zen/sofa_laesning/
      # spisestue_middag/madlavning).
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "Aktiv"
            heading_style: title
            icon: mdi:palette

          - type: tile
            entity: input_select.active_scene
            name: Aktuel scene
            icon: mdi:palette-swatch
            color: blue

          # Conditional spread controls — vises kun for spread-scener
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.active_scene
                state:
                  - zen
                  - sofa_laesning
                  - spisestue_middag
                  - madlavning
            card:
              type: vertical-stack
              cards:
                - type: tile
                  entity: input_number.scene_spread_level
                  name: Spread niveau
                  icon: mdi:circle-expand
                  color: blue
                  features:
                    - type: numeric-input
                      style: buttons
                - type: markdown
                  content: |
                    **Hvor langt scenen breder sig fra start-rummet** ("jordskælv-effekt"). Standard = 0.
                    **⬅️ 0 = kun start-rummet. ➡️ 3 = hele huset** (1 = naborum, 2 = naboers naboer).

      # ===================================================================
      # SECTION 2: Hverdag (7 daily scener)
      # ===================================================================
      # Ordnet efter "hvornår på dagen": morgen-aften flow.
      # Alle tiles er compact (default), ingen vertical:true, ingen
      # markdown — uniform visual rhythm.
      - type: grid
        cards:
          - type: heading
            heading: "Hverdag"
            heading_style: title
            icon: mdi:home-heart

          - type: tile
            entity: binary_sensor.scene_madlavning_active
            name: Madlavning
            icon: mdi:pot-steam
            color: light-blue
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: madlavning }

          - type: tile
            entity: binary_sensor.scene_spisestue_middag_active
            name: Spisestue Middag
            icon: mdi:silverware-fork-knife
            color: deep-orange
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: spisestue_middag }

          - type: tile
            entity: binary_sensor.scene_hverdagsaften_active
            name: Hverdagsaften
            icon: mdi:home-heart
            color: orange
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: hverdagsaften }

          - type: tile
            entity: binary_sensor.scene_zen_active
            name: Sofa Zen
            icon: mdi:meditation
            color: grey
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: zen }

          - type: tile
            entity: binary_sensor.scene_sofa_laesning_active
            name: Sofa Læsning
            icon: mdi:book-open-page-variant
            color: amber
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: sofa_laesning }

          - type: tile
            entity: binary_sensor.scene_winddown_active
            name: Winddown
            icon: mdi:moon-waning-crescent
            color: purple
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: winddown }

      # ===================================================================
      # SECTION 3: Specielle (8 mood/fest scener)
      # ===================================================================
      - type: grid
        cards:
          - type: heading
            heading: "Specielle"
            heading_style: title
            icon: mdi:party-popper

          - type: tile
            entity: binary_sensor.scene_full_bright_active
            name: Alt Fuld Lys
            icon: mdi:white-balance-sunny
            color: yellow
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: full_bright }

          - type: tile
            entity: binary_sensor.scene_private_active
            name: Sove Private
            icon: mdi:incognito
            color: deep-orange
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: private }

          - type: tile
            entity: binary_sensor.scene_cirkus_active
            name: Cirkus
            icon: mdi:tent
            color: red
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: cirkus }

          - type: tile
            entity: binary_sensor.scene_foedselsdag_active
            name: Fødselsdag
            icon: mdi:cake-variant
            color: red
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: foedselsdag }

          - type: tile
            entity: binary_sensor.scene_party_active
            name: Party
            icon: mdi:party-popper
            color: pink
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: party }

          - type: tile
            entity: binary_sensor.scene_happy_active
            name: Happy
            icon: mdi:emoticon-happy
            color: amber
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: happy }

          - type: tile
            entity: binary_sensor.scene_sunset_active
            name: Sunset
            icon: mdi:weather-sunset
            color: orange
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: sunset }

          - type: tile
            entity: binary_sensor.scene_blue_active
            name: Blue
            icon: mdi:waves
            color: blue
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: blue }

          - type: tile
            entity: binary_sensor.scene_cyberpunk_active
            name: Cyberpunk
            icon: mdi:robot
            color: pink
            tap_action:
              action: perform-action
              perform_action: script.scene_toggle
              data: { name: cyberpunk }

      # ===================================================================
      # SECTION 3.5: Overskriv (gem nuværende lys + gardiner som scene)
      # ===================================================================
      # Sæt lyset (og gardiner) manuelt som du vil have det → tryk Overskriv
      # på den scene du vil opdatere. Scenen husker derefter præcis det.
      # Bag kulissen: script.scene_overwrite → scene_snapshots/snap_<name>.yaml.
      # Slet snapshot-filen for at falde tilbage til default-scenen.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "Overskriv scene med nuværende lys"
            heading_style: title
            icon: mdi:content-save-edit

          - type: markdown
            content: >
              Sæt lyset + gardiner som du vil have det, og tryk på en scene
              herunder for at gemme den nuværende tilstand som *den* scene.

          - type: button
            name: Madlavning
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: madlavning
              confirmation:
                text: "Overskriv Madlavning med de aktuelle lys + gardiner?"

          - type: button
            name: Spisestue Middag
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: spisestue_middag
              confirmation:
                text: "Overskriv Spisestue Middag med de aktuelle lys + gardiner?"

          - type: button
            name: Hverdagsaften
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: hverdagsaften
              confirmation:
                text: "Overskriv Hverdagsaften med de aktuelle lys + gardiner?"

          - type: button
            name: Sofa Zen
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: zen
              confirmation:
                text: "Overskriv Sofa Zen med de aktuelle lys + gardiner?"

          - type: button
            name: Sofa Læsning
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: sofa_laesning
              confirmation:
                text: "Overskriv Sofa Læsning med de aktuelle lys + gardiner?"

          - type: button
            name: Winddown
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: winddown
              confirmation:
                text: "Overskriv Winddown med de aktuelle lys + gardiner?"

          - type: button
            name: Alt Fuld Lys
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: full_bright
              confirmation:
                text: "Overskriv Alt Fuld Lys med de aktuelle lys + gardiner?"

          - type: button
            name: Sove Private
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: private
              confirmation:
                text: "Overskriv Sove Private med de aktuelle lys + gardiner?"

          - type: button
            name: Cirkus
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: cirkus
              confirmation:
                text: "Overskriv Cirkus med de aktuelle lys + gardiner?"

          - type: button
            name: Party
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: party
              confirmation:
                text: "Overskriv Party med de aktuelle lys + gardiner?"

          - type: button
            name: Happy
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: happy
              confirmation:
                text: "Overskriv Happy med de aktuelle lys + gardiner?"

          - type: button
            name: Sunset
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: sunset
              confirmation:
                text: "Overskriv Sunset med de aktuelle lys + gardiner?"

          - type: button
            name: Blue
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: blue
              confirmation:
                text: "Overskriv Blue med de aktuelle lys + gardiner?"

          - type: button
            name: Cyberpunk
            icon: mdi:content-save-edit
            tap_action:
              action: perform-action
              perform_action: script.scene_overwrite
              data:
                name: cyberpunk
              confirmation:
                text: "Overskriv Cyberpunk med de aktuelle lys + gardiner?"

      # ===================================================================
      # SECTION 3.6: Sofa Zen automatik (2026-10-03, packages/sofa_zen_auto.yaml)
      # ===================================================================
      # Første auto-scene: tænder Sofa Zen (brugerens Overskriv-look, kun open-plan)
      # når der har siddet nogen stabilt i sofaen — kun om aftenen, når det er mørkt
      # udenfor. Hvorfor/hvordan: docs/sprint_log.md "Sprint 2026-10-03" og
      # packages/sofa_hygge_aktivitet.yaml. Status-teksten er husets egen forklaring
      # på "hvorfor tændte den ikke?" (sensor.sofa_zen_stop + _status).
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "Sofa Zen automatik"
            heading_style: title
            icon: mdi:meditation

          - type: tile
            entity: sensor.sofa_zen_status
            name: Status
            icon: mdi:meditation
            color: purple

          - type: tile
            entity: input_boolean.sofa_zen_auto_enabled
            name: Automatik
            icon: mdi:power
            tap_action:
              action: toggle

          - type: tile
            entity: input_datetime.sofa_zen_fra
            name: Tidligst kl.
            grid_options:
              columns: 12

          - type: tile
            entity: input_datetime.sofa_zen_til
            name: Senest kl.
            grid_options:
              columns: 12

          - type: tile
            entity: input_number.sofa_zen_sol_graense
            name: Mørkt når solen er under
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: input_number.sofa_zen_taend_efter_s
            name: Tænd efter
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: input_number.sofa_zen_slip_efter_s
            name: Slip efter
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: input_number.sofa_zen_fade_ind_s
            name: Fade ind over
            features:
              - type: numeric-input
                style: slider

          # 2026-10-03e (user-spec "eget kortere hold"): et tryk i stuen eller på
          # spisestue-loftet spærrer Zen så længe — ikke husets 3-t lys-hold, som
          # i replayet 19/9-3/10 lod Zen tænde 1 af 15 aftener.
          - type: tile
            entity: input_number.sofa_zen_manuel_hold_min
            name: Manuelt tryk spærrer i
            features:
              - type: numeric-input
                style: slider

          # Køkkenkæde + terrasse er med siden 2026-10-03e (user-spec). Kæden
          # lånes kun mens køkkenet ikke er i brug (sofa_zen_laaner_kaeden);
          # terrassen dæmpes til højst 20 % og tændes aldrig (flagermus-curfew).
          - type: markdown
            content: >-
              Gælder open-plan, køkkenkæden (kun mens køkkenet ikke er i brug)
              og terrassen (højst 20 %, tændes aldrig). Gælder ikke: depot,
              soveværelse, bad, børneværelse og gardiner. Slukket i AirBnB.

      # ===================================================================
      # SECTION 4: Daglige actions
      # ===================================================================
      # Godnat = smart toggle (tjekker godnat_active, kører godnat eller
      # godmorgen). God morgen separat tile for eksplicit morning routine.
      - type: grid
        cards:
          - type: heading
            heading: "Routine"
            heading_style: title
            icon: mdi:calendar-clock

          - type: tile
            entity: input_boolean.godnat_active
            name: Godnat
            icon: mdi:weather-night
            color: indigo
            tap_action:
              action: perform-action
              perform_action: script.godnat_toggle

          - type: tile
            entity: script.godmorgen
            name: God morgen
            icon: mdi:weather-sunset-up
            color: amber
            tap_action:
              action: perform-action
              perform_action: script.godmorgen

      # ===================================================================
      # SECTION 5: Status
      # ===================================================================
      - type: grid
        cards:
          - type: heading
            heading: "Status"
            heading_style: title
            icon: mdi:information-outline

          - type: tile
            entity: input_boolean.dark_mode
            name: Dark Mode (projektor)
            icon: mdi:projector
            color: purple
            tap_action:
              action: toggle

          - type: tile
            entity: input_boolean.dark_mode_kun_sove
            name: Kun soverum (knap- / sove- / børne-session)
            icon: mdi:bed-outline
            color: indigo

          - type: markdown
            content: >-
              Tændes Dark Mode **uden at projektoren kører** (RODRET/Somrig-tryk,
              telefon-widget, tilen ovenfor), gælder mørklægningen **kun
              soveværelset** — open plan røres ikke: køkken, spisestue, stue,
              terrasse og entré beholder deres presence-lys, og køkken-lyskæden
              dæmpes ikke. **Dobbelttryk op på Dark Mode-RODRET** tager alle tre
              rum og tænder biograf-suppressionen. Kører projektoren, gælder
              prioritets-stigen sove → børn → sofastue som før.

          - type: tile
            entity: input_datetime.dark_mode_godnat_cutover
            name: Dark Mode → godnat kl.
            icon: mdi:weather-night
            color: deep-purple

          - type: markdown
            content: >-
              Er Dark Mode stadig tændt på cutover-tiden (glemt godnat-tryk, faldet
              i søvn under filmen) → huset går automatisk til **godnat** og videre til
              godmorgen. Intet lys tænder ved overgangen. I **AirBnB** slippes kun
              mørklægningen (gæster påtvinges aldrig godnat).

          - type: tile
            entity: sensor.rum_med_nylig_presence
            name: Rum med meget nylig aktivitet
            icon: mdi:home-search
            color: purple

          - type: tile
            entity: input_number.dark_mode_meget_nylig_sekunder
            name: "\"Meget nylig\" = højst"
            icon: mdi:motion-sensor
            color: purple
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: input_number.dark_mode_dobbelttryk_sekunder
            name: Dobbelttryk-vindue
            icon: mdi:gesture-double-tap
            color: purple
            features:
              - type: numeric-input
                style: slider

          - type: markdown
            content: >-
              **Rum-scope (2026-08-02, udvidet 08-12):** Dark Mode **og
              pre-dark** rammer **ét rum** — samme prioritets-stige:
              **soveværelset** hvis der er meget nylig aktivitet derinde, ellers
              **børneværelset**, ellers **sofastuen**.
              "Meget nylig" = højst
              **{{ states('input_number.dark_mode_meget_nylig_sekunder')|int(90) }} s**
              siden radaren så nogen — slideren gælder BEGGE.
              Aldre lige nu: `{{ state_attr('sensor.rum_med_nylig_presence','aldre') }}`
              (sekunder siden presence, 0 = lige nu) → stigen vælger
              **{% set k = states('sensor.moerklaegning_scope_rum') %}{{
              'soveværelset' if k == 'sove' else ('børneværelset' if k == 'boern'
              else ('sofastuen' if k == 'stue' else 'intet rum')) }}**.


              Stigen (frem for "det friskeste rum") fordi to rum tit står på
              alder 0 samtidig — man går forbi sofaen på vej i seng. Sengen er
              det stærkeste signal, sofaen det svageste. Grænsen skal være kort:
              den skal bygge bro over radar-huller om en film-seer der ligger
              helt stille (målt 83-106 s), men ikke lade et forbipasserende
              glimt kapre valget. Skruer du op, vinder soveværelset oftere på
              gamle spor.


              **Tryk OP to gange** på Dark Mode-RODRET indenfor
              **{{ states('input_number.dark_mode_dobbelttryk_sekunder')|int(120) }} s**
              → **alle tre rum** mørklægges (og tidligere fritagelser
              annulleres). Det er også udvejen når stigen ikke fandt et rum:
              der skete ingenting → tryk op igen.


              **Sessionen er sticky:** de rum mørklægningen ejer står nedenfor og
              bliver der, selv om radaren taber en film-seer der ligger helt stille.
              Et rum der **får** meget nylig aktivitet undervejs kommer med (går
              nogen i seng midt i filmen), og du kan **fritage** et rum ved at
              trykke **op** på dets Styrbar/RODRET — så får rummet sin normale
              auto-lys-styring igen (gardinet bliver liggende). Ned på Dark
              Mode-RODRET slukker mørklægningen i alle rum og sætter dem tilbage
              til normal auto.


              En **død radar** tæller som presence, så et sensor-udfald ikke
              stille afmelder et rum. Køkken/spisestue/bad er aldrig i scope —
              de dæmpes i stedet af open-plan-suppressionen (cinema-flaget).

          - type: tile
            entity: input_text.dark_mode_rooms
            name: Mørklagte rum nu
            icon: mdi:theater
            color: purple

          - type: tile
            entity: input_text.dark_mode_exempt
            name: Fritagne rum (op-tryk)
            icon: mdi:lightbulb-on-outline
            color: amber

          - type: heading
            heading: "Pre-Dark Mode (projektor-dæmpning)"
            heading_style: title
            icon: mdi:television-ambient-light

          - type: tile
            entity: binary_sensor.projektor_aktiv
            name: Projektor tændt
            icon: mdi:projector
            color: amber

          - type: tile
            entity: input_boolean.predark_active
            name: Pre-Dark kører nu
            icon: mdi:television-play
            color: amber

          - type: tile
            entity: input_boolean.dark_mode_ved_projektor
            name: Dark Mode starter/stopper med projektoren
            icon: mdi:projector
            tap_action:
              action: toggle

          - type: tile
            entity: input_boolean.predark_enabled
            name: Pre-Dark aktiv (killswitch)
            icon: mdi:power
            tap_action:
              action: toggle

          - type: tile
            entity: input_number.predark_dim_pct
            name: Pre-Dark dæmp til
            icon: mdi:brightness-4
            color: amber
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: input_number.predark_off_delay_sekunder
            name: Pre-Dark sluk-forsinkelse
            icon: mdi:timer-sand
            color: amber
            features:
              - type: numeric-input
                style: slider

          - type: markdown
            content: >-
              Tændes **projektoren** (både cast OG afspilning fra en app på selve
              projektoren) → gardinerne kører ned og allerede tændte lamper dæmpes
              til procenten ovenfor — i **ét rum**, valgt af samme prioritets-stige
              som Dark Mode (sove → børn → sofastue; rettet 2026-08-12, før tog
              pre-dark alle presence-rum på én gang).
              **Slukkede lamper tændes aldrig** af pre-dark. Slukkes projektoren
              igen, gendannes lysniveauerne og gardinerne åbnes (kun i dagslys).
              Er blot én af lamperne slukket i mellemtiden (godnat, presence-sluk),
              springes lys-gendannelsen over — så pre-dark aldrig tænder lys bagefter.
              Tændes fuld **Dark Mode**, trækker pre-dark sig og lader Dark Mode
              overtage.

              **Detektion:** projektorens Cast-modul er kun på nettet når projektoren
              er tændt — derfor er "projektor tændt" signalet. Router-trafik blev
              afprøvet og forkastet: Sagemcom-routerens UPnP-tællere afspejler ikke
              reel WAN-trafik (100 MB download gav 0 udslag).

              **Sluk-forsinkelsen** er hvor længe projektoren skal have været væk
              fra nettet før gardinerne kører op igen. Minimum 40 s med vilje:
              Cast-forbindelsen kan blinke kortvarigt, og en for kort forsinkelse
              ville rive gardinerne op midt i en film. Ændringer virker med det
              samme (ingen reload).

          - type: heading
            heading: "Mood-flag (pauser presence-lys)"
            heading_style: title
            icon: mdi:drama-masks

          - type: tile
            entity: input_boolean.cinema_active
            name: Cinema mood
            icon: mdi:movie-open
            color: purple
            tap_action:
              action: toggle

          - type: tile
            entity: input_boolean.cirkus_active
