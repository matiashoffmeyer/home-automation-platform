# =============================================================================
# Forbrug Dashboard — lys-forbrug pr. pære + temp/fugt (2026-06-18, user-spec)
# =============================================================================
# Synlighed på forbrug: timer pr. pære pr. rum + hele huset, høj-forbrug-
# notifikationer (bug-detektion) + TIMMERFLOTTE temp/fugt + el-pris-historik.
#
# 2026-07-13 (user-spec): alle historik-grafer viser i UDGANGSPUNKTET den
# seneste UGE. input_number.statistik_periode (1=uge/2=måned/3=kvartal/4=år)
# styrer vinduet via `conditional`-kort og GRUPPERER lange perioder til uge-/
# måneds-søjler (forbrug = change-total) hhv. dag-/uge-gennemsnit (temp/fugt/
# pris = mean). Vanilla HA kan ikke binde days_to_show til en entity → derfor
# 4 conditional-varianter pr. graf. Se packages/statistik_periode.yaml.
#
# Metrik + sensorer: packages/lys_kpi.yaml. Grafer bygger FREMAD fra 2026-06-18
# (long-term statistics findes ikke bagud — kan ikke backfilles).
# =============================================================================
title: Statistik
icon: mdi:chart-box
views:
  - title: Statistik
    path: forbrug
    type: sections
    max_columns: 3
    sections:
      # =====================================================================
      # SECTION 1: Lys-forbrug pr. pære i dag
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "💡 Lys pr. pære — i dag"
            heading_style: title
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.hus_lys_per_paere_idag
            name: 🏠 Hele huset (gns. pr. pære)
            color: amber
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hus_lys_paeretimer_idag
            name: Σ pære-timer (energi-proxy)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.badevaerelse_lys_on_idag
            name: 🚿 Bad (5 spots)
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.stue_lys_on_idag
            name: 🛋️ Stue (5)
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.koekken_lys_on_idag
            name: 🍳 Køkken (2)
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.spisestue_lys_on_idag
            name: 🍽️ Spisestue (1)
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.sovevaerelse_lys_on_idag
            name: 🛏️ Sove (1)
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.boernevaerelse_lys_on_idag
            name: 🧸 Børn (2)
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.depot_lys_on_idag
            name: 📦 Depot (4)
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.entre_lys_on_idag
            name: 🚪 Entré (1)
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.terrasse_lys_on_idag
            name: 🌿 Terrasse (1)
            grid_options:
              columns: 4
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.lys_spoegelser
                above: 0
            card:
              type: tile
              entity: sensor.lys_spoegelser
              name: 👻 Lyser uden radio (tælles med)
              color: red
              grid_options:
                columns: 12
          - type: markdown
            content: >
              **Timer pr. pære i dag** = hvor længe rummets lys har lyst siden
              midnat (tæller både fuld og dim). En pære der **taber radioen mens
              den lyser** står `unavailable` i HA, men lyser fysisk videre — den
              tæller derfor med som tændt (👻-tile ovenfor, kun synlig når der er
              et) indtil den er tilbage på nettet. Undtagelse: er bad-strømmen
              afbrudt, er badets spots reelt mørke og tæller ikke. For rum hvis pærer følges ad (fx
              badets 5 spots) = timer pr. enkelt pære. **Hele huset** = pære-vægtet
              gennemsnit på tværs af alle 22 pærer. Krydser et rum **alarm-tærsklen**
              får du en push (bug-synlighed) — tærsklen justeres på **Indstillinger → ⚡ Energi**.
            grid_options:
              columns: 12

      # =====================================================================
      # SECTION 2: Historik — periode-slider (uge/måned/kvartal/år)
      # =====================================================================
      # 2026-07-13: default = seneste UGE; slideren styrer vinduet + grupperer
      # lange perioder (uge/måneds-søjler) via conditional-kort (vanilla HA kan
      # ikke binde days_to_show til en entity). Se packages/statistik_periode.yaml.
      - type: grid
        cards:
          - type: heading
            heading: "📊 Historik — vælg periode med slideren"
            heading_style: title
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.statistik_periode
            name: 🔭 Periode (1=uge · 2=måned · 3=kvartal · 4=år)
            features:
              - type: numeric-input
                style: buttons
            features_position: bottom
            grid_options:
              columns: 12
          - type: markdown
            content: >
              **Graferne viser i udgangspunktet den seneste uge.** Træk slideren
              for at se længere tilbage — lange perioder **grupperes** så du får
              overblik i stedet for hundredvis af dags-søjler: **1 Uge** = søjler
              pr. dag (7 d) · **2 Måned** = pr. dag (31 d) · **3 Kvartal** = pr.
              **uge** (92 d) · **4 År** = pr. **måned** (365 d). Forbrugs-søjler =
              periodens **total**; temp/fugt/pris = **gennemsnit**. Al historik
              bygger fremad (kan ikke backfilles).
            grid_options:
              columns: 12

          # --- Hele huset: Σ pære-timer (rent utility-meter, change-aggregeret) --
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                below: 1.5
            card:
              type: statistics-graph
              title: "Hele huset — Σ pære-timer pr. dag (seneste uge)"
              entities:
                - entity: sensor.hus_paeretimer_i_dag
                  name: Σ pære-timer
              period: day
              days_to_show: 7
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 1.5
                below: 2.5
            card:
              type: statistics-graph
              title: "Hele huset — Σ pære-timer pr. dag (seneste måned)"
              entities:
                - entity: sensor.hus_paeretimer_i_dag
                  name: Σ pære-timer
              period: day
              days_to_show: 31
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 2.5
                below: 3.5
            card:
              type: statistics-graph
              title: "Hele huset — Σ pære-timer pr. UGE (seneste kvartal)"
              entities:
                - entity: sensor.hus_paeretimer_i_dag
                  name: Σ pære-timer/uge
              period: week
              days_to_show: 92
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 3.5
            card:
              type: statistics-graph
              title: "Hele huset — Σ pære-timer pr. MÅNED (seneste år)"
              entities:
                - entity: sensor.hus_paeretimer_i_dag
                  name: Σ pære-timer/md
              period: month
              days_to_show: 365
              chart_type: bar
              stat_types:
                - change

          # --- Pr. rum sammenligning (anker på entity-listen = DRY) --------------
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                below: 1.5
            card:
              type: statistics-graph
              title: "Pr. rum — timer tændt pr. dag (seneste uge)"
              entities: &room_hours
                - entity: sensor.badevaerelse_lys_timer_dag
                  name: Bad
                - entity: sensor.stue_lys_timer_dag
                  name: Stue
                - entity: sensor.koekken_lys_timer_dag
                  name: Køkken
                - entity: sensor.spisestue_lys_timer_dag
                  name: Spisestue
                - entity: sensor.sovevaerelse_lys_timer_dag
                  name: Sove
                - entity: sensor.boernevaerelse_lys_timer_dag
                  name: Børn
                - entity: sensor.depot_lys_timer_dag
                  name: Depot
                - entity: sensor.entre_lys_timer_dag
                  name: Entré
                - entity: sensor.terrasse_lys_timer_dag
                  name: Terrasse
              period: day
              days_to_show: 7
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 1.5
                below: 2.5
            card:
              type: statistics-graph
              title: "Pr. rum — timer tændt pr. dag (seneste måned)"
              entities: *room_hours
              period: day
              days_to_show: 31
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 2.5
                below: 3.5
            card:
              type: statistics-graph
              title: "Pr. rum — timer tændt pr. UGE (seneste kvartal)"
              entities: *room_hours
              period: week
              days_to_show: 92
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 3.5
            card:
              type: statistics-graph
              title: "Pr. rum — timer tændt pr. MÅNED (seneste år)"
              entities: *room_hours
              period: month
              days_to_show: 365
              chart_type: bar
              stat_types:
                - change
          - type: markdown
            content: >
              **Hele huset** = summen af alle pærers tændt-timer (rene pære-timer
              fra utility-meteret). **Pr. rum** = hvert rums lys-tændt-timer. Korte
              perioder viser dags-total; **kvartal/år grupperes til uge-/måneds-
              total** så mønstre træder frem. (Hus-grafen bruger det rene
              utility-meter — ikke det vægtede pr.-pære-gennemsnit, som ikke kan
              summeres pålideligt.)
            grid_options:
              columns: 12

      # =====================================================================
      # SECTION 3: Hvad koster setuppet? (kr/dag — lys + NUC + dongles + batteri)
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: "💰 Hvad koster setuppet i dag?"
            heading_style: title
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.setup_kost_i_dag
            name: 🏠 SETUP I ALT i dag
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.lys_kost_faktisk_i_dag
            name: 💡 Heraf lys
            color: amber
            grid_options:
              columns: 3
          - type: tile
            entity: sensor.setup_overhead_i_dag
            name: 🖥️ NUC, sensorer, højttaler, batteri
            grid_options:
              columns: 3
          - type: tile
            entity: sensor.elpris_allin_aktuel
            name: ⚡ All-in pris lige nu (dynamisk)
            color: blue
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.lys_estimat_effekt
            name: 🔌 Lys-effekt lige nu
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.lys_estimat_energi_i_dag
            name: 🔋 Lys-energi i dag
            grid_options:
              columns: 4
          # 2026-09-10 (user-spec): spøgelses-andelen skal kunne AFLÆSES, ikke
          # kun være gemt inde i totalen. Effekt-tilen står altid (også på 0 W,
          # så "der er ingen spøgelser lige nu" er et svar og ikke et tomt sted).
          - type: tile
            entity: sensor.lys_estimat_effekt_spoegelser
            name: 👻 Heraf uden radio (effekt)
            color: red
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.lys_spoegelser_energi_i_dag
            name: 👻 Heraf uden radio (kWh i dag)
            color: red
            grid_options:
              columns: 6
          # Setup-omkostning (to søjler: lys vs overhead) — periode-styret
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                below: 1.5
            card:
              type: statistics-graph
              title: "Setup-omkostning pr. dag (kr) — 💡 lys vs 🖥️ overhead (uge)"
              entities: &setup_cost
                - entity: sensor.lys_kost_faktisk_i_dag
                  name: 💡 Lys
                - entity: sensor.setup_overhead_kost_i_dag
                  name: 🖥️ NUC, sensorer, højttaler, batteri
              period: day
              days_to_show: 7
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 1.5
                below: 2.5
            card:
              type: statistics-graph
              title: "Setup-omkostning pr. dag (kr) — 💡 lys vs 🖥️ overhead (måned)"
              entities: *setup_cost
              period: day
              days_to_show: 31
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 2.5
                below: 3.5
            card:
              type: statistics-graph
              title: "Setup-omkostning pr. UGE (kr) — 💡 lys vs 🖥️ overhead (kvartal)"
              entities: *setup_cost
              period: week
              days_to_show: 92
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 3.5
            card:
              type: statistics-graph
              title: "Setup-omkostning pr. MÅNED (kr) — 💡 lys vs 🖥️ overhead (år)"
              entities: *setup_cost
              period: month
              days_to_show: 365
              chart_type: bar
              stat_types:
                - change

          # Lys-energi (kWh) — periode-styret
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                below: 1.5
            card:
              type: statistics-graph
              title: "Lys-energi pr. dag (kWh) — seneste uge"
              entities:
                - entity: sensor.lys_estimat_energi_i_dag
                  name: kWh
                - entity: sensor.lys_spoegelser_energi_i_dag
                  name: 👻 heraf uden radio
              period: day
              days_to_show: 7
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 1.5
                below: 2.5
            card:
              type: statistics-graph
              title: "Lys-energi pr. dag (kWh) — seneste måned"
              entities:
                - entity: sensor.lys_estimat_energi_i_dag
                  name: kWh
                - entity: sensor.lys_spoegelser_energi_i_dag
                  name: 👻 heraf uden radio
              period: day
              days_to_show: 31
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 2.5
                below: 3.5
            card:
              type: statistics-graph
              title: "Lys-energi pr. UGE (kWh) — seneste kvartal"
              entities:
                - entity: sensor.lys_estimat_energi_i_dag
                  name: kWh/uge
                - entity: sensor.lys_spoegelser_energi_i_dag
                  name: 👻 heraf uden radio
              period: week
              days_to_show: 92
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 3.5
            card:
              type: statistics-graph
              title: "Lys-energi pr. MÅNED (kWh) — seneste år"
              entities:
                - entity: sensor.lys_estimat_energi_i_dag
                  name: kWh/md
                - entity: sensor.lys_spoegelser_energi_i_dag
                  name: 👻 heraf uden radio
              period: month
              days_to_show: 365
              chart_type: bar
              stat_types:
                - change
          - type: markdown
            content: >
              **🏠 Setup i alt** = hvad hele smart-home-setuppet koster dig den dag:
              lyset (pris-vægtet, se nedenfor) **+ NUC + de 3 dongles (Thread/
              Bluetooth/Zigbee) + de 5 Apollo-sensorer (0,5 W stykket) + kameraet +
              højttaleren + batteri-slid** amortiseret. Det er tallet du kan sige til Parent B.

              **💡 Lys** er nu *pris-vægtet*: pærens effekt (max-watt × dæmpning)
              ganges med den **all-in pris time-for-time** og integreres — så energi
              brugt i en dyr time koster mere = din rigtige regning, ikke energi ×
              fladt gennemsnit. **⚡ All-in pris** = spot (elpris-integrationen) +
              nettarif + elafgift + leverandør, alt × moms — **dynamisk, ingen manuel
              elpris-slider mere**. (Spotten kan reelt være 0 eller negativ midt på
              dagen når sol gør strømmen gratis — så betaler du stadig tarif+afgift+
              moms; et ægte 0/negativt tal flyder igennem, fallback bruges KUN hvis
              feedet er unavailable.) To lys **måles** i stedet for at estimeres —
              sofa-hyggelampen (`sensor.stue_plug_power`) og sove-lyskæden
              (`sensor.sove_lyskaede_power`, fallback 2,5 W) — resten (inkl.
              stue-spots) er stadig max-watt × dæmpning. Ret antagelserne
              nederst efter din regning. Søjlerne **bygger fremad fra 21-06-2026**.
              Setup-grafen viser to søjler pr. dag side om side — 💡 lys og
              🖥️ NUC, sensorer, højttaler, batteri (summen = setup i alt).
              Overhead-andelen har egne statistics der **starter fra 05-07-2026**
              → dags-søjler før den dato viser kun lys-delen.

              **👻 Heraf uden radio** er den del af lys-forbruget der kommer fra
              pærer der har tabt radioen **mens de lyste**: HA siger `unavailable`
              (= 0 W), men de lyser fysisk videre. Den søjle er en **delmængde** af
              lys-søjlen ved siden af — ikke noget der skal lægges til. Fordi
              brightness ikke kan aflæses på en død pære, regnes de med **fuld
              effekt** = et bevidst over-estimat. Er søjlen stor flere dage i træk,
              er det ikke et pris-problem men et **radio-problem**. Spøgelses-
              serien **bygger fremad fra 10-09-2026**.
            grid_options:
              columns: 12

      # =====================================================================
      # SECTION 3B: Sparet på el — lys-dæmpning + cykel-lader + luksus-blok
      # (2026-06-19, udvidet 2026-07-29e med cykel-laderen: user-spec "det skal
      # tælle med i opgørelsen … og oversættes i kr grafen med en anden bar
      # farve og en total farve"; udvidet 2026-07-30 med luksus-blokken +
      # all-time-tilen: "en All Time Total Sparet på smart el forbrug (lader og
      # dæmpning og luksus-block)").
      # =====================================================================
      # NB om farverne: statistics-graph i denne frontend-version (20260325.5)
      # understøtter IKKE `color:` pr. entity, og BAR-serier stakkes ikke —
      # de tegnes side om side med hver sin farve fra tema-paletten (verificeret
      # i frontend-kilden, statistics-chart.ts: getGraphColorByIndex pr. serie).
      # Derfor giver de fire serier præcis dét user bad om: lys, cykel-lader og
      # luksus-blok i hver sin farve, og totalen i sin egen.
      - type: grid
        cards:
          - type: heading
            heading: "💸 Sparet på el — dæmpning + cykel-lader + luksus-blok"
            heading_style: title
            grid_options:
              columns: 12
          # 2026-07-30 (user-spec): "All Time Total Sparet på smart el forbrug
          # (lader og dæmpning og luksus-block)". Tallet er akkumuleret siden
          # hver kildes Riemann-integration blev født og nulstilles aldrig —
          # tryk på tilen for at se de tre andele som attributter.
          - type: tile
            entity: sensor.el_besparelse_total
            name: 🏆 SPARET I ALT — all time
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.el_besparelse_i_dag
            name: 🐷 Sparet i dag
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.lys_besparelse_i_dag
            name: 💡 Heraf lys-dæmpning
            color: amber
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.cykel_lader_besparelse_i_dag
            name: 🔋 Heraf cykel-lader
            color: blue
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.luksus_besparelse_i_dag
            name: ✨ Heraf luksus-blok
            color: purple
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.robot_lade_besparelse_i_dag
            name: 🤖 Heraf robot-lader
            color: cyan
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.robot_lade_bedste_vindue
            name: 🤖 Robottens ladevindue i dag
            icon: mdi:cash-clock
            color: cyan
            grid_options:
              columns: 8
          - type: tile
            entity: sensor.elpris_spot_aktuel
            name: ⚡ Spot lige nu
            color: amber
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.elpris_dim_factor
            name: 🔅 Dæmpnings-faktor (1 = intet)
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.cykel_lader_baseline_pris
            name: "⚖️ Cykel: spidslast-pris (baseline)"
            grid_options:
              columns: 4
          # 2026-07-13: graferne bruger lys_besparelse_TOTAL (monoton akkumuleret,
          # change pr. dag = dagens besparelse). lys_besparelse_i_dag (tile ovenfor)
          # nulstiller ved midnat med state_class total → midnats-faldet blev talt
          # som NEGATIVT delta i næste dags change-søjle (verificeret i statistics-
          # DB: søjlen viste "i dag minus i går", kunne blive negativ). Kun tilen
          # viser dags-sensoren live.
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                below: 1.5
            card:
              type: statistics-graph
              title: "Sparet på el (kr) — pr. dag, seneste uge"
              entities: &besparelse_serier
                - entity: sensor.lys_besparelse_total
                  name: 💡 Lys-dæmpning
                - entity: sensor.cykel_lader_besparelse_total
                  name: 🔋 Cykel-lader
                - entity: sensor.luksus_besparelse_total
                  name: ✨ Luksus-blok
                - entity: sensor.robot_lade_besparelse_total
                  name: 🤖 Robot-lader
                - entity: sensor.el_besparelse_total
                  name: 💰 I alt
