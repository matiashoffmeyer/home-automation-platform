              days_to_show: 7
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 1.5
                below: 2.5
            card:
              type: statistics-graph
              title: "Sparet på el (kr) — pr. dag, seneste måned"
              entities: *besparelse_serier
              period: day
              days_to_show: 31
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 2.5
                below: 3.5
            card:
              type: statistics-graph
              title: "Sparet på el (kr) — pr. UGE, seneste kvartal"
              entities: *besparelse_serier
              period: week
              days_to_show: 92
              chart_type: bar
              stat_types:
                - change
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.statistik_periode
                above: 3.5
            card:
              type: statistics-graph
              title: "Sparet på el (kr) — pr. MÅNED, seneste år"
              entities: *besparelse_serier
              period: month
              days_to_show: 365
              chart_type: bar
              stat_types:
                - change
          - type: markdown
            content: >
              **Fem kilder til besparelse, hver sin søjlefarve + en total-søjle:**


              💡 **Lys-dæmpning** — kr sparet fordi pris-dæmpningen skruede ned i de
              dyre timer (en dyr time vægter mest). Står påvirknings-slideren
              (Indstillinger → ⚡ Energi) på 0 — eller mangler spot-priser — er den 0
              (flad graf), og lyset dæmpes ikke. Bygger fremad fra **21-06-2026**.


              🔋 **Cykel-lader** — kr sparet fordi laderen kun kører i de billigste
              timer. Sammenligningen er mod **gennemsnitsprisen i spidslast-timerne
              17-21** (tilen ⚖️ ovenfor): "hvad havde det kostet med en dum lader, der
              bare kører fra du sætter batteriet til når du kommer hjem?" Søjlen **kan
              blive negativ** hvis laderen undtagelsesvis kørte dyrere end det (fx en
              manuel tænd midt i spidslasten) — det er ærligt regnskab, ikke en fejl.
              Bygger fremad fra **29-07-2026**.


              ✨ **Luksus-blok** — kr sparet fordi rene ambiance-lys **slet ikke tændte**
              mens strømmen var dyr (terrasse-pærelyskædens dusk-tænd + børne-natlyset).
              Der tælles kun i de minutter lyset **ville** have været tændt — altså når
              alle dets normale tænd-betingelser er opfyldt og blokken er den eneste
              grund til at det er slukket. Tænder du manuelt, tælles intet. Posten er
              lille om sommeren (dusk falder sent) og vokser hen mod vinteren, hvor
              mørket kommer kl. 16. Bygger fremad fra **30-07-2026**.


              🤖 **Robot-lader** — kr sparet fordi robotstøvsugeren venter med at lade
              til dagens billigste timer i stedet for at lade i det sekund den dokker.
              Sammenligningen er mod **prisen da robotten kørte op i dokken**: "hvad
              havde en dok uden udskydelse kostet?" Søjlen **kan blive negativ**, og det
              er hele pointen — den viser om ladevinduet peger på timer der faktisk er
              billige. Tallet er lille uanset hvad: hele robottens ladning er kun ~10
              kWh/år, altså ~17 kr strøm om året. Energien er **estimeret** (25 W ×
              ladetid), for der er ingen effektmåler på dokken. Moppetørringen tælles
              ikke med — den bruger meget mere, men starter ved dokning og kan ikke
              flyttes. Bygger fremad fra **22-08-2026**.


              Vinduet vælges automatisk hver eftermiddag ud fra morgendagens spotpriser
              (tilen **🤖 Robottens ladevindue i dag** ovenfor viser hvilke timer der er
              valgt). Indtil 22-08-2026 stod robotten på et fast 00-06-vindue fra dengang
              natstrøm var billig — med solceller i nettet er det nu midt på dagen der er
              billigst om sommeren, og natten igen om vinteren. Slå det fra under
              Indstillinger → ⚡ Energi, så falder robotten tilbage til 00-06.


              💰 **I alt** = de fire lagt sammen. Korte perioder = pr. dag; kvartal/år =
              uge-/måneds-total. Tilen **🏆 SPARET I ALT — all time** øverst er summen
              siden hver kilde blev født; den nulstilles aldrig (tryk på den for at se
              de tre andele).
            grid_options:
              columns: 12

