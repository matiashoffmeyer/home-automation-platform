          - type: markdown
            content: >
              **Sådan regnes kronerne:** hvert sekund pluggen er tændt ganges den
              målte effekt med **all-in-prisen i den time** (spot + tarif + afgift +
              moms) → *"Kostede"*. Samme effekt ganges med **gennemsnitsprisen i
              spidslast-timerne 17-21** → *"Havde kostet"*, altså hvad en dum lader
              uden ur ville have betalt for præcis samme kWh: den kører fra det
              øjeblik batteriet sættes til, når du kommer hjem med cyklen — og det
              er samtidig både dyreste spot og dyreste nettarif på døgnet.
              Forskellen er **"Sparet"**, og den indgår i totalen i 💸-sektionen
              øverst på siden.


              Baseline-prisen stemples hvert 15. minut mens Nord Pool stadig viser
              aftenens timer — ved midnat ruller de ud af prisfeedet, netop mens den
              planlagte ladning kører. Spandet kan flyttes med **⚖️ Baseline
              (dum lader) fra/til** under 🔋 Cykel-lader på Indstillinger. Er der
              ingen billige timer at vælge imellem (dyr strøm hele natten), lader
              systemet alligevel — så bliver besparelsen bare lille eller negativ.
              **Bygger fremad fra 29-07-2026.**
            grid_options:
              columns: 12

          - type: heading
            heading: "⚙️ Slid-rapport & lås"
            heading_style: subtitle
            grid_options:
              columns: 12
          - type: tile
            entity: input_datetime.cykel_lader_rapport_tid
            name: ⏰ Dagligt slid-overblik sendes kl.
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.cykel_lader_probe_stop
            name: 🔒 Probe-lås aktiv (top-off opdaget)
            grid_options:
              columns: 6
          - type: markdown
            content: >
              **SLID = strøm der er gået ind i et batteri som allerede var fuldt.**
              Systemet tænder pluggen kortvarigt ("probe") for at se om der er sat
              et nyt batteri til — men et fuldt batteri trækker typisk lidt strøm
              i de første sekunder (99 → 100 igen). Det er dét, der måles her.
              Slid opstår to steder: (1) proben finder "last", men ladningen holder
              op inden for **probe-stop-minutter** → top-off; (2) laderen slår til
              og fra igen INDEN proben måler → proben melder "intet batteri",
              men der gik strøm ind. **Begge tælles.**


              **Ladet i alt** kommer fra pluggens egen kWh-tæller; **slid** måles
              med en Riemann-sum på effekten (pluggens tæller rapporterer kun hvert
              ~15. minut i tomgang og ville vise 0 for en 2-minutters probe).
              Døgn-tallene nulstilles kl.
              {{ states('input_datetime.cykel_lader_rapport_tid')[:5] }}, hvor der
              **kun sendes en push hvis der var slid** — ingen besked = intet
              slid. Graferne bygger videre på de monotone totaler. **Slår
              probe-låsen til**, er der ikke flere probes før deadline den nat.
              Skru på probe-frekvensen under 🔋 Cykel-lader på Indstillinger.
            grid_options:
              columns: 12
