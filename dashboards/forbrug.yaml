              **Brug den NEDERSTE graf til at svare på "er huset på niveau med
              udendørs".** Den øverste er relativ fugt (%), og RH afhænger af
              temperaturen — den kan ikke sammenligne to rum med forskellig varme.
              Målt 30/8: ude 17,7 °C/100 % og inde 24,6 °C/64 % ser ud som 36 points
              forskel, men er 15,1 mod 14,4 g/m³ = praktisk talt samme vandmængde.
              Om vinteren vender fortegnet helt: ude 0 °C/90 % = 4,4 g/m³ mod inde
              21 °C/45 % = 8,2 g/m³, altså **dobbelt så meget vand indendørs** mens
              RH-linjen påstår det modsatte.


              **g/m³ er gram vand pr. kubikmeter luft** og er temperatur-uafhængig.
              Ligger den røde (inde) VARIGT over den blå (ude), producerer huset selv
              fugt — bad, tørretumbler, madlavning, mennesker — og så er det værd at
              lufte ud. Ligger de oven i hinanden, følger huset bare vejret.
              TIMMERFLOTTE er husets autoritative kilde (Apollo rum-temp er upålidelig
              pga. ESP-selvopvarmning); ude er MÅLT på DMI's station 06180, 5,5 km væk,
              hvert 10. minut — ikke en prognose. Begge grafer bygger rullende fremad;
              der er ingen bagud-data før deploy.
