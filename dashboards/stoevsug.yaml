# =============================================================================
# Støvsug — kontrolpanel for robotstøvsugeren (2026-08-22; genskabt 2026-09-30)
# =============================================================================
# User-spec 2026-08-22: "byg så siden Støvsug i HA med de scripts vi allerede
# har lavet til mine widgets (hurtig som kun er vacuum og grundig som er med
# gulvvask). med tydelige forklaringer om rum og grundighed, brugervenligt, med
# gode ikoner".
# 2026-09-30 (user): "indstillingerne skal være på indstillinger siden men
# kontrolpanelet skal igen ha sin egen side ... simple kontrol paneler, i stil
# med lys siden." → HER bor kun det man trykker på og ser status på. ALLE
# indstillinger (kø-timing, auto-rengøring, morgen-udskyd, fjernbetjeningen,
# robottens egne) er fanen 🧹 Støvsug i dashboards/settings.yaml — badget i
# første overskrift linker derhen. Samme designregler som dashboards/lights.yaml:
# ingen forklarings-markdown (forklaringer = kommentarer), overskrifter uden
# emoji med `icon:`, max_columns 2.
#
# Siden er en FLADE, ikke en motor: hver knap kalder ét af de 16 rum-scripts i
# packages/roborock_rum_scripts.yaml — nøjagtig de samme entities som ligger i
# companion-app'ens widgets, så en ændring i køen eller profilerne slår igennem
# begge steder på én gang (fejlklasse #2). Der er BEVIDST ingen logik herinde.
#
# Hvad "hurtig" og "grundig" gør er læst ud af koden (roborock_rum_koe_kick):
# hurtig = mop off + fan_speed max_plus, ét gennemløb · grundig = mop_mode
# standard + mop_intensity extreme + fan_speed max, TO gennemløb.
#
# Rum-navnene er husets danske; Roborock-app'en viser sine egne engelske
# defaults. Oversættelsen findes ÉT sted — attributterne `rum` og `navne` på
# sensor.roborock_rum_kort — og markdown-kortene læser DEN. Skriv aldrig et
# segment-nummer eller en rum-oversættelse direkte ind i dette dashboard.
#
# Lovelace mode: yaml — registreret i configuration.yaml (stoevsug-dash).
# =============================================================================
title: Støvsug
icon: mdi:robot-vacuum
views:
  - title: Rengør
    path: rengor
    icon: mdi:broom
    type: sections
    max_columns: 2
    sections:
      # =====================================================================
      # RENGØR ET RUM — det man kommer for
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Støvsug et rum
            icon: mdi:gesture-tap
            heading_style: title
            badges:
              - type: button
                text: Indstillinger
                icon: mdi:cog
                tap_action:
                  action: navigate
                  navigation_path: /indstillinger-dash/stoevsug
          # Robotten kører derud, gør rent og vender selv tilbage til dokken.
          # Er huset tomt, slår den selv forsigtig-kørsel til og undviger ting
          # på gulvet i stedet for at skubbe dem rundt — uanset om det er
          # rum-knap, hel-hus-knap eller fjernbetjening der startede den.
          - type: markdown
            content: Tryk på et rum — flere tryk lige efter hinanden lægger sig i kø.

      # =====================================================================
      # HURTIG — kun støvsug
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Hurtig — kun støvsug
            icon: mdi:broom
            heading_style: title
          # (Var synlig tekst til 2026-09-30:) Fuld sugestyrke · moppen slået
          # fra · ét gennemløb.
          - type: button
            name: Stue
            icon: mdi:sofa-outline
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_hurtig_stue
            grid_options:
              columns: 4
          - type: button
            name: Spisestue
            icon: mdi:table-furniture
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_hurtig_spisestue
            grid_options:
              columns: 4
          - type: button
            name: Køkken
            icon: mdi:countertop-outline
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_hurtig_koekken
            grid_options:
              columns: 4
          - type: button
            name: Entré
            icon: mdi:door-open
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_hurtig_entre
            grid_options:
              columns: 4
          - type: button
            name: Soveværelse
            icon: mdi:bed-outline
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_hurtig_sovevaerelse
            grid_options:
              columns: 4
          - type: button
            name: Børneværelse
            icon: mdi:teddy-bear
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_hurtig_boernevaerelse
            grid_options:
              columns: 4
          - type: button
            name: Badeværelse
            icon: mdi:shower
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_hurtig_badevaerelse
            grid_options:
              columns: 4
          - type: button
            name: Depot
            icon: mdi:package-variant-closed
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_hurtig_depot
            grid_options:
              columns: 4

      # =====================================================================
      # GRUNDIG — støvsug + gulvvask
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Grundig — støvsug + gulvvask
            icon: mdi:water
            heading_style: title
          # (Var synlig tekst til 2026-09-30:) Fuld sugestyrke · kraftigste
          # vandmængde · to gennemløb. Kræver moppekluden på og tager cirka
          # dobbelt så lang tid som hurtig.
          - type: button
            name: Stue
            icon: mdi:sofa
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_grundig_stue
            grid_options:
              columns: 4
          - type: button
            name: Spisestue
            icon: mdi:table-chair
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_grundig_spisestue
            grid_options:
              columns: 4
          - type: button
            name: Køkken
            icon: mdi:countertop
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_grundig_koekken
            grid_options:
              columns: 4
          - type: button
            name: Entré
            icon: mdi:door
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_grundig_entre
            grid_options:
              columns: 4
          - type: button
            name: Soveværelse
            icon: mdi:bed
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_grundig_sovevaerelse
            grid_options:
              columns: 4
          - type: button
            name: Børneværelse
            icon: mdi:toy-brick
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_grundig_boernevaerelse
            grid_options:
              columns: 4
          - type: button
            name: Badeværelse
            icon: mdi:shower-head
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_grundig_badevaerelse
            grid_options:
              columns: 4
          - type: button
            name: Depot
            icon: mdi:package-variant
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_grundig_depot
            grid_options:
              columns: 4
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.s8_maxv_ultra_mop_attached
                state: "off"
            card:
              type: markdown
              content: >
                🚨 **Moppekluden sidder ikke på.** Trykker du grundig nu, bliver
                gulvet støvsuget — ikke vasket.

      # =====================================================================
      # KØEN
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Køen
            icon: mdi:format-list-numbered
            heading_style: title
          - type: markdown
            content: >-
              {% set n = states('sensor.roborock_rum_koe') | int(0) %}{% set nu
              = state_attr('sensor.roborock_rum_koe', 'koerer') %}{% if nu
              %}▶️ **Kører nu:** {{ nu }}{% if n > 0 %}<br>{% endif %}{% endif
              %}{% if n > 0 %}⏳ **Venter ({{ n }}):** {{
              state_attr('sensor.roborock_rum_koe', 'tekst') }}{% elif not nu
              %}Ingen opgaver i kø — robotten har fri.{% endif %}
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.roborock_rum_koe
                above: 0
            card:
              type: button
              name: Ryd køen
              icon: mdi:playlist-remove
              icon_height: 32px
              show_state: false
              tap_action:
                action: perform-action
                perform_action: script.roborock_rum_koe_ryd
              grid_options:
                columns: 12
          # Robotten kan kun lave én ting ad gangen — tryk der lander mens den
          # kører, gemmes og startes når den er tilbage i dokken. Blander man
          # hurtig og grundig, brydes turen der hvor grundigheden skifter.
          # Samme rum trykket to gange med samme grundighed: andet tryk
          # ignoreres. En kø må ikke kunne overleve natten og starte en
          # gulvvask kl. 3.
          # (Var synlig tekst til 2026-09-30:) Rum med samme grundighed kører
          # i én tur. En kø der aldrig kan afvikles (offline, fejl, tom
          # vandtank) rydder sig selv og siger til.

      # =====================================================================
      # ROBOTTEN LIGE NU
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Robotten lige nu
            icon: mdi:robot-vacuum
            heading_style: title
          - type: markdown
            content: >-
              {% set st = states('sensor.s8_maxv_ultra_status') %}{% set m =
              state_attr('sensor.roborock_rum_kort', 'navne') | default({}, true)
              %}{% set r = states('sensor.s8_maxv_ultra_current_room') %}**{{
              {'charging': '🔌 Lader i dokken', 'drying': '💨 Tørrer moppen',
              'cleaning': '🧹 Gør rent', 'segment cleaning': '🧹 Gør et rum
              rent', 'returning home': '🏠 På vej til dokken', 'washing the mop':
              '🧽 Vasker moppen', 'idle': '💤 Venter', 'paused': '⏸️ På pause',
              'charger disconnected': '⚠️ Står ikke i dokken'}.get(st, st)
              }}**{% if is_state('binary_sensor.s8_maxv_ultra_cleaning', 'on')
              %} — er i **{{ m.get(r, r) }}**{% endif %}{% if
              states('sensor.s8_maxv_ultra_vacuum_error') not in ['none', 'ok',
              'unknown', 'unavailable'] %}<br>🚨 **Fejl:** {{
              states('sensor.s8_maxv_ultra_vacuum_error') }}{% endif %}
          - type: tile
            entity: vacuum.s8_maxv_ultra
            name: Robotstøvsuger
            icon: mdi:robot-vacuum
            features:
              - type: vacuum-commands
                commands:
                  - start_pause
                  - stop
                  - return_home
                  - locate
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.s8_maxv_ultra_battery
            name: Batteri
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.s8_maxv_ultra_mop_attached
            name: Moppeklud
            icon: mdi:hydro-power
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.s8_maxv_ultra_last_clean_end
            name: Sidst færdig
            icon: mdi:clock-check-outline
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.roborock_dage_siden_rengoring
            name: Dage siden hel-hus
            icon: mdi:calendar-clock
            grid_options:
              columns: 6

      # =====================================================================
      # HELE HUSET
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Hele huset
            icon: mdi:home
            heading_style: title
          # Hel-hus-knapperne lægger sig i køen (segment 0) og starter først når
          # robotten er ledig — direkte start mens den kørte gav en fejl i
          # UI'et og ingen rengøring (2026-10-30).
          # Rum-knapperne ovenfor gør ét rum rent; kun en hel-hus-tur tæller
          # som "huset er gjort rent" og udskyder den automatiske rengøring.
          # (Var synlig tekst til 2026-09-30:) Hele lejligheden i én tur. Et
          # enkelt rum tæller bevidst ikke med.
          - type: button
            name: Hurtig — hele huset
            icon: mdi:broom
            icon_height: 36px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_rum_koe_tilfoej
              data: {segment: 0, grundighed: "H"}
            grid_options:
              columns: 6
          - type: button
            name: Grundig — hele huset
            icon: mdi:water
            icon_height: 36px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_rum_koe_tilfoej
              data: {segment: 0, grundighed: "G"}
            grid_options:
              columns: 6
          - type: button
            name: Normal — sug + mop
            icon: mdi:robot-vacuum-variant
            icon_height: 36px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_rum_koe_tilfoej
              data: {segment: 0, grundighed: "N"}
            grid_options:
              columns: 6
          - type: button
            name: Kør færdig
            icon: mdi:flag-checkered
            icon_height: 36px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_wrap_up
            grid_options:
              columns: 6
          - type: button
            name: Stop og kør hjem
            icon: mdi:home-import-outline
            icon_height: 36px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.roborock_stop_dock
            grid_options:
              columns: 12
          # Hurtig/Grundig her er hele-hus-varianter: Hurtig = samme profil som
          # rum-knapperne (fuld sug, ingen mop). Grundig = fuld sug + kraftigste
          # vandmængde. Normal = roligere sug, almindelig vandmængde — den
          # stilleste af de tre.
          - type: markdown
            content: >-
              **Kør færdig** tæller som gennemført. **Stop og kør hjem**
              afbryder — huset står stadig som ikke-rengjort.
  - title: Robot & dok
    path: robot
    icon: mdi:robot-vacuum
    type: sections
    max_columns: 2
    sections:

      # =====================================================================
      # ROBOT & DOK — kortet + rum-navnene
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Kortet
            icon: mdi:map
            heading_style: title
          # `type: image` FINDES IKKE som Lovelace-kort (verificeret 2026-09-03
          # mod frontend-bundtets egen kort-registry i HA 2026.4.0: kun
          # picture / picture-entity / picture-glance / picture-elements).
          # Kortet rendererede derfor som "Configuration error" i app'en.
          # picture-entity accepterer domænet `image` direkte (setConfig:
          # ["camera","image","person"]), så entity'en er uændret.
          # show_state slået fra: en image-entity's state ER et ISO-tidsstempel.
          - type: picture-entity
            entity: image.s8_maxv_ultra_map_0
            show_name: false
            show_state: false
          # LITERAL blok (`|-`), ikke folded (`>`): en markdown-tabel skal
          # beholde sine linjeskift, og folding ville lime rækkerne sammen til
          # én linje. Til gengæld gør HA's markdown-kort ENHVER enkelt newline
          # til et <br>, så hvert prosa-afsnit må stå på én lang linje.
          # Navnene er ikke gættet: udledt af 21 døgns data (hvilke rums
          # bevægelsessensorer reagerede mens robotten stod i hvert segment —
          # robotten er selv den bevægelse sensorerne ser).
          # Tabellen læser `navne` (app-navn → husets navn) direkte, så den
          # følger kortet uden et hardkodet segment-nummer her. Et app-rum der
          # findes i `navne` men ikke i `rum` kan ingen knap sende robotten til
          # (2026-10-10: Kitchen1 = teknikskabet, no-go) — det markeres.
          - type: markdown
            content: |-
              {% set n = state_attr('sensor.roborock_rum_kort', 'navne') | default({}, true) %}{% set r = state_attr('sensor.roborock_rum_kort', 'rum') | default({}, true) %}Roborock-app'ens egne rumnavne, oversat til husets:

              | App'ens navn | Rummet |
              |---|---|
              {% for app, hus in n.items() -%}
              | {{ app }} | {{ hus if hus in r.values() else hus ~ ' — støvsuges aldrig' }} |
              {% endfor %}

      # =====================================================================
      # DOKKEN
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Dokken
            icon: mdi:home-import-outline
            heading_style: title
          - type: entities
            state_color: true
            entities:
              - entity: binary_sensor.s8_maxv_ultra_mop_attached
                name: Moppeklud monteret
              - entity: binary_sensor.s8_maxv_ultra_water_box_attached
                name: Vandtank i robotten
              - entity: binary_sensor.s8_maxv_ultra_water_shortage
                name: Mangler vand
              - entity: binary_sensor.s8_maxv_ultra_dock_clean_water_box
                name: Rentvandstank tom
              - entity: binary_sensor.s8_maxv_ultra_dock_dirty_water_box
                name: Spildevandstank fuld
              - entity: binary_sensor.s8_maxv_ultra_dock_cleaning_fluid
                name: Rengøringsmiddel tomt
              - entity: binary_sensor.s8_maxv_ultra_dock_mop_drying
                name: Tørrer moppen
              - entity: sensor.s8_maxv_ultra_dock_mop_drying_remaining_time
                name: Tørring — tid tilbage
              - entity: sensor.s8_maxv_ultra_dock_dock_error
                name: Dok-fejl
          # Tørringen tager et par timer med varm luft og er ikke en fejl —
          # det er også dokkens største strømforbrug.
          # (Var synlig tekst til 2026-09-30:) Dokken vasker og tørrer selv
          # moppekluden efter gulvvask. Fuld spildevandstank eller tom
          # rentvandstank: grundig bliver til hurtig.

      # =====================================================================
      # FORBRUGSSTOFFER
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Forbrugsstoffer
            icon: mdi:wrench
            heading_style: title
          # (Var synlig tekst til 2026-09-30:) Timer tilbage før delen bør
          # skiftes eller renses. Huset siger selv til med en besked når en af
          # dem nærmer sig nul.
          - type: entities
            entities:
              - entity: sensor.s8_maxv_ultra_main_brush_time_left
                name: Hovedbørste
              - entity: sensor.s8_maxv_ultra_side_brush_time_left
                name: Sidebørste
              - entity: sensor.s8_maxv_ultra_filter_time_left
                name: Filter
              - entity: sensor.s8_maxv_ultra_sensor_time_left
                name: Sensorer (tørres af)
              - entity: sensor.s8_maxv_ultra_dock_strainer_time_left
                name: Si i dokken
              - entity: sensor.s8_maxv_ultra_dock_maintenance_brush_time_left
                name: Dokkens børste

      # =====================================================================
      # SIDSTE TUR + TOTALER
      # =====================================================================
      - type: grid
        cards:
          - type: heading
            heading: Sidste tur
            icon: mdi:history
            heading_style: title
          - type: entities
            entities:
              - entity: sensor.s8_maxv_ultra_last_clean_begin
                name: Startede
              - entity: sensor.s8_maxv_ultra_last_clean_end
                name: Sluttede
              - entity: sensor.s8_maxv_ultra_cleaning_area
                name: Areal
              - entity: sensor.s8_maxv_ultra_cleaning_time
                name: Varighed
              - type: section
                label: I alt, siden robotten var ny
              - entity: sensor.s8_maxv_ultra_total_cleaning_count
                name: Antal ture
              - entity: sensor.s8_maxv_ultra_total_cleaning_area
                name: Areal i alt
              - entity: sensor.s8_maxv_ultra_total_cleaning_time
                name: Tid i alt
