# =============================================================================
# Daily-life scenes v2 (sprint 2026-05-22 PM)
# =============================================================================
# 3 nye scener for at fylde gap mellem fest-scener og specifik aktivitet:
#   - madlavning:    køkken bright + ambient andre
#   - hverdagsaften: balanced familie-baseline 55% 2700K i fælles-rum
#   - winddown:      pre-godnat dim warm overalt (inkl. badeværelse/sove for path-lights)
#
# Comfort baseline (user-spec): 2500-2700K @ 40-60% er "normal aften".
# Disse 3 scener er designet omkring den baseline (vs. zen=very-dim mood,
# sofa_laesning=bright reading, cinema=dim red, spisestue_middag=dinner-focus).
#
# madlavning får spread (epicenter=koekken). Andre 2 dækker allerede whole-
# common-area, så spread er ikke meningsfuldt.
# =============================================================================

scene_madlavning:
  alias: "Scene: Køkken Madlavning (køkken bright, ambient resten)"
  mode: restart
  description: >
    Køkken-fokus: bright 80% 3000K for farve-præcision (hakke grønt, læse
    opskrift). Andre fælles-rum dimmet ambient så de ikke konkurrerer.
    Bad/sove/børn untouched. Spread-enabled (epicenter=koekken).
  sequence:
    # Køkken: bright neutral
    # Stue loft: ambient så folk på sofa ser noget
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.spisestue_loft
      data:
        brightness_pct: 30
        color_temp_kelvin: 2700
        transition: 2
    # Stue sofa-lamper: varmere accent
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: !include ../rosters/stue_sofa_lys.yaml
      data:
        brightness_pct: 40
        color_temp_kelvin: 2400
        transition: 2

scene_hverdagsaften:
  alias: "Scene: Hverdagsaften (familietid, balanced)"
  mode: restart
  description: >
    Default familie-aften — alle samles, lave forskellige ting.
    Comfort baseline 55% 2700K på fælles-rum loft. Sofa-lamper varmere
    accent. Entré åbent (welcoming). Terrasse warm glow hvis mørkt.
    Børn/sove/bad untouched (egne dynamics).
  sequence:
    # Fælles-rum loft: balanced 2700K 55%
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id:
          - light.spisestue_loft
      data:
        brightness_pct: 55
        color_temp_kelvin: 2700
        transition: 2
    # Sofa-lamper: varmere accent
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: !include ../rosters/stue_sofa_lys.yaml
      data:
        brightness_pct: 50
        color_temp_kelvin: 2400
        transition: 2
    # Depot strip: matching ambient
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.depot_strip
      data:
        brightness_pct: 50
        color_temp_kelvin: 2700
        transition: 2
    # Entré: welcoming
    # F4 fix: entre_loft transition=0 (TRADFRI WS bulb quirk)
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.entre_loft
      data:
        brightness_pct: 50
        color_temp_kelvin: 2700
        transition: 0
    # Terrasse lyskæde warm glow. Sprint 2026-05-23 v2: lux-gate genindført.
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('sensor.open_plan_lux') | float(0) < 100 }}"
          sequence:
            - service: light.turn_on
              continue_on_error: true
              target:
                entity_id: light.koekken_lyskaede
              data:
                brightness_pct: 30
                color_temp_kelvin: 2200
                transition: 2

scene_winddown:
  alias: "Scene: Sen aften winddown (pre-godnat dim warm)"
  mode: restart
  description: >
    Pre-godnat (kl 21-22): blødt overalt for at signalere "snart i seng".
    Adskilt fra system-godnat — winddown er stadig aktivt liv. Path-lights
    i bad/sove/entré, ikke off. Børnerum gentle 5% (ikke pitch black hvis
    de stirrer). Terrasse off (vi er inde nu).
  sequence:
    # Fælles-rum loft: meget dim 2200K
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id:
          - light.spisestue_loft
      data:
        brightness_pct: 18
        color_temp_kelvin: 2200
        transition: 3
    # Sofa-lamper: varmest, dimmest accent
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: !include ../rosters/stue_sofa_lys.yaml
      data:
        brightness_pct: 20
        color_temp_kelvin: 2000
        transition: 3
    # Depot strip: matching dim
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.depot_strip
      data:
        brightness_pct: 15
        color_temp_kelvin: 2200
        transition: 3
    # Sove loft (= pendel, flyttet 2026-06-05): path til seng
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.spisestue_pendel
      data:
        brightness_pct: 30
        color_temp_kelvin: 2200
        transition: 3
    # Bad: tandbørste-lys (5 spots — loft-pære flyttet til stue 2026-05-31)
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.badevaerelse_all
      data:
        brightness_pct: 35
        color_temp_kelvin: 2200
        transition: 3
    # Børn: gentle 5% MEN kun hvis kids IKKE allerede er i seng.
    # Sprint 2026-05-22 PM fix: hvis godnat_boern_active=on → skip helt
    # + sluk eksplicit (defensiv mod tidligere tændt lys).
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.godnat_boern_active
              state: "off"
          sequence:
            - service: light.turn_on
              continue_on_error: true
              target:
                entity_id: light.boernevaerelse_loft
              data:
                brightness_pct: 5
                color_temp_kelvin: 2200
                transition: 3
      default:
        - service: light.turn_off
          continue_on_error: true
          target:
            entity_id:
              - light.boernevaerelse_loft
              - light.boernevaerelse_lampe
          data:
            transition: 3
    # Entré: subtle path
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.entre_loft
      data:
        brightness_pct: 25
        color_temp_kelvin: 2200
        transition: 0
    # Depot loft: subtle
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.depot_loft
      data:
        brightness_pct: 15
        color_temp_kelvin: 2200
        transition: 3
    # Terrasse: off (vi er inde)
    - service: light.turn_off
      continue_on_error: true
      target:
        entity_id:
          - light.koekken_lyskaede
          - light.terrasse_paerelyskaede
      data:
        transition: 3

# =============================================================================
# Fødselsdag (2026-08-16, user-spec) — Dannebrog: skiftevis rød og hvid
# =============================================================================
# Farverne sidder på HVER ANDEN pære, og de to hold BYTTER hvert 5. minut
# (automation foedselsdag_farveskift, packages/foedselsdag_mood.yaml).
# Moden bliver stående til brugeren slukker den — tap på tilen igen
# (script.scene_toggle rydder scenen + slukker lyset).
#
# Scope er bevidst SMALT (user-spec): kun de 10 lys herunder. Alt andet i
# huset står som det stod — derfor slukker moden IKKE noget ved start.
foedselsdag_apply:
  alias: "Fødselsdag: anvend rød/hvid efter fase"
  mode: restart
  description: >
    Eneste sted lys-rosteret findes (fejlklasse #2 — skiftet og starten deler
    listerne). saet_a er rød i fase A, hvid i fase B; saet_b omvendt.
  fields:
    check_exit:
      description: >
        true = afslut moden hvis alle 10 lys er slukket (bruges af 5-min-
        skiftet, så et manuelt "sluk alt" ikke bliver tændt igen for evigt).
      example: true
  variables:
    # Start-fordelingen fra user-spec: disse fem er RØDE når moden tændes.
    saet_a:
      - light.spisestue_loft
      - light.stue_laesehygge      # sofa-læselampen (Innr-farvepære, flyttet hertil 2026-07-02)
      - light.badevaerelse_spot_3
      - light.badevaerelse_spot_4
      - light.boernevaerelse_hygge_strip
    # ...og disse fem er HVIDE når moden tændes.
    saet_b:
      - light.koekken_lyskaede
      - light.badevaerelse_spot_1
      - light.badevaerelse_spot_2
      - light.badevaerelse_spot_5
      - light.boernevaerelse_loft
    fase_b: "{{ is_state('input_boolean.foedselsdag_fase_b', 'on') }}"
    roede: "{{ saet_b if fase_b else saet_a }}"
    hvide: "{{ saet_a if fase_b else saet_b }}"
  sequence:
    - if:
        - condition: template
          value_template: >-
            {{ check_exit | default(false)
               and expand(saet_a + saet_b)
                   | selectattr('state', 'eq', 'on') | list | count == 0 }}
      then:
        - service: input_select.select_option
          target:
            entity_id: input_select.active_scene
          data:
            option: "none"
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.cirkus_active
        - stop: "Alle fødselsdags-lys var slukket → moden afsluttet"
    # Dannebrog-rød = Pantone 186C ≈ RGB 198/12/48.
    - service: light.turn_on
      continue_on_error: true   # Matter-timeout må ikke aborte resten (CHIP 0x32)
      target:
        entity_id: "{{ roede }}"
      data:
        rgb_color: [198, 12, 48]
        brightness_pct: 100
        transition: 2
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: "{{ hvide }}"
      data:
        # 5000 K, ikke 4000: målt live 08-16 rendrede 4000 K som rgb
        # 255/206/166 = synligt gul ved siden af den mættede røde. Inden for
        # alle 10 pærers område (smalleste er 1798-6535 K).
        color_temp_kelvin: 5000
        brightness_pct: 100
        transition: 2

scene_foedselsdag:
  alias: "Scene: Fødselsdag (Dannebrog rød/hvid, bytter hvert 5. min)"
  mode: restart
  description: >
    Sætter fase A + skifte-stemplet og tænder de 10 lys. cirkus_active
    tændes som mood-pause-flag (samme genbrug som Dark Mode gør af
    cinema_active) — så presence-lys, drift-back, morgen-sanity og
    luksus-besparelse holder fingrene væk mens festen kører.
  sequence:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.foedselsdag_fase_b
    - service: input_number.set_value
      target:
        entity_id: input_number.foedselsdag_sidste_skift_ts
      data:
        value: "{{ now().timestamp() | round(0) }}"
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.cirkus_active
    - service: script.foedselsdag_apply
