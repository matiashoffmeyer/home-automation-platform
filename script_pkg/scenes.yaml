scene_private:
  alias: "Scene: Sove Private (sove + terrasse — andre rum urørt)"
  description: >
    Replaced scene_punk 2026-05-06 per user-request. Private mode rammer
    KUN 2 ting:
      1. Sove-lys: meget varm (orange-tinted), 10% brightness
      2. Terrasse: dæmpet warm white 15%
    Andre lys forbliver i nuværende state (= IKKE en hus-wide takeover).
    Tap igen via dashboard = scene_toggle slukker (handles by scene_toggle).
    godnat slukker scenen automatisk (cinema-pattern).
  mode: restart  # tap-to-takeover
  sequence:
    # Sove: warm dim. 2026-06-05: pendel = soveloft (CCT-only) → rgb erstattet
    # af varmeste hvid (color_temp_kelvin) i stedet for orange rgb.
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.spisestue_pendel
      data:
        color_temp_kelvin: 2200    # var rgb orange-warm; pendel kan kun CCT
        brightness_pct: 10
        transition: 3
    # Terrasse-lyskæde: dæmpet warm (lyskæde supports color_temp + RGB)
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.koekken_lyskaede
      data:
        color_temp_kelvin: 2200       # warm hvid
        brightness_pct: 15
        transition: 3
    # Pærelyskæde: warm-white only (color_temp ignoreres, kun brightness)
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.terrasse_paerelyskaede
      data:
        brightness_pct: 15
        transition: 3

