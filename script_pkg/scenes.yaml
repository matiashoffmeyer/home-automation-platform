# =============================================================================
# script_pkg/scenes.yaml — house-wide mood scenes (11 scenes)
# =============================================================================
# Scenes: zen, sofa_laesning, spisestue_middag, cirkus, party,
#         full_bright, private, blue, happy, sunset, cyberpunk.
# (cinema-scenen fjernet 2026-07-27 — erstattet af Dark Mode, se
#  packages/dark_mode.yaml. input_boolean.cinema_active LEVER dog videre som
#  Dark Mode's interne suppression-flag som 30+ gates gater på.)
#
# ENTRY POINTS:
#   - Dashboard tile → script.scene_toggle (room_logic.yaml) → her
#   - Entré Styrbar L/R → script.scene_zen direkte (via L/R mode cycle —
#     se automations/entre_somrig.yaml). De øvrige modes (auto/all_bright/
#     all_off) bruger ikke scene-scripts men kalder light.alle_lys direkte.
#   - REST API → direct script call
#
# ⚠️ GATING (A23 fix): scene_toggle gates på godnat_any_active=on.
#   Individuelle scene scripts har IKKE gate (REST bypass OK).
#
# Adding a new scene? 3 steder (scene_drift validator catcher mismatch):
#   1. Her (scene_<name> script)
#   2. packages/scene_state.yaml (input_select option + binary_sensor)
#   3. dashboards/scenes.yaml (tile)
#
# Cross-cutting refs + full chain: docs/cross_cutting_map.md (scenes section).
# Per-scene rationale: hver scene har egen description-block med detaljer.
# =============================================================================

scene_zen:
  alias: "Scene: Sofa Zen (stue-område + terrasse)"
  mode: restart  # tap-to-takeover
  description: >
    2026-05-21 user-redesign: scope reduceret til kun stue-området +
    spisestue + terrasse. Tidligere rørte zen børneværelse-lampe + alle
    andre rums loft-lys — det matchede ikke user's mentale model af
    "zen stemning i stueområdet". Nu lader Sofa Zen alle andre rum være
    (børn/sove/bad/entré/depot-loft urørt).
  sequence:
    # Override-snapshot (Entré L/R-sti kalder dette script direkte, uden om
    # scene_toggle): hvis brugeren har trykket "Overskriv" på Zen, anvend det
    # gemte snapshot + stop. Ellers fald igennem til hardcoded mood nedenfor.
    - if:
        - condition: template
          # scene-entity har state 'unknown' til første aktivering → tjek
          # eksistens via subscript (None hvis snapshot ikke findes). Slettet
          # snapshot lingrer som 'unavailable' (restored) → ekskludér så zen
          # falder tilbage til hardcoded mood straks efter sletning.
          value_template: >-
            {{ states['scene.snap_zen'] is not none
               and states('scene.snap_zen') != 'unavailable' }}
      then:
        - service: scene.turn_on
          target:
            entity_id: scene.snap_zen
          data:
            transition: 2
        - stop: "Override-snapshot anvendt for zen"
    # Slukker stue + køkken loft (zen = no harsh overhead i open-plan).
    # Andre rum's loft-lys forbliver i deres state.
    - service: light.turn_off
      continue_on_error: true
      target:
        entity_id:
          - light.spisestue_loft
      data:
        transition: 3
    # Sofa-lamper + spisestue pendel = warm ambient over seating + dining
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: !include ../rosters/stue_sofa_lys.yaml
      data:
        brightness_pct: 15
        color_temp_kelvin: 2200
        transition: 3
    # 2026-05-07 fix: depot_strip var [255, 120, 30] = bright orange-red
    # → for rød per real-life test. Ændret til soft peach/warm-white tone
    # for mere ægte "zen" feel. RGB [255, 215, 165] = blødt peach-cream.
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.depot_strip
      data:
        brightness_pct: 20
        rgb_color: [255, 215, 165]
        transition: 3
    # Terrasse: SUPER dæmpet varm-hvid 5% (matcher Zen's interior 2200K).
    # Sprint 2026-05-23 v2: lux-gate genindført (open_plan_lux < 100).
    # 5% lyskæde er invisible i fuld sol → spar bulb/strøm hvis indoor bright.
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('sensor.open_plan_lux') | float(0) < 100 }}"
          sequence:
            - service: light.turn_on
              continue_on_error: true
              target:
                entity_id: light.koekken_lyskaede
              data:
                color_temp_kelvin: 2200
                brightness_pct: 5
                transition: 3
            - service: light.turn_on
              continue_on_error: true
              target:
                entity_id: light.terrasse_paerelyskaede
              data:
                brightness_pct: 5
                transition: 3
      default:
        - service: light.turn_off
          continue_on_error: true
          target:
            entity_id:
              - light.koekken_lyskaede
              - light.terrasse_paerelyskaede
          data:
            transition: 3

scene_cirkus:
  alias: "Scene: Fælles Cirkus (stue + køkken + spisestue + depot + terrasse)"
  mode: restart  # tap-to-takeover
  description: >
    Saetter cirkus-mood lys + cirkus_active flag (saa presence_lights og
    drift-back ikke forstyrrer party-vibe). Scene-cyclen rydder begge mood-
    flags foer denne scene koeres saa cirkus_active er rent on naar vi naar
    slut. Terrasse: bruger lyskaede + paerelyskaede (Hue Lily droppet).

    B2.1 fix audit-runde 17: skip hvis godnat_active=on (party giver ikke
    mening under godnat).
  sequence:
    # B2.1 + A14 fix sprint 2026-05-06: gate på godnat_any_active (union flag)
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.godnat_any_active
              state: "on"
          sequence:
            - service: persistent_notification.create
              data:
                notification_id: cirkus_blocked
                title: "Cirkus blokeret"
                message: "Godnat-flow er aktiv — kan ikke starte cirkus. Tryk Somrig op for at afslutte godnat foerst."
            - stop: "A14: cirkus blokeret af godnat-flow"
    # Terrasse: lyskaede dyb-rød (color-capable), paerelyskaede full brightness
    # (warm-white only — ingen RGB support, naturligt warm passer til cirkus mood)
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.koekken_lyskaede
      data:
        rgb_color: [255, 0, 0]
        brightness_pct: 100
        transition: 2
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.terrasse_paerelyskaede
      data:
        brightness_pct: 100
        transition: 2
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: !include ../rosters/open_plan_lys.yaml
      data:
        rgb_color: [255, 50, 0]
        brightness_pct: 60
        transition: 2
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id:
      data:
        rgb_color: [200, 0, 100]
        brightness_pct: 50
        transition: 2
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.depot_strip
      data:
        rgb_color: [255, 0, 50]
        brightness_pct: 70
        transition: 2
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.cirkus_active

scene_party:
  alias: "Scene: Hus Party (alle rum undt sove — forskellige farver)"
  mode: restart  # tap-to-takeover
  sequence:
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.spisestue_loft
      data:
        hs_color: [240, 100]
        brightness_pct: 70
        transition: 1
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: !include ../rosters/stue_sofa_lys.yaml
      data:
        hs_color: [320, 100]
        brightness_pct: 70
        transition: 1
    # 2026-09-23 (user-spec): sofastuens to Thread-spots er INDIVIDUELLE pærer
    # under party — hver sin farve, ikke læselampens magenta (spejlet i
    # packages/stue_spots.yaml holder pause mens party er aktiv). Hue 280 og
    # 30 ligger i paletten huller ved siden af sofa-magentaen (320).
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.stue_spot_1
      data:
        hs_color: [280, 100]
        brightness_pct: 70
        transition: 1
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.stue_spot_2
      data:
        hs_color: [30, 100]
        brightness_pct: 70
        transition: 1
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.koekken_lyskaede
      data:
        hs_color: [0, 100]
        brightness_pct: 80
        transition: 1
    # paerelyskaede er warm-white only — får kun brightness, ingen color
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.terrasse_paerelyskaede
      data:
        brightness_pct: 80
        transition: 1
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id:
          - light.boernevaerelse_loft
          - light.boernevaerelse_lampe
      data:
        hs_color: [60, 100]
        brightness_pct: 60
        transition: 1
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.badevaerelse_all   # group: loft + 5 spots (sprint 2026-05-10)
      data:
        hs_color: [180, 100]
        brightness_pct: 70
        transition: 1
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.depot_strip
      data:
        hs_color: [200, 100]
        brightness_pct: 80
        transition: 1
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.entre_loft
      data:
        # 2026-08-21: entréen fik farve. Indtil pæreskiftet var loftet en
        # CCT-only TRADFRI WS, så festscenen måtte nøjes med 2700 K varmt hvidt
        # midt i et hus fuld af kulører — på den ene lampe gæsten ser FØRST.
        # KAJPLATS'en er hs-kapabel, så den er med nu.
        # Hue 120 fylder paletten største hul: de øvrige rum bruger
        # 0 / 60 / 180 / 200 / 240 / 320, og springet 60 → 180 var bredest.
        # Entréen bliver dermed husets eneste grønne = den skiller sig ud i
        # stedet for at ligne naborummet gennem døråbningen.
        hs_color: [120, 100]
        brightness_pct: 60
        transition: 1

