# =============================================================================
# Daily-life utility scenes (2026-05-21)
# =============================================================================
# Sofa Læsning + Spisestue Middag — added per user-request "mangler der scener".
# Fylder gap mellem mood-scenes (zen/cinema) og bright-scenes (full_bright):
# warm men bright nok til faktisk aktivitet (læsning, spisning).
# =============================================================================

scene_sofa_laesning:
  alias: "Scene: Sofa Læsning (stue sofa-lamper bright warm)"
  description: >
    Daily reading scene. Slukker spisestue_loft (ingen harsh overhead glare),
    tænder sofa-lamper 70% 2700K (bright nok til at læse tekst comfortably).
    Depot strip soft accent. Alle andre rum forbliver urørt — det er en
    fokuseret 1-aktivitet scene.
  mode: restart
  sequence:
    - service: light.turn_off
      continue_on_error: true
      target:
        entity_id: light.spisestue_loft
      data:
        transition: 2
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: !include ../rosters/stue_sofa_lys.yaml
      data:
        brightness_pct: 70
        color_temp_kelvin: 2700
        transition: 2
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.depot_strip
      data:
        brightness_pct: 30
        rgb_color: [255, 215, 165]  # soft peach accent
        transition: 2

scene_spisestue_middag:
  alias: "Scene: Spisestue Middag (spisestue_loft fokus + mild køkken + ambient stue)"
  description: >
    Daily dinner scene. 2026-06-05: pendlen flyttet til soveloft → spisestue_loft
    er nu dining-fokus (50% 2400K) over spisebord, indtil nyt spisestue-armatur
    sættes op post-flyt. Køkken_loft 30% (mild, undgår open-plan void når man
    spiser). Stue sofa-lamper 20% 2200K = ambient mood. Depot strip 20%
    peach accent. Terrasse 5% (aften).
    Børn/sove/bad/entré urørt — lad andre rums automatik køre normalt.
  mode: restart
  sequence:
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.spisestue_loft
      data:
        brightness_pct: 50
        color_temp_kelvin: 2400
        transition: 2
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: !include ../rosters/stue_sofa_lys.yaml
      data:
        brightness_pct: 20
        color_temp_kelvin: 2200
        transition: 2
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.depot_strip
      data:
        brightness_pct: 20
        rgb_color: [255, 215, 165]  # soft peach
        transition: 2
    # Terrasse warm dim. Sprint 2026-05-23 v2: lux-gate genindført.
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('sensor.open_plan_lux') | float(0) < 100 }}"
          sequence:
            - service: light.turn_on
              continue_on_error: true
              target:
                entity_id: light.koekken_lyskaede
              data:
                color_temp_kelvin: 2200
                brightness_pct: 5
                transition: 2
            - service: light.turn_on
              continue_on_error: true
              target:
                entity_id: light.terrasse_paerelyskaede
              data:
                brightness_pct: 5
                transition: 2
      default:
        - service: light.turn_off
          continue_on_error: true
          target:
            entity_id:
              - light.koekken_lyskaede
              - light.terrasse_paerelyskaede
          data:
            transition: 2

