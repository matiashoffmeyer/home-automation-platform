# =============================================================================
# script_pkg/bulb_defaults.yaml — model-specific NVRAM defaults
# =============================================================================
# 3 helper scripts der sætter ZHA cluster attributes på paerede bulbs:
#   1. innr_color_bulb_defaults    — Innr RGBW (RB 282 C, FL 230 C, etc)
#   2. tradfri_white_bulb_defaults — IKEA Tradfri WW E27
#   3. innr_plug_defaults          — Innr smart plugs (Power-on State)
#
# CALLED-FROM:
#   - automations/zha_auto_config.yaml — ved device-pair event, dispatcher
#     vælger script baseret på model-string
#   - automations/bulb_firmware_defaults.yaml — adaptive opdates (sun-bracket
#     baseret) via dispatcher der kalder model-specific helper
#
# WHY 30% wake (ikke 100%): bulb wakes ved vægkontakt-tænd ELLER mesh-recovery.
# Default 100% blænder voksen sove-værelse om aftenen. 30% er adaptive baseline
# (audit-runde 6 fix). Adaptive firmware (bulb_firmware_defaults.yaml) opdates
# værdien baseret på sun-bracket (day=178/70%, twilight=127/50%, night=76/30%).
#
# CROSS-CUTTING:
#   - input_number.godnat_brightness_pct (constants.yaml) — bruges af adaptive
#     dispatcher som godnat-target. Default 30%.
#   - input_number.godnat_kelvin (constants.yaml) — godnat color_temp. Default 2326K.
#
# Splittet fra scripts.yaml 2026-05-05 (Phase 2.1 refactor).
# =============================================================================

innr_color_bulb_defaults:
  alias: "Innr farve-paere defaults (Power-on On, lvl 30%, CT 370 mireds warm)"
  description: >
    Saetter Power-on behavior=On, Power-on level=30% (ikke 100% saa
    bulben ikke blaender ved vægkontakt-tænd), Start-up color temperature
    =370 mireds paa en Innr farve-paere (RB 282 C, FL 230 C, RF 271 T,
    OFL 142 C). Kraever kun IEEE.

    Path B (audit-runde 6): bulben vaagner pa 30% warm hvid i stedet for
    100%. light_power_recovery automation tager derefter over og fader
    smooth til target-brightness over 3 sek baseret pa sun-elev. Resultat:
    minimal "blink" + smooth fade-up til korrekt aften/dag-niveau.
  fields:
    ieee:
      description: "Zigbee IEEE adresse (fx ba:1a:39:ec:8c:0a:f4:fc)"
      required: true
      example: "ba:1a:39:ec:8c:0a:f4:fc"
      selector:
        text:
  sequence:
    - service: zha.set_zigbee_cluster_attribute
      data:
        ieee: "{{ ieee }}"
        endpoint_id: 1
        cluster_id: 6
        cluster_type: in
        attribute: 0x4003
        value: 1
    - service: zha.set_zigbee_cluster_attribute
      data:
        ieee: "{{ ieee }}"
        endpoint_id: 1
        cluster_id: 8
        cluster_type: in
        attribute: 0x4000
        value: 76  # 30% af 254 (Zigbee level control range 0-254)
    - service: zha.set_zigbee_cluster_attribute
      data:
        ieee: "{{ ieee }}"
        endpoint_id: 1
        cluster_id: 768
        cluster_type: in
        attribute: 0x4010
        value: 370

tradfri_white_bulb_defaults:
  alias: "Tradfri warm-white defaults (Power-on On, lvl 30%)"
  description: >
    Saetter Power-on behavior=On, Power-on level=30% (var 100% — bulben
    blaender ved vægkontakt-tænd) paa en Tradfri warm-hvid paere
    (LED2201G8 og lignende uden farve/color-temp). Path B (audit-runde 6).
  fields:
    ieee:
      description: "Zigbee IEEE adresse"
      required: true
      example: "ba:1a:39:ec:8c:0a:f4:fc"
      selector:
        text:
  sequence:
    - service: zha.set_zigbee_cluster_attribute
      data:
        ieee: "{{ ieee }}"
        endpoint_id: 1
        cluster_id: 6
        cluster_type: in
        attribute: 0x4003
        value: 1
    - service: zha.set_zigbee_cluster_attribute
      data:
        ieee: "{{ ieee }}"
        endpoint_id: 1
        cluster_id: 8
        cluster_type: in
        attribute: 0x4000
        value: 76  # 30% af 254

innr_plug_defaults:
  alias: "Innr smart plug defaults (Power-on On)"
  description: >
    Saetter Power-on behavior=On paa en Innr smart plug (SP240 indoor,
    OSP240 outdoor, etc.) saa pluggen taender automatisk efter strom-
    tilbagevenden. Plugs har ikke level eller color cluster.
  fields:
    ieee:
      description: "Zigbee IEEE adresse"
      required: true
      example: "ba:1a:39:ec:8c:0a:f4:fc"
      selector:
        text:
  sequence:
    - service: zha.set_zigbee_cluster_attribute
      data:
        ieee: "{{ ieee }}"
        endpoint_id: 1
        cluster_id: 6
        cluster_type: in
        attribute: 0x4003
        value: 1

# =============================================================================
# Styrbar action helpers — direct light control
# =============================================================================
# Styrbars styrer lyset DIREKTE (den gamle Auto/Dim/Bright/Off-cyklus er
# slettet, B198). Et tryk sætter rummet i Manual; drift-back tilbage til Auto
# styres af automations/room_drift_back.yaml (system_design.md §2.1).
#
# Targets-dict deles paa tvaers af alle scripts. Hver Styrbar-action stamper
# input_datetime.styrbar_last_press_<rum> via styrbar_stamp_press, som ogsaa
# saetter room_mode til Manual saa drift-back ved hvad der skal driftes
# tilbage fra og presence_lights respekterer manuel override.
# =============================================================================

