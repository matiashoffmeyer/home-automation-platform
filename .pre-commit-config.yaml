# Git hooks for a clone of this repository: `pre-commit install`.
#
# Revisions are frozen to commit SHAs and match the versions in
# requirements-dev.txt and scripts/dev_setup.sh (test_tooling_parity checks
# that). The local hooks run the platform's own checks, the same scripts the
# production host installs directly as its git hooks (scripts/dev_setup.sh).

minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: platform-checks
        name: platform checks (scripts/pre-commit-hook.sh)
        entry: bash scripts/pre-commit-hook.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: platform-push-checks
        name: platform push checks (scripts/pre-push-hook.sh)
        entry: bash scripts/pre-push-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
