# =============================================================================
# Health — dashboard (Lovelace YAML-mode; registreres i configuration.yaml som
# helbred-dash, se README.md). url_path bruges af pushene (/helbred-dash/<fane>).
# Alt indhold kommer fra sensor.helbred_*; logning går via script.helbred_cmd.
# =============================================================================
title: Health
icon: mdi:heart-pulse
views:
  - title: I dag
    path: idag
    icon: mdi:calendar-today
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:helbred-card
            visning: idag
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Påmindelser
          - type: tile
            entity: input_boolean.helbred_paamindelser
            name: Påmindelser på telefonen
            grid_options:
              columns: full
          - type: markdown
            content: >-
              Vejning mandag og torsdag morgen · dagens program om morgenen ·
              træning om eftermiddagen · knæ og vurdering søndag · målebånd hver
              4. uge. Tiderne står i helbred/profil.yaml.

  - title: Træning
    path: traening
    icon: mdi:dumbbell
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: custom:helbred-card
            visning: traening
            grid_options:
              columns: full

  - title: Kost
    path: kost
    icon: mdi:food-apple
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:helbred-card
            visning: kost
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Indkøb pr. uge
          - type: markdown
            grid_options:
              columns: full
            content: >-
              {{ state_attr('sensor.helbred_kost', 'indkoeb') }}

  - title: Statistik
    path: statistik
    icon: mdi:chart-line
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: custom:helbred-card
            visning: statistik
            grid_options:
              columns: full

  - title: Historik
    path: historik
    icon: mdi:clipboard-pulse-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:helbred-card
            visning: spoergsmaal
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: markdown
            grid_options:
              columns: full
            content: >-
              {{ state_attr('sensor.helbred_historik', 'tekst') }}
