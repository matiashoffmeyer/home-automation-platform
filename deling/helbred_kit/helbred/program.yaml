# Træningsprogrammet: vægttab + stærke, rolige knæ. Læses af scripts/helbred.py,
# og siden viser dagens anbefaling. Ret frit — kør `helbred.py tjek` bagefter.
#
# FELTER pr. øvelse:
#   enhed   reps | sek | min | km          saet   antal sæt
#   lo/hi   spænd for antal (start = lo). Når hi er nået og øvelsen har kg:
#           kg += kg_trin og antal tilbage til lo ("dobbelt progression").
#   trin    hvor meget antal stiger efter et pas klaret som anbefalet
#   kg      startvægt (udeladt = kropsvægt/tid). Start LET — programmet bygger op.
#   grupper muskelgrupper. To dage i træk på samme tunge gruppe advares der om.
#   billede mappe i www/oevelser/ (valgfri)
#   hvordan / hvorfor   vises på siden. Hver øvelse SKAL have et hvorfor.

principper:
  - "Knæ-reglen: op til 3 ud af 10 i smerte under en øvelse er OK, hvis det er væk igen inden næste morgen. Mere end det, eller hævet knæ næste dag: halvér mængden næste gang, og gå ikke så dybt."
  - "Knæet følger tæerne. Det må gerne komme frem over tæerne — det er knæ der falder INDAD, der belaster."
  - "Dybden bestemmes af knæet, ikke af programmet. Start med en høj kasse og sænk den, når det er smertefrit."
  - "Ingen hop og ingen løb, før knæet har tålt programmet i 8 uger. Cykel, crosstrainer, svømning og gang giver samme forbrænding uden stød."
  - "Styrke 3 dage om ugen, aldrig to dage i træk. Kondition og gåture på dagene imellem."
  - "Vægttabet sker i køkkenet. Træningen sørger for, at det er fedt og ikke muskler der forsvinder — og stærke lår er det bedste, du kan give et knæ."

oevelser:
  # ---------- Knæ-basis hver dag (ca. 12 min + gåtur) ----------
  quad_spaend:
    navn: "Lårspænd med strakt ben (hold á 10 sek)"
    enhed: reps
    saet: 1
    lo: 10
    hi: 10
    trin: 0
    grupper: [knaebasis]
    hvordan: "Sid med strakt ben og et sammenrullet håndklæde under knæhasen. Pres knæhasen ned i håndklædet, så knæskallen trækkes op, og hold 10 sek. Begge ben."
    hvorfor: "Den inderste lårmuskel er den første, der slukker, når et knæ gør ondt, og den sidste, der tænder igen. Uden den kører knæskallen skævt. Øvelsen tænder den uden at bøje knæet, så den kan laves selv på dårlige dage."
  benloeft:
    navn: "Strakt benløft liggende (pr. ben)"
    enhed: reps
    saet: 2
    lo: 10
    hi: 15
    trin: 1
    grupper: [knaebasis]
    hvordan: "Lig på ryggen, det andet ben bøjet. Spænd låret (som i lårspændet), løft det strakte ben til samme højde som det bøjede knæ, langsomt ned. Knæet må ikke bøje sig undervejs."
    hvorfor: "Styrker hele forsiden af låret med knæet i den mest skånsomme stilling: helt strakt. Stærkere lår tager stødet, før det når brusken."
  sidebenloeft:
    navn: "Sideløft liggende (pr. ben)"
    billede: Side_Leg_Raises
    enhed: reps
    saet: 2
    lo: 10
    hi: 20
    trin: 2
    grupper: [knaebasis]
    hvordan: "Lig på siden, nederste ben bøjet. Løft det øverste ben skråt bagud med tæerne pegende let nedad — du skal mærke det på siden af ballen, ikke foran på hoften."
    hvorfor: "Den lille ballemuskel på siden holder knæet fra at falde indad, når du går, står på trapper og squatter. Svage hofter er en af de hyppigste årsager til knæsmerter — også når knæet selv er sundt."
  vaegsid:
    navn: "Vægsiddning (hold)"
    enhed: sek
    saet: 3
    lo: 20
    hi: 45
    trin: 5
    grupper: [knaebasis]
    hvordan: "Ryggen mod en væg, fødderne en skolængde frem. Glid ned til knæet er bøjet ca. 45° (højt — ikke 90°) eller til det sted, hvor det er smertefrit. Hold. Ingen smerte over 3/10."
    hvorfor: "Statiske hold dæmper knæsmerter i timevis efter øvelsen og styrker låret uden at gnide i leddet. Mange knæpatienter kan holde en vægsiddning længe før de kan squatte."
  laegloeft:
    navn: "Tåhævning stående"
    billede: Standing_Dumbbell_Calf_Raise
    enhed: reps
    saet: 2
    lo: 12
    hi: 20
    trin: 2
    grupper: [knaebasis]
    hvordan: "Stå på begge ben ved en væg for balance. Op på tæerne på 1 sek, hold et øjeblik, ned på 3 sek. For hårdt? Bare kropsvægt. For let? Ét ben ad gangen."
    hvorfor: "Læggen tager en stor del af stødet ved hvert skridt, før det når knæet. Langsom vej ned bygger senerne op."
  glutebro:
    navn: "Bækkenløft"
    billede: Butt_Lift_Bridge
    enhed: reps
    saet: 2
    lo: 10
    hi: 15
    trin: 1
    grupper: [knaebasis]
    hvordan: "Lig på ryggen, fødderne i hoftebredde. Pres hælene i gulvet og løft hoften, til knæ-hofte-skulder er en lige linje. Klem ballerne 2 sek i toppen."
    hvorfor: "Baller der virker, aflaster knæet ved hver trappe og hver rejse-sig-fra-stolen. Øvelsen bøjer kun knæet let og belaster det næsten ikke."
  gaatur:
    navn: "Gåtur"
    enhed: min
    saet: 1
    lo: 20
    hi: 45
    trin: 5
    grupper: [gang]
    hvordan: "Rask gang, så du kan tale men ikke synge. Gerne delt i 2-3 ture, fx efter frokost og aftensmad. Flad vej eller let terræn; undgå lange stejle nedkørsler i starten."
    hvorfor: "Gåture er den mest undervurderede del af et vægttab: 45 minutter om dagen er 200-300 kcal ekstra uden at gøre dig sulten som hård træning gør. Og brusken i knæet får næring ved bevægelse — den har ingen blodforsyning."

  # ---------- Ben (knævenlige udgaver) ----------
  kasse_squat:
    navn: "Goblet squat til kasse"
    billede: Goblet_Squat
    enhed: reps
    saet: 3
    lo: 8
    hi: 12
    trin: 1
    kg: 8
    kg_trin: 2
    grupper: [laar, baller]
    hvordan: "Håndvægt/kettlebell foran brystet (hjemme: en rygsæk med bøger). Sæt dig LET ned på en kasse eller stol — så høj at knæet er smertefrit — og rejs dig igen. Knæene følger tæerne. Sænk kassen, når det er nemt."
    hvorfor: "At rejse sig fra en stol er hverdagens vigtigste bevægelse for et knæ. Kassen bestemmer dybden, så du aldrig går længere ned end knæet tåler, og den største muskelmasse i kroppen bliver arbejdet — det er dér forbrændingen sidder."
  benpres:
    navn: "Benpres (kort bevægelse)"
    billede: Leg_Press
    enhed: reps
    saet: 3
    lo: 10
    hi: 15
    trin: 1
    kg: 40
    kg_trin: 10
    grupper: [laar, baller]
    hvordan: "Fødderne højt og i hoftebredde på pladen. Ned til ca. 90° i knæet eller kortere, hvis det gør ondt — aldrig så dybt at lænden løfter sig fra sædet. Lås ikke knæene i toppen."
    hvorfor: "Maskinen styrer bevægelsen, så du kan give lårene tung belastning uden balance-krav og uden at knæet vrider. Høje fødder flytter arbejdet til baller og baglår og tager trykket af knæskallen."
  stepup:
    navn: "Step-up på lav kasse (pr. ben)"
    billede: Dumbbell_Step_Ups
    enhed: reps
    saet: 2
    lo: 8
    hi: 12
    trin: 1
    kg: 0
    kg_trin: 2
    grupper: [laar, baller]
    hvordan: "Start på et lavt trin (15-20 cm). Hele foden på kassen, skub dig op med det øverste ben — ikke afsæt fra det nederste. Langsomt ned. Knæet må ikke falde indad. Højere kasse eller håndvægte, når det er nemt."
    hvorfor: "Trapper er der, hvor et dårligt knæ mærkes først. Step-up træner præcis den bevægelse — ét ben ad gangen, så det svage ben ikke kan gemme sig bag det stærke."
  rdl:
    navn: "Rumænsk dødløft med håndvægte"
    enhed: reps
    saet: 3
    lo: 8
    hi: 12
    trin: 1
    kg: 10
    kg_trin: 2
    grupper: [baglaar, baller]
    hvordan: "Stå med en håndvægt i hver hånd (hjemme: rygsæk). Knæene LET bøjede og stille. Skub hoften bagud og lad vægtene glide ned langs lårene til midt på skinnebenet, ryggen lige. Rejs dig ved at skubbe hoften frem."
    hvorfor: "Baglår og baller trænes, mens knæet næsten står stille — så det kan være tungt uden at belaste knæleddet. Stærke baglår stabiliserer knæet bagfra og beskytter korsbåndene."
  splitsquat:
    navn: "Split squat, kort udfald (pr. ben)"
    billede: Split_Squats
    enhed: reps
    saet: 2
    lo: 6
    hi: 12
    trin: 1
    kg: 0
    kg_trin: 2
    grupper: [laar, baller]
    hvordan: "Langt skridt, hold fast i noget for balance. Sænk dig lodret ned så langt, det er smertefrit — i starten kun en håndfuld cm. Forreste knæ følger tæerne. Vent med denne til uge 3, hvis knæet er ømt."
    hvorfor: "Ét ben ad gangen med fuld kontrol. Den, der holder på det dårlige knæ, finder hurtigt ud af hvilket ben der er svagest — og retter det, før det giver problemer i hoften eller det gode knæ."
  etbens_bro:
    navn: "Bækkenløft på ét ben (pr. ben)"
    billede: Single_Leg_Glute_Bridge
    enhed: reps
    saet: 2
    lo: 8
    hi: 15
    trin: 1
    grupper: [baller]
    hvordan: "Som bækkenløft, men løft det ene ben strakt. Hoften må ikke tippe til siden. Klem ballen i toppen."
    hvorfor: "Hjemme-udgaven af dødløftet: baller og baglår får rigtig belastning uden vægte og uden at knæet bøjes dybt."

  # ---------- Overkrop ----------
  armboejninger:
    navn: "Armbøjninger"
    billede: Pushups
    enhed: reps
    saet: 3
    lo: 5
    hi: 15
    trin: 1
    grupper: [bryst, triceps]
    hvordan: "Kroppen lige som en planke. For hårdt? Hænderne på en bænk eller bordkant — jo højere, jo lettere. Ned til brystet næsten rører, op igen."
    hvorfor: "Bryst, skuldre og arme i én øvelse, uden udstyr. Muskler forbrænder også i hvile, og de holder på formen, mens kiloene forsvinder."
  baenkpres:
    navn: "Bænkpres med håndvægte"
    billede: Dumbbell_Bench_Press
    enhed: reps
    saet: 3
    lo: 8
    hi: 12
    trin: 1
    kg: 10
    kg_trin: 2
    grupper: [bryst, triceps]
    hvordan: "Lig på bænken, fødderne i gulvet. Vægtene ned til siden af brystet med albuerne ca. 45° ud fra kroppen, pres op."
    hvorfor: "Den største skub-øvelse for overkroppen. Når man taber sig, er det de store muskler, der skal have en grund til at blive — ellers tager kroppen dem med i underskuddet."
  kabelroning:
    navn: "Siddende roning i kabel"
    billede: Seated_Cable_Rows
    enhed: reps
    saet: 3
    lo: 10
    hi: 15
    trin: 1
    kg: 25
    kg_trin: 5
    grupper: [ryg, biceps]
    hvordan: "Ret ryg, let bøjede knæ. Træk håndtaget ind til navlen og skulderbladene sammen, langsomt ud igen. Overkroppen står stille."
    hvorfor: "Modvægten til alle skub-øvelserne: holder skuldrene tilbage og ryggen rank. Benene står stille, så knæet hviler."
  lat_pulldown:
    navn: "Lat pulldown"
    billede: Wide-Grip_Lat_Pulldown
    enhed: reps
    saet: 3
    lo: 10
    hi: 15
    trin: 1
    kg: 30
    kg_trin: 5
    grupper: [ryg, biceps]
    hvordan: "Bredt greb, læn dig en anelse tilbage. Træk stangen ned til øverste del af brystet, albuerne ned mod lommerne. Langsomt op."
    hvorfor: "Den brede rygmuskel er kroppens største overkropsmuskel. Trænet ryg giver holdning og form — det man ser i spejlet, når fedtet går."
  roning_haandvaegt:
    navn: "Roning med én arm (pr. arm)"
    billede: One-Arm_Dumbbell_Row
    enhed: reps
    saet: 3
    lo: 8
    hi: 12
    trin: 1
    kg: 12
    kg_trin: 2
    grupper: [ryg, biceps]
    hvordan: "Hånd og knæ på en bænk (hjemme: hånd på en stol, rygsæk i den anden hånd, stå med let bøjede knæ). Træk vægten op mod hoften, albuen tæt."
    hvorfor: "Ryggen trænes en side ad gangen, så den svage side ikke snyder. Den stående hjemme-udgave aflaster knæet, som ellers skulle ligge på bænken."
  facepulls:
    navn: "Face pulls"
    billede: Face_Pull
    enhed: reps
    saet: 2
    lo: 12
    hi: 20
    trin: 2
    kg: 10
    kg_trin: 2.5
    grupper: [skuldre]
    hvordan: "Reb i kablet i ansigtshøjde. Træk rebet mod panden og skil hænderne ad, så albuerne går ud og tilbage. Hold et øjeblik."
    hvorfor: "Små skuldermuskler der sjældent bliver trænet, men holder skulderen sund når du presser tungt. Billig forsikring mod ondt i skulderen."

  # ---------- Kerne ----------
  planke:
    navn: "Planke"
    billede: Plank
    enhed: sek
    saet: 3
    lo: 20
    hi: 60
    trin: 5
    grupper: [kerne]
    hvordan: "Underarme og tæer (for hårdt: knæene i gulvet, med en pude under). Lige linje fra hoved til hæl, spænd mave og baller."
    hvorfor: "En stærk mave holder bækkenet stabilt, og et stabilt bækken giver knæet en fast base at arbejde fra."
  sideplanke:
    navn: "Sideplanke (pr. side)"
    billede: Side_Bridge
    enhed: sek
    saet: 2
    lo: 15
    hi: 45
    trin: 5
    grupper: [kerne]
    hvordan: "På underarmen, kroppen lige. Let udgave: knæene bøjede og i gulvet. Hoften højt — den må ikke synke."
    hvorfor: "Træner siden af maven og siden af hoften på én gang — de samme muskler der holder knæet fra at falde indad, når du står på ét ben."
  deadbug:
    navn: "Dead bug (pr. side)"
    billede: Dead_Bug
    enhed: reps
    saet: 2
    lo: 6
    hi: 12
    trin: 1
    grupper: [kerne]
    hvordan: "På ryggen, arme lodret op, hofte og knæ i 90°. Pres lænden mod gulvet, stræk modsat arm og ben langsomt ud, tilbage, skift side."
    hvorfor: "Mavetræning uden at bøje ryggen og uden at belaste knæet. Lærer dig at holde mavespændet, mens arme og ben bevæger sig — det er det, kernen gør hele dagen."
  pallof:
    navn: "Pallof press (pr. side)"
    billede: Pallof_Press
    enhed: reps
    saet: 2
    lo: 8
    hi: 12
    trin: 1
    kg: 5
    kg_trin: 2.5
    grupper: [kerne]
    hvordan: "Stå sidelæns til kablet (eller en elastik). Hold håndtaget ind til brystet, pres det lige frem og ind igen uden at lade kroppen dreje."
    hvorfor: "Kernen skal mest af alt modstå at blive drejet. Det er den evne, der holder knæet fri af vrid, når du skifter retning."
  farmers:
    navn: "Farmers walk"
    billede: Farmers_Walk
    enhed: sek
    saet: 2
    lo: 30
    hi: 60
    trin: 10
    kg: 12
    kg_trin: 2
    grupper: [greb, kerne]
    hvordan: "En tung håndvægt i hver hånd, rank ryg, korte rolige skridt frem og tilbage. Sæt vægtene stille ned."
    hvorfor: "Greb, skuldre og kerne på én gang — og en af de øvelser, der forbrænder mest pr. minut uden at belaste knæet."

  # ---------- Kondition (uden stød) ----------
  cykel:
    navn: "Kondicykel eller crosstrainer"
    enhed: min
    saet: 1
    lo: 20
    hi: 40
    trin: 5
    grupper: [kondition]
    hvordan: "Sadlen så høj, at knæet er næsten strakt i bunden (for lav sadel gør ondt foran på knæet). Tempo så du kan tale i korte sætninger. Sidste 10 min: 30 sek hurtigt / 90 sek roligt."
    hvorfor: "Cykling er den kondition, knæet har det bedst med: hele bevægelsen uden et eneste stød, og den smører leddet. 30 minutter er ca. 250-350 kcal."
  skraagang:
    navn: "Gang op ad bakke på løbebånd"
    billede: Walking_Treadmill
    enhed: min
    saet: 1
    lo: 20
    hi: 40
    trin: 5
    grupper: [kondition]
    hvordan: "Stigning 6-10 %, 4,5-5,5 km/t. Hold ikke fast i håndtagene. Alternativ til cyklen, hvis knæet hellere vil gå."
    hvorfor: "Op ad bakke giver næsten lige så høj puls som løb, men uden landingen. Ned ad bakke er det hårde for knæet — og det slipper du for på et bånd."
  cykeltur:
    navn: "Cykeltur eller svømning"
    enhed: min
    saet: 1
    lo: 25
    hi: 50
    trin: 5
    grupper: [kondition]
    hvordan: "Ude på cyklen, eller i svømmehallen (crawl eller ryg — undgå brystsvømning, hvor benspark vrider knæet)."
    hvorfor: "Hjemme-udgaven af konditionspasset: samme forbrænding uden stød."

  # ---------- Weekend ----------
  langtur:
    navn: "Lang gåtur"
    enhed: km
    saet: 1
    lo: 4
    hi: 12
    trin: 1
    grupper: [gang]
    hvordan: "Rolig, jævn tur — skov, strand eller by. Gode sko. Gør knæet ondt over 3/10, så vend om; næste gang er turen kortere."
    hvorfor: "Én lang tur om ugen er en stor portion kalorier, som ikke gør dig sulten — og den viser over ugerne, hvor meget knæet kan tåle. Det er det bedste mål for, at det går fremad."

sessioner:
  daglig:
    navn: "Hver dag · knæ-basis"
    hvorfor: "Et knæ bliver bedre af lidt hver dag, ikke af én hård dag om ugen. 12 minutter hver dag holder lår og hofte tændt og brusken i bevægelse."
    type: daglig
    alle: [quad_spaend, benloeft, sidebenloeft, vaegsid, laegloeft, glutebro, gaatur]
  styrke_a:
    navn: "Styrke A — lår og skub"
    hvorfor: "Lårene er knæets støddæmpere og kroppens største forbrændingsovn. Skub-øvelserne holder på musklerne i overkroppen, mens du er i underskud."
    type: styrke
    fitness: [kasse_squat, benpres, baenkpres, kabelroning, planke]
    hjemme: [kasse_squat, armboejninger, roning_haandvaegt, planke]
  styrke_b:
    navn: "Styrke B — baglår, ryg og kerne"
    hvorfor: "Baglår og baller trænes med knæet næsten stille, og ryggen får sit eget pas. Det er holdningspasset, og knæet hviler mest på denne dag."
    type: styrke
    fitness: [rdl, stepup, lat_pulldown, facepulls, pallof, farmers]
    hjemme: [rdl, stepup, etbens_bro, roning_haandvaegt, deadbug]
  styrke_c:
    navn: "Styrke C — ét ben ad gangen"
    hvorfor: "Hver muskel to gange om ugen med hvile imellem giver mest. Øvelserne på ét ben finder og retter forskellen mellem det dårlige og det gode ben."
    type: styrke
    fitness: [splitsquat, benpres, baenkpres, roning_haandvaegt, sideplanke, deadbug]
    hjemme: [splitsquat, etbens_bro, armboejninger, sideplanke, deadbug]
  kondition:
    navn: "Kondition uden stød"
    hvorfor: "Pulsen op, kalorierne ud — uden at knæet skal tage et eneste stød. Cykel, crosstrainer, bakke-gang eller svømning: vælg det, knæet bedst kan lide."
    type: kondition
    fitness: [cykel, skraagang]
    hjemme: [cykeltur]
  langtur:
    navn: "Lang tur"
    hvorfor: "Ugens store kalorie-post og ugens test af knæet. Én gang om ugen, så det når at komme sig imellem."
    type: langtur
    alle: [langtur]

rotation: [styrke_a, styrke_b, styrke_c]

regler:
  styrke_max_pr_7_dage: 3
  kondition_max_pr_7_dage: 2
  langtur_min_dage_imellem: 6
  restitution_timer: 48          # mellem to pas for samme tunge muskelgruppe
  indkoering_dage: 10            # de første dage: højst 2 sæt og ingen stigning
  skaansom_smerte_score: 5       # ugens knæ-score ≥ dette (eller +2 på en uge) → skånsom uge
