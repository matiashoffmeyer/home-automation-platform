# Kost-planen. Læses af scripts/helbred.py (fanen Kost).
#
# REGNESTYKKET (laves automatisk ud fra profil.yaml og din seneste vejning):
#   hvilestofskifte (Mifflin-St Jeor) × aktivitet − underskud = dagens mål.
#   Eksempel: 100 kg, 182 cm, 35 år, mand → hvile ≈ 1 950 kcal × 1,5 ≈ 2 900
#   − 600 underskud ≈ 2 300 kcal/dag. Derefter styrer VÆGT-TRENDEN målet
#   (se `justering`): taber du for lidt over 2 uger, går målet ned; taber du
#   for hurtigt, går det op. Du skal ikke tælle selv — vej dig 2× om ugen.
#
# Måltiderne herunder er skrevet til ca. 2 100-2 200 kcal. Ligger dit mål langt
# fra, skriver siden selv hvad du skal lægge til eller skære fra. Ret gerne
# retterne til din egen hverdag — behold kcal/protein nogenlunde.

maal:
  kcal: auto            # eller et fast tal, fx 2200
  aktivitet: 1.5        # 1,4 = kontorjob + træning 3×/uge · 1,6 = fysisk job eller meget gang
  underskud: 600        # kcal pr. dag under forbruget ≈ 0,5 kg fedt om ugen
  protein_g: auto       # auto = 1,6 g pr. kg målvægt
  justering:
    min_tab: 0.25       # taber du mindre end dette pr. uge (over 2 uger) → −150 kcal
    max_tab: 1.0        # taber du mere end dette → +150 kcal (ellers går det ud over musklerne)
    trin: 150
    gulv: 1600          # målet går aldrig under dette (mand); kvinde: sæt 1300
  hvorfor: "Vægttab er et regnestykke: du taber dig, når du spiser lidt mindre, end du forbrænder — hver dag, i mange måneder. 500-600 kcal under forbruget er nok til et halvt kilo om ugen, og stadig så lidt, at du kan holde det ud. Proteinet sørger for, at det er fedtet og ikke musklerne der forsvinder."

# Hvert råd = {gør, hvorfor}. Siden viser hvorfor-linjen under rådet.
principper:
  - gør: "Protein i hvert måltid: 30-40 g. Skyr, hytteost, æg, kylling, fisk, magert kød, bønner og linser."
    hvorfor: "Protein mætter mere end noget andet pr. kalorie, og det beskytter musklerne under et vægttab. Uden nok protein er op til en tredjedel af de tabte kilo muskler — og så falder forbrændingen."
  - gør: "Halvdelen af tallerkenen grøntsager, en fjerdedel protein, en fjerdedel kartofler/ris/pasta/brød."
    hvorfor: "Grøntsager fylder i maven for meget få kalorier. Du spiser dig mæt uden at tælle, og du behøver ikke at droppe kartoflerne eller pastaen."
  - gør: "Spis på faste tider, 3 måltider + 1-2 planlagte mellemmåltider."
    hvorfor: "Det er de uplanlagte bidder — en håndfuld chips, en kage på jobbet — der æder underskuddet. Når næste måltid er lige om lidt, er det lettere at sige nej."
  - gør: "Mål olie og smør med en ske, i stedet for at hælde fra flasken."
    hvorfor: "1 spsk olie er 120 kcal. Et hæld fra flasken er nemt 3-4 skeer — det er et helt måltid, man ikke kan se."
  - gør: "Alkohol: højst 1-2 dage om ugen, og så 2-3 genstande."
    hvorfor: "En øl eller et glas vin er ca. 150 kcal, og kroppen forbrænder alkohol før fedt. Det værste er ofte maden bagefter, når viljestyrken er gået i seng."
  - gør: "Weekenden er en del af planen, ikke en pause fra den."
    hvorfor: "Et underskud på 600 kcal fem dage i træk forsvinder på én weekend med 1 500 kcal ekstra pr. dag. Det er tit dér, et vægttab går i stå — vægten fortæller det mandag."
  - gør: "Vægten står stille en uge? Fortsæt uændret. Kalorie-målet retter sig selv efter 2 uger."
    hvorfor: "Væske kan skjule et fedttab i 1-2 uger, især når du er begyndt at styrketræne. Det er trenden over flere uger, der tæller — og den regner siden ud for dig."

drikke:
  - gør: "Vand, danskvand, kaffe og te frit."
    hvorfor: "Ingen kalorier. Tørst forveksles let med sult, så et stort glas vand før maden hjælper."
  - gør: "Sodavand og juice: kun light-udgaven."
    hvorfor: "En halv liter sodavand er 200 kcal, som slet ikke mætter. Det er den nemmeste besparelse i hele planen."
  - gør: "Mælk i kaffen er fint; kaffe-latte og kakao tæller som et mellemmåltid."
    hvorfor: "En stor latte er 200-250 kcal. Ikke forbudt — bare noget der skal regnes med."

snacks:
  - gør: "Skyr eller hytteost med bær."
    hvorfor: "20 g protein for 150 kcal. Mætter i timevis."
  - gør: "Gulerødder, agurk, peberfrugt — gerne med 2 spsk hummus."
    hvorfor: "Noget at tygge på for næsten ingen kalorier, når sulten kommer om eftermiddagen."
  - gør: "Et stykke frugt + en lille håndfuld nødder (20 g)."
    hvorfor: "Fibre og fedt holder blodsukkeret stabilt til aftensmaden. Hold dig til én håndfuld — nødder er sunde, men 100 g er 600 kcal."
  - gør: "Kogte æg i køleskabet."
    hvorfor: "Klar på 10 sekunder, 70 kcal og 6 g protein pr. stk."

tilskud:
  - gør: "D-vitamin 10 µg dagligt oktober-april."
    hvorfor: "Fra oktober til april er solen i Danmark for svag til, at huden laver D-vitamin. Sundhedsstyrelsen anbefaler det til alle; det er vigtigt for knogler og muskler."
  - gør: "Proteinpulver kun hvis du ikke når proteinmålet med mad."
    hvorfor: "Det er bare mad i pulverform — praktisk, men ikke nødvendigt. Skyr og hytteost gør det samme."

maaltider:
  hverdag:
    - id: morgen
      tid: "07:00 morgen"
      hvad: "Havregryn (50 g) med skummetmælk, en håndfuld bær og 150 g skyr — eller 2 skiver rugbrød med 2 æg og tomat."
      hvorfor: "Protein og fibre om morgenen holder dig mæt til frokost og tager toppen af lysten til kage kl. 10."
      kcal: 450
      protein: 30
    - id: frokost
      tid: "12:00 frokost"
      hvad: "3 halve rugbrød: magert pålæg (kylling, kalkun, æg, makrel, hytteost) + rigeligt grønt ved siden af. I kantinen: én hovedret, halv tallerken salat, ingen dressing-sø."
      hvorfor: "Rugbrød og grønt fylder maven for få kalorier, og proteinet holder dig mæt resten af eftermiddagen."
      kcal: 550
      protein: 35
    - id: eftermiddag
      tid: "15:00 mellemmåltid"
      hvad: "Skyr med bær, eller et stykke frugt + en lille håndfuld nødder. Efter træning: et glas mælk eller en proteinbar."
      hvorfor: "Planlagt mad om eftermiddagen er det, der forhindrer den store sult før aftensmaden — der hvor de fleste spiser for meget."
      kcal: 250
      protein: 20
    - id: aftensmad
      tid: "18:00 aftensmad"
      hvad: "Familiens ret, men: halvdelen af tallerkenen grønt, en håndfuld kartofler/ris/pasta, en håndfladestor portion kød, fisk eller kylling. Fisk 2× om ugen."
      hvorfor: "Ingen særret — det skal kunne holde i måneder. Tallerken-reglen gør portionen mindre uden at du skal veje noget."
      kcal: 650
      protein: 40
    - id: aften
      tid: "20:30 aften (valgfri)"
      hvad: "Hytteost eller skyr, eller en kop te og et stykke frugt."
      hvorfor: "Aftenen foran tv'et er dér, hvor chips og slik sniger sig ind. En planlagt, lille snack er nemmere end at sige nej til alt."
      kcal: 200
      protein: 20
  weekend:
    - id: morgen
      tid: "09:00 morgen"
      hvad: "Røræg af 3 æg med grønt, 1 stykke rugbrød, kaffe. Eller weekend-brunch: hold dig til ét stykke brød og fyld op med æg, frugt og skyr."
      hvorfor: "Weekend-morgenmaden må gerne være hyggelig. Æggene mætter så længe, at frokosten kan blive lille."
      kcal: 500
      protein: 30
    - id: frokost
      tid: "13:00 frokost"
      hvad: "Rester fra i går, eller en stor salat med kylling/tun/æg og bønner."
      hvorfor: "Nemt og proteinrigt — weekend-frokosten er der, hvor det ellers bliver toast og pølser."
      kcal: 500
      protein: 35
    - id: eftermiddag
      tid: "16:00 mellemmåltid"
      hvad: "Frugt eller skyr. Kage hos nogen? Ét stykke — og så nyd det."
      hvorfor: "Planen skal kunne holde et socialt liv ud. Ét stykke kage er 300 kcal; det er hele kagefadet, der vælter ugen."
      kcal: 250
      protein: 15
    - id: aftensmad
      tid: "18:30 aftensmad"
      hvad: "Gerne noget godt — men tallerken-reglen gælder også fredag. Pizza/burger: spis én portion og en salat i stedet for to portioner."
      hvorfor: "Weekenden skal ikke være en straf, men den skal heller ikke æde ugens underskud."
      kcal: 700
      protein: 40
    - id: aften
      tid: "21:00 aften (valgfri)"
      hvad: "Skyr med bær, popcorn (en skål, 30 g majs) eller 2 genstande."
      hvorfor: "Noget at hygge sig med, som er planlagt — og regnet med."
      kcal: 200
      protein: 10

# Indkøbsliste pr. uge (vises på Kost-fanen).
indkoeb:
  - {navn: "Skyr/hytteost", uge1: 3, uge2: 6, enhed: "kg"}
  - {navn: "Æg", uge1: 15, uge2: 30, enhed: "stk"}
  - {navn: "Havregryn", uge1: 0.5, uge2: 1, enhed: "kg"}
  - {navn: "Rugbrød", uge1: 2, uge2: 4, enhed: "stk"}
  - {navn: "Kyllingebryst/magert kød", uge1: 1, uge2: 2, enhed: "kg"}
  - {navn: "Fisk (laks, torsk, makrel)", uge1: 0.5, uge2: 1, enhed: "kg"}
  - {navn: "Frosne bær", uge1: 1, uge2: 2, enhed: "kg"}
  - {navn: "Grøntsager", uge1: 4, uge2: 8, enhed: "kg"}
  - {navn: "Frugt", uge1: 10, uge2: 20, enhed: "stk"}
