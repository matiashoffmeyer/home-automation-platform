# Din profil. Læses af scripts/helbred.py. Udfyld alt der står UDFYLD, og kør
# derefter:  python3 /config/scripts/helbred.py tjek   (skal svare "ok").

foedt: UDFYLD                   # fødselsår, fx 1990
hoejde_cm: UDFYLD               # fx 182
koen: mand                      # mand | kvinde (bruges kun til kalorie-udregningen)
vaegt_kg: UDFYLD                # din vægt i dag, fx 98.5 (startpunkt indtil du har vejet dig)
maalvaegt_kg: UDFYLD            # hvor du vil ende, fx 85 — protein-målet regnes ud fra den
start_dato: UDFYLD              # dag 1 i programmet, fx 2026-12-01 (skriv uden anførselstegn)

# Telefonen der skal have påmindelser: Udviklerværktøjer → Handlinger → søg
# "notify.mobile_app_" og skriv det der står efter "notify.".
notify: UDFYLD                  # fx mobile_app_pixel_8

# Milepæle på vægt-grafen (kg), fx [95, 90, 85]. Tom liste = ingen.
milepaele_kg: []

# Forventet tab pr. uge (negativ = tab). Bruges til den stiplede kurve og til
# ugens vurdering. ~0,5 kg/uge er hurtigt nok til at kunne ses, og langsomt nok
# til at du beholder musklerne og ikke bliver sulten hele tiden.
forventet_kg_uge: {foerste_12_uger: -0.5, derefter: -0.35}

# Hvilke ugedage du træner i fitnesscenter (0 = mandag … 6 = søndag). De andre
# dage viser siden hjemme-udgaven af passet. Kan altid skiftes på Træning-fanen.
fitness_dage: [0, 1, 2, 3, 4]
sted_navne: {fitness: "Fitness", hjemme: "Hjemme"}

# Det led der følges med en ugentlig score 0-10. Stiger scoren, bliver næste
# uge automatisk skånsom (se program.yaml → regler).
smerte: {navn: "Knæ"}

# Påmindelser (dage: 0 = mandag … 6 = søndag).
paamindelser:
  vaegt:      {dage: [0, 3], tid: "07:00", min_dage: 2}   # + altid på start_dato
  program:    {dage: [0, 1, 2, 3, 4, 5, 6], tid: "07:30"}
  traening:   {hverdag: "16:00", weekend: "10:30"}
  smerte:     {dage: [6], tid: "18:00"}
  maal:       {hver_n_uger: 4, tid: "09:30"}               # første gang på start_dato
  vurdering:  {dage: [6], tid: "19:30"}

# Kropsmål med målebånd hver 4. uge. Taljen er det vigtigste: vægten kan stå
# stille i en uge hvor du taber fedt og tager muskler på — taljen lyver ikke.
maalinger:
  - {id: talje,   navn: "Talje (ved navlen, efter udånding)"}
  - {id: hofte,   navn: "Hofte (bredeste sted over ballerne)"}
  - {id: bryst,   navn: "Bryst (over brystvorterne, efter udånding)"}
  - {id: laar,    navn: "Lår (midt på, det dårlige ben)"}
  - {id: laar2,   navn: "Lår (midt på, det gode ben)"}
