# Spørgsmål — vises på Historik-fanen, indtil de er besvaret. Svarene gemmes i
# log/svar.jsonl og vises nederst på Historik. Brug dem til at rette
# program.yaml (fx dybde, øvelser du skal springe over) og historik.md.
# type: tekst | tal | valg
- id: hvilket_knae
  tekst: "Hvilket knæ gør ondt?"
  type: valg
  valg: ["Højre", "Venstre", "Begge"]
- id: diagnose
  tekst: "Har en læge eller fysioterapeut sagt, hvad der er galt med knæet (fx slidgigt, menisk, korsbånd, knæskal)? Er du opereret?"
  type: tekst
- id: hvor
  tekst: "Hvor sidder smerten?"
  type: valg
  valg: ["Foran / omkring knæskallen", "Indersiden", "Ydersiden", "Bag i knæhasen", "Hele knæet", "Skifter"]
- id: vaerst
  tekst: "Hvad gør knæet værst: trapper ned, trapper op, at sidde længe, at sætte sig på hug, løb, at gå langt?"
  type: tekst
- id: haevelse
  tekst: "Bliver knæet hævet eller låser/svigter det nogensinde?"
  type: valg
  valg: ["Aldrig", "Hævet efter belastning", "Det låser eller giver efter", "Begge dele"]
- id: forbudt
  tekst: "Har du fået at vide, at der er øvelser eller sport du ikke må?"
  type: tekst
- id: fitness
  tekst: "Har du adgang til et fitnesscenter? Hvilke dage kommer du realistisk derhen?"
  type: tekst
- id: kost_nu
  tekst: "Hvad spiser du en typisk hverdag nu (morgen, frokost, aften, snacks, drikke)?"
  type: tekst
