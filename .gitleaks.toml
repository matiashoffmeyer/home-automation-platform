# gitleaks configuration: the default ruleset plus the credential shapes this
# platform actually has. Measured against this repository's own history, the
# default rules found none of its three historical leaks; each rule below is
# there because it catches one of them (the positive controls).
#
# gitleaks is the second gate. The first is scripts/secrets_contract.py (no
# live credential value in a tracked file) and, for the public export, an
# exact-value denylist; a pattern scanner cannot know a home's own values.

title = "home-automation-platform"

[extend]
useDefault = true

[[rules]]
id = "url-embedded-credentials"
description = "User and password embedded in a URL (rtsp://user:pass@host)"
regex = '''(?i)\b[a-z][a-z0-9+.-]{1,15}://[^\s/:@'"<>{}]{1,64}:([^\s/@'"<>{}]{3,128})@[a-z0-9.-]+'''
secretGroup = 1
keywords = ["://"]

  [[rules.allowlists]]
  description = "Placeholders in secrets.example.yaml and the docs"
  regexTarget = "secret"
  regexes = ['''^(password|pass|secret|changeme|xxx+|\*+)$''']

[[rules]]
id = "google-sheet-id-assignment"
description = "A Google Sheets id assigned in code or config: a link-shared sheet is readable by anyone holding it"
regex = '''(?i)sheet_?id["']?\s*[:=]\s*["']([A-Za-z0-9_-]{40,50})["']'''
secretGroup = 1
keywords = ["sheet"]

[[rules]]
id = "google-apps-script-url"
description = "Deployed Apps Script web app: the URL is the credential"
regex = '''script\.google\.com/macros/s/([A-Za-z0-9_-]{20,})'''
secretGroup = 1
keywords = ["script.google.com"]

[[rules]]
id = "home-assistant-long-lived-token"
description = "Home Assistant long-lived access token (a JWT)"
regex = '''\beyJ[A-Za-z0-9_-]{15,}\.eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{20,}'''
keywords = ["eyj"]
