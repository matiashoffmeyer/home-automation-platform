script:
  push_notify:
    alias: "🔔 Push Notify (central dispatch)"
    icon: mdi:cellphone-message
    mode: parallel
    max: 25
    fields:
      notif_id:
        description: "Type-nøgle (fx batteri, vejr, vandlaek)"
        required: true
      title:
        description: "Titel"
        required: true
      message:
        description: "Besked"
        required: true
      payload:
        description: "Valgfri mobile-app data (tag/timeout/actions)"
        required: false
      kritisk:
        description: >-
          Sæt true når varslet melder at HUSET SELV er i stykker. Springer KUN
          AirBnB-gaten over (2b) — master, per-type enable og tidsvindue gælder
          stadig. Fejlklasse #21: en støj-beslutning om gæste-privatliv må ikke
          kunne slukke for husets evne til at sige at det er blevet blindt.
        required: false
    variables:
      ndata: "{{ payload if payload is defined and payload else {} }}"
      # Valgfrit script-felt = UDEFINERET hvis ikke sendt med, og | bool(false)
      # redder det IKKE (Jinja-gotcha) → eksplicit is defined-test.
      er_kritisk: "{{ kritisk if kritisk is defined else false }}"
      # gate_ok -> "True"/"False" streng; bool-castes i condition.
      # SPEJLET i scripts/plant_notify.py::deliverable_now (notif_id=planter) —
      # ret BEGGE hvis du ændrer gate-betingelserne (fejlklasse #2, B66-fix).
      # NB `kritisk` er bevidst IKKE spejlet: planter kalder aldrig med det, så
      # spejlets adfærd er uændret.
      gate_ok: >
        {% set nid = notif_id %}
        {% if not is_state('input_boolean.notifikationer_master_enabled', 'on') %}False
        {% elif not is_state('input_boolean.notif_' ~ nid ~ '_enabled', 'on') %}False
        {% elif is_state('input_select.house_mode', 'AirBnB')
              and not er_kritisk
              and not is_state('input_boolean.notif_' ~ nid ~ '_airbnb', 'on') %}False
        {% else %}
          {% set sh = state_attr('input_datetime.notif_' ~ nid ~ '_start', 'hour') %}
          {% set sm = state_attr('input_datetime.notif_' ~ nid ~ '_start', 'minute') %}
          {% set eh = state_attr('input_datetime.notif_' ~ nid ~ '_slut', 'hour') %}
          {% set em = state_attr('input_datetime.notif_' ~ nid ~ '_slut', 'minute') %}
          {% if sh is none or eh is none %}True
          {% else %}
            {% set nowm = now().hour * 60 + now().minute %}
            {% set s = sh * 60 + sm %}
            {% set e = eh * 60 + em %}
            {% if s == e %}True
            {% elif s < e %}{{ s <= nowm < e }}
            {% else %}{{ nowm >= s or nowm < e }}{% endif %}
          {% endif %}
        {% endif %}
      # hjemkomst-kø-gate (notif_hjemme.yaml): defensiv mod manglende toggle
      # (missing entity -> 'unknown' -> ingen defer = historisk adfærd).
      wait_home: "{{ states('input_boolean.notif_' ~ notif_id ~ '_hjemme') == 'on' }}"
      # targets = CSV af notify-service-suffikser (tom = ingen telefon valgt).
      targets: >
        {% set nid = notif_id %}
        {% set ns = namespace(t=[]) %}
        {% if is_state('input_boolean.notif_' ~ nid ~ '_parent_a', 'on') %}{% set ns.t = ns.t + ['mobile_app_phone_a'] %}{% endif %}
        {% if is_state('input_boolean.notif_' ~ nid ~ '_parent_b', 'on') %}{% set ns.t = ns.t + ['mobile_app_phone_b'] %}{% endif %}
        {{ ns.t | join(',') }}
    sequence:
      - condition: template
        value_template: "{{ (gate_ok | trim | bool) and (targets | trim | length) > 0 }}"
      - repeat:
          for_each: "{{ (targets | trim).split(',') }}"
          sequence:
            - choose:
                # Hjemkomst-kø: pr. MODTAGER — personens GPS væk => kø i stedet
                # for send. unknown/unavailable regnes som hjemme (brudt GPS må
                # ikke sluge varsler). Zone-navne (arbejde mv.) = væk.
                - conditions:
                    - condition: template
                      value_template: >
                        {{ wait_home and states(
                             {'mobile_app_phone_a': 'person.parent_a',
                              'mobile_app_phone_b': 'person.parent_b'
                             }.get(repeat.item, '')
                           ) not in ['home', 'unknown', 'unavailable'] }}
                  sequence:
                    - service: shell_command.notif_koe_append
                      data:
                        payload_b64: >-
                          {{ {'nid': notif_id, 'target': repeat.item,
                              'title': title, 'message': message,
                              'payload': ndata} | to_json | base64_encode }}
              default:
                - service: "notify.{{ repeat.item }}"
                  data:
                    title: "{{ title }}"
                    message: "{{ message }}"
                    data: "{{ ndata }}"
