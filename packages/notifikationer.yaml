# =============================================================================
# Notifikationer — central push-dispatch + per-type telefon/tid-styring
# =============================================================================
# Sprint 2026-07-12 (user-spec): "lav en tab hvor jeg kan toggle alle
# notifikationer til tlf, styre hvilke telefoner der får dem, og hvornår."
#
# ARKITEKTUR: ALLE push til telefon går nu gennem script.push_notify.
# Kald: script.push_notify(notif_id, title, message [, payload]). Scriptet:
#   1) master-kontakt (notifikationer_master_enabled) OFF  -> intet.
#   2) per-type enable (notif_<id>_enabled) OFF             -> intet.
#   2b) AirBnB-mode + notif_<id>_airbnb OFF                 -> intet.
#      (per 2026-07-16, user-spec: "tilvælg notifikationer under AirBnB" —
#       toggle ON = typen sendes OGSÅ mens huset er i AirBnB-mode. Defaults
#       bevarer historisk adfærd: dug+vejr OFF (var hårdt gated i deres
#       automations), alt andet ON (pushede allerede i AirBnB).)
#      UNDTAGELSE `kritisk: true` (2026-09-09e, B118): varsler om at HUSET SELV
#      er gået i stykker springer 2b over. En støj-beslutning om gæste-privatliv
#      må ikke kunne slukke for husets evne til at melde sin egen blindhed
#      (fejlklasse #21) — netop i AirBnB er der ingen beboer til at opdage det.
#   3) tidsvindue notif_<id>_start -> _slut: uden for       -> intet.
#      start == slut  =>  ALTID (24/7). Fresh-install 00:00/00:00 = altid.
#   4) router til valgte telefoner (notif_<id>_parent_a / _parent_b).
#   5) hjemkomst-kø (2026-07-18, packages/notif_hjemme.yaml): er
#      notif_<id>_hjemme ON og modtagerens GPS ikke hjemme, køes den
#      telefons kopi (scripts/notif_queue.py) og leveres ved ankomst.
# payload = valgfri mobile-app data (tag/timeout/actions) — sendes UÆNDRET.
#
# ⛔️ RULLET TILBAGE 2026-07-30 (samme dag): auto-`sticky` på spørgsmåls-pushes.
# Forsøget var at redde svaret når man trykker på selve beskeden (Android åbner
# bare appen og sluger notifikationen). Løsningen satte `sticky: true` på enhver
# push MED `actions` — på antagelsen om at companion-appen selv rydder den når
# en SVAR-KNAP trykkes. Den antagelse er FALSK: `sticky` sætter
# `setAutoCancel(false)`, og appens action-modtager rydder netop via autoCancel,
# så notifikationen blev liggende uændret efter et svar. Facit fra samme dags
# history: mad-stemme-automationen fyrede 16 gange på 84 sekunder (18:16:19 →
# 18:17:43) — hvert tryk registrerede en stemme, men brugeren så intet ske og
# trykkede videre. Nettoresultatet var værre end problemet: "jeg kan slet ikke
# svare på options i notifikationer nu". Vil nogen prøve igen: en ACK med samme
# `tag` er IKKE nok bevis for at rydningen virker — verificér på en fysisk
# telefon (fejlklasse #6) før sticky sættes husdækkende, og husk at iOS ikke har
# nogen sticky-pendant overhovedet (dér er langt tryk vejen til knapperne).
#
# 2 rigtige telefoner (verificeret live 2026-07-12):
#   Parent A  = notify.mobile_app_phone_a
#   Parent B = notify.mobile_app_phone_b
#
# Jinja-sikkerhed (jf. CLAUDE.md fejlklasser): targets holdes som CSV-streng
# og splittes først i entity-target (>-foldede vars bliver strenge, ikke lister).
# Snapshot: helpers_export.py fanger notif_*-booleans + notif_*-datetimes.
# =============================================================================

