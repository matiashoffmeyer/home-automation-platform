# =============================================================================
# SOVE-RADIATOR-SPØGELSET — B269 (2026-10-31, user-valg "b")
# =============================================================================
# User 31/10: "kan være varme fra en radiator, passer nogenlunde" (~2,1 m fra
# Apolloen). Om morgenen, når radiatoren varmer, holder sove-Apolloen et
# still-mål på 200-219 cm i op til 1 t 40 min efter at sengen er tømt
# (27/10 06:12→07:52, 31/10 06:25:51→07:31:14).
#
# SIGNATUREN (målt 26-31/10, 5 døgn, still_distance er recorder-included):
#   rullende 5 min: p25 ≥ 196 cm, p75 ≤ 228 cm, p75 − p25 ≤ 9 cm, ≥ 120 samples.
#   → træf KUN morgener 06:07-07:33; 0 træf 00-05 (sovende på samme afstand:
#     IQR p50 15 cm, 57 samples/5 min — radiatoren 7 cm, 201 samples).
# MEN signaturen ramte også mens én stadig lå i sengen (27/10 06:07-06:13,
# 28/10, 29/10 — sengetæller 1): radaren melder ÉT still-mål = det stærkeste,
# og radiatoren overdøver en stille sovende længere inde. Signaturen betyder
# "radaren ser radiatoren", ALDRIG "tomt" → den tæller kun som tomt sammen med
# sengetællerens 0 (user-valg b: "kun når sengetælleren også er 0").
#
#
# 2026-11-01 (bug-hunt, B283): sengetællerens 0 er ikke nok alene — UD tæller
# også en INDgang som −1 (1/11 09:15:39: entré → tomt rum → −1, rummet optaget
# 2 t bagefter). Spøgelset kræver derfor også at tællingen der gav 0 kom ≤ 150 s
# efter en bevist udgang fra sengen (`sove_seng_til_doer`-pulsen, målt 60-97 s
# før −1'et ved de tre udgange 1/11; ingen puls ved indgangen) eller et facit-0.
# Kan kun gøre spøgelset SJÆLDNERE (= gammel adfærd: rummet tæller som optaget).
#
# FORBRUGERE af `binary_sensor.sovevaerelse_optaget_reelt` (kun "er rummet
# tomt om morgenen"-veje): morning_lights_sanity_check (empty), morning_curtains
# backstop, hoejttaler_radio (én voksen oppe). Tænd-veje og nat-logik læser
# fortsat den rå occupancy — de skal SE en sovende. (2026-11-22: de to radar-
# tænd-veje kræver desuden `binary_sensor.sove_bevaegelse_bevist`, nederst.)
# =============================================================================

sensor:
  # To percentiler over samme vindue; antal samples = buffer_usage_ratio ×
  # sampling_size (attribut på p25). Recorder-ekskluderet (configuration.yaml):
  # de skifter ved hvert sample.
  - platform: statistics
    name: "Sove still afstand p25"
    unique_id: sove_still_afstand_p25
    entity_id: sensor.sovevaerelse_apollo_radar_still_distance
    state_characteristic: percentile
    percentile: 25
    sampling_size: 600
    max_age:
      minutes: 5
    precision: 0
  - platform: statistics
    name: "Sove still afstand p75"
    unique_id: sove_still_afstand_p75
    entity_id: sensor.sovevaerelse_apollo_radar_still_distance
    state_characteristic: percentile
    percentile: 75
    sampling_size: 600
    max_age:
      minutes: 5
    precision: 0

input_datetime:
  # Skrevet stempel (#5 — last_changed nulstilles ved restart). Skrives af
  # stempel-automationen nedenfor og af facit-scriptet ved 0
  # (packages/sove_seng_taeller.yaml).
  sove_seng_udgang_bevist:
    name: "Sengetæller: sidste beviste udgang fra sengen"
    has_date: true
    has_time: true

automation:
  - id: sove_seng_udgang_bevist_stempel
    alias: "Sengetæller: stempl bevist udgang fra sengen"
    mode: queued
    max: 5
    trigger:
      # from: "off" — en template-reload giver unavailable → off/on (b103).
      - platform: state
        entity_id: binary_sensor.sove_seng_til_doer
        from: "off"
        to: "on"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sove_seng_udgang_bevist
        data:
          timestamp: "{{ as_timestamp(now()) | int }}"

template:
  - binary_sensor:
      # 2026-10-31: SIGNATUREN alene (hele døgnet, uden sengetælleren) —
      # delt ud så projektor-rum-gættet (sensor.moerklaegning_scope_rum,
      # packages/dark_mode.yaml) kan vægte sove-presence ned om aftenen, hvor
      # radiatoren holdt sove optaget 31/10 19:30-20:51 (~210-219 cm). Én
      # definition af signaturen (#2); spøgelset nedenfor = signatur + 04-12 +
      # sengetæller 0.
      - name: "Sove radiator signatur"
        unique_id: sove_radiator_signatur
        icon: mdi:radiator
        state: >-
          {% set p25 = states('sensor.sove_still_afstand_p25') %}
          {% set p75 = states('sensor.sove_still_afstand_p75') %}
          {% set n = (state_attr('sensor.sove_still_afstand_p25', 'buffer_usage_ratio') | float(0)) * 600 %}
          {{ p25 | is_number and p75 | is_number
             and p25 | float >= 196 and p75 | float <= 228
             and (p75 | float - p25 | float) <= 9
             and n >= 120 }}

      # Radiator-signaturen OG ingen i sengen (sengetælleren aktiv og på 0,
      # og det 0 kom fra en bevist udgang — se hovedet). Kun 04-12: signaturen
      # er kun målt om morgenen.
      - name: "Sovevaerelse radiator spoegelse"
        unique_id: sovevaerelse_radiator_spoegelse
        icon: mdi:radiator
        state: >-
          {% set talt = state_attr('input_datetime.sove_seng_sidst_talt', 'timestamp') | float(0) %}
          {% set bevist = state_attr('input_datetime.sove_seng_udgang_bevist', 'timestamp') | float(0) %}
          {{ 4 <= now().hour < 12
             and is_state('binary_sensor.sove_radiator_signatur', 'on')
             and is_state('input_boolean.sove_seng_taeller_enabled', 'on')
             and states('input_number.sove_seng_personer') | is_number
             and states('input_number.sove_seng_personer') | int(1) == 0
             and bevist > 0 and -10 <= (talt - bevist) <= 150 }}
        attributes:
          p25: "{{ states('sensor.sove_still_afstand_p25') }}"
          p75: "{{ states('sensor.sove_still_afstand_p75') }}"
          nul_bevist: >-
            {% set talt = state_attr('input_datetime.sove_seng_sidst_talt', 'timestamp') | float(0) %}
            {% set bevist = state_attr('input_datetime.sove_seng_udgang_bevist', 'timestamp') | float(0) %}
            {{ bevist > 0 and -10 <= (talt - bevist) <= 150 }}

      # Soveværelset optaget, minus radiator-spøgelset. Kun til "tomt"-veje.
      - name: "Sovevaerelse optaget reelt"
        unique_id: sovevaerelse_optaget_reelt
        icon: mdi:bed
        device_class: occupancy
        availability: >-
          {{ states('binary_sensor.sovevaerelse_apollo_occupancy') in ['on', 'off'] }}
        state: >-
          {{ is_state('binary_sensor.sovevaerelse_apollo_occupancy', 'on')
             and not is_state('binary_sensor.sovevaerelse_radiator_spoegelse', 'on') }}

  # 2026-11-22 (user-valg "a) ja, altid" om 21/11 19:36: "der var ikke først
  # move der blev til still"): et soveværelses-ophold tæller først som et
  # MENNESKE når der er BEVIST bevægelse i det — moving holdt ≥ 2,5 s, eller et
  # nyt moving-udslag ≤ 15 s efter det forrige sluttede. Latchen holder til
  # occupancy slipper (opholdet er slut) og nulstilles ved HA-start (den sikre
  # retning: næste bevægelse beviser igen). Forbrugere = de to radar-tænd-veje:
  # presence_light_sovevaerelse_on (cold start, automations/presence_sovevaerelse.yaml)
  # og presence_lux_sovevaerelse_on (automations/presence_lights.yaml) — SAMME
  # regel begge steder (#2). Upgrade af gang-pre-lyset kræver den ikke.
  #
  # MÅLT 9-22/11 (moving_target er ikke i recorderen → `sove_bevaegelse_mens_
  # lys_taendt`, + ~0,6 s før lyset tændte): spøgelset 21/11 = ÉT udslag på
  # ~2,1 s i SAMME sekund som still, intet mere i 62 min. 11 ægte still-
  # koldstarter: korteste holdte udslag ~3,1 s; 9 bevist ≤ ~2,5 s efter første
  # bevægelse, 20/11 20:00 efter 7,8 s, 9/11 19:52 efter 12 s (andet udslag
  # 1,1-2,1 s efter det første sluttede). Udslagene er kvantiseret i ~1 s-trin
  # (1,0 / 2,1 / 3,1 s) → 2,5 s ligger midt mellem spøgelsets og den korteste
  # ægte. Ingen bevægelse overhovedet (15/11 09:04 på radiator-afstanden
  # 206-212 cm, 9/11 10:50) = ingen tænd. Pris: still-koldstarten (før +0,5 s)
  # kommer nu typisk ~2,5 s efter første bevægelse.
  # Kendt hul efter genstart/genforbindelse: et moving-udslag ≤ 15 s efter at
  # ESPHome-noden kom tilbage tæller som "andet udslag" (from_state.last_changed
  # = genforbindelsen). Én blip i det vindue; accepteret.
  # Kendt hul 2 (#25): latchen slipper først når occupancy gør. Står spøgelset
  # videre efter at et BEVIST menneske gik, holder latchen — samme adfærd som
  # før 22/11 (tom-vejene ovenfor + no-motion-watchdoggen ejer det tilfælde).
  - trigger:
      - platform: state
        entity_id: binary_sensor.sovevaerelse_apollo_radar_moving_target
        from: "off"
        to: "on"
        for:
          milliseconds: 2500
        id: holdt
      - platform: state
        entity_id: binary_sensor.sovevaerelse_apollo_radar_moving_target
        from: "off"
        to: "on"
        id: kant
      - platform: state
        entity_id: binary_sensor.sovevaerelse_apollo_occupancy
        not_to: "on"
        id: tom
      - platform: homeassistant
        event: start
        id: tom
    binary_sensor:
      - name: "Sove bevaegelse bevist"
        unique_id: sove_bevaegelse_bevist
        icon: mdi:walk
        state: >-
          {% set f = trigger.from_state if trigger.id == 'kant' else none %}
          {% if trigger.id == 'tom' %}{{ false }}
          {% elif trigger.id == 'holdt' %}{{ true }}
          {% elif f is not none and (now() - f.last_changed).total_seconds() <= 15 %}{{ true }}
          {% else %}{{ this.state == 'on' }}{% endif %}
        attributes:
          # Hvordan opholdet blev bevist (holdt/gentaget) — sat på off→on, kun til fejlsøgning.
          bevis: >-
            {% set f = trigger.from_state if trigger.id == 'kant' else none %}
            {% set gentaget = f is not none and (now() - f.last_changed).total_seconds() <= 15 %}
            {% if trigger.id == 'tom' %}
            {% elif this.state != 'on' and (trigger.id == 'holdt' or gentaget) %}{{ 'holdt' if trigger.id == 'holdt' else 'gentaget' }}
            {% else %}{{ this.attributes.bevis | default('') }}{% endif %}
