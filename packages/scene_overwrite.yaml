# =============================================================================
# Scene Overwrite — "gem nuværende lys som scene" (per 2026-05-31)
# =============================================================================
# Dashboard "Overskriv"-knap på Scener-siden kalder script.scene_overwrite
# (script_pkg/scene_overwrite.yaml), som her kører python-capture-scriptet.
#
# scripts/scene_overwrite.py læser current state for scenens lys + gardiner
# og skriver scene_snapshots/snap_<name>.yaml. Bagefter scene.reload (i
# script-wrapperen) så scene.snap_<name> bliver live uden HA-restart.
#
# Sikkerhed: HA escaper template-argumentet; python-scriptet whitelister
# scene-navnet (exit hvis ukendt) → ingen vilkårlig kommando-eksekvering.
# =============================================================================

shell_command:
  # scene = whitelistet navn, payload = base64(JSON) med live states (bygget i
  # script.scene_overwrite's Jinja). base64 har ingen mellemrum/shell-tegn → ét
  # sikkert argv-token. python whitelister scene + afkoder payload. openplan =
  # base64(JSON-liste) af open-plan-lysene (2026-10-03) → afledt snap_<name>_openplan.
  scene_overwrite: "python3 /config/scripts/scene_overwrite.py {{ scene }} {{ payload }} {{ openplan | default('') }}"
