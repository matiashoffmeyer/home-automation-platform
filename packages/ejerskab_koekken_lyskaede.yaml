# GENERERET af scripts/ejerskab.py fra ejerskab/koekken_lyskaede.yaml — RET IKKE HER. Ret registret og kør `python3 scripts/ejerskab.py gen`.

# Ejer af light.koekken_lyskaede: højeste aktive krav i registret vinder, ellers 'hus'
# (= husets mål via enforceren). Rækkefølgen i registret ER prioriteten.
template:
  - sensor:
      - name: "Koekken lyskaede ejer"
        unique_id: koekken_lyskaede_ejer
        icon: mdi:crown
        state: >-
          {%- if (is_state('input_boolean.roegalarm_blink_active', 'on')) -%}roegalarm
          {%- elif (is_state('input_boolean.noedlys_aktiv', 'on')) -%}noedlys
          {%- elif (states('input_text.koekken_gestus_alarm').startswith('aktiv')) -%}timer_alarm
          {%- elif ((state_attr('automation.vejr_varsel_regn_bla_glimt_vind_hvid_blink_morgen_20min', 'current') | int(0)) > 0 or (state_attr('automation.vejr_varsel_aften_blink_push_for_nattens_vejr_16_30_17_00_18_30', 'current') | int(0)) > 0) -%}vejrvarsel
          {%- elif (is_state('input_boolean.dance_room_koekken', 'on') and (is_state('input_boolean.dance_mode', 'on') or states('input_select.dance_manual_event') not in ['off', 'unknown', 'unavailable', ''])) -%}dance
          {%- elif (is_state('input_boolean.cirkus_active', 'on')) -%}cirkus
          {%- elif ((state_attr('automation.legetojsdag_disko_varsel_forste_abne_fredag_i_maneden_efter_vejrvarsler', 'current') | int(0)) > 0) -%}legetoejsdag
          {%- elif (states('input_text.koekken_lyskaede_preview') in ['taendt', 'slukket']) -%}farve_preview
          {%- elif (is_state('input_boolean.styrbar_lr_holding_stue', 'on')) -%}styrbar_farveloop
          {%- elif (not is_state('binary_sensor.koekken_madlavningslys', 'on') and (is_state('binary_sensor.koekken_lyskaede_scene_laan', 'on') or is_state('input_boolean.open_plan_fuldt_lys', 'on') or (is_state('light.koekken_lyskaede', 'on') and (states('input_text.koekken_lyskaede_haand_ts') | int(0)) >= (as_timestamp(states.light.koekken_lyskaede.last_changed, 0) | int(0))))) -%}haand
          {%- elif (is_state('input_boolean.airbnb_velkomst_active', 'on')) -%}velkomst
          {%- elif (is_state('binary_sensor.sofa_zen_laaner_kaeden', 'on')) -%}sofa_zen
          {%- elif (is_state('binary_sensor.morgenrampe_aktiv', 'on') and not is_state('binary_sensor.koekken_madlavningslys', 'on')) -%}morgenrampe
          {%- elif (is_state('binary_sensor.godnat_common_active', 'on') and not is_state('binary_sensor.koekken_madlavningslys', 'on')) -%}nattur
          {%- else -%}hus{%- endif -%}
        attributes:
          navn: >-
            {%- if (is_state('input_boolean.roegalarm_blink_active', 'on')) -%}Røgalarm
            {%- elif (is_state('input_boolean.noedlys_aktiv', 'on')) -%}Nødlys
            {%- elif (states('input_text.koekken_gestus_alarm').startswith('aktiv')) -%}Timer-alarm
            {%- elif ((state_attr('automation.vejr_varsel_regn_bla_glimt_vind_hvid_blink_morgen_20min', 'current') | int(0)) > 0 or (state_attr('automation.vejr_varsel_aften_blink_push_for_nattens_vejr_16_30_17_00_18_30', 'current') | int(0)) > 0) -%}Vejrvarsel
            {%- elif (is_state('input_boolean.dance_room_koekken', 'on') and (is_state('input_boolean.dance_mode', 'on') or states('input_select.dance_manual_event') not in ['off', 'unknown', 'unavailable', ''])) -%}Dance
            {%- elif (is_state('input_boolean.cirkus_active', 'on')) -%}Cirkus/fødselsdag
            {%- elif ((state_attr('automation.legetojsdag_disko_varsel_forste_abne_fredag_i_maneden_efter_vejrvarsler', 'current') | int(0)) > 0) -%}Legetøjsdag
            {%- elif (states('input_text.koekken_lyskaede_preview') in ['taendt', 'slukket']) -%}Farve-preview
            {%- elif (is_state('input_boolean.styrbar_lr_holding_stue', 'on')) -%}Styrbar-farveloop
            {%- elif (not is_state('binary_sensor.koekken_madlavningslys', 'on') and (is_state('binary_sensor.koekken_lyskaede_scene_laan', 'on') or is_state('input_boolean.open_plan_fuldt_lys', 'on') or (is_state('light.koekken_lyskaede', 'on') and (states('input_text.koekken_lyskaede_haand_ts') | int(0)) >= (as_timestamp(states.light.koekken_lyskaede.last_changed, 0) | int(0))))) -%}Din hånd
            {%- elif (is_state('input_boolean.airbnb_velkomst_active', 'on')) -%}AirBnB-velkomst
            {%- elif (is_state('binary_sensor.sofa_zen_laaner_kaeden', 'on')) -%}Sofa Zen
            {%- elif (is_state('binary_sensor.morgenrampe_aktiv', 'on') and not is_state('binary_sensor.koekken_madlavningslys', 'on')) -%}Morgenrampe
            {%- elif (is_state('binary_sensor.godnat_common_active', 'on') and not is_state('binary_sensor.koekken_madlavningslys', 'on')) -%}Godnat/nattur
            {%- else -%}huset{%- endif -%}
          rang: >-
            {%- if (is_state('input_boolean.roegalarm_blink_active', 'on')) -%}1
            {%- elif (is_state('input_boolean.noedlys_aktiv', 'on')) -%}2
            {%- elif (states('input_text.koekken_gestus_alarm').startswith('aktiv')) -%}3
            {%- elif ((state_attr('automation.vejr_varsel_regn_bla_glimt_vind_hvid_blink_morgen_20min', 'current') | int(0)) > 0 or (state_attr('automation.vejr_varsel_aften_blink_push_for_nattens_vejr_16_30_17_00_18_30', 'current') | int(0)) > 0) -%}4
            {%- elif (is_state('input_boolean.dance_room_koekken', 'on') and (is_state('input_boolean.dance_mode', 'on') or states('input_select.dance_manual_event') not in ['off', 'unknown', 'unavailable', ''])) -%}5
            {%- elif (is_state('input_boolean.cirkus_active', 'on')) -%}6
            {%- elif ((state_attr('automation.legetojsdag_disko_varsel_forste_abne_fredag_i_maneden_efter_vejrvarsler', 'current') | int(0)) > 0) -%}7
            {%- elif (states('input_text.koekken_lyskaede_preview') in ['taendt', 'slukket']) -%}8
            {%- elif (is_state('input_boolean.styrbar_lr_holding_stue', 'on')) -%}9
            {%- elif (not is_state('binary_sensor.koekken_madlavningslys', 'on') and (is_state('binary_sensor.koekken_lyskaede_scene_laan', 'on') or is_state('input_boolean.open_plan_fuldt_lys', 'on') or (is_state('light.koekken_lyskaede', 'on') and (states('input_text.koekken_lyskaede_haand_ts') | int(0)) >= (as_timestamp(states.light.koekken_lyskaede.last_changed, 0) | int(0))))) -%}10
            {%- elif (is_state('input_boolean.airbnb_velkomst_active', 'on')) -%}11
            {%- elif (is_state('binary_sensor.sofa_zen_laaner_kaeden', 'on')) -%}12
            {%- elif (is_state('binary_sensor.morgenrampe_aktiv', 'on') and not is_state('binary_sensor.koekken_madlavningslys', 'on')) -%}13
            {%- elif (is_state('binary_sensor.godnat_common_active', 'on') and not is_state('binary_sensor.koekken_madlavningslys', 'on')) -%}14
            {%- else -%}0{%- endif -%}
          aflever_til_hus: "{{ ['roegalarm', 'noedlys', 'timer_alarm', 'vejrvarsel', 'dance', 'cirkus', 'legetoejsdag', 'farve_preview', 'styrbar_farveloop', 'haand', 'velkomst', 'sofa_zen'] }}"
          holdere: >-
            {%- set h = namespace(l=[]) -%}
            {%- if (is_state('input_boolean.roegalarm_blink_active', 'on')) -%}{%- set h.l = h.l + ['Røgalarm'] -%}{%- endif -%}
            {%- if (is_state('input_boolean.noedlys_aktiv', 'on')) -%}{%- set h.l = h.l + ['Nødlys'] -%}{%- endif -%}
            {%- if (states('input_text.koekken_gestus_alarm').startswith('aktiv')) -%}{%- set h.l = h.l + ['Timer-alarm'] -%}{%- endif -%}
            {%- if ((state_attr('automation.vejr_varsel_regn_bla_glimt_vind_hvid_blink_morgen_20min', 'current') | int(0)) > 0 or (state_attr('automation.vejr_varsel_aften_blink_push_for_nattens_vejr_16_30_17_00_18_30', 'current') | int(0)) > 0) -%}{%- set h.l = h.l + ['Vejrvarsel'] -%}{%- endif -%}
            {%- if (is_state('input_boolean.dance_room_koekken', 'on') and (is_state('input_boolean.dance_mode', 'on') or states('input_select.dance_manual_event') not in ['off', 'unknown', 'unavailable', ''])) -%}{%- set h.l = h.l + ['Dance'] -%}{%- endif -%}
            {%- if (is_state('input_boolean.cirkus_active', 'on')) -%}{%- set h.l = h.l + ['Cirkus/fødselsdag'] -%}{%- endif -%}
            {%- if ((state_attr('automation.legetojsdag_disko_varsel_forste_abne_fredag_i_maneden_efter_vejrvarsler', 'current') | int(0)) > 0) -%}{%- set h.l = h.l + ['Legetøjsdag'] -%}{%- endif -%}
            {%- if (states('input_text.koekken_lyskaede_preview') in ['taendt', 'slukket']) -%}{%- set h.l = h.l + ['Farve-preview'] -%}{%- endif -%}
            {%- if (is_state('input_boolean.styrbar_lr_holding_stue', 'on')) -%}{%- set h.l = h.l + ['Styrbar-farveloop'] -%}{%- endif -%}
            {%- if (not is_state('binary_sensor.koekken_madlavningslys', 'on') and (is_state('binary_sensor.koekken_lyskaede_scene_laan', 'on') or is_state('input_boolean.open_plan_fuldt_lys', 'on') or (is_state('light.koekken_lyskaede', 'on') and (states('input_text.koekken_lyskaede_haand_ts') | int(0)) >= (as_timestamp(states.light.koekken_lyskaede.last_changed, 0) | int(0))))) -%}{%- set h.l = h.l + ['Din hånd'] -%}{%- endif -%}
            {%- if (is_state('input_boolean.airbnb_velkomst_active', 'on')) -%}{%- set h.l = h.l + ['AirBnB-velkomst'] -%}{%- endif -%}
            {%- if (is_state('binary_sensor.sofa_zen_laaner_kaeden', 'on')) -%}{%- set h.l = h.l + ['Sofa Zen'] -%}{%- endif -%}
            {%- if (is_state('binary_sensor.morgenrampe_aktiv', 'on') and not is_state('binary_sensor.koekken_madlavningslys', 'on')) -%}{%- set h.l = h.l + ['Morgenrampe'] -%}{%- endif -%}
            {%- if (is_state('binary_sensor.godnat_common_active', 'on') and not is_state('binary_sensor.koekken_madlavningslys', 'on')) -%}{%- set h.l = h.l + ['Godnat/nattur'] -%}{%- endif -%}
            {{ h.l | join(', ') if h.l else '—' }}
  - binary_sensor:
      - name: "Koekken lyskaede laant"
        unique_id: koekken_lyskaede_laant
        icon: mdi:hand-extended
        state: >-
          {{ states('sensor.koekken_lyskaede_ejer') not in ['hus', 'unknown', 'unavailable', ''] }}
        attributes:
          holder: "{{ state_attr('sensor.koekken_lyskaede_ejer', 'holdere') or '—' }}"

automation:
  - id: ejerskab_koekken_lyskaede_genoptag
    alias: "Ejerskab: Køkken-lyskæden — et lavere krav får lampen tilbage"
    description: >-
      GENERERET. Slipper et højere krav mens et lavere stadig er aktivt, maler
      det lavere sit eget udseende igen. Kun krav med `genoptag:` i ejerskab/koekken_lyskaede.yaml.
      Overtagelse fra 'hus' er kravets egen skrivers job, ikke dette.
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.koekken_lyskaede_ejer
        not_from: ["unknown", "unavailable", "hus"]
        to: ["sofa_zen"]
    action:
      - delay:
          seconds: 2
      - condition: template
        value_template: "{{ is_state('sensor.koekken_lyskaede_ejer', trigger.to_state.state) }}"
      - choose:
          - conditions: "{{ trigger.to_state.state == 'sofa_zen' }}"
            sequence:
              - action: script.sofa_zen_kaede_apply
                continue_on_error: true
                data: {"fade_s": 5}
