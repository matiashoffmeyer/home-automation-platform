# =============================================================================
# Vinter-aftenluk gældende — binary_sensor.vinter_aftenluk_gaeldende
# =============================================================================
# 2026-11-05 (user-spec): ÉT anker for "nu skal vinter-gardinerne være nede for
# natten" — læst af to steder, der ellers ville kode reglen hver for sig (#2):
#   - winter_active_dark_close (automations/winter_defense.yaml) lukker på den.
#   - house_state_to_active (packages/house_modes.yaml) ruller IKKE open-plan
#     op ved hjemkomst mens den er on: Dormant har allerede lukket dem (koldt),
#     og op + ned igen er bare støj (user: "velkomst ... burde ikke trigge dem").
#
# on = kill-switch on + familie-mode + aften (sove-aftenluk-vinduet ELLER sol
# under natlys-tærsklen) + skumrings-fasen (rising false) + koldt UDE.
# Ingen house_state her — hjemkomsten læser den i netop det sekund huset går
# Active. unavailable udetemp → off = ingen luk (#9; udetemp har DMI-reserve).
# =============================================================================
template:
  - binary_sensor:
      - name: "Vinter aftenluk gældende"
        unique_id: vinter_aftenluk_gaeldende
        icon: mdi:curtains-closed
        state: >-
          {% set t = states('sensor.udetemp') | float(none) %}
          {{ is_state('input_boolean.winter_active_dark_close_enabled', 'on')
             and states('input_select.house_mode') in ['Normal', 'Home Vacation']
             and (is_state('binary_sensor.sove_gardin_aftenluk_vindue', 'on')
                  or is_state('binary_sensor.natlys_sol_under_graense', 'on'))
             and state_attr('sun.sun', 'rising') == false
             and t is not none
             and t < states('input_number.winter_heating_season_temp') | float(12) }}
