# =============================================================================
# Statistik-periode — slider der styrer historik-vinduet på Statistik-siden
# =============================================================================
# 2026-07-13 (user-spec): graferne på Statistik-siden viser i UDGANGSPUNKTET kun
# den seneste UGE. Denne slider bestemmer hvor langt de ser tilbage OG grupperer
# perioden når den er lang, så man får faktiske insights i stedet for hundredvis
# af bittesmå dags-søjler.
#
# Vanilla HA kan IKKE binde en statistics-graphs `days_to_show`/`period` til en
# entity (kræver custom:config-template-card, som ikke er installeret). Løsning:
# en 4-trins slider + `conditional`-kort i dashboards/forbrug.yaml der viser
# præcis ét periode-tilpasset graf-sæt ad gangen:
#
#   1 = Uge     → 7 dage,   søjler pr. DAG   (linjer pr. time)
#   2 = Måned   → 31 dage,  søjler pr. DAG   (linjer pr. dag)
#   3 = Kvartal → 92 dage,  søjler pr. UGE   (linjer pr. dag)  ← grupperet
#   4 = År      → 365 dage, søjler pr. MÅNED (linjer pr. uge)  ← grupperet
#
# Forbrugs-søjler bruger `stat_types: [change]` = periodens TOTAL (dag/uge/måned
# = ægte aggregering, verificeret ren mod daglig max-state 2026-07-13 for per-rum
# + utility-meter + kost-sensorer). Temp/fugt/pris-linjer bruger `mean` = ægte
# gennemsnit. De to kendt-inflaterede sensorer (hus_lys_per_paere_idag +
# hus_lys_paeretimer_idag template-mirror) bruges IKKE med change — hus-grafen
# peger på det rene utility-meter sensor.hus_paeretimer_i_dag.
#
# INGEN `initial:` (persistens-reglen) — fresh-install-default sættes af
# init_user_preferences (sentinel: state=='0.0' før HA har rørt den → 1 = Uge).
# =============================================================================

input_number:
  statistik_periode:
    name: "Statistik-periode (1=uge · 2=måned · 3=kvartal · 4=år)"
    icon: mdi:calendar-range
    min: 1
    max: 4
    step: 1
    mode: slider
