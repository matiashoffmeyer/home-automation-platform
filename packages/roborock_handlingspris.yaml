# =============================================================================
# Robotstøvsuger — pris pr. knap på Støvsug-siden, inkl. el OG vand
# (user-spec 2026-11-15: "på støvsuger siden skal der være en parentes med
# prisen på de forskellige handlinger. både inkl. vand og el.")
# =============================================================================
# Én sensor; hver knap på dashboards/stoevsug.yaml viser sin egen attribut
# (tile-kort med state_content) som "(23 øre)" (kr fra 1 kr og op). Elprisen er den AKTUELLE
# all-in pris (sensor.elpris_allin_aktuel, inkl. moms) — "hvad koster det hvis
# jeg trykker nu". Vandprisen er en slider (Københavns takst).
#
# MODELLEN (pr. handling) — målt 2026-10-16 → 11-15 (55 kørsler), suppleret
# med producent-tal hvor der ingen måler er (dokken har INGEN effektmåler):
#
#   el = areal × gennemløb × 0,9 Wh/m²      (robottens batteri, fra stikket)
#      + 1 tømning × 4 Wh                    (estimat: ~1 kW sug i 10-15 s)
#      + mopvaske × 10 Wh                     (Roborock: selvrens 0,01 kWh)
#      + 1 tørring × slider (0,06 kWh)        (Roborock: hurtig tørring 0,06,
#                                              stille tørring 0,19 kWh)
#   vand = mopvaske × 0,18 L                 (målt, se nedenfor)
#
# 0,9 Wh/m²: batteriet falder ~1 % pr. m² både hurtig og grundig (16,0 m² →
# 13 %, 32,7 m² → 29 %, 40,5 m² → 39 %, 27,7 m² → 27 %), og 1 % ≈ 0,88 Wh fra
# stikkontakten (kalibreret i packages/robot_lader_besparelse.yaml).
# Hel-hus-turen dækker 26-34 m² (median ~28) og bruger 22-38 % batteri.
#
# 0,18 L pr. mopvask: dokkens rentvandstank (3 L) meldte tom 10-24, 10-27,
# 10-31, 11-05 og 11-15 med hhv. 18, 19, 16 og 14 `washing_the_mop` imellem →
# 3 L / ~17 ≈ 0,18 L (inkl. at robottens egen tank fyldes op ved vasken).
# Vaske pr. handling (talt i status-historikken): grundigt rum ~2, Normal hele
# huset ~4, Grundig hele huset ~5. Hurtig moper ikke → ingen vask/tørring.
#
# Rum-arealer (m²): fra enkeltrums-kørslers sensor.s8_maxv_ultra_cleaning_area
# (stue 6,9-7,3 · spisestue 6,9 · børneværelse 4,9 · entré 4,1 · soveværelse
# 2,5 · badeværelse 2,1); køkken og depot har ingen ren enkelt-kørsel → skøn.
# Summen (~34) passer med hel-hus-turens ~28 m² + overlap.
#
# Grundig = to gennemløb (dobbelt batteri pr. m²). En spejdertur i tomt hus
# (mild mop foran kørslen) er IKKE regnet med — den kører kun når ingen er
# hjemme og koster ~en mopvask ekstra.
# =============================================================================

input_number:
  # Københavns samlede vand- og afledningstakst 2026: 54,93 kr/m³ inkl.
  # afgifter og moms (Københavns Kommunes takstbilag, Klima-, Miljø- og
  # Teknikudvalget 24/2-2026). Ret hvert år når HOFOR's takst skifter.
  roborock_vandpris_kr_m3:
    name: "🤖 Robot: vandpris"
    min: 10
    max: 150
    step: 0.01
    unit_of_measurement: "kr/m³"
    icon: mdi:water
    mode: box

  # Energi pr. mop-tørring i dokken. Roborocks egen support-side: hurtig
  # tørring 0,06 kWh, stille tørring 0,19 kWh. Dokken tørrer 2 t (7200 s,
  # sensor.s8_maxv_ultra_dock_mop_drying_remaining_time) efter hver mop-tur.
  roborock_toerring_kwh:
    name: "🤖 Robot: strøm pr. tørring"
    min: 0
    max: 0.5
    step: 0.01
    unit_of_measurement: "kWh"
    icon: mdi:fan
    mode: box

template:
  - sensor:
      # State = prisen for Grundig hele huset (den dyreste knap) — så der er
      # et tal at se historik på. Attributterne er knappernes tekster:
      # h_/g_<rum> = hurtig/grundig ét rum; hus_h/hus_n/hus_g = hele huset.
      # Argumenterne: (m², gennemløb, mopvaske, tørring) — se headeren.
      - name: "Roborock handlingspris"
        unique_id: roborock_handlingspris
        unit_of_measurement: "kr"
        icon: mdi:cash
        state: "{% from 'roborock_pris.jinja' import pris %}{{ pris(28, 2, 5, 1) }}"
        attributes:
          h_stue: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(7, 1, 0, 0) }}"
          g_stue: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(7, 2, 2, 1) }}"
          h_spisestue: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(7, 1, 0, 0) }}"
          g_spisestue: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(7, 2, 2, 1) }}"
          h_koekken: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(5, 1, 0, 0) }}"
          g_koekken: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(5, 2, 2, 1) }}"
          h_entre: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(4, 1, 0, 0) }}"
          g_entre: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(4, 2, 2, 1) }}"
          h_sovevaerelse: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(3, 1, 0, 0) }}"
          g_sovevaerelse: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(3, 2, 2, 1) }}"
          h_boernevaerelse: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(5, 1, 0, 0) }}"
          g_boernevaerelse: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(5, 2, 2, 1) }}"
          h_badevaerelse: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(2, 1, 0, 0) }}"
          g_badevaerelse: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(2, 2, 2, 1) }}"
          h_depot: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(2, 1, 0, 0) }}"
          g_depot: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(2, 2, 2, 1) }}"
          hus_h: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(28, 1, 0, 0) }}"
          hus_n: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(28, 1, 4, 1) }}"
          hus_g: "{% from 'roborock_pris.jinja' import pris_tekst %}{{ pris_tekst(28, 2, 5, 1) }}"
