# =============================================================================
# Sol i stuen — sofa-zonen og spisestuen venter mens eftermiddagssolen står ind
# =============================================================================
# User 2026-10-29: "sol ind i open plan ved solnedgang bliver ved med at skabe
# en situation hvor der både er meget sollys og el lys i open plan" → valgte
# løsning 2 + b: et sol-vindue uden ny hardware, hvor KUN køkkenet tænder
# automatisk; sofa-zonen og spisestue-loftet venter. Vinduet slutter ved 3,5°
# (user), og en sky skal slutte det med det samme ("hvad sker der så hvis en sky
# går for solen? det bliver jo pludseligt mørkt").
#
# Hvorfor huset tændte i solen: open-plannets lux-målere sidder ved spisestue-
# vinduet (vender 333°) og i køkkenet. Den lave eftermiddagssol (az 239-248° i
# slutningen af oktober) står ind ad stuens vinduer, som ingen måler ser (stue-
# Apolloens LTR390 død siden 5/5, B111). 29/10 16:00:31 tændte velkomstlyset
# spisestue + køkken og 16:01 sofa-zonen ved 3,8° sol; 26/10 16:04 sofaen ved 4,2°.
#
# BEVISET for sol er spisestuens egen måling — den eneste kanal der kan se en
# sky foran den lave sol. Målt 3/10-29/10, sol 3,5-6° i vest, lamperne slukket
# (sensor.mosbillede_lux_maalt, den eneste recordede kanal): solrige dage min
# 66-111 lx, gråvejrsdage max 8-36 lx → tærskel 50 lx midt i kløften.
# Under ~3,5° ser INGEN måler solen (spisestue, sove og entré falder samtidig —
# solen går bag husene for dem; stuen har sol længere, bag skov + terrasse), så
# dér kan en sky ikke ses → vinduet slutter (user-valg: ingen sky-risiko).
# ⚠️ Afsnittet ovenfor holdt ikke i november, se B302 nedenfor.
#
# 2026-11-05 (B302): 3,5°-gulvet sluttede vinduet på alle tre solrige dage
# (3/11, 4/11, 5/11), mens spisestuen stadig målte 65-119 lx sol, og en lampe
# tændte 2 min efter (5/11: vinduet slut 15:48:38, læselampen 15:50:58, som du
# selv slukkede 15:51:48; 16:12 tændte du lyset selv). Ved ~3,4° går den
# direkte sol bag husene for spisestue-måleren (5/11 15:47 → 15:48: 122 → 70
# lx), men den klare himmel i vest lyser stadig over gråvejr og falder derefter
# jævnt, ≈ e^−0,55 pr. grad (5/11: 65 lx ved 3,1°, 38 ved 2,1°, 26 ved 1,5°).
# Stuen har direkte sol længere (skov + terrasse). Solbeviset følger solen ned:
#   krav = slider × e^(−0,45 × (3,5° − sol))
# = 50 lx ved 3,5°, 40 ved 3,0°, 32 ved 2,5°, 25 ved 2,0° og 20 ved 1,5°.
# Kravet falder lidt langsommere end lyset, så fejlen går mod tidligt slut =
# lys tændt (B277s sikre retning, se "Med lys tændt" nedenfor).
# Gulvet er nu 1,5°: dér rammer kravet LTR390'ens ~20 lx-trin, og længere nede
# er aflæsningen det sidste trin, ikke en måling (en sky kan ikke ses).
# Gråvejr 4/10-4/11 (dag-medianer af mosbillede_lux_maalt): max 47 lx ved
# 3,5-4,5°, 39 ved 3,0-3,5°, 32 ved 2,5-3,0°, 30 ved 2,0-2,5°, 24 ved 1,5-2,0°.
# Under ~2,3° kan den lyseste gråvejrsdag derfor åbne vinduet til gulvet, dvs.
# højst ~7 min udskudt tænd (solen falder ~0,12°/min). Det slukker intet.
# Anker 3,5° og rate 0,45 er målte konstanter. Flyttes gulvet, er 3,5° stadig
# referencen for slider-luxen.
#
# Med lys tændt: rå minus 60 lx. Køkken-lyskæden løfter spisestue-sensoren
# med median 1,7 / p90 29,5 / max 61,5 lx (ai_feedback/lux_lampe_feedback.jsonl,
# 202 skift i mørke); 60 er samme margin som mosbillede_lux_maalt bruger for
# loft + køkken. Fejl-retningen er den sikre: lidt for tidligt slut = lys tændt.
# spisestue_dagslys_lx duer IKKE her — med lys tændt fremskriver den et gemt
# sample ad solhøjden og ser ikke skyen.
#
# Alle house_modes, også AirBnB (user 2026-10-29: "det skal også gælde i airbnb.
# det er jo normal adfærd, mere intelligent"). Gæstens udgang uden at kende
# systemet: sky/sol under grænsen slutter vinduet selv, og et manuelt tænd
# vinder. Vinduet SLUKKER aldrig noget — det udskyder kun tænd.
# Udgangene: sky (øjeblikkeligt), sol under grænsen, manuel tænd (vinder altid).
# Når vinduet slutter, re-armer presence_lux_stue_rearm (presence_lights.yaml)
# sofa- og spisestue-tænd, så en der sidder stille i sofaen får lyset (#4).
#
# Forbrugere (grep stue_sol_vindue): presence_light_stue_on, presence_light_
# sofa_on (presence_stue.yaml), presence_lux_stue_on, presence_lux_sofa_on,
# presence_openplan_moerk_indedag_on, presence_lux_stue_rearm
# (presence_lights.yaml), arrival_welcome_light (arrival.yaml — spisestue-delen),
# og soveværelsets tænd-gate (B302): `sensor.sovevaerelse_lux_gate` attribut
# `taend` holder dag-gaten mens vinduet er på (room_lux_tuning.yaml), og
# presence_lux_sovevaerelse_on re-armer på vinduets slut (presence_lights.yaml).
# =============================================================================
#
# =============================================================================
# DIREKTE SOL PÅ SYDFACADEN — soveværelset er stuens lysmåler (B323, 2026-11-21)
# =============================================================================
# User 21/11: "vi skal bruge soveværelsets lux niveau til at regulere stuen, i
# kombination med vejrudsigt og lys vinkel … jeg har lige manuelt slukket stue
# lys fordi det brændte oven i direkte sollys"; "ca 176 grader syd er syd
# facaden". Sol-vinduet ovenfor ser kun eftermiddagssol i vest (az > 180,
# spisestue-måleren vender 333°); formiddags- og middagssolen fra syd ser INGEN
# open-plan-måler. 21/11 07:14 tændte du læselampen i mørke (stue i Manual fra
# 06:13), solen kom ~08:59 (6°, az 139) og 09:04 slukkede du den selv;
# open_plan_lux stod 50-73 lx med lampen tændt og faldt til 35 da den slukkede
# — open-plannet målte lampen, ikke solen. Soveværelset målte 50 → 76 lx.
#
# BEVIS: soveværelsets `sovevaerelse_lux_reel` (samme sydfacade, store vinduer)
#   krav = slider (40 lx) + 3 lx pr. grad over 6°
# Målt 22/10-21/11 mod DMI's solskinsminutter (Sjælsmark 06188, label SOL = 10/10
# min + ≥ 50/60 min, GRÅ = 0/0 og ≤ 30 min sol hele dagen), kun indfald ≥ 0,25:
#   - gråvejr under 13°: max 15-18 lx (ét enkelt tick 69 lx 24/10 09:55, 13°);
#   - gråvejr midt på dagen (16-22°): op til 33-66 lx → kravet stiger 3 lx/°
#     (79 lx ved 19°, hvor gråvejrs-max var 66);
#   - sol: 42-183 lx fra 6°, men tit 0-20 lx på solrige morgener under ~9° (horisont
#     mod sydøst) → beviset fejler mod "ingen sol" = lyset tænder som før.
#   LTR390 rapporterer i trin på ~21 lx (21, 42, 63 …), så 40 = andet trin.
# Soveværelsets egne lamper (sove-loftet) løfter målingen med max 14,9 lx (573
# skift i mørke) → 15 lx trækkes fra mens de lyser. Apollo-LED'en er allerede
# trukket fra i lux_reel.
# Gates: sol ≥ 3°, indfald cos(el)·cos(az − 176°) ≥ 0,25 (sol højst ~75° fra
# facadens normal), og stuens syd-gardin mindst halvt åbent — er det trukket
# for, står der ingen sol på sofaen. INGEN gate på sove-gardinet: et lukket
# gardin sænker kun målingen (= ingen sol, sikker retning).
#
# TRE ting bruger beviset:
#  1. binary_sensor.stue_direkte_sol (øjeblikkelig, ingen delay) UDSKYDER sofa-
#     zonens tænd-veje (presence_light_sofa_on, presence_lux_sofa_on) — som sol-
#     vinduet: en sky slutter den med det samme. Spisestue-loftet har sin egen
#     måler og venter ikke på den. Når den slutter (2 min uden sol), re-armer
#     presence_lux_stue_rearm sofa-tænd.
#  2. automation stue_direkte_sol_sofa_sluk SLUKKER sofa-zonen når solen har
#     holdt i `stue_direkte_sol_sluk_minutter` (10), dobbelt så længe når met.no
#     melder skydække ≥ 60 %. Målt overlevelse efter 10 min sol (sol ≥ 6°, huller
#     ≤ 3 min slået sammen, n = 52): skydække < 30 % median 53 min mere sol,
#     30-60 % 32 min, ≥ 60 % 20 min — vejrudsigten forudsiger altså hvor længe
#     solen bliver. 6/8/10/12/15 min hold gav samme overlevelse fra 8 min (median
#     ~31 min), så 10. Ingen sluk under 6° sol (slideren): om eftermiddagen er
#     solen væk ~25 min senere, og lyset ville tænde igen.
#     Manual: kun lamper der var tændt FØR sol-episoden (binary_sensor.stue_
#     direkte_sol_episode, 30 min delay_off), og kun hvis ingen har rørt stuens
#     lys (styrbar_last_press_stue — knapper OG app) siden episoden startede.
#     Det er 21/11-tilfældet: lyset tændt i mørke, solen kom bagefter. En lampe
#     tændt i solen er et valg og bliver stående. AirBnB + Manual: intet slukkes
#     (gæstens valg). Uden Manual: alt i sofa-zonen, som presence_lux_stue_off.
#     Room_mode røres ikke.
#     Gæstens udgang: et tryk tænder (og stuen går i Manual, lampen er tændt i
#     solen → bliver stående); en sky slutter episoden.
#  Simuleret 22/10-21/11: ingen sofa-lampe stod tændt i et sol-hold ud over
#  21/11 (du slukkede selv først); én auto-tænd i sol (4/11 15:52, 3,3°, B302)
#  ville være udskudt.
#  3. binary_sensor.entre_sol_hold (B325, user-spec 21/11: "når lyset står ind
#     af sydvinduerne som nu (eller vest) så behøver vi heller ikke entre lys")
#     = beviset holdt gennem skyhuller i `entre_sol_hold_minutter` (15; 0 = fra).
#     Mens den er on og entréen selv måler ≥ 10 lx, tænder entre_motion_on ikke.
#     Slipper holdet mens nogen står i entréen, re-armer den selv (#4).
#     Målt 22/10-21/11 (beviset genskabt pr. minut; 235/235 min enige med den
#     live sensor 21/11): huller mellem sol-minutter p50 4, p75 11, p90 23, p95
#     32 min. 15 min udskyder 17 af 122 dagslys-tænd, heraf alle 8 den 21/11
#     (én i solen, 7 1-12 min efter; entréen 20-30 lx mod tærsklen 35). 16-45
#     min efter solen er blandet (7 tænd, DMI-sol 0-24 af 30 min), og 30 min
#     hold gav 53 min under 10 lx i holdet mod 10. Entréen målte 13-32 lx ved
#     de 15 af 17 med en måling; i holdet under 10 lx i 10 af 2953 min, i sol
#     aldrig under 13 → gulvet giver kun en reelt mørk entré lys.
#     Ingen sluk-vej: lyset stod tændt i ≥ 10 min sol 2 gange (21 min i alt),
#     begge tændt i et skyhul, som udskydelsen nu tager. Hjemkomst-lyset ved
#     hoveddøren er ikke gatet: 1 af 14 dagslys-hjemkomster lå ≤ 15 min efter
#     solen (29/10 16:00, 3,8°).
#     Vest: stue_sol_vindue fyrer også på lyse gråvejrs-middage (5 af 11
#     vest-udskydelser ved 0 DMI-sol-min) → intet bevis her.
#     Om vinteren rammer vestsolen også sydfacaden (azimut ≤ 235°, indfald
#     ≥ 0,25); sommer-aftenens vestsol (azimut > 250°) mangler bevis → B326.
# =============================================================================

input_number:
  stue_sol_vindue_min_elevation:
    name: "Sol i stuen: vinduet slutter når solen er under (°)"
    icon: mdi:weather-sunset-down
    min: 0
    max: 90          # 90 = reelt slået fra (solen står aldrig så højt her)
    step: 0.5
    unit_of_measurement: "°"
    mode: box

  stue_sol_vindue_min_lux:
    name: "Sol i stuen: solbevis i spisestuen mindst"
    icon: mdi:white-balance-sunny
    min: 10
    max: 300
    step: 5
    unit_of_measurement: "lx"
    mode: box

  # B323 — tal og målinger i headeren ("DIREKTE SOL PÅ SYDFACADEN").
  stue_direkte_sol_min_lux:
    name: "Direkte sol i stuen: soveværelset måler mindst (ved 6°)"
    icon: mdi:white-balance-sunny
    min: 10
    max: 1000        # 1000 = reelt slået fra (både udskydelse og sluk)
    step: 5
    unit_of_measurement: "lx"
    mode: box

  stue_direkte_sol_sluk_minutter:
    name: "Direkte sol i stuen: sofa-lyset slukker efter sol i"
    icon: mdi:timer-sand
    min: 2
    max: 60
    step: 1
    unit_of_measurement: "min"
    mode: box

  stue_direkte_sol_sluk_min_elevation:
    name: "Direkte sol i stuen: sluk kun når solen står over (°)"
    icon: mdi:weather-sunset-up
    min: 0
    max: 90          # 90 = sluk slået fra (udskydelsen af tænd virker stadig)
    step: 0.5
    unit_of_measurement: "°"
    mode: box

  # B325 (headerens punkt 3): så længe efter sidste sol-minut venter entréens
  # bevægelses-tænd. 0 = fra (entréen venter ikke på solen).
  entre_sol_hold_minutter:
    name: "Entré: venter efter sol i"
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    mode: box

template:
  - binary_sensor:
      - name: "Stue sol-vindue"
        unique_id: stue_sol_vindue
        icon: mdi:weather-sunny-alert
        # Ingen delay_off: en sky skal slutte vinduet med det samme (user-spec).
        # Ingen delay_on: vinduet tænder intet — et kort on-blip udskyder kun.
        state: >-
          {% from 'rosters.jinja' import open_plan_lys %}
          {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
          {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
          {% set raa = states('sensor.spisestue_lux_reel') | float(-1) %}
          {% set lampe = (open_plan_lys + ['light.koekken_lyskaede'])
                         | select('is_state', 'on') | list | count > 0 %}
          {% set bevis = raa - 60 if lampe else raa %}
          {# B302: kravet følger den klare dags fald under 3,5° (se header). #}
          {% set krav = states('input_number.stue_sol_vindue_min_lux') | float(50)
                        * e ** (-0.45 * ([3.5 - el, 0] | max)) %}
          {{ az > 180
             and el >= states('input_number.stue_sol_vindue_min_elevation') | float(1.5)
             and raa >= 0
             and bevis >= krav }}
        attributes:
          # Kravet lige nu (lx) — samme formel som state, så dashboardet kan
          # vise beviset ved siden af det tal det skal over. Holdt fast på
          # gulvet og i hele lx (fejlklasse #24): ellers en DB-række ved hver
          # sol-opdatering gennem hele skumringen.
          bevis_krav_lx: >-
            {% set el = [state_attr('sun.sun', 'elevation') | float(-90),
                         states('input_number.stue_sol_vindue_min_elevation') | float(1.5)] | max %}
            {{ (states('input_number.stue_sol_vindue_min_lux') | float(50)
                * e ** (-0.45 * ([3.5 - el, 0] | max))) | round(0) }}
          solbevis_lx: >-
            {% from 'rosters.jinja' import open_plan_lys %}
            {% set raa = states('sensor.spisestue_lux_reel') | float(-1) %}
            {% set lampe = (open_plan_lys + ['light.koekken_lyskaede'])
                           | select('is_state', 'on') | list | count > 0 %}
            {{ ((raa - 60) if lampe else raa) | round(0) }}
          lys_fratrukket: >-
            {% from 'rosters.jinja' import open_plan_lys %}
            {{ (open_plan_lys + ['light.koekken_lyskaede'])
               | select('is_state', 'on') | list | count > 0 }}

      # -----------------------------------------------------------------------
      # B323 — direkte sol på sydfacaden (headeren "DIREKTE SOL PÅ SYDFACADEN")
      # -----------------------------------------------------------------------
      # Ingen delay_on/delay_off: udskydelsen af tænd skal slippe ved første
      # sky (som sol-vinduet); sluk-automationens hold står i dens `for:`.
      # Altid en state (aldrig unavailable uden reload): manglende måling = off.
      - name: "Stue direkte sol"
        unique_id: stue_direkte_sol
        icon: mdi:sun-angle
        state: >-
          {% set gardin = state_attr('cover.gardin_stue_syd', 'current_position') | float(100) %}
          {{ is_state('binary_sensor.sydfacade_direkte_sol', 'on') and gardin >= 50 }}
        attributes:
          # Kvantiseret til 5 lx (fejlklasse #24): kravet flytter sig 3 lx/°,
          # i hele lx ville det skrive en DB-række hvert par minutter hele dagen.
          krav_lx: >-
            {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
            {{ ((states('input_number.stue_direkte_sol_min_lux') | float(40)
                 + 3 * ([el - 6, 0] | max)) / 5) | round(0) * 5 }}
          bevis_lx: >-
            {% from 'rosters.jinja' import sove_lys %}
            {% set raa = states('sensor.sovevaerelse_lux_reel') | float(0) %}
            {% set lampe = sove_lys | reject('search', 'apollo') | select('is_state', 'on') | list | count > 0 %}
            {{ ((raa - 15) if lampe else raa) | round(0) }}

      # B324 (21/11): kernen fra "Stue direkte sol" UDEN syd-gardinets gate =
      # solen står på sydfacaden (målt i soveværelset), også med stuens gardin
      # nede. Vinter-sol i Dormant åbner på den; stue_direkte_sol = den + syd ≥ 50.
      - name: "Sydfacade direkte sol"
        unique_id: sydfacade_direkte_sol
        icon: mdi:sun-angle-outline
        state: >-
          {% from 'rosters.jinja' import sove_lys %}
          {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
          {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
          {% set raa = states('sensor.sovevaerelse_lux_reel') | float(-1) %}
          {# Apollo-LED'en er allerede trukket fra i lux_reel. #}
          {% set lampe = sove_lys | reject('search', 'apollo') | select('is_state', 'on') | list | count > 0 %}
          {% set bevis = raa - 15 if lampe else raa %}
          {% set krav = states('input_number.stue_direkte_sol_min_lux') | float(40)
                        + 3 * ([el - 6, 0] | max) %}
          {% set indfald = (el * pi / 180) | cos * ((az - 176) * pi / 180) | cos %}
          {{ el >= 3 and indfald >= 0.25
             and raa >= 0 and bevis >= krav }}

      # Episoden = sol med huller under 30 min. Dens last_changed (→ on) er
      # episodens start, som Manual-reglen i sluk-automationen måler mod. En
      # genstart midt i en episode nulstiller både den og lampernes
      # last_changed → lampen tæller som "tændt i solen" og bliver stående
      # (sikker retning).
      - name: "Stue direkte sol episode"
        unique_id: stue_direkte_sol_episode
        icon: mdi:sun-clock
        state: "{{ is_state('binary_sensor.stue_direkte_sol', 'on') }}"
        delay_off:
          minutes: 30

      # B325 — beviset holdt gennem skyhuller for entréen (headerens punkt 3).
      # delay_off i SEKUNDER som skalar (ha_yaml.md). Ingen attributter (#24).
      # Genstart/reload: står den unknown til første afgørelse, blokerer den
      # ikke = entréen må tænde (sikker retning).
      - name: "Entré sol hold"
        unique_id: entre_sol_hold
        icon: mdi:weather-partly-cloudy
        state: "{{ is_state('binary_sensor.stue_direkte_sol', 'on') }}"
        delay_off: >-
          {{ ((states('input_number.entre_sol_hold_minutter') | float(15)) * 60) | int }}

automation:
  - id: stue_direkte_sol_sofa_sluk
    alias: "Lysnet: Sofa-zonen slukker i direkte sol"
    description: >
      B323: soveværelsets lux beviser direkte sol på sydfacaden; har den holdt
      i stue_direkte_sol_sluk_minutter (× 2 ved skydække ≥ 60 %), slukkes
      sofa-zonen. Manual: kun lamper tændt før sol-episoden og urørt siden.
    mode: single
    variables:
      sofa_lights: !include ../rosters/stue_sofa_lys.yaml
      # Hvad der må slukkes. Uden Manual: alt tændt i sofa-zonen. Manual:
      # kun lamper tændt > 2 min FØR episoden, og kun hvis ingen har rørt
      # stuens lys siden (styrbar_last_press_stue stemples af knapper OG app-
      # justeringer). Manual i AirBnB: intet — gæstens valg.
      sluk_maal: >-
        {% set manual = is_state('input_select.room_mode_stue', 'Manual') %}
        {% set ep = states.binary_sensor.stue_direkte_sol_episode %}
        {% set start = as_timestamp(ep.last_changed) if ep is not none and ep.state == 'on' else as_timestamp(now()) %}
        {% set tryk = state_attr('input_datetime.styrbar_last_press_stue', 'timestamp') | float(0) %}
        {% set ns = namespace(l=[]) %}
        {% for e in sofa_lights if is_state(e, 'on') %}
          {% if not manual
                or (not is_state('input_select.house_mode', 'AirBnB')
                    and tryk < start
                    and as_timestamp(states[e].last_changed) < start - 120) %}
            {% set ns.l = ns.l + [e] %}
          {% endif %}
        {% endfor %}
        {{ ns.l }}
    trigger:
      # from: "off" (B103): reload-flanken unavailable → on er ingen dom —
      # backstoppen tager den ved næste tick.
      - id: sol_holdt
        platform: state
        entity_id: binary_sensor.stue_direkte_sol
        from: "off"
        to: "on"
        for:
          minutes: >-
            {{ (states('input_number.stue_direkte_sol_sluk_minutter') | float(10))
               * (2 if (state_attr('weather.forecast_home', 'cloud_coverage') | float(0)) >= 60 else 1) }}
      # Fejlklasse #4/#19: holdt solen mens en gate var lukket (godnat, ikke
      # Active, sol under sluk-gulvet), findes der ingen ny flanke. Ticket er en
      # no-op når ingen sofa-lampe lyser (conditions nedenfor).
      - id: backstop
        platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_select.house_state
        state: "Active"
      - condition: state
        entity_id: input_boolean.cinema_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.godnat_any_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.mood_pause_stue
        state: "off"
      - condition: template
        value_template: >-
          {{ (state_attr('sun.sun', 'elevation') | float(-90))
             >= (states('input_number.stue_direkte_sol_sluk_min_elevation') | float(6)) }}
      # Holdet re-tjekkes her for begge veje (backstoppen har intet for:).
      # last_changed nulstilles ved genstart → kun langsommere, aldrig hurtigere.
      - condition: template
        value_template: >-
          {% set s = states.binary_sensor.stue_direkte_sol %}
          {% set hold = (states('input_number.stue_direkte_sol_sluk_minutter') | float(10))
             * (2 if (state_attr('weather.forecast_home', 'cloud_coverage') | float(0)) >= 60 else 1) %}
          {{ s is not none and s.state == 'on'
             and (now() - s.last_changed).total_seconds() >= hold * 60 - 5 }}
      - condition: template
        value_template: "{{ sluk_maal | count > 0 }}"
    action:
      - service: logbook.log
        data:
          name: "Stue direkte sol"
          message: >-
            soveværelset {{ state_attr('binary_sensor.stue_direkte_sol', 'bevis_lx') }} lx
            ≥ krav {{ state_attr('binary_sensor.stue_direkte_sol', 'krav_lx') }} lx
            ved {{ state_attr('sun.sun', 'elevation') | float(0) | round(1) }}°
            i {{ ((now() - states.binary_sensor.stue_direkte_sol.last_changed).total_seconds() / 60) | round(0) | int }} min
            (skydække {{ state_attr('weather.forecast_home', 'cloud_coverage') | float(0) | round(0) | int }} %)
            {%- if is_state('input_select.room_mode_stue', 'Manual') %}, Manual: kun lamper tændt før solen{% endif %}
            — slukker {{ sluk_maal | join(', ') }}
      - service: light.turn_off
        continue_on_error: true
        target:
          entity_id: "{{ sluk_maal }}"
        data:
          transition: "{{ states('sensor.fade_living_effective') | int(30) }}"
