# =============================================================================
# Sol i stuen — sofa-zonen og spisestuen venter mens eftermiddagssolen står ind
# =============================================================================
# User 2026-10-29: "sol ind i open plan ved solnedgang bliver ved med at skabe
# en situation hvor der både er meget sollys og el lys i open plan" → valgte
# løsning 2 + b: et sol-vindue uden ny hardware, hvor KUN køkkenet tænder
# automatisk; sofa-zonen og spisestue-loftet venter. Vinduet slutter ved 3,5°
# (user), og en sky skal slutte det med det samme ("hvad sker der så hvis en sky
# går for solen? det bliver jo pludseligt mørkt").
#
# Hvorfor huset tændte i solen: open-plannets lux-målere sidder ved spisestue-
# vinduet (vender 333°) og i køkkenet. Den lave eftermiddagssol (az 239-248° i
# slutningen af oktober) står ind ad stuens vinduer, som ingen måler ser (stue-
# Apolloens LTR390 død siden 5/5, B111). 29/10 16:00:31 tændte velkomstlyset
# spisestue + køkken og 16:01 sofa-zonen ved 3,8° sol; 26/10 16:04 sofaen ved 4,2°.
#
# BEVISET for sol er spisestuens egen måling — den eneste kanal der kan se en
# sky foran den lave sol. Målt 3/10-29/10, sol 3,5-6° i vest, lamperne slukket
# (sensor.mosbillede_lux_maalt, den eneste recordede kanal): solrige dage min
# 66-111 lx, gråvejrsdage max 8-36 lx → tærskel 50 lx midt i kløften.
# Under ~3,5° ser INGEN måler solen (spisestue, sove og entré falder samtidig —
# solen går bag husene for dem; stuen har sol længere, bag skov + terrasse), så
# dér kan en sky ikke ses → vinduet slutter (user-valg: ingen sky-risiko).
#
# Med lys tændt: rå minus 60 lx. Køkken-lyskæden løfter spisestue-sensoren
# med median 1,7 / p90 29,5 / max 61,5 lx (ai_feedback/lux_lampe_feedback.jsonl,
# 202 skift i mørke); 60 er samme margin som mosbillede_lux_maalt bruger for
# loft + køkken. Fejl-retningen er den sikre: lidt for tidligt slut = lys tændt.
# spisestue_dagslys_lx duer IKKE her — med lys tændt fremskriver den et gemt
# sample ad solhøjden og ser ikke skyen.
#
# Alle house_modes, også AirBnB (user 2026-10-29: "det skal også gælde i airbnb.
# det er jo normal adfærd, mere intelligent"). Gæstens udgang uden at kende
# systemet: sky/sol under grænsen slutter vinduet selv, og et manuelt tænd
# vinder. Vinduet SLUKKER aldrig noget — det udskyder kun tænd.
# Udgangene: sky (øjeblikkeligt), sol under grænsen, manuel tænd (vinder altid).
# Når vinduet slutter, re-armer presence_lux_stue_rearm (presence_lights.yaml)
# sofa- og spisestue-tænd, så en der sidder stille i sofaen får lyset (#4).
#
# Forbrugere (grep stue_sol_vindue): presence_light_stue_on, presence_light_
# sofa_on (presence_stue.yaml), presence_lux_stue_on, presence_lux_sofa_on,
# presence_openplan_moerk_indedag_on, presence_lux_stue_rearm
# (presence_lights.yaml), arrival_welcome_light (arrival.yaml — spisestue-delen).
# =============================================================================

input_number:
  stue_sol_vindue_min_elevation:
    name: "Sol i stuen: vinduet slutter når solen er under (°)"
    icon: mdi:weather-sunset-down
    min: 0
    max: 90          # 90 = reelt slået fra (solen står aldrig så højt her)
    step: 0.5
    unit_of_measurement: "°"
    mode: box

  stue_sol_vindue_min_lux:
    name: "Sol i stuen: solbevis i spisestuen mindst"
    icon: mdi:white-balance-sunny
    min: 10
    max: 300
    step: 5
    unit_of_measurement: "lx"
    mode: box

template:
  - binary_sensor:
      - name: "Stue sol-vindue"
        unique_id: stue_sol_vindue
        icon: mdi:weather-sunny-alert
        # Ingen delay_off: en sky skal slutte vinduet med det samme (user-spec).
        # Ingen delay_on: vinduet tænder intet — et kort on-blip udskyder kun.
        state: >-
          {% from 'rosters.jinja' import open_plan_lys %}
          {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
          {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
          {% set raa = states('sensor.spisestue_lux_reel') | float(-1) %}
          {% set lampe = (open_plan_lys + ['light.koekken_lyskaede'])
                         | select('is_state', 'on') | list | count > 0 %}
          {% set bevis = raa - 60 if lampe else raa %}
          {{ az > 180
             and el >= states('input_number.stue_sol_vindue_min_elevation') | float(3.5)
             and raa >= 0
             and bevis >= states('input_number.stue_sol_vindue_min_lux') | float(50) }}
        attributes:
          solbevis_lx: >-
            {% from 'rosters.jinja' import open_plan_lys %}
            {% set raa = states('sensor.spisestue_lux_reel') | float(-1) %}
            {% set lampe = (open_plan_lys + ['light.koekken_lyskaede'])
                           | select('is_state', 'on') | list | count > 0 %}
            {{ ((raa - 60) if lampe else raa) | round(0) }}
          lys_fratrukket: >-
            {% from 'rosters.jinja' import open_plan_lys %}
            {{ (open_plan_lys + ['light.koekken_lyskaede'])
               | select('is_state', 'on') | list | count > 0 }}
