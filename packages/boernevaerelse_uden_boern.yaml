# =============================================================================
# Børneværelset UDEN børn hjemme: lys med det samme, sluk kort efter (2026-10-05)
# =============================================================================
# User 2026-10-05: "børnslyset er for meget tændt med tomt rum idag" — og til
# første forslag (vent til spisestuen er stille, ~10-15 s): "nej. max 3 sek."
#
# MÅLT (replay 14 døgn): siden 23/9 må frisk radar-BEVÆGELSE tænde loftet når
# børnene ikke er hjemme. Det skete 26 gange — 24 i takt (±10 s) med spisestuens
# radar, 21 med radar-ophold på 13-42 s, klumpet om måltiderne: børne-Apolloen
# ser folk ved spisebordet gennem væggen (B163's poserede "står ved væggen ≤ 11"
# holdt ikke). Loftet brændte derefter 6-75 min, fordi sluk-vejen
# (presence_light_boernevaerelse_off) venter 300 s × global_absence_wait_factor
# (4,47) ≈ 22 min tomt rum — en tid der er sat til sovende børn.
#
# HVORFOR TÆND-SIDEN IKKE FILTRERES: inden for 3 s findes ingen skillelinje i
# dataene. Spisestuen holder sin occupancy 5 s (radar-timeout) efter en krop er
# gået videre, så "spisestuen er stille" kommer tidligst ~10 s efter en ægte
# indgang. Af de 14 hændelser med 0 s solo-tid lignede 8 "nogen kom lige forbi"
# (spisestuen tændt 1,5-17 s før) — præcis som en ægte indgang i det sekund den
# sker; kun ~6 lå i et egentligt bord-ophold (spisestuen optaget ≥ 2 min før).
# Afstandene (apollo_udslag-loggen, +2 s) overlapper også: 120-222 cm.
#
# DERFOR SLUK-SIDEN: uden børn hjemme er et tomt børneværelse et TOMT
# børneværelse (intet barn der sover stille under radaren), så sluk-vejen må
# gerne være kort. En gennem-væggen-tænding koster nu sit ophold + N s i stedet
# for op til 75 min. N er valgt fra radarens egne huller midt i ophold (14 døgn,
# 298 huller): 69 under 60 s, 26 mellem 60 og 120 s, resten > 120 s → 90 s ligger
# over næsten alle flap-huller. Rammer den en stille voksen, tænder næste
# bevægelse igen med det samme (occupancy-flanken er en tænd-trigger).
#
# Gælder kun Normal/Home Vacation og kun når rummet ikke er i Manual (et lys
# brugeren selv har sat, følger den lange regel). AirBnB: uændret — der tænder
# presence aldrig børneværelset, og gæstens lys er gæstens.
# =============================================================================

# 2026-10-05 aften — MED børn hjemme (user: "fix lige at børneværelset har været
# så meget tændt i dag det går altså ikke"). Fixet ovenfor ramte ikke dagen det
# blev skrevet: Child B var hjemme (`kids_home_manual`), så sluk-vejen stod stadig
# på 300 s × 4,47 ≈ 22 min. MÅLT 5/10: loftet brændte 5,3 t i 8 perioder, alle
# tændt af presence; 160 af de 320 min var rummet TOMT (occupancy off), og de
# fire eftermiddags-perioder var 28-58 % optaget mens spisestuen var 5-75 %
# (14:35 og 17:13 = middagsbordet gennem væggen). 22 min er sat til et SOVENDE
# barn om aftenen — om dagen skal et sovende barn ikke have loftet tændt, så
# der er tomt rum = sluk ufarligt. Kort regel derfor kun FØR børnenes
# sengetid (`sensor.boern_bedtime_hour`); efter den gælder den lange regel
# uændret (puttelys, natlys, forældre der sidder stille ved sengen).
# 300 s ligger over de korte radar-huller (< 60-120 s, se ovenfor); af dagens
# 17 huller der endte med at nogen kom tilbage var 10 længere — der slukker
# loftet nu og tænder igen på næste occupancy-flanke (stadig lux-gatet).
input_number:
  boernevaerelse_med_boern_sluk_sekunder:
    name: "Børneværelse med børn (dag): sluk efter tomt rum i (sek)"
    icon: mdi:timer-off-outline
    min: 60
    max: 1800
    step: 30
    unit_of_measurement: "s"
    mode: slider

  boernevaerelse_uden_boern_sluk_sekunder:
    name: "Børneværelse uden børn: sluk efter tomt rum i (sek)"
    icon: mdi:timer-off-outline
    min: 15
    max: 600
    step: 15
    unit_of_measurement: "s"
    mode: slider
