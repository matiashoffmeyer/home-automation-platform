# =============================================================================
# Light Groups — single source of truth for room → entities mapping (C1)
# =============================================================================
# Per-rum `light.<rum>_all` grupper bruges af Styrbar handlers + room_logic
# scripts (room_drift_back, room_set_brightness, etc) + scene logic. Templated
# refs `light.{{ room }}_all` skipper validatoren's ref-check (endswith heuristic).
#
# CRITICAL FIX 2026-05-07 sen-PM (audit): Phase 3.D deleted these earlier today
# claiming "0 refs". Det var FORKERT — 11 templated refs i:
#   - script_pkg/styrbar_helpers.yaml (6 refs)
#   - script_pkg/room_logic.yaml (4 refs)
#   - automations/styrbar_rooms.yaml (1 ref)
# Resultat: ALLE 5 Styrbars broken (button-press → service-call mod non-existent
# entity). User-rapport "bath Styrbar virker ikke" = symptom; alle 5 var ramt.
# RESTORED: alle 7 per-rum grupper genskabt fra git-historik.
#
# Konvention:
#   light.<rum>_all          = alt lys i rummet (loft + accent + plugs)
#
# Cross-room grupper:
#   light.alle_indvendige  — alt indendørs lys (12 entities, ekskl. terrasse)
#   light.alle_lys         — inkl. terrasse (14 entities, til full house)
#   group.alle_smart_plugs — 3 smart plugs
#   group.alle_gardiner    — 4 cover entities (3× Somfy/Broadlink + sove/ZHA)
#
# IGNORERER plugs (switch.*) — de håndteres separat hvor relevant.
#
# Naar ny bulb pares: tilfoej til relevante grupper her. Alle scripts der
# bruger light.<rum>_all picker den op uden kode-edits.
# =============================================================================

light:
  # =========================================================================
  # Per-rum grupper — bruges af Styrbar handlers + room_logic scripts
  # =========================================================================
  # NB: stue_all inkluderer hele open-plan (stue + køkken + spisestue + sofa
  # lamper) fordi stue Styrbar styrer åbne-plan visuelt rum, ikke kun stue-loft.
  - platform: group
    name: "Stue all"
    unique_id: stue_all
    entities:
      - light.spisestue_loft
      - light.koekken_lyskaede   # flyttet fra terrasse 2026-06-15 (fast Zigbee-strøm)
      - light.stue_sofa_lampe
      - light.stue_sofa_lampe_2
      - light.stue_hjoernelampe
      - light.stue_plug   # non-dimmable hyggelampe på wall plug (2026-05-31)
      - light.stue_laesehygge   # Innr RB 282 C FARVE (ex 'Køkken Loft', fysisk swap 2026-07-02) — læsehygge
      - light.stue_spot_1   # IKEA Thread-spot, farve (parret 2026-09-23; spejler læselampen)
      - light.stue_spot_2   # IKEA Thread-spot, farve (parret 2026-09-23; spejler læselampen)

  - platform: group
    name: "Soveværelse all"
    unique_id: sovevaerelse_all
    entities:
      # 2026-06-05: pendlen (light.spisestue_pendel, CCT-only white) flyttet
      # fysisk til soveloftet og spiller nu sove-loft rollen. Entity-navnet er
      # IKKE renamet (kode repointet i stedet). Gamle farve-pære
      # light.sovevaerelse_loft er sat på dvale (orphan reserve).
      - light.spisestue_pendel

  - platform: group
    name: "Børneværelse all"
    unique_id: boernevaerelse_all
    entities:
      # 2026-06-04 (per user): Styrbar styrer hyggeplug, loft, strip.
      # boernevaerelse_lampe fjernet (unavailable + ikke nævnt af user; re-add
      # hvis den kommer tilbage post-flyt). Den trinvise sluk-rækkefølge
      # (hyggeplug → loft → strip) styres i script.styrbar_brightness_step.
      #
      # 2026-06-10: light.boernevaerelse_hyggelys FJERNET fra gruppen.
      # Incident 2026-06-07 ~14:50: brightness/farve-justering i appens rum-kort
      # targeter gruppen → non-dimmable plug-lampe flippede full-on/off
      # uforudsigeligt, og gruppemedlemskab omgik natlys-guarden (godnat +
      # brightness>=26) i boernevaerelse_hyggelys_mirror.yaml. Plug-lampen
      # tændes nu KUN via mirror-automationen (strip on → plug on med guards),
      # som stadig dækker både app-hyggelys og Styrbar gruppe-tænd.
      - light.boernevaerelse_loft
      - light.boernevaerelse_hygge_strip   # Innr-strip flyttet fra depot (2026-06-02)

  - platform: group
    name: "Badeværelse all"
    unique_id: badevaerelse_all
    # De 5 spots (3 KAJPLATS Matter + 2 Innr Zigbee, alle parret juni 2026 —
    # model/node pr. spot står i rosteren). Group state = "on" hvis NOGEN spot
    # er on, så Styrbar + presence virker. Pair-procedure: docs/hardware_shopping.md
    # "Bath spots pairing".
    entities: !include ../rosters/bad_spots.yaml

  # Depot loftslys = 3 pærer (2026-06-02): IKEA WS-globe + 2x Hue White.
  # light.depot_loft er nu DENNE gruppe (IKEA-pæren omdøbt til _ikea), så alle
  # eksisterende refs til light.depot_loft styrer nu hele loftet. CT (kelvin)
  # rammer kun IKEA-pæren; Hue White er fixed 2700K brightness-only.
  - platform: group
    name: "Depot Loft"
    unique_id: depot_loft
    entities:
      - light.depot_loft_ikea     # IKEA TRADFRI E27 WS globe (2200-4000K tunable)
      - light.depot_loft_hue_1    # Philips Hue White LWE007 (2700K, brightness-only)
      - light.depot_loft_hue_2    # Philips Hue White LWE007 (2700K, brightness-only)

  - platform: group
    name: "Depot all"
    unique_id: depot_all
    entities:
      - light.depot_loft
      - light.depot_strip

  - platform: group
    name: "Entré all"
    unique_id: entre_all
    entities:
      - light.entre_loft

  - platform: group
    name: "Terrasse all"
    unique_id: terrasse_all
    entities:
      - light.terrasse_paerelyskaede

  # 2026-06-18 (forbrug-KPI): fysiske SUB-grupper af open-plan, så lys-KPI'en
  # (packages/lys_kpi.yaml) kan måle tændt-tid PR. FYSISK RUM. stue_all dækker
  # hele open-plan (stue+køkken+spisestue) og dur ikke til per-rum-forbrug.
  # Disse to + light.spisestue_loft = præcis stue_all's medlemmer (ingen overlap).
  # Bruges KUN til KPI-måling (history_stats) — rør ikke Styrbar/room_logic.
  - platform: group
    name: "Stue room"
    unique_id: stue_room
    entities:
      - light.stue_sofa_lampe
      - light.stue_sofa_lampe_2
      - light.stue_hjoernelampe
      - light.stue_plug
      - light.stue_laesehygge
      - light.stue_spot_1   # 2026-09-23 (parret)
      - light.stue_spot_2

  - platform: group
    name: "Koekken room"
    unique_id: koekken_room
    entities:
      - light.koekken_lyskaede

  # NB: stue_ceiling, stue_accent, boernevaerelse_ceiling, boernevaerelse_accent,
  # depot_ceiling, depot_accent, faelles_ceiling fjernet 2026-05-06 (Blok C.3) —
  # 0 refs i kodebasen, ikke restored.

  # =========================================================================
  # Cross-room helper grupper
  # =========================================================================

  - platform: group
    name: "Alle indvendige"  # Alt lys undtagen terrasse
    unique_id: alle_indvendige
    entities:
      - light.spisestue_loft
      - light.koekken_lyskaede   # flyttet fra terrasse 2026-06-15 (fast Zigbee-strøm)
      - light.stue_sofa_lampe
      - light.stue_sofa_lampe_2
      - light.stue_hjoernelampe
      - light.stue_plug   # non-dimmable hyggelampe på wall plug (2026-05-31)
      - light.stue_laesehygge   # Innr RB 282 C FARVE (ex 'Køkken Loft', fysisk swap 2026-07-02) — læsehygge
      - light.stue_spot_1   # IKEA Thread-spot, farve (parret 2026-09-23; spejler læselampen)
      - light.stue_spot_2   # IKEA Thread-spot, farve (parret 2026-09-23; spejler læselampen)
      - light.spisestue_pendel   # pendel = sove-loft (flyttet 2026-06-05, CCT-only)
      - light.boernevaerelse_loft
      - light.boernevaerelse_lampe
      - light.badevaerelse_spot_1   # NEW (sprint 2026-05-10) — Innr RS 242 C GU10
      - light.badevaerelse_spot_2   # NEW — Innr RS 242 C GU10
      - light.badevaerelse_spot_3   # NEW — TBD type
      - light.badevaerelse_spot_4   # NEW — TBD type
      - light.badevaerelse_spot_5   # NEW — TBD type
      - light.depot_loft
      - light.depot_strip
      - light.entre_loft
      - light.boernevaerelse_hygge_strip   # Innr-strip flyttet fra depot (2026-06-02)
      - light.sove_lyskaede   # Thread-plug + pærelyskæde (forberedt 2026-09-23; unavailable til parret)

  - platform: group
    name: "Alle lys"  # Inkl. terrasse — bruges til full house og snapshots
    unique_id: alle_lys
    entities:
      - light.spisestue_loft
      - light.koekken_lyskaede   # flyttet fra terrasse 2026-06-15 (fast Zigbee-strøm)
      - light.stue_sofa_lampe
      - light.stue_sofa_lampe_2
      - light.stue_hjoernelampe
      - light.stue_plug   # non-dimmable hyggelampe på wall plug (2026-05-31)
      - light.stue_laesehygge   # Innr RB 282 C FARVE (ex 'Køkken Loft', fysisk swap 2026-07-02) — læsehygge
      - light.stue_spot_1   # IKEA Thread-spot, farve (parret 2026-09-23; spejler læselampen)
      - light.stue_spot_2   # IKEA Thread-spot, farve (parret 2026-09-23; spejler læselampen)
      - light.spisestue_pendel   # pendel = sove-loft (flyttet 2026-06-05, CCT-only)
      - light.boernevaerelse_loft
      - light.boernevaerelse_lampe
      - light.badevaerelse_spot_1   # NEW (sprint 2026-05-10) — Innr RS 242 C GU10
      - light.badevaerelse_spot_2   # NEW — Innr RS 242 C GU10
      - light.badevaerelse_spot_3   # NEW — TBD type
      - light.badevaerelse_spot_4   # NEW — TBD type
      - light.badevaerelse_spot_5   # NEW — TBD type
      - light.depot_loft
      - light.depot_strip
      - light.entre_loft
      - light.boernevaerelse_hygge_strip   # Innr-strip flyttet fra depot (2026-06-02)
      - light.sove_lyskaede   # Thread-plug + pærelyskæde (forberedt 2026-09-23; unavailable til parret)
      - light.terrasse_paerelyskaede

# =============================================================================
# Switch + Cover groups (A2 — for entre_somrig snapshot dynamic expansion)
# =============================================================================
# Universal "group:" integration der kan holde alle entity-typer.
# Tilfojer du en ny smart-plug eller gardin: opdater her, og scene-snapshot
# i entre_somrig.yaml picker den op via expand() automatisk uden at YAML i
# automation skal røres.
# =============================================================================
group:
  alle_smart_plugs:
    name: "Alle smart-plugs"
    icon: mdi:power-plug
    entities:
      - switch.stue_plug
      - switch.sove_plug
      - switch.terrasse_plug
      - switch.koekken_spots   # køkken-spots (IKEA TRETAKT), 2026-06-15

  alle_gardiner:
    name: "Alle gardiner"
    icon: mdi:roller-shade
    entities: !include ../rosters/alle_gardiner.yaml

# =============================================================================
# TRADFRI WS-reparation (2026-08-18)
# =============================================================================
# Husets IKEA "TRADFRI bulb E27 WS globe 1055lm" — pr. 2026-08-21 kun ÉN:
# light.depot_loft_ikea. (Entré-loftet var den anden indtil 08-21, hvor det
# blev skiftet til en KAJPLATS E27 CWS globe på Matter/Thread; den har ikke
# quirken, og entity_id'et light.entre_loft peger nu på Matter-pæren. Rør den
# derfor ikke med dette script — det ville koste et unødigt ekstra kald midt
# i et fade.) Pæren lander FYSISK på 5/255 (≈2 %) hvis ét kald indeholder
# `brightness` + `color_temp` + `transition > 0` samtidig. Målt live 08-18:
#
#   bri 80 % + ct + transition 3   → brightness 5     ← den defekte form
#   bri 80 %      + transition 3   → brightness 204   ✅
#   ct først (transition 0), så bri + transition 3    → 204  ✅
#   defekt kald + STRAKS et transition-0 snap         → 204  ✅ (snappet
#     annullerer den ventende transition — ingen ventetid nødvendig)
#
# Gruppe-kald (`light.alle_lys`, `light.alle_indvendige`, `light.depot_all`)
# kan ikke undgå formen, fordi resten af husets pærer gerne vil have både ct og
# fade. Derfor dette script: kald det umiddelbart EFTER gruppe-kaldet med de
# WS-pærer gruppen ramte. Kommer der en tredje WS-pære, rettes kun her (#2).
#
# NB entre_motion.yaml rammer pæren direkte og bruger to-trins-formen i stedet
# (ct+1 % uden transition → bri med transition) for at bevare et ægte fade.
script:
  tradfri_ws_bri_fix:
    alias: "TRADFRI WS: genskriv brightness efter et gruppe-kald"
    icon: mdi:lightbulb-alert
    mode: queued
    max: 5
    fields:
      entity_id:
        description: "Hvilke WS-pærer gruppe-kaldet ramte"
        example: light.depot_loft_ikea
      brightness_pct:
        description: "Den styrke gruppe-kaldet bad om (1-100)"
        example: 80
    sequence:
      - service: light.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ entity_id }}"
        data:
          brightness_pct: "{{ brightness_pct | int(100) }}"
          transition: 0
