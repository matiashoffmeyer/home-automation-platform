# =============================================================================
# Alle rum auto/manual — global toggle (item 2, 2026-06-17)
# =============================================================================
# User-spec: én toggle der sætter ALLE 9 rum til Manual (eller tilbage til Auto)
# på én gang. To indgange:
#   - input_boolean.all_rooms_manual  → toggle-tile på Indstillinger-dashboardet
#                                        (off = Auto, on = Manual)
#   - script.toggle_all_rooms_mode    → widget-venlig (telefon-widget kalder den;
#                                        flipper bare input_boolean ovenfor)
# Automationen all_rooms_mode_apply oversætter boolean → de 9 room_mode_*.
#
# NB: room_mode=Manual blokerer presence auto-tænd (men drift-back sender
# rummet til Auto: tomt rum → empty-timeout, ellers occupied-fallback på
# room_manual_on_hold_hours). "Alle Manual" er altså
# et hold, ikke permanent. Ingen automation trigger på room_mode-skift, så denne
# bulk-set giver ikke et lys-burst — kun gating ændres.
# =============================================================================

input_boolean:
  all_rooms_manual:
    name: "Alle rum: Manual mode"
    icon: mdi:hand-back-right

automation:
  - id: all_rooms_mode_apply
    alias: "Rum: Anvend alle-rum auto/manual toggle"
    description: >
      Når input_boolean.all_rooms_manual skifter → sæt alle 9 room_mode_* til
      Manual (on) eller Auto (off). Drevet af dashboard-toggle ELLER
      script.toggle_all_rooms_mode (widget).
    mode: queued
    max: 5
    trigger:
      - platform: state
        entity_id: input_boolean.all_rooms_manual
    action:
      - variables:
          target: "{{ 'Manual' if is_state('input_boolean.all_rooms_manual', 'on') else 'Auto' }}"
      - service: input_select.select_option
        target:
          entity_id: !include ../rosters/alle_rum_mode.yaml
        data:
          option: "{{ target }}"
      - service: logbook.log
        data:
          name: "Alle rum mode"
          message: "Alle 9 rum sat til {{ target }}."
