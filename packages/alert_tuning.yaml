# =============================================================================
# Varsel-finjustering — farve + antal blink pr. varsel-type (2026-07-03, user-spec)
# =============================================================================
# User: "giv mig sliders til at fin tune alerts. både ift. farve og ift antal
# blink. alle alerts." Valg (AskUserQuestion): pr. varsel-type (ikke global),
# hue for de FARVEDE varsler (regn/UV/disko) + kelvin for de HVIDE (sne/vind),
# regn beholder auto-boost (slider = normal-antal, kraftig regn ≥10mm giver +3).
#
# BERØRTE VARSLER (de 3 blink-sessioner — se automations/rain_warning.yaml +
# legetoejsdag.yaml):
#   * Vejr MORGEN (06:30-10:00 /30): regn (blå blink) · sne (kold-hvid sprinkle)
#     · vind (neutral-hvid lange blink) · UV (orange blink)
#   * Vejr AFTEN (16:30/17:00/18:30): regn (blå) · vind (neutral-hvid)
#   * Legetøjsdag (1. åbne-fredag): disko (roterende komplementære farver)
#
# HVAD SLIDERNE STYRER (og hvad de IKKE gør):
#   ANTAL blink — pr. type. 0 = mut den type (bookend-varm-hvid vises stadig;
#     sluk hele vejr-blinket på input_boolean.weather_warning_enabled i st.f.).
#   FARVE:
#     - regn/UV = HUE (0-360°, mætning fast 100%). Regn-hue driver ALLE regn-
#       signaler: morgen-blink, aften-blink OG Apollo-RGB-LED'en kl 06:05
#       (så "regn = én farve" overalt).
#     - disko = BASIS-hue (roteringens startpunkt; de to lampe-halvdele kører
#       stadig komplementært 180° fra hinanden, +47°/step). 0 = uændret.
#     - sne/vind = KELVIN (hvid-varsler). De er BEVIDST forskellige som default
#       (sne 6500K isnende / vind 5000K neutral) så de to hvide varsler kan
#       skelnes — sæt dem ikke ens.
#
#   SLIDERNE RØRER IKKE: bookend-varm-hvid (2700K start/slut-markør), blink-
#   hastighed/delays, hvilke lamper der deltager (open-plan-scope), eller
#   vejr-TÆRSKLERNE (≥2mm regn osv. bor i weather_warning.yaml — ændres sjældent).
#
# Fresh-install-defaults via init_user_preferences; live-default via API +
# snapshot (config_snapshots/helper_values.yaml). Tiles på Indstillinger.
# =============================================================================

input_number:
  # --- ANTAL BLINK pr. varsel-type -----------------------------------------
  alert_regn_blinks:
    name: "Varsel regn: antal blå blink (normal)"
    icon: mdi:weather-pouring
    min: 0
    max: 12
    step: 1
    unit_of_measurement: "blink"
    mode: box
    # Normal-antal. Kraftig regn (≥10mm/dag el. nat) giver AUTO +3 oveni
    # (auto-boost, user-valg). 0 = ingen regn-blink. Gælder morgen + aften.

  alert_sne_blinks:
    name: "Varsel sne: antal hvide sprinkle-glimt"
    icon: mdi:weather-snowy
    min: 0
    max: 20
    step: 1
    unit_of_measurement: "glimt"
    mode: box
    # Hurtige, spredte snefnug-glimt (kun morgen). 0 = ingen sne-glimt.

  alert_vind_blinks:
    name: "Varsel vind: antal lange hvide blink"
    icon: mdi:weather-windy
    min: 0
    max: 8
    step: 1
    unit_of_measurement: "blink"
    mode: box
    # Lange 2-sek hvide blink (morgen + aften). 0 = ingen vind-blink.

  alert_uv_blinks:
    name: "Varsel UV: antal orange blink"
    icon: mdi:weather-sunny-alert
    min: 0
    max: 10
    step: 1
    unit_of_measurement: "blink"
    mode: box
    # Solcreme-varsel (kun morgen). 0 = ingen UV-blink.

  alert_disko_steps:
    name: "Legetøjsdag disko: antal farve-steps"
    icon: mdi:disc
    min: 2
    max: 60
    step: 1
    unit_of_measurement: "steps"
    mode: box
    # Disko-varigheden = steps × alert_disko_step_ms. 2026-08-05 kører diskoen
    # som en CHASE over hele huset (4 grupper, én gruppe skifter pr. step), så
    # der skal flere steps til samme oplevede længde: 16 steps × 600 ms ≈ 10 s,
    # og hver gruppe når 4 farveskift. Max hævet 20 → 60 (user: "vildt disko").

  alert_disko_step_ms:
    name: "Legetøjsdag disko: step-længde"
    icon: mdi:timer-outline
    min: 200
    max: 2000
    step: 50
    unit_of_measurement: "ms"
    mode: box
    # Lavere = hurtigere/vildere chase. ⚠️ Zigbee-loft: HA klarer ~5-10
    # light-kommandoer/sek. Chasen sender kun ÉN gruppe pr. step (roster/4 ≈ 5-6
    # lamper), så 600 ms ≈ 9 cmd/s = lige under loftet. Går du under ~450 ms
    # begynder kommandoerne at hobe sig op og diskoen bliver LANGSOMMERE, ikke
    # hurtigere (jf. Styrbar-målingen 2026-05-03).

  # --- FARVE: hue (farvede varsler) ----------------------------------------
  alert_regn_hue:
    name: "Varsel regn: farve (hue)"
    icon: mdi:palette
    min: 0
    max: 360
    step: 1
    unit_of_measurement: "°"
    mode: box
    # 216° ≈ blå (default). Driver morgen-blink, aften-blink OG Apollo-RGB kl
    # 06:05. Mætning fast 100%. 0/360 = rød, 120 = grøn, 216 = blå, 270 = lilla.

  alert_uv_hue:
    name: "Varsel UV: farve (hue)"
    icon: mdi:palette
    min: 0
    max: 360
    step: 1
    unit_of_measurement: "°"
    mode: box
    # 26° ≈ orange (default). Mætning fast 100%.

  alert_disko_hue:
    name: "Legetøjsdag disko: basis-farve (hue)"
    icon: mdi:palette
    min: 0
    max: 360
    step: 1
    unit_of_measurement: "°"
    mode: box
    # Roteringens startpunkt. 0 = uændret adfærd. Halvdelene kører komplementært
    # (180° fra hinanden) og drejer +47°/step uanset basis.

  # --- FARVE: kelvin (hvide varsler) ---------------------------------------
  alert_sne_kelvin:
    name: "Varsel sne: hvid-temperatur"
    icon: mdi:snowflake
    min: 2200
    max: 6500
    step: 100
    unit_of_measurement: "K"
    mode: box
    # 6500K = isnende kold-hvid (default). Hold den ADSKILT fra vind-kelvin så
    # de to hvide varsler kan skelnes.

  alert_vind_kelvin:
    name: "Varsel vind: hvid-temperatur"
    icon: mdi:weather-windy
    min: 2200
    max: 6500
    step: 100
    unit_of_measurement: "K"
    mode: box
    # 5000K = neutral hvid (default). Adskilt fra sne-kelvin (6500K).
