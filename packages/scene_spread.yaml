# =============================================================================
# Scene Spread — "jordskælv-effekt" for scener
# =============================================================================
# Sprint 2026-05-22 PM: Per-scene +/- knapper i HA app expandere scenens
# scope fra epicenter til nærliggende rum (defineret via adjacency-graf
# fra plantegningen — se script_pkg/scene_spread.yaml, som er autoritativ).
#
# Level 0 = epicenter only (= scene's normale opførsel)
# Level 1 = + ring 1 (= rum der deler væg med epicenter)
# Level 2 = + ring 2 (= naboers naboer)
# Level 3 = + ring 3 (= alle resterende rum, effektivt whole-house)
#
# Spread-rum får deres loft-lys tændt med samme CT + brightness som
# scenens "mood" — same-intensity jordskælv, ingen decay.
#
# CALLED-FROM:
#   - script.apply_scene_with_spread (script_pkg/scene_spread.yaml)
#   - Dashboard +/- buttons på 4 MVP-scener (cinema, zen, sofa_laesning,
#     spisestue_middag) i dashboards/scenes.yaml
#
# RESET: input_select.active_scene state-trigger nulstiller level til 0
# når scene skiftes (i automations/scene_spread_reset.yaml).
# =============================================================================

input_number:
  scene_spread_level:
    name: "Scene spread level"
    min: 0
    max: 3
    step: 1
    initial: 0
    icon: mdi:waves
    # Persisterer ikke initial=0 efter restart (HA restore_state). Reset
    # automation nulstiller ved scene-skift.
