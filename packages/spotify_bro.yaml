# Spotify-broen: HA-siden (B237, aktiveret 17/10). Enheden "Højttaler" i
# Spotify-appen er add-on'en local_spotify_bro (addons/spotify_bro/): go-librespot
# + bro.py, der streamer til N3'en som webradio (replaceAndPlay af
# http://192.0.2.151:8098/spotify.l16). Højttalerens egen "myair" er slået FRA
# (input_boolean.hoejttaler_myair) — broen er husets eneste Spotify-vej.
#
# Broen (host-netværk) svarer på 127.0.0.1:8098:
#   GET  /status      → tilstand, titel, kunstner, hoejttaler, ejer_hoejttaler …
#   POST /cmd/<navn>  → pause | resume | play | toggle | next | prev | stop | volume?v=N
# Den beder selv HA om homeassistant.update_entity på sensor.spotify_bro ved hver
# ændring (add-on-option ha_entity); 60-s-pollen er kun en reserve.
#
# Knappen (input_boolean.hoejttaler_spotify_bro) og start/stop-automationen bor
# i packages/hoejttaler.yaml; ankrene der OR'er broen ind (anden_kilde,
# spotify_aktiv, spiller_reelt) også.

rest:
  # Navnet SKAL give sensor.spotify_bro (= add-on'ens ha_entity). Flyttet hertil
  # fra packages/stue_spots_spotify.yaml (Spotify-farverne læser den stadig).
  # position_s og events er udeladt: de skifter ved HVER opdatering og ville
  # skrive en DB-række pr. push for evigt (fejlklasse #24) — /status har dem.
  - resource: http://127.0.0.1:8098/status
    scan_interval: 60
    timeout: 5
    sensor:
      - name: "Spotify-bro"
        unique_id: spotify_bro_status
        icon: mdi:spotify
        value_template: "{{ value_json.tilstand | default('nede') }}"
        json_attributes:
          - aktiv
          - bruger
          - titel
          - kunstner
          - album
          - cover
          - uri
          - varighed_s
          - volumen
          - hoejttaler
          - ejer_hoejttaler
          - klienter
          - tabte_bidder
          - max_laese_pause_s
          - librespot_genstarter
          - url
          - version

rest_command:
  spotify_bro_cmd:
    url: "http://127.0.0.1:8098/cmd/{{ cmd }}{{ ('?v=' ~ (v | int)) if v is defined else '' }}"
    method: post
    timeout: 5

template:
  - binary_sensor:
      # Broen ejer højttaleren og en telefon spiller lige nu.
      # ejer_hoejttaler er sand fra broens replaceAndPlay — FØR Volumio melder
      # broens uri (17/10 15:29:43-47 stod Volumio stadig på P4, og
      # radio-adopteren satte P4-flaget midt i Spotify). hoejttaler == 'spiller'
      # er Volumio-bekræftelsen og dækker en bro der genstartede midt i et nummer.
      - name: "Spotify-bro spiller"
        unique_id: spotify_bro_spiller
        icon: mdi:spotify
        state: >-
          {{ is_state('sensor.spotify_bro', 'playing')
             and (state_attr('sensor.spotify_bro', 'ejer_hoejttaler') == true
                  or is_state_attr('sensor.spotify_bro', 'hoejttaler', 'spiller')) }}
        availability: >-
          {{ states('sensor.spotify_bro') not in ['unavailable', 'unknown'] }}
