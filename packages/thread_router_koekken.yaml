# =============================================================================
# Thread router køkken — GRILLPLATS-plug der SKAL være tændt (fra 2026-10-15)
# =============================================================================
# User 15/10: "jeg tager grillplats fra soveværelset og sætter i køkkenet (skal
# være always on)". Matter node 499 (0x1F3), før switch.sove_lyskaede — intet
# tilsluttet, den er der kun som Thread-router. Power-on: on (sat 15/10).
#
# Knappen på pluggen (eller et app-tryk) kan slukke den → tænd igen efter 10 s.
# Ét Matter-kald pr. sluk, continue_on_error (CHIP-timeout aborterer ellers).
# Restart-vejen: en sluk der skete lige før en restart når aldrig sin `for:`.
# AirBnB: samme adfærd — der er intet lys på pluggen, en gæst mærker intet.
# =============================================================================

automation:
  - id: thread_router_koekken_altid_taendt
    alias: "Thread router køkken: altid tændt"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.thread_router_koekken
        to: "off"
        for: "00:00:10"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: switch.thread_router_koekken
        state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.thread_router_koekken
        continue_on_error: true
