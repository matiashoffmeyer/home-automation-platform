# =============================================================================
# Roborock — auto-kadence målt i AKTIVE TIMER (user-spec 2026-09-01)
# =============================================================================
# User: "hvor ofte robotstøvsugeren kører selv på dormant … skal ikke være
# baseret på dage men på ACTIVE timer i huset. Timer med børn i huset tæller
# dobbelt."
#
# ERSTATTER `input_number.roborock_auto_interval_dage` som gate i
# `roborock_dormant_start`. Rationalet: et døgn hvor huset stod tomt gør ikke
# gulvet beskidt, og et døgn med to børn hjemme gør det dobbelt så beskidt som
# et døgn med to voksne. Kalenderen målte ingen af delene.
#
# HVORFOR EN SKREVET AKKUMULATOR OG IKKE history_stats:
#   `binary_sensor.kids_home` er RECORDER-EKSKLUDERET (configuration.yaml —
#   1448 rows/døgn via mirror-attrs). Der findes derfor ingen historik at
#   integrere over, og en history_stats-løsning ville tavst tælle børne-timer
#   som 0. Dertil kommer at recorderen kun holder 14 dage, mens et langt
#   interval (eller en ferie) sagtens kan spænde længere. Tallet skal altså
#   være SKREVET, ikke udledt (samme regel som last_changed-forbuddet i
#   CLAUDE.md → "Brug en skrevet værdi").
#
# KALIBRERING (målt 2026-09-01 mod recorderen, 14 døgn — ikke gættet):
#   - `input_select.house_state` == Active: 21,6 t/døgn i snit (min 16,0,
#     max 24,0 — huset er sjældent dormant ret længe).
#   - `input_boolean.boern_sov_her_i_nat` (primærsignalet bag kids_home): on
#     69 % af tiden.
#   → vægtet opsparing ≈ 21,6 × 1,69 ≈ 36 t/døgn.
#   → de hidtidige 3 døgn svarer til ~105 vægtede aktiv-timer = default.
#   Ændrer familiens rytme sig, flytter kadencen sig SELV — det er hele pointen.
#
# AIRBNB (CLAUDE.md 🏡): opsparingen kører også i AirBnB og Home Vacation, og
# nulstilles BEVIDST ikke ved mode-skift. En gæsteuge gør gulvet beskidt
# præcis som en familieuge, så snavset skal arves over check-ud — selve
# auto-starten er allerede AirBnB-vetoet i `roborock_dormant_start`, og
# AirBnB-checkout har sin egen rengøring (packages/airbnb_checkout.yaml).
# Ingen ny suppressor, ingen ny lockdown-post.
# =============================================================================

input_number:
  # TÆRSKLEN. Vægtede aktiv-timer der skal spares op siden sidste HEL-HUS-
  # rengøring, før robotten selv må starte på Dormant. Min 12 = "cirka hver
  # halve dag", max 400 ≈ 11 døgn ved den målte rate.
  roborock_auto_interval_aktiv_timer:
    name: "Roborock: aktive timer mellem auto-rengøringer"
    icon: mdi:timer-cog-outline
    min: 12
    max: 400
    step: 5
    unit_of_measurement: "t"
    mode: box

  # RUNTIME-akkumulator (minutter, heltal — ikke timer med decimaler, så der
  # ikke akkumuleres flydende-komma-drift over tusindvis af tick). Skrives af
  # roborock_aktiv_timer_tick hvert kvarter og nulstilles ved hel-hus-rengøring.
  # INTET `initial:` — værdien SKAL overleve en HA-restart (CLAUDE.md:
  # "initial: RESTORER IKKE — den PÅTVINGER").
  roborock_aktiv_minutter_akkumuleret:
    name: "Roborock: opsparede aktiv-minutter (vægtet)"
    icon: mdi:timer-sand-full
    min: 0
    max: 100000
    step: 1
    unit_of_measurement: "min"
    mode: box

  # 2026-09-23 (user-spec): ren støvsugning (hel-hus QUICK, måltids-/let-stue-
  # segment, app-kørsel uden mop) nulstiller IKKE, men gør huset "lidt renere"
  # → træk denne procent af den OPSPAREDE tid. Procent af det opsparede (ikke
  # af målet), så en støvsugning lige efter en fuld rengøring næsten intet
  # trækker, og tælleren aldrig kan gå under nul. 0 = ingen effekt.
  roborock_stoevsug_reduktion_pct:
    name: "Roborock: støvsugning trækker fra opsparet tid (%)"
    icon: mdi:percent-circle-outline
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider

input_datetime:
  # Dedupe for delvis-reduktionen: slut-tiden på den sidst behandlede kørsel.
  roborock_stoevsug_reduktion_at:
    name: "Roborock: sidste støvsugnings-reduktion"
    has_date: true
    has_time: true
  # Stempel for hvornår akkumulatoren sidst blev nulstillet. Findes for at
  # nulstillingen kan være en SAMMENLIGNING frem for en ren flanke (fejlklasse
  # #4): misser HA flanken — restart midt i en rengøring, template.reload,
  # automation deaktiveret — retter /30-backstoppen op på det af sig selv.
  roborock_aktiv_timer_nulstillet_at:
    name: "Roborock: aktiv-timer nulstillet"
    has_date: true
    has_time: true

input_select:
  # HVAD robotten gør når den selv starter på Dormant (user-spec 2026-09-01).
  # Første option = default ved fresh install og bevarer den hidtidige adfærd,
  # så der ikke skal en linje i init_user_preferences til.
  # "Let stue-rengøring" er BEVIDST ikke en option: den stempler ikke
  # `roborock_last_completed`, så gaten ville blive stående sand og
  # /15-backstoppen ville sende robotten i stuen hvert kvarter resten af
  # Dormant-sessionen. Mellemdagenes lette tur har sin egen killswitch
  # (`input_boolean.roborock_let_stue_enabled`).
  roborock_auto_dormant_handling:
    name: "Roborock: hvad gør den selv på Dormant"
    icon: mdi:robot-vacuum-variant
    options:
      - "Auto (børn og kadence)"
      - "Fuld rengøring"
      - "Grundig rengøring"
      - "Kun støvsugning"

template:
  - sensor:
      # ÉT ANKER for "er der sparet nok aktiv-tid op?" — både gaten i
      # roborock_dormant_start, morgen-varslet i roborock_varsler.yaml og
      # dashboard-tilen læser `maa_starte` herfra, så de ikke kan divergere
      # (fejlklasse #2). Afløser sensor.roborock_dage_siden_rengoring's
      # tidligere maa_starte/interval_dage-attributter.
      #
      # NB (fejlklasse #24): `binary_sensor.kids_home` læses BEVIDST ikke i en
      # attribut her — den er recorder-ekskluderet netop fordi den churner, og
      # en attribut der spejler den ville smugle churnen ind igen. Vil du se om
      # der tælles dobbelt lige nu, så vis kids_home som sin egen tile.
      - name: "Roborock aktive timer siden rengøring"
        # HA-slugify: ø→o → sensor.roborock_aktive_timer_siden_rengoring.
        unique_id: roborock_aktive_timer_siden_rengoring
        unit_of_measurement: "t"
        state_class: measurement
        icon: mdi:timer-play-outline
        state: >-
          {{ (states('input_number.roborock_aktiv_minutter_akkumuleret')
              | float(0) / 60) | round(1) }}
        attributes:
          interval_timer: >-
            {{ states('input_number.roborock_auto_interval_aktiv_timer') | int(105) }}
          timer_tilbage: >-
            {% set t = states('input_number.roborock_aktiv_minutter_akkumuleret')
                       | float(0) / 60 %}
            {% set g = states('input_number.roborock_auto_interval_aktiv_timer')
                       | float(105) %}
            {{ [g - t, 0] | max | round(1) }}
          procent: >-
            {% set t = states('input_number.roborock_aktiv_minutter_akkumuleret')
                       | float(0) / 60 %}
            {% set g = states('input_number.roborock_auto_interval_aktiv_timer')
                       | float(105) %}
            {{ [(100 * t / g) if g > 0 else 100, 100] | min | round(0) | int }}
          # Beregnes UAFHÆNGIGT af sensorens egen state — en self-ref til egen
          # sensor gav unavailable/deadlock i gardiner_manual_hold (2026-06-18).
          maa_starte: >-
            {{ (states('input_number.roborock_aktiv_minutter_akkumuleret')
                | float(0) / 60)
               >= (states('input_number.roborock_auto_interval_aktiv_timer')
                   | float(105)) }}
          nulstillet: >-
            {% set t = state_attr('input_datetime.roborock_aktiv_timer_nulstillet_at',
                                  'timestamp') %}
            {% if t is none or (t | float(0)) <= 0 %}aldrig
            {% else %}{{ (t | float(0) | as_datetime | as_local).strftime('%a %d-%m %H:%M') }}
            {% endif %}

automation:
  # ---------------------------------------------------------------------------
  # 1) Opsamling — hvert kvarter mens huset er Active
  # ---------------------------------------------------------------------------
  - id: roborock_aktiv_timer_tick
    alias: "Roborock: opsaml aktive timer (børn tæller dobbelt)"
    description: >
      Lægger 15 min til akkumulatoren pr. tick huset er Active — 30 min hvis
      børnene er hjemme (user-spec: "timer med børn i huset tæller dobbelt").
      Tæller IKKE mens godnat er aktivt (user-spec 1/9): Active kan hænge on
      efter sengetid, og en sovende husstand snavser ikke gulvet.
      /15 og ikke /5 med vilje (fejlklasse #7): 96 fires/døgn i stedet for 288,
      og et kvarters opløsning er rigeligt mod et budget på ~105 TIMER.
      Er HA nede, tælles tiden ikke med — det forsinker kun næste rengøring,
      altså den sikre retning.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: state
        entity_id: input_select.house_state
        state: "Active"
      - condition: state
        entity_id: input_boolean.godnat_active
        state: "off"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.roborock_aktiv_minutter_akkumuleret
        data:
          value: >-
            {% set nu = states('input_number.roborock_aktiv_minutter_akkumuleret')
                        | float(0) %}
            {% set skridt = 30 if is_state('binary_sensor.kids_home', 'on') else 15 %}
            {{ [nu + skridt, 100000] | min }}

  # ---------------------------------------------------------------------------
  # 2) Nulstilling ved gennemført HEL-HUS-rengøring
  # ---------------------------------------------------------------------------
  - id: roborock_aktiv_timer_nulstil
    alias: "Roborock: nulstil aktiv-timer efter hel-hus-rengøring"
    description: >
      `input_datetime.roborock_last_completed` er husets ENESTE anker for
      "hel-hus-rengøring gennemført" og stemples af alle veje — auto, Styrbar og
      app-startet (roborock_fremmed_clean_stamp). Ved at hænge nulstillingen på
      DEN i stedet for på de enkelte start-scripts kan en ny start-vej ikke
      glemme at nulstille (fejlklasse #1).
      Segment-/spot-cleans (måltids-støvsugning, let stue-tur) stempler bevidst
      ikke last_completed og nulstiller derfor heller ikke opsparingen — en
      delvis rengøring har ikke gjort hele huset rent.
      Betingelsen er en SAMMENLIGNING (completed > nulstillet), ikke en flanke,
      så /30-backstoppen selv retter op hvis state-flanken blev spist af en
      restart eller et reload (fejlklasse #4/#15).
    mode: single
    # 2026-09-23 (user-spec): "skal ikke nulstilles af støvsugning, kun af full
    # house gulvvask+støvsugning". Ankeret er derfor `roborock_last_full_completed`
    # (stemples af FULL/MAX-sessioner og af app-startede hel-hus-kørsler med mop
    # tændt). Ren støvsugning trækker i stedet en procent fra — se
    # roborock_aktiv_timer_delvis_reduktion nedenfor. Målt samme morgen: en
    # QUICK kl. 07:07 nulstillede 22,8 t.
    trigger:
      - platform: state
        entity_id: input_datetime.roborock_last_full_completed
      - platform: time_pattern
        minutes: "/30"
    condition:
      # Stemplerne læses via `timestamp`-ATTRIBUTTEN — as_timestamp() på den
      # naive input_datetime-streng fortolker den som UTC og giver 2 t skew.
      # Tidsdel-testen skiller "aldrig sat" (= dagens midnat) fra en ægte
      # rengøring kl. 00:00.
      - condition: template
        value_template: >-
          {% set raw = states('input_datetime.roborock_last_full_completed') %}
          {% set c = state_attr('input_datetime.roborock_last_full_completed',
                                'timestamp') | float(0) %}
          {% set n = state_attr('input_datetime.roborock_aktiv_timer_nulstillet_at',
                                'timestamp') | float(0) %}
          {{ raw not in ['unknown', 'unavailable', 'none', '']
             and raw[11:] != '00:00:00' and c > 0 and c > n }}
    action:
      - service: logbook.log
        data:
          name: "Roborock"
          message: >-
            Fuld rengøring (sug + mop) gennemført — aktiv-timer nulstillet fra
            {{ (states('input_number.roborock_aktiv_minutter_akkumuleret')
                | float(0) / 60) | round(1) }} t
            (mål {{ states('input_number.roborock_auto_interval_aktiv_timer')
                    | int(105) }} t).
      - service: input_number.set_value
        target:
          entity_id: input_number.roborock_aktiv_minutter_akkumuleret
        data:
          value: 0
      # set_datetime, IKKE set_value — sidstnævnte giver 400: Bad Request.
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.roborock_aktiv_timer_nulstillet_at
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # ---------------------------------------------------------------------------
  # 3) Delvis reduktion ved ALT andet end en fuld rengøring (2026-09-23)
  # ---------------------------------------------------------------------------
  # Trigger = robottens EGEN slut-tid (sensor.s8_maxv_ultra_last_clean_end),
  # som ændrer sig for HVER afsluttet kørsel uanset hvem der startede den —
  # så en ny start-vej ikke kan glemme reduktionen (fejlklasse #1). Venter 90 s
  # og tjekker om kørslen i mellemtiden blev stemplet FULL (nulstillingen ejer
  # den), så de to ikke begge rører akkumulatoren. Dedupe = sammenligning mod
  # det skrevne stempel, ikke en flanke (restart-sikker, #4).
  - id: roborock_aktiv_timer_delvis_reduktion
    alias: "Roborock: støvsugning trækker % fra aktiv-timer"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.s8_maxv_ultra_last_clean_end
        not_from: ["unknown", "unavailable"]
        not_to: ["unknown", "unavailable"]
    condition:
      - condition: template
        value_template: >-
          {% set e = as_timestamp(states('sensor.s8_maxv_ultra_last_clean_end'), 0) %}
          {% set d = state_attr('input_datetime.roborock_stoevsug_reduktion_at', 'timestamp') | float(0) %}
          {{ e > 0 and e > d and (as_timestamp(now()) - e) < 3600 }}
    action:
      - delay: "00:01:30"
      - variables:
          slut: "{{ as_timestamp(states('sensor.s8_maxv_ultra_last_clean_end'), 0) }}"
          full: >-
            {% set f = state_attr('input_datetime.roborock_last_full_completed', 'timestamp') | float(0) %}
            {% set n = state_attr('input_datetime.roborock_aktiv_timer_nulstillet_at', 'timestamp') | float(0) %}
            {{ (f - slut) | abs < 900 or (n - slut) | abs < 900 }}
          pct: "{{ states('input_number.roborock_stoevsug_reduktion_pct') | float(20) }}"
          nu: "{{ states('input_number.roborock_aktiv_minutter_akkumuleret') | float(0) }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.roborock_stoevsug_reduktion_at
        data:
          timestamp: "{{ slut | int }}"
      - condition: template
        value_template: "{{ not full and pct > 0 and nu > 0 }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.roborock_aktiv_minutter_akkumuleret
        data:
          value: "{{ (nu * (1 - pct / 100)) | round(0) | int }}"
      - service: logbook.log
        data:
          name: "Roborock"
          message: >-
            Støvsugning (ikke fuld sug+mop) — aktiv-timer {{ (nu / 60) | round(1) }} t
            → {{ (nu * (1 - pct / 100) / 60) | round(1) }} t (−{{ pct | int }} %).
