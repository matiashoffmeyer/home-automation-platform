# =============================================================================
# AirBnB-udtjekning: en dato for hvornår gæsterne forventes at være ude (B256)
# =============================================================================
# User-spec 2026-10-28 (svar 4 på B256-spørgsmålene): "når airbnb starter skal
# der laves en udtjekningsdato, default 6 dage senere, giv mig push om at rette
# det og lav det på airbnb siden."
#
# HVORFOR: logik der aldrig må køre mens der bor gæster (B256), kan ikke bare
# vente på at house_mode skifter tilbage — det kræver at nogen husker at slå
# AirBnB fra. Datoen er grænsen: efter den regnes gæsterne for rejst, også
# selvom house_mode stadig står på AirBnB. Pakken er bevidst offentlig (en
# generisk AirBnB-dato); selve B256-B258 holdes ude af den offentlige kopi.
#
# ⚠️ BEVIDST UNDTAGELSE FRA "AirBnB = SILENT" (user-spec 2026-10-28), samme
# slags som packages/kamera_airbnb_vagt.yaml: pushen fyrer KUN på flanken ind i
# AirBnB, dvs. i det sekund Parent A selv slår mode til. Den gentages aldrig.
#
# Flanken er den eneste vej ind: alle veje til AirBnB (Indstillinger, check-in-
# nedtællingen i airbnb_checkin_prep.yaml) går gennem input_select'en. Datoen
# ryddes ikke ved exit — uden for AirBnB læser ingen den.
# =============================================================================

input_datetime:
  airbnb_udtjekning:
    name: "AirBnB udtjekning"
    has_date: true
    has_time: false
    icon: mdi:calendar-arrow-right

input_number:
  airbnb_udtjekning_dage:
    name: "AirBnB udtjekning: dage efter start"
    min: 1
    max: 30
    step: 1
    unit_of_measurement: dage
    icon: mdi:calendar-range

automation:
  - id: airbnb_udtjekning_ved_start
    alias: "AirBnB: sæt udtjekningsdato ved start + push"
    description: >-
      Sætter input_datetime.airbnb_udtjekning til i dag + slideren (default 6)
      i det sekund house_mode skifter til AirBnB, og beder Parent A rette den på
      Indstillinger → AirBnB. Bevidst push i AirBnB (se pakkens header).
    mode: single

    triggers:
      - trigger: state
        entity_id: input_select.house_mode
        to: "AirBnB"
        # Eksplicit from: — `unavailable -> AirBnB` efter et reload er ikke en
        # ny gæst og må ikke flytte en rettet dato.
        not_from:
          - "unknown"
          - "unavailable"

    actions:
      - variables:
          dage: "{{ states('input_number.airbnb_udtjekning_dage') | int(6) }}"
          dato: "{{ (now() + timedelta(days=dage)).date() }}"
          dato_kort: "{{ (now() + timedelta(days=dage)).strftime('%-d/%-m') }}"
          ugedag: >-
            {{ ['mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag',
                'søndag'][(now() + timedelta(days=dage)).weekday()] }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.airbnb_udtjekning
        data:
          date: "{{ dato }}"
      - action: notify.mobile_app_phone_a
        continue_on_error: true
        data:
          title: "🏡 AirBnB: udtjekning {{ ugedag }} {{ dato_kort }}"
          message: >-
            Sat til {{ dage }} dage fra i dag. Passer det ikke, så ret datoen
            på Indstillinger → AirBnB.
          data:
            tag: airbnb_udtjekning
            clickAction: /indstillinger-dash/airbnb-tuning
