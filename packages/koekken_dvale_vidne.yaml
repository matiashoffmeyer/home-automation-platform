# =============================================================================
# koekken_dvale_vidne.yaml — køkkenets vidne i dvale-rosteret (2026-08-29, B105)
# =============================================================================
# PROBLEM: huset stod Active i over tre timer med et beviseligt tomt hus (dør
# lukket 09:28:55, familien hjem igen 12:30:42). Køkkenet var det ENESTE rum der
# stadig talte: alle andre rum i rosteret var 1637-1660 s stille, køkkenet 228 s
# — inde i `physical_presence_credible_fast`'s 900 s hukommelses-vindue. Fordi
# der aldrig opstod et 15-minutters hul, holdt køkkenet sensoren permanent ON og
# dræbte BEGGE 30-min-dvale-veje (flag_fast + gps_fast).
#
# Det er ikke et støjniveau man kan tune sig ud af i forbrugeren — det er
# køkkenets egen diskriminator der manglede (house_modes.yaml siger det selv:
# "Rør ikke denne sensors tidsvindue for at kompensere for et støjende rum").
#
# DISKRIMINATOREN: VARIGHED — samme familie som soveværelsets vidne, men et helt
# andet tal, fordi køkkenets fysik er en anden (et menneske i køkkenet BEVÆGER
# sig, en sovende ligger stille). Målt over 26-29/8, 6826 ON-episoder:
#   p50 = 4,2 s ≈ radar-timeouten (5 s) = rene blips, jf. CLAUDE.md
#   • tomt hus 29/8 09:35-12:25:   62 episoder, længste  16,2 s, ≥30 s: 0
#   • nat 27+28+29/8 (alle sover): 1013 episoder, længste 29,0 s, ≥30 s: 0
#   • morgen 26-28/8:              351 episoder, 12-17 over 30 s PR. DAG
#   • aften  26-28/8:              627 episoder,  9-11 over 30 s PR. DAG
# 1075 målte spøgelses-episoder nåede ALDRIG 30 s; hvert eneste menneske-ophold
# producerede 9-17 blokke over 30 s (længste 1237 s). Kravet er altså ikke "hold
# hele besøget" — det er "hold ÉN gang i løbet af besøget", og den bar er lav.
#
# SCOPE — bevidst SMALT, og smallere end soveværelsets: KUN hukommelses-grenen
# i `binary_sensor.physical_presence_credible_fast` læser dette vidne.
# "ON lige nu" bliver ved med at være den rå `koekken_apollo_occupancy_filtered`,
# så et menneske der lige er trådt ind i køkkenet ALDRIG er usynligt i de 30 s
# vidnet venter — ellers kunne dvalen erklæres hen over hovedet på ham. Alle
# andre forbrugere (lys, måltidsdetektion, people_estimate, wasp, roborock)
# rører vi ikke; dér er et hurtigt svar hele pointen.
#
# INGEN delay_off — bevidst, jf. CLAUDE.md: `delay_on` + `delay_off` på SAMME
# template-udtryk bevogter kun ÅBNINGEN, og et 1-samples blip ville annullere
# det ventende `delay_off` uden at opfylde `delay_on`. Hukommelses-grenen læser
# alligevel kun `last_changed`, så et vidne der flapper under madlavning holder
# vinduet friskt af sig selv. Soveværelsets 16-min bro findes fordi DEN sensor
# er vidne i BEGGE grene og taber en liggende krop; her gælder ingen af delene.
# =============================================================================

input_number:
  koekken_dvale_vidne_sekunder:
    name: "Køkken: hold før dvale-vidne tror på det (s)"
    icon: mdi:silverware-clean
    min: 20
    max: 300
    step: 5
    unit_of_measurement: "s"
    mode: box

template:
  - binary_sensor:
      # ON = der har FAKTISK været nogen i køkkenet. Kun dvale-vidne.
      - name: "Koekken dvale vidne"
        unique_id: koekken_dvale_vidne
        device_class: occupancy
        icon: mdi:countertop
        availability: >-
          {{ states('binary_sensor.koekken_apollo_occupancy_filtered')
             not in ['unknown', 'unavailable'] }}
        delay_on: >-
          {{ states('input_number.koekken_dvale_vidne_sekunder') | int(30) }}
        state: "{{ is_state('binary_sensor.koekken_apollo_occupancy_filtered', 'on') }}"
