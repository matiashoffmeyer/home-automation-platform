# =============================================================================
# Apollo per-gate radar-kalibrering — stue / spisestue / køkken / børneværelse
# =============================================================================
# User-spec 2026-07-09b: "fjern one-slider løsningen fra alle andre apolloer og
# giv mig det som sove har nu på de andre apolloer" → SAMME per-gate kontrol som
# soveværelset (packages/sove_apollo_per_gate.yaml) på de 4 øvrige Apolloer.
#
# Den gamle følsomheds-faktor (én slider × alle gates) er FJERNET for ALLE rum:
#   - input_number.{rum}_sensitivity + sensor.{rum}_radar_threshold_factor (global_tuning.yaml)
#   - hele faktor-tuneren (automations/apollo_radar_global_tuning.yaml)
#   - apollo_radar_tune_room + apollo_radar_apply_now (script_pkg/apollo_helpers.yaml)
# Denne pakke + sove-pakken er NU ENESTE AUTORITET over gate-thresholds.
#
# LD2410-fysik: gate = ~0.75 m afstands-bin (g0=0-0.75m … g8=6-6.75m).
#   still_threshold LAV = holder en stille krop i den afstand (for lavt = spøgelse).
#   move_threshold LAV = fanger bevægelse; g0/g1 move HØJT = nærfelt-spøgelses-guard.
#   max_still/move_distance = 5 → gates 6-8 deltager IKKE (irrelevante).
# LAVERE tal = MERE følsom (modsat den gamle følsomheds-slider).
#
# Seed-defaults (init_user_preferences) = de LIVE NVRAM-værdier pr. 2026-07-09
# → cutover ændrer INGEN adfærd; brugeren får bare fuld manuel kontrol fremad.
#
# Chip-wear (Standing Instruction): hver write value-sammenlignes (skip no-op),
# 2s debounce, kun ÆNDRET gate skrives. Ingen periodisk fire.
# =============================================================================

