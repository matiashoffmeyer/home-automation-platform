script:
  stue_apollo_apply_all_gates:
    alias: "Stue Apollo: skriv alle 18 gates fra sliders"
    description: >
      Push alle 18 per-gate sliders til Stue-Apolloens NVRAM. Value-compare pr.
      gate → kun ægte ændringer skrives (chip-wear-sikkert). Brug efter parring/
      factory_reset eller når sliders er sat via API og NVRAM skal synkes.
    sequence:
      - condition: template
        value_template: "{{ states('binary_sensor.stue_apollo_occupancy') != 'unavailable' }}"
      - repeat:
          for_each: [0, 1, 2, 3, 4, 5, 6, 7, 8]
          sequence:
            - variables:
                still_entity: "number.stue_apollo_g{{ repeat.item }}_still_threshold"
                still_target: "{{ states('input_number.stue_g' ~ repeat.item ~ '_still') | float(0) | round(0) | int }}"
                move_entity: "number.stue_apollo_g{{ repeat.item }}_move_threshold"
                move_target: "{{ states('input_number.stue_g' ~ repeat.item ~ '_move') | float(0) | round(0) | int }}"
            - if:
                - condition: template
                  value_template: "{{ (states(still_entity) | float(-1)) | round(0) | int != still_target }}"
              then:
                - service: number.set_value
                  continue_on_error: true
                  data:
                    entity_id: "{{ still_entity }}"
                    value: "{{ still_target }}"
            - if:
                - condition: template
                  value_template: "{{ (states(move_entity) | float(-1)) | round(0) | int != move_target }}"
              then:
                - service: number.set_value
                  continue_on_error: true
                  data:
                    entity_id: "{{ move_entity }}"
                    value: "{{ move_target }}"
      - service: logbook.log
        data:
          name: "Stue Apollo per-gate"
          message: "Alle 18 gates synket fra sliders → NVRAM (only-changed)."
  spisestue_apollo_apply_all_gates:
