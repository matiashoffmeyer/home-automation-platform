# =============================================================================
# Himmelfænomen-notifikationer — aurora / planeter / lysende natteskyer (2026-06-16)
# =============================================================================
# scripts/sky_notify.py beregner i ren Python om der i nat (kl 21–05) er reel
# chance for nordlys (NOAA Kp-forecast + GRADERET mørke-krav: svagt nordlys Kp 5-6
# kræver astronomisk mørke -18°, kraftig storm Kp≥7 ses i nautisk -12°; sæson-gaten
# falder naturligt ud — Kbh-sommersol når kun ~-11° → ingen falske juli-varsler; +
# lokal Ovation-% fra core Aurora-integration når den er til stede), planet-alignment
# (Schlyter low-precision) eller lysende natteskyer (NLC-sæson) — gated på mørke-
# vindue + skydække fra weather.forecast_home. Sender ÉN samlet notifikation pr. nat til
# notify.mobile_app_phone_a og publicerer sensor.sky_tonight (state = resumé,
# attrs = nordlys/planeter/natteskyer/updated/nat) til Himmel-dashboardet.
#
# WIRING (2026-06-16):
#   - shell_command.sky_notify_scan      → fuld kørsel (publicér + notificér)
#   - shell_command.sky_notify_refresh   → kun publicér sensor (--no-notify)
#   - shell_command.sky_notify_live      → live-vagt: "nordlys NU" (B228)
#   - automations/sky_notifications.yaml → 21:30 nightly scan + HA-start refresh
#                                          + hvert kvarter 17-02 live-vagt
#   - input_boolean.sky_notify_enabled   → kill-switch (kun notifikationen;
#       sensor.sky_tonight opdateres stadig så dashboardet ikke bliver tomt)
#
# SETUP-KRAV (ikke i git — secrets.yaml er .gitignored):
#   /config/secrets.yaml skal indeholde:  ha_api_token: <long-lived token>
#   (samme token som plante-scriptet) + home_latitude/home_longitude
#
# Dedup: /config/.sky_notify_state.json (én prognose- + én live-besked pr. nat;
# HA-start re-fyrer ikke).
# Test lokalt:  python3 scripts/sky_notify.py --dry-run
# =============================================================================
input_boolean:
  sky_notify_enabled:
    name: "Himmel-notifikationer aktiv"
    icon: mdi:weather-night

shell_command:
  sky_notify_scan: "python3 /config/scripts/sky_notify.py"
  sky_notify_refresh: "python3 /config/scripts/sky_notify.py --no-notify"
  sky_notify_live: "python3 /config/scripts/sky_notify.py --live"
