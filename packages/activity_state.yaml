# =============================================================================
# History stats — boern occupancy duration (sprint 2026-05-08)
# =============================================================================
# Smartere kids_home detection: skelner mellem voksen-passing-through (1-3 min
# brief motion) og kid-real-activity (30+ min sustained).
#
# Bruges af binary_sensor.kids_home som signal S2 (4h cumulative) + S3 (today
# cumulative). Kombineret med S1 (sustained current) + S4 (zones>adults) i
# kids_home template — any-of-4 → kids hjemme.
# =============================================================================
sensor:
  - platform: history_stats
    name: "Boern occupancy 4h"
    unique_id: boern_occupancy_4h
    entity_id: binary_sensor.boernevaerelse_apollo_occupancy
    state: 'on'
    type: time
    end: '{{ now() }}'
    duration:
      hours: 4

  - platform: history_stats
    name: "Boern occupancy today"
    unique_id: boern_occupancy_today
    entity_id: binary_sensor.boernevaerelse_apollo_occupancy
    state: 'on'
    type: time
    start: '{{ now().replace(hour=0, minute=0, second=0) }}'
    end: '{{ now() }}'

  # Sprint 2026-05-28: overnight window (yesterday 22:00 → today 06:00).
  # Definitive signal for kids_home: kid der sover i bed → Apollo on through
  # most of night → >=4h overnight occupancy = "kid slept here". Modsat
  # <15min overnight = "definitivt ingen kid her i nat".
  # Window-skift kl 22:00 (start ny natlig overnight-track).
  - platform: history_stats
    name: "Boern occupancy overnight"
    unique_id: boern_occupancy_overnight
    entity_id: binary_sensor.boernevaerelse_apollo_occupancy
    state: 'on'
    type: time
    start: >
      {% if now().hour < 22 %}
        {{ (now().replace(hour=22, minute=0, second=0) - timedelta(days=1)).isoformat() }}
      {% else %}
        {{ now().replace(hour=22, minute=0, second=0).isoformat() }}
      {% endif %}
    end: >
      {% if now().hour < 22 %}
        {{ now().replace(hour=6, minute=0, second=0).isoformat() }}
      {% else %}
        {{ (now().replace(hour=6, minute=0, second=0) + timedelta(days=1)).isoformat() }}
      {% endif %}
