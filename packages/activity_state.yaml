      - name: "Boern sidste tryk"
        unique_id: styrbar_boern_since_press
        icon: mdi:gesture-tap-button
        state: >
          {% set lp = states('input_datetime.styrbar_last_press_boernevaerelse') %}
          {% if lp in ['unknown','unavailable','none'] %}Aldrig
          {% else %}
            {% set s = (now() - strptime(lp, '%Y-%m-%d %H:%M:%S').replace(tzinfo=now().tzinfo)).total_seconds() | int %}
            {% if s < 60 %}{{ s }}s
            {% elif s < 3600 %}{{ (s/60) | int }} min
            {% elif s < 86400 %}{{ (s/3600) | int }} t
            {% else %}{{ (s/86400) | int }} d
            {% endif %}
          {% endif %}

      - name: "Terrasse sidste tryk"
        unique_id: styrbar_terrasse_since_press
        icon: mdi:gesture-tap-button
        state: >
          {% set lp = states('input_datetime.styrbar_last_press_terrasse') %}
          {% if lp in ['unknown','unavailable','none'] %}Aldrig
          {% else %}
            {% set s = (now() - strptime(lp, '%Y-%m-%d %H:%M:%S').replace(tzinfo=now().tzinfo)).total_seconds() | int %}
            {% if s < 60 %}{{ s }}s
            {% elif s < 3600 %}{{ (s/60) | int }} min
            {% elif s < 86400 %}{{ (s/3600) | int }} t
            {% else %}{{ (s/86400) | int }} d
            {% endif %}
          {% endif %}

      - name: "Depot sidste tryk"
        unique_id: styrbar_depot_since_press
        icon: mdi:gesture-tap-button
        state: >
          {% set lp = states('input_datetime.styrbar_last_press_depot') %}
