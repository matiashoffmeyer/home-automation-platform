# =============================================================================
# Scene State Tracking — for dashboard mutual-exclusive toggle behavior
# =============================================================================
# Tilfojet 2026-05-03 efter dashboard bug-rapport.
#
# input_select.active_scene holder navnet paa den aktuelt aktive scene
# (ELLER 'none' hvis ingen). Scenes saetter den selv via script.scene_toggle.
#
# 10 template binary_sensors driver dashboard tiles' ON/OFF state. Tile
# viser "active" highlight naar scene matcher input_select. Tap-on-active
# clearer scenen og slukker lys (eller revert til auto — TBD).
#
# Mutual exclusion: kun én scene kan vaere aktiv ad gangen — saettes til
# 'none' naar bruger toggler off, eller automatisk naar ny scene starter.
# =============================================================================

input_datetime:
  # Sat af BEGGE fest-udgange (script.scene_toggle's exit-gren og
  # script.dance_room_modes_release) LIGE FØR lysene slukkes. Læses kun af
  # app-justerings-detektoren (automations/manual_override.yaml), der bruger
  # den til at skelne "brugeren rydder op efter en fest" fra "brugeren
  # overstyrer et rum". Skrevet værdi frem for last_changed, fordi
  # last_changed nulstilles ved HA-restart og så ville lyve om friskhed.
  fest_slut_stempel:
    name: "Fest/mood sluttede (internal)"
    icon: mdi:party-popper
    has_date: true
    has_time: true

input_select:
  active_scene:
    name: "Aktiv scene"
    icon: mdi:palette-swatch
    options:
      - "none"
      - zen
      - sofa_laesning   # 2026-05-21: daily reading scene
      - spisestue_middag # 2026-05-21: daily dinner scene
      - madlavning      # 2026-05-22: køkken cooking focus
      - hverdagsaften   # 2026-05-22: balanced family-time baseline
      - winddown        # 2026-05-22: pre-godnat dim warm everywhere
      - cirkus
      - foedselsdag   # 2026-08-16: Dannebrog rød/hvid, bytter hvert 5. min
      - party
      - full_bright
      - private    # 2026-05-06: replaced punk
      - blue
      - happy
      - sunset
      - cyberpunk
    initial: "none"

template:
  - binary_sensor:
      # Friendly names 2026-05-21: scope-prefix tilføjet så user kan se i
      # entity-listen hvor hver scene applikerer. unique_id uændret for at
      # bevare entity_id'er (downstream automations bruger dem).
      - name: "Sofa Zen active"
        unique_id: scene_zen_active
        state: "{{ is_state('input_select.active_scene', 'zen') }}"
        icon: mdi:meditation
      - name: "Sofa Læsning active"
        unique_id: scene_sofa_laesning_active
        state: "{{ is_state('input_select.active_scene', 'sofa_laesning') }}"
        icon: mdi:book-open-page-variant
      - name: "Spisestue Middag active"
        unique_id: scene_spisestue_middag_active
        state: "{{ is_state('input_select.active_scene', 'spisestue_middag') }}"
        icon: mdi:silverware-fork-knife
      # Sprint 2026-05-22 PM: 3 nye daily scener.
      # ⚠️ NAMING GOTCHA: HA deriver INITIAL entity_id fra `name` (slugified),
      # IKKE fra `unique_id`. Disse 3 fik først id'erne kokken_madlavning_active,
      # hverdagsaften_active, winddown_active — derefter manuelt omdøbt i
      # entity-registry via WS API til scene_X_active (matcher de 12 ældres
      # konvention). Future addition: enten brug `name: "Scene X active"`
      # eller post-deploy rename via config/entity_registry/update.
      - name: "Køkken Madlavning active"
        unique_id: scene_madlavning_active
        state: "{{ is_state('input_select.active_scene', 'madlavning') }}"
        icon: mdi:pot-steam
      - name: "Hverdagsaften active"
        unique_id: scene_hverdagsaften_active
        state: "{{ is_state('input_select.active_scene', 'hverdagsaften') }}"
        icon: mdi:home-heart
      - name: "Winddown active"
        unique_id: scene_winddown_active
        state: "{{ is_state('input_select.active_scene', 'winddown') }}"
        icon: mdi:moon-waning-crescent
      - name: "Fælles Cirkus active"
        unique_id: scene_cirkus_active
        state: "{{ is_state('input_select.active_scene', 'cirkus') }}"
        icon: mdi:tent
      # ⚠️ name-slug'en ER entity_id'et (se gotcha-noten ovenfor) → "Scene
      # Foedselsdag active" giver binary_sensor.scene_foedselsdag_active, som
      # tile + scene-drift-validatoren forventer. Skriv IKKE ø her (ø→o i
      # HA-slugify ville give scene_fodselsdag_active).
      - name: "Scene Foedselsdag active"
        unique_id: scene_foedselsdag_active
        state: "{{ is_state('input_select.active_scene', 'foedselsdag') }}"
        icon: mdi:cake-variant
      - name: "Hus Party active"
        unique_id: scene_party_active
        state: "{{ is_state('input_select.active_scene', 'party') }}"
        icon: mdi:party-popper
      - name: "Alt Fuld Lys active"
        unique_id: scene_full_bright_active
        state: "{{ is_state('input_select.active_scene', 'full_bright') }}"
        icon: mdi:white-balance-sunny
      - name: "Sove Private active"
        unique_id: scene_private_active
        state: "{{ is_state('input_select.active_scene', 'private') }}"
        icon: mdi:incognito
      - name: "Fælles Blue active"
        unique_id: scene_blue_active
        state: "{{ is_state('input_select.active_scene', 'blue') }}"
        icon: mdi:waves
      - name: "Hus Happy active"
        unique_id: scene_happy_active
        state: "{{ is_state('input_select.active_scene', 'happy') }}"
        icon: mdi:emoticon-happy
      - name: "Fælles Sunset active"
        unique_id: scene_sunset_active
        state: "{{ is_state('input_select.active_scene', 'sunset') }}"
        icon: mdi:weather-sunset
      - name: "Hus Cyberpunk active"
        unique_id: scene_cyberpunk_active
        state: "{{ is_state('input_select.active_scene', 'cyberpunk') }}"
        icon: mdi:robot

      # === Mood-pause PR. RUM (2026-08-16) ===
      # `cirkus_active` er mood-pause-flaget: så længe det er on, holder
      # presence-lys, drift-back, morgen-sanity og terrasse-logik fingrene væk.
      # Men flaget er HUS-DÆKKENDE, og de tre moods der sætter det ejer kun
      # hvert sit udsnit af huset (se sensor.mood_pause_rooms). Rum uden for
      # mood'ens roster mistede derfor al auto-tænd i hele sessionen og stod
      # mørke — samme fejl som dance_mode havde før 2026-08-02, bare på det
      # andet flag. Forbrugerne læser nu RUMMETS sensor; `state: "off"` i deres
      # conditions er uændret, så en `unavailable` mood-flag stadig pauser
      # (sensorerne er true når flaget ikke er et rent 'off').
      - name: "Mood pause stue"
        unique_id: mood_pause_stue
        icon: mdi:party-popper
        state: "{{ 'stue' in (state_attr('sensor.mood_pause_rooms', 'rooms') or []) }}"
      - name: "Mood pause sovevaerelse"
        unique_id: mood_pause_sovevaerelse
        icon: mdi:party-popper
        state: "{{ 'sovevaerelse' in (state_attr('sensor.mood_pause_rooms', 'rooms') or []) }}"
      - name: "Mood pause boernevaerelse"
        unique_id: mood_pause_boernevaerelse
        icon: mdi:party-popper
        state: "{{ 'boernevaerelse' in (state_attr('sensor.mood_pause_rooms', 'rooms') or []) }}"
      - name: "Mood pause badevaerelse"
        unique_id: mood_pause_badevaerelse
        icon: mdi:party-popper
        state: "{{ 'badevaerelse' in (state_attr('sensor.mood_pause_rooms', 'rooms') or []) }}"
      - name: "Mood pause depot"
        unique_id: mood_pause_depot
        icon: mdi:party-popper
        state: "{{ 'depot' in (state_attr('sensor.mood_pause_rooms', 'rooms') or []) }}"
      - name: "Mood pause entre"
        unique_id: mood_pause_entre
        icon: mdi:party-popper
        state: "{{ 'entre' in (state_attr('sensor.mood_pause_rooms', 'rooms') or []) }}"
      - name: "Mood pause terrasse"
        unique_id: mood_pause_terrasse
        icon: mdi:party-popper
        state: "{{ 'terrasse' in (state_attr('sensor.mood_pause_rooms', 'rooms') or []) }}"

  - sensor:
      # ENESTE sted rosteret "hvilke rum ejer den aktive mood?" findes
      # (fejlklasse #2). Listerne er afledt af scene-scripternes faktiske
      # entity-targets i script_pkg/scenes.yaml — ændrer du en scenes lys,
      # ændr rosteret her i samme commit. koekken/spisestue tæller som 'stue'
      # her: rosteret peger på mood_pause_<rum>-sensorerne, og en mood ejer
      # open-plannet som ÉT fysisk rum. Det er bevidst uafhængigt af
      # room_mode-splittet 2026-09-03d (som handler om manuel betjening).
      - name: "Mood pause rooms"
        unique_id: mood_pause_rooms
        icon: mdi:party-popper
        state: >-
          {{ 'none' if is_state('input_boolean.cirkus_active', 'off')
             else states('input_select.active_scene') }}
        attributes:
          rooms: >-
            {% set roster = {
              'foedselsdag': ['stue', 'badevaerelse', 'boernevaerelse'],
              'cirkus': ['stue', 'depot', 'terrasse'],
              'party': ['stue', 'badevaerelse', 'boernevaerelse', 'depot',
                        'entre', 'terrasse']
            } %}
            {% set alle = ['stue', 'sovevaerelse', 'boernevaerelse',
                           'badevaerelse', 'depot', 'entre', 'terrasse'] %}
            {# Ukendt/stuck flag → hele huset, dvs. adfærden før 08-16. #}
            {{ [] if is_state('input_boolean.cirkus_active', 'off')
               else roster.get(states('input_select.active_scene'), alle) }}
