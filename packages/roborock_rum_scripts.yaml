automation:
  # ---------------------------------------------------------------------------
  # Dispatch på flanken: robotten blev ledig
  # ---------------------------------------------------------------------------
  # `for: 15s` fordi robotten skifter til docked et øjeblik før dokken har
  # accepteret den — en kommando i det vindue bliver tavst tabt.
  - id: roborock_rum_koe_dispatch_ledig
    alias: "Roborock rum-kø: robotten blev ledig → start næste"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: vacuum.s8_maxv_ultra
        to: "docked"
        for: "00:00:15"
      - platform: state
        entity_id: vacuum.s8_maxv_ultra
        to: "idle"
        for: "00:00:15"
      - platform: state
        entity_id: binary_sensor.s8_maxv_ultra_cleaning
        to: "off"
        for: "00:00:20"
    # BEVIDST uden kø-betingelse (modsat backstoppen): er køen tom, rydder
    # kicket "kører nu"-visningen og stopper straks. Havde flanken krævet en
    # ikke-tom kø, ville den sidste opgave stå som "kører nu" for evigt, fordi
    # intet andet kalder kicket når køen er tømt.
    action:
      - service: script.roborock_rum_koe_kick

  # ---------------------------------------------------------------------------
  # Backstop — den eneste vej der overlever en HA-restart
  # ---------------------------------------------------------------------------
  # Står robotten allerede i dokken når HA kommer op, sker der ALDRIG en ny
  # `to: docked`-flanke, og køen ville hænge for evigt (💡 Permanente fakta:
  # "En HA-restart dræber ethvert to:X for:N der venter på en flanke der
  # allerede er sket"). Ticket er også re-armen for de tilfælde hvor robotten
  # var optaget/lavt på batteri da flanken kom (fejlklasse #4).
  - id: roborock_rum_koe_backstop
    alias: "Roborock rum-kø: backstop-tick (start næste hvis ledig)"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: time_pattern
        minutes: "/2"
      - platform: homeassistant
        event: start
    condition:
      - condition: numeric_state
        entity_id: sensor.roborock_rum_koe
        above: 0
    action:
      - service: script.roborock_rum_koe_kick

  # ---------------------------------------------------------------------------
  # Automatisk udgang
  # ---------------------------------------------------------------------------
  # En kø der aldrig blev afviklet (robot offline, fejl, tom vandtank) må ikke
  # overleve til næste døgn og pludselig starte en gulvvask midt om natten.
  # Uret måles på det SKREVNE stempel, ikke last_changed (fejlklasse #5), og
  # `as_timestamp()` på et input_datetimes state-streng læses som UTC → brug
  # `timestamp`-attributten i stedet.
  - id: roborock_rum_koe_giv_op
    alias: "Roborock rum-kø: giv op og ryd efter timeout"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: numeric_state
        entity_id: sensor.roborock_rum_koe
        above: 0
      - condition: template
        value_template: >-
          {% set ts = state_attr('input_datetime.roborock_rum_koe_stemplet', 'timestamp') | float(0) %}
          {% set maks = states('input_number.roborock_rum_koe_max_ventetid_minutter') | float(240) %}
          {{ ts > 0 and (as_timestamp(now()) - ts) > (maks * 60) }}
    action:
      - variables:
          tekst: "{{ state_attr('sensor.roborock_rum_koe', 'tekst') }}"
          antal: "{{ states('sensor.roborock_rum_koe') | int(0) }}"
      - service: script.roborock_rum_koe_ryd
      - service: script.push_notify
        data:
          notif_id: roborock
          title: "🧹 Rum-kø opgivet"
          message: >-
            {{ antal }} ventende rengøring(er) blev ryddet — robotten blev
            aldrig ledig indenfor
            {{ states('input_number.roborock_rum_koe_max_ventetid_minutter') | int(240) }}
            min. Stod i kø: {{ tekst }}.
