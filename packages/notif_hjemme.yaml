# =============================================================================
# Notif hjemkomst-kø — "vent til jeg er hjemme (GPS)" pr. varsel-type
# =============================================================================
# Sprint 2026-07-18 (user-spec): "varsler som jeg ikke kan gøre noget ved når
# jeg ikke er hjemme skal først affyres når jeg kommer hjem (gps). planter,
# støvsuger etc."
#
# MEKANIK: script.push_notify (packages/notifikationer.yaml) tjekker pr.
# modtager-telefon: er notif_<nid>_hjemme ON og personens GPS ikke hjemme,
# køes varslet (scripts/notif_queue.py -> /config/notif_queue.jsonl) i stedet
# for at sende. PR. PERSON (user-valg): er Parent B hjemme får hun sin push
# straks, Parent A's kopi venter på hans ankomst. Flush ved person->home +
# /30-backstop (fejlklasse #4/#15: dækker tidsvindue-åbning, AirBnB-exit,
# master-genaktivering, fejlede sends, HA-restart) + AirBnB-exit-flanke.
# Ingen alders-drop (user-valg: "send alt") — dubletter pr. (target, nid,
# titel) kollapses til nyeste i scriptet.
#
# Toggles for ALLE nids (defaults ON: planter, roborock, maaltid, batteri,
# remote_offline, dug — resten OFF; sikkerhed/vandlaek/backup skal netop
# HELLERE pushe mens man er væk). Tiles: settings.yaml 🔔-fanen.
# Snapshot: helpers_export.py fanger notif_*-booleans automatisk.
# =============================================================================

input_boolean:
  notif_batteri_hjemme:
    name: "🔋 Lavt/kritisk batteri — vent til hjemkomst"
    icon: mdi:home-clock
  notif_remote_offline_hjemme:
    name: "📟 Remote svarer ikke — vent til hjemkomst"
    icon: mdi:home-clock
  notif_lys_watchdog_hjemme:
    name: "💡 Lys-watchdog — vent til hjemkomst"
    icon: mdi:home-clock
  notif_bad_lys_hjemme:
    name: "🐝 Bad-lys hænger — vent til hjemkomst"
    icon: mdi:home-clock
  notif_planter_hjemme:
    name: "🌱 Plante-vanding — vent til hjemkomst"
    icon: mdi:home-clock
  notif_putning_hjemme:
    name: "🛏️ Putning — vent til hjemkomst"
    icon: mdi:home-clock
  notif_vejr_hjemme:
    name: "🌦️ Vejr-varsel — vent til hjemkomst"
    icon: mdi:home-clock
  # Default OFF: et regn-FACIT er ren information om noget der allerede er
  # sket — der er intet at handle på ved hjemkomst, og udskudt er det bare gammelt.
  notif_regn_rapport_hjemme:
    name: "🌧️ Regn-facit — vent til hjemkomst"
    icon: mdi:home-clock
  notif_dug_hjemme:
    name: "💧 Dug-varsel — vent til hjemkomst"
    icon: mdi:home-clock
  # Default ON (2026-08-29, user-spec: "når jeg kommer hjem eller er hjemme").
  # At lufte ud er en fysisk handling — varslet er værdiløst mens han er væk.
  notif_fugt_hjemme:
    name: "💧 Høj luftfugtighed — vent til hjemkomst"
    icon: mdi:home-clock
  notif_nordlys_hjemme:
    name: "🌌 Nordlys / NLC — vent til hjemkomst"
    icon: mdi:home-clock
  notif_vandlaek_hjemme:
    name: "🚨 Vandlæk — vent til hjemkomst"
    icon: mdi:home-clock
  notif_airbnb_hjemme:
    name: "✅ AirBnB check-in — vent til hjemkomst"
    icon: mdi:home-clock
  notif_apollo_hjemme:
    name: "👻 Apollo spøgelses-flap — vent til hjemkomst"
    icon: mdi:home-clock
  notif_elpris_hjemme:
    name: "⚡ Høj elpris — vent til hjemkomst"
    icon: mdi:home-clock
  # Kun indkøbslisten kan udskydes — selve ret-spørgsmålet sendes uden om
  # dispatchen (per-telefon svar-knapper) og har derfor ingen kø-mulighed.
  notif_mad_indkoeb_hjemme:
    name: "🛒 Indkøbsliste — vent til hjemkomst"
    icon: mdi:home-clock
  notif_lys_forbrug_hjemme:
    name: "📊 Lys-forbrug (KPI) — vent til hjemkomst"
    icon: mdi:home-clock
  notif_maaltid_hjemme:
    name: "🍽️ Måltid → støvsuger — vent til hjemkomst"
    icon: mdi:home-clock
  notif_thread_hjemme:
    name: "🧵 Thread / strømløst — vent til hjemkomst"
    icon: mdi:home-clock
  notif_sove_radar_hjemme:
    name: "🛠️ Sove-radar genstartet — vent til hjemkomst"
    icon: mdi:home-clock
  notif_sikkerhed_hjemme:
    name: "🚪 Sikkerhed (døre) — vent til hjemkomst"
    icon: mdi:home-clock
  notif_backup_hjemme:
    name: "💾 Backup-vagt — vent til hjemkomst"
    icon: mdi:home-clock
  notif_anomali_lys_hjemme:
    name: "🕵️ Anomali: lys — vent til hjemkomst"
    icon: mdi:home-clock
  notif_anomali_moerke_hjemme:
    name: "🕵️ Anomali: mørke — vent til hjemkomst"
    icon: mdi:home-clock
  notif_anomali_plug_hjemme:
    name: "🕵️ Anomali: plug — vent til hjemkomst"
    icon: mdi:home-clock
  # Et parrings-spørgsmål kan sagtens besvares hjemmefra sofaen, men det er
  # ikke hastende, og en kurv der bygges mens man er ude kan lige så godt
  # afklares ved hjemkomst.
  notif_nemlig_hjemme:
    name: "🛒 Nemlig-kurv — vent til hjemme"
    icon: mdi:cart-arrow-down
  notif_roborock_hjemme:
    name: "🤖 Roborock-varsler — vent til hjemkomst"
    icon: mdi:home-clock
  notif_airbnb_gaester_hjemme:
    name: "👥 AirBnB gæste-vagt — vent til hjemkomst"
    icon: mdi:home-clock

shell_command:
  # base64-payload = ingen quoting/shlex-fælder (samme mønster som ai_trainer).
  notif_koe_append: "python3 /config/scripts/notif_queue.py append {{ payload_b64 }}"
  notif_koe_flush: "python3 /config/scripts/notif_queue.py flush"

command_line:
  - sensor:
      name: notif_koe_ventende
      unique_id: notif_koe_ventende
      command: "python3 /config/scripts/notif_queue.py count"
      value_template: "{{ value_json.total }}"
      json_attributes:
        - parent_a
        - parent_b
      scan_interval: 300
      icon: mdi:tray-full

automation:
  - id: notif_koe_flush_hjemkomst
    alias: "⏳ Notif-kø: flush ved hjemkomst + backstop"
    description: >
      Leverer køede hjemme-varsler når en persons GPS rammer hjem.
      /30-backstoppen dækker flanker der ellers sluges (fejlklasse #4/#15):
      tidsvindue åbner, AirBnB slutter, master gen-enables, fejlet send,
      HA-restart mens nogen allerede er hjemme. Scriptet no-op'er billigt
      (ingen API-kald) når køen er tom, og gater selv alt pr. entry.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: person.parent_a
        to: "home"
      - platform: state
        entity_id: person.parent_b
        to: "home"
      - platform: state
        entity_id: input_select.house_mode
        from: "AirBnB"
      - platform: time_pattern
        minutes: "/30"
    action:
      - service: shell_command.notif_koe_flush
