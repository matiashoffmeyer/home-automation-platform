# =============================================================================
# MANUEL LYS-HOLD (2026-08-19, user-spec: "manuel (også fra app) skal persiste")
# =============================================================================
# Incident 08-18: user tændte spisestue-loftet fra appen 21:05 og igen 21:11;
# `presence_light_spisestue_off` slukkede det 21:10 og 21:15 via sin /5-backstop.
# Den automation målte "tomt i 20 min" på spisebords-Apolloens last_changed —
# der havde stået off hele tiden mens han rent faktisk sad der — og havde
# hverken en Manual-gate eller et blik på hvor længe LYSET havde været tændt.
#
# Holdet er stempel-baseret, ikke mode-baseret: room_mode drifter tilbage til
# Auto efter 20 min tomt rum, og det må ikke frigive et lys nogen lige har
# tændt. Slipper når `manuel_lys_hold_timer` er gået — eller straks hvis
# huset er tomt (GPS/anker er et vidne der ikke kan hænge, modsat radaren).
# Stemplet dækker BÅDE Styrbar og app: manual_override.yaml skriver
# `styrbar_last_press_stue` for begge veje (light.spisestue_loft → rum 'stue'),
# dog kun når `nogen_hjemme` er ON — et fjern-tryk fra byen må ikke opfinde en
# tilstedeværelse. Samme betingelse står derfor i sensoren.
template:
  - binary_sensor:
      # 2026-09-03d: ét anker for "er MINDST ét open-plan-rum manuelt sat?".
      # Læses af de veje der rører hele open-plan-sættet i ét kald (morgen-
      # rampen, dagslys-sluk, velkomstlyset) — for dem er den gamle adfærd
      # stadig den rigtige: har brugeren selv sat ét af lysene, skal en
      # hus-bred handling på alle tre holde fingrene væk.
      # Rum-SPECIFIKKE gates må IKKE læse denne — så var splittet ikke sket.
      # Ingen availability-guard: `is_state` på en manglende entity er false,
      # og fejl-retningen skal være "rør ikke lyset", ikke "rør det alligevel".
      - name: "Open plan manual"
        unique_id: open_plan_manual
        icon: mdi:hand-back-right
        state: >-
          {{ is_state('input_select.room_mode_stue', 'Manual')
             or is_state('input_select.room_mode_spisestue', 'Manual')
             or is_state('input_select.room_mode_koekken', 'Manual') }}

      - name: "Stue manuel lys-hold"
        unique_id: stue_manuel_lys_hold
        icon: mdi:hand-back-right
        state: >-
          {% set raw = states('input_datetime.styrbar_last_press_stue') %}
          {% set sat = raw not in ['unknown','unavailable',''] and raw[11:] != '00:00:00' %}
          {% set lp = state_attr('input_datetime.styrbar_last_press_stue', 'timestamp') | float(0) %}
          {% set h = states('input_number.manuel_lys_hold_timer') | float(3) %}
          {% set alder = as_timestamp(now()) - lp %}
          {# 2026-09-23: et fuldt lys-hold (stue-Styrbar langt OP) der er SLUPPET
             fordi open-plan var tom, frigiver også dette hold for samme tryk —
             ellers stod sofa-zonen tændt i op til 3 t i et tomt rum "i Auto"
             (packages/open_plan_fuldt_lys.yaml). Urørt stempel = midnat → ignorér. #}
          {% set sl_raw = states('input_datetime.open_plan_fuldt_lys_sluppet') %}
          {% set sl = state_attr('input_datetime.open_plan_fuldt_lys_sluppet', 'timestamp') | float(0)
                      if sl_raw not in ['unknown','unavailable',''] and sl_raw[11:] != '00:00:00' else 0 %}
          {# 2026-09-26 (user: "ved 1 person hjemme skal lys slukke mere
             aggressivt ved tomt rum"): "nogen hjemme" er hus-bredt (#26) — er
             den ENE person bekræftet uden for open plan i 5 min, sidder hun
             ikke i stuen og holder lyset. packages/solo_hurtig_sluk.yaml. #}
          {# 2026-10-03e: den automatiske Sofa Zen OVERTOG stuen efter trykket
             (packages/sofa_zen_auto.yaml, user-spec "eget kortere hold") →
             lysene er ikke længere brugerens, og sofa-sluk skal kunne tage dem
             når Zen slipper. Samme mønster som fuldt lys-holdet ovenfor. #}
          {% set zo_raw = states('input_datetime.sofa_zen_overtog') %}
          {% set zo = state_attr('input_datetime.sofa_zen_overtog', 'timestamp') | float(0)
                      if zo_raw not in ['unknown','unavailable',''] and zo_raw[11:] != '00:00:00' else 0 %}
          {{ sat and lp > 0 and 0 <= alder < (h * 3600)
             and not (sl > 0 and sl >= lp)
             and not (zo > 0 and zo >= lp)
             and is_state('binary_sensor.nogen_hjemme', 'on')
             and not is_state('binary_sensor.solo_uden_for_open_plan', 'on') }}
