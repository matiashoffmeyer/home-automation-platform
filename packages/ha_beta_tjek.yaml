# =============================================================================
# HA beta-tjek — huset mod Home Assistants NÆSTE beta, ugentligt (2026-10-31)
# =============================================================================
# User 31/10 ("lav begge"): frenck/home-assistant-config tjekker sin config mod
# stable, beta og dev i CI. Vores stable-ben er pre-push (`ha_offline.py pin`
# holder offline-tjekket på prod's core); dette er beta-benet. Torsdag 03:40 —
# dagen efter at beta 0 normalt udkommer, ugen før udgivelsen — spørger
# scripts/ha_beta_tjek.py PyPI om en beta nyere end huset. Er den ikke tjekket
# før, kører HA's egen validator mod den i baggrunden (venv ≈ 1,1 GB i
# .cache/ha-offline-core; kun ét beta-venv ad gangen). Push KUN ved fejl, aldrig
# i AirBnB — sensoren viser resultatet uanset.
#
# Hvorfor command_line og ikke shell_command: shell_command kan ikke reloades
# (et nyt kræver genstart), command_line kan. scan_interval = ét år: sensoren
# kører kun når automationen beder om det, plus én gang ved HA-start og reload,
# hvor scriptet kun melder status — det starter aldrig et tjek uden for
# vinduet (torsdag 03-06) eller uden flag-filen .cache/ha-offline-core/koer_nu.
# Barnet kører detached (egen session) og overlever command_timeout.

command_line:
  - sensor:
      name: "HA beta-tjek"
      unique_id: ha_beta_tjek
      icon: mdi:test-tube
      command: "python3 /config/scripts/ha_beta_tjek.py"
      command_timeout: 45
      scan_interval: 31536000
      value_template: "{{ value_json.state }}"
      json_attributes:
        - version
        - resultat
        - tjekket
        - antal_fejl
        - fejl
        - advarsler
        - prod
        - note
        - miljoe

automation:
  - id: ha_beta_tjek_ugentlig
    alias: "System: HA beta-tjek (torsdag nat)"
    description: >
      Torsdag 03:40 starter scriptet tjekket hvis der er en ny beta; 04:30
      læser sensoren resultatet (tjekket tager ~3 min, inkl. venv-bygning).
    mode: single
    trigger:
      - platform: time
        at: "03:40:00"
      - platform: time
        at: "04:30:00"
    condition:
      - condition: time
        weekday: thu
    action:
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.ha_beta_tjek
