# =============================================================================
# Sensor Snapshots — periodisk rounded write til DB
# =============================================================================
# Sprint audit-5 2026-05-12 (A88+A90 fix):
# Apollo MSR-2 ESPHome firmware sender raw float-precision (13 decimaler) for
# temperature og lux. Hver vibration → state-row → 2849 temp-writes/day, 945
# lux-writes/day per sensor. DB grow unacceptable post-flyt med 5 Apollos.
#
# DESIGN:
#   - Raw entities (sensor.*_apollo_temperature / _lux) er recorder-excluded
#     i configuration.yaml. Live state stadig læsbar af automations.
#   - Disse trigger-based template_sensors snapshotter raw → rounded værdi
#     hver 15-30 min. Skriver KUN når snapshot fyrer = ~48-96 rows/day per
#     sensor i stedet for 945-2849.
#   - Visible på diagnostik dashboard som "clean" historiske trends.
#   - Raw entity nede → snapshot bliver 'unavailable' via availability-
#     template (B53 fix 2026-07-14: at RENDERE strengen 'unavailable' som
#     state på en numerisk sensor er ugyldigt → ERROR-log + state 'unknown').
#   - NB: unique_id'erne (*_snapshot) matcher IKKE entity-sluggen — historisk,
#     bevidst IKKE rettet (unique_id-ændring = ny registry-entity = tabt
#     historik). Whitelistet mentalt ift. ha_validate-konventionen.
#
# CONSUMERS:
#   - Dashboard graphs/history
#   - Climate trending (langtids-temp pattern)
#   - LUX trending (sun-bracket validation)
#
# REAL-TIME automations læser stadig raw entities direkte — ingen UX-impact.
# =============================================================================

template:
  # =========================================================================
  # Temperature snapshots — every 30 min
  # =========================================================================
  - trigger:
      - platform: time_pattern
        minutes: "/30"
      - platform: homeassistant
        event: start
    sensor:
      - name: "Sove temperatur"
        unique_id: sove_temperatur_snapshot
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer
        state: "{{ states('sensor.sovevaerelse_apollo_temperature') | float(0) | round(1) }}"
        availability: "{{ states('sensor.sovevaerelse_apollo_temperature') | is_number }}"

      - name: "Boern temperatur"
        unique_id: boern_temperatur_snapshot
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer
        state: "{{ states('sensor.boernevaerelse_apollo_temperature') | float(0) | round(1) }}"
        availability: "{{ states('sensor.boernevaerelse_apollo_temperature') | is_number }}"

      - name: "Stue temperatur"
        unique_id: stue_temperatur_snapshot
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer
        state: "{{ states('sensor.stue_apollo_temperature') | float(0) | round(1) }}"
        availability: "{{ states('sensor.stue_apollo_temperature') | is_number }}"

      # 2026-06-15: "Spisestue temperatur" + "Bad temperatur" snapshots FJERNET.
      # Begge læste Apollo-temp fra enheder placeret oven på et varmt køleskab
      # (læser falsk højt) — ingen pålidelig temp-kilde i de rum længere (user-
      # spec: "ingen af deres temp målere skal bruges"). Tiles fjernet fra
      # diagnostics climate-sektion samtidig.

  # =========================================================================
  # LUX snapshots — every 15 min
  # =========================================================================
  - trigger:
      - platform: time_pattern
        minutes: "/15"
      - platform: homeassistant
        event: start
    sensor:
      - name: "Sove LUX"
        unique_id: sove_lux_snapshot
        unit_of_measurement: "lx"
        device_class: illuminance
        state_class: measurement
        icon: mdi:brightness-5
        state: "{{ states('sensor.sovevaerelse_lux_reel') | float(0) | round(0) | int }}"
        availability: "{{ states('sensor.sovevaerelse_lux_reel') | is_number }}"

      - name: "Boern LUX"
        unique_id: boern_lux_snapshot
        unit_of_measurement: "lx"
        device_class: illuminance
        state_class: measurement
        icon: mdi:brightness-5
        state: "{{ states('sensor.boernevaerelse_lux_reel') | float(0) | round(0) | int }}"
        availability: "{{ states('sensor.boernevaerelse_lux_reel') | is_number }}"

      - name: "Stue LUX"
        unique_id: stue_lux_snapshot
        unit_of_measurement: "lx"
        device_class: illuminance
        state_class: measurement
        icon: mdi:brightness-5
        state: "{{ states('sensor.stue_lux_reel') | float(0) | round(0) | int }}"
        availability: "{{ states('sensor.stue_lux_reel') | is_number }}"

      - name: "Spisestue LUX"
        unique_id: spisestue_lux_snapshot
        unit_of_measurement: "lx"
        device_class: illuminance
        state_class: measurement
        icon: mdi:brightness-5
        state: "{{ states('sensor.spisestue_lux_reel') | float(0) | round(0) | int }}"
        availability: "{{ states('sensor.spisestue_lux_reel') | is_number }}"

      - name: "Bad LUX"
        unique_id: bad_lux_snapshot
        unit_of_measurement: "lx"
        device_class: illuminance
        state_class: measurement
        icon: mdi:brightness-5
        state: "{{ states('sensor.badevaerelse_inde_illuminance') | float(0) | round(0) | int }}"
        availability: "{{ states('sensor.badevaerelse_inde_illuminance') | is_number }}"

      - name: "Open-plan LUX (snapshot)"
        unique_id: open_plan_lux_snapshot
        unit_of_measurement: "lx"
        device_class: illuminance
        state_class: measurement
        icon: mdi:brightness-5
        state: "{{ states('sensor.open_plan_lux') | float(0) | round(0) | int }}"
        availability: "{{ states('sensor.open_plan_lux') | is_number }}"
