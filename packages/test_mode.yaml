# =============================================================================
# Test Mode — verifikations-scripts for flyttedag og post-flyt parring
# =============================================================================
# Samling af scripts der kan fyres manuelt fra Developer Tools → Services
# eller via Lovelace-knap. Hver script logger til logbook + persistent
# notification saa user kan se status.
#
# BRUGSMOENSTRE:
#   - "Virker alt?" check efter device-parring eller config-aendring:
#     → script.test_status_report (logger fuld status til logbook)
#
#   - "Er power-on firmware-defaults synkroniseret?" check:
#     → script.test_firmware_sync_force (fyrer bulb_firmware_defaults-dispatcher)
#
#   - "Hvad er state af alle vores helpers?" check:
#     → script.test_helper_states (logger alle input_boolean/input_select)
#
# DESIGN:
#   - Alle scripts er IDEMPOTENTE (kan koeres flere gange uden side effects)
#   - Logger via logbook.log saa der er audit trail
#   - persistent_notification giver instant feedback
# =============================================================================

script:
  # -------------------------------------------------------------------------
  # MASTER STATUS REPORT — logger comprehensive state-snapshot
  # -------------------------------------------------------------------------
  test_status_report:
    alias: "Test: status-rapport (logger fuld system-state)"
    description: >
      Logger nuvaerende state af alle paerede devices, sensor-gates,
      mode-flags og activity til logbook. Bruges som "verificer alt virker"
      check efter device-parring eller config-aendring.
    mode: single
    sequence:
      - service: logbook.log
        data:
          name: "Test status report"
          message: >
            === DEVICES ===
            Stue hjørnelampe: {{ states('light.stue_hjoernelampe') }}
            (bri={{ state_attr('light.stue_hjoernelampe', 'brightness') }})
            Sove bulb: {{ states('light.spisestue_pendel') }}
            (bri={{ state_attr('light.spisestue_pendel', 'brightness') }})
            Terrasse paerelyskaede: {{ states('light.terrasse_paerelyskaede') }}
            Terrasse lyskaede: {{ states('light.koekken_lyskaede') }}
      - service: logbook.log
        data:
          name: "Test status report"
          message: >
            === SENSORS / GATES ===
            Sun elev: {{ state_attr('sun.sun', 'elevation') | round(1) }}°
            Sun bracket: {{ states('sensor.sun_bracket') }}
            Activity state: {{ states('sensor.activity_state') }}
            People estimate: {{ states('sensor.people_estimate') }}
            Presence sensors available: {{ states('binary_sensor.presence_sensors_available') }}
            Terrasse active: {{ states('binary_sensor.terrasse_active') }}
      - service: logbook.log
        data:
          name: "Test status report"
          message: >
            === MODE FLAGS ===
            godnat_active: {{ states('input_boolean.godnat_active') }}
            cinema_active: {{ states('input_boolean.cinema_active') }}
            cirkus_active: {{ states('input_boolean.cirkus_active') }}
            guest_mode: {{ states('input_boolean.guest_mode') }}
            bedroom_only_winddown: {{ states('input_boolean.bedroom_only_winddown') }}
            house_state: {{ states('input_select.house_state') }}
      - service: persistent_notification.create
        data:
          notification_id: test_status_report
          title: "Test status report afsluttet"
          message: >
            Status logged til logbook (filter på "Test status report" for at se).

            Devices: {{ 'OK' if states('light.stue_hjoernelampe') in ['on','off'] else 'HYGGE UNAVAILABLE' }} /
            {{ 'OK' if states('light.spisestue_pendel') in ['on','off'] else 'SOVE UNAVAILABLE' }}.
            Activity: {{ states('sensor.activity_state') }}.
            Bracket: {{ states('sensor.sun_bracket') }}.

  # -------------------------------------------------------------------------
  # ADAPTIVE FIRMWARE FORCE-SYNC — manual trigger af dispatcher
  # -------------------------------------------------------------------------
  # Audit-runde 14 (O2): konsoliderede bath+sove til single dispatcher
  # automation. Force-script triggerer dispatcher der itererer over alle
  # bulb_configs (= sync ALLE paerede color bulbs i ét run).
  test_firmware_sync_force:
    alias: "Test: tving firmware-defaults sync (alle bulbs)"
    description: >
      Fyrer bulb_firmware_defaults-dispatcher manuelt. Bruges hvis nogen
      bulb var unreachable da defaults skulle fyre, eller hvis bulb_configs
      lige er udvidet med ny bulb.
    mode: single
    sequence:
      - service: automation.trigger
        target:
          entity_id: automation.bulb_fw_adaptiv_start_up_dispatcher_alle_paerede_color_bulbs
        data:
          skip_condition: false
      - service: persistent_notification.create
        data:
          notification_id: test_firmware_sync
          title: "Firmware-defaults sync triggered"
          message: >
            Tjek logbook for "[Name] FW default" entries (en per bulb i
            bulb_configs). Hvis nogen mangler: den bulb var ikke reachable.

  # -------------------------------------------------------------------------
  # HELPER STATES SNAPSHOT — alle input_boolean / input_select
  # -------------------------------------------------------------------------
  test_helper_states:
    alias: "Test: log alle helper states"
    description: >
      Logger state af alle input_boolean + input_select helpers. Bruges hvis
      noget opfoeres uventet og man vil se hvilke flags der er sat.
    mode: single
    sequence:
      - service: logbook.log
        data:
          name: "Test helper states"
          message: >
            === BOOLEANS ===
            {% for s in states.input_boolean %}
            {{ s.entity_id }}: {{ s.state }}
            {% endfor %}
      - service: logbook.log
        data:
          name: "Test helper states"
          message: >
            === SELECTS ===
            {% for s in states.input_select %}
            {{ s.entity_id }}: {{ s.state }}
            {% endfor %}
      - service: persistent_notification.create
        data:
          notification_id: test_helper_states
          title: "Helper states logged"
          message: >
            Tjek logbook → filter "Test helper states".
            {{ states.input_boolean | count }} booleans + {{ states.input_select | count }} selects.

  # -------------------------------------------------------------------------
  # POST-FLYT VERIFICATION — guide-walkthrough som logbook entries
  # -------------------------------------------------------------------------
  test_post_flyt_walkthrough:
    alias: "Test: post-flyt verification walkthrough"
    description: >
      Logger en step-by-step guide til logbook der viser hvad der skal
      testes manuelt efter device-parring. Ikke en aktiv test — guide.
    mode: single
    sequence:
      - service: logbook.log
        data:
          name: "Post-flyt walkthrough"
          message: >
            Step 1: VERIFICER PARRING. Settings → Devices → tjek alle Apollo,
            Vallhorn, Somrig, Parasoll, Styrbar er listed. Manglende devices
            betyder MOVING_DAY.md procedure ikke faerdig.
      - service: logbook.log
        data:
          name: "Post-flyt walkthrough"
          message: >
            Step 2: VERIFICER NAMING. Hver device skal have rum-prefix
            (sovevaerelse_apollo_*, stue_styrbar_*, etc). Se device_inventory.yaml
            konvention. Omdoeb i HA UI hvis ikke matcher.
      - service: logbook.log
        data:
          name: "Post-flyt walkthrough"
          message: >
            Step 3: SENSOR-GATE. binary_sensor.presence_sensors_available
            skal vaere 'on' hvis mindst 1 Apollo/Vallhorn er paret. Ellers er
            der naming-mismatch.
      - service: logbook.log
        data:
          name: "Post-flyt walkthrough"
          message: >
            Step 4: PRESENCE TEST. Gaa ind i hvert rum, observer at activity_state
            opdaterer korrekt (sofa_relax, bedroom_only, etc). Tjek
            sensor.activity_state via Developer Tools.
      - service: logbook.log
        data:
          name: "Post-flyt walkthrough"
          message: >
            Step 5: STYRBAR L/R. Tryk L og R quick paa hver Styrbar, tjek
            "Styrbar L/R debug" logbook entries viser direction=left/right korrekt.
            Hvis begge viser 'right' er args[0] encoding wrong (se O3 i CLAUDE.md).
      - service: logbook.log
        data:
          name: "Post-flyt walkthrough"
          message: >
            Step 6: GODNAT FLOW. Tryk sove-Somrig bund-long → godnat_voksen_start
            kalkulerer expected godnat-tid. Verificer via developer tools at
            input_boolean.godnat_pending er on og auto-clears til godnat_active=on
            naar conditions opfyldt.
      - service: logbook.log
        data:
          name: "Post-flyt walkthrough"
          message: >
            Step 7: WAKEUP TEST. Toggle godnat_active off naeste morgen. Verificer
            wakeup-automation tager over baseret pa workday status og tid.
      - service: persistent_notification.create
        data:
          notification_id: test_walkthrough
          title: "Post-flyt walkthrough logged"
          message: >
            7 verification-steps logget til logbook. Filter "Post-flyt walkthrough"
            for at se hele listen. Gaa igennem manuelt naar devices er paret.
