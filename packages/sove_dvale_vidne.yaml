# =============================================================================
# sove_dvale_vidne.yaml — soveværelsets vidne i dvale-rosteret (2026-08-21)
# =============================================================================
# PROBLEM: huset stod Active i over to timer med et beviseligt tomt hus (begge
# voksne kørt, hoveddøren lukket 07:21:35). Målt 07:25-09:42 fyrede dvale-
# rosterets otte sensorer 45 gange = én flanke hvert 3,1. minut mod et krav om
# 15 minutters stilhed → enhver dvale-vej var matematisk uopnåelig.
# Soveværelset alene stod for 22 af de 45 og var det ENESTE rum i rosteret helt
# uden spøgelsesfilter (køkken har afstands-gaten, spisestue gardin-filteret,
# stue varigheds-kravet).
#
# DISKRIMINATOREN (rum-specifik, jf. 08-20d — et filter må aldrig kopieres):
# VARIGHED, men ikke husets sædvanlige "præcis radar_timeout"-regel. Den duer
# ikke her: sove-Apolloen taber en LIGGENDE krop og gen-detekterer den, så en
# ægte sovende producerer også 14-15 s udslag (timeouten er 15 s). Målt i dag:
#   • tomt hus 07:25-09:42: 22 episoder, LÆNGSTE 142,4 s
#   • sovende 02:00-05:00:   8 episoder, hvoraf 5 var 264 · 315 · 807 · 1660 ·
#     3207 s
# Der er altså et rent hul mellem ~142 s og ~264 s. Et spøgelse kan blinke
# ofte, men det kan ikke HOLDE.
#
# Valideret over 8 døgn (682 episoder): 150 s beholder 22 % af dem, og de
# ligger hvor mennesker sover (00-07 + 19-23). Tilbage i dagtimerne 09-15 står
# ~2 episoder/døgn — eftermiddagssols-fantomet (B73) er ikke helt væk, men fra
# én flanke hvert 6. minut til et par om dagen. Perfekt bliver det ikke af
# varighed alene.
#
# SCOPE — bevidst SMALT: kun de vidner der spørger "er der nogen?" over LANG
# tid læser denne. `binary_sensor.sovevaerelse_apollo_occupancy` (rå) bliver
# ved med at fodre vækning, godnat-KNAPPEN, dark mode, wasp og activity_state,
# hvor et hurtigt svar er hele pointen og en 150 s forsinkelse ville være
# direkte skadelig.
#
# 2026-08-26e: auto-godnats soak (packages/godnat_auto_declare.yaml) er flyttet
# HERTIL fra den rå sensor. Den målte 90 minutters ubrudt senge-presence på en
# kanal der taber en sovende hvert kvarter — kravet var uopnåeligt, og featuren
# havde ikke fyret siden 27/5. Det er præcis den slags langtids-spørgsmål
# vidnet findes til.
# =============================================================================

input_number:
  sove_dvale_vidne_sekunder:
    name: "Sove: hold før dvale-vidne tror på det (s)"
    icon: mdi:bed-clock
    min: 30
    max: 600
    step: 10
    unit_of_measurement: "s"
    mode: box

template:
  - binary_sensor:
      # ON = der er FAKTISK nogen i soveværelset. Bruges kun som dvale-vidne.
      #
      # delay_off er ikke pynt: sove-Apolloen taber en person der ligger stille
      # i 5-15 min ad gangen (målt 08-11, se CLAUDE.md). Uden broen ville
      # vidnet slukke midt i en sovende nat og gøre præcis den fejl filteret
      # findes for at undgå — bare med modsat fortegn. 16 min > det længste
      # målte hul.
      - name: "Sovevaerelse dvale vidne"
        unique_id: sovevaerelse_dvale_vidne
        device_class: occupancy
        icon: mdi:bed-outline
        availability: >-
          {{ states('binary_sensor.sovevaerelse_apollo_occupancy')
             not in ['unknown', 'unavailable'] }}
        delay_on: >-
          {{ states('input_number.sove_dvale_vidne_sekunder') | int(150) }}
        delay_off:
          minutes: 16
        state: "{{ is_state('binary_sensor.sovevaerelse_apollo_occupancy', 'on') }}"
