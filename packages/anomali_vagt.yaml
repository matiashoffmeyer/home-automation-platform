  notif_anomali_moerke_parent_b:
    name: "🕵️🌑 Mørkt trods bevægelse — Parent B"
    icon: mdi:cellphone
  notif_anomali_plug_enabled:
    name: "🕵️🔌 Terrasse-plug slukker ikke — send"
