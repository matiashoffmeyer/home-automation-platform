  notif_anomali_lys_parent_a:
    name: "🕵️💡 Lys i tomt rum — Parent A"
    icon: mdi:cellphone
  notif_anomali_lys_parent_b:
    name: "🕵️💡 Lys i tomt rum — Parent B"
    icon: mdi:cellphone
  notif_anomali_moerke_enabled:
    name: "🕵️🌑 Mørkt trods bevægelse — send"
    icon: mdi:lightbulb-off-outline
  notif_anomali_moerke_parent_a:
    name: "🕵️🌑 Mørkt trods bevægelse — Parent A"
