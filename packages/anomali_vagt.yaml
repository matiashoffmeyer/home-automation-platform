# =============================================================================
# Anomali-vagt — push når huset opfører sig dysfunktionelt (2026-07-15, user-spec)
# =============================================================================
# "Notifikationer til min tlf hvis noget lys brænder mistænkeligt længe, hvis
#  et rum holdes mørkt trods bevægelse (ikke soveværelserne under godnat/
#  putning), eller hvis terrasse-pluggen ikke slukker under regn."
#
# 3 DETEKTORER (alle periodiske scans = indbygget backstop, jf. fejlklasse #4;
# alle gated på killswitch input_boolean.anomali_vagt_enabled + push via
# script.push_notify med hver sin notif_id → per-type toggle/telefon/tidsvindue
# på 🔔-fanen):
#
#   1) anomali_lys    — lys brænder i TOMT rum (/10 min scan).
#      Rum-lys 'on' uafbrudt ≥ anomali_tomt_lys_minutter OG rummets occupancy
#      'off' uafbrudt ≥ samme. Fanger fejlende auto-sluk LÆNGE før 6-timers
#      super-watchdog'en (som stadig er sidste forsvarslinje + selv slukker).
#      B60-fix (2026-07-15, user-valg b): occupancy UNAVAILABLE/unknown ≥ N
#      mens lyset brænder ≥ N → egen "sensor død"-variant i SAMME push (ærlig
#      tekst: rummet KAN være tomt, men ingen kan se det — jf. Thread-hang
#      2026-07-04d). Samme skips + cooldown; device_health_check pusher
#      bevidst ikke (B52), så dette er eneste end-to-end-varsling af hullet.
#      Ekskluderet: BAD (egen max-on watchdog + wasp holder bevidst lys med
#      lukket dør = PIR ser intet → ville false-positive), TERRASSE (pærelys-
#      kæden brænder bevidst fra dusk uden occupancy-semantik), børneværelset
#      under godnat_boern (1% natlys-strip brænder legitimt; sovende børn
#      holder alligevel occupancy on), cinema/cirkus/dance (bevidst langtændt),
#      rum i Manual/Off mode (bruger-intent vinder — super-watchdog dækker).
#
#   2) anomali_moerke — rum holdes MØRKT trods vedvarende bevægelse (/5 min).
#      Occupancy 'on' uafbrudt ≥ anomali_moerke_minutter OG alle rum-lys off
#      OG rummet er mørkt (lux < anomali_moerke_lux; rum uden lux-sensor =
#      altid mørke-kvalificeret; unavailable lux → fallback open_plan_lux).
#      Kun house_state == Active (ellers spammer en spøgelses-latch når ingen
#      er hjemme — Apollo-ghost-alarmen ejer dét problem). Ekskluderet
#      (bevidst mørke, IKKE dysfunktion): sove+børn under godnat/putning
#      (user-spec), sove under morgen-beskyttelsen, børn under manual-off-lås,
#      rum i Manual/Off mode, roborock_blokerer_lys (robot-bevægelse + bevidst
#      lys-blok), cirkus/dance. Under godnat overvåges KUN bad+entré
#      (de eneste rum hvor natlys-flowet bevidst TÆNDER lys om natten).
#      FILM (2026-07-29, user-spec "de skal tage højde for hinanden"):
#      binary_sensor.film_mode_aktiv (dark_mode | cinema_active |
#      predark_active | projektor_aktiv) skipper stue/spisestue/køkken/depot +
#      sove + børn — mørket er MENINGEN dér. Bad + entré mørklægges aldrig af
#      film og overvåges videre, så et fejlende natlys midt i filmen fanges.
#      AirBnB: børn skippes altid (lys blokeret by design), sove kun 12–22
#      (spejler presence-gaten fra 2026-06-30).
#
#   3) anomali_plug   — terrasse-plug slukker IKKE når den skal (/10 min).
#      switch.terrasse_plug 'on' uafbrudt ≥ anomali_plug_minutter SAMTIDIG med
#      at en OFF-betingelse har stået uafbrudt ≥ samme: regn (terrasse_regn_
#      aktiv), huset Dormant, eller vinter-kill-switchen (terrace_presence_
#      enabled off). Spejler terrasse_plug.yaml's regel "eneste OFF: Dormant,
#      regn nu, vinter-kill" — pluggen er udeområdets eneste strøm (redskaber).
#
# Cooldown: fælles slider anomali_cooldown_minutter + ét runtime-stempel pr.
# detektor (anomali_*_sidste_push — has_date, BEVIDST ikke i snapshot-whitelist
# = runtime-cursor). Detektorerne RØRER ALDRIG lys/plug selv — de observerer
# kun og melder; ejerskabet af fix ligger hos de eksisterende automations.
#
# Snapshot: killswitch (endswith _enabled) + sliders (input_number) + notif_*
# fanges automatisk af helpers_export.py. Init-defaults: init_user_preferences.
# Tiles: dashboards/settings.yaml → 🔔 Notifikationer-fanen ("🕵️ Anomali-vagt").
# =============================================================================

input_boolean:
  anomali_vagt_enabled:
    name: "🕵️ Anomali-vagt aktiv (killswitch)"
    icon: mdi:shield-search
  # --- push_notify framework-nøgler (nid: anomali_lys / anomali_moerke / anomali_plug)
