  # Runtime-cooldown-stempler (ikke config → bevidst uden snapshot-whitelist).
  anomali_lys_sidste_push:
    name: "Anomali-vagt: sidste push (lys i tomt rum)"
    has_date: true
    has_time: true
  anomali_moerke_sidste_push:
