# =============================================================================
# Kameraets krop-kanal (2026-09-14, user-spec)
# =============================================================================
# To features hænger på det samme nye primitiv, binary_sensor.koekken_kamera_krop
# fra local_gesture_frame_shim: "bevæger der sig noget i køkkenet som er højt
# nok til at nå frem i kameraets billede?".
#
#   1) HURTIG SESSION. "køkken sessions starter stadig for langsomt. hvis et
#      menneske er på frames i kameraet i 5 sek, så starter vi en frisk køkken
#      session (hvis lux kravene er opfyldt som normalt)." Selve tændingen bor i
#      presence_koekken_cooking_spots_on — sessionen har ÉN ejer, og en kopi her
#      ville arve nul af dens 14 gates (fejlklasse #2/#21). Her ligger kun
#      slideren.
#
#   2) BØRN VIA RENE RUM-SKIFT (v2, 2026-10-23, user-spec):
#      "Vi bruger det faktum at tapo ikke ser bevægelse (detect movement) i
#      køkkenet hvis det kommer fra et barn … Vi skal kun bruge
#      børnedetektionen når den er ren, dvs: bevægelse i køkkenet lige efter
#      eller lige før bevægelse i børneværelset eller spisestue OG bevægelse i
#      afgangs-rummet ophører når barnet skifter rum. Så ved vi at der kun er 1
#      krop involveret … Vi skal ikke kræve at tapo ikke detecter krop … men den
#      burde være troværdig ift. detected movement. Vi kan kræve at det skal ske
#      2 gange … en notifikation jeg kan svare på, og kun hvis jeg bekræfter
#      børnetilstedeværelse, slår børn hjemme til."
#
# HVORFOR v1 (14/9 → slået fra 5/10) DØDE: den sluttede "barn" fra kamera-
# TAVSHED alene, men koekken_kamera_krop er FRAME-TIL-FRAME-bevægelse (hot
# cells), så en voksen der står stille ved komfuret er lige så tavs som et barn
# under billedet: 24 "lave passager" på 70 min med kun voksne hjemme, user-svar
# 1 ja / 3 nej. Fuld historik: grep -n "Sprint 2026-10-05\|Sprint 2026-10-23"
# docs/sprint_log.md og grep -n "kamera_krop" docs/permanente_fakta.md.
#
# v2 bruger tavsheden KUN hvor den kan bære: en krop der GÅR gennem køkkenet
# (en voksen der går, bevæger sig i billedet) mellem køkkenet og børneværelset
# eller spisestuen — og kun når skiftet beviser at det er ÉN krop:
#   · ankomst-rummets radar går off → on efter ≥ 20 s stilhed og HOLDER ≥ 10 s,
#   · afgangs-rummet var optaget i samme øjeblik (eller slap ≤ 20 s før), bliver
#     tomt senest 15 s efter ankomsten og FORBLIVER tomt ≥ 30 s (ingen krop
#     tilbage = ingen anden krop i spil),
#   · køkken-opholdet (radar-segmentet i køkkenet) varede ≥ 10 s, og kameraet
#     meldte INGEN bevægelse fra 3 s før segmentet til 3 s efter,
#   · køkkenet var lyst hele segmentet (lux_effektiv ≥ 40 lx): under 10 lx er
#     en voksen tavs for kameraet 71 % af gangene, ≥ 40 lx 6-13 %,
#   · kameraet vågent, intet frossent køkken-spøgelse, ingen robot i 120 s.
# To skift ≥ 120 s fra hinanden inden for 30 min → et SPØRGSMÅL med knapper
# (boern_ankomst_koekken_spoerg → script.boern_ankomst_spoerg). Kun ✅ sætter
# boern_aktivitet_detekteret; people count løftes via people_boern_set, som
# tager max(tal, flag) og derfor kun går op hvis barnet ikke allerede er talt.
#
# Strukturelle konstanter (hardcodede — de DEFINERER "rent", de tunes ikke):
#   20 s stilhed før ankomsten · 20 s afgangs-slip · 10 s ankomst-hold ·
#   15 s til afgangen er tom · 3 s kamera-margin · 30 s afgang-forbliver-tom ·
#   30 s spøgelses-frihed · 120 s robot-frihed · 600 s max køkken-ophold.
#
# REPLAY (26 døgn 27/9-23/10, kendte voksen-/børne-perioder): tavse skift
# voksen/børn 6/38 ved lux ≥ 40 + segment ≥ 10 s → 0/3 spørgsmål, og de 3 lå
# med boern_sov_her_i_nat on (undertrykt). Permutations-estimat for falske
# spørgsmål med kun voksne: ~0,6 pr. 8 døgn (45 lx / 15 s: ~0,2, men 0 børn).
# =============================================================================

input_boolean:
  # Fejlklasse #21: et kill-switch der ikke er en condition på hver eneste vej
  # ind, er pynt. Denne læses BÅDE af session-triggeren i presence_koekken.yaml
  # og af køkken-skift-detektoren herunder.
  koekken_kamera_krop_enabled:
    name: "Køkken: kamera må se kroppe"
    icon: mdi:human-male

  # v2 2026-10-23 (user-spec). Gater BÅDE koekken_skift_transit (ingen
  # registrering, intet spor) og spørge-vejen boern_ankomst_koekken_spoerg i
  # automations/boern_ankomst_detekter.yaml (#21). v1 var slået fra 5/10.
  koekken_lav_krop_boern_enabled:
    name: "Køkken: børn via rene rum-skift"
    icon: mdi:human-child

input_number:
  koekken_kamera_session_sekunder:
    name: "Køkken: menneske på kamera før session (sek)"
    icon: mdi:camera-timer
    min: 1
    max: 60
    step: 1
    unit_of_measurement: "s"
    mode: slider

  # MÅLT 16/9 og præmissen holdt IKKE: C210'eren har IR-lys og ser fint i mørke.
  # Over 628 gange hvor kameraet faktisk SÅ en krop lå lux'en:
  #   min 0,0 · p1 0,0 · p5 7,8 · p10 13,1 · median 75,7
  # 16 af de 628 fund skete under 1 lx. En gate på 8 lx ville altså smide 5,9 %
  # af kameraets ægte fund væk — og hvert bortsmidt fund er et falsk BARN, for
  # så er kameraets dom ikke længere gyldig og radaren står alene.
  # Derfor er 0 (= fra) det rigtige tal her, ikke den 8 lx jeg gættede på 14/9.
  # Kanalen er koekken_lux_effektiv (rummets FAKTISKE lys minus Apolloens egen
  # LED) — IKKE koekken_dagslys_lx, som er det fastholdte RENE sample og per
  # definition er ~0 så snart vi selv har tændt lyset. Slideren beholdes som
  # nødbremse hvis IR-billedet viser sig at være for dårligt til krops-modellen.
  # NB: den gælder krop_gyldig; køkken-skiftene har deres EGEN lux-gate
  # (koekken_skift_min_lux) — det er TAVSHED der kræver lys, ikke fund.
  koekken_kamera_min_lux:
    name: "Køkken: mindste lux før kameraet må afgive dom"
    icon: mdi:brightness-6
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "lx"
    mode: slider

  # User-spec 23/10: "vi kan kræve at det skal ske 2 gange".
  koekken_lav_krop_antal:
    name: "Køkken: rene skift før spørgsmålet"
    icon: mdi:counter
    min: 1
    max: 10
    step: 1
    mode: slider

  # Rullende: kun skift inden for vinduet fra det NYESTE tæller med.
  koekken_lav_krop_vindue_min:
    name: "Køkken: vindue for de rene skift (min)"
    icon: mdi:timer-sand
    min: 5
    max: 120
    step: 5
    unit_of_measurement: "min"
    mode: slider

  # Replay 27/9-23/10: voksnes kamera-tavshed i et skift er 71 % under 10 lx
  # (IR-billedet er for groft til frame-diff) og 6-13 % ved ≥ 40-45 lx.
  # 40 (børn 38 tavse skift → 3 spørgsmål) mod 45 (24 → 0): 40 valgt.
  koekken_skift_min_lux:
    name: "Køkken: mindste lux under skiftet"
    icon: mdi:brightness-6
    min: 0
    max: 200
    step: 5
    unit_of_measurement: "lx"
    mode: slider

  # Et kortere køkken-ophold end kameraets egen reaktionstid (3 frames + 3 s
  # off-hold i shimmen) kan ikke bære en tavshed. Replay: 10 s → voksen/børn
  # 6/38 tavse skift, 15 s → 2/21.
  koekken_skift_min_segment_sek:
    name: "Køkken: mindste tid i køkkenet under skiftet (s)"
    icon: mdi:timer-outline
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "s"
    mode: slider

  # Ét barn der går B → K → S på 30 s er ÉN gåtur, ikke to beviser.
  koekken_skift_min_afstand_sek:
    name: "Køkken: mindste afstand mellem to skift (s)"
    icon: mdi:arrow-expand-horizontal
    min: 0
    max: 600
    step: 10
    unit_of_measurement: "s"
    mode: slider

input_text:
  # Komma-liste af "<epoch>:<fra>><til>:<segment-s>:<lux>", fx
  # "1761210000:B>K:14:52". Max 10 poster à ≤ 24 tegn = 249. input_text er
  # husets eneste GRATIS helper-reload, og uden `initial:` overlever sporet en
  # restart. Ryddes af koekken_lav_krop_ryd og når spørgsmålet stilles.
  koekken_lav_krop_spor:
    name: "Køkken: spor af rene rum-skift"
    max: 255
    icon: mdi:shoe-print

template:
  - binary_sensor:
      # Skelner "kameraet så ingen" fra "kameraet kiggede ikke". Stemplet er
      # SKREVET af shimmen hvert 60. sek — last_changed duer ikke, den
      # nulstilles ved HA-restart og ville melde alt friskt netop når intet er.
      - name: "Koekken kamera vaagen"
        unique_id: koekken_kamera_vaagen
        icon: mdi:cctv
        state: >-
          {% set b = states('sensor.koekken_kamera_vagt') | int(0) %}
          {{ b > 0 and (now().timestamp() - b) < 180 }}

      # Den fulde "kameraet KUNNE have set en voksen"-påstand.
      - name: "Koekken kamera krop gyldig"
        unique_id: koekken_kamera_krop_gyldig
        icon: mdi:camera-iris
        state: >-
          {{ is_state('binary_sensor.koekken_kamera_vaagen', 'on')
             and states('binary_sensor.koekken_kamera_krop') in ['on', 'off']
             and (states('sensor.koekken_lux_effektiv') | float(0))
                 >= (states('input_number.koekken_kamera_min_lux') | float(0)) }}
        attributes:
          aarsag: >-
            {% if not is_state('binary_sensor.koekken_kamera_vaagen', 'on') %}
              detektoren kigger ikke
            {% elif states('binary_sensor.koekken_kamera_krop') not in ['on', 'off'] %}
              ingen state i HA endnu
            {% elif (states('sensor.koekken_lux_effektiv') | float(0))
                    < (states('input_number.koekken_kamera_min_lux') | float(0)) %}
              for mørkt til at se nogen
            {% else %}
              gyldig
            {% endif %}

  # Køkken-radarens seneste OPHOLD (segment), skrevet i flankens eget event, med
  # laveste lux undervejs. Forrige segment bæres med, fordi et skift der lander
  # i køkkenet først kan dømmes når opholdet er slut — og så kan et nyt være
  # startet. Kun første slut efter en start tæller; slutter opholdet i
  # unavailable, er segmentet 'ugyldig' og lux -1 (= afvist af lux-gaten).
  # Recorder-ekskluderet (configuration.yaml): rent mellemregnings-spor.
  - trigger:
      - platform: state
        entity_id: binary_sensor.koekken_apollo_occupancy
        from: "off"
        to: "on"
        id: start
      - platform: state
        entity_id: binary_sensor.koekken_apollo_occupancy
        from: "on"
        id: slut
      - platform: state
        entity_id: sensor.koekken_lux_effektiv
        to: ~
        id: lux
    sensor:
      - name: "Koekken skift segment"
        unique_id: koekken_skift_segment
        icon: mdi:transit-transfer
        state: >-
          {% set ny_slut = trigger.id == 'slut'
               and (this.attributes.slut | default(0) | float(0)) == 0
               and (this.attributes.start | default(0) | float(0)) > 0 %}
          {% if trigger.id == 'start' %}aktiv
          {% elif ny_slut %}{{ 'slut' if trigger.to_state.state == 'off' else 'ugyldig' }}
          {% elif this.state in ['aktiv', 'slut', 'ugyldig'] %}{{ this.state }}
          {% else %}ingen{% endif %}
        attributes:
          start: >-
            {{ as_timestamp(trigger.to_state.last_changed) if trigger.id == 'start'
               else (this.attributes.start | default(0)) }}
          slut: >-
            {% set ny_slut = trigger.id == 'slut'
                 and (this.attributes.slut | default(0) | float(0)) == 0
                 and (this.attributes.start | default(0) | float(0)) > 0 %}
            {% if trigger.id == 'start' %}0
            {% elif ny_slut %}{{ as_timestamp(trigger.to_state.last_changed) }}
            {% else %}{{ this.attributes.slut | default(0) }}{% endif %}
          lux_min: >-
            {% set ny_slut = trigger.id == 'slut'
                 and (this.attributes.slut | default(0) | float(0)) == 0
                 and (this.attributes.start | default(0) | float(0)) > 0 %}
            {% if trigger.id == 'start' %}{{ states('sensor.koekken_lux_effektiv') | float(-1) }}
            {% elif trigger.id == 'lux' and this.state == 'aktiv' %}{{
                 [this.attributes.lux_min | default(-1) | float(-1),
                  trigger.to_state.state | float(-1)] | min }}
            {% elif ny_slut and trigger.to_state.state != 'off' %}-1
            {% else %}{{ this.attributes.lux_min | default(-1) }}{% endif %}
          forrige_start: >-
            {{ (this.attributes.start | default(0)) if trigger.id == 'start'
               else (this.attributes.forrige_start | default(0)) }}
          forrige_slut: >-
            {{ (this.attributes.slut | default(0)) if trigger.id == 'start'
               else (this.attributes.forrige_slut | default(0)) }}
          forrige_lux_min: >-
            {{ (this.attributes.lux_min | default(-1)) if trigger.id == 'start'
               else (this.attributes.forrige_lux_min | default(-1)) }}

automation:
  # ---------------------------------------------------------------------------
  # Ét rent rum-skift forbi køkkenet uden kamera-bevægelse
  # ---------------------------------------------------------------------------
  # Fyrer på ANKOMST-flanken i alle tre rum. Ankommer kroppen til køkkenet,
  # er afgangen børneværelset/spisestuen; ankommer den til B eller S, er
  # afgangen køkkenet. Handlingen er lineær: hvert trin er en no-op for den
  # retning det ikke gælder, fordi en `variables:` inde i en if/then ikke
  # overlever grenen (scope).
  - id: koekken_skift_transit
    alias: "Køkken: rent rum-skift forbi køkkenet uden kamera-bevægelse"
    description: >-
      Én krop skifter rum mellem køkkenet og børneværelset/spisestuen (afgangs-
      rummet bliver tomt og forbliver tomt), køkken-opholdet varede længe nok i
      godt lys, og kameraet meldte ingen bevægelse hele vejen. Registreres i
      koekken_skift_registrer, som stiller spørgsmålet ved nok skift.
    mode: parallel
    max: 10
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.koekken_apollo_occupancy
          - binary_sensor.boernevaerelse_apollo_occupancy
          - binary_sensor.spisestue_apollo_occupancy
        from: "off"
        to: "on"
    variables:
      ta: "{{ as_timestamp(trigger.to_state.last_changed) }}"
      til_koekken: "{{ trigger.entity_id == 'binary_sensor.koekken_apollo_occupancy' }}"
      # Afgangs-kandidater: optaget NU, eller sluppet ≤ 20 s før ankomsten.
      kandidater: >-
        {% set deps = ['binary_sensor.boernevaerelse_apollo_occupancy',
                       'binary_sensor.spisestue_apollo_occupancy']
           if til_koekken else ['binary_sensor.koekken_apollo_occupancy'] %}
        {% set ns = namespace(l=[]) %}
        {% for e in deps %}
          {% set s = states[e] %}
          {% if s is not none and (s.state == 'on'
                or (s.state == 'off' and as_timestamp(s.last_changed) >= ta - 20)) %}
            {% set ns.l = ns.l + [e] %}
          {% endif %}
        {% endfor %}
        {{ ns.l }}
    condition:
      - condition: state
        entity_id: input_boolean.koekken_lav_krop_boern_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.koekken_kamera_krop_enabled
        state: "on"
      # Om natten sover børnene, og børne-flaget har sin egen nat-logik.
      - condition: time
        after: "06:00:00"
        before: "22:00:00"
      - condition: template
        value_template: >-
          {{ states('input_select.house_mode') in ['Normal', 'Home Vacation'] }}
      # En ankomst er en krop der KOMMER — rummet skal have været stille ≥ 20 s.
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and (trigger.to_state.last_changed - trigger.from_state.last_changed)
                 .total_seconds() >= 20 }}
      - condition: template
        value_template: "{{ kandidater | length > 0 }}"
      - condition: state
        entity_id: binary_sensor.koekken_kamera_vaagen
        state: "on"
      # Et møbel-spøgelse holder køkken-radaren optaget uden nogen krop.
      - condition: template
        value_template: >-
          {% set g = states.binary_sensor.koekken_apollo_frossen_ghost %}
          {{ g is not none and g.state == 'off'
             and as_timestamp(g.last_changed) < ta - 30 }}
      # Robotten ER den bevægelse radarerne ser, og den er for lav til kameraet
      # (user-spec 15/9: robotten må ALDRIG tælle som barn). session_active
      # sættes lokalt i startsekundet; de to andre kommer fra Roborock-skyen.
      - condition: template
        value_template: >-
          {% set ns = namespace(ok=true) %}
          {% for e in ['binary_sensor.roborock_blokerer_lys',
                       'binary_sensor.roborock_zone_maskering',
                       'input_boolean.roborock_session_active'] %}
            {% set s = states[e] %}
            {% if s is none or s.state != 'off'
                  or as_timestamp(s.last_changed) >= ta - 120 %}
              {% set ns.ok = false %}
            {% endif %}
          {% endfor %}
          {{ ns.ok }}
    action:
      # 1) Ankomsten HOLDER 10 s (et blip er ikke en krop der flyttede sig).
      - wait_template: >-
          {% set s = states[trigger.entity_id] %}
          {{ s is none or s.state != 'on' or as_timestamp(s.last_changed) > ta + 0.5 }}
        timeout: "{{ [ta + 10 - now().timestamp(), 0] | max }}"
      - condition: template
        value_template: "{{ not wait.completed }}"
      # 2) Afgangs-rummet er tomt senest 15 s efter ankomsten.
      - wait_template: >-
          {% set ns = namespace(ok=true) %}
          {% for e in kandidater %}
            {% if is_state(e, 'on') %}{% set ns.ok = false %}{% endif %}
          {% endfor %}
          {{ ns.ok }}
        timeout: "{{ [ta + 15 - now().timestamp(), 0] | max }}"
      - condition: template
        value_template: "{{ wait.completed }}"
      # td = afgangs-tidspunktet (unavailable er ikke "tomt").
      - variables:
          td: >-
            {% set ns = namespace(t=0, ok=true) %}
            {% for e in kandidater %}
              {% set s = states[e] %}
              {% if s is none or s.state != 'off' %}{% set ns.ok = false %}
              {% else %}{% set ns.t = [ns.t, as_timestamp(s.last_changed)] | max %}{% endif %}
            {% endfor %}
            {{ ns.t if ns.ok else 0 }}
      - condition: template
        value_template: "{{ td | float(0) > 0 }}"
      # Afgang fra køkkenet: segment-sensoren skrives i SAMME event som
      # afgangs-flanken — giv den 3 s, og kameraet 3 s margin efter segmentet.
      - delay: "{{ 0 if til_koekken else [td + 3 - now().timestamp(), 0] | max }}"
      - variables:
          seg_ud: >-
            {% set ns = namespace(s=0, e=0, lux=-1) %}
            {% if not til_koekken %}
              {% for p in ['', 'forrige_'] %}
                {% set s = state_attr('sensor.koekken_skift_segment', p ~ 'start') | float(0) %}
                {% set e = state_attr('sensor.koekken_skift_segment', p ~ 'slut') | float(0) %}
                {% if ns.s == 0 and s > 0 and e > 0 and (e - td) | abs < 1.5 %}
                  {% set ns.s = s %}{% set ns.e = e %}
                  {% set ns.lux = state_attr('sensor.koekken_skift_segment',
                                             p ~ 'lux_min') | float(-1) %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ {'s': ns.s, 'e': ns.e, 'lux': ns.lux} }}
      - condition: template
        value_template: "{{ til_koekken or seg_ud.s > 0 }}"
      # Kameraet tavst fra 3 s før køkken-segmentet til nu (≥ 3 s efter).
      - condition: template
        value_template: >-
          {% set c = states.binary_sensor.koekken_kamera_krop %}
          {{ til_koekken or (c is not none and c.state == 'off'
             and as_timestamp(c.last_changed) < seg_ud.s - 3) }}
      # 3) Afgangs-rummet FORBLIVER tomt til td + 30 s — ellers var der to kroppe.
      - wait_template: >-
          {% set ns = namespace(brudt=false) %}
          {% for e in kandidater %}
            {% set s = states[e] %}
            {% if s is none or s.state != 'off'
                  or as_timestamp(s.last_changed) > td + 0.5 %}
              {% set ns.brudt = true %}
            {% endif %}
          {% endfor %}
          {{ ns.brudt }}
        timeout: "{{ [td + 30 - now().timestamp(), 0] | max }}"
      - condition: template
        value_template: "{{ not wait.completed }}"
      # 4) Ankomst i køkkenet: dommen kræver at køkken-opholdet er SLUT
      #    (max 10 min — et længere ophold er ikke et skift).
      - wait_template: >-
          {% if not til_koekken %}true{% else %}
            {% set ns = namespace(ok=false) %}
            {% for p in ['', 'forrige_'] %}
              {% set s = state_attr('sensor.koekken_skift_segment', p ~ 'start') | float(0) %}
              {% set e = state_attr('sensor.koekken_skift_segment', p ~ 'slut') | float(0) %}
              {% if (s - ta) | abs < 1.5 and e > 0 %}{% set ns.ok = true %}{% endif %}
            {% endfor %}
            {{ ns.ok }}
          {% endif %}
        timeout: "{{ [ta + 600 - now().timestamp(), 0] | max }}"
      - condition: template
        value_template: "{{ not til_koekken or wait.completed }}"
      - variables:
          seg_ind: >-
            {% set ns = namespace(s=0, e=0, lux=-1) %}
            {% if til_koekken %}
              {% for p in ['', 'forrige_'] %}
                {% set s = state_attr('sensor.koekken_skift_segment', p ~ 'start') | float(0) %}
                {% set e = state_attr('sensor.koekken_skift_segment', p ~ 'slut') | float(0) %}
                {% if ns.s == 0 and (s - ta) | abs < 1.5 and e > 0 %}
                  {% set ns.s = s %}{% set ns.e = e %}
                  {% set ns.lux = state_attr('sensor.koekken_skift_segment',
                                             p ~ 'lux_min') | float(-1) %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ {'s': ns.s, 'e': ns.e, 'lux': ns.lux} }}
      - delay: "{{ [seg_ind.e + 3 - now().timestamp(), 0] | max if til_koekken else 0 }}"
      # Kameraet tavst fra 3 s før ankomsten til 3 s efter køkken-segmentet.
      - condition: template
        value_template: >-
          {% set c = states.binary_sensor.koekken_kamera_krop %}
          {{ not til_koekken or (c is not none and c.state == 'off'
             and as_timestamp(c.last_changed) < ta - 3) }}
      - variables:
          seg: "{{ seg_ind if til_koekken else seg_ud }}"
      - condition: template
        value_template: >-
          {{ seg.s > 0
             and (seg.e - seg.s)
                 >= (states('input_number.koekken_skift_min_segment_sek') | float(10))
             and seg.lux >= (states('input_number.koekken_skift_min_lux') | float(40)) }}
      # Gen-tjek ved dommen: kameraet vågent HELE segmentet (last_changed efter
      # en restart = boot → afvist, #23), intet spøgelse, ingen robot undervejs.
      - condition: template
        value_template: >-
          {% set v = states.binary_sensor.koekken_kamera_vaagen %}
          {% set g = states.binary_sensor.koekken_apollo_frossen_ghost %}
          {% set ns = namespace(ok=v is not none and v.state == 'on'
                                   and as_timestamp(v.last_changed) < seg.s
                                   and g is not none and g.state == 'off'
                                   and as_timestamp(g.last_changed) < ta - 30) %}
          {% for e in ['binary_sensor.roborock_blokerer_lys',
                       'binary_sensor.roborock_zone_maskering',
                       'input_boolean.roborock_session_active'] %}
            {% set s = states[e] %}
            {% if s is none or s.state != 'off'
                  or as_timestamp(s.last_changed) >= ta - 120 %}
              {% set ns.ok = false %}
            {% endif %}
          {% endfor %}
          {{ ns.ok }}
      - service: script.koekken_skift_registrer
        data:
          ta: "{{ ta }}"
          rum: >-
            {% set k = {'binary_sensor.koekken_apollo_occupancy': 'K',
                        'binary_sensor.boernevaerelse_apollo_occupancy': 'B',
                        'binary_sensor.spisestue_apollo_occupancy': 'S'} %}
            {% set ns = namespace(r='') %}
            {% for e in kandidater %}{% set ns.r = ns.r ~ k[e] %}{% endfor %}
            {{ ns.r ~ '>' ~ k[trigger.entity_id] }}
          seg: "{{ (seg.e - seg.s) | round(0) | int }}"
          lux: "{{ seg.lux | round(0) | int }}"

  # ---------------------------------------------------------------------------
  # Nulstil sporet når flaget allerede er sat, og hver nat
  # ---------------------------------------------------------------------------
  - id: koekken_lav_krop_ryd
    alias: "Køkken: ryd sporet af rene rum-skift"
    description: >
      Sporet skal ikke kunne bære over til i morgen. Ryddes når børn-flaget
      allerede er sat (så det ikke fyrer igen i det sekund flaget selv ryddes),
      og hver nat.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: input_boolean.boern_aktivitet_detekteret
        from: "off"
        to: "on"
        id: flag_sat
      - platform: time
        at: "03:30:00"
        id: nat
    condition:
      - condition: template
        value_template: >-
          {{ states('input_text.koekken_lav_krop_spor') not in
             ['', 'unknown', 'unavailable'] }}
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.koekken_lav_krop_spor
        data:
          value: ""

script:
  # Tæller de rene skift. `queued`, så to skift der dømmes i samme sekund ikke
  # læser sporet før hinanden har skrevet det (fejlklasse #2's tids-variant).
  # Skiftene dømmes UDEN for rækkefølge (et skift ind i køkkenet først når
  # opholdet er slut), så sporet sorteres og beskæres fra det nyeste.
  koekken_skift_registrer:
    alias: "Køkken: registrér et rent rum-skift"
    mode: queued
    max: 10
    fields:
      ta:
        description: "Ankomst-tidspunktet (epoch)"
      rum:
        description: "Afgang>ankomst, fx B>K eller K>S"
      seg:
        description: "Køkken-opholdets længde (s)"
      lux:
        description: "Laveste lux i køkkenet under opholdet"
    sequence:
      - variables:
          res: >-
            {% set t = ta | default(0) | float(0) | int %}
            {% set W = (states('input_number.koekken_lav_krop_vindue_min') | float(30)) * 60 %}
            {% set gap = states('input_number.koekken_skift_min_afstand_sek') | float(120) %}
            {% set antal = states('input_number.koekken_lav_krop_antal') | int(2) %}
            {% set raw = states('input_text.koekken_lav_krop_spor') %}
            {% set ns = namespace(dup=false, top=t, l=[]) %}
            {% if raw not in ['', 'unknown', 'unavailable'] %}
              {% for x in raw.split(',') %}
                {% set q = x.split(':')[0] | int(0) %}
                {% if q > 0 %}
                  {% if (q - t) | abs < 3 %}{% set ns.dup = true %}{% endif %}
                  {% set ns.top = [ns.top, q] | max %}
                  {% set ns.l = ns.l + [x] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {% set ny = t ~ ':' ~ (rum | default('?')) ~ ':'
                 ~ (seg | default(0) | int(0)) ~ ':'
                 ~ ([lux | default(0) | int(0), 9999] | min) %}
            {% set ns2 = namespace(l=[]) %}
            {% for x in ns.l + [ny] %}
              {% if (x.split(':')[0] | int(0)) >= ns.top - W %}
                {% set ns2.l = ns2.l + [x] %}
              {% endif %}
            {% endfor %}
            {% set liste = (ns2.l | sort)[-10:] %}
            {% set ns3 = namespace(n=0, sidst=0) %}
            {% for x in liste %}
              {% set q = x.split(':')[0] | int(0) %}
              {% if ns3.n == 0 or q - ns3.sidst >= gap %}
                {% set ns3.n = ns3.n + 1 %}{% set ns3.sidst = q %}
              {% endif %}
            {% endfor %}
            {% set navn = {'K': 'køkken', 'B': 'børneværelse', 'S': 'spisestue'} %}
            {% set ns4 = namespace(t=[]) %}
            {% for x in liste %}
              {% set d = x.split(':') %}
              {% set r = d[1] if d | length > 1 else '' %}
              {% set ns5 = namespace(f=[]) %}
              {% for c in (r.split('>')[0] if '>' in r else '') %}
                {% set ns5.f = ns5.f + [navn.get(c, c)] %}
              {% endfor %}
              {% set til = r.split('>')[1] if '>' in r else '' %}
              {% set ns4.t = ns4.t + [ns5.f | join('/') ~ '→' ~ navn.get(til, til)
                   ~ ' ' ~ (d[0] | int(0) | timestamp_custom('%H:%M'))] %}
            {% endfor %}
            {{ {'dup': ns.dup, 'spor': liste | join(','), 'n': ns3.n,
                'fyr': ns3.n >= antal, 'tekst': ns4.t | join(', ')} }}
      - condition: template
        value_template: "{{ not res.dup and (ta | default(0) | float(0)) > 0 }}"
      - if:
          - condition: template
            value_template: "{{ res.fyr }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.koekken_lav_krop_spor
            data:
              value: ""
          # Spørgsmålet stilles af boern_ankomst_koekken_spoerg, som ejer hele
          # gate-pakken (flag allerede sat, "nej i dag", AirBnB, voksen hjemme).
          - event: koekken_skift_bevist
            event_data:
              antal: "{{ res.n }}"
              spor: "{{ res.spor }}"
              tekst: "{{ res.tekst }}"
          - service: logbook.log
            data:
              name: "Køkken-skift"
              message: >-
                {{ res.n }} rene skift uden kamera-bevægelse ({{ res.tekst }})
                → spørger om børn er hjemme.
        else:
          - service: input_text.set_value
            target:
              entity_id: input_text.koekken_lav_krop_spor
            data:
              value: "{{ res.spor[:255] }}"
          - service: logbook.log
            data:
              name: "Køkken-skift"
              message: >-
                Rent skift {{ rum | default('?') }} uden kamera-bevægelse
                (køkken {{ seg | default(0) }} s, {{ lux | default(0) }} lx) —
                {{ res.n }}/{{ states('input_number.koekken_lav_krop_antal') | int(2) }}.
