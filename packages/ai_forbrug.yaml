# =============================================================================
# AI-udgift — husets kald til Claude via HA's ai_task (2026-11-04)
# =============================================================================
# User-spec: "hold øje med costs!" → "giv visuals på cost! både for det
# [Nemlig-tjekket] og folketinget". Alle kald går gennem scripts/ai_forbrug.py,
# som skriver hvert kald i /config/.ai_forbrug.jsonl og nægter nye kald når
# månedens sum når loftet herunder (kalderen falder så tilbage til sin ikke-AI-vej:
# Folketingets titelkort, Nemlig-kurven uden tjek).
#
# Prisen er ANSLÅET (tegn/3 + tillæg for HA's system-prompt, Haiku 4.5 = 1 $/M ind,
# 5 $/M ud, 7 kr/$) — ai_task oplyser ingen token-tal. Den rigtige regning står i
# console.anthropic.com → Usage. Målt 4/11: Folketing-one-liner ~0,7 øre, Nemlig-
# tjek af 36 varer ~1,5-2 øre pr. kørsel.
#
# Sensorernes state = kr i ALT (total_increasing) → Statistik → Claude viser
# udgiften pr. dag/måned; kr_maaned/kald_maaned står som attributter.
# =============================================================================

input_number:
  ai_loft_kr_maaned:
    name: "AI — loft pr. måned"
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: kr
    icon: mdi:robot-confused

command_line:
  - sensor:
      name: "AI-udgift"
      unique_id: ai_udgift
      icon: mdi:robot
      command: "python3 /config/scripts/ai_forbrug.py status"
      command_timeout: 20
      scan_interval: 900
      unit_of_measurement: kr
      state_class: total_increasing
      value_template: "{{ value_json.state }}"
      json_attributes: &ai_attrs
        - kr_maaned
        - kald_maaned
        - kald_i_alt
        - tokens_ind_maaned
        - tokens_ud_maaned
        - kr_pr_kald
        - husets_kr_maaned
        - loft_kr_maaned
        - model
        - sidste_kald
  - sensor:
      name: "AI-udgift Folketing"
      unique_id: ai_udgift_folketing
      icon: mdi:bank
      command: "python3 /config/scripts/ai_forbrug.py status folketing"
      command_timeout: 20
      scan_interval: 900
      unit_of_measurement: kr
      state_class: total_increasing
      value_template: "{{ value_json.state }}"
      json_attributes: *ai_attrs
  - sensor:
      name: "AI-udgift Nemlig"
      unique_id: ai_udgift_nemlig
      icon: mdi:cart-check
      command: "python3 /config/scripts/ai_forbrug.py status nemlig"
      command_timeout: 20
      scan_interval: 900
      unit_of_measurement: kr
      state_class: total_increasing
      value_template: "{{ value_json.state }}"
      json_attributes: *ai_attrs
