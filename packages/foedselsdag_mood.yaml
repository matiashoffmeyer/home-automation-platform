# =============================================================================
# Fødselsdag-mood — Dannebrog: rød/hvid der bytter plads hvert 5. minut
# =============================================================================
# Moden ejes af scene-rammen: input_select.active_scene == 'foedselsdag' ER
# tændt/slukket-kontakten (dashboard-tile → script.scene_toggle). Den holder
# derfor til en HA-restart uden en ekstra mode-boolean, og toggle-off slukker
# lyset + rydder cirkus_active i forvejen.
#
# script.scene_foedselsdag / script.foedselsdag_apply (script_pkg/scenes.yaml)
# ejer lys-rosteret — de 10 entity_ids står KUN dér (fejlklasse #2).
#
# Hvorfor input_number og ikke input_datetime som skifte-stempel: epoch-tal er
# fri for TZ-fælden i CLAUDE.md ("timestamp læses 2 t forskudt"), og en SKREVET
# værdi overlever en restart uden at last_changed lyver (fejlklasse #5).
#
# Hvorfor /1-tick + stempel og ikke time_pattern "/5": et /5-tick kunne bytte
# farver 15 sekunder efter moden blev tændt. Stemplet gør de 5 minutter
# ægte — og en restart midt i moden koster maks. ét skift, ikke loopet
# (fejlklasse #4/#15: en `for:`-flanke ville aldrig re-arme efter boot).
# =============================================================================

input_boolean:
  foedselsdag_fase_b:
    name: "Fødselsdag: fase B (farver byttet)"
    icon: mdi:swap-horizontal

input_number:
  foedselsdag_sidste_skift_ts:
    name: "Fødselsdag: sidste farveskift (epoch)"
    icon: mdi:clock-outline
    min: 0
    max: 4102444800
    step: 1
    mode: box

automation:
  - id: foedselsdag_farveskift
    alias: "Fødselsdag: byt rød/hvid hvert 5. minut"
    description: >
      Tikker hvert minut, men handler først når stemplet er 5 min gammelt.
      Automatisk udgang (AirBnB-reglen: en gæst skal kunne slippe ud uden at
      kende systemet): er ALLE 10 mood-lys slukket, afslutter
      script.foedselsdag_apply moden i stedet for at tænde dem igen.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"
    condition:
      - condition: state
        entity_id: input_select.active_scene
        state: foedselsdag
      - condition: template
        value_template: >-
          {{ now().timestamp()
             - states('input_number.foedselsdag_sidste_skift_ts') | float(0) >= 300 }}
    action:
      - service: input_boolean.toggle
        target:
          entity_id: input_boolean.foedselsdag_fase_b
      - service: input_number.set_value
        target:
          entity_id: input_number.foedselsdag_sidste_skift_ts
        data:
          value: "{{ now().timestamp() | round(0) }}"
      - service: script.foedselsdag_apply
        data:
          check_exit: true
