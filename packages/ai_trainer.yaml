  # 4) MÅLTID — var klassifikationen hjemmearbejde vs måltid rigtig?
  # ===========================================================================
  - id: trainer_maaltid_ask
    alias: "Træner: måltid/hjemmearbejde-klassifikation (push + svar-knapper)"
    trigger:
      # Fyrer i SAMME øjeblik beslutningen tages (frisk hukommelse hos user):
      # hjemmearbejde-flaget tændes ELLER måltid registreres (begge paths i
      # maaltid_detektion.yaml sætter maaltid_sidst_registreret).
      - platform: state
        entity_id: input_boolean.maaltid_hjemmearbejde_dag
        from: "off"
        to: "on"
        id: hjemmearbejde
      - platform: state
        entity_id: input_datetime.maaltid_sidst_registreret
        id: maaltid
    condition:
      - condition: state
        entity_id: input_boolean.trainer_maaltid_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.notifikationer_master_enabled
        state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: "AirBnB"
      # Restart-restore-guard: kun ægte værdi→værdi-skift (ikke unknown→X).
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable'] }}
      # Intensitet < 50 → sampl klassifikations-events ned (i×2 % chance).
      - condition: template
        value_template: >-
          {{ range(1, 101) | random
             <= [(states('input_number.trainer_intensitet') | int(50)) * 2, 100] | min }}
    action:
      - variables:
          fb_id: "{{ now().strftime('%Y%m%d%H%M%S') }}"
          guess: "{{ 'hjemmearbejde' if trigger.id == 'hjemmearbejde' else 'maaltid' }}"
          payload_b64: >-
            {{ {
              'type': 'ask',
              'id': fb_id,
              'ts': now().isoformat(),
              'guess': guess,
              'hour': now().hour,
              'signals': {
                'spisestue_bekraeft_min': states('sensor.maaltid_spisestue_bekraeft_min_i_vindue') | float(-1),
                'madlavning_min': states('sensor.maaltid_madlavning_min_i_vindue') | float(-1),
                'spisning_min': states('sensor.maaltid_spisning_min_i_vindue') | float(-1),
                'oprydning_min': states('sensor.maaltid_oprydning_min_i_vindue') | float(-1),
                'bekraeft_vindue_min': states('input_number.maaltid_hjemmearbejde_bekraeft_minutter') | float(-1),
                'hjemmearbejde_ophold_min': states('sensor.hjemmearbejde_ophold_min_i_vindue') | float(-1),
                'hjemmearbejde_taerskel': states('input_number.hjemmearbejde_ophold_minutter') | float(-1)
              }
            } | to_json | base64_encode }}
      - service: input_text.set_value
        target: {entity_id: input_text.trainer_maaltid_pending}
        data: {value: "{{ fb_id }}"}
      - service: shell_command.ai_feedback_append
        data: {log_slug: maaltid, payload_b64: "{{ payload_b64 }}"}
      - service: notify.mobile_app_phone_a
        data:
          title: "🍽️ {{ 'Hjemmearbejde ved bordet?' if guess == 'hjemmearbejde' else 'Måltid afsluttet?' }}"
          message: >-
            {{ 'Jeg vurderede lige: HJEMMEARBEJDE (ingen auto-støvsug resten af arbejdsvinduet).'
               if guess == 'hjemmearbejde'
               else 'Jeg vurderede lige: MÅLTID afsluttet (evt. auto-støvsug).' }}
            Rigtigt? (træner måltids-detektionen)
          data:
            tag: trainer_maaltid
            actions:
              - action: "TRAINER_MAALTID_RIGTIG"
                title: "✅ Rigtigt"
              - action: "TRAINER_MAALTID_FORKERT"
                title: "❌ Forkert"
              - action: "TRAINER_MAALTID_VEDIKKE"
                title: "🤷 Ved ikke"

