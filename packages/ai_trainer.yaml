  # ===========================================================================
  # 6) KØKKEN-TIMER — var nedtællingen ÆGTE? (2026-09-19, user-spec)
  # ===========================================================================
  # Kameraets finger-kanal har ingen sikkerheds-score: en hånd der tilfældigt
  # holder fire fingre i nok frames starter en rigtig nedtælling med husdækkende
  # lysalarm. Vi kan SE hvor mange frames der var, men ikke om mennesket MENTE
  # det — det kan kun user svare på. Derfor denne træner: facit mod
  # `input_number.gestus_hold_frames` (og de to andre gestus-slidere), så en
  # senere session kan hæve tærsklen på MÅLTE falske positiver i stedet for på
  # noten "3 er målt farligt, prøv 5".
  #
  # SPØRGER FØRST NÅR EPISODEN ER OVRE, ikke ved start:
  #   · ved start kender vi ikke udfaldet, og en push midt i en ægte
  #     madlavning er ren støj.
  #   · levetiden ER diskriminatoren: en utilsigtet timer bliver annulleret
  #     efter få sekunder, en ægte kører til ende. Spørger vi først bagefter,
  #     kan den feature logges sammen med facit.
  # Spørger på BEGGE udfald (færdig OG annulleret), fordi et negativ-sæt man
  # kun samler på annulleringer er poseret (📏-reglen): kalibreringen skal se
  # hele kontinuummet, ikke kun dem der allerede så forkerte ud.
  #
  # Start-konteksten kommer fra `sensor.koekken_trigger_log`s `sidste_*`-
  # attributter (packages/tapo_tuning.yaml) — samme stempel som Tapo-sidens
  # log, så kilde og bevis kun har ÉN ejer (#2).
  - id: trainer_timer_ask
    alias: "Træner: var køkken-timeren ægte? (push + svar-knapper)"
    mode: queued
    max: 5
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.koekken_gestus
        id: faerdig
      - platform: event
        event_type: timer.cancelled
        event_data:
          entity_id: timer.koekken_gestus
        id: annulleret
    condition:
      - condition: state
        entity_id: input_boolean.trainer_timer_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.notifikationer_master_enabled
        state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: "AirBnB"
      # Intensitet < 50 → sampl ned (i×2 % chance), som de andre event-trænere.
      - condition: template
        value_template: >-
          {{ range(1, 101) | random
             <= [(states('input_number.trainer_intensitet') | int(50)) * 2, 100] | min }}
    action:
      # Stempl slut-tidspunktet FØR ventetiden: alarmen kan ringe i minutter, og
      # den tid hører ikke til nedtællingens levetid.
      - variables:
          slut_ts: "{{ as_timestamp(now()) }}"
          start_ts: >-
            {{ as_timestamp(state_attr('sensor.koekken_trigger_log', 'sidste_ts')
                            | default('', true), 0) | float(0) }}
      # En færdig timer ringer husdækkende lysalarm; spørgsmålet skal ikke lande
      # oven i den. Annullerede timere har ingen alarm og passerer med det samme.
      - wait_template: >-
          {{ not states('input_text.koekken_gestus_alarm').startswith('aktiv') }}
        timeout: "00:06:00"
        continue_on_timeout: true
      # Mode kan være flippet til AirBnB mens alarmen ringede (gæst ankommet).
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: "AirBnB"
      - variables:
          fb_id: "{{ now().strftime('%Y%m%d%H%M%S') }}"
          udfald: "{{ trigger.id }}"
          # Varigheden kommer fra TIMEREN SELV, ikke fra log-sensoren: `duration`
          # overlever både restart og et reload, og den kan ikke komme til at
          # beskrive en anden episode.
          varighed_sek: >-
            {% set p = (state_attr('timer.koekken_gestus', 'duration')
                        | default('0:00:00', true) | string).split(':') %}
            {{ (p[0] | int(0)) * 3600 + (p[1] | int(0)) * 60 + (p[2] | int(0)) }}
          minutter: "{{ ((varighed_sek | int(0)) / 60) | round(0) | int(0) }}"
          # Log-sensorens stempel RESTORERES over reload og genstart, så et
          # gammelt `sidste_kilde` ville ellers blive hæftet på en episode det
          # ikke hører til. Er stemplet ældre end selve nedtællingen (+2 min
          # slack), er kilden ukendt — og det skal stå i loggen som ukendt, ikke
          # som et gæt (en forkert etiket er værre end et hul).
          stempel_alder_sek: >-
            {{ ((slut_ts | float(0)) - (start_ts | float(0))) | round(0)
               if (start_ts | float(0)) > 0 else -1 }}
          kilde: >-
            {{ state_attr('sensor.koekken_trigger_log', 'sidste_kilde') | default('ukendt', true)
               if (stempel_alder_sek | int(-1)) >= 0
                  and (stempel_alder_sek | int(-1)) <= (varighed_sek | int(0)) + 120
               else 'ukendt' }}
          bevis: >-
            {{ state_attr('sensor.koekken_trigger_log', 'sidste_bevis') | default('—', true)
               if kilde != 'ukendt' else '—' }}
          # -1 = intet brugbart start-stempel (HA genstartede midt i
          # nedtællingen, eller timeren blev sat før denne feature gik live).
          levetid_sek: >-
            {{ stempel_alder_sek | int(-1) if kilde != 'ukendt' else -1 }}
          payload_b64: >-
            {{ {
              'type': 'ask',
              'id': fb_id,
              'ts': now().isoformat(),
              'guess': 'timer_aegte',
              'hour': now().hour,
              'signals': {
                'kilde': kilde,
                'bevis': bevis,
                'minutter': minutter | int(0),
                'udfald': udfald,
                'levetid_sek': levetid_sek | int(-1),
                'varighed_sek': varighed_sek | int(0),
                'andel_koert': ((levetid_sek | float(-1)) / (varighed_sek | float(1))) | round(3)
                               if (varighed_sek | int(0)) > 0 and (levetid_sek | float(-1)) >= 0 else -1,
                'hold_frames': states('input_number.gestus_hold_frames') | float(-1),
                'hold_knytnaeve': states('input_number.gestus_hold_knytnaeve') | float(-1),
                'frisk_sek': states('input_number.gestus_frisk_sek') | float(-1),
                'gentag_cooldown_sek': states('input_number.gestus_gentag_cooldown_sek') | float(-1),
                'kamera_krop': states('binary_sensor.koekken_kamera_krop'),
                'house_mode': states('input_select.house_mode')
              }
            } | to_json | base64_encode }}
      # Kun FINGER-startede timere (2026-10-20): træneren kalibrerer finger-
      # tærsklen, og stemme-/knap-timere er ikke i tvivl — målt 19/9-11/10:
      # 6 stemme- og 5 ukendt-kilde-spørgsmål, 0 svar; fingre 7 af 13 svaret.
      - condition: template
        value_template: "{{ kilde == 'fingre' }}"
      - service: input_text.set_value
        target: {entity_id: input_text.trainer_timer_pending}
        data: {value: "{{ fb_id }}"}
      - service: shell_command.ai_feedback_append
        data: {log_slug: timer, payload_b64: "{{ payload_b64 }}"}
      - service: notify.mobile_app_phone_a
        data:
          title: >-
            ⏲️ {{ minutter }} min-timeren {{ 'kørte til ende' if udfald == 'faerdig'
                                             else 'blev annulleret' }} — var den din?
          message: >-
            Kameraet så fingre ({{ bevis }}), og den kørte
            {{ ((levetid_sek | int(0) / 60) | round(1) | string) | replace('.', ',') }} min.
          data:
            tag: trainer_timer
            actions:
              - action: "TRAINER_TIMER_RIGTIG"
                title: "✅ Min egen"
              - action: "TRAINER_TIMER_UTILSIGTET"
                title: "🖐️ Utilsigtet"
              - action: "TRAINER_TIMER_FORKERTTAL"
                title: "🔢 Forkert tal"

  - id: trainer_timer_answer
    alias: "Træner: køkken-timer-svar → log JSONL"
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
    condition:
      - condition: template
        value_template: >-
          {{ (trigger.event.data.action | default('')).startswith('TRAINER_TIMER_') }}
      - condition: template
        value_template: >-
          {{ states('input_text.trainer_timer_pending')
             not in ['', 'unknown', 'unavailable'] }}
    action:
      - variables:
          answer: "{{ trigger.event.data.action | replace('TRAINER_TIMER_', '') | lower }}"
          payload_b64: >-
            {{ {
              'type': 'answer',
              'id': states('input_text.trainer_timer_pending'),
              'ts': now().isoformat(),
              'answer': answer,
              'hold_frames_at_answer': states('input_number.gestus_hold_frames') | float(-1)
            } | to_json | base64_encode }}
      - service: shell_command.ai_feedback_append
        data: {log_slug: timer, payload_b64: "{{ payload_b64 }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.trainer_timer_pending}
        data: {value: ""}
      # Ingen Tak-push (2026-10-20): knap-trykket fjerner selv notifikationen.
