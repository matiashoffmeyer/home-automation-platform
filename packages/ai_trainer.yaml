  # 5) DORMANT — var huset reelt i ro da vi gik i Dormant? (2026-07-24)
  # Falsk Dormant = lys slukker på folk (den dyre fejl). 5 min sustained =
  # flap-guard; dagtimer-vindue så pushen ikke vækker nogen om natten.
