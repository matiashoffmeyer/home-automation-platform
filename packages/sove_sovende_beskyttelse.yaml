# =============================================================================
# sove_sovende_beskyttelse.yaml — "der kan ligge en der sover derinde" (2026-11-02)
# =============================================================================
# User-spec 2026-11-02: "loftet skal ikke tænde før du er sikker på at der
# ikke ligger nogen der sover derinde. sengetæller over 0 og still activity og
# døren lukket derind til er indikationer på at der er en der skal beskyttes.
# knapper skal stadig kunne tænde derinde men ikke auto lys jo."
#
# Baggrund: 2/11 05:39 ryddede godmorgen-clear godnat på et brusebad mens
# partneren sov. Fra da af var sove-loftets hovedvej kun spærret af sit
# 06:00-gulv — godnat-flaget er IKKE et søvn-bevis, det er en husrutine, og
# det kan ryddes af en anden person end den der sover.
#
# ON = sengetæller > 0 ELLER (stille krop OG lukket dør). Målt 19/10-2/11 med
# TOM seng (sengetæller 0), kl. 09-21 (9045 min): dvale-vidnet alene on 35,7 %
# (spøgelses-still, episoder op til 20 t), lukket dør alene 19,7 %, begge
# samtidig 2,4 %. Hver for sig ville spærren stå halvdelen af dagen i et tomt
# rum og ikke slippe når I står op; kombinationen er den smalle.
#   1. sengetælleren > 0 (input_number.sove_seng_personer) — hovedbeviset;
#      2/11 05:35 var døren ÅBEN hele natten, kun tælleren bar.
#   2. stille krop (sovevaerelse_dvale_vidne: 150 s hold ind, 16 min bro ud)
#      bag LUKKET dør (binary_sensor.parasoll_sovedoer off) — fanger en sovende
#      tælleren har tabt. Den der kommer ind åbner døren → spærren slipper.
# Slipper når I står op: tælleren tæller ud, og døren står åben.
# Forbrugere — ALLE automatiske tænd-veje for sove-lys (fejlklasse #21: en spærre
# der ikke står på hver vej ind, er pynt). `grep -rn sove_sovende_beskyttes`:
#   presence_sovevaerelse.yaml  Lysnet: Soveværelse tænd + gang-early-detect
#   presence_lights.yaml        Lysnet: Soveværelse tænd ved LUX-fald
#   godmorgen_godnat.yaml       Godmorgen auto-detect (sove-grenen) + sengelys
# BEVIDST undtaget: knapper (Styrbar/RODRET/Somrig — user-spec 1/11, tryk
# respekteres altid), alarm-vækningen ("er en alarm sat vækkes vi"),
# røgalarm-blink og strøm-recovery.
#
# Fejlklasse #9: en død dør eller et dødt vidne er INGEN indikation (fail-open
# pr. kanal) — de andre kanaler bærer stadig. Er tælleren slået fra, tæller den
# ikke. Ingen now() → skriver kun når en kilde skifter (#24).
# =============================================================================

template:
  - binary_sensor:
      - name: "Sove sovende beskyttes"
        unique_id: sove_sovende_beskyttes
        icon: mdi:bed-clock
        state: >-
          {% set seng = is_state('input_boolean.sove_seng_taeller_enabled', 'on')
                        and states('input_number.sove_seng_personer') | int(0) > 0 %}
          {{ seng
             or (is_state('binary_sensor.sovevaerelse_dvale_vidne', 'on')
                 and is_state('binary_sensor.parasoll_sovedoer', 'off')) }}
        attributes:
          grunde: >-
            {% set g = [] %}
            {% if is_state('input_boolean.sove_seng_taeller_enabled', 'on')
                  and states('input_number.sove_seng_personer') | int(0) > 0 %}
              {% set g = g + ['sengetæller ' ~ states('input_number.sove_seng_personer') | int(0)] %}
            {% endif %}
            {% if is_state('binary_sensor.sovevaerelse_dvale_vidne', 'on')
                  and is_state('binary_sensor.parasoll_sovedoer', 'off') %}
              {% set g = g + ['stille krop bag lukket dør'] %}
            {% endif %}
            {{ g | join(', ') if g else 'ingen' }}
