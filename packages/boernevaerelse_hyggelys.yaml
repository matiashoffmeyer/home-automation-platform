# =============================================================================
# Børnehygge plug-lampe (2026-06-03, user-request)
# =============================================================================
# switch.sove_plug = Innr SP 240 wall plug, nu flyttet/brugt i børneværelset
# med en (ikke-smart) hyggelampe i. Wrappes som template-light så den:
#   - vises som en LYS-knap "Børnehygge" i appen
#   - kan targetes af light.turn_on (scenes/grupper kalder light.*, ikke switch.*)
#
# Lampen er non-dimmable → brightness/color ignoreres, light.turn_on tænder bare
# plug'en (on/off). Den TÆNDER MED hygge-strippen via automations/
# boernevaerelse_hyggelys_mirror.yaml (app-hyggelys + børneværelse-Styrbar).
#
# NB: underliggende device hedder stadig "Sove Plug" / switch.sove_plug (entity-
# id'et bevaret så sensor.sove_plug_* + device_health_check ikke brækker). Kun
# wrapper-lyset er omdøbt til børnehygge-rollen.
# =============================================================================
template:
  - light:
      # unique_id bevaret ⇒ registry-entry'en genbruges ⇒
      # light.boernevaerelse_hyggelys beholder sit entity_id.
      - name: "Børnehygge (plug-lampe)"
        unique_id: boernevaerelse_hyggelys_light
        icon: mdi:teddy-bear
        state: "{{ is_state('switch.sove_plug','on') }}"
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.sove_plug
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.sove_plug
