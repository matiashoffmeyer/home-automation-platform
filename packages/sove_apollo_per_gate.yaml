# =============================================================================
# Sove Apollo — FULD per-gate radar-kalibrering (user-spec 2026-07-09)
# =============================================================================
# Baggrund: den enkelte "Følsomhed"-slider skalerede ALLE gates med én faktor →
# umulig tradeoff for soveværelset. Nat-data 2026-07-08 (slider 49 / factor 1.22):
#   - ALLE occupancy-skift drevet af still_target (moving_target fyrede ALDRIG
#     hele natten → en sovende voksen giver INGEN bevægelses-blips).
#   - Mid-field still (g2-g5 applied 18-22) tabte den sovende krop i 4-timers
#     stræk (occupancy OFF 23:01→03:10 og 03:11→07:33).
#   - Nærfelt-move (g0/g1) skulle samtidig holdes HØJT (55%/factor 0.90 gav
#     nærfelt-spøgelser → occupancy stuck ON → "huset vågent").
# Én faktor kan ikke gøre begge. LØSNING: fuld per-gate kontrol for KUN sove.
#
# Denne pakke er NU DEN ENESTE AUTORITET over sove-Apolloens gate-thresholds.
# Sove er fjernet fra faktor-tuneren (apollo_radar_global_tuning.yaml) +
# apply_now (script_pkg/apollo_helpers.yaml). De 18 sliders skriver DIREKTE til
# number.sovevaerelse_apollo_g{N}_{still,move}_threshold (rå værdi, ingen faktor).
#
# LD2410-fysik: gate = ~0.75 m afstands-bin (g0=0-0.75m … g8=6-6.75m).
#   still_threshold LAV = holder en stille/sovende krop i den afstand (men for
#     lavt = mid-field-spøgelse). HØJ = blind for still i den afstand.
#   move_threshold: samme for bevægelse (gang). g0/g1 move HØJ = nærfelt-
#     spøgelses-guard (LD2410 factory 50).
#   max_still/move_distance = 5 → gates 6-8 deltager IKKE i detektion (irrelevante).
#
# Kalibrering 2026-07-09 (user-valg: hold occupancy ON om natten, estimat+iterér):
#   g0/g1: still+move HØJT (nærfelt-spøgelses-guard, bevaret fra det rene 49%-setup)
#   g2-g5: still AGGRESSIVT LAVT (8-10) = hold sovende krop (var 18-22 = tabte dig)
#   g2-g5: move moderat (walk-in detektion)
#   Ghost-flap-alarmen (apollo_ghost_alert.yaml, 40/t) er sikkerhedsnet hvis et
#   mid-field-gate skulle begynde at spøge → push til din telefon → skru gaten op.
#
# Chip-wear (Standing Instruction): hver write value-sammenlignes (skip no-op),
# debounce 2s, kun det ÆNDREDE gate skrives (ikke alle 18). Ingen periodisk fire.
# =============================================================================

