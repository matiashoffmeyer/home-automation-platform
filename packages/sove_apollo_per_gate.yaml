script:
  # Skriv ALLE 18 gates fra sliders → NVRAM (value-compare). Til fresh-install-
  # seed, efter factory_reset_radar, eller manuel re-sync. Kaldes af init +
  # kan køres manuelt. IKKE auto-triggered (chip-wear).
  sove_apollo_apply_all_gates:
    alias: "Sove Apollo: skriv alle 18 gates fra sliders"
    description: >
      Push alle 18 per-gate sliders til sove-Apolloens NVRAM. Value-compare pr.
      gate → kun ægte ændringer skrives (chip-wear-sikkert). Brug efter parring/
      factory_reset eller når sliders er sat via API og NVRAM skal synkes.
    sequence:
      - condition: template
        value_template: "{{ states('binary_sensor.sovevaerelse_apollo_occupancy') != 'unavailable' }}"
      - repeat:
          for_each: [0, 1, 2, 3, 4, 5, 6, 7, 8]
          sequence:
            - variables:
                g: "{{ repeat.item }}"
                still_entity: "number.sovevaerelse_apollo_g{{ repeat.item }}_still_threshold"
                still_target: "{{ states('input_number.sove_g' ~ repeat.item ~ '_still') | float(0) | round(0) | int }}"
                move_entity: "number.sovevaerelse_apollo_g{{ repeat.item }}_move_threshold"
                move_target: "{{ states('input_number.sove_g' ~ repeat.item ~ '_move') | float(0) | round(0) | int }}"
            - if:
                - condition: template
                  value_template: "{{ (states(still_entity) | float(-1)) | round(0) | int != still_target }}"
              then:
                - service: number.set_value
                  continue_on_error: true
                  data:
                    entity_id: "{{ still_entity }}"
                    value: "{{ still_target }}"
            - if:
                - condition: template
                  value_template: "{{ (states(move_entity) | float(-1)) | round(0) | int != move_target }}"
              then:
                - service: number.set_value
                  continue_on_error: true
                  data:
                    entity_id: "{{ move_entity }}"
                    value: "{{ move_target }}"
      - service: logbook.log
        data:
          name: "Sove Apollo per-gate"
          message: "Alle 18 gates synket fra sliders → NVRAM (only-changed)."

automation:
  # Skriv ÉT ændret gate til NVRAM når dets slider ændres. trigger.id =
  # NVRAM-suffix (fx "g2_still_threshold") → target entity afledes direkte.
  - id: sove_apollo_per_gate_write
    alias: "Sove Apollo: per-gate write (slider-driven)"
    description: >
      Skriv det ændrede sove-gate til NVRAM. Value-compare (skip no-op) + 2s
      debounce + not_from unknown/unavailable (undgå HA-restart-fires). Kun det
      ændrede gate skrives → minimal chip-wear.
    mode: queued
    max: 20
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: input_number.sove_g0_still
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g0_still_threshold
      - platform: state
        entity_id: input_number.sove_g1_still
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g1_still_threshold
      - platform: state
        entity_id: input_number.sove_g2_still
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g2_still_threshold
      - platform: state
        entity_id: input_number.sove_g3_still
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g3_still_threshold
      - platform: state
        entity_id: input_number.sove_g4_still
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g4_still_threshold
      - platform: state
        entity_id: input_number.sove_g5_still
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g5_still_threshold
      - platform: state
        entity_id: input_number.sove_g6_still
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g6_still_threshold
      - platform: state
        entity_id: input_number.sove_g7_still
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g7_still_threshold
      - platform: state
        entity_id: input_number.sove_g8_still
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g8_still_threshold
      - platform: state
        entity_id: input_number.sove_g0_move
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g0_move_threshold
      - platform: state
        entity_id: input_number.sove_g1_move
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g1_move_threshold
      - platform: state
        entity_id: input_number.sove_g2_move
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g2_move_threshold
      - platform: state
        entity_id: input_number.sove_g3_move
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g3_move_threshold
      - platform: state
        entity_id: input_number.sove_g4_move
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g4_move_threshold
      - platform: state
        entity_id: input_number.sove_g5_move
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g5_move_threshold
      - platform: state
        entity_id: input_number.sove_g6_move
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g6_move_threshold
      - platform: state
        entity_id: input_number.sove_g7_move
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g7_move_threshold
      - platform: state
        entity_id: input_number.sove_g8_move
        not_from: ["unknown", "unavailable"]
        for: {seconds: 2}
        id: g8_move_threshold
    condition:
      - condition: template
        value_template: "{{ states('binary_sensor.sovevaerelse_apollo_occupancy') != 'unavailable' }}"
    action:
      - variables:
          target: "number.sovevaerelse_apollo_{{ trigger.id }}"
          val: "{{ trigger.to_state.state | float(0) | round(0) | int }}"
      - if:
          - condition: template
            value_template: "{{ (states(target) | float(-1)) | round(0) | int != val }}"
        then:
          - service: number.set_value
            continue_on_error: true
            data:
              entity_id: "{{ target }}"
              value: "{{ val }}"
          - service: logbook.log
            data:
              name: "Sove Apollo per-gate"
              message: "{{ trigger.id }} → {{ val }} (NVRAM skrevet)."
