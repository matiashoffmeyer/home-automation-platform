# =============================================================================
# Natlys sol-gate (2026-06-24, user-spec)
# =============================================================================
# MÅL: auto-tænd af "natlys" (det dæmpede dusk/aften-presence-lys i open-plan +
# bad-natlys) skal KUN ske når solen er reelt nede — ikke i lyse sommer-aftener
# hvor lux tilfældigvis er lav. User: "det er ikke nok nat nu til natlys. så
# natlys i spisestuen burde ikke tænde nu."
#
# ÉN slider styrer tærsklen:
#   input_number.natlys_sol_elevation (default -6° = civil tusmørke-slut):
#     Lys auto-tænder KUN når sun.elevation < tærskel.
#     -18 = astronomisk nat (meget restriktivt, sjældent i DK-sommer)
#       0  = solen under horisonten (gammel adfærd)
#     +10 = også dagslys (effektivt slået fra → lux-gaten bestemmer alene)
#
# Reusable signal:
#   binary_sensor.natlys_sol_under_graense: ON = "mørkt nok til natlys/auto-tænd".
#
# ANVENDELSE (HÅRD sol-gate, user-valg):
#   * OPEN-PLAN (spisestue/sofa/køkken): added som EKSTRA on-condition →
#     lyset auto-tænder slet IKKE når solen er over tærsklen, selv hvis lux er
#     lav (storm/mørke). Manuel tænding virker altid.
#   * BAD: badet SKAL kunne tænde når man går derind (sikkerhed) → her bruges
#     signalet IKKE til at blokere tænd, men til at VÆLGE dæmpet natlys (8% 2000K)
#     vs. normalt sol-baseret lys. Over tærsklen → normalt lys i st.f. natlys.
#
# GOTCHA: i Københavns midsommer dypper solen knap under -6° (kun ~1 t omkring
# sol-midnat) → default -6° gør open-plan natlys MEGET sjælden om sommeren. Det
# er user's bevidste valg (hård gate); hæv slideren hvis du vil have natlys
# tidligere i tusmørket. sun.sun er astronomisk (aldrig unavailable).
#
# -----------------------------------------------------------------------------
# AFTENLYS sol-gate (2026-07-03, user-spec) — SEPARAT fra natlys:
#   User: "natlys soltærskel var designet til at ramme natlys men jeg frygter
#   det rammer aftenlys også (natlys er godnat mode lys). vi kan godt have en
#   aftenlys solgrad også men den skal være separat slider og skal spille
#   sammen med lux. solgrad har veto, lux bekræfter at der er lysbehov."
#
#   PROBLEM: natlys_sol_under_graense (-6°) blev brugt som HÅRD veto på ALT
#   open-plan aften-presence-lys (stue/spisestue/køkken-loft + LUX-fald) — men
#   det er "aftenlys" (normalt aften-presence, blokeret UNDER godnat), ikke
#   natlys (godnat-mode dæmpet lys). -6° over-blokerede aftenlys om sommeren.
#
#   FIX: aftenlys får sin EGEN slider (default -3° = civil tusmørke, mere
#   tilladelig end natlys' -6°). Semantik: sol-gate = VETO (auto-lys tænder KUN
#   når sun.elevation < tærskel), lux = BEKRÆFTER at der faktisk er lysbehov.
#   Veto gælder KUN auto-lys — manuel tænding virker altid.
#   natlys_sol_* beholdes til ægte natlys/godnat-brug (bad-natlys-valg).
#
#   2026-10-16 (S1a, user-valg): aftenlys-slideren (sidst 5°) og
#   binary_sensor.aftenlys_sol_under_graense er FJERNET. Spisestuen mistede
#   gaten 09-04e, sofa-vejene 10-16 — en målt mørk stue blev vetoet af en
#   sol-proxy (≈ 7 min/døgn uden lys). Lux-gaten bestemmer nu alene. Tilbage:
#   git revert af S1a-committen.
# =============================================================================

input_number:
  natlys_sol_elevation:
    name: "Natlys: sol-elevation tærskel"
    icon: mdi:weather-night
    min: -18
    max: 10
    step: 1
    unit_of_measurement: "°"
    mode: slider
    # Ingen `initial:` → persisterer på tværs af restarts. Fresh-install-default
    # (-6) sættes af init_user_preferences; live-default sat via API + snapshot.

  # 2026-07-08 (#6, user-spec): spisestue-loftet auto-tænder UNDER GODNAT KUN ud
  # fra solens position (denne slider), IKKE lux ("og kun det"). Sol under tærskel
  # = mørkt nok til at spisestue-natlyset må tænde. Gælder KUN godnat-grenen i
  # presence_light_stue_on; udenfor godnat bruges den normale lux-gate. Default -6°
  # (civil tusmørke-slut = genuint mørkt) via init + snapshot.
  godnat_spisestue_sol_elevation:
    name: "Godnat spisestue: sol-elevation tærskel"
    icon: mdi:weather-night
    min: -18
    max: 10
    step: 1
    unit_of_measurement: "°"
    mode: slider

template:
  - binary_sensor:
      - name: "Natlys sol under graense"
        unique_id: natlys_sol_under_graense
        icon: mdi:weather-night-partly-cloudy
        state: >-
          {{ (state_attr('sun.sun', 'elevation') | float(90))
             < (states('input_number.natlys_sol_elevation') | float(-6)) }}

      # 2026-07-08 (#6): "må spisestue tænde under godnat?" = KUN sol-position.
      - name: "Godnat spisestue sol under graense"
        unique_id: godnat_spisestue_sol_under_graense
        icon: mdi:weather-night
        state: >-
          {{ (state_attr('sun.sun', 'elevation') | float(90))
             < (states('input_number.godnat_spisestue_sol_elevation') | float(-6)) }}
