# =============================================================================
# House Modes & States
# =============================================================================
#
# MODE (what lifestyle the house operates in):
#   - Normal:        Family life. Presence detection active. All automations.
#   - AirBnB:        Guests staying. No personal tracking. Basic automations.
#   - Home Vacation: Family home but no weekday routines (no wake-ups).
#
# STATE (is anyone physically home right now):
#   - Active:   Someone is home. Full automations.
#   - Dormant:  Nobody home. Lights off, security, energy saving.
#
# GODNAT: Automatic bedtime detection. Activates when the family has
#   settled into bedrooms and nobody is in the common areas.
#
# =============================================================================

input_select:
  house_mode:
    name: "Hus-tilstand"
    icon: mdi:home-variant
    options:
      - Normal
      - AirBnB
      - Home Vacation

  house_state:
    name: "Hus-aktivitet"
    icon: mdi:home-alert
    options:
      - Active
      - Dormant

# =============================================================================
# Helper booleans
# =============================================================================
input_boolean:
  manual_dormant_override:
    name: "Manuel dvale-knap aktiveret"
    icon: mdi:sleep

  parent_a_home:
    name: "Parent A hjemme"
    icon: mdi:account

  parent_b_home:
    name: "Parent B hjemme"
    icon: mdi:account

  cinema_active:
    name: "Cinema Mode aktiv"
    icon: mdi:movie-open

  cirkus_active:
    name: "Cirkus Mode aktiv"
    icon: mdi:ferris-wheel

  godnat_active:
    name: "Godnat aktiv"
    icon: mdi:weather-night
    # Full-house godnat. True when both kids AND adults are in bed.
    # Prevents presence lights from turning on in bedrooms and stue.
    # Auto-clears in the morning or when stue activity resumes.

  godnat_boern_active:
    name: "Børne-godnat aktiv"
    icon: mdi:baby-face-outline
    # Kids' bedtime mode. Activated by somrig_4 (børneværelse button).
    # Prevents auto-light in børneværelse. Adults can still be in stue.

  godnat_voksne_active:
    name: "Voksen-godnat aktiv"
    icon: mdi:human-male-female
    # Adults' bedtime mode. Activated by soveværelse wall button.
    # Dims common areas, closes curtains. When combined with
    # godnat_boern_active, triggers full godnat_active.

  kalde_active:
    name: "Kalde-knap aktiv"
    icon: mdi:weather-night-partly-cloudy
    # Kids pressed the "kalde" button during godnat.
    # Dim red night lights in stue+køkken+soveværelse.
    # Clears when no presence in stue+køkken for 60s.

  godnat_pending:
    name: "Godnat afventer"
    icon: mdi:clock-time-eight-outline
    # Adult godnat button pressed but waiting for common areas to clear.
    # Soveværelse light already off. Full voksen-godnat activates when
    # nobody is outside bedrooms.

  auto_godnat_enabled:
    name: "Auto-godnat aktiveret"
    icon: mdi:weather-night-partly-cloudy
    initial: true
    # Kill-switch for godnat_auto_declare automation. Tilfojet 2026-05-04
    # for at give bruger UI-toggle hvis auto-detection viser false-positives
    # post-flyt. Default ON. Visible i UI (ikke hidden_by user).

  kids_home_manual:
    name: "Børn hjemme (manuel override)"
    icon: mdi:account-child
    # Manual override for binary_sensor.kids_home. Default OFF (lader auto-
    # detection styre). User toggle ON hvis kids er hjemme men Apollo har ikke
    # registreret motion (eg. kid sleeping in bed all day during sygedag).
    # User-spec 2026-05-07: combination C (auto) + D (manual override).

  kids_home_manual_off:
    name: "Børn IKKE hjemme (manuel override)"
    icon: mdi:account-child-outline
    # 2026-06-13 (user-spec): hård override der TVINGER binary_sensor.kids_home
    # = false og overruler auto-detection. Bruges når auto-detektoren tror børn
    # er hjemme men de IKKE er det ("har ikke fuldt kontrol endnu"). Vinder over
    # både auto-signalerne OG kids_home_manual (force-on). Default OFF. Auto-
    # cleares hver fredag 10:00 (kids_home_manual_friday_clear) så en glemt
    # override ikke linger. Prioritet i kids_home-templaten: lige efter AirBnB.

  # 2026-06-18 (user-spec "kræv stærkt signal"): STABILT "barn overnatter hos
  # os"-latch. Den gamle kids_home brugte svage motion-signaler (S1: 15 min,
  # S2: 60 min/4h) der falsk-fyrede på 30-40 min tilfældig VOKSEN-aktivitet i
  # børneværelset om aftenen → natlys tændte 4 dage i træk uden børn. Da I altid
  # har børnene OVERNATTENDE, er "sov her i nat" det pålidelige signal:
  #   - Sættes/ryddes hver morgen 06:30 ud fra sidste nats Apollo-overnight.
  #   - Sættes også af Styrbar-OP-putning (ankomst-aften) + manuel.
  #   - Stabilt hele døgnet (intet midnat-reset-hul som de rå sensorer har).
  # Læses af binary_sensor.kids_home som det primære auto-signal. Se
  # automations/boern_sleep_latch.yaml + packages/activity_state.yaml.
  boern_sov_her_i_nat:
    name: "Barn sov her (overnatter)"
    icon: mdi:bed

  auto_putning_enabled:
    name: "Auto-putning detection aktiveret"
    icon: mdi:bed-clock
    initial: true
    # Kill-switch for putning_auto_detect automation. Default ON. Hvis user
    # ser false-positives (parent's evening shower forveksles med tandbørste),
    # toggle OFF for at falde tilbage til manuel kalde-knap NED.

  puttelys_descent_active:
    name: "Puttelys nedtrapning kører"
    icon: mdi:transition-masked
    # Transient state-flag: ON mens den dynamiske puttelys-nedtrapning
    # (godnat_night.yaml::puttelys_descent) kører de ~20 min fra Apollo-
    # detekteret settled-læsning til 1% natlys. Sættes off igen når
    # godnat_boern_active flippes on (= rummet låst i nat-mode) — se
    # godnat_boern_active_on_actions. Mens den er ON:
    #   - presence_boernevaerelse_on suppres (relighter ikke under nedtrapning)
    #   - putning_auto_detect Trigger A/B suppres (nedtrapningen ejer rummet)
    #   - puttelys_natlys_strip bagkant yielder (nedtrapningen styrer natlys)
    # Ingen initial: (transient). Stuck-on ryddes af godnat_subflag_safety 09:00.

  puttelys_phase1_fired:
    name: "Puttelys fase 1 tændt i aften"
    icon: mdi:weather-night-partly-cloudy
    # Transient state-flag: ON når fase 1-scenen er appliet i aften (uanset
    # kilde: bad-besøg, slider-bagkant eller Styrbar OP). Gater bad-trigger +
    # slider-bagkant så fase 1 ikke re-applies oven i brugerens manuelle
    # justeringer senere på aftenen (2026-06-12: bath-visit slukkede alt i
    # stedet for at tænde fase 1 — nu er bad = tidlig tænd, slider = bagkant).
    # Ingen initial: (transient). Ryddes af godnat_subflag_safety (09:00 +
    # godnat-clear).

  winter_solar_active:
    name: "Vinter sol-opvarmning aktiv"
    icon: mdi:weather-sunny
    # Set to on by winter_solar_gain_open when the south curtain is opened
    # for passive solar heating. Checked by winter_solar_gain_close so it
    # only resets the curtain if solar gain actually opened it (not Somrig).

  entre_somrig_undo_grace:
    name: "Entré Somrig undo-grace"
    icon: mdi:undo-variant
    # Set to on i 10 min efter BUND quick (vi gaar) tryk. Mens den er on,
    # taeller TOP quick som "undo exit" — gendanner lys + gardiner til
    # snapshot taget lige inden sluk_alt. Auto-cleares efter 10 min.
  entre_shutdown_grace:
    name: "Entré nedluknings-grace"
    icon: mdi:power-sleep
    # 2026-06-16 (user-spec): Set ON i 5 min efter entré-Styrbar NED (kort
    # ELLER lang). Mens den er on, blokerer ALLE presence/motion-relight-
    # automationer (hele huset) — så et NED-tryk faktisk slukker alt og holder
    # det slukket mens man går mod døren/sengen, selv hvis bevægelsessensorer
    # fyrer. Auto-cleares efter 5 min af entre_shutdown_grace_clear.
  # NB: diagnostics_explanations_visible toggle slettet 2026-05-17 v2 —
  # forklaringer er nu inline subtekst under hver slider, ingen toggle behov.

input_datetime:
  boernevaerelse_last_off:
    name: "Børneværelse sidst slukket"
    icon: mdi:clock-outline
    has_date: true
    has_time: true
    # Tracks when the kids' room light last turned off.
    # Used by presence_light_boernevaerelse_on for the 10-minute
    # re-entry grace period after the bedtime cutoff.

  hoveddoer_last_open:
    name: "Hoveddør sidst åbnet"
    icon: mdi:door-open
    has_date: true
    has_time: true
    # Tracks when hoveddør was last opened (audit-runde 13, O11 fix).
    # Bruges af security_front_door_opened til "ankomst-detection":
    # kun notify hvis Dormant ELLER >30 min siden sidste aabning.

  boern_loft_left_on_at:
    name: "Børn loft sidst forlod ON-state"
    icon: mdi:lightbulb-off-outline
    has_date: true
    has_time: true
    # Sprint 2026-05-13: tracker til "wall-switch cycle = BRIGHT" mønster.
    # Stamps når light.boernevaerelse_loft leaver "on" state (uanset hvor —
    # automation, Styrbar, wall-switch). Bruges af boern_loft_manual_cycle
    # til at detektere off→on inden for 2-15 sek = manual BRIGHT-signal.

  sove_winddown_at:
    name: "Sove winddown sidst startet"
    icon: mdi:bed-clock
    has_date: true
    has_time: true
    # Sprint 2026-05-27: stamped af Somrig kort-ned (godnat_voksen_start).
    # entre_motion_night læser denne — entre nightlight dæmpes til 5%
    # (vs default 10%) i 8h efter winddown så gang-lyset ikke skinner ind
    # i sove. Cleared (set til epoch) af alle godmorgen-handlere.

  godnat_force_at:
    name: "Godnat force sidst aktiveret"
    icon: mdi:bed-double
    has_date: true
    has_time: true
    # Sprint 2026-05-27: stamped af Somrig lang-ned (godnat_force).
    # entre_motion_night blokeres helt i 30 min efter long-press = "fuld
    # ro nu" semantik. Efter 30 min falder vi tilbage til 5% nightlight
    # via godnat_any_active path. Cleared af godmorgen-handlere.

  bathroom_last_notification:
    name: "Bath sidste klima-notification"
    icon: mdi:water-alert
    has_date: true
    has_time: true
    # O17 fix audit-runde 17: tracks last bathroom climate notification
    # (humidity_high eller post_shower) saa de ikke dobbelt-notify samme shower.
    # Begge automations stamper denne ved fyring, og checker den i condition.

input_number:
  physical_activity_sustain_seconds:
    name: "Aktivitet: sekunder før en radar-flanke tæller som bevægelse"
    icon: mdi:motion-sensor
    min: 0
    max: 120
    step: 1
    unit_of_measurement: "s"
    mode: slider
    # 2026-08-08: sensor.last_physical_activity stemplede før på ENHVER
    # occupancy-transition — også trailing OFF-flanker (= sensoren gav op, det
    # modsatte af aktivitet) og mikro-blips. Målt 08-08: et 5 sek. køkken-blip
    # i et tomt hus nulstillede hele 70-min idle-uret. Nu kræves en ON-flanke
    # der HOLDER så mange sekunder. Kalibreret på 4446 on-forløb over 10 dage:
    # <5 s = 0,7 %, <8 s = 8,3 %, <12 s = 16,8 %. PIR'erne (entré/depot/bad)
    # rapporterer ALDRIG under 20 s (0 af 866 entré-forløb) → en afgang mister
    # aldrig sit anker, og dør-events stempler uanset. 0 = slået fra.

  # 2026-09-11 (B128): ANDEN, LÆNGERE tier af samme spørgsmål. De to slidere
  # svarer IKKE på det samme, og det er derfor de begge findes (ikke #2):
  #   • physical_activity_sustain_seconds (12 s) = "RØRTE nogen huset?" Fin-kornet,
  #     driver 3t-vinduerne + physical_presence_recent. Må IKKE hæves — en kort
  #     ægte bevægelse skal stadig tælle som liv i huset.
  #   • sustained_presence_seconds (denne) = "var nogen HER?" Driver kun de LANGE
  #     dvale-gates, hvor et spøgelse ikke må kunne nulstille 90 minutters bevis.
  #
  # MÅLT 09-11 med lejligheden beviseligt tom siden 10:16 (gæsterne gik: dør
  # 10:13:58 + 10:15:57, entré-VALLHORN off 10:16:32, og INGEN anden kanal rørte
  # sig i de 4,3 t derefter): stue-Apolloen leverede alligevel 52
  # occupancy-episoder — p50 11 s, p90 47 s, **max 95 s, nul over 120 s**.
  # Samme kanal i det BEBOEDE vindue 06:00-10:13 samme morgen: 45 episoder,
  # p50 61 s, max 1143 s, **12 episoder over 120 s**. 120 s ligger derfor i et
  # rent hul med 25 s margin ned til spøgelserne, og et beboet rum krydser
  # tærsklen ca. hvert 20. minut.
  # Raten er KRONISK, ikke en regression: 63-230 episoder/døgn i alle 10 målte
  # døgn. stue_apollo_ghost.yaml's 13 s-filter fanger dem ikke, fordi
  # hurtig-vejen (moving_target, delay_off 20 s) med vilje er øjeblikkelig — den
  # må ikke bremses, ellers kommer lyset for sent når man går ind i stuen.
  # Spøgelserne skal altså ikke filtreres HÅRDERE ved kilden; de skal bare ikke
  # kunne nulstille et 90-minutters ur. 0 = slået fra (falder tilbage til
  # physical_activity_sustain_seconds' opførsel).
  sustained_presence_seconds:
    name: "Dvale: sekunder en presence-flanke skal HOLDE for at nulstille dvale-uret"
    icon: mdi:timer-sand
    min: 0
    max: 600
    step: 10
    unit_of_measurement: "s"
    mode: slider

# =============================================================================
# Template sensors
# =============================================================================
template:
  - binary_sensor:
      - name: "Nogen hjemme"
        unique_id: anyone_home
        icon: mdi:home-account
        state: >
          {{ is_state('input_boolean.parent_a_home', 'on')
             or is_state('input_boolean.parent_b_home', 'on') }}

      # B3.1 fix audit-runde 16: "Familie-tilstand" slettet — ubrugt template_sensor
      # genererede 364 changes/dag uden brugte. Hvis du senere skal bruge
      # "is family-mode active" check, brug inline:
      # {{ states('input_select.house_mode') in ['Normal', 'Home Vacation'] }}

      - name: "Arbejdsdag"
        unique_id: is_work_day
        icon: mdi:briefcase
        # H2 fix: bruger HA workday-integration der respekterer danske
        # helligdage (jul, paaske, kristi himmelfart, etc).
        # M12 fix (audit-runde 5): fallback til rent isoweekday hvis
        # workday-integration er unavailable (ikke installed endnu, eller
        # midlertidigt nede). Forhindrer at familien oversove naar
        # integrationen mangler.
        state: >
          {% set ws = states('binary_sensor.workday_sensor') %}
          {{ states('input_select.house_mode') == 'Normal'
             and (
               ws == 'on'
               or (ws in ['unknown','unavailable','none']
                   and now().isoweekday() <= 5)
             ) }}

      # 2026-06-02 (user-spec): fysisk presence = suverænt HJEMME-signal.
      # ON hvis nogen occupancy/dør-sensor lavede on/off-transition ELLER en
      # knap blev trykket indenfor 3t (via sensor.last_physical_activity).
      # Transition-baseret → en stuck-on sensor tæller IKKE (ingen ny transition,
      # falder ud af 3t-vinduet). Bruges som VETO i alle Dormant-paths +
      # wake-trigger til Active. now() i template → re-evalueres hvert minut.
      - name: "Physical presence recent"
        unique_id: physical_presence_recent
        icon: mdi:motion-sensor
        state: >
          {# (a) Nogen occupancy-sensor ER on lige nu = ægte tilstedeværelse.
             Håndterer stille/sovende person hvor Apollo holder "on" uden nye
             transitions. Døre tæller IKKE her (åben dør != presence) — kun som
             transition i last_physical_activity.

             LÅS-MASKE (2026-08-06): en Apollo hvis gate ligger under rummets
             støjgulv hænger permanent "on" og ville veto'e ALLE fire Dormant-
             veje for evigt (incident: stue låst 08-04 → huset Active i 6 døgn).
             Det gamle værn her var `last_changed < 24 t` — men last_changed
             NULSTILLES ved hver HA-restart, og restarts sker oftere end hver
             24. time, så værnet kunne aldrig udløse. Låse identificeres nu i
             packages/apollo_latch_detect.yaml på et SKREVET stempel (restart-
             sikkert) + "alle er ude", og maskeres per rum. Gren (b) nedenfor er
             transitions-baseret og derfor allerede lås-immun — sover nogen reelt
             i et andet rum, holder DEN sensor gren (a) oppe.
             De tre ikke-Apollo-sensorer har tom rum-slug = maskeres ikke her:
             badet maskes ved KILDEN (`occupancy_stuck_on_minutes` i unionen) og
             entré-VALLHORN'en af sin egen hængt-watchdog. Depot-VALLHORN'en er
             det udækkede hjørne — den har aldrig hængt, men har heller ingen
             beskyttelse. #}
          {% set laaste = state_attr('binary_sensor.apollo_occupancy_laast',
                                     'laaste_rum') | default('', true) %}
          {% set laaste = [] if laaste in ['unknown', 'unavailable', 'none', '']
                          else laaste.split(',') %}
          {% set occ = [
            ('binary_sensor.stue_apollo_occupancy_filtered', 'stue'),
            ('binary_sensor.spisestue_apollo_occupancy_filtered', 'spisestue'),
            ('binary_sensor.koekken_apollo_occupancy_filtered', 'koekken'),
            ('binary_sensor.badevaerelse_inde_occupancy', ''),
            ('binary_sensor.sovevaerelse_apollo_occupancy', 'sovevaerelse'),
            ('binary_sensor.boernevaerelse_apollo_occupancy', 'boernevaerelse'),
            ('binary_sensor.depot_valhorn_occupancy', ''),
            ('binary_sensor.entre_valhorn_occupancy', '')
          ] %}
          {% set ns = namespace(present=false) %}
          {% for s, room in occ %}
            {% if is_state(s, 'on') and not (room != '' and room in laaste) %}
              {% set ns.present = true %}
            {% endif %}
          {% endfor %}
          {# (b) ELLER fysisk aktivitet (sensor-transition eller knap-tryk) <3t #}
          {% set t = states('sensor.last_physical_activity') %}
          {% set recent = t not in ['unknown', 'unavailable', 'none', '']
                          and (now() - as_datetime(t)) < timedelta(hours=3) %}
          {{ ns.present or recent }}

      # 2026-08-15c: BREDDE-KVALIFICERET presence — vetoet på Dormant-vejene.
      #
      # `physical_presence_recent` ovenfor kan holdes oppe af ÉN fantomerende
      # radar. Målt 08-15 i et beviseligt tomt hus: soveværelsets Apollo fyrede
      # 9 korte udslag (sydvendt vindue, eftermiddagssol, robot dokket, gardin
      # urørt), hvert udslag friskede `last_physical_activity`s 3t-vindue, og
      # sensoren stod derfor ON gennem hele et 5 timers fravær. Huset havde da
      # ikke været Dormant siden 08-11.
      #
      # Det der skiller et menneske fra en fantom er BREDDEN: en person der
      # opholder sig her i halvanden time rører mere end ét rum, eller åbner en
      # dør. En fantom rører præcis ét rum og rører aldrig en dør. Tonight's
      # fantom: 1 rum aktivt, de øvrige 7 tavse i fem timer, nul dør-flanker.
      #
      # Dette er en MASKE, ikke en reparation — samme rollefordeling som
      # apollo_latch_detect.yaml's "TO UDGANGE". Reparationen er flap-jagten,
      # som nu kan køre i et tomt hus (se apollo_flap_hunt.yaml).
      #
      # ⚠️ Brug den KUN som Dormant-veto. Lys-/komfort-logik skal blive på
      # `physical_presence_recent`: dér er en enkelt sensors udslag den rigtige
      # grund til at reagere, og prisen for en fejl er et tændt lys — ikke et
      # hus der slukker alt omkring en der sidder stille.
      - name: "Physical presence credible"
        unique_id: physical_presence_credible
        icon: mdi:motion-sensor-off
        state: >
          {% if not is_state('binary_sensor.physical_presence_recent', 'on') %}
            false
          {% else %}
            {% set vindue = 5400 %}
            {% from 'rosters.jinja' import husets_occupancy %}{% set rum = husets_occupancy
              %}
            {% set ns = namespace(aktive=0, doer=false) %}
            {% for s in rum %}
              {% if is_state(s, 'on')
                    or (states[s] is not none
                        and (now() - states[s].last_changed).total_seconds() < vindue) %}
                {% set ns.aktive = ns.aktive + 1 %}
              {% endif %}
            {% endfor %}
            {# En dør er et ikke-radar-vidne: den kan ikke fantomere, så én
               dør-flanke alene gør beviset troværdigt igen. #}
            {% for d in ['binary_sensor.parasoll_hoveddoer',
                         'binary_sensor.parasoll_terrassedoer'] %}
              {% if states[d] is not none
                    and (now() - states[d].last_changed).total_seconds() < vindue %}
                {% set ns.doer = true %}
              {% endif %}
            {% endfor %}
            {# last_changed nulstilles ved HA-restart (#5) → efter en restart
               tæller alle rum som "rørt" og sensoren følger simpelthen
               physical_presence_recent. Den rigtige retning at fejle i. #}
            {{ ns.aktive >= 2 or ns.doer }}
          {% endif %}

      # 2026-08-17b: KORTVINDUET af samme bevis — vetoet på de to 30-min-veje.
      #
      # `physical_presence_credible` ovenfor er bygget til 3t-vejene: dens
      # ydre gate ER `physical_presence_recent`, altså "aktivitet inden for
      # 3 timer". Den kan derfor pr. konstruktion ALDRIG være `off` 30 minutter
      # efter en afgang — folk bevæger sig lige til de går ud ad døren. De to
      # veje der hedder "fast" og fyrer på `for: 30 minutes` har derfor aldrig
      # kunnet komme igennem: målt 2026-08-17 har
      # `hus_skift_til_dormant_gps_fast_1km_30_min` **last_triggered = None**
      # i hele sin levetid, og flag-fast fyrede sidst 2026-06-03 — dagen efter
      # 3t-gaten blev sat på. De var dekoration; 3t-vejen nåede altid først.
      #
      # BREDDE-kravet arves BEVIDST IKKE. Breddens præmis er at et menneske
      # rører mere end ét rum — sandt over halvanden time, falsk over et
      # kvarter: en der ser fjernsyn rører præcis ét rum, og "≥2 rum inden for
      # 15 min" ville altså dømme ham fraværende og slukke lyset omkring ham.
      # Præcis det scenarie `physical_presence_credible` selv advarer imod.
      # På kort sigt er ét rum der er ON LIGE NU stærkt bevis, ikke svagt.
      #
      # Fantom-forsvaret på denne tidsskala er ikke bredde, men GENTAGELSE:
      # flag-fast har fået en /10-backstop, så et enkelt fantom-udslag kun
      # udskyder dvalen ét tick i stedet for at aflyse hele afgangen (#4).
      # Målt 08-15 fyrede sove-fantomet hvert ~23. minut — der er huller nok.
      # 3t-vejene beholder bredde-kravet, hvor præmissen holder.
      #
      # 2026-08-21: den præmis holdt IKKE. Målt i et beviseligt tomt hus
      # 07:25-09:42 fyrede rosteret 45 gange = én flanke hvert 3,1. minut mod
      # et vindue på 15 — der var ingen huller overhovedet, og huset stod
      # Active i over to timer. "Der er huller nok" er ikke en egenskab ved
      # designet, det er en måling der kan rådne, og den rådnede da xray
      # åbnede gates og robotten kørte. Svaret er givet ved KILDEN, ikke her:
      # soveværelset (22 af de 45) fik sit første spøgelsesfilter
      # (`sovevaerelse_dvale_vidne`, 150 s hold), og stuens filter (13) blev
      # repareret — det sendte flere flanker ud end ind. Rør ikke denne
      # sensors tidsvindue for at kompensere for et støjende rum; find rummets
      # egen diskriminator i stedet.
      #
      # ROBOT-MASKE (2026-08-21b, REVIDERER noten herunder): afgangs-dvalen
      # armer sit stilhedsvindue forfra under masken, denne sensor gjorde ikke —
      # samme regel, to steder, divergeret (#2). Målt i det tomme hus faldt
      # **8 af de 15 resterende flanker** i robottens to kørsler (08:33 +27 min,
      # 09:18 +28 min), og hver af dem holdt vinduet i live længe efter rummet
      # var OFF igen.
      # Masken slår derfor kun HUKOMMELSES-grenen fra ("rørt inden for vinduet"),
      # ALDRIG "ON lige nu". Et menneske der sidder stille tæller stadig som
      # vidne, for hans rum står ON — det er kun robottens efterladte flanker der
      # holder op med at tale. Ingen residual-logik nødvendig: maskens delay_off
      # er 20 min > vinduets 15, så når masken falder, ligger alle maskerede
      # flanker allerede uden for vinduet.
      # Retningen er stadig sikker fordi begge forbrugere ovenikøbet kræver
      # BEGGE voksne GPS-væk; masken kan altså ikke alene erklære dvale.
      #
      # (Den oprindelige note lød: "Ingen Roborock-maske: kører robotten, holder
      # den rummene ON og veto'er, og backstoppen leverer ~15 min efter den er
      # dokket." — det var sandt så længe robotten holdt rummene UAFBRUDT ON.
      # Det gør den ikke: målt varighed pr. udslag 14-376 s inde i 27-min
      # kørsler, altså masser af huller hvor kun hukommelsen veto'ede.)
      # Låse-maskeringen arves fra apollo_latch_detect, ellers ville en hængt
      # Apollo veto'e for evigt.
      #
      # ⚠️ Kun til 30-min-vejene. 3t-vejene skal blive på
      # `physical_presence_credible` — dér er det lange vindue meningen.
      - name: "Physical presence credible fast"
        unique_id: physical_presence_credible_fast
        icon: mdi:motion-sensor-off
        state: >
          {% set vindue = 60 * (states('input_number.house_dormant_departure_minutes') | int(15)) %}
          {% set laaste = state_attr('binary_sensor.apollo_occupancy_laast',
                                     'laaste_rum') | default('', true) %}
          {% set laaste = [] if laaste in ['unknown', 'unavailable', 'none', '']
                          else laaste.split(',') %}
          {# 3. kolonne = separat sensor til HUKOMMELSES-grenen ('' = brug samme).
             2026-08-29 (B105): køkkenet er husets støjende rum — 6826 ON-episoder
             på 3 døgn, p50 = 4,2 s ≈ radar-timeouten. Der opstod ALDRIG et 15-min
             hul, så køkkenet holdt denne sensor permanent ON og dræbte begge
             30-min-veje (målt: tomt hus 09:35-12:25, alle andre rum 1637-1660 s
             stille, køkkenet 228 s). `koekken_dvale_vidne` kræver 30 s ubrudt
             hold; 1075 målte spøgelses-episoder nåede aldrig 30 s, hvert
             menneske-ophold nåede det 9-17 gange.
             KUN hukommelsen læser vidnet — "ON lige nu" er stadig den rå
             filtrerede sensor, så et menneske der netop er trådt ind i køkkenet
             ikke er usynligt i de 30 s vidnet venter. #}
          {% set rum = [
            ('binary_sensor.stue_apollo_occupancy_filtered', 'stue', ''),
            ('binary_sensor.spisestue_apollo_occupancy_filtered', 'spisestue', ''),
            ('binary_sensor.koekken_apollo_occupancy_filtered', 'koekken',
             'binary_sensor.koekken_dvale_vidne'),
            ('binary_sensor.badevaerelse_inde_occupancy', '', ''),
            ('binary_sensor.sovevaerelse_dvale_vidne', 'sovevaerelse', ''),
            ('binary_sensor.boernevaerelse_apollo_occupancy', 'boernevaerelse', ''),
            ('binary_sensor.depot_valhorn_occupancy', '', ''),
            ('binary_sensor.entre_valhorn_occupancy', '', '')
          ] %}
          {% set robot = is_state('binary_sensor.roborock_zone_maskering', 'on') %}
          {% set ns = namespace(vidne=false) %}
          {% for s, room, hukommelse in rum %}
            {% set mem = hukommelse if hukommelse != '' else s %}
            {% if not (room != '' and room in laaste)
                  and states[s] is not none
                  and (is_state(s, 'on')
                       or (not robot
                           and states[mem] is not none
                           and (now() - states[mem].last_changed).total_seconds() < vindue)) %}
              {% set ns.vidne = true %}
            {% endif %}
          {% endfor %}
          {% for d in ['binary_sensor.parasoll_hoveddoer',
                       'binary_sensor.parasoll_terrassedoer'] %}
            {% if states[d] is not none
                  and (now() - states[d].last_changed).total_seconds() < vindue %}
              {% set ns.vidne = true %}
            {% endif %}
          {% endfor %}
          {# last_changed nulstilles ved HA-restart (#5) → i vinduet efter en
             restart tæller alle rum som rørt = veto. Backstoppen tager den. #}
          {{ ns.vidne }}

      # B3.1 fix audit-runde 16: "Hus aktivt" slettet — ubrugt template_sensor
      # genererede 403 changes/dag uden brugte. Hvis du senere skal bruge
      # "house active in normal/vacation mode" check, brug inline conditions
      # paa input_select.house_state + input_select.house_mode.

  # Trigger-baseret timestamp for SENESTE fysiske aktivitet (vedvarende occupancy
  # -ON, dør-transition eller knap-tryk). Driver binary_sensor.physical_presence_recent
  # OG idle-uret i dormant_idle.yaml + weekend-stearinlyset i dormant_schedule.yaml.
  # Stuck-proof: en sensor der hænger "on" laver ingen ny ON-flanke → falder ud
  # af 3t-vinduet. HA-start sætter now() (= Active i 3t efter restart; sikkert).
  #
  # 2026-08-08: KUN ON-flanken tæller, og kun hvis den holder
  # physical_activity_sustain_seconds. En trailing OFF-flanke er sensoren der
  # GIVER OP — det modsatte af aktivitet — men stemplede før som aktivitet og
  # skubbede idle-uret 14 min frem ved hver afgang. Og et 5-sekunders blip i et
  # tomt hus nulstillede hele uret (målt 08-08 kl. 16:08 → dormant først 17:18).
  - trigger:
      # Occupancy/motion-sensorer: ID'et så de kan filtreres mens Roborock
      # kører (robottens egen bevægelse trigger radar+PIR — må ikke tælle
      # som menneskelig aktivitet, 2026-06-12).
      - platform: state
        id: occupancy
        entity_id: !include ../rosters/husets_occupancy.yaml
        from: "off"
        to: "on"
        for:
          seconds: "{{ [states('input_number.physical_activity_sustain_seconds') | int(12), 0] | max }}"
      # Døre kan robotten ikke åbne → aldrig filtreret.
      - platform: state
        entity_id:
          - binary_sensor.parasoll_hoveddoer
          - binary_sensor.parasoll_terrassedoer
        to: ["on", "off"]
      - platform: state
        entity_id: !include ../rosters/styrbar_sidste_tryk.yaml
      - platform: homeassistant
        event: start
    condition:
      # 2026-06-12: Roborock i bevægelse ses af radar/PIR. Occupancy-triggers
      # ignoreres mens robotten kører/returnerer — knapper, døre og HA-start
      # bumper stadig (robot kan ikke åbne døre eller trykke knapper).
      # Post-dock 15-min vindue: radar-occupancy hænger 'on' efter robotten
      # docker, så en flanke der modnes efter dokningen ville ellers bumpe
      # sensoren (vacuum er docked når den kommer) → falsk Active.
      - condition: template
        value_template: >-
          {% set vac = states('vacuum.s8_maxv_ultra') %}
          {% set dock_age = (now() - states.vacuum.s8_maxv_ultra.last_changed).total_seconds() if states.vacuum.s8_maxv_ultra else 99999 %}
          {{ (trigger.id | default('') if trigger is defined else '') != 'occupancy'
             or (vac not in ['cleaning', 'returning']
                 and not (vac == 'docked' and dock_age < 900)) }}
    sensor:
      - name: "Last physical activity"
        unique_id: last_physical_activity
        device_class: timestamp
        state: "{{ now().isoformat() }}"

  # ---------------------------------------------------------------------------
  # 2026-09-11 (B128): samme idé som ovenfor, men med den LANGE tier —
  # "hvornår var nogen sidst HER?" i modsætning til "rørte nogen huset?".
  # ---------------------------------------------------------------------------
  # HVORFOR EN EGEN SENSOR OG IKKE EN HÆVET SLIDER PÅ SØSTEREN: sustain 12 s er
  # kalibreret til 3t-vinduerne og physical_presence_recent, og en hævning dér
  # ville gøre hele huset (også Normal-mode) blind for korte ægte bevægelser.
  # Tvivl om ét rums spøgelser må ikke gates husdækkende (09-09d). Derfor en
  # parallel tier med eget scope: KUN de lange dvale-gates læser denne.
  #
  # HVORFOR DEN ER NØDVENDIG: `house_airbnb_to_dormant` målte før stilhed som
  # "hver levende kanals last_changed >= 90 min". Det er et krav om 90 minutter
  # med NUL flanker på en radar-kanal — og stue-Apolloen leverer en
  # spøgelses-flanke hvert ~5. minut i et beviseligt tomt hus. Målt 09-11:
  # længste stille-vindue på kanalen var **16,4 min** mod kravet på 90, så gaten
  # var **uopfyldelig pr. konstruktion** og huset stod Active i 21,6 t med tom
  # lejlighed. Søster-fejl til #14: dér kan `last_changed` ikke BEVISE sustained
  # på en analog — her kan et 1-sekunds blip SLETTE 90 minutters bevis på en
  # binær.
  #
  # Roborock-filteret er identisk med søsterens ovenfor og skal rettes i BEGGE
  # (#2) — robottens egen bevægelse ses af radar+PIR og er ikke et menneske.
  # Dør- og knap-triggers filtreres bevidst ikke: robotten kan hverken åbne en
  # dør eller trykke på en Styrbar.
  #
  # HA-start stempler now(): sensoren restorer ikke, og uden et startværdi ville
  # gaten fail-close for evigt (`unknown`). Prisen er at huset tidligst kan gå
  # Dormant 90 min efter en restart — fejl-retningen "lyset bliver stående".
  - trigger:
      # Roster-fingerprint: spisestue_apollo_occupancy_filtered. Husets
      # kanoniske 8-sensor-occupancy-roster — samme liste som søsteren ovenfor,
      # `house_airbnb_to_dormant` og physical_presence_*-templatene (#16).
      - platform: state
        id: occupancy
        entity_id: !include ../rosters/husets_occupancy.yaml
        from: "off"
        to: "on"
        for:
          seconds: >-
            {{ [states('input_number.sustained_presence_seconds') | int(120),
                states('input_number.physical_activity_sustain_seconds') | int(12)] | max }}
      # En dør-passage er bevis på at et menneske var fysisk til stede, og
      # robotten kan ikke åbne den. B120 forkastede dør-luk som KRAV (en dør
      # melder en passage, ikke en retning) — men som AKTIVITET er den gyldig.
      - platform: state
        entity_id:
          - binary_sensor.parasoll_hoveddoer
          - binary_sensor.parasoll_terrassedoer
        to: ["on", "off"]
      - platform: state
        entity_id: !include ../rosters/styrbar_sidste_tryk.yaml
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >-
          {% set vac = states('vacuum.s8_maxv_ultra') %}
          {% set dock_age = (now() - states.vacuum.s8_maxv_ultra.last_changed).total_seconds() if states.vacuum.s8_maxv_ultra else 99999 %}
          {{ (trigger.id | default('') if trigger is defined else '') != 'occupancy'
             or (vac not in ['cleaning', 'returning']
                 and not (vac == 'docked' and dock_age < 900)) }}
    sensor:
      - name: "Last sustained presence"
        unique_id: last_sustained_presence
        device_class: timestamp
        state: "{{ now().isoformat() }}"


# =============================================================================
# Scripts
# =============================================================================
script:
  # ---------------------------------------------------------------------------
  # 2026-09-09d (B124): AirBnB-Dormants sluk-sweep PR. RUM — ét sted.
  # ---------------------------------------------------------------------------
  # Kaldes af `house_airbnb_to_dormant` (sensor-vejen) OG af
  # `airbnb_checkin_prep_dormant` (knappen, packages/airbnb_checkin_prep.yaml).
  # Den bor i et script og ikke som kopieret action-blok, fordi to kopier af
  # samme regel divergerer (fejlklasse #2) — og netop denne regel er hele
  # pointen med B124.
  #
  # HVORFOR PR. RUM: gate-templaten i `house_airbnb_to_dormant` SPRINGER døde
  # kanaler OVER — den kræver kun at 4 af 8 sensorer er i live, og at de levende
  # er rolige. En Apollo der er faldet af nettet er derfor ikke et "ved ikke",
  # men en stemme der tæller som fravær (fejlklasse #9). Under gæsteopholdet
  # 09-05..09-09 stod soveværelset `unavailable` i 58,9 t og køkken+spisestue i
  # 2,2 t, mens gaten stadig blev sand på de resterende rum. `light.turn_off` på
  # `entity_id: all` med en blind kanal kan slukke lyset på en gæst der ligger
  # og læser.
  #
  # FØRSTE FORSØG VAR EN GLOBAL BLOKADE — og den var forkert. User:
  # "den løsning du har lavet frygter jeg betyder at lys brænder i tydeligt
  # tomme rum ... hvis Apolloer er blinde er lyset i rummet slukket manuelt på
  # væggen. Det er samme kontakter." Replay af de 31 Dormant-overgange
  # 09-05..09-09 gav ham ret: 19 blev blokeret, og i **7** af dem brændte der
  # lys i et rum hvis EGEN kanal var levende og havde været rolig i 90 min
  # (5× alle fem badespots, 2× køkkenet, 1× stuen). Kun **2** havde lys tændt i
  # et BLINDT rum — begge gange den samme lampe, `spisestue_loft`. Blokaden
  # kostede altså 7 korrekte sweeps for at beskytte 1 lampe.
  #
  # RETTE SNIT: fred kun DET rum hvis kanal er blind. Users vægkontakt-fakta er
  # grunden til at det næsten er gratis — dør Apolloen fordi kontakten er slået
  # fra, ryger rummets lys `unavailable` med den (målt for køkkenet 09-07 00:19,
  # 09-08 20:44 og 09-09 06:01: `koekken_room` + `koekken_lyskaede` fulgte inden
  # for 20 min), og HA springer selv `unavailable` entities over i service-kald.
  # De tre udfald er:
  #   • kanal levende            → sluk rummet (normal drift)
  #   • kanal blind + lys dødt   → intet at gøre, HA filtrerer dem selv fra
  #   • kanal blind + lys VÅGENT → ægte tvivl (Apolloen døde af noget andet end
  #                                kontakten) → fred rummet
  # Fejlretningen er husets egen: hellere lys der bliver stående i det ene
  # tvivlsomme rum end lys der slukkes på nogen. Søsteren
  # `airbnb_no_presence_60min_off` fejler allerede sikkert, fordi den kræver
  # literal `off` og `unavailable` ikke er `off` (#2, modsat retning).
  #
  # Målet bygges af `states.light` og ikke af et roster, så en NY lampe slukkes
  # automatisk som før (fejlklasse #16 peger den ufarlige vej: et hul i kortet
  # betyder "slukket som i dag", ikke "glemt"). Gruppe-entities sorteres fra på
  # `attributes.entity_id`/`group_entities` — ellers ville `light.alle_indvendige`
  # slukke et fredet rums lampe bagom kortet, og `light.zbt_2_vejrvarsel_*`
  # (ægte ZHA-grupper) groupcaste det samme.
  # ---------------------------------------------------------------------------
  airbnb_dormant_lys_sweep:
    alias: "AirBnB: Dormant-sluk pr. rum (fred blinde kanaler)"
    icon: mdi:lightbulb-group-off
    mode: single
    fields:
      transition:
        description: "Fade-tid i sekunder"
        default: 15
        selector: {number: {min: 0, max: 60}}
    sequence:
      - variables:
          # Kanal → rummets FYSISKE lys. Kun til at FREDE med; alt udenfor
          # kortet slukkes som hidtil.
          kort:
            binary_sensor.stue_apollo_occupancy_filtered:
              - light.stue_sofa_lampe
              - light.stue_sofa_lampe_2
              - light.stue_hjoernelampe
              - light.stue_plug
              - light.stue_laesehygge
              - light.stue_apollo_rgb_light
            binary_sensor.spisestue_apollo_occupancy_filtered:
              - light.spisestue_loft
              - light.spisestue_apollo_rgb_light
            binary_sensor.koekken_apollo_occupancy_filtered:
              - light.koekken_room
              - light.koekken_lyskaede
              - light.koekken_apollo_rgb_light
            binary_sensor.badevaerelse_inde_occupancy: !include ../rosters/bad_spots.yaml
            # entity_id'et er en forældet alias-slug: `light.spisestue_pendel`
            # ER soveværelsets loft (flyttet 2026-06-05). Den hører derfor til
            # sove-kanalen — og sove-Apolloen er netop den der oftest er blind,
            # så en forkert placering ville slukke den lampe gæsten læser i.
            binary_sensor.sovevaerelse_apollo_occupancy: !include ../rosters/sove_lys.yaml
            binary_sensor.boernevaerelse_apollo_occupancy:
              - light.boernevaerelse_loft
              - light.boernevaerelse_lampe
              - light.boernevaerelse_hygge_strip
              - light.boernevaerelse_hyggelys
              - light.boernevaerelse_apollo_rgb_light
            binary_sensor.depot_valhorn_occupancy:
              - light.depot_loft_ikea
              - light.depot_loft_hue_1
              - light.depot_loft_hue_2
              - light.depot_strip
            binary_sensor.entre_valhorn_occupancy:
              - light.entre_loft
              - light.entre_loft_tradfri_udgaaet
          # Bevidst KOMMA-STRENGE, ikke lister. En `variables:` der renderer en
          # list-literal afhænger af HA's `parse_result`-literal_eval for at
          # blive en ægte liste igen; slår den fejl, bliver `| count` til et
          # TEGN-tal og `reject('in', ...)` til substring-match — begge fejler
          # tavst og forkert. `cv.entity_ids` splitter selv en komma-streng.
          # Derfor beregnes `fredet` som ægte liste INDE i samme template som
          # bruger den, ikke som en variabel der skal krydse en parse-grænse.
          maal: >-
            {% set ns = namespace(f=[]) %}
            {% for kanal, lys in kort.items() %}
              {% if states(kanal) in ['unavailable', 'unknown', 'None'] %}
                {% set ns.f = ns.f + lys %}
              {% endif %}
            {% endfor %}
            {{ states.light
               | selectattr('state', 'eq', 'on')
               | rejectattr('attributes.entity_id', 'defined')
               | rejectattr('attributes.group_entities', 'defined')
               | map(attribute='entity_id')
               | reject('in', ns.f)
               | join(',') }}
          blinde_rum: >-
            {% set navne = {'binary_sensor.stue_apollo_occupancy_filtered': 'stue',
                            'binary_sensor.spisestue_apollo_occupancy_filtered': 'spisestue',
                            'binary_sensor.koekken_apollo_occupancy_filtered': 'køkken',
                            'binary_sensor.badevaerelse_inde_occupancy': 'bad',
                            'binary_sensor.sovevaerelse_apollo_occupancy': 'soveværelse',
                            'binary_sensor.boernevaerelse_apollo_occupancy': 'børneværelse',
                            'binary_sensor.depot_valhorn_occupancy': 'depot',
                            'binary_sensor.entre_valhorn_occupancy': 'entré'} %}
            {% set ns = namespace(d=[]) %}
            {% for kanal, navn in navne.items() %}
              {% if states(kanal) in ['unavailable', 'unknown', 'None'] %}
                {% set ns.d = ns.d + [navn] %}
              {% endif %}
            {% endfor %}
            {{ ns.d | join(', ') }}
      - if:
          - condition: template
            value_template: "{{ maal | trim != '' }}"
        then:
          - service: light.turn_off
            target:
              entity_id: "{{ maal | trim }}"
            data:
              transition: "{{ transition | default(15) | int(15) }}"
      - if:
          - condition: template
            value_template: "{{ blinde_rum | trim != '' }}"
        then:
          - service: logbook.log
            data:
              name: "AirBnB-Dormant"
              message: >-
                Sluk-sweep kørte pr. rum. Fredet (blind kanal):
                {{ blinde_rum | trim }}. Slukket:
                {{ maal | trim if maal | trim else 'ingenting' }}.
              entity_id: input_select.house_state


# =============================================================================
# Automations
# =============================================================================
automation:
  # --- Go ACTIVE when presence detected ---
  - id: house_state_to_active
    alias: "Hus: Skift til Active"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.parent_a_home
        to: "on"
      - platform: state
        entity_id: input_boolean.parent_b_home
        to: "on"
      - platform: state
        id: occupancy
        entity_id:
          - binary_sensor.stue_apollo_occupancy_filtered  # PLACEHOLDER
          - binary_sensor.spisestue_apollo_occupancy_filtered  # PLACEHOLDER
          - binary_sensor.koekken_apollo_occupancy_filtered
          - binary_sensor.badevaerelse_inde_occupancy
          - binary_sensor.sovevaerelse_apollo_occupancy
          - binary_sensor.boernevaerelse_apollo_occupancy
        from: "off"
        to: "on"
      - platform: state
        entity_id: binary_sensor.parasoll_hoveddoer
        to: "on"
      - platform: state
        id: terrace_door
        entity_id: binary_sensor.parasoll_terrassedoer
        to: "on"
      # 2026-06-02 (user-spec): ENHVER fysisk aktivitet (sensor/knap) vækker
      # huset → Active. physical_presence_recent flipper on ved aktivitet.
      # 2026-07-05: id sat så robot-gaten nedenfor også dækker denne trigger —
      # physical_presence_recent del (a) læser RÅ occupancy (robot-ufiltreret),
      # så uden gaten ville robottens egen Apollo-motion vække huset fra Dormant.
      - platform: state
        id: presence_recent
        entity_id: binary_sensor.physical_presence_recent
        from: "off"
        to: "on"
      # R8 fix audit Phase 1 2026-05-07 PM: HA restart resilience. Hvis HA
      # restartes mens nogen er hjemme (state=Dormant før restart, men presence
      # nu detekteret), state-triggers fyrer ikke (no transition). HA start
      # re-evaluerer via condition-template nedenfor.
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_select.house_state
        state: "Dormant"
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: "AirBnB"
      # R8 fix: enforce at least ONE presence indicator on. State-triggers ovenfor
      # implicit krav (transition to: on); HA-start trigger har INGEN sådan
      # garanti → check eksplicit. Ellers ville restart med tom hus + Dormant
      # silently transition til Active.
      # 2026-07-10: dvale-lås gør R8-tjekket dør/GPS-only. Er låsen aktiv (manuel
      # Dormant erklæret) må HA-start IKKE vække huset på radar-occupancy — kun
      # hoveddør + GPS (+ terrassedør er BEVIDST udeladt her: låst = kun hoveddør/
      # GPS, spejler wake-source-valget). Se packages/dormant_door_lock.yaml.
      - condition: template
        value_template: >-
          {% set locked = is_state('input_boolean.dormant_door_lock_enabled', 'on')
             and is_state('input_boolean.dormant_door_lock', 'on') %}
          {% if locked %}
          {{ is_state('input_boolean.parent_a_home', 'on')
             or is_state('input_boolean.parent_b_home', 'on')
             or is_state('binary_sensor.parasoll_hoveddoer', 'on') }}
          {% else %}
          {{ is_state('input_boolean.parent_a_home', 'on')
             or is_state('input_boolean.parent_b_home', 'on')
             or is_state('binary_sensor.stue_apollo_occupancy_filtered', 'on')
             or is_state('binary_sensor.spisestue_apollo_occupancy_filtered', 'on')
             or is_state('binary_sensor.koekken_apollo_occupancy_filtered', 'on')
             or is_state('binary_sensor.badevaerelse_inde_occupancy', 'on')
             or is_state('binary_sensor.sovevaerelse_apollo_occupancy', 'on')
             or is_state('binary_sensor.boernevaerelse_apollo_occupancy', 'on')
             or is_state('binary_sensor.parasoll_hoveddoer', 'on')
             or is_state('binary_sensor.parasoll_terrassedoer', 'on')
             or is_state('binary_sensor.physical_presence_recent', 'on') }}
          {% endif %}
      # 2026-07-10: dvale-lås — blokér de SENSOR-baserede vække-triggers mens låst.
      # occupancy + presence_recent + terrassedør ignoreres (= flaps/gardiner/
      # støvsuger); kun hoveddør + GPS (egne triggers uden disse id'er, samt
      # gps_enabled-gaten nedenfor for GPS) frigiver. house_manual_active +
      # dør-frigivelsen i dormant_door_lock.yaml er de sanktionerede veje.
      - condition: template
        value_template: >-
          {% set locked = is_state('input_boolean.dormant_door_lock_enabled', 'on')
             and is_state('input_boolean.dormant_door_lock', 'on') %}
          {{ not locked or trigger.id not in ['occupancy', 'presence_recent', 'terrace_door'] }}
      # 2026-07-10: GPS-hjemkomst kan slås fra som vækker mens låst. Er
      # gps_enabled OFF og låsen aktiv → parent_a_home/parent_b_home vækker ikke
      # (kun hoveddør). Trigger-id på GPS er default-index → tjek entity direkte.
      - condition: template
        value_template: >-
          {% set locked = is_state('input_boolean.dormant_door_lock_enabled', 'on')
             and is_state('input_boolean.dormant_door_lock', 'on') %}
          {% set gps_trigger = trigger.platform == 'state'
             and trigger.entity_id in ['input_boolean.parent_a_home', 'input_boolean.parent_b_home'] %}
          {{ not (locked and gps_trigger)
             or is_state('input_boolean.dormant_door_lock_gps_enabled', 'on') }}
      # 2026-06-12/2026-07-05: Roborock i bevægelse trigger radar-occupancy →
      # huset må ikke flippe Active pga. robottens egen motion. Gælder occupancy-
      # triggeren OG presence_recent-triggeren (physical_presence_recent del (a)
      # læser RÅ occupancy = robot-ufiltreret). Døre/GPS/knapper (egne triggers
      # uden disse id'er) vækker stadig. Post-dock 15-min: radar-occupancy hænger
      # 'on' efter dok → trailing-edge må heller ikke bumpe (spejler
      # last_physical_activity-gaten).
      - condition: template
        value_template: >-
          {% set vac = states('vacuum.s8_maxv_ultra') %}
          {% set dock_age = (now() - states.vacuum.s8_maxv_ultra.last_changed).total_seconds() if states.vacuum.s8_maxv_ultra else 99999 %}
          {{ trigger.id not in ['occupancy', 'presence_recent']
             or (vac not in ['cleaning', 'returning']
                 and not (vac == 'docked' and dock_age < 900)) }}
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.house_state
        data:
          option: "Active"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.manual_dormant_override
      # Sprint C.9 fix audit 2026-05-07: tightened 06-21 → 07-19. Tidligere
      # arrival 20:55 åbnede gardiner lige før bedtime; arrival 06:30 vinter
      # åbnede ind i mørk gade. Plus skip hvis godnat/cinema/cirkus mode
      # aktiv (don't fight active mood).
      - condition: time
        after: "07:00:00"
        before: "19:00:00"
      - condition: state
        entity_id: binary_sensor.godnat_any_active
        state: "off"
      - condition: state
        entity_id: input_boolean.cinema_active
        state: "off"
      - condition: state
        entity_id: input_boolean.cirkus_active
        state: "off"
      # 🌙 2026-07-15 (fejlklasse #1-sweep): sove-gardinet springes over i
      # morgen-beskyttelses-vinduet (partneren sover; ankomst 07-08 må ikke
      # rive gardinet op). Samme mønster som godmorgen_auto_detect.
      # 2026-07-28 (fejlklasse #1/#3): manglede manuel-hold-filteret som
      # gardin_manual_grace-headeren lovede for ALLE auto-open — manuelt
      # nedrullede gardiner (og sove under putning) blev revet op ved Active.
      - service: cover.open_cover
        target:
          entity_id: >-
            {% set held = state_attr('sensor.gardiner_manual_hold', 'held') | default([]) %}
            {% from 'rosters.jinja' import open_plan_gardiner %}{{ open_plan_gardiner
                | reject('in', held) | list }}
      # 2026-07-29: sove-gardinet er taget UD af listen og går gennem det bad-
      # gatede script, der selv holder snooze-, manuel-hold- og bad-vetoerne
      # (packages/sove_gardin_bad_gate.yaml). Ét sted, ni kaldere.
      - service: script.sove_gardin_op

  # --- Go DORMANT when everyone leaves ---
  - id: house_state_to_dormant
    alias: "Hus: Skift til Dormant"
    mode: single
    description: >
      User-spec 2026-05-10 (efter critical incident): "efter 3 timer med
      absolut ingen bevægelse eller knap-tryk, så går huset selv i dormant
      og alle automatiseringer (undtagen summer/winter defense) stoppes."

      Ændringer fra v1 (2026-05-07):
      - Timeout: 15 min → 3 hours (matches user mental model)
      - Apollo "any on" check: STUCK-PROOF — ignoreres hvis last_changed >24h
        (= sensor stuck "on" pga. mesh-disconnect → ikke ægte presence)
      - Phone-tracking PRIMARY signal — Apollo CONFIRMER, ikke blocker
    trigger:
      # Primary: nogen_hjemme har været off i 3 timer (ingen GPS-detected hjemme)
      - platform: state
        entity_id: binary_sensor.nogen_hjemme
        from: "on"
        to: "off"
        for:
          hours: 3
      # HA restart resilience — re-evaluerer conditions ved start
      - platform: homeassistant
        event: start
      # Hourly safety-check: catch missed transitions (eg. nogen_hjemme bouncing)
      - platform: time_pattern
        hours: "/1"
    condition:
      - condition: state
        entity_id: input_select.house_state
        state: "Active"
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: "AirBnB"
      # 2026-06-02 (user-spec): fysisk aktivitet (sensor/knap) sidste 3t =
      # suverænt HJEMME-signal → ALDRIG Dormant mens nogen er fysisk aktiv.
      # 2026-08-15c: læser nu den BREDDE-kvalificerede udgave. Ét fantomerende
      # rum er ikke et menneske, og holdt ellers huset Active i fire døgn.
      - condition: state
        entity_id: binary_sensor.physical_presence_credible
        state: "off"
      # Phone-tracking primary: nogen_hjemme=off i 3+ timer
      - condition: template
        value_template: >-
          {% set s = states.binary_sensor.nogen_hjemme %}
          {{ s is not none and s.state == 'off'
             and (now() - s.last_changed).total_seconds() >= 10800 }}
      # Apollo any-on check — PHONES-FIRST (sprint 2026-05-10 critical fix):
      # User-spec: "3 timer med absolut ingen bevægelse eller knap-tryk → Dormant".
      # Phone-tracking ER det primary signal (nogen_hjemme=off i 3h ovenfor).
      # Apollo er secondary confirmation MED CAVEATS:
      #   - Stuck "on" i 24h+ = mesh-disconnect/false target → IGNORE
      #   - Stuck "on" i 3h+ MENS phones er væk = false target → IGNORE
      #     (phones er reliable; hvis phones siger væk, lyt til phones)
      #   - Apollo "on" der ER recent (<3h siden phones gik væk) = ægte
      #     presence (eg. nogen forlod telefon hjemme) → BLOCK Dormant
      #
      # Logic: hvis nogen Apollo har transitioned til "on" SIDEN phones gik
      # væk (= mens vi var ude), antag det er false. Ellers (= "on" fra før
      # afgang), ignorer (= old state, person nu væk).
      - condition: template
        value_template: >-
          {% set nogen = states.binary_sensor.nogen_hjemme %}
          {% if nogen is none or nogen.state != 'off' %}
            true
          {% else %}
            {% set phones_away_since = nogen.last_changed %}
            {% set apollos = [
              'binary_sensor.stue_apollo_occupancy_filtered',
              'binary_sensor.spisestue_apollo_occupancy_filtered',
              'binary_sensor.koekken_apollo_occupancy_filtered',
              'binary_sensor.badevaerelse_inde_occupancy',
              'binary_sensor.sovevaerelse_apollo_occupancy',
              'binary_sensor.boernevaerelse_apollo_occupancy'
            ] %}
            {% set ns = namespace(real_presence=false) %}
            {% for a in apollos %}
              {% if states(a) == 'on' %}
                {% set lc = states[a].last_changed %}
                {# Apollo ER "real presence" hvis last_changed er INDEN for de
                   sidste 30 min (= meget recent, kunne være person der lige
                   kom tilbage uden phone). Ellers = stuck/false. #}
                {% if lc is not none and (now() - lc).total_seconds() < 1800 %}
                  {% set ns.real_presence = true %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ not ns.real_presence }}
          {% endif %}
      # Don't go Dormant if someone is on the terrace (door state real, ikke
      # samme antimønster som Apollos — en åben dør har konkret betydning).
      - condition: state
        entity_id: binary_sensor.parasoll_terrassedoer
        state: "off"
      # 2026-07-18 (user-spec, fejlklasse #12 sibling-guard): wasp bad armed =
      # nogen på badet = hjemme. Søster-idle-stierne (dormant_idle, _physical,
      # schedule) har denne guard; 3h-stien manglede den. Håndhæver "Active→
      # Dormant kræver at en yderdør er åbnet siden sidste ophold indenfor".
      - condition: state
        entity_id: binary_sensor.wasp_dormant_allowed
        state: "on"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.house_state
        data:
          option: "Dormant"
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.godnat_active
            - input_boolean.godnat_boern_active
            - input_boolean.godnat_voksne_active
            - input_boolean.godnat_pending
      # 2026-07-19 (fejlklasse #2/#16 roster-drift): var en eksplicit indoor-liste
      # (skrevet for at undgå terrasse-lys som det gamle `entity_id: all` slukkede)
      # — men den driftede fra light.alle_indvendige og manglede koekken_lyskaede,
      # stue_plug + boernevaerelse_hygge_strip, så de 3 blev efterladt TÆNDT når
      # huset gik Dormant ad denne vej. De 5 øvrige Dormant-veje bruger allerede
      # gruppen (indoor-only, ingen terrasse) → konsolidér hertil.
      - service: light.turn_off
        continue_on_error: true
        target:
          entity_id: light.alle_indvendige
        data:
          transition: 10

  # ==========================================================================
  # GPS-FAST Dormant — 30 min hvis BEGGE phones GPS-confirmed >1km fra hjem
  # ==========================================================================
  # User-spec 2026-05-10: "også bare efter 30 min, hvis du har bekræftet
  # geo på begge tlf mindst 1km væk fra example street."
  #
  # ROBUSTHEDSARGUMENT: GPS-confirmed >1km er stærkere signal end phone-
  # tracking alene (= ingen "phone-left-at-home" risiko, ingen GPS-lag-bug).
  # Hvis BEGGE phones er fysisk verificeret >1km væk + 30 min → Dormant
  # uden Apollo-confirmation (Apollo "on" antages stuck/false).
  #
  # Skipper:
  #   - AirBnB (gæster — separat lockdown logic)
  #   - Allerede Dormant (ingen handling)
  #   - GPS unavailable / accuracy bad (= require both phones tracking)
  # ==========================================================================
  - id: house_state_to_dormant_gps_fast
    alias: "Hus: Skift til Dormant (GPS-fast >1km, 30 min)"
    description: >-
      Aggressive Dormant trigger når GPS bekræfter BEGGE phones >1km fra
      Example Street i 30+ min. Override Apollo "on" stuck-state (= GPS
      stærkere signal end Apollo). Sprint 2026-05-10 user-spec.
    mode: single
    trigger:
      # Re-evaluate hver 5 min (= responsive uden at spam)
      - platform: time_pattern
        minutes: "/5"
      # Plus state-trigger på phones leaving home
      - platform: state
        entity_id: device_tracker.phone_a
        from: "home"
        to: "not_home"
        for:
          minutes: 30
      # 2026-08-15c: Parent B's tracker er permanent frossen på 'home' (iOS
      # "when in use") → ankeret er hendes ENESTE vidne. Se parent_b_hjemme_anker.
      - platform: state
        entity_id: binary_sensor.parent_b_hjemme_anker
        from: "on"
        to: "off"
        for:
          minutes: 30
    condition:
      - condition: state
        entity_id: input_select.house_state
        state: "Active"
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: "AirBnB"
      # 2026-06-02 (user-spec): fysisk aktivitet (sensor/knap) sidste 3t =
      # suverænt HJEMME-signal → ALDRIG Dormant mens nogen er fysisk aktiv.
      # 2026-08-15c: læser nu den BREDDE-kvalificerede udgave. Ét fantomerende
      # rum er ikke et menneske, og holdt ellers huset Active i fire døgn.
      # 2026-08-17b: ..._fast, ikke ..._credible. Den lange udgaves ydre gate er
      # et 3t-vindue, så den kan aldrig være off 30 min efter en afgang — denne
      # automation har last_triggered = None i HELE sin levetid. Se sensoren.
      - condition: state
        entity_id: binary_sensor.physical_presence_credible_fast
        state: "off"
      # BEGGE voksne væk. Parent A: rigtig GPS (state + distance + alder).
      # Parent B: ankeret — hendes tracker er permanent frossen på 'home' efter
      # iOS-migrationen 08-15, så et `not_home`-krav på den kan ALDRIG opfyldes
      # og gjorde hele denne vej død. Ankeret har ingen distance; hendes
      # 30-min-krav måles derfor på ankerets egen alder.
      - condition: state
        entity_id: device_tracker.phone_a
        state: "not_home"
      - condition: state
        entity_id: binary_sensor.parent_b_hjemme_anker
        state: "off"
        for: "00:30:00"
      # Distance check + GPS accuracy check (defensive: kræv valid GPS).
      # >1km fra zone.home (Example Street) = definitely away.
      - condition: template
        value_template: >-
          {% set m_lat = state_attr('device_tracker.phone_a', 'latitude') %}
          {% if m_lat is none %}
            false
          {% else %}
            {% set m_d_doris = distance('device_tracker.phone_a', 'zone.home') %}
            {{ m_d_doris is not none and m_d_doris > 1.0 }}
          {% endif %}
      # 30 min siden Parent A's phone gik 'not_home' (matches user-spec timing)
      - condition: template
        value_template: >-
          {% set m_lc = states.device_tracker.phone_a.last_changed %}
          {{ ((now() - m_lc).total_seconds() if m_lc else 0) >= 1800 }}
      # 2026-06-12 (user-spec): åben terrassedør = 100% nogen hjemme — vetoer
      # auto-Dormant selv når begge phones er væk (gæster/børn uden telefon).
      - condition: state
        entity_id: binary_sensor.parasoll_terrassedoer
        state: "off"
    action:
      - service: logbook.log
        data:
          name: "Dormant GPS-fast"
          message: >-
            Parent A >1km i 30+ min, Parent B's anker off i 30+ min. Going Dormant.
            (parent_a={{ distance('device_tracker.phone_a','zone.home') | round(1) }}km,
            parent_b-anker={{ states('binary_sensor.parent_b_hjemme_anker') }})
      - service: input_select.select_option
        target:
          entity_id: input_select.house_state
        data:
          option: "Dormant"
      # Clear stuck flags (defensive)
      - service: input_boolean.turn_off
        target:
          entity_id: !include ../rosters/godnat_flag.yaml
      # Sluk alle indvendige lys (terrasse separat)
      - service: light.turn_off
        continue_on_error: true
        target:
          entity_id: light.alle_indvendige
        data:
          transition: 10

  # ==========================================================================
  # FLAG-FAST Dormant — 30 min hvis BEGGE home-flags er off
  # ==========================================================================
  # 2026-05-21: parallel til GPS-fast Dormant. Bruger binary_sensor.nogen_hjemme
  # som signal i stedet for raw device_tracker state. Mere robust mod stale
  # GPS (et phone stuck i en gammel zone blokerer GPS-fast 30 min path).
  #
  # Home-flag clearing er allerede konfident: enten via presence_*_leave
  # (device_tracker → not_home + 5 min grace) eller via presence_gps_stale
  # (stale > 45 min day + zone home; 2026-05-22-tune). Begge paths har validation, så 30 min efter
  # nogen_hjemme=off er sikkert at gå Dormant uden Apollo-confirmation.
  #
  # Skipper AirBnB (separate path) + allerede Dormant.
  # ==========================================================================
  - id: house_state_to_dormant_flag_fast
    alias: "Hus: Skift til Dormant (home-flags off 30 min)"
    description: >-
      30 min efter nogen_hjemme flipper off → Going Dormant. Robust mod stale
      GPS fordi vi stoler på home-flag (= already cleared via gps_stale eller
      faktisk not_home transition).
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.nogen_hjemme
        from: "on"
        to: "off"
        for:
          minutes: 30
        id: flanke
      # 2026-08-17b (#4/#19): den rene flanke fyrer ÉN gang, 30 min efter
      # flagene faldt. Er huset ikke stille lige dér — robotten kører stadig,
      # en Apollo fantomerer, HA blev genstartet — er hele afgangen tabt indtil
      # nogen kommer hjem og går igen, og 3t-vejen bliver den reelle første
      # udvej. Backstoppen genprøver, så vejen leverer så snart huset FALDER
      # til ro. 144 tick/dag, alle rene condition-tjek (#7).
      - platform: time_pattern
        minutes: "/10"
        id: backstop
    condition:
      # Backstoppen skal arve flankens præmis, ikke bare dens conditions (#22's
      # nabo: 08-16-incidenten hvor en /1t-tick fyrede uden flankens kontekst).
      # last_changed nulstilles ved HA-restart (#5) → efter en restart venter
      # backstoppen 30 min igen. Det fejler i den sikre retning.
      - condition: template
        value_template: >-
          {% set s = states.binary_sensor.nogen_hjemme %}
          {{ trigger.id == 'flanke'
             or (s is not none and s.state == 'off'
                 and (now() - s.last_changed).total_seconds() >= 1800) }}
      - condition: state
        entity_id: input_select.house_state
        state: "Active"
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: "AirBnB"
      # 2026-06-02 (user-spec): fysisk aktivitet (sensor/knap) sidste 3t =
      # suverænt HJEMME-signal → ALDRIG Dormant mens nogen er fysisk aktiv.
      # 2026-08-15c: læser nu den BREDDE-kvalificerede udgave. Ét fantomerende
      # rum er ikke et menneske, og holdt ellers huset Active i fire døgn.
      # 2026-08-17b: ..._fast — den lange udgaves 3t-gate gjorde denne vej
      # uopnåelig; sidste gang den fyrede var 2026-06-03. Se sensoren.
      - condition: state
        entity_id: binary_sensor.physical_presence_credible_fast
        state: "off"
      # Defensive re-check: nogen_hjemme stadig off (= ikke nogen kom tilbage)
      - condition: state
        entity_id: binary_sensor.nogen_hjemme
        state: "off"
      # 2026-06-12 (user-spec): åben terrassedør = 100% nogen hjemme.
      - condition: state
        entity_id: binary_sensor.parasoll_terrassedoer
        state: "off"
    action:
      - service: logbook.log
        data:
          name: "Dormant flag-fast"
          message: "nogen_hjemme=off i 30 min — Going Dormant"
      - service: input_select.select_option
        target:
          entity_id: input_select.house_state
        data:
          option: "Dormant"
      - service: input_boolean.turn_off
        target:
          entity_id: !include ../rosters/godnat_flag.yaml
      # 2026-07-19 (fejlklasse #2/#16 roster-drift): konsolideret fra stale eksplicit
      # liste til light.alle_indvendige (som 5 af 7 Dormant-veje allerede bruger) —
      # den gamle liste fangede ikke koekken_lyskaede/stue_plug/boernevaerelse_hygge_strip.
      - service: light.turn_off
        continue_on_error: true
        target:
          entity_id: light.alle_indvendige
        data:
          transition: 10

  # ==========================================================================
  # PHYSICAL Dormant — 3t uden NOGEN fysisk aktivitet (sensor/knap) → Dormant
  # ==========================================================================
  # User-spec 2026-05-10 (nu endelig implementeret som TRIGGER, ikke kun veto):
  # "efter 3 timer med absolut ingen bevægelse eller knap-tryk → Dormant",
  # UANSET telefoner (location er ikke altid på). Dette er det robuste primary-
  # signal; phone-paths (gps_fast/flag_fast/to_dormant) er nu hurtigere fallback
  # når telefoner FAKTISK bekræfter væk.
  #
  # binary_sensor.physical_presence_recent → off betyder: ingen occupancy ON nu
  # (ikke stuck) OG ingen transition/knap i 3t = reelt tomt hus. Stuck-proof via
  # transition-logikken + 24h occupancy-cap.
  #
  # godnat-GATE: fyrer ALDRIG mens godnat aktiv (= familie i seng; sovende person
  # holder normalt Apollo "on" så vi når ikke hertil, men gaten er sikkerhedsnet
  # hvis sove-Apollo er unavailable). godnat ryddes selv om morgenen.
  # ==========================================================================
  - id: house_state_to_dormant_physical
    alias: "Hus: Skift til Dormant (3t ingen fysisk aktivitet)"
    description: >-
      physical_presence_credible → off (3t uden troværdig fysisk aktivitet) →
      Dormant. Robust mod upålidelig phone-presence (user-spec 2026-05-10).
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.physical_presence_credible
        from: "on"
        to: "off"
      # #4: en ren flanke-trigger fyrer aldrig hvis flanken sker mens en
      # condition blokerer — og 08-15 kom flanken slet ikke, fordi et fantom
      # holdt sensoren oppe. Backstoppen måler tiden i conditions (som alle er
      # tilstands-tjek uden trigger-afhængighed), så den er sikker at gentage.
      - platform: time_pattern
        hours: "/1"
      - platform: homeassistant
        event: start
    condition:
      # 2026-08-16: backstoppen arvede ikke flanke-triggerens præmis. /1t-ticket
      # kl. 09:00 fyrede med credible-presence ON og et menneske i depotet —
      # depot-lyset slukkede og auto-tænd var blokeret til bounce-vagten kom
      # 09:05. `unavailable` matcher ikke "off" → fejler mod Active (#9).
      - condition: state
        entity_id: binary_sensor.physical_presence_credible
        state: "off"
      - condition: state
        entity_id: input_select.house_state
        state: "Active"
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: "AirBnB"
      # Sikkerhedsnet: aldrig Dormant mens familien er i godnat/seng (ville rydde
      # godnat-flags → natbevægelse = bright lys). Sovende person holder normalt
      # Apollo "on" → vi når ikke hertil, men gaten dækker unavailable sove-Apollo.
      - condition: state
        entity_id: binary_sensor.godnat_any_active
        state: "off"
      # Ekstra sikkerhed: Apollo-occupancy er pt. UNAVAILABLE (B14/B12/B17), så
      # denne path hviler mest på knap/dør/depot-aktivitet. Fyr derfor ikke under
      # cinema/cirkus (= bevidst stillesiddende uden tryk = falsk "ingen aktivitet"
      # mens Apollos er nede). Når Apollos er online igen fanger path (a) presence.
      - condition: state
        entity_id: input_boolean.cinema_active
        state: "off"
      - condition: state
        entity_id: input_boolean.cirkus_active
        state: "off"
      # 2026-06-12 (user-spec): åben terrassedør = 100% nogen hjemme — en dør
      # der står åben laver ingen transitions og tæller derfor ikke som
      # "fysisk aktivitet", men den betyder utvetydigt at folk er der.
      - condition: state
        entity_id: binary_sensor.parasoll_terrassedoer
        state: "off"
      # 2026-07-05 (user-spec, wasp-in-a-box): fyr ALDRIG på ren inaktivitet hvis
      # ingen yderdør er åbnet siden sidste ophold indenfor — en stille sofa-/
      # senge-person er ikke gået ud (radar taber bare still-target). Se
      # packages/wasp_in_a_box.yaml.
      - condition: state
        entity_id: binary_sensor.wasp_dormant_allowed
        state: "on"
    action:
      - service: logbook.log
        data:
          name: "Dormant fysisk"
          message: "3t ingen fysisk aktivitet (sensor/knap) → Going Dormant"
      - service: input_select.select_option
        target:
          entity_id: input_select.house_state
        data:
          option: "Dormant"
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.godnat_active
            - input_boolean.godnat_boern_active
            - input_boolean.godnat_voksne_active
            - input_boolean.godnat_pending
      - service: light.turn_off
        continue_on_error: true
        target:
          entity_id: light.alle_indvendige
        data:
          transition: 10

  # ==========================================================================
  # AirBnB sensor-based Dormant (no GPS, longer intervals to not annoy guests)
  # ==========================================================================
  - id: house_airbnb_to_dormant
    alias: "Hus: AirBnB → Dormant (sensorer)"
    description: "Sensor-only Dormant for AirBnB with generous 30 min timeout"
    mode: single
    trigger:
      # Trigger when ALL sensors have been clear for a while
      - platform: state
        entity_id: binary_sensor.stue_apollo_occupancy_filtered  # PLACEHOLDER
        from: "on"
        to: "off"
        for:
          minutes: 30
      - platform: state
        entity_id: binary_sensor.spisestue_apollo_occupancy_filtered  # PLACEHOLDER
        from: "on"
        to: "off"
        for:
          minutes: 30
      # 2026-07-15 (gæste-forensik): koekken-Apolloen MANGLEDE i alle
      # occupancy-lister her → huset gik Dormant + slukkede ALT mens gæsten
      # stod i køkkenet (07-13 15:15). Tilføjet i triggers + condition + wake.
      - platform: state
        entity_id: binary_sensor.koekken_apollo_occupancy_filtered
        from: "on"
        to: "off"
        for:
          minutes: 30
      - platform: state
        entity_id: binary_sensor.badevaerelse_inde_occupancy
        from: "on"
        to: "off"
        for:
          minutes: 30
      - platform: state
        entity_id: binary_sensor.sovevaerelse_apollo_occupancy
        to: "off"
        for:
          minutes: 30
      - platform: state
        entity_id: binary_sensor.boernevaerelse_apollo_occupancy
        to: "off"
        for:
          minutes: 30
      # 2026-09-03f: PRÆCIS samme fejl som køkkenet 07-15, nu på de to VALLHORN.
      # Husets kanoniske occupancy-roster er OTTE sensorer (se
      # physical_presence_*-templatene i toppen af denne fil) — denne
      # sensor-only Dormant-vej kendte kun de seks Apolloer. Målt 09-03 14:57:00
      # tændte depot-lyset for en person der stod i depotet; 14:57:20 slukkede
      # `entity_id: all` herunder det igen, fordi sove-Apolloens 30-min-flanke
      # fyrede og INGEN betingelse kunne se depotet. Depot + entré er husets to
      # rum uden Apollo — de er derfor de eneste steder man kan opholde sig
      # usynligt for denne automation.
      - platform: state
        entity_id: binary_sensor.depot_valhorn_occupancy
        to: "off"
        for:
          minutes: 30
      - platform: state
        entity_id: binary_sensor.entre_valhorn_occupancy
        to: "off"
        for:
          minutes: 30
      # 2026-09-07 (B117): backstop. De otte flanke-triggers ovenfor er nu ikke
      # længere selvstændigt tilstrækkelige — den sensor der rammer sit 30-min-
      # mærke SIDST er den der låser op, og en HA-restart dræber ethvert
      # ventende `for:` (permanent faktum). Uden denne tick ville huset efter en
      # restart aldrig nå Dormant før nogen bevægede sig igen. Det er først
      # forsvarligt nu, hvor conditionen selv MÅLER varigheden i stedet for at
      # stole på triggerens `for:` — jf. reglen om time_pattern-backstop med
      # condition-template. /10 = 144 evalueringer/døgn af ét template, ingen
      # service-kald (fejlklasse #7).
      # 2026-09-08 (B120): efter `ro` 30 → 90 min BÆRER denne tick hele vejen.
      # De otte `for: 30`-flanker fyrer nu 60 min for tidligt og falder altid på
      # conditionen; de er bevidst bevaret som billig tidlig-udgang hvis `ro`
      # sænkes igen. Kravet er ikke længere kodet i `for:` — det står ét sted,
      # i conditionen (fejlklasse #2).
      - platform: time_pattern
        minutes: "/10"
    condition:
      - condition: state
        entity_id: input_select.house_mode
        state: "AirBnB"
      - condition: state
        entity_id: input_select.house_state
        state: "Active"
      # -----------------------------------------------------------------------
      # 2026-09-07 (B117, user: "en reel katastrofe"): VARIGHEDS-kravet stod kun
      # i triggerne, ikke her. Den gamle condition spurgte alene "er nogen sensor
      # `on` lige NU?" — så det rakte at ÉN sensor nåede sit 30-min-mærke mens de
      # syv andre tilfældigvis stod `off` i springet mellem to bevægelses-udslag.
      # Radar-occupancy falder til `off` mellem hvert udslag, så det hul er åbent
      # hele tiden. Målt under gæste-opholdet: 25 Dormant-overgange på 2,4 døgn,
      # heraf Dormant 09-06 22:50:57 hvor entréen havde set bevægelse 22:47:16 —
      # 3½ minut før huset erklærede tomt hus. Handlingen er `light.turn_off` på
      # `entity_id: all`, så badelyset blev slukket fire gange den nat, hver gang
      # inden for 2 s af overgangen. Fejlklasse #2: Normal-modes
      # house_state_to_dormant har varigheds-kravet (>= 10800 s), AirBnB havde
      # det ikke.
      #
      # NY REGEL: hver LEVENDE kanal skal have været `off` i mindst `ro`
      # sekunder — ikke bare være det i dette øjeblik.
      #
      # `unavailable` er hverken bevis eller blokade (fejlklasse #9). Gæsterne
      # slukker væg-kontakter — pt. er køkken-, spisestue- og sove-Apolloen døde
      # 18-21 t (B118), og user-spec 2026-09-07 er at DET accepterer vi. En død
      # kanal må derfor ikke kunne låse huset ude af Dormant for evigt. Men den
      # må heller ikke tælle som "her er tomt", for det er præcis den løgn der
      # gør sweep'en farlig. Derfor: udelad den, og kræv at der er mindst
      # `min_levende` kanaler tilbage til at svare. Med 3 døde er der 5 tilbage
      # = huset kan stadig gå Dormant; dør endnu to, blokeres sweep'en i stedet
      # for at gætte. Fejl-retningen er "lyset bliver stående", aldrig "lyset
      # slukkes på en gæst".
      #
      # STUCK-PROOF bevaret fra sprint 2026-05-10: en sensor der har hængt `on`
      # i >24 t er et mesh-artefakt, ikke presence — den udelades helt (hverken
      # levende eller rolig), præcis som før.
      #
      # -----------------------------------------------------------------------
      # 2026-09-08 (B120) — `ro` 30 → 90 min. User: "der er stadig mange dormant
      # blibs. bør vi ikke kræve main door open and closed og så ingen aktivitet
      # før dormant?"
      #
      # DØR-KRAVET BLEV MÅLT OG FORKASTET. `binary_sensor.parasoll_hoveddoer` er
      # sund (9 rene åbn→luk-par på 3 døgn, 7-30 s pr. par), så det var ikke
      # sensor-kvaliteten der afgjorde det — det var informationsindholdet:
      # **en dørsensor melder en passage, ikke en RETNING.** "Gæsten gik ud" og
      # "gæsten kom hjem" er den samme flanke, og natten efter en hjemkomst ser
      # derfor præcis ud som dagen efter en afgang: ingen dør-events overhovedet.
      # Replay over 31 Dormant-overgange (09-05..09-08):
      #   • krav "dør-luk <= 60 min": 7/31 består — men kun 1 af de 10 ÆGTE lange
      #     Dormant-perioder overlever. Et tomt hus der vågner på et fantom kan
      #     aldrig komme tilbage i Dormant, for døren åbnes jo ikke af ingen.
      #   • samme krav + fritagelse "ingen dør-åbning siden sidste Dormant"
      #     (så en fantom-vækning i et tomt hus må gå Dormant igen): 28/31
      #     består — fritagelsen lukker natte-blippene ind igen, for en sovende
      #     gæst åbner heller ingen dør. De to tilfælde er ikke adskillelige.
      # Retningen findes kun i soveværelsets Apollo (den ville se kroppen i
      # sengen), og det er præcis den kanal gæsterne har slukket på vægkontakten.
      #
      # DET DER FAKTISK SEPARERER er varighed, fordi "blip" ER en varigheds-
      # egenskab. En Dormant-periode der overlever tærsklen R fyrer stadig, bare
      # (R-30) min senere, hvis og kun hvis dens egen varighed > (R-30):
      #   R=60  -> 11/31 tilbage, alle 10 lange bevaret
      #   R=90  -> 10/31 tilbage, alle 10 lange bevaret  <-- valgt
      #   R=120 ->  3/31 tilbage, 7 ægte perioder TABT
      # 90 min rammer knivskarpt: de 21 der forsvinder er præcis blippene
      # (varighed 0,0-35 min), og de 10 der bliver er præcis dem huset mente.
      # Prisen er at afgang → Dormant tager 90 min i stedet for 30, dvs. lyset
      # står længere efter gæsten er gået ud — igen fejl-retningen "lyset bliver
      # stående". De 4 nat-Dormants der overlever med gæster hjemme starter alle
      # efter 90 min TOTAL stilhed, dvs. de sover, og enhver bevægelse vækker
      # huset øjeblikkeligt via house_airbnb_to_active (som ingen dør kræver).
      # Det er ikke et blip, det er korrekt nat-adfærd.
      #
      # -----------------------------------------------------------------------
      # 2026-09-11 (B128) — VARIGHEDEN MÅLES NU PÅ ET BLIP-IMMUNT ANKER.
      # User: "huset går ikke på dormant. ligner at flaps forhindrer det."
      #
      # Han havde ret, og fejlen var i HVAD der blev målt, ikke i tærsklen.
      # Den gamle form var `s.state == 'off' and s.last_changed >= ro` pr.
      # kanal = et krav om 90 minutter med NUL flanker på en radar-kanal.
      # Målt 09-11 med lejligheden beviseligt tom siden 10:16 (gæsterne gik,
      # dør 10:13:58 + 10:15:57, entré off 10:16:32, ingen anden kanal rørt i
      # 4,3 t): stue-Apolloen gav 52 spøgelses-episoder, og kanalens længste
      # stille-vindue var **16,4 min**. Kravet var altså UOPFYLDELIGT pr.
      # konstruktion — huset stod Active i 21,6 t med tomt hus, og B120's
      # hævning `ro` 30 → 90 min gjorde det strengt værre, fordi ingen havde
      # målt flanke-afstanden på den kanal gaten faktisk læser.
      #
      # `ro` er UÆNDRET 90 min — B120's replay over 31 overgange står ved magt.
      # Det der ændrer sig er at uret nu nulstilles af PRESENCE (en ON-flanke
      # der HOLDT sustained_presence_seconds = målt 120 s) i stedet for af
      # enhver flanke. Spøgelserne i det tomme hus toppede på 95 s; hvert
      # beboet 20-min-vindue indeholder en episode over 120 s.
      #
      # Pr. kanal kræves stadig `off` LIGE NU. Et blip der tilfældigvis er ON
      # på /10-ticket koster kun 10 minutter, og alternativet (tillad ON under
      # tærsklen) ville lade huset gå Dormant i samme sekund en gæst ankommer —
      # hvorefter `house_airbnb_to_active`s ON-flanke allerede var brugt og
      # vækningen tabt (#4/#19).
      # -----------------------------------------------------------------------
      - condition: template
        value_template: >-
          {% from 'rosters.jinja' import husets_occupancy %}{% set roster = husets_occupancy
          %}
          {% set ro = 90 * 60 %}
          {% set min_levende = 4 %}
          {% set ns = namespace(levende=0, rolige=0) %}
          {% for a in roster %}
            {% set s = states[a] %}
            {% if s is not none and s.state not in ['unavailable', 'unknown'] %}
              {% set alder = (now() - s.last_changed).total_seconds() %}
              {% if not (s.state == 'on' and alder >= 86400) %}
                {% set ns.levende = ns.levende + 1 %}
                {% if s.state == 'off' %}
                  {% set ns.rolige = ns.rolige + 1 %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {# Dvale-uret: sidste VEDVARENDE presence, ikke sidste flanke.
             Mangler ankeret (fresh install / recorder-tab) → fail-closed. #}
          {% set t = states('sensor.last_sustained_presence') %}
          {{ ns.levende >= min_levende
             and ns.rolige == ns.levende
             and t not in ['unknown', 'unavailable', 'none', '']
             and (now() - as_datetime(t)).total_seconds() >= ro }}
      - condition: state
        entity_id: binary_sensor.parasoll_terrassedoer
        state: "off"
      # 2026-09-02b: BADET er husets kendte blinde kanal, og det er præcis den
      # denne automation spørger. `badevaerelse_inde_occupancy` kan ikke se en
      # person bag brusedøren — wasp kræver en PIR-flanke der aldrig kommer, og
      # dørsensoren melder ÅBEN hele besøget (sprint 09-01b). Et bad på 30+ min
      # aflæses derfor som et tomt hus, og handlingen her er ikke bare Dormant:
      # det er `light.turn_off` på `entity_id: all`. En gæst i bruseren ville
      # blive slukket på. De to sensorer nedenfor blev bygget 09-01b/09-02 som
      # husets delte bad-veto netop fordi de måler damp/klima frem for kroppen,
      # og de er de eneste kanaler der KAN svare her.
      - condition: state
        entity_id: binary_sensor.badevaerelse_brusebad_hold
        state: "off"
      - condition: state
        entity_id: binary_sensor.badevaerelse_afventer_klimabevis
        state: "off"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.house_state
        data:
          option: "Dormant"
      # 2026-09-09d (B124): sluk-sweep'en er flyttet til
      # `script.airbnb_dormant_lys_sweep` (øverst i denne fil), fordi
      # check-in-knappens Dormant-vej skal bruge PRÆCIS samme regel og to
      # kopier divergerer (fejlklasse #2). Scriptet freder de rum hvis
      # occupancy-kanal er blind og slukker resten — hele begrundelsen står
      # ved scriptet.
      - service: script.airbnb_dormant_lys_sweep
        data:
          transition: 15


  - id: house_airbnb_to_active
    alias: "Hus: AirBnB → Active (sensorer)"
    description: "Wake from Dormant when AirBnB guest detected"
    mode: single
    trigger:
      - platform: state
        id: occupancy
        # 2026-09-03f: depot + entré manglede også HER, og konsekvensen er
        # værre end på sluk-vejen. Normal-modes wake dækker de to rum
        # INDIREKTE via sin `physical_presence_recent`-trigger (den sensor er
        # bygget på det fulde 8-sensor-roster) — men AirBnB-wake har ikke den
        # trigger. Står huset Dormant kunne en gæst derfor gå ind i depotet
        # eller entréen uden at NOGET vækkede huset, og begge rums
        # tænd-automationer kræver `house_state == Active`. Lyset var altså
        # dødt hele Dormant-perioden, ikke bare i det ene sekund. (#12)
        entity_id: !include ../rosters/husets_occupancy.yaml
        from: "off"
        to: "on"
      - platform: state
        entity_id: binary_sensor.parasoll_hoveddoer
        to: "on"
      - platform: state
        entity_id: binary_sensor.parasoll_terrassedoer
        to: "on"
    condition:
      - condition: state
        entity_id: input_select.house_mode
        state: "AirBnB"
      - condition: state
        entity_id: input_select.house_state
        state: "Dormant"
      # 2026-06-12: ignorer robottens egen radar-motion (samme gate som
      # house_state_to_active) — døre vækker stadig.
      - condition: template
        value_template: >-
          {{ trigger.id != 'occupancy'
             or states('vacuum.s8_maxv_ultra') not in ['cleaning', 'returning'] }}
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.house_state
        data:
          option: "Active"
      # -----------------------------------------------------------------------
      # 2026-09-02b (user-bug før gæst 09-05: "dormant slår til mens gæsterne er
      # hjemme og så slår active ikke til ved bevægelse uden at de åbner
      # hoveddøren"). Symptomet er ægte, men årsagen er ikke at Active udebliver
      # — den kommer. Det er LYSET der udebliver, og det er fejlklasse #4/#15:
      #
      # Gæstens første bevægelse giver ÉN occupancy-flanke (off→on). Den flanke
      # trigger BÅDE denne automation og rummets presence_light_*_on. Sidstnævnte
      # har `house_state == Active` som condition, og den evalueres i samme
      # øjeblik — altså FØR select_option ovenfor er landet. Lyset springes over,
      # og occupancy-sensoren bliver derefter stående `on` så længe gæsten er i
      # rummet ⇒ der kommer ALDRIG en ny flanke. Gæsten står i mørke indtil
      # rummet tømmes og betrædes igen. At åbne hoveddøren virkede, fordi
      # dørens egen flanke er en anden trigger-vej.
      #
      # FIX: re-arm flanken ved at kalde automationerne igen med
      # `skip_condition: false` — de træffer altså selv beslutningen med deres
      # fulde logik (lux, sol-gate, room_mode, godnat, mood). Ingen lys-regel
      # kopieres herned (fejlklasse #2), og en disabled automation er en no-op.
      #
      # ROSTER (fejlklasse #16): kun automations hvis trigger er den occupancy-
      # sensor der står i nøglen, OG som ikke læser `trigger.` (et kald uden
      # trigger-objekt ville give UndefinedError og abortere hele scriptet).
      # Derfor er `presence_light_sovevaerelse_on` bevidst UDE: den bruger
      # `trigger.id`. Den mister intet — dens triggers er still/moving_target,
      # som cykler af sig selv få sekunder efter en vækning, modsat de
      # latchende `*_occupancy_filtered`.
      # Kun sensorer der er `on` NU giver et kald, ellers ville vi tænde lys i
      # tomme rum (ON-automationerne re-tjekker ikke selv deres occupancy).
      # -----------------------------------------------------------------------
      - delay:
          seconds: 2
      - condition: state
        entity_id: input_select.house_state
        state: "Active"
      - condition: state
        entity_id: input_select.house_mode
        state: "AirBnB"
      - repeat:
          for_each: >-
            {{ [
                 {'s': 'binary_sensor.spisestue_apollo_occupancy_filtered',
                  'a': 'automation.lysnet_stue_taend'},
                 {'s': 'binary_sensor.spisestue_apollo_occupancy_filtered',
                  'a': 'automation.lysnet_spisestue_taend_pa_mork_indedag'},
                 {'s': 'binary_sensor.stue_apollo_occupancy_filtered',
                  'a': 'automation.lysnet_sofa_stue_taend'},
                 {'s': 'binary_sensor.koekken_apollo_occupancy_filtered',
                  'a': 'automation.lysnet_kokken_taend'},
                 {'s': 'binary_sensor.badevaerelse_inde_occupancy',
                  'a': 'automation.lysnet_badevaerelse_60_100_langsom_optrapning_kun_ved_ophold'},
                 {'s': 'binary_sensor.depot_valhorn_occupancy',
                  'a': 'automation.harry_potter_rum_taend_hyggelig_lys'},
                 {'s': 'binary_sensor.entre_valhorn_occupancy',
                  'a': 'automation.entre_lys_taend_ved_bevaegelse'}
               ] | selectattr('s', 'is_state', 'on') | map(attribute='a') | list }}
          sequence:
            - service: automation.trigger
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item }}"
              data:
                skip_condition: false
      - service: logbook.log
        data:
          name: "AirBnB vækning"
          message: >-
            Dormant → Active. Re-armede presence-lys for de rum der var optaget
            (flanken blev spist af Dormant-gaten).
          entity_id: input_select.house_state
      # 2026-06-30 (user undtagelse 3): INGEN auto-gardin-OP i AirBnB. Tidligere
      # åbnede denne "re-open curtains for guests" alle gardiner ved Dormant→
      # Active. Fjernet — gardiner åbnes kun manuelt (RODRET/app) i AirBnB.
      # Auto-NED (winter_defense_close mv.) er stadig fint.

  # ---------------------------------------------------------------------------
  # 2026-09-09d (B124): UDGANGEN for et fredet rum.
  #
  # `script.airbnb_dormant_lys_sweep` freder et rum hvis occupancy-kanal er
  # blind. Det er den rigtige fejlretning i sekundet, men uden denne automation
  # er den PERMANENT: `house_airbnb_to_dormant` har `house_state == Active` som
  # condition, så dens /10-tick kan ikke re-sweepe når huset først ER Dormant.
  # Lyset i det ene tvivlsomme rum ville altså brænde til næste gang nogen
  # bevæger sig (Active) og huset falder til ro igen — timer, ikke minutter.
  # Målt over gæsteopholdet 09-05..09-09 ville det være sket 2 gange (begge
  # `light.spisestue_loft`). AirBnB-reglen kræver at en gæst kan slippe ud af
  # enhver tilstand uden at kende systemet — her er udgangen automatisk.
  #
  # TVIVLEN OPHØRER når kanalen kommer tilbage OG selv siger `off`: så er rummet
  # ikke længere blindt, og scriptet vil af sig selv slukke det. `for: 2 min`
  # fordi en Apollo der lige er kommet på nettet flapper; vi vil ikke sweepe på
  # en enkelt sample.
  #
  # SIKKERHED: wake-automationen ovenfor flipper huset til Active i samme sekund
  # NOGEN kanal bliver `on`, så "vi er Dormant" er i praksis lig med "alle
  # levende kanaler er off". `ingen_levende_on`-conditionen er alligevel med som
  # værn mod kapløbet i det ene sekund hvor to kanaler skifter samtidig — den
  # kopierer ingen regel (fejlklasse #2), den nægter blot at handle i tvivl.
  # Selve sluk-reglen er stadig scriptets, ét sted.
  # ---------------------------------------------------------------------------
  - id: airbnb_dormant_resweep_efter_blind_kanal
    alias: "AirBnB Dormant: blind kanal kom tilbage → sluk det fredede rum"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: !include ../rosters/husets_occupancy.yaml
        # BEVIDST INTET `from:` — og det er en UNDTAGELSE fra B103, ikke en
        # forglemmelse. Denne automation lever af præcis den flanke B103's sweep
        # er bygget til at spærre (`unavailable → off`), så et mekanisk indsat
        # `from:` gør den til en garanteret no-op: 2026-09-09 blev `from: "on"`
        # indsat her, hvorefter conditionen "kom kanalen tilbage fra at være
        # blind?" aldrig kunne være sand. Undtagelsen er derfor kodet i
        # `scripts/b103_scan.py`s allowlist, så næste sweep ikke gentager det.
        #
        # Flanken er ufiltreret fordi en blind kanal kommer tilbage ad TO veje
        # (målt over 225 blinde perioder i recorderen 09-10):
        #   • `unavailable → off` direkte ...... 187 (83 %)
        #   • `unavailable → on → off` ......... 38 (17 %) — Matter-ekkoet
        #     genopstår med sidste kendte værdi (permanent faktum), så rummet er
        #     først bevisligt tomt ved det EFTERFØLGENDE `on → off`.
        # Et `from: ['unavailable','unknown']` ville altså stadig misse hver
        # sjette genopståen. Prisen for den brede flanke er nogle ekstra
        # sweep-kald i Dormant, hvor sweep'en pr. konstruktion kun slukker lys
        # der er tændt og re-freder rum der stadig er blinde = samme regel,
        # re-asserteret. Fejlretningen peger derfor den rigtige vej.
        to: "off"
        for:
          minutes: 2
    condition:
      - condition: state
        entity_id: input_select.house_mode
        state: "AirBnB"
      - condition: state
        entity_id: input_select.house_state
        state: "Dormant"
      - condition: template
        value_template: >-
          {% from 'rosters.jinja' import husets_occupancy %}{{ not (husets_occupancy
             | select('is_state', 'on') | list | count) }}
    action:
      - service: script.airbnb_dormant_lys_sweep
        data:
          transition: 15
      - service: logbook.log
        data:
          name: "AirBnB-Dormant"
          message: >-
            {{ trigger.entity_id }} er tilbage og melder tomt — sluk-sweep'en
            kørt igen, så et rum der blev fredet mens kanalen var blind ikke
            står og lyser resten af dvalen.
          entity_id: input_select.house_state

  # --- Manual DORMANT ---
  - id: house_manual_dormant
    alias: "Hus: Manuel dvale (Somrig)"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.manual_dormant_override
        to: "on"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.house_state
        data:
          option: "Dormant"
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.godnat_active
            - input_boolean.godnat_boern_active
            - input_boolean.godnat_voksne_active
            - input_boolean.godnat_pending
      - service: light.turn_off
        target:
          entity_id: all
        data:
          transition: 5
      - service: cover.close_cover
        target:
          entity_id: !include ../rosters/alle_gardiner.yaml

  # --- Manual ACTIVE ---
  - id: house_manual_active
    alias: "Hus: Manuel aktivering (Somrig)"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.manual_dormant_override
        to: "off"
    condition:
      - condition: state
        entity_id: input_select.house_state
        state: "Dormant"
      # 2026-06-30 (user undtagelse 3): denne familie-homecoming åbner ALLE
      # gardiner ubetinget → må ikke køre i AirBnB (ingen auto-gardin-OP).
      # AirBnB Active-transitions håndteres af house_airbnb_to_active.
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: "AirBnB"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.house_state
        data:
          option: "Active"
      # Open ALL curtains — we are coming home, no time guard.
      # 🌙 2026-07-15 (fejlklasse #1-sweep): ÉN undtagelse — sove-gardinet
      # springes over i morgen-beskyttelses-vinduet (partneren sover stadig;
      # user-spec 2026-07-04: "soveværelset skal holdes slukket lys og gardin").
      # 2026-07-28: + manuel-hold-filteret (se gardin_manual_grace).
      - service: cover.open_cover
        target:
          entity_id: >-
            {% set held = state_attr('sensor.gardiner_manual_hold', 'held') | default([]) %}
            {% from 'rosters.jinja' import open_plan_gardiner %}{{ open_plan_gardiner
                | reject('in', held) | list }}
      # 2026-07-29: sove-gardinet er taget UD af listen og går gennem det bad-
      # gatede script, der selv holder snooze-, manuel-hold- og bad-vetoerne
      # (packages/sove_gardin_bad_gate.yaml). Ét sted, ni kaldere.
      - service: script.sove_gardin_op

  # Godnat is now activated ONLY via the physical Somrig button in soveværelse.
  # See automations/godmorgen_godnat.yaml — godnat_voksen_start (click up).
  # Auto-detection has been removed to avoid false triggers.

  # --- Godnat clears in the morning or when stue activity resumes ---
  - id: godnat_auto_clear
    alias: "Godnat: Deaktivér om morgenen"
    description: >
      Ends godnat when morning arrives — weekday-aware AND sleep-in-aware.
      Workdays: clears at 06:00 or when stue activity resumes → opens sove+børn
      curtains (open-plan curtains open ONLY via morning_curtains accumulation).
      Weekends/HomeVacation: only clears after 08:00 → opens børn curtain only.
      Soveværelse curtain stays closed on weekends; a companion automation
      (godmorgen_weekend_sovevaerelse_gardin) opens it at 09:00 so adults
      can sleep past 08:00 without Child A's footsteps flooding their room with light.
    mode: single
    trigger:
      # Someone enters the sofa area in the morning (user-spec 2026-06-12:
      # KUN stue sofa-Apollo — spisestue-trigger fjernet)
      - platform: state
        entity_id: binary_sensor.stue_apollo_occupancy_filtered
        from: "off"
        to: "on"
      # At 06:00 when kids' wake-up starts (workday only — see condition below).
      # Fyrer kun hvis nogen ALLEREDE er i stuen (occupancy-condition nedenfor);
      # ellers venter vi på state-triggeren.
      - platform: time
        at: "06:00:00"
      # Weekend-backstop: hvis nogen har siddet i stuen siden før 08:00 kommer
      # der intet nyt to:on-event — 08:00-triggeren fanger det (weekend-
      # condition nedenfor blokerer indtil 08).
      - platform: time
        at: "08:00:00"
      # R11 fix audit Phase 1 2026-05-07 PM: HA restart resilience. Hvis HA
      # restartes 06:01-09:00 efter 06:00-firing missed, conditions
      # re-evaluerer og fyrer hvis stadig appropriate.
      - platform: homeassistant
        event: start
      # 2026-08-14: re-arm når Sleep Over-mørket slipper (fejlklasse #4) —
      # 06:00-triggeren er væk for altid, og stue-Apolloen er typisk LATCHET on
      # efter en nat med en gæst på sofaen, så der kommer heller ingen ny
      # to:"on"-flanke. Uden denne ville godnat først blive ryddet 08:00.
      - platform: state
        entity_id: binary_sensor.sleepover_openplan_moerkt
        from: "on"
        to: "off"
    condition:
      - condition: state
        entity_id: input_boolean.godnat_active
        state: "on"
      # INCIDENT 2026-06-12 05:00: HA-restart (deploy) fyrede HA-start-
      # triggeren kl 05:00:48 → gardiner åbnede kl 05. User-spec: morgen-
      # clear må FØRST ske efter 06:00 OG kun når sofa-Apolloen ser nogen.
      - condition: time
        after: "06:00:00"
        before: "12:00:00"
      # User-spec 2026-06-12: gardiner åbner først når stue sofa-Apollo ser
      # bevægelse — gælder ALLE triggers (også 06:00/restart).
      - condition: state
        entity_id: binary_sensor.stue_apollo_occupancy_filtered
        state: "on"
      # 🛋️ 2026-08-14 (user-incident): sover der en gæst i open-plan, ER
      # stue-Apolloen gæsten — ikke "familien er stået op". Målt 14/8: hun
      # vendte sig 05:51:24, og 06:00:00 ryddede denne automation godnat +
      # åbnede sove-gardinet over to sovende voksne UDEN alarm. Vidnet er
      # simpelthen ikke gyldigt mens Sleep Over-mørket kører; ægte morgen-
      # aktivitet clearer stadig godnat ad de to andre veje, som begge kræver
      # et vidne der ikke kan være gæsten (godmorgen_auto_detect = entré-
      # VALLHORN, godmorgen_auto_clear = moving-target i sove/børn eller et
      # knap-tryk). Mørket slipper af sig selv ved sleepover_morgen_slut.
      - condition: state
        entity_id: binary_sensor.sleepover_openplan_moerkt
        state: "off"
      # Phase 5 fix audit Phase 4 2026-05-07 PM: HA-start trigger må KUN fyre
      # i 06-09 vinduet (= equivalent til missed 06:00 fire). Forhindrer
      # weekend-nap + restart kl 11:55 fra at trigger uventet curtain-open.
      - condition: template
        value_template: >-
          {{ trigger.platform != 'homeassistant' or (6 <= now().hour < 9) }}
      # 2026-10-06 (bug-hunt nat, #23): efter en restart er stue-occupancy den
      # GENSKABTE tilstand, ikke en observation — samme lære som
      # presence_resync_on_start.yaml. Ryddes godnat på den, mens I sover, kan
      # sove-presence tænde loftet på et still-target. Restart-grenen kræver
      # derfor et LIVE bevægelses-vidne; de øvrige grene er urørte, og ægte
      # morgenaktivitet rydder stadig via state-triggeren ved næste flanke.
      - condition: template
        value_template: >-
          {{ trigger.platform != 'homeassistant'
             or is_state('binary_sensor.stue_apollo_radar_moving_target', 'on') }}
      # Must have presence in the house (someone is home)
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.nogen_hjemme
            state: "on"
          - condition: state
            entity_id: binary_sensor.sovevaerelse_apollo_occupancy
            state: "on"
          - condition: state
            entity_id: binary_sensor.boernevaerelse_apollo_occupancy
            state: "on"
      # Weekday-aware: clear at 06:00 on workdays, but only after 08:00 on weekends
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.arbejdsdag
            state: "on"
          - condition: time
            after: "08:00:00"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: !include ../rosters/godnat_flag.yaml
      # Open curtains — on weekends/vacation, spare the soveværelse (sleep-in protection).
      # A companion automation opens soveværelse at 09:00 on those days.
      # 2026-07-02 FIX: open-plan-gardinerne (stue syd/vest + spisestue vest)
      # FJERNET herfra — de åbnes KUN af morning_curtains-akkumuleringen
      # (2026-06-19-design: "eneste åbner af open-plan om morgenen"; denne
      # automation var overset og åbnede dem instant ved første skridt i stuen).
      # 2026-07-28: børneværelset har ikke længere en gardin-motor → kun
      # sove-gardinet er tilbage her. Weekend/ferie lader det ligge til
      # godmorgen_weekend_sovevaerelse_gardin kl. 09:00 (sleep-in).
      - if:
          - condition: state
            entity_id: binary_sensor.arbejdsdag
            state: "on"
          # 🌙 2026-07-15 (fejlklasse #1-sweep): godnat clearer når Parent A+
          # datter står op ~05-06 — sove-gardinet må IKKE åbnes mens
          # morgen-beskyttelsen er aktiv (partneren sover; user-spec 2026-07-04).
          - condition: state
            entity_id: binary_sensor.sovevaerelse_morgen_beskyttelse_aktiv
            state: "off"
          # 2026-07-28: manuel-hold (manuel-ned-grace / putning) vinder også her.
          - condition: template
            value_template: >-
              {{ 'cover.gardin_sovevaerelse' not in
                 (state_attr('sensor.gardiner_manual_hold', 'held') | default([])) }}
        then:
          # 2026-07-29 (user-spec): bad-gated auto-op — holder på privacy indtil
          # badet har været tomt længe nok (packages/sove_gardin_bad_gate.yaml).
          - service: script.sove_gardin_op

  # --- Weekend: open soveværelse curtain at 09:00 (sleep-in protection) ---
  - id: godmorgen_weekend_sovevaerelse_gardin
    alias: "God morgen: Soveværelse gardin åbner kl. 09:00 (weekend)"
    description: >
      godnat_auto_clear skips soveværelse curtain on weekends so adults can
      sleep past 08:00 while kids are already in the stue. This automation
      opens it at 09:00, or immediately if godnat is still active at 09:00
      (e.g. everyone slept very late).
    mode: single
    trigger:
      - platform: time
        at: "09:00:00"
    condition:
      - condition: template
        value_template: >
          {{ now().isoweekday() > 5
             or is_state('input_select.house_mode', 'Home Vacation') }}
      - condition: state
        entity_id: input_select.house_state
        state: "Active"
      # 🌙 2026-07-15: skip hvis morgen-beskyttelsen stadig er aktiv kl 09
      # (user kan have flyttet _slut-slideren sent) — beskyttelse vinder.
      - condition: state
        entity_id: binary_sensor.sovevaerelse_morgen_beskyttelse_aktiv
        state: "off"
      # 2026-07-28: manuel-hold (manuel-ned-grace / putning) vinder også her.
      - condition: template
        value_template: >-
          {{ 'cover.gardin_sovevaerelse' not in
             (state_attr('sensor.gardiner_manual_hold', 'held') | default([])) }}
    action:
      # 2026-07-29 (user-spec): bad-gated auto-op (sove_gardin_bad_gate.yaml).
      - service: script.sove_gardin_op
