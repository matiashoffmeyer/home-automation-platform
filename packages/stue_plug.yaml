# =============================================================================
# Stue Hyggelampe — Innr-pære på fast strøm (lampe 2026-05-31, pære 2026-11-21)
# =============================================================================
# light.stue_hyggelampe_paere = Innr RB 282 C farvepære i sofa-hyggelampen (ex
# light.stue_sofa_lampe_2, en af skab-pærerne fra B132; registry-omdøbt 21/11).
# User 21/11: "udskiftet glødepæren på 38w i stuen med en innr fra skuffen …
# sæt dens on lys som en glødepære, hyggeligt, og giv mig slider for dens on
# farve og styrke" + samme morgen: "jeg hiver plug kontakten ud ved hyggelampen
# … den nye innr skal ha sin egen tile i stuen og hyggelampe plug skal i dvale".
# Glødepæren (målt 53-58 W) sad på switch.stue_plug (IKEA GRILLPLATS, Matter node
# 498). Pluggen er taget ud og står i DVALE (entities/device_inventory.yaml:
# grillplats_stue_plug) — dens entities er bevaret i registry, men ude af alt.
#
# WRAPPEREN light.stue_plug er stadig "hyggelampen" for husets automationer:
# ~80 steder læser/kalder den som et TÆND/SLUK-lys (fravalg i manual_override,
# spot-stedfortræderen, luksus-lys, AirBnB-følgeren, presence-sofa-målene,
# scener, grupper, natlig strømsvigt-sluk). Entity-id'et er beholdt (som
# light.spisestue_pendel) — kun indmaden er skiftet fra pluggen til pæren:
#   - tænd: pæren tænder i glødepære-lyset fra de to sliders herunder.
#     brightness/farve fra scener, festlys, dæmpere og el-pris når aldrig frem
#     (onoff-light — HA filtrerer dem fra; user-valg 2026-05-31: "tændt i alle
#     scener"). Lyser pæren allerede, sendes intet: scener og drift-back kalder
#     light.turn_on igen og igen, og et lys justeret i appen skal stå.
#   - sluk: pæren slukker.
#   - state + availability spejler pæren: en pære der taber radioen er
#     `unavailable`, ikke `off` → ingen off-vej fyrer på et radio-hul, og
#     ON-triggere med from: "off" ignorerer genkomsten.
# Pæren har sin egen tile i stuen (lys-dashboardet + status) og står UDE af
# rosters, grupper og effekter — ellers ville gruppe-kald overskrive look'et.
# continue_on_error: en Zigbee-timeout må ikke abortere kalderens script.
# =============================================================================
template:
  - light:
      # unique_id bevaret ⇒ registry-entry'en genbruges ⇒ light.stue_plug
      # beholder sit entity_id, uanset hvad `name:` slugifier til.
      - name: "Stue Hyggelampe"
        unique_id: stue_plug_light
        icon: mdi:floor-lamp
        availability: >-
          {{ states('light.stue_hyggelampe_paere') not in ['unavailable', 'unknown'] }}
        state: "{{ is_state('light.stue_hyggelampe_paere', 'on') }}"
        turn_on:
          - if: "{{ not is_state('light.stue_hyggelampe_paere', 'on') }}"
            then:
              - action: light.turn_on
                target:
                  entity_id: light.stue_hyggelampe_paere
                data:
                  color_temp_kelvin: "{{ states('input_number.stue_hyggelampe_kelvin') | int(2400) }}"
                  brightness_pct: "{{ [states('input_number.stue_hyggelampe_styrke') | int(70), 3] | max }}"
                continue_on_error: true
        turn_off:
          - if: "{{ not is_state('light.stue_hyggelampe_paere', 'off') }}"
            then:
              - action: light.turn_off
                target:
                  entity_id: light.stue_hyggelampe_paere
                continue_on_error: true

# =============================================================================
# Hyggelampe-fravalg (2026-10-17, user-spec: "det skal ikke sætte stuen i
# manuel tilstand at jeg slukker hyggelampen, men mit valg skal respekteres.")
# =============================================================================
# 17/10 06:36 slukkede user hyggelampen fra appen → manual_override satte HELE
# stuen i Manual → ild-løkken (og al anden auto i stuen) stod stille. Et app-
# sluk af KUN hyggelampen (light.stue_plug / pæren bag den) er nu et fravalg
# af den ene lampe, ikke en overstyring af rummet: manual_override sætter dette
# flag i stedet for Manual.
#
# Gates der tjekker flaget (fejlklasse #21 — hver auto-vej der tænder den):
#   - presence_light_sofa_on: sofa_on_targets   (automations/presence_stue.yaml)
#   - presence_lux_sofa_on:   sofa_on_targets   (automations/presence_lights.yaml)
#   - stue_hyggelampe_stedfortraeder_for_spots  (packages/thread_stedfortraedere.yaml)
#   - luksus_besparelse: et fravalg er ikke el-pris-besparelse
# Bevidst IKKE: scener, Styrbar og app-tænd (en finger) — de tænder den, og så
# rydder flaget sig selv (udgang 1).
#
# Udgange (automatiske, så en gæst aldrig hænger i det — AirBnB-reglen):
#   1. hyggelampen tænder, uanset kilde
#   2. stuen har været tom med hele sofa-zonen slukket i 10 min (= sessionen
#      er slut; næste gang man sætter sig, er lampen med igen)
#   3. AirBnB entry/exit (flag-clear-listerne i automations/airbnb_mode.yaml)
input_boolean:
  # Ingen `initial:` — et fravalg skal overleve en restart midt i aftenen.
  stue_hyggelampe_fravalgt:
    name: "Stue: hyggelampe fravalgt"
    icon: mdi:floor-lamp-outline

# =============================================================================
# Hyggelampens glødepære-look (2026-11-21, user-spec: "sæt dens on lys som en
# glødepære, hyggeligt, og giv mig slider for dens on farve og styrke")
# =============================================================================
# Ingen `initial:` (den påtvinger ved hver start). Defaults 2400 K / 70 %: en
# glødepære på fuld spænding er ~2700 K, en hyggeligt dæmpet ~2200-2400 K
# (husets aften-varme: godnat_kelvin 2326 K). 70 % er et skøn, ikke en måling —
# den gamle pære trak 53-58 W, den nye pæres lumen er ikke målt. Kalibrér mod
# lux-springet i ai_feedback/lux_lampe_feedback.jsonl (B178): stue_plug-rækker
# før 21/11 = glødepæren, efter = Innr'en (open_plan_lampe_tilstand logger fra
# 21/11 pærens styrke i stedet for wrapperens 0).
input_number:
  stue_hyggelampe_kelvin:
    name: "Stue: hyggelampe farve"
    min: 1800  # pærens min_color_temp_kelvin = 1798
    max: 4000
    step: 50
    unit_of_measurement: K
    icon: mdi:thermometer
    mode: slider
  stue_hyggelampe_styrke:
    name: "Stue: hyggelampe styrke"
    min: 5  # brightness 1 er et SLUK på Innr (lys_paerer.md)
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-6
    mode: slider

automation:
  - id: stue_hyggelampe_fravalg_ryd
    alias: "Stue: ryd hyggelampe-fravalg (tændt / sessionen slut)"
    mode: single
    trigger:
      - platform: state
        entity_id: light.stue_plug
        from: "off"
        to: "on"
        id: taendt
      # Eksplicitte is_state-kald = entity-tracking i template-triggeren.
      - platform: template
        value_template: >-
          {{ is_state('binary_sensor.stue_apollo_occupancy_filtered', 'off')
             and not is_state('light.stue_sofa_lampe', 'on')
             and not is_state('light.stue_hjoernelampe', 'on')
             and not is_state('light.stue_plug', 'on')
             and not is_state('light.stue_laesehygge', 'on') }}
        for:
          minutes: 10
        id: tomt
    condition:
      - condition: state
        entity_id: input_boolean.stue_hyggelampe_fravalgt
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.stue_hyggelampe_fravalgt
      - service: logbook.log
        data:
          name: "Hyggelampe-fravalg"
          message: >-
            {{ 'hyggelampen blev tændt' if trigger.id == 'taendt'
               else 'stuen tom og sofa-zonen slukket i 10 min' }} → fravalget ryddet
          entity_id: light.stue_plug

  # ===========================================================================
  # Glødepære-lyset: de to sliders → pæren (2026-11-21)
  # ===========================================================================
  # Tænder og slukker ALDRIG selv — sætter kun look'et:
  #   1. Live: flyttes en slider mens lampen lyser, sendes det nye look som ét
  #      light.turn_on. En slukket lampe tænder i det næste gang (wrapperen).
  #   2. NVRAM: power-on behavior On + start-up niveau + start-up farve-
  #      temperatur = sliderne. Så tænder pæren SELV i lyset når strømmen kommer
  #      (lampens egen kontakt, strømsvigt) — som en glødepære, uden at vente på
  #      et Zigbee-kald. On, ikke PreviousValue: husets standard for rum-lys, og
  #      natlig strømsvigt slukker den igen via wrapperen i alle_lys
  #      (stroemsvigt_nat_lys_sluk). Skrives KUN ved forskel (flash-slid; samme
  #      princip som automations/bulb_firmware_defaults.yaml) — også når pæren
  #      kommer tilbage på nettet (et skriv mens den var væk nåede ikke frem) og
  #      efter en restart.
  # Ingen gate på house_mode: gæster får samme hyggelampe (ingen familie-rutine,
  # intet flag). Ikke en suppressor/enforcer — et direkte app-skift på pæren
  # står, til huset næste gang tænder lampen eller en slider flyttes.
  - id: stue_hyggelampe_gloedepaere_lys
    alias: "Stue: hyggelampens glødepære-lys (sliders → pæren)"
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.stue_hyggelampe_kelvin
          - input_number.stue_hyggelampe_styrke
        to: ~
        for:
          seconds: 1
        id: slider
      # Tilbage på nettet (radio-hul, lampens kontakt, strømsvigt) → kun NVRAM.
      - platform: state
        entity_id: light.stue_hyggelampe_paere
        from: "unavailable"
        id: tilbage
      # Restart: en slider flyttet mens HA var nede → kun NVRAM-tjekket, intet
      # live-kald på en lampe der allerede lyser.
      - platform: homeassistant
        event: start
        id: start
    action:
      - variables:
          kelvin: "{{ states('input_number.stue_hyggelampe_kelvin') | int(2400) }}"
          styrke: "{{ [states('input_number.stue_hyggelampe_styrke') | int(70), 3] | max }}"
          niveau: "{{ (styrke * 254 / 100) | round(0) | int }}"
          mired: "{{ (1000000 / kelvin) | round(0) | int }}"
      # Lige efter boot/genkomst svarer pæren ikke altid endnu (ZHA initialiserer).
      - if:
          - condition: trigger
            id:
              - start
              - tilbage
        then:
          - delay:
              seconds: "{{ 60 if trigger.id == 'start' else 10 }}"
      - condition: template
        value_template: >-
          {{ states('light.stue_hyggelampe_paere') not in ['unavailable', 'unknown'] }}
      # En slukket pære vækkes ikke af en slider.
      - if:
          - condition: trigger
            id: slider
          - condition: state
            entity_id: light.stue_hyggelampe_paere
            state: "on"
        then:
          - action: light.turn_on
            target:
              entity_id: light.stue_hyggelampe_paere
            data:
              color_temp_kelvin: "{{ kelvin }}"
              brightness_pct: "{{ styrke }}"
              transition: 1
            continue_on_error: true
      # NVRAM — kun ved forskel (±2 = afrunding mellem %, 0-254 og mired).
      - if:
          - condition: template
            value_template: >-
              {{ states('select.stue_hyggelampe_paere_power_on_behavior')
                 not in ['unavailable', 'unknown', 'On'] }}
        then:
          - action: select.select_option
            target:
              entity_id: select.stue_hyggelampe_paere_power_on_behavior
            data:
              option: "On"
            continue_on_error: true
      - if:
          - condition: template
            value_template: >-
              {% set v = states('number.stue_hyggelampe_paere_power_on_level') %}
              {{ v | is_number and (v | float(0) - niveau | int) | abs > 2 }}
        then:
          - action: number.set_value
            target:
              entity_id: number.stue_hyggelampe_paere_power_on_level
            data:
              value: "{{ niveau }}"
            continue_on_error: true
      - if:
          - condition: template
            value_template: >-
              {% set v = states('number.stue_hyggelampe_paere_start_up_color_temperature') %}
              {{ v | is_number and (v | float(0) - mired | int) | abs > 2 }}
        then:
          - action: number.set_value
            target:
              entity_id: number.stue_hyggelampe_paere_start_up_color_temperature
            data:
              value: "{{ mired }}"
            continue_on_error: true
