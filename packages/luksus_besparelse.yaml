# =============================================================================
# Luksus-lys-blokken i kroner — hvad sparer vi ved IKKE at tænde? (2026-07-30)
# =============================================================================
# User-spec: "på statistik siden skal jeg ha en All Time Total Sparet på smart
# el forbrug (lader og dæmpning og luksus-block)". Lader + dæmpning bogførte
# allerede kroner; luksus-blokken (packages/luksus_lys.yaml) var den tredje
# kilde uden regnskab. Denne pakke lukker hullet, så
# sensor.el_besparelse_total (packages/elpris_styring.yaml) dækker alle tre.
#
# MODELLEN er enklere end de to andre, fordi faktisk-forbruget er NUL pr.
# konstruktion: blokken tænder aldrig noget, den forhindrer en tænding.
#   besparelse = (effekt lyset VILLE have brugt) × all-in prisen, integreret
#
# COUNTERFACTUALET ER GATE-BETINGELSERNE, IKKE ET GÆT. For hvert luksus-lys
# spejles præcis de betingelser dets auto-tænd-sti kræver — minus blokken selv.
# Er alle opfyldt, og lyset er slukket, så er det blokken der holder det nede.
# Derfor tælles der f.eks. intet om dagen (dusk-gaten er lukket), intet under
# regn (pluggen er død alligevel) og intet når lyset er tændt manuelt.
#
#   🌿 light.terrasse_paerelyskaede — dusk-auto-tænd (automation C i
#      automations/terrace_plug_control.yaml). Vinduet er sol < −4° og varer til
#      nat-sluk/godnat, dvs. i praksis ~1 t i juli og ~7 t i december → det er
#      HER pengene ligger, og posten vokser af sig selv hen mod vinteren.
#      Styrken er den sol-tilpassede (script.terrasse_paerelys_til) hhv.
#      flagermus-dæmpningen — samme valg som automationen ville have truffet.
#
#   🧸 light.boernevaerelse_hygge_strip — natlyset efter putning. Ankeret er
#      input_boolean.godnat_boern_active, som godnat-sekvensen sætter LIGE FØR
#      den fader strippen til natlys (automations/godnat_night.yaml): står det
#      on og strippen er slukket under blok, er natlyset blevet undertrykt.
#      Beløbet er mikroskopisk (10 W × 1 % = 0,1 W) og er med for regnskabets
#      skyld, ikke for kronernes.
#      IKKE talt: de sekund-korte presence-/putte-tændinger som suppressoren
#      slår ihjel efter 0,5 s. De er værd < 0,001 kr og ville kræve stempel-
#      helpers at fange — bevidst fravalgt (under-tæller, aldrig over-tæller).
#
#   🛋️ light.stue_plug — sofa-hyggelampen (39 W GLØDEPÆRE, målt 2026-07-31).
#      Dens to auto-tænd-stier tænder HELE sofa-zonen fra én liste, og blokken
#      er et filter på den liste (mønster A). Counterfactualet er derfor: står
#      mindst ét af de fire ØVRIGE sofa-lys tændt mens hyggelampen er slukket,
#      så passerede gaterne (lux, sol, godnat, Active, Manual …) — de tændte jo
#      resten — og det er filteret der holder hyggelampen nede. At spejle lux-
#      gaten direkte ville være FORKERT her: sofa-lamperne hæver selv
#      open_plan_lux over sin egen tærskel, så gaten er falsk kort efter tænd.
#      Manuel-stier er ude via room_mode_stue != Manual (manual_override sætter
#      Manual ved app-tænd) — Styrbar-toggle tænder hele zonen, så det ene
#      tilfælde der kunne over-tælle (bruger tænder KUN de fire andre i hånden)
#      er ikke muligt uden at gå via appen. Beløbet er husets største luksus-post
#      efter terrassen: 39 W i en dyr aftentime ≈ 0,10 kr/t.
# ⚠️ ROSTER-DRIFT (fejlklasse #16): light.luksus_lys er single source of truth
# for HVILKE lys der blokeres, men et lys' counterfactual-vindue kan kun skrives
# i hånden. Tilføjer du et lys til gruppen, så tilføj også dets vindue herunder
# — ellers blokeres det uden at nogen kan se hvad det sparer. Begge led gates
# desuden på medlemskab, så et lys der FJERNES fra gruppen holder op med at
# tælle af sig selv.
#
# ⚠️ FEJLKLASSE #2 (samme regel to steder): betingelserne herunder er en KOPI af
# gate-betingelserne. Ændrer du dusk-gaten i automations/terrace_plug_control.
# yaml eller natlys-trinnet i automations/godnat_night.yaml, så ret her også —
# begge steder har en kommentar der peger tilbage hertil.
#
# MORGENLYSET (packages/terrasse_morgenlys.yaml, 2026-10-02) har samme luksus-
# gate men tælles bevidst IKKE her: 20 % × 6 W = 1,2 W — vi under-tæller hellere.
#
# AIRBNB: terrasse-leddet kræver house_mode Normal (samme som gaten) og er
# dermed 0 for en gæst. Børne-leddet gates eksplicit til Normal/Home Vacation,
# fordi AirBnB-natmoden sætter godnat_boern_active DIREKTE (packages/
# airbnb_natmode.yaml) uden at der har været nogen putning — et blokeret natlys
# vi ikke kan skelne fra "der var aldrig et barn". Vi under-tæller hellere.
# Tallene er kroner, ikke tilstedeværelses-mønstre → intet at rydde ved
# mode-skift, intet med i privacy-purgen.
# =============================================================================

template:
  - sensor:
      # --- Effekt vi IKKE bruger lige nu, fordi blokken er aktiv (W) ---------
      # Max-watt pr. pære er de samme skøn som packages/energy_estimate.yaml
      # bruger (terrasse-kæde 6 W, børne-strip 10 W) — ret begge steder.
      # Sofa-hyggelampens 39 W er derimod MÅLT (Innr-pluggens effektmåler).
      # energy_estimate læser den live sensor; her SKAL det være konstanten,
      # for et blokeret lys måler 0 W — det er netop pointen.
      - name: "Luksus blokeret effekt"
        unique_id: luksus_blokeret_effekt
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:lightbulb-off-outline
        state: >-
          {% set blok = is_state('binary_sensor.luksus_lys_elpris_block', 'on') %}
          {% set med = state_attr('light.luksus_lys', 'entity_id') or [] %}
          {% set elev = state_attr('sun.sun', 'elevation') | float(0) %}

          {# --- 🌿 Terrasse-pærelyskæden: dusk-gatens betingelser, minus blokken.
             `not is_state(...,'on')` (ikke `== 'off'`) matcher gaten: er pærerne
             unavailable fordi pluggen er slukket, tænder dusk-stien pluggen. #}
          {% set t_blokeret = blok
             and 'light.terrasse_paerelyskaede' in med
             and not is_state('light.terrasse_paerelyskaede', 'on')
             and elev < (states('input_number.terrasse_skumring_elevation') | float(-4))
             and is_state('binary_sensor.terrasse_nat_sluk_vindue', 'off')
             and not (4 <= now().hour < 12)
             and is_state('input_boolean.terrace_presence_enabled', 'on')
             and is_state('input_boolean.godnat_active', 'off')
             and is_state('input_select.house_state', 'Active')
             and is_state('input_select.house_mode', 'Normal')
             and is_state('input_boolean.cirkus_active', 'off')
             and not is_state('binary_sensor.terrasse_regn_aktiv', 'on')
             and is_state('input_boolean.terrasse_plug_manual_off_hold', 'off') %}

          {# Styrken dusk-stien VILLE have brugt: flagermus-dæmpning (u-skaleret)
             når flagermus-mode kører uden gæster, ellers script.terrasse_paerelys_
             til's sol-trappe × global brightness-faktor, clampet 5-100 %. #}
          {% set flagermus = is_state('input_boolean.flagermus_enabled', 'on')
                             and is_state('binary_sensor.gaester_for_nylig', 'off') %}
          {% set base = 40 if elev >= -6 else (65 if elev >= -12 else 90) %}
          {% set sol_pct = [[(base * (states('sensor.global_brightness_factor') | float(1.0)))
                             | round(0) | int, 100] | min, 5] | max %}
          {% set t_pct = (states('input_number.flagermus_dusk_dim_pct') | int(20))
                         if flagermus else sol_pct %}
          {% set t_w = (6.0 * t_pct / 100) if t_blokeret else 0 %}

          {# --- 🧸 Børne-strippens natlys efter putning ------------------------ #}
          {% set b_blokeret = blok
             and 'light.boernevaerelse_hygge_strip' in med
             and not is_state('light.boernevaerelse_hygge_strip', 'on')
             and is_state('input_boolean.godnat_boern_active', 'on')
             and states('input_select.house_mode') in ['Normal', 'Home Vacation'] %}
          {% set b_w = (10.0 * (states('input_number.global_putte_natlys_brightness')
                                | float(1) / 100)) if b_blokeret else 0 %}

          {# --- 🛋️ Sofa-hyggelampen: resten af sofa-zonen er tændt uden den ---- #}
          {% set sofa_ovrige = ['light.stue_sofa_lampe', 'light.stue_sofa_lampe_2',
                                'light.stue_hjoernelampe', 'light.stue_laesehygge'] %}
          {% set s_blokeret = blok
             and 'light.stue_plug' in med
             and not is_state('light.stue_plug', 'on')
             and is_state('input_boolean.stue_hyggelampe_fravalgt', 'off')
             and (sofa_ovrige | select('is_state', 'on') | list | count) > 0
             and not is_state('input_select.room_mode_stue', 'Manual')
             and is_state('input_select.house_state', 'Active')
             and states('input_select.house_mode') in ['Normal', 'Home Vacation'] %}
          {% set s_w = 39.0 if s_blokeret else 0 %}

          {{ (t_w + b_w + s_w) | round(3) }}
        attributes:
          # Hvilke lys der bidrager lige nu — gør tallet aflæseligt i UI'et uden
          # at man skal regne baglæns.
          blokerede_lys: >-
            {% set blok = is_state('binary_sensor.luksus_lys_elpris_block', 'on') %}
            {% set elev = state_attr('sun.sun', 'elevation') | float(0) %}
            {% set ns = namespace(l=[]) %}
            {% if blok and not is_state('light.terrasse_paerelyskaede', 'on')
                  and elev < (states('input_number.terrasse_skumring_elevation') | float(-4))
                  and is_state('binary_sensor.terrasse_nat_sluk_vindue', 'off')
                  and is_state('input_boolean.terrace_presence_enabled', 'on')
                  and is_state('input_boolean.godnat_active', 'off')
                  and is_state('input_select.house_state', 'Active')
                  and is_state('input_select.house_mode', 'Normal')
                  and is_state('input_boolean.cirkus_active', 'off')
                  and not is_state('binary_sensor.terrasse_regn_aktiv', 'on')
                  and is_state('input_boolean.terrasse_plug_manual_off_hold', 'off') %}
              {% set ns.l = ns.l + ['terrasse-pærelyskæde'] %}
            {% endif %}
            {% if blok and not is_state('light.boernevaerelse_hygge_strip', 'on')
                  and is_state('input_boolean.godnat_boern_active', 'on')
                  and states('input_select.house_mode') in ['Normal', 'Home Vacation'] %}
              {% set ns.l = ns.l + ['børne-natlys'] %}
            {% endif %}
            {% set sofa_ovrige = ['light.stue_sofa_lampe', 'light.stue_sofa_lampe_2',
                                  'light.stue_hjoernelampe', 'light.stue_laesehygge'] %}
            {% if blok and not is_state('light.stue_plug', 'on')
                  and is_state('input_boolean.stue_hyggelampe_fravalgt', 'off')
                  and (sofa_ovrige | select('is_state', 'on') | list | count) > 0
                  and not is_state('input_select.room_mode_stue', 'Manual')
                  and is_state('input_select.house_state', 'Active')
                  and states('input_select.house_mode') in ['Normal', 'Home Vacation'] %}
              {% set ns.l = ns.l + ['sofa-hyggelampe'] %}
            {% endif %}
            {{ ns.l | join(', ') if ns.l | count > 0 else 'ingen' }}

      # --- Sparet-RATE (kr/h) -----------------------------------------------
      # Ingen baseline/faktisk-par som hos lys og cykel-lader: faktisk ER 0, så
      # den blokerede effekt × prisen ER besparelsen. Prisen er den samme all-in
      # pris de to andre kilder bruger (packages/setup_cost.yaml) → de tre tal
      # kan lægges sammen uden omregning.
      - name: "Luksus kost rate sparet"
        unique_id: luksus_kost_rate_sparet
        unit_of_measurement: "kr/h"
        icon: mdi:cash-lock
        state: >-
          {{ ((states('sensor.luksus_blokeret_effekt') | float(0)) / 1000
              * (states('sensor.elpris_allin_aktuel') | float(0))) | round(6) }}

sensor:
  # --- Riemann-integration → akkumuleret kr (all-time, restore'es ved restart) -
  # Kan aldrig falde (raten er ≥ 0), modsat cykel-laderens der må gå negativ.
  - platform: integration
    name: "Luksus besparelse total"
    unique_id: luksus_besparelse_total
    source: sensor.luksus_kost_rate_sparet
    method: left
    unit_time: h
    round: 4

utility_meter:
  luksus_besparelse_idag:
    source: sensor.luksus_besparelse_total
    cycle: daily
    name: "Luksus besparelse i dag"
