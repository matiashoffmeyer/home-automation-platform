# =============================================================================
# Flagermus-venlig terrasse — dæmpet lyskæde + tidlig curfew (user-spec 2026-07-18)
# =============================================================================
# User: "jeg vil bare ikke forurene med lys for flagermus." Flagermus bliver
# aktive omkring borgerligt tusmørke (sol ~-6°) og er meget lysfølsomme.
#
# DENNE PAKKE ER *IKKE* et parallelt lyskæde-system. Terrasse-pærelyskæden
# (light.terrasse_paerelyskaede) har allerede mange med-ejere (fejlklasse #1):
# dusk-auto-on + nat-auto-sluk + Styrbar + regn-hold + AirBnB-zen (se
# automations/terrace_plug_control.yaml + packages/terrasse_plug.yaml +
# automations/airbnb_mode.yaml). Vi GENBRUGER det maskineri og lægger kun tre
# ekstra flagermus-lag oven på — vi duplikerer HVERKEN sol-grænse-slideren
# (input_number.terrasse_skumring_elevation FINDES) eller nat-sluk-tiden
# (input_datetime.terrasse_lys_nat_sluk_tid FINDES). En Gemini-genereret
# bat_sun_elevation/bat_curfew_time ville have kollideret med begge.
#
# 3-fase aften når flagermus_enabled = ON (kun house_mode Normal):
#   1. DUSK (sol < -4°, eksisterende trigger): auto-tænd på flagermus_dusk_dim_pct
#      (default 20 %) i stedet for den dekorative 40-90 % sol-styrke.
#   2. flagermus_ekstra_dim_tid (default 22:30): dæmp til flagermus_ekstra_dim_pct
#      (default 5 %) — "ekstremt dim i hvert fald" (user-spec).
#   3. flagermus_curfew_tid (user sætter selv, default 23:00): HÅRD sluk =
#      totalt mørke resten af natten.
#
# GÆSTE-AFTEN SUSPENDERER ALLE TRE LAG (user-spec 2026-07-25): er
# binary_sensor.gaester_for_nylig on (people-estimate over familie-baseline
# indenfor suppression-vinduet), kører dusk dekorativt og ekstra-dæmp/curfew
# springes over. Se packages/gaesteaften.yaml (07-24-incident).
#
# MANUEL ER HELT FRI (user-valg): Styrbar/app-tænd går uden om alle tre lag
# (script.terrasse_paerelys_til uændret). De to tid-automations rører KUN en
# allerede tændt kæde (dæmper/slukker) — de TÆNDER aldrig selv. Slår du
# flagermus_enabled OFF, får du den gamle dekorative rytme (40-90 % + 23:30
# blød nat-sluk) tilbage uændret — toggle er en ren kill-switch.
#
# Snapshot: flagermus_enabled fanges af helpers_export (_enabled-reglen),
# begge sliders er input_number-config, begge tider er tilføjet DATETIME_CONFIG.
# =============================================================================

input_boolean:
  # Master kill-switch (default ON via init). ON = flagermus-venlig auto-rytme;
  # OFF = gammel dekorativ rytme (40-90 % dusk + 23:30 blød nat-sluk).
  flagermus_enabled:
    name: "Flagermus-venlig terrasse"
    icon: mdi:bat

input_number:
  # Dusk-auto-tænd styrke når flagermus-mode ON. Bevidst IKKE skaleret af den
  # globale lys-aggressivitet (flagermus-beskyttelse skal være absolut lav).
  flagermus_dusk_dim_pct:
    name: "Flagermus: dusk-dæmp %"
    min: 1
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-5
    mode: slider

  # "Ekstremt dim"-niveau fra ekstra-dim-tid til curfew.
  flagermus_ekstra_dim_pct:
    name: "Flagermus: ekstra-dæmp % (fra dim-tid)"
    min: 1
    max: 50
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-2
    mode: slider

input_datetime:
  # Fra dette tidspunkt dæmpes kæden til ekstra-dæmp % (hvis den er tændt).
  flagermus_ekstra_dim_tid:
    name: "Flagermus: ekstra-dæmp fra kl."
    icon: mdi:weather-night
    has_date: false
    has_time: true

  # Hård sluk = totalt mørke resten af natten. User sætter selv (default 23:00).
  flagermus_curfew_tid:
    name: "Flagermus: curfew (hård sluk) kl."
    icon: mdi:moon-waning-crescent
    has_date: false
    has_time: true
