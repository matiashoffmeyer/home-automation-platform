# =============================================================================
# Putning i voksen-værelset (sove) — 2026-07-22, user-spec
# =============================================================================
# User: "vi putter børn i voksen-værelset, holder lyset slukket der mens
# resten af huset fungerer normalt" + (2026-07-22, godnat-knap-delen FJERNET
# 2026-09-30, se AKTIVERING) "udover manuel tile skal det også erklæres ved
# tryk på godnat-knappen FØR kl. 21.00 …; auto-detect-godnat skal ikke køre
# når der er trykket præ-21."
#
# MODEL:
#   input_boolean.putning_sove_active = "børn puttes/sover i voksen-værelset".
#   AKTIVERING: KUN den manuelle toggle-tile (settings/status-dashboard).
#     Godnat-knappen i voksenværelset (sove-Somrig NED) aktiverede den også
#     2026-07-22 → 2026-09-30 i vinduet 16:00 → en grænse-slider; FJERNET
#     2026-09-30 (user: "det er jo styrbar børneværelse den regel gælder for!
#     ikke godnat knappen som er i voksen værelset!"). Godnat-knappen er nu
#     altid fuld godnat, og slideren input_datetime.putning_sove_graense er
#     slettet. Putte-reglen bor på børneværelsets Styrbar
#     (puttelys_styrbar_start i automations/putning_auto_detect.yaml).
#   VED AKTIVERING: sove-lys blødt off (6s) + sove-gardin ned (cover.gardin_
#     sovevaerelse parret 2026-07-24; continue_on_error beholdt som defensiv).
#   MENS AKTIV: alt auto-TÆND i sove er gated af (flag-condition i):
#     - presence_sovevaerelse.yaml: tænd, gang-early-detect pre-lys, hygge-fade
#     - presence_lights.yaml: sove tænd ved LUX-fald
#     - godmorgen_godnat.yaml: sengelys ved sengetid
#     - godnat_auto_declare.yaml: auto-godnat (user-spec: må ikke køre præ-21)
#     - putning_auto_detect.yaml: Trigger A+B (putningen sker i SOVE — børne-
#       værelsets passive detektorer skal ikke arme fase 1 / natlys derinde)
#     - gardin_manual_grace.yaml (2026-07-28): sove-gardinet lægges i
#       sensor.gardiner_manual_hold's 'held' → auto-OP-kilderne (Active,
#       godnat-morgen, weekend 09:00, godmorgen, sæson-forsvarets genåbning)
#       springer det over, uafhængigt af grace-slideren. Dark Mode- og
#       Pre-Dark-restore springer sove over via en EGEN putning-test (de kan
#       ikke læse 'held' — se hold-sensorens header). Vækningen er den ENESTE
#       bevidste undtagelse (user-spec: "en stillet alarm er dit eget valg").
#     Fysisk betjening (sove-Somrig OP, RODRET) virker fortsat = manuel vinder.
#     Resten af huset: INGEN ændringer — kører helt normalt.
#   CLEAR (3 veje, jf. user-valg "voksen-godnat + morgen"):
#     1. godnat_voksne_active → on (godnat-knap efter 21 / force / nattur-flow)
#        → godnat ejer nu mørket i hele huset, flaget er overflødigt.
#     2. Morgen-backstop kl 06:00 (matcher godnat_auto_clear-tiden).
#     3. Manuel toggle off. (Ingen lys-genopretning ved clear — rummet er
#        mørkt og skal forblive mørkt/presence-styret naturligt.)
# =============================================================================

input_boolean:
  putning_sove_active:
    name: "Putning i voksen-værelset"
    icon: mdi:bed-king

automation:
  # Flag tændt (via tilen) → mørklæg soveværelset.
  - id: putning_sove_on_actions
    alias: "Putning sove: aktivér → sluk sove-lys + gardin ned"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.putning_sove_active
        to: "on"
    action:
      - service: light.turn_off
        target: {entity_id: light.sovevaerelse_all}
        data: {transition: 6}
      # Gardinet er parret + kalibreret (2026-07-24/28); continue_on_error
      # beholdt som defensiv mod Zigbee-flap. Mens flaget er on holder
      # sensor.gardiner_manual_hold gardinet nede — ingen auto-OP rører det.
      - service: cover.close_cover
        continue_on_error: true
        target: {entity_id: cover.gardin_sovevaerelse}
      - service: logbook.log
        data:
          name: "Putning sove"
          message: "Aktiveret — sove mørklagt, auto-tænd blokeret, resten af huset normalt"
          entity_id: input_boolean.putning_sove_active

  # Clear-vej 1: voksen-godnat startede (knap efter 21 / force / nattur) →
  # godnat-flowet ejer nu mørket i hele huset.
  - id: putning_sove_clear_ved_godnat
    alias: "Putning sove: clear ved voksen-godnat"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.godnat_voksne_active
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.putning_sove_active
        state: "on"
    action:
      - service: input_boolean.turn_off
        target: {entity_id: input_boolean.putning_sove_active}
      - service: logbook.log
        data:
          name: "Putning sove"
          message: "Clearet — voksen-godnat overtog"
          entity_id: input_boolean.putning_sove_active

  # Clear-vej 2: morgen-backstop (glemte flag må ikke blokere sove-auto-lys
  # dagen efter). 06:00 = samme bagkant som godnat_auto_clear.
  - id: putning_sove_morning_clear
    alias: "Putning sove: morgen-backstop clear (06:00)"
    mode: single
    trigger:
      - platform: time
        at: "06:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.putning_sove_active
        state: "on"
    action:
      - service: input_boolean.turn_off
        target: {entity_id: input_boolean.putning_sove_active}
      - service: logbook.log
        data:
          name: "Putning sove"
          message: "Clearet — morgen-backstop 06:00"
          entity_id: input_boolean.putning_sove_active
