# =============================================================================
# openplan_entre_velkomst.yaml — open plan tænder på ENTRÉ-bevægelse en mørk
# morgen (2026-10-07, user-spec)
# =============================================================================
# User: "på mørke morgener som i dag så er entre bevægelse om morgenen nok til
# at open plan skal tændes sig så man bydes velkommen." Og samme dag: "men husk
# der skal stadig være en blid ramp som køkken fx har nu, det er rart tempo om
# morgenen."
#
# HVORFOR DET IKKE SKETE (målt 07/10): ingen af open-plannets tændveje lytter
# på entréen. Alle tre (køkken-lyskædens første lys, Spisestue tænd, Sofa-stue
# tænd) trigger KUN på bevægelse I open plan. Det var ikke en lux- eller
# vindues-gate der sagde nej: godnat ryddedes 06:20:02, første entré-flanke kom
# 06:24:27 (open_plan_lux 0,0), men user var omkring entré/bad i 18 min og
# open plan tændte først 06:42:51, da køkken-radaren så ham.
#
# MÅLT 01-07/10 (første entré-flanke efter godnat-clear → første ophold i open
# plan): 3,1 · 3,0 · 1,6 · 18,4 min (de øvrige morgener var open plan allerede
# tændt før entréen). Lux ved entré-flanken: 0-2,9 lx — alle under gaten.
# Replay af reglen over 15 morgener: fyrer 4 gange (10-02, 10-03, 10-04,
# 10-07), 2-18 min før open plan ellers tændte, og nogen kom ind inden for
# 18,4 min hver gang.
#
# DESIGN — samme mønster som openplan_putning_vaekning.yaml: vi bygger INGEN ny
# lys-formel. Velkomsten gen-trigger husets tre eksisterende open plan-tændveje
# med `skip_condition: false`, så hvert rum selv afgør om DET rum er mørkt nok,
# i Manual, i godnat, Sleep Over, film, mood-pause osv. Pakken bidrager med
# TIDSPUNKTET (entréen) og med to ting de tre veje ikke har:
#
#   1. RAMPEN (user-spec "blid ramp som køkken"): køkkenets første-lys-vej har
#      allerede morgen-rampen (50 % hvidt på 1 s, enforceren løfter resten over
#      koekken_lyskaede_fade_langsom_effektiv = 20 s). Spisestue- og sofa-vejen
#      bruger ellers fade_ind_effektiv (3 s målt 07/10), og stue-spottene
#      spejler på 1 s.
#      Mens input_boolean.openplan_entre_velkomst_venter er on, læser de tre
#      steder i stedet køkkenets langsomme fade — SAMME sensor, så tempoet følger
#      køkkenet hvis user skruer på det (#2). Siden 2026-10-08 læser de det via
#      sensor.open_plan_fade_ind_effektiv (nedenfor) — ét udtryk, ikke tre.
#
#   1b. MØRK-MORGEN-FADE (2026-10-08, user-spec: "fade in tiden om morgenen skal
#      være langsommere og jeg skal ha en slider for det. det gik for hurtigt i
#      morges. gør det dobbelt så langsomt" + "det er kun for mørke morgener").
#      Målt 08/10: velkomsten 06:21:10 rampede køkkenet over 5 + 20 s og sofa/
#      spisestue over 20 s; sofaen 06:37:38 (stue-radaren, velkomsten overdraget)
#      tændte på fade_ind_effektiv = 6 s (3 s × nat-faktor 2) — det user så fra
#      køkkenet. input_number.openplan_moerk_morgen_fade_faktor (default ×2,0 =
#      "dobbelt") ganger:
#        - velkomstens rampe: begge køkken-segmenter (hurtig + langsom effektiv
#          i koekken_lyskaede.yaml) mens venter-flaget er on → 10 + 40 s, og
#          dermed sofa/spisestue/spots (40 s);
#        - open plans øvrige sofa-/spisestue-tændinger mens
#          binary_sensor.open_plan_mork_morgen er on (fade_ind × faktor).
#      IKKE køkkenets egen tænding uden velkomst: dér venter spottene på hele
#      kurven, og køkken-latensen har user klaget over mange gange.
#
#   2. UDGANGEN (#4): de tre veje tænder normalt fordi NOGEN er i rummet, så
#      deres sluk-flanker kommer af sig selv. Velkomsten tænder FØR nogen er der.
#      Spisestue/sofa har orphan-re-arms (tænd i tomt rum → sluk efter
#      rummets sluk-tid), men lyskædens hygge-/morgen-sluk venter på
#      openplan_beboet_langsom on→off — en flanke der aldrig kommer hvis ingen
#      går ind (fx en tidlig afgang direkte ud ad hoveddøren). Uden udgang
#      brændte kæden til dagslyset. Derfor: kommer ingen ind i
#      openplan_entre_velkomst_tom_minutter (default 25 = målt max 18,4 + luft),
#      slukker vi igen. Kommer nogen ind (openplan_beboet_langsom on, 3 s
#      delay_on = spøgelses-tæt), overdrages lyset til de normale sluk-veje.
#
# MØRK MORGEN:
#   - MORGEN = 04-12 og godnat_common_active off — samme definition som
#     terrasse_morgenlys.yaml (godnat er husets "nu er det morgen"-autoritet).
#     Det holder natture og weekendens B40-beskyttelse ude af sig selv: en tur
#     på badet kl. 06:10 en lørdag krydser entréen, men godnat står stadig på.
#   - MØRKT = sensor.open_plan_lux < min(80 × sensor.global_lux_threshold_factor,
#     sensor.stue_dagslys_sluk_effektiv) —
#     samme gate som vækningen (wakeup_alarm_driven.yaml) bruger til "er
#     morgenen mørk nok til kunstigt lys". Rummenes egne gates er stadig de
#     afgørende. Siden 2026-10-08 står hele definitionen (04-12 + godnat ryddet
#     + mørkt) ÉT sted: binary_sensor.open_plan_mork_morgen — læses også af
#     mørk-morgen-faden og sofa-zonens køkken/entré-tænding (presence_stue.yaml).
#     open_plan_lux ser ikke husets egne lamper (målt 08/10: 0,0 lx hele
#     morgenen med open plan tændt), så sensoren holder mens lyset brænder.
#   - Re-arm (#4): rydder godnat MENS man står i entréen (godmorgens passage-
#     gren gør præcis det), kommer der ingen ny entré-flanke → godnat→off er
#     også en trigger, når entréen er besat.
#
# ÉN GANG PR. MORGEN: velkomsten er morgenens FØRSTE lys. Latchen
# (input_datetime.openplan_morgenlys_foerste_at) stemples så snart open plan er
# tændt i morgen-tilstand — af velkomsten ELLER af noget andet. Ellers ville en
# morgen hvor køkkenet tændte først, give en "velkomst" når familien går ud ad
# døren efter at have slukket. Nulstilles 04:00 (samme grænse som
# terrasse_morgenlys_respekt).
#
# AirBnB: IKKE med. Velkomsten bygger på familiens morgen (godmorgen-
# detektionen, at entréen er vejen ud fra VORES soveværelse), og udgangen
# slukker lys — at slukke en gæsts lys er at påtvinge en familie-rutine (samme
# valg som nat-vagten og putning-genvejen). Gæsten får uændret de normale veje
# når han går ind i open plan. Venter-flaget rydder sig selv (nogen går ind /
# lyset slukkes), og udgangens sluk er mode-gatet → intet til flag-clear-
# listerne i airbnb_mode.yaml. Stemplerne står i privacy-purge-globben (#16).
# =============================================================================

input_boolean:
  # Kill-switch (fejlklasse #21): velkomsten har kun ÉN vej ind (automationen
  # nedenfor), og udgangen rydder kun op efter den.
  openplan_entre_velkomst_enabled:
    name: "Open plan: morgen-velkomst fra entréen"
    icon: mdi:weather-sunset-up
  # Runtime, ikke indstilling (eksporteres ikke — helpers_export tager kun
  # *_enabled). On fra velkomsten tændte til nogen kommer ind i open plan,
  # lyset slukkes, eller udgangen fyrer. Uden `initial:` → overlever restart.
  openplan_entre_velkomst_venter:
    name: "Open plan velkomst: tændt, venter på nogen"
    icon: mdi:timer-sand

input_number:
  openplan_entre_velkomst_tom_minutter:
    name: "Open plan velkomst: sluk igen hvis ingen kommer ind"
    icon: mdi:timer-off-outline
    min: 5
    max: 60
    step: 1
    unit_of_measurement: "min"
    mode: slider
  # 2026-10-08 (user-spec, se 1b i hovedet): 1,0 = gammelt tempo, 2,0 = dobbelt
  # så langsomt (default). Max 4: køkkenets kurve er 25 s i dag → 100 s.
  openplan_moerk_morgen_fade_faktor:
    name: "Mørk morgen: fade-ind langsommere"
    icon: mdi:transition
    min: 1
    max: 4
    step: 0.1
    unit_of_measurement: "×"
    mode: slider

template:
  - binary_sensor:
      # ÉN definition af "mørk morgen" (#2): klokken + lux-grænsen står KUN i
      # stue_mork_morgen; open_plan_mork_morgen = den ∧ godnat ryddet. now()
      # gen-renderer hvert minut, men state skrives kun ved skift (ingen
      # attributter, #24).
      #
      # STUE mørk morgen = sofa-zonens morgen-look (ild-morgen, læselampe på
      # morgen-slideren, ingen hyggelampe) — læses af presence_light_sofa_on,
      # presence_lux_sofa_on, stue_ild_morgen_mulig og spottenes morgen-forhold.
      # 2026-10-24 (user: "stuelyset tændte ikke for os i morges … jeg vil ha det
      # om morgenen blødt tænder op"): gælder også mens godnat holder, når
      # fællesrummene har fri (godnat_faelles_morgen_fri). Dér tænder sofa-zonen
      # i forvejen — men på aftenniveau + hyggelampe (målt 24/10 06:13, børnene
      # oppe; godnat sat igen 06:18). Nu får den samme bløde morgen som når
      # godnat er ryddet. Velkomsten, faden og entré-/køkken-vejen læser fortsat
      # open_plan_mork_morgen (kun efter godnat-clear).
      - name: "Stue mørk morgen"
        unique_id: stue_mork_morgen
        icon: mdi:weather-sunset-up
        # 2026-10-15: klampet til stuens dagslys-sluk, som open_plan_haendelse_lux_gate
        # (room_lux_tuning.yaml). Global 17 → 50 % løftede grænsen 32 → 80 lx, over
        # sluk-grænsen (49,8): velkomsten tændte stue_all ved 50-80 lx, og
        # presence_lux_stue_off slukkede den igen 7 min senere = tænd/sluk-krig.
        state: >-
          {% set lux = states('sensor.open_plan_lux') %}
          {% set f = states('sensor.global_lux_threshold_factor') | float(1.0) %}
          {% set egen = (states('input_number.morgen_dagslys_lux') | float(80)) * f %}
          {% set sluk = states('sensor.stue_dagslys_sluk_effektiv') | float(0) %}
          {% set graense = [egen, sluk] | min if sluk > 0 else egen %}
          {{ 4 <= now().hour < 12
             and (is_state('binary_sensor.godnat_common_active', 'off')
                  or is_state('binary_sensor.godnat_faelles_morgen_fri', 'on'))
             and lux | is_number and (lux | float) < graense }}
      - name: "Open plan mørk morgen"
        unique_id: open_plan_mork_morgen
        icon: mdi:weather-sunset-up
        state: >-
          {{ is_state('binary_sensor.stue_mork_morgen', 'on')
             and is_state('binary_sensor.godnat_common_active', 'off') }}
  - sensor:
      # Open plans fade-ind (spisestue- og sofa-tænd, stue-spottene). ÉN autoritet
      # i stedet for samme udtryk tre steder:
      #   velkomst     → køkkenets langsomme fade (allerede × morgen-faktoren)
      #   mørk morgen  → fade_ind_effektiv × morgen-faktoren
      #   ellers       → fade_ind_effektiv (uændret)
      # `regime` lader stue-spottene vælge mellem at følge rampen og deres 1 s.
      - name: "Open plan fade ind effektiv"
        unique_id: open_plan_fade_ind_effektiv
        unit_of_measurement: "s"
        icon: mdi:transition
        state: >-
          {% if is_state('input_boolean.openplan_entre_velkomst_venter', 'on') %}
            {{ states('sensor.koekken_lyskaede_fade_langsom_effektiv') | int(20) }}
          {% else %}
            {% set base = states('sensor.fade_ind_effektiv') | float(3) %}
            {% set f = (states('input_number.openplan_moerk_morgen_fade_faktor') | float(2.0))
                       if is_state('binary_sensor.open_plan_mork_morgen', 'on') else 1.0 %}
            {{ [1, [6500, (base * f) | round(0) | int] | min] | max }}
          {% endif %}
        attributes:
          regime: >-
            {{ 'velkomst' if is_state('input_boolean.openplan_entre_velkomst_venter', 'on')
               else ('moerk_morgen' if is_state('binary_sensor.open_plan_mork_morgen', 'on')
                     else 'normal') }}

input_datetime:
  # Runtime-stempler (ikke i DATETIME_CONFIG). Urørte står de på dagens midnat
  # (permanent faktum) — begge læses som timestamp mod 04:00, så midnat tæller
  # som "ikke sat".
  openplan_entre_velkomst_at:
    name: "Open plan velkomst: tændt kl."
    icon: mdi:weather-sunset-up
    has_date: true
    has_time: true
  openplan_morgenlys_foerste_at:
    name: "Open plan: første lys i morges"
    icon: mdi:lightbulb-on-outline
    has_date: true
    has_time: true

automation:
  # ---------------------------------------------------------------------------
  # LATCH: stempl morgenens første open plan-lys (uanset hvem der tændte)
  # ---------------------------------------------------------------------------
  - id: openplan_morgenlys_foerste_stempel
    alias: "Open plan: stempl morgenens første lys (velkomst-latch)"
    description: >-
      Stempler input_datetime.openplan_morgenlys_foerste_at første gang open
      plan er tændt efter godnat er ryddet (04-12). Læses af entré-velkomsten:
      er open plan allerede tændt i morges, er der intet at byde velkommen til.
    mode: queued
    max: 3
    trigger:
      - platform: state
        entity_id: light.stue_all
        from: "off"
        to: "on"
        id: lys
      # Lyset kan være tændt FØR godnat ryddes (nattur-dæmpning, tidlige børn)
      # — så er der ingen ny off→on-flanke bagefter.
      - platform: state
        entity_id: binary_sensor.godnat_common_active
        from: "on"
        to: "off"
        id: godnat_slut
      - platform: homeassistant
        event: start
        id: start
    condition:
      - condition: time
        after: "04:00:00"
        before: "12:00:00"
    action:
      # Lysgrupper og template-sensorer står unknown de første sekunder efter
      # en start — vent til de har sat sig.
      - if:
          - condition: template
            value_template: "{{ (trigger.id if trigger is defined else '') == 'start' }}"
        then:
          - delay:
              seconds: 60
      - condition: state
        entity_id: light.stue_all
        state: "on"
      - condition: state
        entity_id: binary_sensor.godnat_common_active
        state: "off"
      - condition: template
        value_template: >-
          {{ (state_attr('input_datetime.openplan_morgenlys_foerste_at', 'timestamp') | float(0))
             < as_timestamp(today_at('04:00')) }}
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.openplan_morgenlys_foerste_at
        data:
          timestamp: "{{ now().timestamp() }}"

  # ---------------------------------------------------------------------------
  # VELKOMSTEN
  # ---------------------------------------------------------------------------
  - id: openplan_entre_velkomst
    alias: "Open plan: morgen-velkomst ved entré-bevægelse (mørk morgen)"
    description: >-
      Mørk morgen (04-12, godnat ryddet, open_plan_lux under 80 × global
      lux-faktor) + bevægelse i entréen + open plan helt slukket og endnu ikke
      tændt i morges → gen-trigger de tre open plan-tændveje (køkken først) med
      deres egne conditions, og lad dem rampe op i køkkenets langsomme tempo.
    # single: entré-flankerne kommer hvert ~minut om morgenen; efter første
    # kørsel er latchen sat, og resten falder på conditions.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.entre_valhorn_occupancy
        from: "off"
        to: "on"
        id: entre
      # Re-arm (#4): godnat ryddes mens man står i entréen.
      - platform: state
        entity_id: binary_sensor.godnat_common_active
        from: "on"
        to: "off"
        id: godnat_slut
    condition:
      - condition: state
        entity_id: input_boolean.openplan_entre_velkomst_enabled
        state: "on"
      # Familie-rutine — se hoved-kommentaren (AirBnB).
      - condition: template
        value_template: >-
          {{ states('input_select.house_mode') in ['Normal', 'Home Vacation'] }}
      - condition: time
        after: "04:00:00"
        before: "12:00:00"
      - condition: template
        value_template: >-
          {{ (trigger.id if trigger is defined else '') != 'godnat_slut'
             or is_state('binary_sensor.entre_valhorn_occupancy', 'on') }}
      # Husets egen "nu er det morgen". De tre veje ville selv slippe igennem på
      # godnat_faelles_morgen_fri (fra 06:00), men den er også on under en
      # weekend-nattur — velkomsten skal ikke tænde open plan for en tur på badet.
      - condition: state
        entity_id: binary_sensor.godnat_common_active
        state: "off"
      # Velkomst = ind i et MØRKT open plan. Strengt 'off' (#9): er gruppen
      # unavailable, ved vi ikke hvad der lyser.
      - condition: state
        entity_id: light.stue_all
        state: "off"
      # Én gang pr. morgen: open plan er ikke tændt endnu i morges (04:00-grænse).
      - condition: template
        value_template: >-
          {{ (state_attr('input_datetime.openplan_morgenlys_foerste_at', 'timestamp') | float(0))
             < as_timestamp(today_at('04:00')) }}
      # Mørk morgen: samme gate som vækningen (definitionen står i
      # binary_sensor.open_plan_mork_morgen ovenfor). Strengt 'on' fejler LUKKET.
      - condition: state
        entity_id: binary_sensor.open_plan_mork_morgen
        state: "on"
      # Robotten ER bevægelsen (roborock.md) — en morgen-tur i entréen er ikke
      # en voksen der står op. roborock_blokerer_lys dækker kun Dormant.
      - condition: template
        value_template: >-
          {{ states('vacuum.s8_maxv_ultra') not in ['cleaning', 'returning'] }}
      - condition: state
        entity_id: binary_sensor.presence_sensors_available
        state: "on"
      - condition: state
        entity_id: input_select.house_state
        state: "Active"
    action:
      # Flaget FØR kaldene: spisestue-/sofa-vejen og stue-spottene læser det og
      # vælger køkkenets langsomme rampe i stedet for deres normale fade-ind.
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.openplan_entre_velkomst_venter
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.openplan_entre_velkomst_at
        data:
          timestamp: "{{ now().timestamp() }}"
      # RÆKKEFØLGEN ER BETYDENDE (som i putning-genvejen): køkkenets første-lys-
      # vej kræver HELE light.stue_all slukket, så den skal dømme først.
      # continue_on_error: ét rum der fejler (Matter 0x32) må ikke tage de andre.
      - service: automation.trigger
        continue_on_error: true
        target:
          entity_id: automation.kokken_lyskaede_forste_lys_kulsort_open_plan_bevaegelse
        data:
          skip_condition: false
      - service: automation.trigger
        continue_on_error: true
        target:
          entity_id: automation.lysnet_stue_taend
        data:
          skip_condition: false
      - service: automation.trigger
        continue_on_error: true
        target:
          entity_id: automation.lysnet_sofa_stue_taend
        data:
          skip_condition: false
      - wait_template: "{{ is_state('light.stue_all', 'on') }}"
        timeout: "00:00:10"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ is_state('light.stue_all', 'on') }}"
        then:
          - service: logbook.log
            data:
              name: "Open plan"
              message: >-
                Morgen-velkomst: bevægelse i entréen
                ({{ 'godnat ryddet mens entréen var besat' if (trigger.id if trigger is defined else '') == 'godnat_slut' else 'entré-flanke' }}),
                open plan {{ states('sensor.open_plan_lux') }} lx — tændt:
                {{ state_attr('light.stue_all', 'entity_id')
                   | select('is_state', 'on') | map('replace', 'light.', '') | join(', ') }}.
        else:
          # Intet rum ville tænde (deres egne spærrer) → intet at vente på, og
          # latchen er ikke brugt: næste entré-flanke må prøve igen.
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.openplan_entre_velkomst_venter
          - service: logbook.log
            data:
              name: "Open plan"
              message: >-
                Morgen-velkomst forsøgt (entré), men ingen af de tre open
                plan-veje ville tænde — deres egne spærrer (Manual, lux,
                mood-pause, Sleep Over …).

  # ---------------------------------------------------------------------------
  # UDGANGEN: nogen kom ind → overdrag · ingen kom → sluk igen
  # ---------------------------------------------------------------------------
  - id: openplan_entre_velkomst_slut
    alias: "Open plan: velkomst slut (nogen kom ind / ingen kom → sluk)"
    description: >-
      Mens venter-flaget er on: ophold i open plan (openplan_beboet_langsom)
      eller at lyset slukkes rydder flaget, og de normale sluk-veje ejer lyset.
      Er der efter openplan_entre_velkomst_tom_minutter stadig ingen kommet ind,
      slukker vi det velkomsten tændte.
    # queued: vores egen sluk giver en stue_all on→off-flanke midt i kørslen;
    # restart ville afbryde logbogen. Hver kørsel gen-tjekker flaget.
    mode: queued
    max: 5
    trigger:
      - platform: state
        entity_id: binary_sensor.openplan_beboet_langsom
        from: "off"
        to: "on"
        id: inde
      - platform: state
        entity_id: light.stue_all
        from: "on"
        to: "off"
        id: slukket
      # Level-baseret, ikke en `for:` på flaget: alderen måles på et SKREVET
      # stempel, så en restart ikke nulstiller uret. now() → gen-evalueres hvert
      # minut, men fyrer kun på false→true (én gang pr. velkomst).
      - platform: template
        value_template: >-
          {{ is_state('input_boolean.openplan_entre_velkomst_venter', 'on')
             and (now().timestamp()
                  - (state_attr('input_datetime.openplan_entre_velkomst_at', 'timestamp') | float(0)))
                 >= (states('input_number.openplan_entre_velkomst_tom_minutter') | float(25)) * 60 }}
        id: udloeb
      # En template-trigger der allerede er sand ved opstart fyrer ikke.
      - platform: homeassistant
        event: start
        id: start
    condition:
      - condition: state
        entity_id: input_boolean.openplan_entre_velkomst_venter
        state: "on"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (trigger.id if trigger is defined else '') in ['inde', 'slukket'] }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.openplan_entre_velkomst_venter
        default:
          - if:
              - condition: template
                value_template: "{{ (trigger.id if trigger is defined else '') == 'start' }}"
            then:
              - delay:
                  seconds: 90
          - variables:
              alder_s: >-
                {{ now().timestamp()
                   - (state_attr('input_datetime.openplan_entre_velkomst_at', 'timestamp') | float(0)) }}
              graense_s: >-
                {{ (states('input_number.openplan_entre_velkomst_tom_minutter') | float(25)) * 60 }}
          # Opstart før tiden er gået → template-triggeren tager den.
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.openplan_entre_velkomst_venter', 'on')
                 and (alder_s | float(0)) >= (graense_s | float(1500)) }}
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.openplan_entre_velkomst_venter
          # Kun sluk hvis præmissen stadig holder: familie-mode, ingen har taget
          # styringen (Manual i et af de tre rum), ingen er i open plan NU
          # (strengt 'off' — unavailable er ikke tomt, #9), og stemplet er fra
          # denne velkomst (et flag der hang over en lang restart slukker intet).
          - condition: template
            value_template: >-
              {{ states('input_select.house_mode') in ['Normal', 'Home Vacation']
                 and is_state('binary_sensor.open_plan_manual', 'off')
                 and is_state('binary_sensor.openplan_beboet_langsom', 'off')
                 and is_state('light.stue_all', 'on')
                 and (alder_s | float(0)) < (graense_s | float(1500)) + 7200 }}
          - service: light.turn_off
            continue_on_error: true
            target:
              entity_id: light.stue_all
            data:
              transition: "{{ states('sensor.fade_extended_effective') | int(60) }}"
          - service: logbook.log
            data:
              name: "Open plan"
              message: >-
                Morgen-velkomst udløbet: ingen kom ind i open plan på
                {{ states('input_number.openplan_entre_velkomst_tom_minutter') | int(25) }} min
                — slukket igen.
