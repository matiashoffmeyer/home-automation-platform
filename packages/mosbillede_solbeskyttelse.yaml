# =============================================================================
# Mosbillede-beskyttelse: hold direkte sol væk fra mosbilledet i spisestuen
# (2026-09-23, user-spec)
# =============================================================================
# USER: "vi har sat et mosbillede op i spisestuen som skal beskyttes fra direkte
#  sollys. Så jeg skal ha en slider der, fra 0 til 400cm kan justere hvor langt
#  ind i lejligheden i spisestuen lyset når. vinduet er 180 bredt og 220 højt og
#  starter 55cm oppe ad væggen. lav geometri og sæt det op så, når der ikke er
#  helt overskyet, så er der automatisk beskyttelse af mosbilledet på både
#  active og dormant. på Airbnb mode, dér skal den kun køre ned hvis huset er
#  dormant. bliver huset aktivt må gardinet gerne forblive nede, men hvis
#  gæsten manuelt kører det op skal det blive oppe indtil næste dormant eller
#  manuel osv."
#
# GEOMETRI — TO PARALLELLE VÆGGE (2026-09-24, user-målt; 333° bekræftet med
# professionelt kompas 2026-09-30 = SOURCE OF TRUTH):
#   Vinduet vender 333° (NV). Mosbilledet hænger på væggen OVERFOR, parallel
#   med vinduet og 245 cm inde i rummet. Billedet er rundt (Ø 75 cm) og sidder
#   forskudt mod NORD (retning 63°): dets sydlige kant 10 cm og dets nordlige
#   kant 85 cm nord for glassets nordligste kant. Glasset: 180 cm bredt, fra
#   55 til 275 cm over gulvet.
#
#   Koordinater: x = langs væggene mod nord (63°), 0 = glassets nordkant, så
#   glasset ligger på x ∈ [−180, 0] og billedet på x ∈ [fra, til].
#   Δ = azimut − 333°. En stråle der går D = 245 cm ind i rummet, flytter sig
#       s = D·tan(−Δ) mod nord  (Δ < 0: sol fra SV-siden → pletten mod nord)
#   og har gået den vandrette vej P = D / cos(Δ). Solpletten på billedvæggen
#   ligger altså på x ∈ [s − 180, s] og rammer billedet når s ≥ fra og
#   s − 180 ≤ til. Højden: en stråle gennem glasset i højden h rammer væggen i
#   h − P·tan(elev) → pletten går op til 275 − P·tan(elev), og gardinets
#   underkant H skal holdes under  underkant + P·tan(elev).
#   Da P er ens for hele glasset, blokerer gardinet alle strålerne på én gang.
#
# HVAD DET BETYDER: med fra 10 / til 85 skal −Δ ligge mellem ~2° og ~47° →
# solen i azimut ~286-331°. Det sker kun på sommeraftener (beregnet: 1/5
# 19:45-20:30, 21/6 19:25-21:40, 15/8 19:55-20:34), og ALDRIG fra ~1. sept.
# til midt i april — solen går ned sydligere end 286°. User: "i vinter-
# halvåret tror jeg aldrig det bliver nødvendigt, men i sommerperioden helt
# sikkert."
#
# HISTORIK 2026-09-24 (fire modeller på én dag — læs før du ændrer noget):
#   v1 dybde over GULVET med normal 235° (lux-toppe) · v2 normal fittet til
#   243° mod "sol på billedet 17:02 ved az 243,8°" · v3 billedet på en
#   SIDEVÆG · v4 (denne) parallelle vægge med users mål. v2 og v3 byggede på
#   MIN antagelse om rummet, ikke users — og v3's gættede mål kørte gardinet
#   næsten helt ned. SOLEN KL. 17:02 KAN IKKE have været DIREKTE sol: ved
#   az 243,8° står solen 89° ude af vinduets retning (strejflys langs facaden)
#   og skal flytte sig 170 m sidelæns for at nå 245 cm ind. Lyset på billedet
#   den dag var sandsynligvis en REFLEKS (åbent vindue, nabo-facade/-rude) —
#   den model dækker ikke reflekser. (26/9-30/9 troede jeg vinduet vendte
#   270° — FORKERT, 333° er kompas-målt; se 2026-09-30b nederst.)
#
# EJERSKAB (fejlklasse #1 — spisestue-vest har MANGE med-ejere: putte_vest_glare,
# summer_defense, winter_defense, morning_curtains, house_modes' to Active-open,
# dark_mode/projektor_predark-restore, sleepover-holdet):
#   input_boolean.mosbillede_gardin_ned = "jeg ejer gardinet lige nu". Flaget er
#   lagt ind i sensor.gardiner_manual_hold's 'held'-liste (ét anker, jf.
#   gardin_manual_grace-headeren) → ALLE auto-ÅBNERE arver blokeringen gratis i
#   stedet for at reglen skal kodes i ni filer (fejlklasse #2/#16).
#   Manuel betjening læser IKKE 'held' → user og gæst kan altid selv trække op.
#
# HVORFOR 'held' IKKE gates på LUK-vejen: i AirBnB ligger ALLE fire gardiner
# permanent i 'held' (auto-op-forbud, 2026-09-02). Læste luk-vejen 'held', ville
# featuren aldrig kunne lukke i AirBnB — præcis det user beder om. 'held' er en
# auto-OP-liste, ikke et "rør ikke"-flag. Luk-vejen har i stedet sine EGNE
# grunde til at holde sig væk: sleepover (motorlarm + dagslys vækker gæsten på
# sofaen) og gæstens manuelle op-hold.
#
# DVALE-PAUSEN (gardin_dormant_pause_active, ferie-batterispar): respekteres på
# ÅBN-vejen, ikke på LUK-vejen. At lukke ÉN gang og lade gardinet blive nede er
# den batterimæssigt billigste tilstand der stadig beskytter billedet; det er
# gentagne op/ned pausen findes for at undgå.
#
# KILL-SWITCH (fejlklasse #21): input_boolean.mosbillede_solbeskyttelse_enabled
# sidder INDE I binary_sensor.mosbillede_sol_rammer, som er den ENESTE kilde
# både luk- og åbn-vejen (inkl. begge backstops) læser → der findes ingen vej
# ind der ikke er gatet. Slår du featuren fra, går sensoren off → åbn-vejen
# FRIGIVER gardinet i stedet for at efterlade det låst nede.
#
# 2026-09-26 — (ERSTATTET 2026-09-30b: 333° er rigtigt) (user: "der er to nord-syd
#   væggen. den ene er længst mod vest og har det store vindue. den anden er
#   længst mod øst og har mosbilledet. mosbilledets mest sydlige kant flugter
#   med vinduets mest nordlige kant. derfor kan sidelys fra sydvest ramme det.
#   der er ca 2.5m mellem de to paralelle vægge").
#   Observeret sol på billedet: 24/9 17:02 (az 244,3° / elev 15,8°) og 26/9
#   17:18 (247,5° / 13,0°, "nederste 20 %"). Med 333° var begge umulige (Δ ≈
#   −86°); med 270°, 250 cm og sydkant = 0 cm rammer modellen begge (den siger
#   ~89 % af billedet den 26/9 mod de ~20 % user så → konservativ side).
#   Sæson med 270°: 20/3 15:35-17:40 · 20/4 17:15-18:35 · juni intet ·
#   20/8 17:25-18:35 · 26/9 16:10-18:15 · 20/10 15:50-17:10 · nov-feb intet.
#   Den empiriske strejflys-boks (az 240-265°, 26/9 17:4x-18:xx) er fjernet
#   igen: med 270° dækker modellen hvert øjeblik boksen dækkede, hele året.
#   GARDIN-GULV (user): "50% nedrulning er max for solbeskyttelse, det behøver
#   aldrig at være lavere" → input_number.mosbillede_gardin_min_aaben_pct.
#   ⚠️ Tallene i GEOMETRI-afsnittet ovenfor (333°, 245 cm, 10-85 cm) er
#   historik — sliderne er autoriteten.
#
# 2026-09-30 — FOTO (user, `mosbillede` i repo-roden → Google Photos, taget
#   26/9 12:05, OnePlus Nord2 5,59 mm = f ≈ 1092 px ved 1600 px bredde).
#   Kameraet står i rummets sydende og kigger mod altandøren (user: "vender mod
#   nord, er lige meget"); vinduet i venstre væg, billedet på højre væg.
#   Perspektivmålt ud fra billedets Ø 75 cm: væg-afstand 252 cm (slider 250 ✓),
#   billedets sydkant ±5 cm i flugt med vindues-lysningens nordkant (glasset
#   sidder ~5-10 cm længere mod syd i karmen → fra ≈ 0-15 cm, slider 0 ✓),
#   billedets nordkant ~40-55 cm fra altandør-væggen.
#   User sagde samtidig "vinduet vender 333°". Det kan ikke gå sammen med en
#   nordvendt altandør på den VINKELRETTE væg, og heller ikke med de to
#   sol-observationer: "nederste 20 %" 26/9 ved 247,5°/13,0° giver P = 273 cm
#   → |Δ| = 23,7° → normal ≈ 271° (333° giver P = 31 m). Lux-kurven er den
#   samme historie: solrige dage 20-27/9 stiger spisestuen fra ~250 til
#   700-1000 lx mellem az 210° og 250° — et 333°-vindue får ingen direkte sol
#   før az 243°. (Konklusionen "270° beholdt" er erstattet af 2026-09-30b.)
#
# 2026-09-30b — 333° ER SOURCE OF TRUTH (user: "jeg er sikker på 333 grader
#   for vinduet til venstre. opmålt præcist med prof kompas"; altandøren er
#   "ikke direkte" mod nord). "Nord-syd-vægge"/"vestvæggen" var omtrentlige
#   ord, ikke en måling — et tal målt med instrument vinder over min slutning.
#   Men de to observationer (24/9 + 26/9) er ÆGTE sol som 333° ikke kan
#   forklare (Δ ≈ −86°, strejflys) → de dækkes af en EMPIRISK strejflys-boks:
#   azimut ∈ [boks_az_fra, boks_az_til] (224-270°; fra = 240° 18/10) og højde-reglen med en
#   empirisk vej (boks_vej_cm = 273, kalibreret til "nederste 20 %" 26/9) i
#   stedet for D/cos(Δ). Boksen reproducerer den MÅLTE 270°-adfærd (27/9:
#   95 → 90 → … → 65 % kl. 16:58-18:12) og tilføjer intet nyt; 333°-geometrien
#   tilføjer sommeraftenerne (az 286-331°), som 270° aldrig dækkede.
#   Sæson (simuleret, skyfrit, slip < 3°): 20/3 16:15-18:00 · 20/4 18:20-18:40
#   · 1/5 19:50-20:20 · 21/6 20:00-21:25 · 15/7 19:55-21:10 · 15/8 20:05-20:20
#   · 26/9 16:50-18:35 · 20/10 15:50-17:30 · 20/11 15:05-15:25 · 21/12 intet.
#   Magnetisk misvisning i KBH er ~+5° Ø: er kompasset ikke korrigeret, vender
#   vinduet sandt ~338° (sun.sun's azimut er sand) — spurgt user.
#
# 2026-09-30c — FOTO 3, første måling med KENDT gardin (user: "virkede perfekt!
#   rullede ned lige før solen ramte det"; `mosbillede` link 2, 17:00:38 +
#   17:00:44). Sol az 243,2° / elev 13,78° (NOAA-regnet, = sun.sun ±0,2°).
#   Gardin 95 % (sat 16:45:48; 90 % først 17:01:02). Pixel-målt i 6144×8192-
#   originalen med billedets Ø 75 cm som skala (21,9 px/cm): pletten fra den
#   nordlige glasrude slutter 150,1 ± 1 cm oppe = billedets underkant, 0,7 cm
#   under rammen ved plettens sydkant (resten er i sprossens skygge).
#   Modellen (vej 273, gardin lineært → kant 219,4) sagde 152,4 → 2,3 cm på
#   den SIKRE side. Regnet som vej: 282 cm (26/9: 272) — de to punkter kan
#   ikke skilles fra ±2 cm gardin-usikkerhed (RF-antaget position); 273 er den
#   korteste = konservative → UÆNDRET.
#   MARGINEN VAR ~40 s: sun.sun opdaterer kun hvert 4. min over 10° (2 min
#   under), plus 1-min tick, plus reguleringsintervallet → gardinet blev sat
#   efter en solhøjde op til ~10 min gammel, mens pletten kravler ~0,7 cm/min.
#   → FREMSKRIVNING: faldet regnes på solhøjden om L min (slider
#   input_number.mosbillede_margin_minutter, default 10 = regulering 5 + 5)
#   (dh/dt = 0,2507°/min · cos(bredde) · |sin(az)|; tjekket 16:45-17:00:
#   0,1242 regnet mod 0,1234 målt). Kun eftermiddag (az > 180). Koster ~7 cm
#   ekstra gardin ved 13° og starter ~10 min tidligere. State'en er derfor
#   "hvor højt pletten når inden næste regulering", ikke "lige nu".
#   Også set: svag bladskygge OVER pletten = sol gennem gardinstoffet; den
#   kan en rullegardin-position ikke fjerne.
#
# 2026-10-01 — LUX AFGØR HELE EPISODEN, MOD EN TÆRSKEL DER FØLGER SOLEN (user:
#   "mosbilledet beskyttes trods overskyet/lav lux. ret til og giv mig en
#   slider til at sætte lux tærskel"). 1/10 (81 % skyer) startede den 16:52
#   ved 212 lx — min_lux stod på 90 — og rullede 95 → 65 % mens lux faldt til
#   27, fordi "vi holder allerede gardinet" slugte lux-kravet resten af
#   episoden (og skydækket var dødt: luk krævede lux, holdet ingenting).
#   MÅLT 17/9-1/10, sensor.spisestue_dagslys_lx i strejflys-vinduet (az
#   224-270°, elev 2-16°): lux falder med solen på ALLE dage (~0,13-0,19/°),
#   så et fast tal er enten for højt ved 5° eller for lavt ved 15°. Normeret
#   til 400 · e^(−0,19 · (15 − elev)): klare dage (21, 22, 26, 27, 30/9 — de
#   tre sidste MED vores gardin nede) ≥ 1,25 over 4° (≥ 1,0 ved 3°), 1/10
#   0,51-0,79, helt overskyede (17, 19, 23, 29/9) ≤ 0,45. Ved indgangen
#   (14-16,5°): klare 482-932 lx, 1/10 212-345. Hysterese: hold ved ≥ 0,8 ×.
#   Kendte huller: (1) under ~3° skiller kanalen ikke (klare 22-90 lx, 1/10
#   21-23). (2) Med spisestuens lamper tændt er kanalen en FREMSKRIVNING
#   (room_lux_tuning) — en sol der bryder frem bag skyer mens lyset er tændt,
#   ses ikke før næste rene sample. (3) Kalibreret på efterårets strejflys;
#   sommerens 333°-aftener (sol ind ad vinduet) er utestede — mål en
#   overskyet sommeraften mod kurven før du stoler på den dér.
#
# 2026-10-18 — SPØRG USER NÅR MODELLEN ER I TVIVL (user: "modellen skal spørge
#   mig når den er i tvivl på de sommeraftener så svarer jeg Solen rammer eller
#   ej"). Facit hidtil: strejflyset når billedets kant ved az 241,3° (18/10) og
#   sol er SET på billedet op til az 254° (2/10). Alt over det — sommer-
#   aftenernes 333°-geometri og boksens ende ved 270° — er umålt.
#   TVIVL = binary_sensor.mosbillede_i_tvivl: sol der skinner (samme lux-anker
#   som sol_rammer) ved az ≥ tvivl_az_fra (255°) og elev ≤ tvivl_elev_maks
#   (20°; med vej 273-290 cm når pletten først billedets underkant 150 cm
#   under ~16°). Okt-feb går solen ned før 255° → spørger kun mar-sep.
#   Spørgsmålet kommer hvert spoerg_minutter (30) mens tvivlen varer og
#   Parent A er hjemme; svaret ER modellen i de næste spoerg_minutter
#   (input_select.mosbillede_facit + _facit_til, inde i sol_rammer =
#   eneste beslutningskanal, #21). "Rammer" uden model-plet → gardinet til
#   gulvet (min_aaben_pct). "Rammer ikke" → delay_off 0, gardinet slippes
#   straks (frigivelsens egne 07-20-/dagslys-krav gælder stadig).
#   Log: ai_feedback/mosbillede_feedback.jsonl (ask med modellens gæt + svar)
#   → snævr tvivl_az_fra/boks_az_til/vindue-modellen ind med svarene.
# =============================================================================

input_boolean:
  # Kill-switch — hele featuren til/fra. Ingen `initial:` → overlever restarts.
  # Fresh install = off (= sikkert: en ny installation river ikke gardiner ned);
  # løftes til on af init_user_preferences + live sat via API (fejlklasse #5).
  mosbillede_solbeskyttelse_enabled:
    name: "Mosbillede: solbeskyttelse aktiv"
    icon: mdi:image-filter-vintage

  # Runtime-ejerskab: on = featuren holder spisestue-vest nede. IKKE _enabled →
  # ikke i snapshot; restores over restart så et igangværende hold overlever.
  mosbillede_gardin_ned:
    name: "Mosbillede: spisestue-vest holdt nede"
    icon: mdi:curtains-closed

  # Gæstens (eller familiens) MANUELLE op vinder indtil næste Dormant eller
  # næste manuelle betjening — user-spec. Uden dette hold ville /15-backstoppen
  # re-lukke indenfor 15 min (præcis den F3-fejl putte-glare fik 2026-07-02).
  mosbillede_manuel_op_hold:
    name: "Mosbillede: manuel op respekteres"
    icon: mdi:hand-back-right

  # Spørg-træneren (2026-10-18, se header). _enabled → snapshot.
  mosbillede_spoerg_enabled:
    name: "Mosbillede: spørg mig når modellen er i tvivl"
    icon: mdi:message-question

input_number:
  # Parallel-væg-geometrien (2026-09-24, user-målt — se headerens GEOMETRI).
  # Alle i cm, ingen `initial:` → persisterer; seedes af init + API.
  mosbillede_vaeg_afstand_cm:
    name: "Mosbillede: afstand vindue → billedvæggen (cm)"
    icon: mdi:arrow-expand-horizontal
    min: 50
    max: 800
    step: 5
    unit_of_measurement: "cm"
    mode: box

  # Billedets kanter målt MOD NORD fra glassets nordligste kant (negativ =
  # billedet sidder (delvist) lige overfor glasset).
  mosbillede_billede_fra_cm:
    name: "Mosbillede: billedets sydkant, cm nord for vinduets nordkant"
    icon: mdi:ray-start
    min: -400
    max: 400
    step: 5
    unit_of_measurement: "cm"
    mode: box

  mosbillede_billede_til_cm:
    name: "Mosbillede: billedets nordkant, cm nord for vinduets nordkant"
    icon: mdi:ray-end
    min: -400
    max: 400
    step: 5
    unit_of_measurement: "cm"
    mode: box

  # Billedets underkant over gulvet: 150 cm (user-målt 2026-09-24; Ø 75 →
  # overkant 225). Sænk den for sikkerhedsmargin.
  mosbillede_billede_underkant_cm:
    name: "Mosbillede: billedets underkant over gulvet (cm)"
    icon: mdi:arrow-collapse-down
    min: 0
    max: 275
    step: 5
    unit_of_measurement: "cm"
    mode: box

  # Billedets højde (rundt billede: diameteren).
  mosbillede_billede_hoejde_cm:
    name: "Mosbillede: billedets højde (cm)"
    icon: mdi:arrow-expand-vertical
    min: 10
    max: 200
    step: 5
    unit_of_measurement: "cm"
    mode: box

  # Vinduets normal-retning (den retning vinduet "kigger"). 333° = user-målt
  # med professionelt kompas, "source of truth" (2026-09-30). 270° (26/9-30/9)
  # var min slutning fra "nord-syd-vægge" — se headerens 2026-09-30b.
  # Billedvæggen er parallel.
  mosbillede_vindue_azimut:
    name: "Mosbillede: spisestue-vinduets retning (azimut)"
    icon: mdi:compass-outline
    min: 0
    max: 359
    step: 1
    unit_of_measurement: "°"
    mode: box

  # STREJFLYS-boksen (2026-09-30b, se header): sol på billedet som 333°-
  # geometrien IKKE kan forklare, men som user har SET (24/9 17:02 az 244,3°,
  # 26/9 17:18 az 247,5°). Azimut-vinduet = det 270°-modellen beskyttede
  # 26/9-30/9 (målt adfærd, se header); de observerede 244-248° ligger inde i
  # det. Indsnævres med observationer, ikke med geometri.
  # 2026-10-18 (user): 16:2x (az 232,5°) "~1 m fra nærmeste solstrejf til
  #   billedet, horisontalt målt"; pletten ville have nået billedets kant
  #   17:03 = az 241,3° / elev 6,9° (NOAA, = sun.sun ±0,05°). Vandret afgør
  #   azimut alene (lodrette vindueskanter); solhøjden afgør om pletten stadig
  #   er over underkanten — højde-reglen. fra = 240°: sun.sun er op til 2 min
  #   gammel under 10° (4 min over) + delay_on 1 min → tænder ved reel az
  #   ≈ 240,2-241,1°, dvs. 1-5 min før. 241 kunne komme op til 2 min for sent.
  #   Gælder hele året (samme azimut = samme vandrette plet).
  mosbillede_boks_az_fra:
    name: "Mosbillede: strejflys fra azimut"
    icon: mdi:compass-outline
    min: 180
    max: 330
    step: 1
    unit_of_measurement: "°"
    mode: box

  mosbillede_boks_az_til:
    name: "Mosbillede: strejflys til azimut"
    icon: mdi:compass-outline
    min: 180
    max: 330
    step: 1
    unit_of_measurement: "°"
    mode: box

  # Strejflysets vandrette vej fra glasset til billedvæggen — EMPIRISK, ikke en
  # vinkel: 26/9 17:18 (elev 13,0°, gardin helt oppe) nåede pletten 165 cm
  # ("nederste 20 %") → 228 − 165 = 63 cm fald → 63 / tan(13,0°) = 273 cm.
  # Bestemmer både hvor højt pletten når og hvor langt gardinet skal ned.
  mosbillede_boks_vej_cm:
    name: "Mosbillede: strejflysets vej til billedet (cm)"
    icon: mdi:ray-start-arrow
    min: 100
    max: 600
    step: 1
    unit_of_measurement: "cm"
    mode: box

  # (mosbillede_sky_maks FJERNET 2026-10-01: met.no's skydække var allerede
  # dødt — luk-vejen krævede lux, og holdet ignorerede begge. "Helt overskyet"
  # afgøres nu af den målte lux mod sensor.mosbillede_lux_taerskel.)

  # 2026-09-23 (user-spec): "vi behøver ikke at beskytte for de sidste N grader
  # af en solnedgang, lad os sige de sidste 10 grader som default". 2026-09-24:
  # sænket til 5° (user) — om sommeren rammer solen billedet netop lavt. Gælder kun
  # den NEDADGÅENDE sol (azimut > 180°). 0 = beskyt helt ned til horisonten.
  mosbillede_solnedgang_fri_grader:
    name: "Mosbillede: ingen beskyttelse de sidste N° før solnedgang"
    icon: mdi:weather-sunset
    min: 0
    max: 30
    step: 1
    unit_of_measurement: "°"
    mode: slider

  # 2026-09-23 (user-spec): gardinet reguleres løbende, så der kommer så meget
  # lys ind som muligt uden at solen når billedet. Hvor ofte (minutter).
  mosbillede_regulering_minutter:
    name: "Mosbillede: regulér gardinet hvert (min)"
    icon: mdi:timer-refresh-outline
    min: 2
    max: 60
    step: 1
    unit_of_measurement: "min"
    mode: slider

  # 2026-09-30c (user: "giv mig et slider til at styre det. margin styring"):
  # hvor mange minutter FREM solhøjden regnes (se headerens 2026-09-30c).
  # 10 = den adfærd der shippede før slideren (regulering 5 + sun.sun's
  # 4-min kadence + 1-min tick) = dækker værste forsinkelse. 0 = regn på den
  # seneste sun.sun-måling (før 2026-09-30c; ~40 s margin målt 30/9).
  # NEGATIV (user: "in case modellen er lidt off er det at kunne gå under 0")
  # = regn på en solhøjde BAGUD → pletten estimeres lavere → gardinet højere;
  # til hvis modellen viser sig for forsigtig. Under ~0 kan solen nå
  # billedets underkant mellem to reguleringer.
  # Ca. 0,7 cm plet pr. minut ved lav eftermiddagssol.
  mosbillede_margin_minutter:
    name: "Mosbillede: margin, gardinet ned i god tid (min)"
    icon: mdi:timer-sand
    min: -30
    max: 30
    step: 1
    unit_of_measurement: "min"
    mode: slider

  # 2026-10-01 (user: "beskyttes trods overskyet/lav lux … giv mig en slider
  # til at sætte lux tærskel"): lux-tærsklen VED 15° SOL. Under 15° følger den
  # solen ned (sensor.mosbillede_lux_taerskel, se headerens 2026-10-01) og
  # gælder HELE episoden, ikke kun starten. Målt 17/9-1/10 i den kanal gaten
  # læser: klare dage ≥ 1,25 × 400-kurven, i dag (81 % skyer) ≤ 0,79, helt
  # overskyede ≤ 0,5. (Før: kun indgangen, fast tal — stod på 90.)
  mosbillede_min_lux:
    name: "Mosbillede: beskyt kun ved dagslys over (lx)"
    icon: mdi:white-balance-sunny
    min: 0
    max: 1000
    step: 10
    unit_of_measurement: "lx"
    mode: slider

  # Glassets frie kanter over gulvet (2026-09-26, user-målt: "vinduets øverste
  # kant er 228cm over gulvet", underkant 55 cm). Før var 275 hardcodet
  # (55 + 220 fra 09-23-spec'en) — det gjorde modellen ~45 cm for forsigtig. Kalibreret: 26/9 17:18, gardin helt oppe, sol 247,5°/13,0°
  # → model-top 228 − 63 = 165 cm; user så "nederste 20 %" (= 165 cm). Præcis.
  mosbillede_vindue_overkant_cm:
    name: "Mosbillede: glassets overkant over gulvet (cm)"
    icon: mdi:arrow-collapse-up
    min: 100
    max: 350
    step: 1
    unit_of_measurement: "cm"
    mode: box

  mosbillede_vindue_underkant_cm:
    name: "Mosbillede: glassets underkant over gulvet (cm)"
    icon: mdi:arrow-collapse-down
    min: 0
    max: 150
    step: 1
    unit_of_measurement: "cm"
    mode: box

  # 2026-09-26 (user-spec): "50% nedrulning er max for solbeskyttelse, det
  # behøver aldrig at være lavere". Gulv under anbefalet_position — med
  # glas 55-228 cm blokerer 50 % den øverste halvdel af glasset,
  # og den nederste halvdel lander altid under billedets underkant (150 cm)
  # når solen står lavt nok til at nå væggen.
  mosbillede_gardin_min_aaben_pct:
    name: "Mosbillede: gardinet aldrig lavere end (% åben)"
    icon: mdi:arrow-collapse-up
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider

  # TVIVL-zonen (2026-10-18, se header). Hæv az_fra efterhånden som svarene
  # viser at modellen har ret.
  mosbillede_tvivl_az_fra:
    name: "Mosbillede: spørg fra azimut"
    icon: mdi:compass-outline
    min: 180
    max: 360
    step: 1
    unit_of_measurement: "°"
    mode: box

  mosbillede_tvivl_elev_maks:
    name: "Mosbillede: spørg kun under solhøjde"
    icon: mdi:angle-acute
    min: 5
    max: 45
    step: 1
    unit_of_measurement: "°"
    mode: box

  # Både afstanden mellem spørgsmål og hvor længe et svar overstyrer modellen.
  mosbillede_spoerg_minutter:
    name: "Mosbillede: spørg højst hvert (min)"
    icon: mdi:timer-outline
    min: 10
    max: 120
    step: 5
    unit_of_measurement: "min"
    mode: slider

input_select:
  # Runtime: users seneste svar. Gælder kun til mosbillede_facit_til.
  mosbillede_facit:
    name: "Mosbillede: dit seneste svar"
    icon: mdi:account-check
    options:
      - "ingen"
      - "rammer"
      - "rammer ikke"

input_text:
  # Runtime: id på det ubesvarede spørgsmål (joines med svaret i JSONL'en).
  mosbillede_spoerg_pending:
    name: "Mosbillede: ubesvaret spørgsmål"
    max: 32

input_datetime:
  mosbillede_facit_til:
    name: "Mosbillede: svaret gælder til"
    has_date: true
    has_time: true

  mosbillede_spoerg_at:
    name: "Mosbillede: sidst spurgt"
    has_date: true
    has_time: true

  mosbillede_regulering_at:
    name: "Mosbillede: sidste regulering"
    has_date: true
    has_time: true

template:
  - sensor:
      # Hvor HØJT solpletten når op på billedvæggen, i cm over gulvet, med
      # HELT åbent gardin — kun når pletten overlapper billedet (sidelæns og i
      # højden). 0 = solen rammer ikke billedet. Se headerens GEOMETRI.
      # Kilden er sun.sun's egne attributter (opdateres ~2/min) → ingen now()
      # (fejlklasse #24); sensoren er excluderet i recorder'en.
      # Entity_id'et er det gamle (unique_id) — navnet er fra v1-modellen.
      - name: "Mosbillede solindfald cm"
        unique_id: mosbillede_solindfald_cm
        icon: mdi:sun-angle
        unit_of_measurement: "cm"
        state: >-
          {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
          {% set az = state_attr('sun.sun', 'azimuth') | float(-1) %}
          {# 2026-09-30c: FREMSKRIVNING (se headerens 2026-09-30c) — faldet
             regnes på solhøjden om L = input_number.mosbillede_margin_minutter
             (default 10 = regulering 5 + sun.sun-kadence 4 + tick 1).
             Eftermiddag (az > 180) synker solen med 0,2507°/min · cos(bredde)
             · |sin(az)|; formiddag ingen fremskrivning. SAMME formel står i
             anbefalet_position (fejlklasse #2). #}
          {% set L = states('input_number.mosbillede_margin_minutter') | float(10) %}
          {% set rate = 0.2507 * cos((state_attr('zone.home', 'latitude') | float(55.7)) * pi / 180)
                        * ([-sin(az * pi / 180), 0] | max) %}
          {% set el_f = [el - rate * L, 0] | max %}
          {% set n = states('input_number.mosbillede_vindue_azimut') | float(333) %}
          {% set d = ((az - n + 540) % 360) - 180 %}
          {% set D = states('input_number.mosbillede_vaeg_afstand_cm') | float(245) %}
          {% set x1 = states('input_number.mosbillede_billede_fra_cm') | float(10) %}
          {% set x2 = states('input_number.mosbillede_billede_til_cm') | float(85) %}
          {% set z1 = states('input_number.mosbillede_billede_underkant_cm') | float(0) %}
          {% set zh = states('input_number.mosbillede_billede_hoejde_cm') | float(75) %}
          {% set gt = (states('input_number.mosbillede_vindue_overkant_cm') | float(228)) %}
          {% set gb = (states('input_number.mosbillede_vindue_underkant_cm') | float(55)) %}
          {% set gyldig = el > 0.5 and az >= 0 and d > -89 and d < 89 %}
          {% set sh = (D * tan(-d * pi / 180)) if gyldig else 0 %}
          {% set P = (D / cos(d * pi / 180)) if gyldig else 0 %}
          {% set fald = P * tan(el_f * pi / 180) if gyldig else 0 %}
          {% set rammer = gyldig and sh >= x1 and sh - 180 <= x2
                          and gb - fald < z1 + zh and gt - fald > 0 %}
          {# 2026-09-30b: STREJFLYS-boksen (se header) — observeret sol som
             333°-geometrien ikke kan forklare. Samme højde-regel, men med den
             EMPIRISKE vej i stedet for D/cos(Δ). #}
          {% set boks = el > 0.5
             and (states('input_number.mosbillede_boks_az_fra') | float(224)) <= az
             and az <= (states('input_number.mosbillede_boks_az_til') | float(270)) %}
          {% set fald_b = (states('input_number.mosbillede_boks_vej_cm') | float(273))
                          * tan(el_f * pi / 180) if boks else 0 %}
          {% set rammer_b = boks and gb - fald_b < z1 + zh and gt - fald_b > 0 %}
          {{ [([gt - fald, 0] | max) if rammer else 0,
              ([gt - fald_b, 0] | max) if rammer_b else 0] | max | round(0) | int }}
        attributes:
          # on = solen står i den empiriske strejflys-boks (azimut-vinduet),
          # uanset om pletten når op til billedet.
          strejflys_boks: >-
            {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
            {% set az = state_attr('sun.sun', 'azimuth') | float(-1) %}
            {{ el > 0.5
               and (states('input_number.mosbillede_boks_az_fra') | float(224)) <= az
               and az <= (states('input_number.mosbillede_boks_az_til') | float(270)) }}
          vindue_delta_grader: >-
            {% set az = state_attr('sun.sun', 'azimuth') | float(-1) %}
            {% set n = states('input_number.mosbillede_vindue_azimut') | float(333) %}
            {{ (((az - n + 540) % 360) - 180) | round(1) }}
          elevation: "{{ state_attr('sun.sun', 'elevation') | float(-90) | round(1) }}"
          # Solpletten på billedvæggen: cm nord for vinduets nordkant.
          plet_fra_cm: >-
            {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
            {% set az = state_attr('sun.sun', 'azimuth') | float(-1) %}
            {% set n = states('input_number.mosbillede_vindue_azimut') | float(333) %}
            {% set d = ((az - n + 540) % 360) - 180 %}
            {% set D = states('input_number.mosbillede_vaeg_afstand_cm') | float(245) %}
            {% set x1 = states('input_number.mosbillede_billede_fra_cm') | float(10) %}
            {% set x2 = states('input_number.mosbillede_billede_til_cm') | float(85) %}
            {% set z1 = states('input_number.mosbillede_billede_underkant_cm') | float(0) %}
            {% set zh = states('input_number.mosbillede_billede_hoejde_cm') | float(75) %}
            {% set gt = (states('input_number.mosbillede_vindue_overkant_cm') | float(228)) %}
            {% set gb = (states('input_number.mosbillede_vindue_underkant_cm') | float(55)) %}
            {% set gyldig = el > 0.5 and az >= 0 and d > -89 and d < 89 %}
            {% set sh = (D * tan(-d * pi / 180)) if gyldig else 0 %}
            {% set P = (D / cos(d * pi / 180)) if gyldig else 0 %}
            {% set fald = P * tan(el * pi / 180) if gyldig else 0 %}
            {% set rammer = gyldig and sh >= x1 and sh - 180 <= x2
                            and gb - fald < z1 + zh and gt - fald > 0 %}
            {{ (sh - 180) | round(0) if gyldig else none }}
          plet_til_cm: >-
            {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
            {% set az = state_attr('sun.sun', 'azimuth') | float(-1) %}
            {% set n = states('input_number.mosbillede_vindue_azimut') | float(333) %}
            {% set d = ((az - n + 540) % 360) - 180 %}
            {% set D = states('input_number.mosbillede_vaeg_afstand_cm') | float(245) %}
            {% set x1 = states('input_number.mosbillede_billede_fra_cm') | float(10) %}
            {% set x2 = states('input_number.mosbillede_billede_til_cm') | float(85) %}
            {% set z1 = states('input_number.mosbillede_billede_underkant_cm') | float(0) %}
            {% set zh = states('input_number.mosbillede_billede_hoejde_cm') | float(75) %}
            {% set gt = (states('input_number.mosbillede_vindue_overkant_cm') | float(228)) %}
            {% set gb = (states('input_number.mosbillede_vindue_underkant_cm') | float(55)) %}
            {% set gyldig = el > 0.5 and az >= 0 and d > -89 and d < 89 %}
            {% set sh = (D * tan(-d * pi / 180)) if gyldig else 0 %}
            {% set P = (D / cos(d * pi / 180)) if gyldig else 0 %}
            {% set fald = P * tan(el * pi / 180) if gyldig else 0 %}
            {% set rammer = gyldig and sh >= x1 and sh - 180 <= x2
                            and gb - fald < z1 + zh and gt - fald > 0 %}
            {{ sh | round(0) if gyldig else none }}
          skydaekke_pct: "{{ state_attr('weather.forecast_home', 'cloud_coverage') }}"
          underkant_cm: "{{ states('input_number.mosbillede_billede_underkant_cm') | int(0) }}"
          # Den HØJESTE gardin-position (% åben, 5 %-trin, rundet NED = sikker
          # side) hvor pletten stadig ligger under billedets underkant.
          # Antager lineær position over glasset (ukalibreret).
          anbefalet_position: >-
            {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
            {% set az = state_attr('sun.sun', 'azimuth') | float(-1) %}
            {# FREMSKRIVNING — samme formel som state (2026-09-30c). #}
            {% set L = states('input_number.mosbillede_margin_minutter') | float(10) %}
            {% set rate = 0.2507 * cos((state_attr('zone.home', 'latitude') | float(55.7)) * pi / 180)
                          * ([-sin(az * pi / 180), 0] | max) %}
            {% set el_f = [el - rate * L, 0] | max %}
            {% set n = states('input_number.mosbillede_vindue_azimut') | float(333) %}
            {% set d = ((az - n + 540) % 360) - 180 %}
            {% set D = states('input_number.mosbillede_vaeg_afstand_cm') | float(245) %}
            {% set x1 = states('input_number.mosbillede_billede_fra_cm') | float(10) %}
            {% set x2 = states('input_number.mosbillede_billede_til_cm') | float(85) %}
            {% set z1 = states('input_number.mosbillede_billede_underkant_cm') | float(0) %}
            {% set zh = states('input_number.mosbillede_billede_hoejde_cm') | float(75) %}
            {% set gt = (states('input_number.mosbillede_vindue_overkant_cm') | float(228)) %}
            {% set gb = (states('input_number.mosbillede_vindue_underkant_cm') | float(55)) %}
            {% set gyldig = el > 0.5 and az >= 0 and d > -89 and d < 89 %}
            {% set sh = (D * tan(-d * pi / 180)) if gyldig else 0 %}
            {% set P = (D / cos(d * pi / 180)) if gyldig else 0 %}
            {% set fald = P * tan(el_f * pi / 180) if gyldig else 0 %}
            {% set rammer = gyldig and sh >= x1 and sh - 180 <= x2
                            and gb - fald < z1 + zh and gt - fald > 0 %}
            {# Strejflys-boksen (2026-09-30b): samme regel, empirisk vej. #}
            {% set boks = el > 0.5
               and (states('input_number.mosbillede_boks_az_fra') | float(224)) <= az
               and az <= (states('input_number.mosbillede_boks_az_til') | float(270)) %}
            {% set fald_b = (states('input_number.mosbillede_boks_vej_cm') | float(273))
                            * tan(el_f * pi / 180) if boks else 0 %}
            {% set rammer_b = boks and gb - fald_b < z1 + zh and gt - fald_b > 0 %}
            {# 2026-10-18: users svar "rammer" uden model-plet → gulvet. #}
            {% set f_rammer = is_state('input_select.mosbillede_facit', 'rammer')
               and as_timestamp(now()) < (state_attr('input_datetime.mosbillede_facit_til', 'timestamp') | float(0)) %}
            {% if not rammer and not rammer_b %}{{ (states('input_number.mosbillede_gardin_min_aaben_pct') | float(50)) | int if f_rammer else 100 }}
            {% else %}
              {# Den STØRSTE nedrulning af de to vinder: laveste h. #}
              {% set h = z1 + ([fald if rammer else 9999, fald_b if rammer_b else 9999] | min) %}
              {% set p = (h - gb) / ([gt - gb, 1] | max) * 100 %}
              {# 2026-09-26 (user-spec): "50% nedrulning er max for solbeskyttelse,
                 det behøver aldrig at være lavere" → gulv. #}
              {% set gulv = states('input_number.mosbillede_gardin_min_aaben_pct') | float(50) %}
              {{ ([[(p / 5) | round(0, 'floor') * 5, gulv] | max, 100] | min) | int }}
            {% endif %}
          vindue_bredde_cm: 180
          vindue_overkant_cm: "{{ states('input_number.mosbillede_vindue_overkant_cm') }}"
          vindue_underkant_cm: "{{ states('input_number.mosbillede_vindue_underkant_cm') }}"

      # Lux-tærsklen der gælder NU (2026-10-01) — det ENE anker sol_rammer og
      # luk-vejen læser (fejlklasse #2). Slideren er tærsklen ved ≥ 15° sol;
      # under 15° × e^(−0,19 · (15 − elev)), fordi dagslyset i spisestuen
      # falder med solen på klare OG overskyede dage (målt 0,13-0,19/° på
      # 27/9, 30/9 og 1/10 — 0,19 = den hurtigste = tærsklen falder mindst så
      # hurtigt som en klar aften → den slipper ikke en sol der stadig rammer).
      # Holder vi selv gardinet nede: × 0,8 (hysterese mod op/ned-løkke; vores
      # eget gardin på 95-65 % flyttede målt intet: 27/9 ratio 1,49 → 1,64 og
      # 30/9 1,58 → 2,16 lige efter nedrulningen).
      # Excluderet i recorder'en (skifter med sun.sun); logbook-linjen bærer tallet.
      - name: "Mosbillede lux taerskel"
        unique_id: mosbillede_lux_taerskel
        icon: mdi:white-balance-sunny
        unit_of_measurement: "lx"
        state: >-
          {% set t15 = states('input_number.mosbillede_min_lux') | float(400) %}
          {% set el = state_attr('sun.sun', 'elevation') | float(15) %}
          {% set start = t15 * e ** (-0.19 * ([15 - el, 0] | max)) %}
          {{ (start * (0.8 if is_state('input_boolean.mosbillede_gardin_ned', 'on') else 1)) | round(0) }}
        attributes:
          start_lx: >-
            {% set t15 = states('input_number.mosbillede_min_lux') | float(400) %}
            {% set el = state_attr('sun.sun', 'elevation') | float(15) %}
            {{ (t15 * e ** (-0.19 * ([15 - el, 0] | max))) | round(0) }}
          hold: "{{ is_state('input_boolean.mosbillede_gardin_ned', 'on') }}"

      # Den MÅLTE lux mosbilledet afgøres på (2026-10-02) — det ENE anker
      # sol_rammer, luk-vejen og logbook-linjen læser (fejlklasse #2).
      # Hvorfor ikke spisestue_dagslys_lx alene: dens aften-gren FREMSKRIVER et
      # fastholdt sample NEDAD ad solhøjden (dagslyset "kan kun falde") — rigtig
      # retning for en lys-tænd-gate, FORKERT retning for en solbeskyttelse.
      # 2/10 15:50:54 tændte køkkenlyset (samplet frøs på 65,0 lx), solen brød
      # gennem 88 % meldt skydække, og kanalen faldt 58,9 → 53,3 mod tærskel
      # 79 mens den rå Apollo målte 224 lx og solen stod midt på billedet
      # (foto 17:53, az 254°, elev 6,3°). sol_rammer = off, intet gardin.
      # Rå-led: sensor.spisestue_lux_reel (LED-kompenseret, så Apolloens egen
      # RGB ikke ligner sol; clamper den til 0, vinder dagslys-leddet) minus
      # lampelys. 60 lx = over hvad spisestue-sensoren er MÅLT at se fra vores
      # egne lamper i mørke (sensor.spisestue_lux 18/9-2/10 kl. 20:30-05:30:
      # loft+køkken tændt p90 34, max 50; 27/9-noten ~56 lx lyskæde). Sol med
      # gardinet på 50 % målte stadig 146 rå → 86 ≥ tærsklen 71.
      # Excluderet i recorder'en er den IKKE: rå-kanalen gemmes ikke, så denne
      # sensor er det eneste spor at kalibrere tallet mod.
      - name: "Mosbillede lux maalt"
        unique_id: mosbillede_lux_maalt
        icon: mdi:brightness-7
        unit_of_measurement: "lx"
        state: >-
          {% set dl = states('sensor.spisestue_dagslys_lx') | float(0) %}
          {% set raa = states('sensor.spisestue_lux_reel') | float(0) %}
          {{ [dl, raa - 60] | max | round(0) }}
        attributes:
          dagslys_lx: "{{ states('sensor.spisestue_dagslys_lx') }}"
          raa_minus_lampelys: >-
            {{ ((states('sensor.spisestue_lux_reel') | float(0)) - 60) | round(0) }}

  - binary_sensor:
      # DEN ENESTE beslutningskanal: on = solen truer billedet lige nu.
      # Indeholder kill-switchen (fejlklasse #21) → ingen vej ind kan omgå den.
      # delay_on 1 min: en enkelt sky-opdatering eller sol-sample må ikke rykke
      # gardinet. delay_off 15 min: solen skal være VÆK et kvarter før vi
      # slipper (flimrer betingelsen, genstarter delay_off = konservativt).
      - name: "Mosbillede sol rammer"
        unique_id: mosbillede_sol_rammer
        icon: mdi:weather-sunny-alert
        delay_on: "00:01:00"
        # 2026-10-18: users svar "rammer ikke" slipper straks.
        delay_off: >-
          {{ '00:00:00' if is_state('input_select.mosbillede_facit', 'rammer ikke')
             and as_timestamp(now()) < (state_attr('input_datetime.mosbillede_facit_til', 'timestamp') | float(0))
             else '00:15:00' }}
        state: >-
          {% set top = states('sensor.mosbillede_solindfald_cm') | float(0) %}
          {% set z1 = states('input_number.mosbillede_billede_underkant_cm') | float(0) %}
          {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
          {% set az = state_attr('sun.sun', 'azimuth') | float(-1) %}
          {% set fri = states('input_number.mosbillede_solnedgang_fri_grader') | float(0) %}
          {# 2026-10-01 (user: "beskyttes trods overskyet/lav lux"): den MÅLTE
             lux afgør nu hele episoden — mod en tærskel der følger solen ned
             (sensor.mosbillede_lux_taerskel; × 0,8 mens vi holder gardinet).
             Før: lux ELLER skydække < maks ELLER "vi holder allerede" → 1/10
             startede den ved 212 lx (≥ 90) og rullede videre ned til 65 % ved
             27 lx, fordi holdet slugte lux-kravet. Skydækket (prognose) er
             ude: 24/9 ramte solen ved 64-84 % meldt (29/9-lærdommen). Den
             ukendte tærskel → float(0) → beskyt (sikker side). #}
          {% set lx = states('sensor.mosbillede_lux_maalt') | float(0) %}
          {% set graense = states('sensor.mosbillede_lux_taerskel') | float(0) %}
          {# 2026-10-18: users svar (spørg-træneren) ER modellen til facit_til. #}
          {% set fa = states('input_select.mosbillede_facit') %}
          {% set f_aktiv = fa in ['rammer', 'rammer ikke']
             and as_timestamp(now()) < (state_attr('input_datetime.mosbillede_facit_til', 'timestamp') | float(0)) %}
          {% set plet = (fa == 'rammer') if f_aktiv else (top > 0 and top > z1) %}
          {{ is_state('input_boolean.mosbillede_solbeskyttelse_enabled', 'on')
             and is_state('sun.sun', 'above_horizon')
             and plet
             and lx >= graense
             and not (az > 180 and el < fri) }}
        attributes:
          solnedgang_fri: >-
            {{ (state_attr('sun.sun', 'azimuth') | float(-1)) > 180
               and (state_attr('sun.sun', 'elevation') | float(-90))
                   < (states('input_number.mosbillede_solnedgang_fri_grader') | float(0)) }}
          plet_top_cm: "{{ states('sensor.mosbillede_solindfald_cm') }}"
          facit: >-
            {{ states('input_select.mosbillede_facit')
               if as_timestamp(now()) < (state_attr('input_datetime.mosbillede_facit_til', 'timestamp') | float(0))
               else 'ingen' }}
          underkant_cm: "{{ states('input_number.mosbillede_billede_underkant_cm') | int(0) }}"

      # 2026-10-18: TVIVL-zonen (se header) — her spørger træneren user.
      - name: "Mosbillede i tvivl"
        unique_id: mosbillede_i_tvivl
        icon: mdi:help-circle-outline
        state: >-
          {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
          {% set az = state_attr('sun.sun', 'azimuth') | float(-1) %}
          {{ is_state('input_boolean.mosbillede_solbeskyttelse_enabled', 'on')
             and is_state('sun.sun', 'above_horizon')
             and az >= (states('input_number.mosbillede_tvivl_az_fra') | float(255))
             and el <= (states('input_number.mosbillede_tvivl_elev_maks') | float(20))
             and el >= (states('input_number.mosbillede_solnedgang_fri_grader') | float(0))
             and (states('sensor.mosbillede_lux_maalt') | float(0))
                 >= (states('sensor.mosbillede_lux_taerskel') | float(0)) }}

automation:
  # ---------------------------------------------------------------------------
  # LUK spisestue-vest når solen når længere ind end slideren tillader.
  # Kører i BÅDE Active og Dormant (user-spec) — i AirBnB kun i Dormant.
  # ---------------------------------------------------------------------------
  - id: mosbillede_gardin_luk
    alias: "Mosbillede: regulér spisestue-vest mod direkte sol"
    description: >
      Kører spisestue-vest NED til den højeste position hvor solpletten på
      billedvæggen bliver under input_number.mosbillede_billede_underkant_cm
      (sensor.mosbillede_solindfald_cm → anbefalet_position), højst hvert
      input_number.mosbillede_regulering_minutter. Kun nedad under en episode
      (solen synker → dybden vokser); op sker først ved frigivelsen. Sætter
      input_boolean.mosbillede_gardin_ned, som ligger i
      sensor.gardiner_manual_hold's 'held' → ingen auto-åbner river det op.
    mode: single
    # 2026-09-23 (user-spec): "reguleringen af hvor meget gardinet er rullet
    # ned skal ske løbende hvert N'te minut, default 10min, så vi får så meget
    # lys ind der ikke rammer mosbilledet som muligt". Før: fuld luk.
    # Delpositionerne kører RELATIVT ned (gardin_spisestue_position, uden
    # re-home), så en regulering aldrig ruller gardinet helt op midt i solen.
    trigger:
      - platform: state
        entity_id: binary_sensor.mosbillede_sol_rammer
        from: "off"
        to: "on"
      # Tick hvert minut; intervallet (slider) håndhæves af stemplet nedenfor.
      # Første condition (sol_rammer) er off det meste af døgnet → billig no-op.
      - platform: time_pattern
        minutes: "/1"
    condition:
      - condition: state
        entity_id: binary_sensor.mosbillede_sol_rammer
        state: "on"
      # Manuel op vinder indtil næste Dormant / næste manuelle betjening.
      - condition: state
        entity_id: input_boolean.mosbillede_manuel_op_hold
        state: "off"
      # AirBnB: kør KUN ned mens huset er Dormant (user-spec). Normal og
      # Home Vacation: altid (begge er "familie-modes", jf. AirBnB-regel #1).
      - condition: template
        value_template: >-
          {{ not is_state('input_select.house_mode', 'AirBnB')
             or is_state('input_select.house_state', 'Dormant') }}
      # Sleep Over: motorlarm + dagslys vækker gæsten på sofaen (samme grund
      # som sleepover-holdet i gardin_manual_grace).
      - condition: state
        entity_id: binary_sensor.sleepover_openplan_moerkt
        state: "off"
      # 2026-09-26: forbi solnedgangs-fri-grænsen lukker vi aldrig — ellers
      # ville luk-vejen (sol_rammer står on i sin 15-min delay_off) køre
      # gardinet ned igen lige efter at frigivelsen rullede det op.
      - condition: template
        value_template: >-
          {{ not ((state_attr('sun.sun', 'azimuth') | float(-1)) > 180
                  and (state_attr('sun.sun', 'elevation') | float(-90))
                      < (states('input_number.mosbillede_solnedgang_fri_grader') | float(0))) }}
      # Højst én kørsel pr. reguleringsinterval.
      - condition: template
        value_template: >-
          {% set t = state_attr('input_datetime.mosbillede_regulering_at', 'timestamp') | float(0) %}
          {{ as_timestamp(now()) - t
             >= (states('input_number.mosbillede_regulering_minutter') | float(10)) * 60 - 20 }}
      # Målt sol i rummet LIGE NU (sol_rammer's delay_off kan stadig stå on i
      # 15 min efter en sky) — også mens vi holder gardinet: et skydække
      # midt i episoden fryser positionen i stedet for at rulle videre ned
      # (2026-10-01). Samme anker som sol_rammer (hold-tærsklen × 0,8).
      - condition: template
        value_template: >-
          {{ (states('sensor.mosbillede_lux_maalt') | float(0))
             >= (states('sensor.mosbillede_lux_taerskel') | float(0)) }}
      # Kun hvis gardinet skal LÆNGERE NED end det er (≥ 5 %-point).
      - condition: template
        value_template: >-
          {% set maal = state_attr('sensor.mosbillede_solindfald_cm', 'anbefalet_position') | int(100) %}
          {% set p = state_attr('cover.gardin_spisestue_vest', 'current_position') %}
          {% set nu = (p | float(100)) if p is not none
                      else (0 if is_state('cover.gardin_spisestue_vest', 'closed') else 100) %}
          {{ maal <= nu - 5 }}
    action:
      - variables:
          maal: "{{ state_attr('sensor.mosbillede_solindfald_cm', 'anbefalet_position') | int(0) }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.mosbillede_regulering_at
        data:
          timestamp: "{{ as_timestamp(now()) | int }}"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.mosbillede_gardin_ned
      - if:
          - condition: template
            value_template: "{{ maal <= 1 }}"
        then:
          - service: cover.close_cover
            continue_on_error: true
            target:
              entity_id: cover.gardin_spisestue_vest
        else:
          - service: cover.set_cover_position
            continue_on_error: true
            target:
              entity_id: cover.gardin_spisestue_vest
            data:
              position: "{{ maal }}"
      - service: logbook.log
        data:
          name: "Mosbillede"
          message: >-
            Spisestue-vest → {{ maal }} % åben — solpletten når
            {{ states('sensor.mosbillede_solindfald_cm') }} cm op ad billedvæggen med
            åbent gardin (underkant {{ states('input_number.mosbillede_billede_underkant_cm') | int(0) }} cm,
            elev {{ state_attr('sun.sun','elevation') | round(0) }}° az
            {{ state_attr('sun.sun','azimuth') | round(0) }}°, skyer
            {{ state_attr('weather.forecast_home','cloud_coverage') }} %,
            målt {{ states('sensor.mosbillede_lux_maalt') }} lx mod tærskel
            {{ states('sensor.mosbillede_lux_taerskel') }} lx{{
            ', strejflys-boks' if state_attr('sensor.mosbillede_solindfald_cm', 'strejflys_boks') else '' }}).
          entity_id: cover.gardin_spisestue_vest

  # ---------------------------------------------------------------------------
  # FRIGIV igen når solen har været væk et kvarter (delay_off) — men kun i
  # dagslys og indenfor en civiliseret tid: ingen gardiner der kører op efter
  # solnedgang (privatliv) eller kl. 05 om morgenen.
  # ---------------------------------------------------------------------------
  - id: mosbillede_gardin_frigiv
    alias: "Mosbillede: åbn spisestue-vest igen når solen er væk"
    description: >
      Rydder ejerskabet og åbner gardinet når solen ikke længere truer (eller
      featuren slås fra). Åbningen subtraherer sensor.gardiner_manual_hold's
      'held' → i AirBnB (hvor alle fire gardiner altid er holdt) ryddes flaget,
      men gardinet forbliver nede: "bliver huset aktivt må gardinet gerne
      forblive nede" (user-spec).
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.mosbillede_sol_rammer
        from: "on"
        to: "off"
      - platform: time_pattern
        minutes: "/15"
      # 2026-09-26 (user: "hvad med oprulning når solen er så godt som nede ...
      # og de sidste 10min? fix"): når solen krydser solnedgangs-fri-grænsen,
      # er beskyttelsen slut — rul op MED DET SAMME i stedet for at vente
      # sol_rammer's 15-min delay_off (den er sky-flimmer-buffer, ikke
      # solnedgangs-logik). Målt 26/9: fri 18:18, frigivelse ville først være
      # kommet 18:33.
      - platform: template
        value_template: >-
          {{ (state_attr('sun.sun', 'azimuth') | float(-1)) > 180
             and (state_attr('sun.sun', 'elevation') | float(-90))
                 < (states('input_number.mosbillede_solnedgang_fri_grader') | float(0)) }}
        id: solnedgang
    condition:
      - condition: template
        value_template: >-
          {{ is_state('binary_sensor.mosbillede_sol_rammer', 'off')
             or ((state_attr('sun.sun', 'azimuth') | float(-1)) > 180
             and (state_attr('sun.sun', 'elevation') | float(-90))
                 < (states('input_number.mosbillede_solnedgang_fri_grader') | float(0))) }}
      - condition: state
        entity_id: input_boolean.mosbillede_gardin_ned
        state: "on"
      # Kun i DAGSLYS: et gardin der kører op efter solnedgang er et kig lige
      # ind i spisestuen. Derfor above_horizon + 07:00-20:00 — og BEVIDST ingen
      # elevations-gulv: i december topper solen på 11°, så et krav om 5° ville
      # holde gardinet nede til kl. 10 hver vintermorgen (morgenrutinen kan ikke
      # åbne det imens — vores flag ligger i 'held'). Sol over horisonten er
      # nok: solen står i ØST om morgenen, hvor cos(Δ) < 0 = intet indfald.
      - condition: state
        entity_id: sun.sun
        state: "above_horizon"
      - condition: time
        after: "07:00:00"
        before: "20:00:00"
      # Ferie-batterispar: lad gardinet blive nede frem for at køre det op og
      # ned hver dag (se header). Flaget ryddes stadig ikke — vi ejer det til
      # pausen slippes, så ingen anden auto-åbner overtager i mellemtiden.
      - condition: state
        entity_id: input_boolean.gardin_dormant_pause_active
        state: "off"
    action:
      # Flaget FØRST: det ligger selv i 'held', så open_cover-filteret nedenfor
      # ville ellers filtrere vores eget gardin væk. 2 s giver template-sensoren
      # tid til at re-rendere før listen bygges.
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mosbillede_gardin_ned
      - delay:
          seconds: 2
      - service: cover.open_cover
        continue_on_error: true
        target:
          entity_id: >-
            {% set held = state_attr('sensor.gardiner_manual_hold', 'held') | default([]) %}
            {{ ['cover.gardin_spisestue_vest'] | reject('in', held) | list }}
      - service: logbook.log
        data:
          name: "Mosbillede"
          message: >-
            Spisestue-vest frigivet — solpletten
            {{ states('sensor.mosbillede_solindfald_cm') }} cm mod underkant
            {{ states('input_number.mosbillede_billede_underkant_cm') | int(0) }} cm{{
            ' (solnedgangs-fri: solen under ' ~ states('input_number.mosbillede_solnedgang_fri_grader') | int(0) ~ '°)'
            if trigger is defined and trigger.id == 'solnedgang' else ' i 15 min' }}{{ ' (gardinet blev nede: holdt af ' ~ (state_attr('sensor.gardiner_manual_hold','held') | default([]) | count) ~ ' hold)'
                  if 'cover.gardin_spisestue_vest' in (state_attr('sensor.gardiner_manual_hold','held') | default([])) else '' }}.
          entity_id: cover.gardin_spisestue_vest

  # ---------------------------------------------------------------------------
  # MANUEL OP → hold gardinet oppe indtil næste Dormant eller næste manuelle
  # betjening (user-spec). Manuel = context.user_id is not none (fejlklasse #3:
  # `parent_id is none` er IKKE manuel — knap-handlere og scener har parent).
  # Den fysiske Somfy-fjernbetjening er RF-envejs og usynlig for HA (kendt
  # begrænsning, samme som gardin_manual_grace).
  # ---------------------------------------------------------------------------
  - id: mosbillede_manuel_op_stempel
    alias: "Mosbillede: manuel op af spisestue-vest vinder"
    mode: single
    trigger:
      - platform: state
        entity_id: cover.gardin_spisestue_vest
        to: "open"
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.context.user_id is not none }}"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.mosbillede_manuel_op_hold
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mosbillede_gardin_ned
      - service: logbook.log
        data:
          name: "Mosbillede"
          message: >-
            Manuel åbning registreret — solbeskyttelsen holder sig væk indtil
            huset går Dormant igen (eller gardinet betjenes manuelt).
          entity_id: cover.gardin_spisestue_vest

  # ---------------------------------------------------------------------------
  # Holdet slippes: (a) næste Dormant-overgang, (b) en MANUEL luk (så har user
  # selv genoptaget "gardinet må være nede"). "indtil næste dormant eller
  # manuel osv" (user-spec).
  # ---------------------------------------------------------------------------
  - id: mosbillede_manuel_hold_ryd
    alias: "Mosbillede: ryd manuel-op-hold ved Dormant eller manuel luk"
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.house_state
        to: "Dormant"
        id: dormant
      - platform: state
        entity_id: cover.gardin_spisestue_vest
        to: "closed"
        id: manuel_luk
    condition:
      - condition: state
        entity_id: input_boolean.mosbillede_manuel_op_hold
        state: "on"
      - condition: template
        value_template: >-
          {{ trigger.id == 'dormant'
             or trigger.to_state.context.user_id is not none }}
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mosbillede_manuel_op_hold
      - service: logbook.log
        data:
          name: "Mosbillede"
          message: >-
            Manuel-op-holdet sluppet ({{ 'huset gik Dormant' if trigger.id == 'dormant'
            else 'gardinet blev lukket manuelt' }}) — solbeskyttelsen er aktiv igen.
          entity_id: cover.gardin_spisestue_vest

  # ---------------------------------------------------------------------------
  # Ryd ejerskabs-flaget hvis gardinet åbnes af NOGEN ANDEN end os (morgen-
  # rutine, forsvarets genåbning, en scene-restore). Ellers ville flaget hænge
  # og blokere alle auto-åbnere for evigt (fejlklasse #15).
  # ---------------------------------------------------------------------------
  - id: mosbillede_flag_ryd_ved_aabning
    alias: "Mosbillede: ryd hold-flag når spisestue-vest åbnes"
    mode: single
    trigger:
      - platform: state
        entity_id: cover.gardin_spisestue_vest
        to: "open"
        # 2026-10-18: en template-reload gav unavailable → open (17:08:46) og
        # ryddede flaget midt i en episode → frigivelsen ville aldrig rulle op.
        not_from: ["unavailable", "unknown"]
    condition:
      - condition: state
        entity_id: input_boolean.mosbillede_gardin_ned
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mosbillede_gardin_ned

  # ---------------------------------------------------------------------------
  # SPØRG-TRÆNEREN (2026-10-18, se header): i tvivl → push "rammer solen?",
  # svaret overstyrer modellen i spoerg_minutter og logges til JSONL.
  # ---------------------------------------------------------------------------
  - id: mosbillede_spoerg
    alias: "Mosbillede: spørg Parent A når modellen er i tvivl"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.mosbillede_i_tvivl
        from: "off"
        to: "on"
        for: "00:02:00"
      # Gen-spørg mens tvivlen varer; intervallet håndhæves af stemplet.
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: binary_sensor.mosbillede_i_tvivl
        state: "on"
      - condition: state
        entity_id: input_boolean.mosbillede_spoerg_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.notifikationer_master_enabled
        state: "on"
      # AirBnB = silent (telefonen kan være i gæstens hænder).
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: "AirBnB"
      # Han skal kunne se væggen.
      - condition: state
        entity_id: person.parent_a
        state: "home"
      - condition: template
        value_template: >-
          {{ as_timestamp(now())
             - (state_attr('input_datetime.mosbillede_spoerg_at', 'timestamp') | float(0))
             >= (states('input_number.mosbillede_spoerg_minutter') | float(30)) * 60 - 20 }}
    action:
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.mosbillede_spoerg_at}
        data: {timestamp: "{{ as_timestamp(now()) | int }}"}
      - variables:
          fb_id: "{{ now().strftime('%Y%m%d%H%M%S') }}"
          # Modellens eget gæt (uden users svar): når pletten over billedets underkant?
          model: >-
            {{ (states('sensor.mosbillede_solindfald_cm') | float(0))
               > ([states('input_number.mosbillede_billede_underkant_cm') | float(0), 0] | max) }}
          payload_b64: >-
            {{ {
              'type': 'ask',
              'id': fb_id,
              'ts': now().isoformat(),
              'model_siger_rammer': model,
              'az': state_attr('sun.sun', 'azimuth'),
              'elev': state_attr('sun.sun', 'elevation'),
              'plet_top_cm': states('sensor.mosbillede_solindfald_cm'),
              'strejflys_boks': state_attr('sensor.mosbillede_solindfald_cm', 'strejflys_boks'),
              'vindue_delta_grader': state_attr('sensor.mosbillede_solindfald_cm', 'vindue_delta_grader'),
              'lux_maalt': states('sensor.mosbillede_lux_maalt'),
              'lux_taerskel': states('sensor.mosbillede_lux_taerskel'),
              'gardin_pct': state_attr('cover.gardin_spisestue_vest', 'current_position'),
              'gardin_ned_af_os': states('input_boolean.mosbillede_gardin_ned'),
              'skyer_pct': state_attr('weather.forecast_home', 'cloud_coverage')
            } | to_json | base64_encode }}
      - service: input_text.set_value
        target: {entity_id: input_text.mosbillede_spoerg_pending}
        data: {value: "{{ fb_id }}"}
      - service: shell_command.ai_feedback_append
        data: {log_slug: mosbillede, payload_b64: "{{ payload_b64 }}"}
      - service: notify.mobile_app_phone_a
        data:
          title: "🖼 Rammer solen mosbilledet nu?"
          # Skygger gardinet, kan han ikke SE svaret → spørg om pletten
          # ville nå billedet uden gardinet (det er det modellen gætter på).
          message: >-
            Mit gæt er {{ 'ja' if model else 'nej' }}.{{
            ' Gardinet er rullet ned – svar om solen ville have ramt billedet uden det.'
            if is_state('input_boolean.mosbillede_gardin_ned', 'on') else '' }}
          data:
            tag: mosbillede_spoerg
            actions:
              - action: "MOSBILLEDE_SVAR_RAMMER"
                title: "☀️ Ja, den rammer"
              - action: "MOSBILLEDE_SVAR_RAMMER_IKKE"
                title: "Nej"

  - id: mosbillede_svar
    alias: "Mosbillede: Parent A's svar → overstyr modellen + log"
    mode: queued
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
    condition:
      - condition: template
        value_template: >-
          {{ trigger.event.data.action | default('')
             in ['MOSBILLEDE_SVAR_RAMMER', 'MOSBILLEDE_SVAR_RAMMER_IKKE'] }}
      - condition: template
        value_template: >-
          {{ states('input_text.mosbillede_spoerg_pending')
             not in ['', 'unknown', 'unavailable'] }}
    action:
      - variables:
          svar: "{{ 'rammer' if trigger.event.data.action == 'MOSBILLEDE_SVAR_RAMMER' else 'rammer ikke' }}"
          minutter: "{{ states('input_number.mosbillede_spoerg_minutter') | int(30) }}"
          payload_b64: >-
            {{ {
              'type': 'answer',
              'id': states('input_text.mosbillede_spoerg_pending'),
              'ts': now().isoformat(),
              'answer': svar,
              'model_siger_rammer': (states('sensor.mosbillede_solindfald_cm') | float(0))
                > ([states('input_number.mosbillede_billede_underkant_cm') | float(0), 0] | max),
              'az': state_attr('sun.sun', 'azimuth'),
              'elev': state_attr('sun.sun', 'elevation')
            } | to_json | base64_encode }}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.mosbillede_facit_til}
        data: {timestamp: "{{ as_timestamp(now()) | int + minutter * 60 }}"}
      - service: input_select.select_option
        target: {entity_id: input_select.mosbillede_facit}
        data: {option: "{{ svar }}"}
      - service: shell_command.ai_feedback_append
        data: {log_slug: mosbillede, payload_b64: "{{ payload_b64 }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.mosbillede_spoerg_pending}
        data: {value: ""}
      - service: logbook.log
        data:
          name: "Mosbillede"
          message: >-
            Parent A svarede "{{ svar }}" (sol {{ state_attr('sun.sun','azimuth') | round(0) }}° /
            {{ state_attr('sun.sun','elevation') | round(0) }}°) — gælder i {{ minutter }} min.
          entity_id: cover.gardin_spisestue_vest
      - service: notify.mobile_app_phone_a
        data:
          title: "🖼 Tak"
          message: >-
