# GENERERET af scripts/ejerskab.py fra ejerskab/*.yaml — RET IKKE HER. Ret registret og kør `python3 scripts/ejerskab.py gen`.
# Lamper med et ejerskabs-register. Rum-logik må tænde/slukke dem, aldrig
# sætte deres udseende (script_pkg/room_logic.yaml læser listen).
template:
  - sensor:
      - name: "Lys ejerskab"
        unique_id: lys_ejerskab
        icon: mdi:crown-outline
        state: "1"
        attributes:
          styrede: "{{ ['light.koekken_lyskaede'] }}"
