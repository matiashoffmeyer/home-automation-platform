name: Trail Buddy
description: Lycian Way hiking app for the group, published on its own Tailscale Funnel address; Home Assistant reads it on the internal network. See README.md.
version: "0.6.27"
slug: trailbuddy
init: false
arch:
  - amd64
startup: application
boot: auto
# No host ports (none listed on purpose): the public way in is this add-on's own
# Tailscale Funnel, and Home Assistant reaches it on the Docker network as
# http://local-trailbuddy:8080.
options:
  trip_code: ""
  tailscale_authkey: ""
  tailscale_hostname: trail
  funnel: true
  log_level: info
schema:
  trip_code: password
  tailscale_authkey: password
  tailscale_hostname: str
  funnel: bool
  log_level: list(debug|info|warning)
