name: Spotify-bro
description: Spotify Connect for the kitchen speaker that does not die - go-librespot whose audio is always drained and streamed to the AxiomAir N3 as a Volumio webradio, with pause, volume and hand-over kept in sync with the app (B237). See README.md.
version: "0.1.4"
slug: spotify_bro
init: false
# zeroconf (mDNS) must reach the phones, and the N3 must reach the stream.
host_network: true
# Pokes HA to re-read sensor.spotify_bro on every change.
homeassistant_api: true
arch:
  - amd64
  - aarch64
startup: application
# Started by HA's method switch only (like Music Assistant, B204).
boot: manual
options:
  device_name: "Højttaler"
  bitrate: 320
  normalisation: true
  interface: enp0s25
  api_port: 38950
  speaker_host: 192.0.2.42
  volumio_port: 3000
  mpd_port: 6600
  stream_host: 192.0.2.151
  stream_port: 8098
  format: l16
  icy: true
  lead_ms: 300
  backlog_s: 0.5
  start_hold_s: 3.0
  client_queue_s: 4.0
  own_grace_s: 6.0
  confirm_s: 2.5
  stop_grace_s: 2.0
  reconcile_s: 10.0
  speaker_control: true
  volume_sync: true
  ha_entity: sensor.spotify_bro
  log_level: info
schema:
  device_name: str
  bitrate: list(96|160|320)
  normalisation: bool
  interface: str?
  api_port: port
  speaker_host: str
  volumio_port: port
  mpd_port: port
  stream_host: str
  stream_port: port
  format: list(l16|flac)
  icy: bool
  lead_ms: int(0,3000)
  backlog_s: float(0,10)
  start_hold_s: float(0,10)
  client_queue_s: float(1,20)
  own_grace_s: float(0,30)
  confirm_s: float(0,30)
  stop_grace_s: float(0,10)
  reconcile_s: float(2,120)
  speaker_control: bool
  volume_sync: bool
  ha_entity: str?
  log_level: list(debug|info|warning)
