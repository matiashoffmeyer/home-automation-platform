name: Gesture Frame Shim
description: Serves single JPEG frames from RTSP sub-streams on the /api/<camera>/latest.jpg path the Hand Recognition add-on expects, reports whether a body tall enough to reach the frame is moving in it, turns the camera's own microphone into a short list of spoken commands, arms that microphone when somebody looks into the lens, and blacks out hands too far away to be a deliberate gesture.
version: "0.16.2"
slug: gesture_frame_shim
init: false
homeassistant_api: true
# /share holds the armed-window voice clips (voice_save_clips).
map:
  - type: share
    read_only: false
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: JPEG snapshot endpoint
options:
  port: 8090
  fps: 4
  jpeg_quality: 5
  idle_timeout: 30
  motion: true
  motion_always: true
  motion_cell_delta: 12
  motion_min_cells: 8
  motion_hold: 3
  motion_ignore_top_rows: 6
  motion_min_frames: 3
  motion_max_mean_shift_pct: 6
  voice: true
  voice_switch: input_boolean.voice_kommandoer_enabled
  voice_threshold_dbfs: -35
  voice_zcr_max: 110
  voice_min_utt: 0.9
  voice_max_utt: 4.0
  voice_cooldown: 8
  voice_body_window: 120
  voice_arm_window: 12
  voice_save_clips: true
  stt_host: core-speech-to-phrase
  stt_port: 10300
  gaze: true
  gaze_switch: input_boolean.koekken_blik_arm_enabled
  gaze_threshold_deg: 15
  gaze_frames: 2
  palm_min_px: 120
  palm_log: true
  cameras:
    - name: koekken
      rtsp_url: "rtsp://<user>:<password>@<camera-ip>:554/stream2"
      presence_entity: binary_sensor.koekken_apollo_occupancy_filtered
      arm_entity: input_text.koekken_stemme_armeret_at
schema:
  port: port
  fps: int(1,15)
  jpeg_quality: int(2,31)
  idle_timeout: int(5,300)
  motion: bool
  motion_always: bool
  motion_cell_delta: int(2,64)
  motion_min_cells: int(1,128)
  motion_hold: int(0,30)
  motion_ignore_top_rows: int(0,17)
  motion_min_frames: int(1,10)
  motion_max_mean_shift_pct: int(1,60)
  voice: bool
  voice_switch: str
  voice_threshold_dbfs: int(-60,-10)
  voice_zcr_max: int(20,400)
  voice_min_utt: float(0.3,3.0)
  voice_max_utt: float(1.0,10.0)
  voice_cooldown: int(0,120)
  voice_body_window: int(5,600)
  voice_arm_window: int(5,60)
  voice_save_clips: bool?
  stt_host: str
  stt_port: port
  gaze: bool
  gaze_switch: str
  gaze_threshold_deg: int(5,60)
  gaze_frames: int(1,8)
  palm_min_px: int(0,300)?
  palm_log: bool?
  cameras:
    - name: str
      rtsp_url: password
      presence_entity: str?
      arm_entity: str?
