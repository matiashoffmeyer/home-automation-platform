# Home Assistant Configuration
# Infrastructure as Code - GitHub managed
# Location (name + coordinates) lives only in secrets.yaml; contract: secrets.example.yaml
#
# Host: Intel NUC running HAOS 2026.4.0
# See docs/hardware.md for the full host/integration inventory
# See docs/zigbee.md for Zigbee coordinator details

homeassistant:
  name: !secret home_name
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: 10
  unit_system: metric
  currency: DKK
  country: DK
  time_zone: "Europe/Copenhagen"
  packages: !include_dir_named packages/
  customize: !include customize.yaml

# Includes
automation: !include_dir_merge_list automations/
script: !include_dir_merge_named script_pkg/
scene: !include_dir_merge_list scene_snapshots/   # snapshot-overrides (script.scene_overwrite); scenes.yaml var altid tom

# =============================================================================
# Zigbee coordinator
# =============================================================================
# Nabu Casa ZBT-2 (Home Assistant Connect ZBT-2)
#   Serial:      911599ED786C
#   USB path:    /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_911599ED786C-if00
#   Radio:       ezsp 7.5.1.0 (hardware flow control, 460800 baud)
#   Integration: ZHA (configured via UI)
# Full details: docs/zigbee.md
#
# Thread / OpenThread Border Router - PLANNED, not yet installed
# See docs/hardware.md for roadmap notes on the Sonoff ZBDongle-E (ZBT-1)
#
# NB: ZHA device_config (consider_unavailable_mains m.fl.) MAA IKKE saettes
# her i YAML naar integrationen er sat op via UI/config-flow. Det kan crashe
# bindings paa Styrbar-remoter. Brug i stedet device-pagen i UI eller
# accepter default 7200 sek timeout.
#
# custom_quirks_path er derimod sikker (egen schema-noegle, roerer ikke
# device_config) og verificeret i core 2026.4.0's ZHA_CONFIG_SCHEMA. Den
# indlaeses KUN ved fuld restart. Mappen indeholder pt. entre-roegalarmen
# (_TZE284_mqaeyix5 TS0601), som ikke er understoettet upstream.
# ADVARSEL: en quirk der kaster ved import kan forhindre HELE ZHA i at starte
# (= alle Zigbee-enheder doede). Test-importer altid filen mod samme
# zha-quirks-version foer restart.
# =============================================================================
zha:
  custom_quirks_path: /config/custom_zha_quirks

# =============================================================================
# Lovelace dashboards (mode: storage = default, kan UI-redigeres)
# =============================================================================
# Tilfojer custom YAML-dashboard "Scener" til kontrol fra HA Companion app.
# Default "Overview" dashboard er stadig storage-mode (UI). "Map" er slettet
# 2026-08-17 (ubrugt onboarding-levn; map-integrationen er ikke loadet, så det
# genskabes ikke).
# =============================================================================
lovelace:
  mode: storage
  dashboards:
    lys-dash:
      mode: yaml
      title: Lys
      icon: mdi:lightbulb-group
      show_in_sidebar: true
      filename: dashboards/lights.yaml
      # 2026-06-05: ryddeligt lys-overblik der erstatter den auto-genererede
      # "Lights"-side (ulogisk rækkefølge + rod i "Other lights"). Hyphen i
      # url_path-key er påkrævet for custom YAML-dashboards (jf. scener-dash).
    scener-dash:
      mode: yaml
      title: Scener
      icon: mdi:palette
      show_in_sidebar: true
      filename: dashboards/scenes.yaml
      # NB: HA kræver hyphen i url_path (= dictionary key) for custom YAML
      # dashboards. "scener" alene = config_invalid + frontend fails to load.
    indstillinger-dash:
      mode: yaml
      title: Indstillinger
      icon: mdi:cog
      show_in_sidebar: true
      filename: dashboards/settings.yaml
      # 2026-06-16: split af tidligere "Diagnostik" — sliders + kill-switches +
      # override-toggles. Live device-status flyttet til status-dash.
      # 2026-09-30 (user): Støvsug, Mad, AirBnB, Tapo og Vandventil er FANER her
      # i stedet for egne dashboards — "alle indstillinger ind under den side
      # som faner". Lys, Scener, Festlys og info-siderne forbliver egne sider.
      # 2026-09-30b (user): Mad og Støvsug fik deres KONTROLPANEL tilbage som
      # egne dashboards (mad-dash, stoevsug-dash); indstillingerne bliver her.
    mad-dash:
      mode: yaml
      title: Mad
      icon: mdi:silverware-fork-knife
      show_in_sidebar: true
      filename: dashboards/mad.yaml
      # 2026-07-29: opskrifter + ret-afstemning + indkøbsliste/Nemlig.
      # 2026-09-30b: kun kontrolpanelet — alle sliders er fanen 🥘 Mad på
      # Indstillinger. Samme url_path som før, så pushene fra
      # scripts/mad_planner.py (/mad-dash/0, /mad-dash/afstemning) virker.
    stoevsug-dash:
      mode: yaml
      title: Støvsug
      icon: mdi:robot-vacuum
      show_in_sidebar: true
      filename: dashboards/stoevsug.yaml
      # 2026-08-22: betjeningsflade for de 16 rum-scripts fra
      # packages/roborock_rum_scripts.yaml (samme entities som app-widgets).
      # 2026-09-30b: kun kontrolpanelet (Rengør + Robot & dok) — alle
      # indstillinger er fanen 🧹 Støvsug på Indstillinger.
    status-dash:
      mode: yaml
      title: Status
      icon: mdi:home-analytics
      show_in_sidebar: true
      filename: dashboards/status.yaml
      # 2026-06-16: split af tidligere "Diagnostik" — read-only live status quo
      # fra alle rum (temp/lux/presence), batterier, sensor-health, logbook.
    forbrug-dash:
      mode: yaml
      title: Statistik
      icon: mdi:chart-box
      show_in_sidebar: true
      filename: dashboards/forbrug.yaml
      # 2026-06-18: lys-forbrug pr. pære (rum + hus) + historik +
      # høj-forbrug-notifikationer + TIMMERFLOTTE temp/fugt.
      # 2026-06-19: omdøbt Forbrug → Statistik; samler ALLE grafer (også estimeret
      # strøm + kr/dag). url_path-key forbrug-dash beholdt (bevarer bogmærker).
    planter-dash:
      mode: yaml
      title: Planter
      icon: mdi:sprout
      show_in_sidebar: true
      filename: dashboards/planter.yaml
      # 2026-06-15: dedikeret plante-side med upcoming varsler (vanding/gødning/
      # vejr) fra sensor.plant_overview (publiceret af scripts/plant_notify.py).
    forloeb-dash:
      mode: yaml
      title: Forløb
      icon: mdi:timeline-text-outline
      show_in_sidebar: true
      filename: dashboards/forloeb.yaml
      # 2026-06-27: "dagens forløb" — let læseligt, live-opdaterende overblik
      # over HVORFOR ting tændte/slukkede/gardiner kørte, + live panel der
      # forklarer hvorfor lys forbliver OFF trods bevægelse (aktive blokeringer).
    himmel-dash:
      mode: yaml
      title: Himmel
      icon: mdi:weather-night
      show_in_sidebar: true
      filename: dashboards/sky.yaml
      # 2026-06-16: dedikeret himmel-side (nordlys/planeter/natteskyer) fra
      # sensor.sky_tonight (publiceret af scripts/sky_notify.py kl 21:30 + boot).
    genvex-dash:
      mode: yaml
      title: Genvex
      icon: mdi:fan
      show_in_sidebar: true
      filename: dashboards/genvex.yaml
      # 2026-10-12 (B226): trin-skift vs. fugt — afvigelse fra trin 2-modellen,
      # badets tørretid pr. trin og vurdering af en HA-kobling.
    triggers-dash:
      mode: yaml
      title: Triggers
      icon: mdi:call-split
      show_in_sidebar: true
      filename: dashboards/triggers.yaml
      # 2026-07-03: kurateret statisk oversigt — pr. rum/pære hvad der auto-
      # tænder/slukker/farve-skifter (+ gardiner). Troubleshooting-hjælp.
      # Husdækkende adfærd står ÉN gang øverst. Verificér mod kode med
      # scripts/triggers_scan.py. Standing rule i CLAUDE.md holder den opdateret.
    festlys-dash:
      mode: yaml
      title: Festlys
      icon: mdi:party-popper
      show_in_sidebar: true
      filename: dashboards/festlys.yaml
      # 2026-07-26: dedikeret fest/disko-kontrolpanel — al dance_mode/festlys-
      # kontrol samlet (flyttet fra Lys + Indstillinger): master, hastighed +
      # event-hyppighed (nye sliders), rum-vælger, manuelt event, live-status.

# Logbook & History
logbook:

# 2026-06-18: history-integrationen MANGLEDE (config bruger eksplicitte
# integrationer, ikke default_config). Uden den viste alle history-/statistics-
# graf-kort "History integration disabled" — recorder/LTS kørte fint i
# baggrunden, men frontend-kortene kunne ikke hente data. Letvægt; bruger
# recorderens data + include/exclude nedenfor.
history:

# =============================================================================
# Recorder — DB retention + noise filter (B8.1 audit-runde 17)
# =============================================================================
# purge_keep_days: 30 dage history (user-spec 2026-10-11: "recorderen skal fra
# nu af gemme i 30 dage" — 14 dage var for kort til rutine-analyser som
# putte-længden). DB var 890 MB ved 14 dage → forventet ~1,9 GB; backups vokser
# tilsvarende.
# commit_interval: 5 sek (batched writes for SSD-life).
#
# B8.1 EXCLUDE FILTERS (audit-runde 17):
#   ZHA emit'er konstant LQI/RSSI/last_seen/battery updates der spammer
#   recorder uden brugerværdi. Ekskluder dem for at reducere DB-vaekst med
#   ~40-60% (estimat baseret pa Apollo + Vallhorn + Styrbar device-counts).
#
# Behold: alle lights, switches, sensors med temperatur/humidity/lux/motion,
# scripts, automations, input_*, binary_sensor.*_occupancy, alle node_id'er.
# =============================================================================
recorder:
  purge_keep_days: 30
  commit_interval: 5
  exclude:
    domains:
      - updater  # HA update-checks, ikke historisk vaerdi
    entity_globs:
      # ZHA radio diagnostics — spam, ingen brugerværdi
      - sensor.*_lqi
      # Køkken-skiftenes segment-tracker: én række pr. radar-/lux-flanke.
      - sensor.koekken_skift_segment
      # 2026-10-24: halloween-stemningens lån-stempel — skrives før og efter
      # hvert glimt (~2 rækker/min mens stemningen kører); tracet viser det samme.
      - input_text.halloween_stemning_laan
      - sensor.*_rssi
      - sensor.*_link_quality
      - sensor.*_last_seen
      - sensor.*_signal_strength
      # Battery sensors gemmes via battery_alerts automation; raw timeline ikke noedvendig
      - sensor.*_battery_voltage
      # 2026-10-05: cykel-laderens Third Reality-plug — strøm/spænding/
      # effektfaktor/frekvens/demand bruges ingen steder (~8.200 rækker/døgn).
      # Effekt + energi er omdøbt til entre_cykel_lader_* og rammes ikke.
      - sensor.third_reality_inc_3rspe01044bz_*
      # 2026-10-06: routerens (Sagemcom) hastigheds-/pakke-sensorer poller hvert
      # 30. s = 4 × 2.878 rækker/døgn, nul referencer i repoet. WAN-status
      # (binary_sensor) er ikke ramt og bevarer sin historik.
      - sensor.sagemcom_fast3896_15_*
      # Kamera-shimmens hjerteslag: et skrevet epoch-stempel hvert 60. sek, kun
      # til at skelne "kameraet saa ingen" fra "kameraet kiggede ikke". Kun
      # nu-vaerdien betyder noget — historikken ville vaere 1440 raekker/doegn.
      - sensor.*_kamera_vagt
      # Mosbillede-beskyttelsens solindfalds-geometri foelger sun.sun's egne
      # attributter (~2 opdateringer/min hele dagen) = ~700 raekker/doegn uden
      # brugervaerdi. BESLUTNINGEN er recorded: binary_sensor.mosbillede_sol_rammer
      # + logbook-linjerne baerer dybden i cm.
      - sensor.mosbillede_solindfald_cm
      # Lux-taersklen foelger sun.sun's elevation (skifter hvert 2.-4. min under
      # 15 grader). Afledt af elevation + slider; luk-logbookens linje baerer tallet.
      - sensor.mosbillede_lux_taerskel
      # B227 2026-10-12 (user valgte "b"): sofa-spotsenes ild får pærerne til at
      # melde mellemværdier hvert ~0,5 s under faden — målt 2.400-9.900
      # rækker/t pr. spot, og grupperne gemmer HVER ændring igen (12.100/t
      # hver). Ingen history_stats/statistics læser dem (lys-KPI tæller på
      # binary_sensor.stue_lys_on_effektiv). Læselampen + rum-tilstand gemmes stadig.
      - light.stue_spot_1
      - light.stue_spot_2
      - light.stue_room
      - light.stue_all
      # 15/10: Thread-tegningens topologi (links + LQ) skifter hvert 2. min med
      # ~2 KB attributter; net-historikken bor i sensor.thread_routere_vaek.
      - sensor.thread_topologi
      # Apollo har ~30 entities per device; mange diagnostic
      - sensor.*_uptime
      - sensor.*_wifi_signal
      - sensor.*_esphome_version
      - sensor.*_compile_time
      # I1 fix sprint 2026-05-06: Apollo MSR-2 radar gates emit'er kontinuerligt
      # når person bevæger sig (g0-g8 energy levels). 9 gates × 2 (move+still) ×
      # 5 Apollos = 90 entities × ~10 updates/min ved aktiv presence. Ingen
      # brugbar historik — kun nyttigt under live engineering mode.
      - sensor.*_apollo_g*_move_energy
      - sensor.*_apollo_g*_still_energy
      - sensor.*_apollo_radar_move_energy
      - sensor.*_apollo_radar_still_energy
      - sensor.*_apollo_radar_moving_distance
      - sensor.*_apollo_radar_still_distance
      - sensor.*_apollo_radar_detection_distance
      - sensor.*_apollo_radar_firmware_version
      - sensor.*_apollo_dps310_pressure
      - sensor.*_apollo_co2
      - sensor.*_apollo_ltr390_uv_index
      - sensor.*_apollo_esp_temperature
      # A57 fix audit-3 2026-05-06 PM: I1 filter MISSEDE binary_sensor zone
      # entities der fyrer 596+/2h × 5 Apollos = ~40,000 events/day uden
      # brugbar historik. Restore I1's "30-50% reduction" target.
      - binary_sensor.*_apollo_radar_zone_*_occupancy
      - binary_sensor.*_apollo_radar_moving_target
      - binary_sensor.*_apollo_radar_still_target
      # Audit 2026-05-19: apollo_online flapper paa netvaerksstoej (boern
      # bouncede 9x i 24h trods stabil uptime). Ingen automation bruger
      # _online state — bruger occupancy='unavailable' som proxy.
      - binary_sensor.*_apollo_online
      # B82 2026-08-19g: Apollo'ens onboard-RGB er husets største enkelt-kilde
      # til recorder-churn — 2039 rækker/døgn (køkken) + 1322 (stue), fordi
      # `automation apollo_rgb_varsel_blink` (packages/apollo_rgb_varsel.yaml)
      # toggler on/off hvert 2-3 sek i sekunderne :00-:11 af hvert minut så
      # længe et varsel er aktivt (målt 19-22 + kl. 07). Blinket er BEVIDST
      # (user-bekræftet 08-19) og røres ikke — men dets historik har nul
      # brugerværdi, og churnen gjorde `ha_health.sh noisy` ubrugelig.
      - light.*_apollo_rgb_light
      # A88+A90 fix audit-5 2026-05-12: Apollo temp + lux raw rapporterer
      # 13-decimal float (25.6109313964844) → 2849 writes/day per temp,
      # 945/day per lux. Live state stadig læsbar via state() for real-time
      # automations. Historisk trending via dedikerede snapshot sensors
      # (sove_temperatur, *_lux i packages/sensor_snapshots.yaml) der fyrer
      # per time_pattern (temp/30min, lux/15min).
      - sensor.*_apollo_temperature
      - sensor.*_apollo_lux
      # 2026-07-30: de LED-kompenserede lux-sensorer render på hver
      # kilde-opdatering og arver dermed rå-sensorens skrive-volumen — samme
      # begrundelse, samme exclude. Sove undtages nedenfor (sommer-forsvaret
      # kalibreres mod dens historik).
      - sensor.*_lux_reel
      # Samme kæde: fradrags-sensoren re-renderer hver gang en Apollo-LED eller
      # dens brightness ændrer sig — ren mellemregning, ingen historik-værdi.
      - sensor.apollo_led_lux_fradrag
      # Audit 2026-05-19: "tid siden sidste Styrbar-tryk" sensors bruger now()
      # og skriver ny DB-row ved hvert minut-/time-/dag-step. Ren diagnostik-
      # display til dashboard — ingen automation bruger dem. Ingen historik-værdi.
      - sensor.*_sidste_tryk
    entities:
      # Time/date sensors — der findes ingen brugbar historik i absolut tid
      - sensor.time
      - sensor.date
      - sensor.date_time
      # Audit 2026-06-23: 12.720 state-changes/24h (radar-distance flapper over
      # lægge-zone-tærsklen). Kun brugt som live signal til puttelys-detektion;
      # ingen historik-værdi → ekskluderet for at stoppe DB-bloat.
      - binary_sensor.boern_putte_zone_aktiv
      # NB: sun.sun BEHOLDES — vi vil kunne se "why didn't sunset trigger fire"
      # i logbook. State-changes er kun ~10/dag (above_horizon ↔ below_horizon).
      # A88+A90 fix audit-5: open-plan lux + indoor_temperature_resilient
      # følger Apollo raw (mirror sensors). Trending via snapshots.
      - sensor.indoor_temperature_resilient
      # 2026-09-30b: sensor.open_plan_lux er FJERNET herfra. Den var et råt
      # Apollo-spejl i maj; siden 2026-09-03 er den husets TÆND-GATE for stuen
      # (og loft for køkkenets dagslys-kanal) — og lux-auditten 30/9 kunne ikke
      # bevise hvad gaten sagde, fordi den ikke blev gemt (BACKLOG B-lux-audit).
      # A89 fix audit-5 2026-05-12: history_stats genberegner hver minut →
      # 1441 rows/day per sensor. kids_home binary_sensor følger med
      # (1448/day) via mirror attrs. kids_home er derived signal —
      # Apollo occupancy er autoritativ kilde med fuld transition history.
      - sensor.boern_occupancy_today
      - sensor.boern_occupancy_4h
      - binary_sensor.kids_home
      # A101 fix audit-5 2026-05-12: phone-trackers writer ~440 attribute-only
      # updates/24h (lat/lon flap selv om state = "home" hele dagen). State-
      # historik beholdes via input_boolean.{parent_a,parent_b}_home som er den
      # faktiske presence-sandhed. Raw trackers ekskluderes fra DB.
      - device_tracker.phone_a
      - device_tracker.phone_b
      # Audit 2026-05-19: GPS-fresh template sensors fyrer hvert 2. min via
      # time_pattern (trigger-based = skriv ny row uanset om state ændrede sig).
      # 759+753 = 1512 DB-rows/dag. Operational sensors — ingen historik-værdi.
      # Presence-historik dækkes af input_boolean.{parent_a,parent_b}_home.
      - binary_sensor.parent_a_gps_fresh
      - binary_sensor.parent_b_gps_fresh
      # 2026-10-05 (DB-oprydning, rækker/døgn målt i states): mellemregninger
      # uden historik-værdi. Hus-grupperne: 38 ægte on/off-skift mod ~8.800
      # attribut-rækker hver (gruppens brightness følger medlemmerne) — de
      # bruges kun som kald-mål og i expand(), aldrig som historik.
      - light.alle_lys
      - light.alle_indvendige
      # Dance-mode kalder scriptet pr. pære-event: 12.944 rækker på ÉN
      # dance-time (10-05 17-18), alle attribut-only (last_triggered/current).
      - script.dance_event_bulb
      # Cykel-laderens rå effekt: målerens nulpunkt-støj (0,2-1,7 W med relæet
      # slukket) = ~6.100 rækker/døgn. Live-værdien læses stadig af alt — også
      # Riemann-integrationen, som lytter på state-maskinen, ikke recorderen.
      # HISTORIKKEN står i sensor.cykel_lader_effekt_ren (packages/cykel_lader.yaml).
      - sensor.entre_cykel_lader_effekt
      # A94/A95: Cast integration genfinder FRB Chromecast og ghost-recreater
      # media_player.hyggestue. Disabled_by:user forhindrer ikke state-writes
      # (Cast poller stadig). Recorder-exclude er effektiv suppression.
      - media_player.hyggestue
  # Undtagelser fra exclude ovenfor. HA's entity-filter giver include.entities
  # forrang over exclude.entity_globs (case 4b) — alt andet er uændret.
  include:
    entities:
      # 2026-07-28 (user-spec): soveværelsets lux er nu PRIMÆR-signalet for
      # sommer-forsvarets sove-gardin (azimut kun fallback) → tærsklen skal
      # kunne kalibreres mod ægte historik, ikke kun 15-min-snapshottet
      # sensor.sove_lux. Undtaget sensor.*_apollo_lux-globben. De øvrige
      # Apollo-lux-sensorer forbliver ekskluderede (skrive-volumen).
      - sensor.sovevaerelse_apollo_lux
      # 2026-07-30: sommer-forsvaret (og al anden adfærd) læser nu den
      # LED-kompenserede værdi — så DEN er den historik tærsklen skal
      # kalibreres mod. Rå-sensoren beholdes ovenfor, så LED-offsettene kan
      # genudledes fra historik (rå − reel = LED-bidrag) uden en ny fysisk
      # måling. De øvrige rums _lux_reel forbliver ekskluderede.
      - sensor.sovevaerelse_lux_reel

# Logger for debugging
logger:
  default: warning
  logs:
    homeassistant.components.automation: info

# Mobile App integration — kraevet af Home Assistant Companion app paa
# telefon/tablet. Uden denne linje siger app'en "Mobile App integration is
# required but not available on your server".
mobile_app:

# =============================================================================
# Workday sensor (H2) — danske helligdage
# =============================================================================
# binary_sensor.workday_sensor er on paa hverdage MINUS danske helligdage.
#
# OBS — manuel UI-setup kraevet:
#   Modern HA understoetter ikke laengere workday platform via YAML.
#   Skal sættes op via:
#     Settings -> Devices & Services -> Add Integration -> "Workday"
#     - Country: Denmark
#     - Workdays: mon, tue, wed, thu, fri
#     - Excludes: sat, sun, holiday
#   Det opretter binary_sensor.workday_sensor som arbejdsdag-template
#   refererer i packages/house_modes.yaml.
# =============================================================================
