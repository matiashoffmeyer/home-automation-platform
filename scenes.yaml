# scenes.yaml — INTENTIONELT TOM (kun runtime-created scenes)
# =============================================================================
# Sprint 2026-05-22: 7 forældede statiske scenes slettet:
#   - cirkus_mode, hygge, dagslys, borne_sengetid, middag, morgenlys,
#     voksne_sengetid
# Disse var legacy fra pre-script-arkitektur, 0 refs i kode, viste sig
# bare i HA app's Scener-UI som "out of sync" forvirring overfor
# script-baserede scenes.
#
# Mood/scene-arkitektur i dette projekt:
#   - script.scene_<name> i script_pkg/scenes.yaml = 12 scene-scripts
#     (cinema, zen, sofa_laesning, spisestue_middag, cirkus, party,
#      full_bright, private, blue, happy, sunset, cyberpunk)
#   - input_select.active_scene = dashboard scene-tracker
#   - input_boolean.cinema_active / cirkus_active = mood-mode flags
#     (NB: ikke "scenes" — de er presence/drift-back pause-flags)
#   - scene.entre_somrig_undo_snapshot = runtime-created via scene.create
#     i automations/entre_somrig.yaml (BUND quick/long), ikke defineret her.
#
# `scene:` integration forbliver loaded via configuration.yaml så
# scene.create + scene.turn_on stadig virker for undo_snapshot.
