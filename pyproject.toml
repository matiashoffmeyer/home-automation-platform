# Tooling for the platform's Python: the automation scripts in scripts/, the two
# Home Assistant add-ons in addons/ and the custom integration. Home Assistant
# itself loads the YAML configuration, not this file, and nothing here is
# installed into it. The pinned tool versions are in requirements-dev.txt; the
# commands are the Makefile targets.

[project]
name = "home-automation-platform"
version = "0.1.0"
description = "Event-driven IoT and data automation platform on Home Assistant, built with an AI-native engineering methodology."
license = "Apache-2.0"
# The scripts run in the Home Assistant container (Python 3.14, which also
# provides aiohttp and PyYAML) and otherwise use only the standard library.
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 100
# Modules imported across scripts/ and by the add-on tests (import order).
src = ["scripts", "addons/spotify_bro", "addons/gesture_frame_shim"]

[tool.ruff.format]
# Code blocks in the hand-written docs keep their author's layout.
exclude = ["*.md"]

[tool.ruff.per-file-target-version]
# The add-ons run in their own images, on older interpreters.
"addons/spotify_bro/**" = "py311"         # Debian bookworm
"addons/gesture_frame_shim/**" = "py312"  # Alpine 3.21

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors the formatter cannot fix
    "W",               # whitespace
    "F",               # pyflakes
    "B",               # bugbear
    "UP",              # pyupgrade, against each file's target version
    "I",               # import order
    # bandit: code execution, shell injection and unsafe deserialisation
    "S102", "S301", "S307", "S506", "S602", "S604", "S605", "S608",
]
ignore = [
    "E741",   # `l` is the house idiom for a light entity
    "B905",   # zip(xs, xs[1:]) pairs neighbours and is unequal on purpose
    "UP031",  # %-formatting stays where it is the logging idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests and scripts put their own directory on sys.path before importing.
"**/tests/*.py" = ["E402"]

[tool.mypy]
# Strict typing is enforced module by module; a module joins the list when it
# is fully annotated. The rest is checked by ruff and by its tests.
python_version = "3.14"
strict = true
mypy_path = "scripts"
files = [
    "scripts/ha_secrets.py",
    "scripts/secrets_contract.py",
]

[tool.pytest]
# addons/spotify_bro/tests is an end-to-end script, run by `make test`.
testpaths = ["scripts/tests"]
