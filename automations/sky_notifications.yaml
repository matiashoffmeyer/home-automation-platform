# =============================================================================
# Himmelfænomen-notifikationer — scheduler (2026-06-16)
# =============================================================================
# Kører scripts/sky_notify.py. Helpers + shell_commands i
# packages/sky_notifications.yaml. Se det script for astronomi/dedup-detaljer.
#
#   - 21:30 nightly + kill-switch ON  → fuld scan (publicér sensor + notificér)
#   - 21:30 nightly + kill-switch OFF → kun sensor-refresh (ingen notifikation)
#   - HA-start                        → kun sensor-refresh (så Himmel-siden ikke
#     er tom efter en genstart; notifikation kommer aldrig fra boot)
# =============================================================================

- id: sky_notify_nightly
  alias: "Himmel: tjek nordlys/planeter/natteskyer (21:30)"
  description: >
    Nightly kl 21:30: hvis input_boolean.sky_notify_enabled er ON køres fuld
    scan (sensor.sky_tonight + evt. notifikation til notify.mobile_app_phone_a).
    Er kill-switchen OFF, eller er triggeren HA-start, køres kun en sensor-
    refresh (--no-notify) så dashboardet altid har friske data. Dedup i scriptet
    via /config/.sky_notify_state.json sikrer max én notifikation pr. nat.
  mode: single
  trigger:
    - platform: time
      at: "21:30:00"
      id: nightly
    - platform: homeassistant
      event: start
      id: boot
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: nightly
            - condition: state
              entity_id: input_boolean.sky_notify_enabled
              state: "on"
          sequence:
            - service: shell_command.sky_notify_scan
      default:
        - service: shell_command.sky_notify_refresh

# B228 (2026-10-12): live-vagt. 21:30-prognosen alene missede lørdag 10/10 (Kp 7,
# Ovation 14 %): stormen toppede 17-23 lokal, og met.no lovede 83-98 % skyer
# mens DMI Kastrup målte 0-25 % kl. 22:10-00:00. Hvert kvarter 17-02 tjekker
# scriptet Kp (seneste 3-6 t) + Ovation + mørke NU + observeret skydække og
# sender max én "nordlys NU" pr. nat. Mørke-gaten i scriptet tager sæsonen.
# 36 kørsler/døgn, hver ~4 HTTP-kald (NOAA, DMI, 2× lokal HA).
- id: sky_notify_live
  alias: "Himmel: nordlys-vagt (hvert kvarter 17-02)"
  description: >
    Kører scripts/sky_notify.py --live hvert kvarter mellem 17:00 og 02:00 når
    input_boolean.sky_notify_enabled er ON. Varsler "nordlys NU" når en storm er
    i gang, himlen er mørk nok og DMI måler klart nok — max én gang pr. nat.
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/15"
  condition:
    - condition: state
      entity_id: input_boolean.sky_notify_enabled
      state: "on"
    - condition: time
      after: "17:00:00"
      before: "02:00:00"
  action:
    - service: shell_command.sky_notify_live
