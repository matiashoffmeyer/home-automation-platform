# =============================================================================
# Styrbar transient flag cleanup på HA start
# =============================================================================
# A58 fix audit-3 2026-05-06 PM.
#
# Hvorfor: 18 transient input_booleans sættes ON under Styrbar button-execution:
#   - styrbar_<rum>_lr_holding_* (6 entities)  — set ON ved L/R hold start
#   - styrbar_<rum>_lr_grace_*   (6 entities)  — set ON 2s efter L/R release
#     (sove, stue, boernevaerelse, terrasse, badevaerelse, depot)
#   - styrbar_<rum>_up_holding_* (6 entities)  — set ON ved OP hold start
#
# Depot tilfojet pre-pair 2026-05-20 (afventer faktisk IEEE).
#
# Hvis HA restartes mid-button-press, flag stuck ON i registry. Subsequent
# button-presses blokeres af lr_grace gate eller restart-loop'er aldrig.
#
# Fix: clear alle 18 transient flags 60s post HA-start.
# =============================================================================

- id: styrbar_transient_flag_cleanup
  alias: "Styrbar: Restart-cleanup transient flags (60s post HA start)"
  description: >
    60s efter HA start, force-clear alle styrbar transient flags (holding,
    grace) der kunne være stuck ON fra en mid-press restart. Idempotent —
    skipper sikkert hvis flags already off.
  mode: single
  trigger:
    - platform: homeassistant
      event: start
  action:
    - delay:
        seconds: 60
    - service: input_boolean.turn_off
      target:
        entity_id:
          # 6 lr_holding flags (mid-L/R-hold loop indicator)
          - input_boolean.styrbar_lr_holding_sovevaerelse
          - input_boolean.styrbar_lr_holding_stue
          - input_boolean.styrbar_lr_holding_boernevaerelse
          - input_boolean.styrbar_lr_holding_terrasse
          - input_boolean.styrbar_lr_holding_badevaerelse
          - input_boolean.styrbar_lr_holding_depot
          # 6 lr_grace flags (post-release 2-sec window)
          - input_boolean.styrbar_lr_grace_sovevaerelse
          - input_boolean.styrbar_lr_grace_stue
          - input_boolean.styrbar_lr_grace_boernevaerelse
          - input_boolean.styrbar_lr_grace_terrasse
          - input_boolean.styrbar_lr_grace_badevaerelse
          - input_boolean.styrbar_lr_grace_depot
          # 6 up_holding flags (mid-OP-hold indicator)
          - input_boolean.styrbar_up_holding_sovevaerelse
          - input_boolean.styrbar_up_holding_stue
          - input_boolean.styrbar_up_holding_boernevaerelse
          - input_boolean.styrbar_up_holding_terrasse
          - input_boolean.styrbar_up_holding_badevaerelse
          - input_boolean.styrbar_up_holding_depot
    - service: logbook.log
      data:
        name: "Styrbar restart-cleanup"
        message: "Cleared 18 transient styrbar flags (post HA-start safety)"
