# =============================================================================
# Daglig HA full-backup (J1)
# =============================================================================
# Hver nat kl 02:00 oprettes et fuldt HA-snapshot. Snapshots gemmes lokalt
# i /backup paa NUC.
#
# Hvorfor: hvis NUC HDD doer, mister vi alt — automations + paired devices
# + recorder DB + .storage. Med daglig backup er recovery 10 min:
#   1. Ny NUC + fresh HAOS
#   2. Restore fra backup (uploadet manuelt eller via cloud-sync)
#
# OBS: dette gemmer KUN paa selve NUC. For ekstern backup (Nabu Casa cloud,
# Google Drive, NAS) kraeves separat sync — se TODO note i bunden.
#
# Retention: HA holder default 5 backups, sletter aeldste automatisk.
# =============================================================================

- id: daily_full_backup
  alias: "Backup: Dagligt HA full-snapshot kl 02:00"
  description: >
    Kalder backup.create_automatic hver nat. Modern Backup integration
    håndterer både retention + sensor-state-tracking automatisk.
    F4 fix sprint 2026-05-06 (Blok F.4): replaced legacy hassio.backup_full
    der ikke opdaterede backup_*_automatic_backup sensors (de stod "unknown").
  mode: single
  trigger:
    - platform: time
      at: "02:00:00"
  action:
    # F4 fix Blok F.4: backup.create_automatic er den moderne API. Den
    # opdaterer sensor.backup_last_successful_automatic_backup +
    # _last_attempted_automatic_backup + _next_scheduled_automatic_backup
    # automatisk. Ingen data: parameters — config sættes via UI:
    #   Settings -> System -> Backups -> Settings (gear ikon)
    # Default retention: 1 backup. Sat til 7 dage via UI.
    - service: backup.create_automatic
      continue_on_error: true
    # Wait kort saa fil-system kan opdatere
    - delay:
        seconds: 30
    - service: persistent_notification.create
      data:
        notification_id: backup_status
        title: "Backup attempted"
        message: >
          HA full-backup via backup.create_automatic kl {{ now().strftime('%H:%M %d-%m-%Y') }}.
          Verificer via diagnostik dashboard (Backup status section) eller
          sensor.backup_last_successful_automatic_backup.

