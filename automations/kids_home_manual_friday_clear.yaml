# =============================================================================
# Kids Home Manual — auto-clear hver fredag 10:00
# =============================================================================
# User-spec 2026-05-17:
#   "manual kids are home overwrite i HA appen skal cleares om fredagen kl. 10am"
#
# RATIONALE: input_boolean.kids_home_manual er en sticky manuel override —
# user toggler ON hvis kids er hjemme men Apollo har ikke detected motion
# (sygedag, baby napping all day, etc). Uden auto-clear forbliver flagged
# on indtil user manuelt slukker → glemmes ofte → false-positive kids_home
# i dage/uger derefter.
#
# Fredag 10:00 = sensible reset time:
#   - Weekday morning routine færdig (skole/daginstitution = kids er væk)
#   - Hvis kids er hjemme fredag morgen (sygedag), Apollo har detected motion
#     → binary_sensor.kids_home auto-detection holder ved
#   - Reset hver uge sikrer flag ikke linger maaneder ad gangen
# =============================================================================

- id: kids_home_manual_friday_clear
  alias: "Kids: Manual override auto-clear (fredag 10:00)"
  description: >
    Slukker BEGGE manuelle kids_home-overrides (force-on + force-off) hver
    fredag kl 10:00 hvis on. Sticky-overrides skal ikke linger mere end en uge —
    auto-detection overtager via binary_sensor.kids_home heuristics.
  mode: single
  trigger:
    - platform: time
      at: "10:00:00"
  condition:
    # Kun fredage (isoweekday 5 = fredag)
    - condition: template
      value_template: "{{ now().isoweekday() == 5 }}"
    # Kun fyr hvis mindst én override aktiv (ellers no-op log noise)
    - condition: template
      value_template: >-
        {{ is_state('input_boolean.kids_home_manual', 'on')
           or is_state('input_boolean.kids_home_manual_off', 'on') }}
    # Skip AirBnB — gæster bruger ikke kids_home flag
    - condition: state
      entity_id: input_select.house_mode
      state: "Normal"
  action:
    - service: logbook.log
      data:
        name: "Kids manual override clear"
        message: >-
          Fredag 10:00 reset af kids_home manuelle overrides (force-on +
          force-off). Auto-detection (binary_sensor.kids_home heuristics)
          overtager. Toggle back on hvis nødvendigt.
    # 2026-06-13: clear begge — force-on (kids_home_manual) OG force-off
    # (kids_home_manual_off, "børn er IKKE hjemme").
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.kids_home_manual
          - input_boolean.kids_home_manual_off
