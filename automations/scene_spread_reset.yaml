# =============================================================================
# Scene Spread Reset + Auto-Apply — reactor for spread_level changes
# =============================================================================
# 2 automations:
#   1. scene_spread_reset_on_change: nulstil level=0 ved scene-skift
#   2. scene_spread_auto_apply: re-apply scene når level ændres (driver
#      numeric-input stepper på dashboard tile)
#
# Loop-protection: input_number.set_value til SAMME value emitter ikke
# state-event → reactor fyrer ikke. apply_scene_with_spread sætter level
# til samme target som blev kaldt → no loop.
# =============================================================================

- id: scene_spread_reset_on_change
  alias: "Scene spread: nulstil level når scene skiftes"
  description: >
    State-trigger på active_scene. Sætter scene_spread_level=0 så ny scene
    starter rent (epicenter only). Reactor (auto_apply) re-applikerer som
    bivirkning og rydder evt. rings fra forrige scene.
  mode: restart
  trigger:
    - platform: state
      entity_id: input_select.active_scene
  condition:
    - condition: template
      value_template: >
        {{ states('input_number.scene_spread_level') | int(0) != 0 }}
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.scene_spread_level
      data:
        value: 0

- id: scene_spread_auto_apply
  alias: "Scene spread: auto-apply når level ændres"
  description: >
    Reactor for spread_level state-change. Driver numeric-input stepper
    på dashboard tile uden separate +/- scripts. Skip hvis active_scene
    ikke understøtter spread (no-op).
  mode: restart
  trigger:
    - platform: state
      entity_id: input_number.scene_spread_level
  condition:
    - condition: template
      value_template: >
        {{ states('input_select.active_scene') in
           ['zen', 'sofa_laesning', 'spisestue_middag', 'madlavning'] }}
  action:
    - service: script.apply_scene_with_spread
      data:
        scene: "{{ states('input_select.active_scene') }}"
        spread_level: "{{ states('input_number.scene_spread_level') | int(0) }}"
