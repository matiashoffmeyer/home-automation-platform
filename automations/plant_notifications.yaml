# =============================================================================
# Plante-notifikationer — poll-trigger (2026-06-15)
# =============================================================================
# Kører scripts/plant_notify.py som henter plante-arket og sender forfaldne
# notifikationer. Helpers + shell_command defineret i
# packages/plant_notifications.yaml. Se det script for dedup/format-detaljer.
# =============================================================================

- id: plant_notify_poll
  alias: "Plante: tjek sheet for forfaldne notifikationer"
  description: >
    Kører scripts/plant_notify.py én gang i døgnet kl 08:00 (+ ved HA-start for
    at indhente forpassede). Scriptet sender to slags notifikationer:
    (1) GØDNING — én samlet besked med alle planter der er forfaldne efter
    sæson-frekvensen; ukvitteret (ingen ✅ Gødet) = samme besked igen næste
    morgen, højst én pr. dag (arkets 'Sidst Gødet' bruges ikke), og (2) VEJR-ADVARSLER (meget regn / varmt+solrigt på vej) fra
    met.no-forecast. Vanding pushes ikke — den vises kun på Planter-siden.
    Dedup i scriptet via /config/.plant_notify_state.json. Pause via
    input_boolean.plant_notify_enabled.
  mode: single
  trigger:
    # Dag-basis: én daglig poll. Tidspunkterne i arket er ligegyldige — 08:00 er
    # blot leverings-tid for dagens plante-påmindelser; skift frit.
    - platform: time
      at: "08:00:00"
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.plant_notify_enabled
      state: "on"
  action:
    - service: shell_command.plant_notify_scan
