# =============================================================================
# Sove Apollo — boost reporting frequency morning 06:00-07:30
# =============================================================================
# Sprint 2026-05-21: user-spec — sove Apollo reduce_db_reporting toggles OFF
# 06:00 og ON igen 07:30. Inden for vinduet sender chippen lux/temp/radar
# updates oftere → fast_morning_off (lux>25 + still_target=off + morning)
# reagerer hurtigere når user træk gardiner fra eller forlader rum.
#
# Hvorfor begrænset til 06:00-07:30:
#   - Wake-up vinduet er typisk 05:55-07:30 (wakeup_alarm_driven + slider)
#   - Resten af dagen er throttled rapporter fine (lavere ESP/network load)
#   - Hyppigere reports = mere chip-aktivitet = potentiel thermal stress
#     (se B12/B17 + Standing Instruction om Apollo chip-wear)
#
# Value-comparison condition (chip-wear protection per CLAUDE.md):
#   - Toggle KUN hvis current state ikke matcher mål → undgår no-op writes
#     der spammer ESPHome NVRAM på tværs af HA restarts og lignende.
#
# Recorder context: sensor.*_apollo_lux ER allerede recorder-excluded
# (A88/A90 fix audit-5 2026-05-12), så DB-bloat fra hyppigere lux-pushes
# er ikke et problem — live state stadig læsbar af automations.
# =============================================================================

- id: sove_apollo_db_reporting_morning_off
  alias: "Sove Apollo: DB reporting OFF (06:00 — morning responsiveness)"
  description: >
    06:00 daglig — slå reduce_db_reporting OFF for sove Apollo så lux/temp/
    radar opdateres hyppigere i wake-up vinduet. Skip hvis allerede off
    (no-op protection mod chip-wear), eller hvis AirBnB-mode.
  mode: single
  trigger:
    - platform: time
      at: "06:00:00"
  condition:
    - condition: state
      entity_id: switch.sovevaerelse_apollo_reduce_db_reporting
      state: "on"
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.house_mode
          state: "AirBnB"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.sovevaerelse_apollo_reduce_db_reporting
    - service: logbook.log
      data:
        name: "Sove Apollo"
        message: "DB reporting OFF — morning responsiveness vindue åbent (06:00-07:30)"

- id: sove_apollo_db_reporting_morning_on
  alias: "Sove Apollo: DB reporting ON (07:30 — post wake-up)"
  description: >
    07:30 daglig — slå reduce_db_reporting tilbage ON. Spare ESP/network
    traffic resten af dagen. Skip hvis allerede on (no-op protection).
  mode: single
  trigger:
    - platform: time
      at: "07:30:00"
  condition:
    - condition: state
      entity_id: switch.sovevaerelse_apollo_reduce_db_reporting
      state: "off"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.sovevaerelse_apollo_reduce_db_reporting
    - service: logbook.log
      data:
        name: "Sove Apollo"
        message: "DB reporting ON — post wake-up vindue lukket"
