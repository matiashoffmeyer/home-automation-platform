# =============================================================================
# Apollo Safety Switches — auto-off engineering_mode + ld2410_bluetooth
# =============================================================================
# Sprint 2026-05-19: defensive hardening per CLAUDE.md standing instruction
# "Engineering mode + Bluetooth = ALDRIG ON i drift". Both modes keep the
# LD2410 streaming gate-energies continuously / running BLE radio, which
# heats the ESP and adjacent sensor chips. Suspected contributor to the
# LTR390 + DPS310 failures (B12, B17).
#
# Grace: 10 min. Long enough for a deliberate calibration session, short
# enough that an accidental toggle in HA UI doesn't cook the chip for hours.
# All 5 Apollos covered — 3 unavailable per B14 (stue/spisestue/bad
# unplugged pre-flyt), automation no-ops on those until they come online.
# =============================================================================

- id: apollo_safety_engineering_mode_autoff
  alias: "Apollo: Auto-off engineering mode after 10 min grace"
  description: >
    Force engineering_mode OFF 10 min after it goes on. Engineering mode
    streams all 18 gate-energies continuously = high ESP load + chip heat.
  mode: parallel
  max: 10
  trigger:
    - platform: state
      entity_id:
        - switch.stue_apollo_radar_engineering_mode
        - switch.spisestue_apollo_radar_engineering_mode
        - switch.koekken_apollo_radar_engineering_mode
        - switch.sovevaerelse_apollo_radar_engineering_mode
        - switch.boernevaerelse_apollo_radar_engineering_mode
      to: "on"
      for:
        minutes: 10
  action:
    - service: switch.turn_off
      target:
        entity_id: "{{ trigger.entity_id }}"
    - service: logbook.log
      data:
        name: "Apollo safety"
        message: >-
          Forced OFF {{ trigger.entity_id }} after 10 min grace
          (engineering mode = high chip wear, see CLAUDE.md).

- id: apollo_safety_bluetooth_autoff
  alias: "Apollo: Auto-off LD2410 Bluetooth after 10 min grace"
  description: >
    Force ld2410_bluetooth OFF 10 min after it goes on. BLE radio = constant
    RF work + ESP heat. Only needed during HLKRadarTool BLE pairing sessions.
  mode: parallel
  max: 10
  trigger:
    - platform: state
      entity_id:
        - switch.stue_apollo_ld2410_bluetooth
        - switch.spisestue_apollo_ld2410_bluetooth
        - switch.koekken_apollo_ld2410_bluetooth
        - switch.sovevaerelse_apollo_ld2410_bluetooth
        - switch.boernevaerelse_apollo_ld2410_bluetooth
      to: "on"
      for:
        minutes: 10
  action:
    - service: switch.turn_off
      target:
        entity_id: "{{ trigger.entity_id }}"
    - service: logbook.log
      data:
        name: "Apollo safety"
        message: >-
          Forced OFF {{ trigger.entity_id }} after 10 min grace
          (BLE radio = chip heat, see CLAUDE.md).
