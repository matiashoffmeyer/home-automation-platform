# =============================================================================
# Flagermus-venlig terrasse — ekstra-dim + curfew (user-spec 2026-07-18)
# =============================================================================
# To tid-lag oven på den eksisterende dusk-auto-on (som er dæmpet i
# terrace_plug_control.yaml når flagermus_enabled ON). Se header i
# packages/flagermus_terrasse.yaml for hele 3-fase-modellen.
#
# BEGGE automations TÆNDER ALDRIG kæden selv — de rører kun en allerede tændt
# kæde. Manuel tænd (Styrbar/app) er bevidst fri (user-valg); dæmp/curfew er
# auto-flagermus-beskyttelse, og brugeren kan altid tænde igen bagefter (den
# eksisterende nat-manuel-hold beskytter en manuel gen-tænd resten af natten).
#
# Gated til house_mode Normal: i AirBnB styrer gæsten terrassen (+ AirBnB-zen
# holder den allerede på 5 %), og AirBnB skal ikke have ekstra auto-indgreb.
# =============================================================================

# --- 1) Ekstra-dim fra dim-tid (default 22:30) → "ekstremt dim i hvert fald" ---
- id: flagermus_ekstra_dim
  alias: "Flagermus: ekstra-dæmp pærelyskæde fra dim-tid"
  description: >
    Ved flagermus_ekstra_dim_tid dæmpes en tændt pærelyskæde til
    flagermus_ekstra_dim_pct. Tænder ikke selv; gælder kun flagermus-mode + Normal.
  mode: single
  trigger:
    - platform: time
      at: input_datetime.flagermus_ekstra_dim_tid
  condition:
    - condition: state
      entity_id: input_boolean.flagermus_enabled
      state: "on"
    - condition: state
      entity_id: input_select.house_mode
      state: "Normal"
    - condition: state
      entity_id: light.terrasse_paerelyskaede
      state: "on"
    # 2026-07-25 (user-spec): gæste-aften suspenderer flagermus-lagene —
    # se packages/gaesteaften.yaml (incident 07-24).
    - condition: state
      entity_id: binary_sensor.gaester_for_nylig
      state: "off"
  action:
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.terrasse_paerelyskaede
      data:
        brightness_pct: >-
          {{ states('input_number.flagermus_ekstra_dim_pct') | int(5) }}
        transition: 5
    - service: logbook.log
      data:
        name: "Flagermus dim"
        message: >-
          Pærelyskæden dæmpet til flagermus-niveau (ekstra-dim-tid nået).

# --- 2) Curfew (user sætter selv) → hård sluk = totalt mørke resten af natten ---
- id: flagermus_curfew_off
  alias: "Flagermus: curfew hård sluk af pærelyskæden"
  description: >
    Ved flagermus_curfew_tid slukkes pærelyskæden helt (totalt mørke for
    flagermus). Kun flagermus-mode + Normal. Manuel gen-tænd bagefter er fri.
  mode: single
  trigger:
    - platform: time
      at: input_datetime.flagermus_curfew_tid
  condition:
    - condition: state
      entity_id: input_boolean.flagermus_enabled
      state: "on"
    - condition: state
      entity_id: input_select.house_mode
      state: "Normal"
    # 2026-07-25 (user-spec): gæste-aften suspenderer curfew — 07-24 slukkede
    # den kl. 23:00 mens gæsterne sad på terrassen. Se packages/gaesteaften.yaml.
    - condition: state
      entity_id: binary_sensor.gaester_for_nylig
      state: "off"
  action:
    - service: light.turn_off
      continue_on_error: true
      target:
        entity_id: light.terrasse_paerelyskaede
      data:
        transition: 5
    - service: logbook.log
      data:
        name: "Flagermus curfew"
        message: >-
          Pærelyskæden slukket (flagermus-curfew — totalt mørke resten af natten).
