# =============================================================================
# Vinter-forsvar (Winter Defense)
# =============================================================================
# TEMP-KILDE (2026-07-19, user-spec): alle temp-gates i denne fil bruger
#   UDENDØRS vejr-temp fra met.no (sensor.udetemp = anker over
#   weather.forecast_home, se packages/dmi_weather.yaml). DMI's 2m-temp blev
#   prøvet men dens nøgle-løse endpoint 429-fejler ~konstant → user-valg: met.no.
#   IKKE indendørs TIMMERFLOTTE — "der bliver aldrig så koldt indenfor, væggene
#   er moderne 56cm tykke". Tunable via winter_heating_season_temp (default 12°C,
#   fyrings-sæson) + winter_cold_snap_temp (default -6°C, ekstrem frost).
#
# TWO modes:
#
# DORMANT tier: Close all curtains to position 20 (80% closed) to retain
#   heat when nobody is home and it's cold OUTSIDE (< heating-season slider).
#   Plants still get some light through the 20% opening.
#   Reopens when house returns to Active (house_state_to_active).
#
# SOLAR GAIN tier (Active OG Dormant, B324 21/11): koldt UDE + sol på
#   sydfacaden i 5 min (binary_sensor.sydfacade_direkte_sol, målt i
#   soveværelset) → stue syd helt op for gratis solvarme; 30 min uden sol eller
#   sol < 3° → ned igen (Active 50 %, Dormant 20 %). Active: ikke under film
#   (cinema, Dark Mode, pre-dark) eller cirkus. Stopper under sommer-forsvarets
#   inde-tærskel (ellers åbn/luk-pendul i forårssol).
# =============================================================================

- id: winter_defense_close
  alias: "Vinter-forsvar: Rul gardiner ned ved Dormant"
  description: >
    Close curtains to 80% when Dormant and cold. B6.3 fix sprint 2026-05-06:
    per-room lux check så vi ikke lukker rum der er sun-blasted (= solar gain
    ønsket selv ved Dormant). Kun close hvis rummet faktisk er kold-zone (lav lux).
  mode: single
  trigger:
    - platform: state
      entity_id: input_select.house_state
      to: "Dormant"
      for:
        minutes: 2
    # B324: også ved solnedgang — sove-gardinet (sol-øjet) og syd i sol springes
    # over i dagslys; solnedgangen lukker dem.
    - platform: state
      entity_id: sun.sun
      from: "above_horizon"
      to: "below_horizon"
  condition:
    - condition: state
      entity_id: input_select.house_state
      state: "Dormant"
    # Ferie-batterispar (2026-07-18): pauset efter langvarig dvale, se
    # packages/gardin_dormant_pause.yaml. Slås til igen ved hoveddør-åbning.
    - condition: state
      entity_id: input_boolean.gardin_dormant_pause_active
      state: "off"
    # 2026-10-04 (B123, user-valg): vinter-forsvaret er FAMILIE-logik. Indtil
    # nu blev det holdt ude af AirBnB af åbne-tæppet i `held`; luk-vejene læser
    # nu `held_luk` (uden tæppet), så valget står her eksplicit.
    - condition: state
      entity_id: input_select.house_mode
      state:
        - "Normal"
        - "Home Vacation"
    # UDENDØRS temp fra vejrudsigten (2026-07-19, user-spec): indendørs bliver
    # aldrig så koldt (56cm mure) → indendørs-gaten var reelt død. Fyrings-sæson
    # = udendørs < slider (default 12°C). unavailable → false = ingen luk (#9).
    - condition: numeric_state
      entity_id: sensor.udetemp
      below: input_number.winter_heating_season_temp
  action:
    # ⚠️ 2026-09-20: DISSE KALD HAR ALDRIG VIRKET på de tre Somfy-gardiner.
    # cover.set_cover_position kræver feature-bittet SET_POSITION, og
    # template-coverne havde ingen set_cover_position-action → HA sprang dem
    # tavst over, og `continue_on_error: true` slugte sporet. Somfy-gardinerne
    # har altså IKKE deltaget i vinter-forsvaret indtil nu. De har fået en
    # timet set_cover_position (packages/broadlink_gardiner.yaml), så kaldene
    # her virker fra i dag — inkl. den fulde optur hver delvis position starter
    # med. Bemærk at position 20 på syd nu koster ~45 s kørsel.
    # `position: 20` er kun et LUK for et gardin der står højere end 20 — står
    # det på 0, ÅBNER det 20 %. Derfor skal manuelt-ned-holdte gardiner springes
    # over her på præcis samme måde som i winter_active_dark_close nedenfor;
    # ellers er denne automation en auto-åbner i forklædning (fejlklasse #12:
    # beskyttelsen sad kun på den ene af to søster-automations). LUK-listen
    # `held_luk` (B123) — AirBnB holdes ude af mode-gaten nedenfor, ikke af
    # åbne-tæppet i `held`.
    # 2026-09-29 (bug-hunt): held dækker kun MANUELT nedrullede gardiner — et
    # gardin aftenluk/winter_active_dark_close har lukket helt stod ikke i den,
    # så Dormant efter mørkefald åbnede det 20 %. Nu springes ethvert gardin
    # der allerede står ≤ 20 over; ukendt position (open-plan efter restart) →
    # som før.
    - variables:
        held: "{{ state_attr('sensor.gardiner_manual_hold', 'held_luk') | default([]) }}"
    # === Stue gardiner: 80% close hvis stue er kold + ikke sol-blast ===
    - if:
        - condition: numeric_state
          entity_id: sensor.open_plan_lux
          below: 8000
      then:
        - service: cover.set_cover_position
          continue_on_error: true
          target:
            entity_id: >
              {% set ns = namespace(l=[]) %}
              {% set sol = is_state('binary_sensor.sydfacade_direkte_sol', 'on')
                 and is_state('input_boolean.winter_solar_enabled', 'on') %}
              {% from 'rosters.jinja' import open_plan_gardiner %}{% for e in open_plan_gardiner
                           if e not in held and not (sol and e == 'cover.gardin_stue_syd') %}
              {% set p = state_attr(e, 'current_position') %}
              {% if p is none or (p | float(100)) > 20 %}{% set ns.l = ns.l + [e] %}{% endif %}
              {% endfor %}
              {{ ns.l }}
          data:
            position: 20
    # === Sove gardin: 80% close kun hvis sove er dim ===
    # Sove-vinduet er SYD-vendt (user-bekræftet 2026-07-28) — samme side som
    # stue syd. Per-room lux gate på rummets egen LTR390.
    - if:
        - condition: numeric_state
          entity_id: sensor.sovevaerelse_lux_reel
          below: 5000
        # B324: sove-gardinet er sol-øjet — bliver oppe fra morgen til solnedgang.
        - condition: template
          value_template: >-
            {{ not (state_attr('sun.sun', 'rising')
                    or state_attr('sun.sun', 'elevation') | float(0) > 0) }}
      then:
        - service: cover.set_cover_position
          continue_on_error: true
          target:
            entity_id: >
              {% set p = state_attr('cover.gardin_sovevaerelse', 'current_position') %}
              {{ ['cover.gardin_sovevaerelse'] | reject('in', held) | list
                 if p is none or (p | float(100)) > 20 else [] }}
          data:
            position: 20
    # B324: syd blev stående i solen → flaget, så winter_solar_gain_close ruller ned.
    - if:
        - condition: template
          value_template: >-
            {{ is_state('binary_sensor.sydfacade_direkte_sol', 'on')
               and is_state('input_boolean.winter_solar_enabled', 'on') }}
      then:
        - service: input_boolean.turn_on
          target:
            entity_id: input_boolean.winter_solar_active
    - service: notify.persistent_notification
      data:
        title: "Vinter-forsvar aktiveret"
        message: >
          Gardiner evalueret per-room (Dormant, ude {{ states('sensor.udetemp') }}°C).
          Stue/spisestue: {{ states('sensor.open_plan_lux') }} lux.
          Sove: {{ states('sensor.sovevaerelse_lux_reel') }} lux.

# Re-open is NOT needed here. When house goes Active, the
# house_state_to_active automation opens all curtains.

# =============================================================================
# Active + rigtig mørkt UDE + koldt → luk gardiner (gulv-kuldestrøm-forsvar)
# =============================================================================
# User-spec 2026-07-19: "vinterforsvar gardiner skal også aktiveres i Active når
# det er rigtig mørkt udenfor (slider bestemmer sol-vinkel — genbrug den
# eksisterende) — så beskytter vi mod kuldestrøm ved gulvet."
#
# SOL-VINKEL GENBRUGT: binary_sensor.natlys_sol_under_graense (sol <
#   input_number.natlys_sol_elevation, default -6° = civil tusmørke-slut =
#   genuint mørkt) — samme slider som natlys/auto-tænd. Ingen egen slider.
#   (natlys-signalet er REN sol-position, aldrig lux → fyrer IKKE på en mørk
#   stormfuld dag, kun når solen faktisk er nede = "rigtig mørkt".)
#
# LUK-POSITION (user-valg): helt lukket (0) for max luft-lomme mod ruden —
#   UNDTAGEN stue-vest (position 20 = 80% luk) fordi der står noget under den
#   der ikke må rammes.
#
# rising==false-gate: sol er negativ BÅDE ved daggry og skumring. Vi lukker KUN
#   i skumrings→nat-fasen (rising false) så vi ALDRIG kæmper mod morning_curtains/
#   wakeup der åbner i daggry-fasen (rising true). Genåbning ejes helt af
#   morgen-rutinerne (open-plan: morning_curtains; sove/boern: wakeup) → ingen
#   reopen-automation her (spejler Dormant-close, som house_state_to_active åbner).
#
# EDGE-triggers (ingen periodisk backstop = ingen morgen-fight): sove-aftenluk-
#   flanken (2026-11-05, samme tid som soveværelset) + hjemkomst-i-mørke
#   (house_state→Active, kun før godnat; rører ikke gardiner Dormant har lukket)
#   + godnat-knappen (også når prognosen siger koldt i nat). Kulde-flanken er
#   fjernet: den fyrede kun på met.no-recovery midt om natten (støj).
# unavailable udetemp → numeric-condition false = ingen luk (#9). Manuelt åbnede
#   gardiner respekteres via gardiner_manual_hold (samme reject-mønster som solar).
# AirBnB: kører IKKE (user-valg 2026-10-04, B123 — kun sove-aftenluk lukker i
#   AirBnB); eksplicit house_mode-gate. Ingen mobil-push her.
# =============================================================================

- id: winter_active_dark_close
  alias: "Vinter: Luk gardiner ved mørkt+koldt (Active)"
  description: >
    Active + aften (sove-aftenluk-vinduet eller sol < natlys_sol_elevation) +
    koldt UDE (sensor.udetemp < winter_heating_season_temp) → luk gardiner
    (stue-vest 80%, resten helt) mod gulv-kuldestrøm. Lukker samtidig med
    sove-gardinet eller på godnat-knappen hvis den kommer før — aldrig senere
    om natten (støj, user-spec 2026-11-05).
  mode: single
  trigger:
    # 2026-11-05 (user-spec): "winter gardiner om natten larmer når de kører
    # ned. de skal enten køre ned tidligere (f.eks. samtidig med soveværelset)
    # eller når jeg trykker godnat knap hvis det er tidligere end soveværelset
    # ville gå ned." → luk SAMMEN med sove-aftenluk (solnedgang + slider), og
    # på godnat-knappen. Kulde-flanken (udetemp < tærskel) er FJERNET: den
    # fyrede kun på met.no's recovery fra unavailable, og det skete midt om
    # natten (3/11 21:29, 4/11 22:35). udetemp har nu DMI-reserve, så skumrings-
    # tjekket ikke længere falder i et hul.
    - platform: state
      entity_id: binary_sensor.sove_gardin_aftenluk_vindue
      from: "off"
      to: "on"
      id: aften
    # 21/11: kulden kom EFTER vinduet (udetemp 5,2 → 4,2 kl. 16:46, vinduet åbnede
    # 16:24) → ankeret gik on uden en trigger, og stue syd stod oppe hele aftenen
    # (#4). Ankerets egen flanke re-armer; filteret på position gør en dobbelt-
    # fyring i samme sekund som vinduet harmløs.
    - platform: state
      entity_id: binary_sensor.vinter_aftenluk_gaeldende
      from: "off"
      to: "on"
      id: aften
    # Hjemkomst i mørke: huset bliver Active mens det allerede er mørkt+koldt
    # (kun før godnat — se condition nedenfor).
    - platform: state
      entity_id: input_select.house_state
      to: "Active"
      id: hjem
    # Godnat-knappen (Somrig kort/lang ned, widget): script.godnat_fuld stempler
    # godnat_force_at — ingen andre skriver det, så auto-godnat (folk ligger
    # allerede i sengen) fyrer IKKE denne vej.
    - platform: state
      entity_id: input_datetime.godnat_force_at
      not_from: ["unknown", "unavailable"]
      not_to: ["unknown", "unavailable"]
      id: godnat
  condition:
    - condition: state
      entity_id: input_boolean.winter_active_dark_close_enabled
      state: "on"
    # 2026-10-04 (B123, user-valg): vinter-forsvaret er FAMILIE-logik. Indtil
    # nu blev det holdt ude af AirBnB af åbne-tæppet i `held`; luk-vejene læser
    # nu `held_luk` (uden tæppet), så valget står her eksplicit.
    - condition: state
      entity_id: input_select.house_mode
      state:
        - "Normal"
        - "Home Vacation"
    - condition: state
      entity_id: input_select.house_state
      state: "Active"
    # Ingen gardin-støj efter godnat: kun godnat-trykket selv må lukke, når
    # godnat er aktiv (hjemkomst/aften-flanken efter godnat = folk sover).
    - condition: or
      conditions:
        - condition: trigger
          id: godnat
        - condition: state
          entity_id: input_boolean.godnat_voksne_active
          state: "off"
    # Aften + koldt + skumrings-fase bor i ÉT anker (packages/vinter_aftenluk.yaml),
    # som hjemkomstens gardin-åbning også læser (#2). Godnat-trykket må lukke
    # uden ankeret: aften (vindue/natlys) + 12-04 (`rising` vender ved
    # sol-midnat ~00:45) — om det bliver koldt i nat afgøres i action'en.
    - condition: or
      conditions:
        - condition: state
          entity_id: binary_sensor.vinter_aftenluk_gaeldende
          state: "on"
        - condition: and
          conditions:
            - condition: trigger
              id: godnat
            - condition: template
              value_template: >-
                {{ (is_state('binary_sensor.sove_gardin_aftenluk_vindue', 'on')
                    or is_state('binary_sensor.natlys_sol_under_graense', 'on'))
                   and (now().hour >= 12 or now().hour < 4) }}
  action:
    # Helt lukket (0) undtagen stue-vest (20 = 80%, noget står under den).
    # Manuelt-ned-holdte gardiner springes over (gardiner_manual_hold — den
    # holder også sove mens putning_sove_active er on).
    # Godnat-tryk en aften hvor det (endnu) ikke er koldt: luk hvis met.no's
    # timeprognose går under fyrings-tærsklen inden for 12 t (user-spec
    # 2026-11-05: "luk på godnat-knappen de aftener hvor det ser ud til at
    # blive koldt"). met.no nede (B295) → ingen prognose → nu-temp (DMI-
    # reserve) afgør alene. `stop` — en condition i en if-gren stopper kun grenen.
    - if:
        - condition: state
          entity_id: binary_sensor.vinter_aftenluk_gaeldende
          state: "off"
      then:
        - if:
            - condition: template
              value_template: "{{ states('weather.forecast_home') not in ['unavailable', 'unknown'] }}"
          then:
            - service: weather.get_forecasts
              continue_on_error: true
              data:
                type: hourly
              target:
                entity_id: weather.forecast_home
              response_variable: fc
            - variables:
                prognose_min: >-
                  {% set hrs = (fc | default({})).get('weather.forecast_home', {}).get('forecast', []) %}
                  {% set lim = now() + timedelta(hours=12) %}
                  {% set ns = namespace(m=none) %}
                  {% for h in hrs if (h.datetime | as_datetime(none)) is not none
                                    and (h.datetime | as_datetime) <= lim
                                    and h.temperature is not none %}
                    {% set ns.m = h.temperature | float if ns.m is none else [ns.m, h.temperature | float] | min %}
                  {% endfor %}
                  {{ ns.m if ns.m is not none else 99 }}
            - if:
                - condition: template
                  value_template: >-
                    {{ prognose_min | float(99) >= states('input_number.winter_heating_season_temp') | float(12)
                       and states('sensor.udetemp') | float(99) >= states('input_number.winter_heating_season_temp') | float(12) }}
              then:
                - stop: "Ikke koldt i nat ifølge prognosen"
          else:
            - if:
                - condition: template
                  value_template: >-
                    {{ states('sensor.udetemp') | float(99) >= states('input_number.winter_heating_season_temp') | float(12) }}
              then:
                - stop: "Ingen prognose og ikke koldt nu"
    - variables:
        held: "{{ state_attr('sensor.gardiner_manual_hold', 'held_luk') | default([]) }}"
        # Hjemkomst: Dormant har allerede lukket til 20 (winter_defense_close),
        # og velkomsten ruller dem ikke op mens ankeret er on → kun gardiner
        # Dormant sprang over (sol-blast, ferie-pause) lukkes; 20 → 0 er støj.
        graense: "{{ 20 if trigger is defined and trigger.id == 'hjem' else 0 }}"
    # 2026-11-05: gardiner der allerede står på/under målet springes over
    # (samme mønster som winter_defense_close) — ellers kørte hjemkomst og
    # godnat-tryk dem op og ned igen (timet position = fuld optur først), og
    # godnat_fuld lukker selv sove-gardinet i samme sekund. Ukendt position
    # (open-plan efter restart) → med som før.
    - service: cover.set_cover_position
      continue_on_error: true
      target:
        entity_id: >
          {% set ns = namespace(l=[]) %}
          {% for e in ['cover.gardin_stue_syd', 'cover.gardin_spisestue_vest',
                       'cover.gardin_sovevaerelse'] if e not in held %}
          {% set p = state_attr(e, 'current_position') %}
          {% if p is none or (p | float(100)) > graense | int(0) %}{% set ns.l = ns.l + [e] %}{% endif %}
          {% endfor %}
          {{ ns.l }}
      data:
        position: 0
    - service: cover.set_cover_position
      continue_on_error: true
      target:
        entity_id: >
          {% set p = state_attr('cover.gardin_stue_vest_1', 'current_position') %}
          {{ ['cover.gardin_stue_vest_1'] | reject('in', held) | list
             if p is none or (p | float(100)) > 20 else [] }}
      data:
        position: 20
    - service: notify.persistent_notification
      data:
        title: "Vinter-forsvar: mørkt+koldt luk (Active)"
        message: >
          Rigtig mørkt ude (sol < {{ states('input_number.natlys_sol_elevation') }}°)
          + koldt ({{ states('sensor.udetemp') }}°C) → gardiner lukket mod
          gulv-kuldestrøm. Stue-vest 80% (noget står under), resten helt.

# =============================================================================
# Sol-opvarmning: syd-gardinet op når solen står på sydfacaden (Active + Dormant)
# =============================================================================
# B324 (user-spec 21/11): "dormant vinterforsvar [skal lukke] gardiner op hvis
# solen skinner ind af et vindue og kan varme huset op". Den gamle Active-tier
# (open_plan_lux 500-7000) var DØD: ingen open-plan-måler ser solen (maks 306 lx
# på 3 døgn til 21/11; sprint 21/11), så den fyrede aldrig. Begge tilstande
# læser nu sydfacade_direkte_sol. Simuleret mod 31 døgn: åbn 5 / luk 30 min =
# 25 cyklusser, maks 2 pr. dag, 146 sol-min misset. Flaget winter_solar_active =
# "vi åbnede det" → kun da ruller lukket ned igen (ikke Somrig/morgen-åbninger).
# Flaget ryddes IKKE længere ved Dormant-entry: et syd vi åbnede i Active skal
# også ned igen i et tomt hus (dvale-pausen ville ellers holde det oppe hele
# natten).

- id: winter_solar_gain_open
  alias: "Vinter: Sol-opvarmning (syd-gardin åbner)"
  description: >
    B324: fyringssæson UDE + sol på sydfacaden i 5 min → stue syd helt op, i
    Active og Dormant. Ikke i kuldebølge, ikke i AirBnB, ikke over sommer-
    forsvarets inde-tærskel; Active: ikke under film/cirkus. Respekterer
    dvale-pausen og hold-ankerets åbn-liste. Re-arm: house_state, HA-start,
    /10 (#4).
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.sydfacade_direkte_sol
      from: "off"
      to: "on"
      for:
        minutes: 5
    - platform: state
      entity_id: input_select.house_state
      to:
        - "Active"
        - "Dormant"
      for:
        minutes: 3
    - platform: homeassistant
      event: start
    - platform: time_pattern
      minutes: "/10"
  condition:
    - condition: state
      entity_id: input_boolean.winter_solar_enabled
      state: "on"
    # Ingen auto-gardin-OP i AirBnB (user undtagelse 3, 2026-06-30).
    - condition: state
      entity_id: input_select.house_mode
      state:
        - "Normal"
        - "Home Vacation"
    - condition: state
      entity_id: input_boolean.gardin_dormant_pause_active
      state: "off"
    # Sommer-forsvaret lukker syd på INDE-temperaturen (Dormant
    # summer_defense_temp_threshold, Active summer_defense_active_temp_threshold),
    # mens denne åbner på UDE-temperaturen → i forårssol uden denne gate
    # pendulerede de hvert 10. min. Inde unavailable → åbn ikke (#9).
    - condition: template
      value_template: >-
        {% set s = states.binary_sensor.sydfacade_direkte_sol %}
        {% set u = states('sensor.udetemp') | float(none) %}
        {% set inde = states('sensor.indoor_temperature_resilient') | float(none) %}
        {% set hs = states('input_select.house_state') %}
        {% set sommer = states('input_number.summer_defense_temp_threshold' if hs == 'Dormant'
                               else 'input_number.summer_defense_active_temp_threshold') | float(none) %}
        {% set film = is_state('input_boolean.cinema_active', 'on')
                      or is_state('input_boolean.cirkus_active', 'on')
                      or is_state('input_boolean.predark_active', 'on')
                      or (is_state('input_boolean.dark_mode', 'on')
                          and not is_state('input_boolean.dark_mode_kun_sove', 'on')) %}
        {% set p = state_attr('cover.gardin_stue_syd', 'current_position') %}
        {% set held = state_attr('sensor.gardiner_manual_hold', 'held') | default([], true) %}
        {{ hs in ['Active', 'Dormant']
           and (hs == 'Dormant' or not film)
           and s is not none and s.state == 'on'
           and now() - s.last_changed >= timedelta(minutes=5)
           and now() - states.input_select.house_state.last_changed >= timedelta(minutes=3)
           and u is not none
           and u < states('input_number.winter_heating_season_temp') | float(-99)
           and u >= states('input_number.winter_cold_snap_temp') | float(99)
           and inde is not none and sommer is not none and inde < sommer
           and 'cover.gardin_stue_syd' not in held
           and (p is none or p | float(0) < 100) }}
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.winter_solar_active
    - service: cover.open_cover
      continue_on_error: true
      target:
        entity_id: cover.gardin_stue_syd

- id: winter_solar_gain_close
  alias: "Vinter: Sol-opvarmning slut (syd-gardin lukker)"
  description: >
    B324: modstykket — 30 min uden sol på sydfacaden (målt også fra flagets
    seneste skift, #29) eller sol under 3° → syd ned: Dormant 20 %, Active 50 %
    (kun i fyringssæson; mildt → bliver hvor det er). Kun nedad, aldrig en
    åbning (AirBnB). Ignorerer dvale-pausen med vilje (ét luk, som mosbillede-
    lukket). Sydfacade unavailable tæller som ingen sol (#9). Flaget ryddes
    altid (B61).
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.sydfacade_direkte_sol
      from: "on"
      to: "off"
      for:
        minutes: 30
    - platform: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: 3
    - platform: homeassistant
      event: start
    - platform: time_pattern
      minutes: "/10"
  condition:
    - condition: state
      entity_id: input_boolean.winter_solar_active
      state: "on"
    # Film i Active: Dark Mode/projektor ejer gardinet nu; rulles ned efter
    # filmen (næste /10), hvis solen stadig er væk.
    - condition: template
      value_template: >-
        {% set s = states.binary_sensor.sydfacade_direkte_sol %}
        {% set f = states.input_boolean.winter_solar_active %}
        {% set sidst = s.last_changed if s is not none else f.last_changed %}
        {% set film = is_state('input_boolean.cinema_active', 'on')
                      or is_state('input_boolean.predark_active', 'on')
                      or (is_state('input_boolean.dark_mode', 'on')
                          and not is_state('input_boolean.dark_mode_kun_sove', 'on')) %}
        {{ not (is_state('input_select.house_state', 'Active') and film)
           and (state_attr('sun.sun', 'elevation') | float(0) < 3
                or ((s is none or s.state != 'on')
                    and now() - sidst >= timedelta(minutes=30)
                    and now() - f.last_changed >= timedelta(minutes=30))) }}
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.winter_solar_active
    - variables:
        maal: "{{ 20 if is_state('input_select.house_state', 'Dormant') else 50 }}"
    - service: cover.set_cover_position
      continue_on_error: true
      target:
        entity_id: >
          {% set held = state_attr('sensor.gardiner_manual_hold', 'held_luk') | default([], true) %}
          {% set p = state_attr('cover.gardin_stue_syd', 'current_position') %}
          {% set fyring = states('sensor.udetemp') | float(99)
                          < states('input_number.winter_heating_season_temp') | float(-99) %}
          {{ ['cover.gardin_stue_syd'] | reject('in', held) | list
             if (maal | int == 20 or fyring) and (p is none or (p | float(100)) > maal | int) else [] }}
      data:
        position: "{{ maal }}"

# =============================================================================
# K1: Kuldeboelge-override — noed-luk syd-gardin ved EKSTREM UDENDOERS frost
# =============================================================================
# User-valg 2026-07-19: syd-gardinet er TYNDT → luk giver kun lidt varme-
# retention, mens solar gain (gratis sol-varme) hjaelper mere. Derfor har SOL
# hoej prioritet: kuldeboelge-luk fyrer KUN ved ekstrem udendoers frost
# (sensor.udetemp fra met.no < winter_cold_snap_temp, default -6°C i 30 min) — IKKE
# paa normale kolde-men-solrige vinterdage, hvor solen vinder. Temp-kilden er
# UDENDOERS vejrudsigt: med 56cm mure bliver det aldrig koldt nok INDE til at
# gaten var meningsfuld (user-spec) — den gamle indoor-proxy var reelt doed.
#
# BEVIDST edge (fejlklasse #4): flanke-triggeren fyrer ikke hvis udetemp
# ALLEREDE er < taersklen naar solar-gain aabner (ingen frisk flanke). Det
# ACCEPTERES her — sol har prioritet, saa "luk ikke" er den oenskede adfaerd.
#
# solar_active-flag slukkes foer luk saa solar_gain_close ikke ruller det op
# til 20/50 bagefter. Kan fyre i dvale (B324: flaget lever nu i Dormant) — et
# luk, saa ferie-gardin-pausen brydes kun i lukke-retningen.
# =============================================================================

- id: winter_cold_snap_force_close
  alias: "Vinter: Kuldeboelge override (force luk uanset solar)"
  description: >
    Ekstrem udendoers frost: hvis sensor.udetemp (met.no) < slider
    (default -6°C) i 30 min trods aaben syd-gardin → noed-luk syd. Syd-gardinet
    er tyndt, saa sol prioriteres normalt (se header) — kun genuin frost
    overruler. 2026-07-19: udendoers vejr-temp erstatter den doede indoor-proxy
    (56cm mure → aldrig koldt nok inde).
  mode: single
  trigger:
    # UDENDØRS vejr-temp (2026-07-19, user-spec): ekstrem frost < slider (default
    # -6°C). for:30min på en numeric_state TRIGGER er sustained-sikkert også for
    # en analog sensor (HA tæller kontinuerlig-sand internt, ikke via last_changed
    # → ikke fejlklasse #14). unavailable → ingen flanke = ingen force-luk (#9).
    - platform: numeric_state
      entity_id: sensor.udetemp
      below: input_number.winter_cold_snap_temp
      for:
        minutes: 30
  condition:
    - condition: state
      entity_id: input_boolean.winter_solar_active
      state: "on"
  action:
    # Sluk solar-flag foer luk saa solar_gain_open ikke fyrer igen
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.winter_solar_active
    - service: cover.close_cover
      target:
        entity_id: cover.gardin_stue_syd
    - service: persistent_notification.create
      data:
        notification_id: cold_snap_override
        title: "Kuldeboelge: solar-gain stoppet"
        message: >
          Udendoers temp faldt til {{ states('sensor.udetemp') }}°C
          (ekstrem frost) trods aaben syd-gardin. Force-lukket for at holde paa varmen.
