# =============================================================================
# Climate Control
# =============================================================================
# Notifikationer mute'es i guest_mode + evening (19-07) saa de ikke popper
# op midt i selskab. "Børneværelse for koldt" + "Lejlighed for varm" er
# undtaget evening-mute (faktisk akut info der ikke kan vente).
#
# 2026-05-05: humidity-automations (climate_bathroom_humidity_high +
# climate_bathroom_post_shower) er FJERNET. Apollo MSR-2 har kun DPS310
# (temp + pressure), ingen humidity sensor. Bruger har valgt at droppe
# humidity-monitoring helt — ikke vaerd at koebe separat sensor for.
# =============================================================================

# --- Apartment cold: persistent notification ---
# IKKE muted — kolde boern kan ikke sove, akut nok til at fyre under selskab.
# 2026-07-16 (user-spec): Apollo-temps kan IKKE stoles på → kilde skiftet til
# TIMMERFLOTTE (eneste troværdige temp; 2026-10-15: via
# sensor.indoor_temperature_resilient med depotets Broadlink som reserve,
# sd 0,26 °C). Børneværelset har ingen egen
# troværdig sensor, så varslet er nu lejligheds-niveau (tærskel 18 uændret).
- id: climate_kids_room_cold
  alias: "Klima: Lejlighed for kold"
  description: >
    Alert when apartment drops below input_number.klima_kold_graense
    (default 18°C, TIMMERFLOTTE). Akut nok til at
    fyre uanset guest_mode/aften — kolde boern er ikke noget at vente med.
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: sensor.indoor_temperature_resilient
      below: input_number.klima_kold_graense
      for:
        minutes: 30
  action:
    # Sprint D.13 fix audit 2026-05-07: continue_on_error matcher resten af
    # codebase notification-pattern.
    - service: notify.persistent_notification
      continue_on_error: true
      data:
        title: "Lejlighed: For kold"
        message: >
          Inde-temperaturen er nede på
          {{ states('sensor.indoor_temperature_resilient') }}°C
          — Child A og Child B sover for koldt.

# --- Apartment hot: persistent notification ---
# IKKE muted — overophedning kan vaere safety issue (sommer-hede),
# fyrer uanset guest_mode.
- id: climate_apartment_hot
  alias: "Klima: Lejlighed for varm"
  description: >
    Alert when apartment exceeds input_number.klima_varm_graense
    (default 27°C). Akut safety-info (sommer-hede,
    risiko for boern) — fyrer uanset guest_mode eller aften.
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: sensor.indoor_temperature_resilient
      above: input_number.klima_varm_graense
      for:
        minutes: 10
  action:
    # Sprint D.13 fix audit 2026-05-07: continue_on_error
    - service: notify.persistent_notification
      continue_on_error: true
      data:
        title: "Varmeadvarsel: {{ states('sensor.indoor_temperature_resilient') }}°C"
        message: >
          Lejligheden er oppe på {{ states('sensor.indoor_temperature_resilient') }}°C
          ({{ 'skønnet fra depotet' if state_attr('sensor.indoor_temperature_resilient', 'kilde') == 'depot' else 'køkkenet' }}).
          Overvej at åbne vinduer mod nord/øst.
