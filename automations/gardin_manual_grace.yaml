# =============================================================================
# Gardin manuel-ned grace — detektor (2026-06-18)
# =============================================================================
# Helpers + hold-sensor + script: packages/gardin_manual_grace.yaml
#               + script.gardin_mark_manual_down (script_pkg/house_routines.yaml)
#
# Denne automation fanger MANUELLE app/dashboard-luk: en bruger der trykker
# luk på en gardin-tile kalder cover.close_cover direkte → state-ændringen bærer
# et context.user_id. Auto-luk (godnat/forsvar/scener/sluk_alt) har INTET
# user_id. RODRET-knap-luk stemples direkte i somrig-handlerne (en knap er
# heller ikke en bruger-session, så den ville ellers slippe igennem).
#
# 2026-07-30: rettet fra `parent_id is none`. context.parent_id sættes KUN når
# automationen selv blev trigget af en anden context — en tids-/numeric_state-
# trigget automation (sommer-/vinterforsvar, putning, 18:00-luk) har parent_id
# = None præcis som en bruger. Bevist i recorder: sommer-forsvarets luk 07-30
# 12:45 gav parent=NULL/user=NULL på BÅDE `closing` og `closed` → begge sydlige
# gardiner blev stemplet "manuelt nede" og auto-op var blokeret 120 min. Det
# ramte brugeren: sove-gardinet kunne ikke rulles op igen om eftermiddagen.
#
# Hvorfor OGSÅ `closing`: sove-gardinet er Zigbee og melder sin SLUT-tilstand
# (`closed`) selv, i en frisk context uden user_id — brugerens aftryk findes
# kun på `closing`-flanken. Somfy-gardinerne er optimistiske template-covers
# uden `closing` og stemples derfor på `closed`. Begge veje er dækket, og et
# bruger-luk stempler kun én gang (den anden flanke har intet user_id).
# =============================================================================

- id: gardin_manual_down_detect
  alias: "Gardiner: Detektér manuel ned (app/dashboard)"
  description: >
    Stempler manuel-ned når et gardin lukkes direkte fra app/dashboard (cover→
    closing/closed MED context.user_id). Starter grace-vinduet (slider, default
    120 min) hvor auto-op-kald springer gardinet over. Auto-luk har intet
    user_id → ignoreres.
  mode: queued
  max: 10
  trigger:
    - platform: state
      entity_id: !include ../rosters/alle_gardiner.yaml
      to:
        - "closing"
        - "closed"
  condition:
    # Kun direkte bruger-handling: user_id sættes af app/dashboard/stemme-kald.
    # Automationer, scripts og scener kører uden user_id — uanset trigger-type.
    - condition: template
      value_template: "{{ trigger.to_state.context.user_id is not none }}"
  action:
    - service: script.gardin_mark_manual_down
      data:
        cover: "{{ trigger.entity_id }}"
