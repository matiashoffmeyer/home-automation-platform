# =============================================================================
# Stuens sofa-zone — lamperne omkring sofaen (IKKE spots, IKKE spisestuen)
# =============================================================================
# Bruges som `entity_id: !include ../rosters/stue_sofa_lys.yaml` i scenerne
# (script_pkg/scenes.yaml) og som `sofa_lights: !include …` i stue-presence
# (presence_stue.yaml, presence_lights.yaml). Før 2026-10-04 stod listen ordret
# 14 steder (fejlklasse #16). Jinja-forbrugere importerer den fra
# custom_templates/rosters.jinja (genereret: python3 scripts/rosters.py jinja).
# sofa_lampe/_2/hjoernelampe er pærer i et skab, bevidst bevaret (B132).
# Forbrugere: grep -rn "rosters/stue_sofa_lys" .   (konsolidering P2)
# Kun '- domæne.entity'-linjer (scripts/rosters.py læser filen fladt).
# =============================================================================
- light.stue_sofa_lampe
- light.stue_sofa_lampe_2
- light.stue_hjoernelampe
- light.stue_plug   # ikke-dæmpbar plug-hyggelampe (kun on/off)
- light.stue_laesehygge   # sofa-læselampen: Innr RB 282 C farvepære (CT + farve; målt 2026-10-04)
