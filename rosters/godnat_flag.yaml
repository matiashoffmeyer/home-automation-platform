# =============================================================================
# Godnat-flag-sættet — ALLE flag der ryddes samlet når natten slutter
# =============================================================================
# Bruges som `entity_id: !include ../rosters/godnat_flag.yaml` på hver
# `input_boolean.turn_off`, der afslutter natten: godmorgen, vækning (alarm,
# voksne), dormant-overgange, AirBnB-natmode og husrutinerne. Før 2026-10-04 stod
# listen ordret 20 steder (fejlklasse #16).
# Nyt godnat-flag → tilføj det HER, og det ryddes alle steder.
# Forbrugere: grep -rn "rosters/godnat_flag" .   (konsolidering P2)
# Kun '- domæne.entity'-linjer (scripts/rosters.py læser filen fladt).
# =============================================================================
- input_boolean.godnat_active
- input_boolean.godnat_boern_active
- input_boolean.godnat_voksne_active
- input_boolean.godnat_pending
- input_boolean.kalde_active
