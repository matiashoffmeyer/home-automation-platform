# =============================================================================
# Husets 8 occupancy-øjne — "den kanoniske 8-sensor-occupancy-roster"
# =============================================================================
# Ét øje pr. rum (open-plan filtreret, bad samlet, sove/børn rå Apollo, depot/entré
# Valhorn). Bruges af dvale-/afgangs-triggerne i house_modes.yaml og wasp_in_a_box.
# Jinja-forbrugere (activity_state, parent_b_ios_geofence, house_modes ×3,
# people_estimate, roborock_dormant_godkend, wasp_in_a_box) importerer fra
# rosters.jinja; activity_state/people_estimate tæller kun. BEVIDSTE varianter:
# badevaerelse_bruser_vagt (uden badet), sofa_hygge_aktivitet (terrasse for stue),
# dormant_schedule/departure_dormant (sove = dvale-vidnet). Nyt rum → HER.
# Forbrugere: grep -rn "rosters/husets_occupancy" .   (konsolidering 2026-10-10, batch 3)
# Kun '- domæne.entity'-linjer (scripts/rosters.py læser filen fladt).
# =============================================================================
- binary_sensor.stue_apollo_occupancy_filtered
- binary_sensor.spisestue_apollo_occupancy_filtered
- binary_sensor.koekken_apollo_occupancy_filtered
- binary_sensor.badevaerelse_inde_occupancy
- binary_sensor.sovevaerelse_apollo_occupancy
- binary_sensor.boernevaerelse_apollo_occupancy
- binary_sensor.depot_valhorn_occupancy
- binary_sensor.entre_valhorn_occupancy
